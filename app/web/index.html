<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    Replaced by the `--base-href` argument of `flutter build web` (default "/", docs/18 §6.7).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="개발 역량을 키우는 개인 학습 코치">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DevPilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DevPilot</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E40AF">

  <!-- Keeps the install prompt until the app shows its install card (docs/02 §8.2). -->
  <script src="pwa_install.js"></script>
</head>
<body>
  <!--
    CSP (docs/07 §9.4): no inline scripts. The app starts from the external flutter_bootstrap.js.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
