# source: 06 §5.3 "개념 읽기 선택", rows: 8
# 공통: 3번 분기(READING)로 내려온 상태(planning K=0, I=0, AI 가능, challenge·코드 읽기 후보 없음), 트랙 JAVA_BACKEND.
# conceptReadings는 registry에 등록된 개념 읽기다(은퇴한 것 포함). 후보 거르기(완료·최근 14 plan-day 제안·은퇴)는
# ConceptReadingSelection이 하고, 고르기는 TaskProposalPolicy가 한다.
# proposedDaysAgo는 오늘 기준 plan-day 차이다 — 13이면 창 안(제외), 14면 창 밖(다시 후보).
vectors:
  - id: C-1
    case: 후보 2개, 이력 없음 → key ASC 첫 번째
    skill: DEVOPS.GIT
    conceptReadings:
      - { key: DOC.GIT.REBASING.001, skill: DEVOPS.GIT, estimated: 25 }
      - { key: DOC.GIT.BRANCHING.001, skill: DEVOPS.GIT, estimated: 25 }
    completed: []
    proposed: []
    expected: { readingKey: DOC.GIT.BRANCHING.001, estimated: 25, difficulty: 1 }
  - id: C-2
    case: COMPLETED한 개념 읽기는 다시 제안하지 않는다
    skill: DEVOPS.GIT
