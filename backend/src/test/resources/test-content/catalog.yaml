# 테스트 전용 소형 catalog (docs/09 §4.2). 운영 content/와 따로 두고 test profile의 devpilot.content.location이 가리킨다.
# 규칙은 운영과 같다(docs/19 §4): python content/tools/validate_content.py backend/src/test/resources/test-content 가 PASS여야 한다.
catalogVersion: 1
files:
  skillTrees:
    - skill-tree/test.yaml
  roleTargets:
    - role-targets/test.yaml
    - role-targets/test-starter.yaml
    - role-targets/test-integration.yaml
  planTemplates:
    - plan-templates/test.yaml
    - plan-templates/test-starter.yaml
    - plan-templates/test-integration.yaml
  reviewCards:
    - review-cards/test.yaml
  challenges:
    - challenges/test.yaml
  lessons:
    - lessons/test.yaml
  curatedSources: curated-sources.yaml
  curatedRepos: curated-repos.yaml
  conceptReadings: concept-readings.yaml
diagnosticCategories: [JAVA]
retired:
  skillCodes: []
  challengeSeedKeys: []
  conceptKeys: []
  curatedSourceIds: []
  # 코드 읽기(READ.*)와 개념 읽기(DOC.*)가 한 목록을 같이 쓴다 (19 §3.1, CV-120)
  readingKeys: [READ.TESTREPO.LEGACY_CONTROLLER.001, DOC.TESTJAVA.LEGACY.001]
