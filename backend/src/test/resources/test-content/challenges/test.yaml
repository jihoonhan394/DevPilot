# 테스트 challenge — PRACTICE 와 DIAGNOSTIC (docs/19 §3.6).
# DIAGNOSTIC 은 category 상한(5개) 정렬을 시험하려고 6개 category 를 덮는다 (docs/05 §4.2 1단계).
challenges:
- seedKey: PRACTICE.SPRING.TRANSACTION.L2.001
  purpose: PRACTICE
  skills:
  - SPRING.TRANSACTION
  difficulty: 2
  estimatedMinutes: 25
  isTransfer: false
  title: 주문 저장 트랜잭션 경계
  scenario: '주문을 저장한 뒤 재고를 줄이는 서비스에서 재고 감소가 실패해도 주문이 남는다는 신고가 들어왔다.

    두 작업은 같은 서비스 클래스의 서로 다른 메서드에서 실행된다.'
  prompt: '1. 주문이 남는 원인을 찾으세요.

    2. 두 작업이 함께 커밋되거나 함께 롤백되도록 고치세요.

    3. 왜 그렇게 고쳤는지 설명하세요.'
  constraints:
  - 새 인프라를 추가하지 않는다
  expectedConcepts:
  - 트랜잭션 경계
  - 프록시 내부 호출
  rubric:
  - id: R1
    criterion: 두 작업을 한 트랜잭션 경계 안으로 옮긴다
    weightBp: 5000
    axis: IMPLEMENTATION
  - id: R2
    criterion: 내부 호출이 프록시를 우회한다는 원인을 설명한다
    weightBp: 5000
    axis: EXPLANATION
  commonMistakes:
  - 내부 호출 메서드에만 애노테이션을 붙인다
  transferTargets: []
  hints:
    QUESTION_ONLY: 재고 감소가 실패하는 순간 주문 저장은 어느 범위 안에서 실행되고 있을까요?
    CONCEPT_HINT: 선언적 트랜잭션이 어디에서 시작되고 같은 클래스 안의 호출이 어떻게 처리되는지 떠올려 보세요.
    DIRECTION: 트랜잭션이 시작되는 위치를 호출 흐름에서 찾고 두 작업이 그 범위 안에 들어오게 구조를 바꿔 보세요.
