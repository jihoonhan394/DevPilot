    2. 그 테스트가 무엇을 확인하는지 이름으로 드러내세요.

    3. 고친 뒤 그 테스트가 통과하는 것을 보이세요.'
  constraints:
  - 테스트를 지우거나 약하게 만들지 않는다
  expectedConcepts:
  - 실패하는 테스트 먼저
  - 경계 조건
  rubric:
  - id: R1
    criterion: 고치기 전에 실패하는 테스트를 만든다
    weightBp: 6000
    axis: IMPLEMENTATION
  - id: R2
    criterion: 테스트 이름이 확인하는 조건을 드러낸다
    weightBp: 4000
    axis: EXPLANATION
  commonMistakes:
  - 고친 뒤에 통과하는 테스트만 쓴다
  transferTargets: []
  hints:
    QUESTION_ONLY: 지금 이 버그를 드러내려면 어떤 상태에서 무엇을 호출해야 할까요?
    CONCEPT_HINT: 테스트가 먼저 실패해야 그 테스트가 무엇을 지키는지 알 수 있습니다.
    DIRECTION: 배송이 시작된 주문을 만들고 취소를 호출했을 때의 결과를 단언해 보세요.
