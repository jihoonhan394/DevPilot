validation.TIMEZONE_INVALID=지원하지 않는 시간대입니다. Asia/Seoul 같은 지역 이름을 써 주세요.
validation.SKILL_CODE_UNKNOWN=알 수 없는 skill입니다.
validation.DATE_ORDER_INVALID=시작일이 종료일보다 늦을 수 없습니다.
validation.DATE_OUT_OF_RANGE=허용 범위를 벗어난 날짜입니다.
validation.DUPLICATE_VALUE=중복된 값이 있습니다.
validation.ONE_OF_REQUIRED=둘 중 하나 이상이 필요합니다.
validation.MUTUALLY_EXCLUSIVE=함께 보낼 수 없는 값입니다.
validation.VALUE_NOT_ALLOWED=이 요청에서는 허용하지 않는 값입니다.
validation.MILESTONE_NOT_IN_PLAN=이 계획에 없는 milestone입니다.
validation.REFERENCE_NOT_FOUND=참조한 항목을 찾을 수 없습니다.
validation.NOT_BLANK_IF_PRESENT=값이 있으면 공백만으로 이루어질 수 없습니다.
validation.SKILL_NOT_IN_PLAN=이 계획에 없는 skill입니다.
validation.TARGET_NOT_REDUCED=새 목표가 현재 목표보다 낮아야 합니다.
validation.TARGET_NOT_RAISED=새 목표는 현재 목표보다 높고 5 이하여야 합니다.
validation.ACTUAL_MINUTES_EXCEEDS_ELAPSED=실제 학습 시간이 지난 시간보다 너무 깁니다.
validation.DATE_RANGE_TOO_LONG=조회 기간이 너무 깁니다.
