# DevPilot 사용자 문구 (한국어). 기준: docs/05-api-spec.md §1.2, §1.3
# error.<CODE> = ProblemDetail detail, validation.<code> = FieldError message
error.VALIDATION_FAILED=입력값을 확인해 주세요.
error.UNKNOWN_ENUM_VALUE=지원하지 않는 값이 포함되어 있습니다.
error.MALFORMED_REQUEST=요청 형식이 올바르지 않습니다.
error.IDEMPOTENCY_KEY_REQUIRED=Idempotency-Key 헤더가 필요합니다.
error.INVALID_CURSOR=목록 위치 정보가 올바르지 않습니다. 처음부터 다시 조회해 주세요.
error.AUTHENTICATION_REQUIRED=로그인이 필요합니다.
error.USER_NOT_ALLOWED=이 서비스를 사용할 수 있는 계정이 아닙니다.
error.FORBIDDEN=이 작업을 수행할 권한이 없습니다.
error.RECENT_LOGIN_REQUIRED=보안을 위해 다시 로그인한 뒤 5분 안에 시도해 주세요.
error.RESOURCE_NOT_FOUND=요청한 항목을 찾을 수 없습니다.
error.LEARNING_GOAL_NOT_FOUND=학습 목표가 없습니다. 먼저 목표를 설정해 주세요.
error.PLAN_NOT_FOUND=학습 계획을 찾을 수 없습니다.
error.TODAY_NOT_GENERATED=오늘 계획이 아직 없습니다.
error.ONBOARDING_REQUIRED=먼저 온보딩을 완료해 주세요.
error.ONBOARDING_ALREADY_COMPLETED=온보딩을 이미 완료했습니다.
error.ACTIVE_PLAN_EXISTS=이미 진행 중인 학습 계획이 있습니다.
error.PLAN_NOT_ACTIVE=현재 계획이 아니어서 변경할 수 없습니다. 최신 계획을 다시 불러와 주세요.
error.TODAY_ALREADY_STARTED=오늘 과제를 이미 시작했습니다. 새로 만들려면 다시 만들기를 선택해 주세요.
error.TODAY_ALREADY_COMPLETED=오늘 핵심 과제를 이미 완료했습니다. 추가 과제가 필요하면 다시 만들기를 선택해 주세요.
error.SELF_EXPLANATION_REQUIRED=먼저 내 생각을 적거나 건너뛰기를 선택해 주세요.
error.HINT_CONFIRMATION_REQUIRED=이 단계의 힌트를 보면 학습 증거 판정에 반영됩니다. 확인한 뒤 다시 요청해 주세요.
error.FULL_EXAMPLE_NOT_ALLOWED=전체 예시는 한 번 이상 제출했거나 포기를 선택한 뒤에 볼 수 있습니다.
error.SUBMISSION_LIMIT_REACHED=이 시도의 제출 횟수를 모두 사용했습니다.
error.EVALUATION_IN_PROGRESS=이전 제출을 평가하는 중입니다. 평가가 끝난 뒤 다시 시도해 주세요.
error.AI_TASK_NOT_RETRYABLE=이 작업은 다시 시도할 수 없는 상태입니다.
error.REVIEW_ALREADY_CLOSED=이미 완료한 코드 리뷰입니다.
error.INVALID_STATE_TRANSITION=현재 상태에서는 이 작업을 할 수 없습니다.
error.CONCURRENT_MODIFICATION=다른 곳에서 먼저 변경되었습니다. 최신 내용을 불러온 뒤 다시 시도해 주세요.
error.IDEMPOTENCY_IN_PROGRESS=같은 요청을 처리하고 있습니다. 잠시 후 다시 시도해 주세요.
error.CONTENT_TOO_LARGE=입력 내용이 너무 깁니다. 허용 크기 안으로 줄여 주세요.
error.REQUEST_TOO_LARGE=요청 크기가 허용 범위를 넘었습니다.
error.IDEMPOTENCY_KEY_REUSED=같은 요청 키가 다른 요청에 사용되었습니다. 새로 시도해 주세요.
error.SECRET_DETECTED_BLOCKED=개인 키(private key)가 포함되어 있어 저장하지 않았습니다. 키를 지운 뒤 다시 시도해 주세요.
error.AI_DAILY_LIMIT_EXCEEDED=오늘 AI 사용 한도를 모두 사용했습니다. 복습과 계획은 계속 사용할 수 있습니다.
error.AI_MONTHLY_BUDGET_EXCEEDED=이번 달 AI 예산을 모두 사용했습니다. 복습과 계획은 계속 사용할 수 있습니다.
error.AI_CONCURRENCY_LIMIT=진행 중인 AI 작업이 있습니다. 끝난 뒤 다시 시도해 주세요.
error.RATE_LIMITED=요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.
error.AI_OUTPUT_INVALID=AI 응답을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.
error.AI_REFUSED=AI가 이 요청을 처리하지 않았습니다. 내용을 바꿔 다시 시도해 주세요.
error.AI_UNAVAILABLE=AI 기능을 잠시 사용할 수 없습니다. 복습과 계획은 그대로 사용할 수 있습니다.
error.AI_UNAVAILABLE.BALANCE_EXHAUSTED=AI 잔액이 소진되었습니다. 복습과 계획은 그대로 사용할 수 있습니다.
error.AI_TIMEOUT=AI 응답이 늦어 요청을 끝내지 못했습니다. 잠시 후 다시 시도해 주세요.
error.INTERNAL_ERROR=일시적인 오류가 발생했습니다. 문제가 계속되면 traceId와 함께 알려 주세요.

# Bean Validation (docs/05 §1.2.3). {min}, {max}, {value} 는 annotation 속성으로 치환한다
validation.NotNull=값이 필요합니다.
validation.NotBlank=비어 있을 수 없습니다.
validation.NotEmpty=비어 있을 수 없습니다.
validation.Size={min}자 이상 {max}자 이하여야 합니다.
validation.Min={value} 이상이어야 합니다.
validation.Max={value} 이하여야 합니다.
validation.Pattern=형식이 올바르지 않습니다.
validation.AssertTrue=조건을 만족해야 합니다.
validation.UniqueElements=중복된 값이 있습니다.
validation.URL=올바른 URL이 아닙니다.
validation.Email=올바른 이메일 주소가 아닙니다.
validation.Positive=0보다 커야 합니다.
validation.TYPE_MISMATCH=값의 형식이 올바르지 않습니다.
validation.DEFAULT=입력값을 확인해 주세요.

