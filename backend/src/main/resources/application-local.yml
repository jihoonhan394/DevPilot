# profile: local — 개발자 PC (Windows 11)
# 기준: docs/03-system-architecture.md §10, docs/18-project-setup-and-local-dev.md §4.4, §5 (2026-09-18)
#   DB   : 서버 PostgreSQL 16 (공용 인스턴스, DB devpilot / role devpilot, TLS 없음 — Tailscale 구간 암호화)
#          DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD 는 .env 에서 읽고 기본값이 없다.
#          실제 값은 저장소 밖 DevPilot-ops/02-database.md. 오프라인 대체: infra/compose.dev.yml (localhost:55432)
#   인증 : devtoken (기본, 결정 A). DEVPILOT_DEV_JWT_KEY 가 비면 기동 시 EC P-256 키를 만든다(재기동 시 기존 토큰 무효).
#          POST /api/v1/dev/token {email} 으로 토큰 발급 (allowlist = DEVPILOT_ALLOWED_EMAILS)
#   AI   : fake (실제 호출이 필요할 때만 .env 에 DEVPILOT_AI_PROVIDER=deepseek + DEEPSEEK_API_KEY.
#          DeepSeek 은 Spring RestClient 로 호출하므로 키를 Spring property(.env) 로 읽는다)
#
# 저장소 루트의 .env 를 읽는다. 작업 디렉터리는 backend/ 이어야 한다 (./gradlew bootRun 기본값).
# IntelliJ Run Configuration 사용 시 Working directory = $PROJECT_DIR$/backend
# 기본값이 없는 placeholder(${VAR})는 값이 없으면 기동이 실패한다. 의도된 동작이다.

spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

devpilot:
  security:
    auth-mode: ${DEVPILOT_AUTH_MODE:devtoken}
    devtoken:
      issuer: ${APP_BASE_URL:http://localhost:5173}/dev   # .env 없이도 기동되도록 기본값을 준다
  web:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
  ai:
    provider: ${DEVPILOT_AI_PROVIDER:fake}

logging:
  level:
    com.devpilot: DEBUG
    org.flywaydb: INFO
