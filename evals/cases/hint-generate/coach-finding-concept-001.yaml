      text: |
        public class ConfigLoader {

            public String readFirstLine(Path path) throws IOException {
                BufferedReader reader = Files.newBufferedReader(path);
                String line = reader.readLine();
                if (line == null) {
                    throw new IOException("empty config: " + path);
                }
                reader.close();
                return line;
            }
        }
