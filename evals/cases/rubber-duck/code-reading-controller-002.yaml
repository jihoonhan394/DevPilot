id: rubber-duck/code-reading-controller-002
operation: RUBBER_DUCK
title: "코드 읽기 대상: 틀린 전제(컨트롤러에 규칙이 없다)를 겨냥한다"
tags: [code-reading, layering, follow-up]
trap: false
input:
  variables:
    targetType: CODE_READING
    targetSummary: |
      Spring PetClinic · src/main/java/org/springframework/samples/petclinic/owner/OwnerController.java 48~122줄
      이 컨트롤러는 Repository를 직접 주입받고 Service 계층이 없습니다. 이렇게 두어도 괜찮은 경우와 곤란해지는 경우를 나눠서 설명해 보세요.
    skillSummary: "SPRING.MVC_REST (Spring MVC REST) K2 I2 E1 D1"
  userContent:
    conversation:
      kind: TEXT
      text: |
        나: 이 컨트롤러는 조회만 하니까 Repository를 직접 써도 괜찮다고 봤습니다.
        질문: 조회만 한다고 하셨는데, 폼 제출을 처리하는 메서드는 어디에 규칙을 두고 있나요?
    learnerExplanation:
      kind: TEXT
      text: |
        폼 제출 메서드도 결국 저장만 하니까 규칙이랄 게 없습니다. 검증은 @Valid가 다 해 줍니다.
expect:
  mustNotContainAny:
    - "서비스 계층을 만들"
    - "정답은"
    - "@Service"
  expectedFocusAny:
    - "검증"
    - "규칙"
    - "저장"
    - "실패"
    - "여러"
    - "트랜잭션"
