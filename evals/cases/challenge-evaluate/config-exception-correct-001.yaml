id: challenge-evaluate/config-exception-correct-001
operation: CHALLENGE_EVALUATE
title: 예외 변환 문제 — cause 보존, null 제거, 처리 계층 설명까지 모두 충족
tags: [exception, correct]
trap: false
input:
  variables:
    challengeTitle: 설정 파일 로딩 실패를 올바르게 알리기
    scenario: 서비스 기동 시 ConfigLoader가 설정 파일을 읽는다. 지금은 읽기에 실패하면 null을 반환해, 한참 뒤 다른 곳에서 NullPointerException이 난다.
    challengePrompt: |
      아래 ConfigLoader.load(Path)가 실패 원인을 잃지 않고 호출자에게 실패를 알리도록 고쳐라. 그리고 이 예외를 어느 계층에서 처리해야 하는지 설명하라.

      ```java
      public class ConfigLoader {
          public Properties load(Path path) {
              try (InputStream in = Files.newInputStream(path)) {
                  Properties props = new Properties();
                  props.load(in);
                  return props;
              } catch (IOException e) {
                  return null;
              }
          }
      }
      ```
    constraints: |
      - JDK 표준 라이브러리만 사용
      - load(Path)의 시그니처(반환 타입 Properties, checked 예외 선언 없음)는 유지
    expectedConcepts: |
      - exception translation
      - cause 보존
      - checked vs unchecked
    commonMistakes: |
      - catch 블록에서 원인 예외를 버림
      - RuntimeException으로 감싸기만 하고 메시지가 없음
    rubric: |
      R1 [IMPLEMENTATION] 변환한 예외에 원인 예외(cause)를 보존한다
      R2 [EXPLANATION] 이 예외를 복구 가능한 계층에서만 처리해야 하는 이유를 설명한다
      R3 [IMPLEMENTATION] IOException 발생 시 null을 반환하지 않고 의미 있는 예외를 던진다
    submissionNo: "1"
    language: JAVA
  userContent:
    selfExplanation:
      kind: TEXT
      text: null을 돌려주면 실패 원인이 사라지니까, 예외로 바꿔서 기동 단계에서 바로 드러나게 하려고 한다.
    answerText:
      kind: TEXT
      text: |
        설정 파일을 읽지 못하면 애플리케이션이 정상 동작할 수 없고, ConfigLoader를 직접 호출하는 코드도 파일을 만들거나 경로를 고쳐서 복구할 방법이 없습니다.
        그래서 IOException을 삼키거나 null로 바꾸지 않고, 원인 예외를 cause로 담은 unchecked ConfigLoadException으로 변환해 기동 시점에 실패하게 했습니다.
        기본 설정으로 대체하는 것처럼 실제로 복구할 수 있는 상위 계층이 생기면 그곳에서만 잡고, 중간 계층에서는 잡지 않는 것이 맞다고 생각합니다.
    code:
      kind: CODE
      language: JAVA
      text: |
        package com.example.config;

        import java.io.IOException;
        import java.io.InputStream;
        import java.nio.file.Files;
        import java.nio.file.Path;
        import java.util.Properties;

        public class ConfigLoader {

            public Properties load(Path path) {
                try (InputStream in = Files.newInputStream(path)) {
                    Properties props = new Properties();
                    props.load(in);
                    return props;
                } catch (IOException e) {
                    throw new ConfigLoadException(path, e);
                }
            }
        }

        class ConfigLoadException extends RuntimeException {

            ConfigLoadException(Path path, Throwable cause) {
                super("failed to load config: " + path, cause);
            }
        }
  guardContext:
    expectedRubricIds: [R1, R2, R3]
expect:
