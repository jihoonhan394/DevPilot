    skillSummary: "SPRING.MVC_REST (Spring MVC REST) K2 I2 E1 D1"
    availableSkillCodes: "SPRING.MVC_REST, SPRING.TRANSACTION"
  userContent:
    conversation:
      kind: TEXT
      text: |
        나: 조회만 하니까 Repository를 직접 써도 괜찮다고 봤습니다.
        질문: 폼 제출을 처리하는 메서드는 어디에 규칙을 두고 있나요?
        나: 저장만 하니까 규칙이랄 게 없습니다. 검증은 @Valid가 다 해 줍니다.
        질문: 저장이 두 번 필요한 요청이 생기면 그 둘은 어떻게 묶이나요?
        나: 그건 생각해 보지 않았습니다.
