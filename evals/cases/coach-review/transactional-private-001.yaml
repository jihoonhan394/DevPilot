        package com.example.point;

        import org.springframework.stereotype.Service;
        import org.springframework.transaction.annotation.Transactional;

        @Service
        public class PointService {

            private final PointAccountRepository accountRepository;
            private final PointHistoryRepository historyRepository;

            public PointService(PointAccountRepository accountRepository,
                                PointHistoryRepository historyRepository) {
                this.accountRepository = accountRepository;
                this.historyRepository = historyRepository;
            }

            public void earn(Long memberId, long amount) {
                addPoint(memberId, amount);
            }

            @Transactional
            private void addPoint(Long memberId, long amount) {
                PointAccount account = accountRepository.findByMemberId(memberId)
                        .orElseThrow(() -> new IllegalArgumentException("account not found: " + memberId));
                account.add(amount);
                historyRepository.save(PointHistory.earned(memberId, amount));
            }
        }
