        package com.example.order;

        import jakarta.persistence.Entity;
        import jakarta.persistence.GeneratedValue;
        import jakarta.persistence.Id;
        import jakarta.persistence.OneToMany;
        import jakarta.persistence.Table;
        import org.springframework.stereotype.Service;
        import org.springframework.transaction.annotation.Transactional;

        import java.util.ArrayList;
        import java.util.List;

        @Service
        public class OrderSummaryService {

            private final OrderRepository orderRepository;

            public OrderSummaryService(OrderRepository orderRepository) {
                this.orderRepository = orderRepository;
            }

            @Transactional(readOnly = true)
            public List<OrderSummary> summarize(Long memberId) {
                List<Order> orders = orderRepository.findAllByMemberId(memberId);
                List<OrderSummary> result = new ArrayList<>();
                for (Order order : orders) {
                    int itemCount = order.getItems().size();
                    String firstProductName = order.getItems().get(0).getProduct().getName();
                    result.add(new OrderSummary(order.getId(), itemCount, firstProductName));
                }
                return result;
            }
        }

        @Entity
        @Table(name = "orders")
        class Order {

            @Id
            @GeneratedValue
            private Long id;

            private Long memberId;

            @OneToMany(mappedBy = "order")
            private List<OrderItem> items = new ArrayList<>();

            Long getId() {
                return id;
            }

            List<OrderItem> getItems() {
                return items;
            }
        }
