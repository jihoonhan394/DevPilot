      text: |
        package com.example.order;

        import org.springframework.stereotype.Service;
        import org.springframework.transaction.annotation.Transactional;

        @Service
        public class OrderCancelService {

            private final OrderRepository orderRepository;

            public OrderCancelService(OrderRepository orderRepository) {
                this.orderRepository = orderRepository;
            }

            @Transactional
            public void cancel(Long orderId) {
                Order order = orderRepository.findById(orderId)
                        .orElseThrow(() -> new OrderNotFoundException(orderId));
                order.cancel();
            }
        }

        @Service
        class OrderExpirationJob {

            private final OrderCancelService orderCancelService;
            private final OrderQueryRepository orderQueryRepository;

            OrderExpirationJob(OrderCancelService orderCancelService,
                               OrderQueryRepository orderQueryRepository) {
                this.orderCancelService = orderCancelService;
                this.orderQueryRepository = orderQueryRepository;
            }

            void cancelExpired() {
                for (Long orderId : orderQueryRepository.findExpiredOrderIds()) {
                    orderCancelService.cancel(orderId);
                }
            }
        }
