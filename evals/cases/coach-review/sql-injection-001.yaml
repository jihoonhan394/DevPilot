        package com.example.product;

        import org.springframework.jdbc.core.JdbcTemplate;
        import org.springframework.stereotype.Repository;

        import java.util.List;

        @Repository
        public class ProductSearchDao {

            private final JdbcTemplate jdbcTemplate;

            public ProductSearchDao(JdbcTemplate jdbcTemplate) {
                this.jdbcTemplate = jdbcTemplate;
            }

            public List<ProductRow> search(String keyword, String sortColumn) {
                String sql = "SELECT id, name, price FROM product WHERE name LIKE '%" + keyword + "%'"
                        + " ORDER BY " + sortColumn;
                return jdbcTemplate.query(sql, (rs, rowNum) ->
                        new ProductRow(rs.getLong("id"), rs.getString("name"), rs.getLong("price")));
            }
        }
