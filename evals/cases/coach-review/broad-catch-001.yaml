      text: |
        package com.example.payment;

        import org.springframework.stereotype.Service;

        @Service
        public class PaymentService {

            private final PaymentGateway gateway;
            private final PaymentRepository repository;

            public PaymentService(PaymentGateway gateway, PaymentRepository repository) {
                this.gateway = gateway;
                this.repository = repository;
            }

            public PaymentResult pay(PaymentCommand command) {
                try {
                    PaymentResponse response = gateway.charge(command.cardToken(), command.amount());
                    repository.save(Payment.approved(command.orderId(), response.transactionId()));
                    return PaymentResult.success(response.transactionId());
                } catch (Exception e) {
                    return PaymentResult.failure("결제 실패");
                }
            }
        }
