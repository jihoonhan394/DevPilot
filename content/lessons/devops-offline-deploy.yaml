# DevPilot 개념 노트 — 폐쇄망·오프라인 배포
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - Docker 노트(LESSON.DEVOPS.DOCKER.001)는 "이미지를 어떻게 만드나"를 다룬다.
#   여기서는 "인터넷 없는 곳으로 어떻게 옮기나"를 다룬다 — 겹치지 않게 쓴다
# - 예제는 주문 시스템 상황으로 쓴다 (CV-134)
lessons:
  - key: LESSON.DEVOPS.OFFLINE_DEPLOY.001
    skillCode: DEVOPS.OFFLINE_DEPLOY
    title: 인터넷이 없는 곳에 올리기 (폐쇄망 배포)
    whyItMatters: |-
      공공기관과 금융사의 서버는 인터넷에 나가지 못한다. `docker pull`도 `gradle build`도 실패한다.
      그래서 필요한 것을 **미리 다 모아서 들고 들어가야** 하는데, 하나라도 빠지면
      그 자리에서 알게 되고 되돌아 나올 수 없다. 반입은 신청과 승인이 걸려 며칠이 걸린다.
      "설치 도중에 뭐 하나가 없어서 다음 주에 다시 오겠습니다"가 되는 순간
      일정과 신뢰가 같이 무너진다. 그래서 이 일은 기술이 아니라 **목록과 절차**의 문제다.
    oneLine: 오프라인 배포는 인터넷에 나갈 수 없는 환경에 필요한 것을 미리 모아 반입하고, 그 환경에서만 되는 절차로 설치·업그레이드하는 일이다.
    units:
      - key: LESSON.DEVOPS.OFFLINE_DEPLOY.001.U1
        title: 빠지면 되돌아 나와야 하는 것을 목록으로 만들기
        minutes: 10
        core: true
        explain: |-
          폐쇄망에서 처음 실패하는 것은 늘 "생각하지 못한 것"이다.
          이미지는 챙기는데 이미지가 실행 중에 받으려는 것은 못 챙긴다.

          반입 목록에 들어가야 하는 것.

          | 무엇 | 빠뜨리기 쉬운 이유 |
          |---|---|
          | 컨테이너 이미지 | 챙긴다. 문제는 **base 이미지까지** 들어 있는지 |
          | 빌드 의존성 | 안에서 빌드할 계획이면 전부. 플러그인까지 |
          | DB migration | 앱에 들어 있으면 괜찮지만 별도면 잊는다 |
          | 폰트·시간대 데이터 | 한글 폰트가 없어 PDF가 깨진다 |
          | 인증서 | 사설 CA 인증서. 없으면 내부 API 호출이 다 막힌다 |
          | 설치 문서 | 인터넷이 없으니 검색도 못 한다 |

          이미지를 파일로 만드는 것은 Docker가 해 준다. `docker image save`는
          "tar로 묶은 저장소를 표준 출력으로 낸다"(또는 `-o`로 파일에) 고,
          중요한 것은 그 안에 무엇이 들어가는지다 —
          "각 인수에 대해 **모든 상위 레이어와 모든 태그·버전**을 담는다."

          즉 base 이미지를 따로 챙길 필요가 없다. 상위 레이어가 전부 들어온다.
          그래서 `save`한 tar 하나면 그 이미지는 완결된다 — `load`만 하면 뜬다.

          반대로 **실행 중에 네트워크로 받으려는 것**은 이미지에 없다.
          그것이 폐쇄망에서 터지는 지점이다.
        example:
          language: bash
          code: |-
            # 반입할 것을 한 폴더에 모은다. 목록 파일을 같이 넣는다
            mkdir -p carry-in && cd carry-in

            # 1) 이미지 — 상위 레이어와 태그가 전부 들어간다
            docker image save -o order-api.tar order-api:1.4.0
            docker image save -o postgres16.tar postgres:16

            # 2) 빌드 의존성 (안에서 빌드할 때만)
            ./gradlew --write-verification-metadata sha256 dependencies
            tar -czf gradle-cache.tar.gz -C ~/.gradle caches/modules-2

            # 3) 잊기 쉬운 것들
            cp /usr/share/fonts/truetype/pretendard/*.ttf fonts/
            cp internal-ca.crt certs/

            # 4) 목록과 절차
            sha256sum *.tar *.tar.gz > MANIFEST.sha256
            cp ../docs/offline-install.md .
          output: |-
            carry-in/
              order-api.tar          (앱 이미지 — base 포함)
              postgres16.tar
              gradle-cache.tar.gz
              fonts/  certs/
              MANIFEST.sha256        (반입 후 무결성 확인용)
              offline-install.md     (인터넷이 없으니 문서도 들고 간다)
          note: |-
            `MANIFEST.sha256`이 목록과 검증을 한꺼번에 한다. 반입 매체가 USB든 망연계든
            옮기다 깨질 수 있고, 깨진 tar 는 `load` 중간에 실패한다.
            들어가서 제일 먼저 하는 일이 `sha256sum -c MANIFEST.sha256`이다.
        predict:
          question: |-
            `docker image save` 로 앱 이미지만 저장했습니다.
            폐쇄망에서 `docker load` 하면 base 이미지를 따로 넣어야 할까요?
          choices:
            - 아니다. save 는 모든 상위 레이어를 함께 담는다
            - 그렇다. base 이미지를 따로 save 해야 한다
            - 그렇다. 폐쇄망에서 base 만 pull 하면 된다
          answer: 아니다. save 는 모든 상위 레이어를 함께 담는다
          explanation: |-
            문서가 "모든 상위 레이어와 모든 태그·버전을 담는다"고 적는다.
            그래서 tar 하나가 그 이미지에 대해 완결된다.
            마지막 선택지는 폐쇄망의 정의와 모순된다 — 나갈 수 없으니 `pull` 자체가 안 된다.
        complete:
          question: 이미지를 파일로 저장하는 명령의 빈칸을 채우세요.
          code: |-
            docker image save ___ order-api.tar order-api:1.4.0
          answers:
            - ["-o", --output]
          explanation: |-
            기본은 표준 출력으로 내보내므로, 파일로 받으려면 `-o`를 주거나 리다이렉트해야 한다.
            `-o` 없이 실행하면 터미널이 tar 바이트로 뒤덮인다.
        problem:
          prompt: |-
            주문 시스템을 인터넷에 나갈 수 없는 서버에 처음 설치합니다.
            구성은 앱(Spring Boot) + PostgreSQL 16 + 리버스 프록시이고,
            앱은 시작할 때 Flyway migration 을 돌립니다.

            반입 목록을 만드세요. 그리고 **목록만 보고는 알 수 없어 미리 확인해야 하는 것**을
            세 가지 적으세요.
          deliverables:
            - 반입 목록 (무엇을, 왜)
            - 목록 무결성을 확인하는 방법
            - 미리 확인해야 하는 것 3가지 (확인하지 않으면 현장에서 막히는 것)
          hints:
            - 앱이 시작할 때 네트워크로 무엇을 받으려 하는지 생각하세요. 폰트, 시간대, 인증서.
            - 그 서버에 Docker 가 이미 있습니까? 버전은요?
            - 문서도 반입 대상입니다. 인터넷이 없으면 검색을 못 합니다.
          modelAnswer: |-
            **반입 목록**

            | 항목 | 왜 |
            |---|---|
            | `order-api.tar` | 앱 이미지. base 레이어가 함께 들어온다 |
            | `postgres16.tar` | DB 이미지 |
            | `caddy.tar` (또는 nginx) | 리버스 프록시 이미지 |
            | `compose.prod.yml` | 실행 정의 |
            | `.env.example` | 설정 항목 목록. 실제 값은 현장에서 채운다 |
            | `fonts/` | 한글 폰트. 없으면 PDF·이미지 출력이 깨진다 |
            | `certs/internal-ca.crt` | 사설 CA. 없으면 내부 API 호출이 전부 실패한다 |
            | `MANIFEST.sha256` | 반입 후 무결성 확인 |
            | `offline-install.md` | 설치·업그레이드·되돌리기 절차 |

            Flyway migration 은 앱 이미지 안에 있으므로 따로 챙기지 않는다.
            **다만 그것이 사실인지 확인해야 한다** — 별도 폴더에서 읽는 설정이면 빠진다.

            **무결성 확인**

            반입 직후 `sha256sum -c MANIFEST.sha256`. 매체를 옮기다 깨진 tar 는
            `docker load` 중간에 실패하는데, 그때는 원인이 매체인지 이미지인지 알 수 없다.
            들어가서 제일 먼저 하는 일로 정해 둔다.

            **미리 확인해야 하는 것 3가지**

            1. **그 서버의 Docker/Compose 버전.** 없거나 너무 낮으면 `compose.prod.yml`의
               문법이 안 먹는다. Docker 자체를 반입 목록에 넣어야 할 수도 있다.
            2. **아키텍처.** x86_64 인지 ARM 인지. 다른 아키텍처의 이미지는 `load` 는 되고
               **실행만 실패한다** — 현장에서 알게 되면 되돌아 나와야 한다.
            3. **DB 가 이미 있는지, 비어 있는지.** 공용 인스턴스를 쓰는지 새로 띄우는지에 따라
               반입 목록과 절차가 달라지고, 기존 데이터가 있으면 migration 전략도 달라진다.
          selfChecks:
            - 이미지 외에 폰트·인증서·문서까지 목록에 넣었는가
            - base 이미지를 중복으로 챙기지 않았는가
            - 무결성 확인 방법과 그것을 언제 하는지 적었는가
            - 현장에서만 알 수 있는 것을 미리 확인 항목으로 분리했는가
      - key: LESSON.DEVOPS.OFFLINE_DEPLOY.001.U2
        title: 같은 것이 들어갔는지 증명할 수 있게 굳히기
        minutes: 12
        core: true
        prerequisiteUnits:
          - LESSON.DEVOPS.OFFLINE_DEPLOY.001.U1
        explain: |-
          폐쇄망 배포에서 가장 답하기 어려운 질문은 "지난번과 같은 것이 들어갔습니까"다.
          태그로는 답할 수 없다. `order-api:1.4.0`은 **다시 빌드하면 다른 내용**이 될 수 있다.

          그래서 두 가지를 굳힌다.

          **이미지는 다이제스트로.** 태그는 움직이는 이름이고 다이제스트는 내용의 지문이다.
          `postgres:16`이 아니라 `postgres@sha256:...`을 적어 두면 그 바이트가 고정된다.

          **의존성은 체크섬으로.** Gradle 이 이 일을 표준으로 해 준다.
          `gradle/verification-metadata.xml`에 기대 체크섬을 적어 두면
          "빌드가 그 아티팩트를 받을 때 받은 바이트의 체크섬을 계산한다.
          계산된 체크섬이 기대값과 **다르면 손상된 파일을 쓰는 대신 빌드가 실패한다**."

          알고리즘도 정해져 있다. 문서는 "현대적 용도로 안전하다고 보는 것은
          `SHA-256`과 `SHA-512`뿐"이라고 적는다. 그리고 파일은 손으로 쓰지 않는다 —
          `./gradlew --write-verification-metadata sha256`이 만들어 준다.

          이것이 폐쇄망에서 특히 중요한 이유. 반입한 캐시가 도중에 바뀌거나 섞였을 때
          체크섬이 없으면 **조용히 다른 라이브러리로 빌드된다.**
          체크섬이 있으면 그 자리에서 멈춘다.
        example:
          language: text
          code: |-
            [태그로 적으면 — 같은 것이 들어갔는지 증명할 수 없다]
            image: postgres:16

            [다이제스트로 적으면 — 바이트가 고정된다]
            image: postgres@sha256:1c2f4e...             # 16.4, 2026-09-12 확인

            [의존성 체크섬 — gradle/verification-metadata.xml]
            <component group="org.postgresql" name="postgresql" version="42.7.4">
              <artifact name="postgresql-42.7.4.jar">
                <sha256 value="a1b2c3..." origin="Generated by Gradle"/>
              </artifact>
            </component>

            [어긋나면]
            > expected a 'sha256' checksum of 'a1b2c3...' but was 'd4e5f6...'
            → 빌드 실패. 손상된 파일을 쓰지 않는다
          note: |-
            다이제스트만 적으면 사람이 무엇인지 알 수 없으므로 **주석으로 버전과 확인 날짜**를 같이 남긴다.
            이것이 반입 이력이 되고, "지난번과 같습니까"에 답하는 근거가 된다.
        predict:
          question: |-
            `image: postgres:16` 으로 적어 두고 반년 뒤 같은 절차로 다시 반입했습니다.
            지난번과 같은 이미지가 들어갔다고 말할 수 있나요?
          choices:
            - 말할 수 없다. 태그는 움직이므로 내용이 달라질 수 있다
            - 말할 수 있다. 태그가 같으면 내용도 같다
            - 말할 수 있다. Docker 가 버전을 고정해 준다
          answer: 말할 수 없다. 태그는 움직이므로 내용이 달라질 수 있다
          explanation: |-
            `16`은 16.x 계열을 가리키는 이름이고 그 이름이 가리키는 내용은 바뀐다.
            보안 패치가 들어가는 것이 정상이기도 하다.
            같은 것임을 증명해야 하면 다이제스트(`@sha256:...`)로 고정하고,
            무엇을 고정했는지 주석으로 남겨야 한다.
        complete:
          question: 의존성 체크섬 파일을 만드는 명령의 빈칸을 채우세요.
          code: |-
            ./gradlew --write-verification-metadata ___ dependencies
          answers:
            - [sha256, sha512]
          explanation: |-
            문서가 "현대적 용도로 안전하다고 보는 것은 `SHA-256`과 `SHA-512`뿐"이라고 적는다.
            `md5`나 `sha1`도 받아들여지지만 쓰지 않는다.
            결과는 `gradle/verification-metadata.xml`에 들어가고, 파일이 있으면 검증이 자동으로 켜진다.
        problem:
          prompt: |-
            폐쇄망에 반입한 주문 시스템을 반년 뒤 1.4.0 → 1.5.0 으로 올려야 합니다.
            감사팀이 "1.4.0 때와 무엇이 달라졌는지, 그리고 반입한 것이 빌드한 것과
            같은지 증명하라"고 요구합니다.

            지금 저장소에는 태그로만 적혀 있고 체크섬 파일이 없습니다.
            증명할 수 있는 상태로 만드는 절차를 쓰세요.
          deliverables:
            - 무엇을 어떻게 고정할지 (이미지와 의존성 각각)
            - 1.4.0 과 1.5.0 의 차이를 보이는 방법
            - 반입물이 빌드물과 같음을 증명하는 방법
            - 이 방식이 늘어나게 하는 일 1가지
          hints:
            - 태그는 이름이고 다이제스트는 지문입니다. 저장소에 무엇을 적어 둬야 나중에 비교할 수 있습니까.
            - 체크섬 파일은 손으로 쓰지 않습니다. 명령이 만들어 줍니다.
            - 반입물과 빌드물이 같다는 것은 반입 직전과 직후 두 곳에서 같은 값을 재야 증명됩니다.
          modelAnswer: |-
            **고정**

            | 대상 | 방법 |
            |---|---|
            | 이미지 | `compose.prod.yml`에 `@sha256:...` 다이제스트. 주석에 버전과 확인 날짜 |
            | 빌드 의존성 | `gradle/verification-metadata.xml`. `./gradlew --write-verification-metadata sha256 dependencies`로 생성하고 **커밋** |
            | 반입 묶음 | `MANIFEST.sha256` — 반입 파일 전체의 체크섬 |

            세 파일 모두 저장소에 커밋한다. 커밋되지 않은 고정은 고정이 아니다.

            **1.4.0 과 1.5.0 의 차이**

            둘 다 위 세 파일을 갖고 있으면 `git diff v1.4.0..v1.5.0 -- compose.prod.yml gradle/verification-metadata.xml`
            한 줄로 답이 나온다 — 어떤 이미지 다이제스트가 바뀌었고 어떤 라이브러리가 어느 버전으로 갔는지.
            태그만 있으면 이 diff 가 비어 있고, 실제로는 많은 것이 바뀌었을 수 있다.

            **반입물 = 빌드물 증명**

            1. 빌드 직후 `sha256sum *.tar > MANIFEST.sha256` 을 만들고 **빌드 로그와 함께 보관**
            2. 반입 직후 폐쇄망에서 `sha256sum -c MANIFEST.sha256`
            3. 두 값이 같으면 옮기는 동안 바뀌지 않았다는 증명이 된다

            의존성 쪽은 검증 파일이 대신한다 — 체크섬이 어긋나면 빌드가 실패하므로,
            **성공한 빌드 자체가 증명**이다.

            **늘어나는 일**

            **패치가 나올 때마다 고정값을 갱신하는 일.** 다이제스트를 박아 두면
            보안 패치가 자동으로 따라오지 않으므로, 주기적으로 올려 주고 그때마다
            검증 파일을 다시 쓰고 커밋해야 한다.
            폐쇄망에서는 이 비용을 내는 것이 맞다 — 자동으로 바뀌는 것이 더 위험하다.
          selfChecks:
            - 이미지와 의존성을 각각 다른 방법으로 고정했는가
            - 고정 파일들을 저장소에 커밋한다고 적었는가
            - 반입 전후 두 지점에서 같은 값을 재는 절차를 적었는가
            - 고정이 만드는 유지 비용을 인정했는가
      - key: LESSON.DEVOPS.OFFLINE_DEPLOY.001.U3
        title: 되돌릴 수 있는 절차로 적기
        minutes: 12
        core: true
        prerequisiteUnits:
          - LESSON.DEVOPS.OFFLINE_DEPLOY.001.U2
        explain: |-
          폐쇄망에서는 **한 번 들어가면 못 나온다.** 다시 반입 신청을 하면 며칠이 걸린다.
          그래서 절차 문서의 목적이 "설치 방법"이 아니라 **"막혔을 때 되돌아갈 방법"**이 된다.

          절차에 반드시 있어야 하는 것.

          | | 질문 |
          |---|---|
          | 사전 확인 | 들어가기 전에 무엇을 확인해야 하나 (U1의 3가지) |
          | 설치 | 순서대로. 각 단계의 **성공 판단 기준**까지 |
          | 확인 | 됐는지 어떻게 아는가 (health, 화면 한 곳) |
          | 되돌리기 | 실패했을 때 이전 상태로 가는 명령 |
          | 남기기 | 무엇을 기록하고 나오는가 |

          가장 많이 빠지는 것이 **되돌리기**다. "실패하면 이전 이미지로 돌린다"만 적혀 있으면
          현장에서 이전 이미지 태그를 모른다. 명령까지 적혀 있어야 한다.

          DB가 끼면 되돌리기가 어려워진다. migration 이 이미 돌았으면
          이전 이미지로 돌려도 스키마가 앞서 있다. 그래서 규칙이 하나 생긴다 —
          **앞으로만 가는 migration 을 쓰고, 이전 버전이 읽을 수 있는 모양으로 바꾼다**
          (컬럼을 지우지 않고 더한다). 그러면 이미지만 되돌려도 동작한다.

          문서는 **그 환경 안에서 읽을 수 있어야** 한다. 인터넷이 없으니
          위키 링크는 무용하고, 반입 묶음 안의 파일이어야 한다.
        example:
          language: markdown
          code: |-
            # 주문 시스템 오프라인 설치 — 1.5.0

            ## 0. 사전 확인 (들어가기 전)
            - [ ] docker ≥ 25, docker compose ≥ 2.24 / uname -m = x86_64
            - [ ] DB: 공용 인스턴스인지, devpilot 스키마가 있는지

            ## 1. 무결성 — 전부 OK 여야 다음으로
            sha256sum -c MANIFEST.sha256

            ## 2. 적재
            docker load -i order-api.tar
            docker load -i postgres16.tar
            판단: docker image ls | grep 1.5.0 에 한 줄

            ## 3. 전환
            docker compose -f compose.prod.yml up -d
            판단: curl -s localhost:18080/actuator/health → {"status":"UP"}

            ## 4. 되돌리기 (3번이 실패하면)
            docker compose -f compose.prod.yml down
            sed -i 's/order-api:1.5.0/order-api:1.4.0/' compose.prod.yml
            docker compose -f compose.prod.yml up -d
            판단: 위와 같은 health 응답
            전제: 1.4.0 이미지를 지우지 않았다

            ## 5. 남기기
            설치 일시, 이미지 다이제스트, health 응답, 담당자
          output: |-
            각 단계에 성공 판단 기준이 있어, 어디서 막혔는지 현장에서 바로 말할 수 있다
          note: |-
            4번이 이 문서의 핵심이다. 그리고 "1.4.0 이미지를 지우지 않는다"가 되돌리기의 전제다 —
            디스크를 아끼려고 지우면 되돌아갈 곳이 없어진다.
        predict:
          question: |-
            업그레이드가 실패해 이전 이미지로 되돌렸습니다.
            그런데 새 버전의 migration 이 컬럼을 하나 **삭제**했습니다. 어떻게 되나요?
          choices:
            - 이전 버전이 없는 컬럼을 읽으려 해 실패한다
            - Flyway 가 자동으로 되돌린다
            - 이미지를 되돌리면 스키마도 함께 돌아간다
          answer: 이전 버전이 없는 컬럼을 읽으려 해 실패한다
          explanation: |-
            migration 은 이미지와 함께 되돌아가지 않는다. 스키마는 앞서 있는 채로 남는다.
            그래서 폐쇄망처럼 되돌리기가 생명줄인 환경에서는
            **지우는 변경을 한 번에 하지 않는다** — 먼저 더하고, 이전 버전이 다 사라진 뒤에 지운다.
        complete:
          question: 되돌릴 수 있게 하려면 이전 이미지를 어떻게 해야 할까요?
          code: |-
            업그레이드 후에도 이전 버전 이미지를 ___.
            그것이 되돌리기의 전제다.
          answers:
            - [지우지 않는다, 남겨 둔다, 보관한다]
          explanation: |-
            되돌리기 명령이 적혀 있어도 이전 이미지가 없으면 실행할 수 없고,
            폐쇄망에서는 다시 받아올 수 없다. 디스크 정리는 다음 반입 때
            "두 버전 전"부터 하는 것이 안전하다.
        problem:
          prompt: |-
            주문 시스템 1.5.0 업그레이드에 migration 이 하나 들어 있습니다.
            `order.customer_name` 을 `order.customer_ref` 로 **이름을 바꾸는** 변경입니다.

            폐쇄망에서 되돌릴 수 있게 이 변경을 다시 설계하고, 절차 문서의
            "되돌리기" 절을 쓰세요.
          deliverables:
            - 되돌릴 수 있게 바꾼 migration 계획 (몇 번에 나눠서 어떻게)
            - 각 단계에서 이전 버전이 계속 동작하는지 설명
            - 되돌리기 절차 (명령 포함)
            - 언제 옛 컬럼을 실제로 지우는지
          hints:
            - 이름 바꾸기는 지우기와 더하기를 동시에 하는 변경입니다. 그래서 되돌릴 수 없습니다.
            - 나눠서 하면 각 단계마다 "두 버전이 함께 도는" 구간이 생깁니다.
            - 지우는 것은 되돌릴 필요가 없어진 다음입니다.
          modelAnswer: |-
            **왜 지금 계획이 되돌릴 수 없나**

            `rename` 은 한 문장에 삭제와 추가가 같이 들어 있다. 1.5.0 이 뜬 뒤
            1.4.0 으로 되돌리면 1.4.0 은 `customer_name` 을 찾고 그 컬럼은 없다.
            이미지는 돌아갔는데 스키마는 앞서 있다.

            **나눈 계획 — 세 번의 배포**

            | 배포 | migration | 앱 | 이전 버전이 도나 |
            |---|---|---|---|
            | 1.5.0 | `customer_ref` **추가**(nullable), 기존 값 복사 | 두 컬럼 다 쓰기, 읽기는 새것 | ○ 1.4.0 은 `customer_name` 을 그대로 읽는다 |
            | 1.6.0 | 없음 | 새 컬럼만 씀 | ○ 1.5.0 이 두 컬럼을 다 쓰므로 안전 |
            | 1.7.0 | `customer_name` **삭제** | 그대로 | ✗ 이 시점부터 1.5.0 이전으로는 못 돌아간다 |

            핵심은 1.5.0 이 **양쪽에 다 쓰는 것**이다. 그래야 1.4.0 으로 되돌려도
            데이터가 최신이고, 앞으로 가도 새 컬럼이 채워져 있다.

            **되돌리기 절차 (1.5.0 배포용)**

            ```markdown
            ## 되돌리기
            1. 서비스 내리기
               docker compose -f compose.prod.yml down
            2. 이미지 태그를 이전으로
               sed -i 's/order-api:1.5.0/order-api:1.4.0/' compose.prod.yml
            3. 올리기
               docker compose -f compose.prod.yml up -d
            4. 확인
               curl -s localhost:18080/actuator/health   → {"status":"UP"}
            5. DB 는 건드리지 않는다
               customer_ref 컬럼은 남겨 둔다. 1.4.0 은 그 컬럼을 모르지만
               nullable 이므로 방해하지 않는다
            ```

            **옛 컬럼을 지우는 시점**

            1.6.0 이 충분히 돌아 **1.5.0 이전으로 되돌릴 필요가 없다고 판단한 뒤**다.
            폐쇄망에서는 그 판단이 늦어도 괜찮다 — 컬럼 하나 남아 있는 비용이
            되돌릴 수 없는 위험보다 훨씬 싸다.
          selfChecks:
            - 이름 바꾸기를 더하기와 지우기로 나눴는가
            - 중간 배포가 양쪽 컬럼에 다 쓰게 했는가
            - 되돌리기에 실제 명령과 확인 방법을 넣었는가
            - 되돌릴 때 DB 를 건드리지 않는다고 적었는가
    commonMistakes:
      - 이미지만 챙기고 폰트·사설 CA 인증서·설치 문서를 빠뜨린다. 현장에서 알게 되고, 반입 신청이 며칠 걸리므로 그날 설치를 끝낼 수 없다.
      - 태그로만 적어 둔다. 반년 뒤 "지난번과 같은 것이 들어갔습니까"에 답할 수 없고, 실제로는 내용이 바뀌어 있을 수 있다.
      - 업그레이드 후 이전 이미지를 지운다. 되돌리기 절차가 적혀 있어도 실행할 수 없고, 폐쇄망에서는 다시 받아올 수 없다.
    inProject: |-
      주문 시스템을 인터넷 없는 서버에 올려 보는 연습으로 이 노트를 쓴다.
      반입 묶음 폴더 하나를 만들고, `compose.prod.yml` 의 이미지를 다이제스트로 바꾸고,
      `gradle/verification-metadata.xml` 을 생성해 커밋하고, `offline-install.md` 에
      사전 확인·설치·확인·되돌리기·남기기 다섯 절을 쓴다. 되돌리기 절이 제일 중요하다.
    sources:
      - title: Docker Docs — docker image save
        url: https://docs.docker.com/reference/cli/docker/image/save/
        versionScope: Docker CLI
      - title: Gradle User Manual — Dependency Verification
        url: https://docs.gradle.org/current/userguide/dependency_verification.html
        versionScope: Gradle 9
    verifiedAt: 2026-09-30
