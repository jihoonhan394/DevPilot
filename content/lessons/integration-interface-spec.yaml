# DevPilot 개념 노트 — 인터페이스 명세서 작성
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - API 계약 노트(LESSON.INTEGRATION.API_CONTRACT.001)는 "기계가 읽는 규격 파일(OpenAPI)"을 다룬다.
#   여기서는 "상대 담당자와 합의해 상대가 그대로 구현하는 문서"를 다룬다 — 겹치지 않게 쓴다
# - 예제는 주문 시스템 상황으로 쓴다 (CV-134)
lessons:
  - key: LESSON.INTEGRATION.INTERFACE_SPEC.001
    skillCode: INTEGRATION.INTERFACE_SPEC
    title: 상대가 그대로 만들 수 있게 적기 (인터페이스 명세서)
    whyItMatters: |-
      연동 상대가 다른 회사면 코드를 같이 볼 수 없다. 우리가 적어 준 문서 하나만 보고 만든다.
      "날짜 형식은 알아서 맞춰 주세요"가 들어간 명세서는 반드시 두 번 일하게 된다 —
      상대는 `20260930`으로 보내고 우리는 `2026-09-30`을 기대하며, 그 사실을 통합 시험 첫날에 알게 된다.
      주문 시스템이 POS 매출을 받아올 때도 같다. 항목 하나가 모호하면 그 한 칸 때문에
      전체 일정이 밀리고, 대화 기록을 뒤져 "그때 이렇게 말했다"를 찾는 일이 시작된다.
    oneLine: 인터페이스 명세서는 무엇을 언제 어떤 모양으로 주고받고 틀어졌을 때 어떻게 할지를, 상대가 되묻지 않고 구현할 수 있을 만큼 적은 문서다.
    units:
      - key: LESSON.INTEGRATION.INTERFACE_SPEC.001.U1
        title: 빠지면 반드시 사고가 나는 항목을 채우기
        minutes: 10
        core: true
        explain: |-
          명세서에서 빠지기 쉬운 것은 늘 같다. 항목 이름과 타입은 누구나 적는다.
          사고는 **그 옆 칸**에서 난다.

          | 칸 | 빠지면 무슨 일이 |
          |---|---|
          | 필수·선택 | 상대가 빈 값을 보낸다. 우리는 `null`을 못 받는다 |
          | 널 표현 | 빈 문자열과 없음을 구분하지 못한다 |
          | 길이 | 상대 DB에서 잘려 들어온다. 조용히 |
          | 코드값 목록 | `"완료"`, `"COMPLETE"`, `"1"` 중 무엇인지 모른다 |
          | 단위 | 금액이 원인지 전인지, 수량이 개인지 박스인지 |
          | 문자 인코딩 | 한글이 깨진다. 통합 시험 첫날 |
          | 날짜·시각 형식 | 다음 단위에서 따로 본다. 가장 자주 터진다 |

          명세서 한 줄은 이렇게 생겨야 한다.

          ```text
          orderAmount  정수  필수  최대 11자리  단위: 원(KRW), 소수점 없음  예: 45000
          orderStatus  문자  필수  최대 20자    값: PAID | SHIPPED | CANCELLED (그 밖의 값은 오류)
          memo         문자  선택  최대 200자   없으면 항목 자체를 생략(빈 문자열 금지)
          ```

          마지막 줄이 중요하다. **"없음"을 어떻게 표현할지 우리가 정해 주지 않으면 상대가 정한다.**
        example:
          language: text
          code: |-
            [나쁜 명세 — 실제로 이렇게 온다]
            항목명        타입     설명
            주문금액       숫자     주문 금액
            주문상태       문자     주문의 상태
            주문일시       날짜     주문한 시각

            [좋은 명세]
            항목명        타입   필수  길이   규칙                              예
            orderAmount  정수   Y     11    단위 원(KRW), 소수점 없음           45000
            orderStatus  문자   Y     20    PAID|SHIPPED|CANCELLED 중 하나     PAID
            orderedAt    문자   Y     25    RFC 3339, 오프셋 필수              2026-09-30T14:05:00+09:00
            memo         문자   N     200   없으면 항목을 생략(빈 문자열 금지)    (생략)
          note: |-
            나쁜 쪽은 세 줄 다 "이름을 한 번 더 말한 것"뿐이다. 읽는 사람이 되물어야 할 것이
            하나도 해소되지 않는다. 좋은 쪽은 되물을 것이 없다 — 그게 기준이다.
        predict:
          question: |-
            명세에 `주문금액  숫자  주문 금액` 만 적혀 있습니다.
            상대가 소수점을 붙여 `45000.00` 으로 보내면 누구의 잘못인가요?
          choices:
            - 명세가 단위와 소수점 여부를 정하지 않았으므로 우리 잘못이다
            - 상식적으로 원 단위이므로 상대 잘못이다
            - 숫자 타입이면 소수점은 자동으로 버려진다
          answer: 명세가 단위와 소수점 여부를 정하지 않았으므로 우리 잘못이다
          explanation: |-
            "상식"은 회사마다 다르다. 일본 쪽 시스템과 붙으면 엔 단위가 상식이고,
            결제 쪽은 최소 단위(전)로 보내는 관행이 있다. 명세가 정하지 않은 것은
            상대가 정할 권리가 있고, 그 결과를 되돌리는 비용은 우리가 낸다.
        complete:
          question: 상태 코드 항목의 명세 빈칸을 채우세요. 되물을 것이 없게 만드세요.
          code: |-
            orderStatus  문자  필수  최대 20자
              값: PAID | SHIPPED | CANCELLED
              목록에 없는 값이 오면 ___ 처리한다
          answers:
            - [오류로, 오류, 거절, 에러로]
          explanation: |-
            "그 밖의 값이 오면 어떻게 하는가"를 적지 않으면 구현마다 달라진다 —
            어떤 코드는 무시하고, 어떤 코드는 빈 값으로 저장하고, 어떤 코드는 터진다.
            **모르는 값을 조용히 넘기는 것이 가장 나쁘다.** 오류로 처리하고 알리는 것이 안전하다.
        problem:
          prompt: |-
            주문 시스템이 매장 POS에서 하루치 매출을 CSV 파일로 받습니다.
            상대 담당자가 "항목은 날짜, 상품코드, 수량, 금액, 결제수단 다섯 개입니다"라고 알려 줬습니다.

            이대로 구현하면 무엇이 터질지 예측하고, 되물을 것이 없는 명세 표로 다시 쓰세요.
            다섯 항목 전부에 대해 쓰고, 상대에게 물어봐야 하는 것은 "확인 필요"로 표시하세요.
          deliverables:
            - 항목 5개의 명세 표 (이름·타입·필수·길이·규칙·예)
            - 지금 명세로 구현하면 터질 것 3가지
            - 상대에게 확인해야 하는 질문 목록
          hints:
            - 결제수단 항목이 가장 위험합니다. 값의 목록이 없으면 무엇이 올지 모릅니다.
            - 수량과 금액에는 단위가 필요합니다. 그리고 소수점 여부도요.
            - 파일 전체에 걸리는 것도 명세입니다 — 인코딩과 줄 끝은 항목별이 아니라 파일별입니다.
          modelAnswer: |-
            **명세 표**

            | 항목 | 타입 | 필수 | 길이 | 규칙 | 예 |
            |---|---|---|---|---|---|
            | `salesDate` | 문자 | Y | 10 | `YYYY-MM-DD`. 매장 영업일 기준(자정 넘긴 매출의 귀속 — **확인 필요**) | `2026-09-29` |
            | `productCode` | 문자 | Y | 20 | 우리 상품코드와 같은 체계인지 **확인 필요**. 다르면 매핑 표가 따로 필요 | `SKU-1024` |
            | `quantity` | 정수 | Y | 6 | 단위 **개**. 소수점 없음. 반품은 음수 허용 여부 **확인 필요** | `3` |
            | `amount` | 정수 | Y | 11 | 단위 **원(KRW)**, 소수점 없음. 부가세 포함 여부 **확인 필요** | `45000` |
            | `payMethod` | 문자 | Y | 20 | `CARD｜CASH｜TRANSFER｜POINT` 중 하나. 목록 밖은 오류. **상대 실제 값 확인 필요** | `CARD` |

            **파일 전체 규칙** (항목별이 아니라 파일별로 적어야 하는 것)

            - 문자 인코딩: `UTF-8` (BOM 없음). 상대가 CP949로 보내면 한글이 깨진다
            - 줄 끝: `CRLF`. 마지막 줄의 줄바꿈은 있어도 없어도 된다
            - 첫 줄: 헤더 있음(`header=present`)
            - 값에 쉼표·따옴표·줄바꿈이 들어갈 수 있는 항목(`productCode` 등)은 따옴표로 감싸고,
              따옴표 자체는 따옴표 두 개로 적는다
            - 파일명 규칙과 전달 시각 — **확인 필요**

            **터질 것 3가지**

            1. **인코딩.** 상대가 Windows POS면 CP949로 내보낼 가능성이 높다.
               첫 통합 시험에서 상품명 한글이 깨져 들어온다.
            2. **금액의 부가세.** 우리가 세전으로 보고 상대가 세후로 보내면 정산이 매일 틀리는데,
               금액이 그럴듯해서 며칠 뒤에 발견된다.
            3. **결제수단 코드값.** 목록이 없으면 `카드`, `CARD`, `01`이 섞여 온다.
               모르는 값을 무시하도록 만들어 두면 매출이 조용히 빠진다.

            **확인 질문**

            - 자정을 넘긴 매출은 어느 영업일로 귀속됩니까
            - 상품코드 체계가 우리와 같습니까, 매핑 표가 필요합니까
            - 금액은 부가세 포함입니까
            - 결제수단의 실제 값을 전부 알려 주실 수 있습니까
            - 반품·취소는 음수로 옵니까, 별도 항목입니까
            - 인코딩은 UTF-8로 맞춰 주실 수 있습니까
          selfChecks:
            - 항목마다 단위·코드값·널 표현까지 적었는가
            - 인코딩·줄 끝처럼 파일 전체에 걸리는 규칙을 따로 적었는가
            - 모르는 것을 짐작으로 채우지 않고 "확인 필요"로 남겼는가
            - 모르는 코드값이 왔을 때의 처리를 정했는가
      - key: LESSON.INTEGRATION.INTERFACE_SPEC.001.U2
        title: 날짜와 시각을 되물을 수 없게 적기
        minutes: 10
        core: true
        prerequisiteUnits:
          - LESSON.INTEGRATION.INTERFACE_SPEC.001.U1
        explain: |-
          연동에서 가장 자주 터지는 항목이 시각이다. 이유는 하나 —
          **오프셋이 없는 시각은 뜻이 정해지지 않는다.**

          `2026-09-30T14:05:00`은 어디의 두 시 오 분인가. 상대 서버가 UTC로 돌면
          우리 기준 밤 열한 시다. 아홉 시간이 어긋난 채로 정산이 맞아떨어지는 날은 없다.

          RFC 3339는 오프셋을 **선택으로 두지 않는다.** 형식 정의가 이렇다 —
          `full-time = partial-time time-offset`, `time-offset = "Z" / time-numoffset`.
          `Z`이거나 `+09:00` 같은 숫자이거나, 둘 중 하나가 **반드시** 있어야 한다.

          규격은 한 가지를 더 구분해 둔다. UTC 시각은 아는데 현지 오프셋을 모를 때는
          `-00:00`으로 적는다. 이것은 `Z`나 `+00:00`과 **뜻이 다르다** —
          뒤의 둘은 "UTC가 기준으로 선호된다"는 의미이고, `-00:00`은 "현지 오프셋을 모른다"는 표시다.

          그리고 형식이 모호하면 무슨 일이 생기는지도 적어 두었다.
          `10/11/1996` 같은 표기는 지역마다 다르게 읽힌다.
          오프셋 없는 현지 시각은 지구의 24분의 23에서 뜻을 잃는다.
        example:
          language: text
          code: |-
            [모호한 명세]
            주문일시   날짜   주문한 시각          → 20260930 1405 / 2026-09-30 14:05 / ...

            [되물을 수 없는 명세]
            orderedAt  문자  필수  25자
              형식: RFC 3339 (예: 2026-09-30T14:05:00+09:00)
              오프셋 필수. 'Z' 또는 +09:00 형태
              보관: 서버는 UTC로 저장하고 화면에서 사용자 시간대로 보인다

            [같은 순간의 세 표기 — 모두 같은 값이다]
            2026-09-30T14:05:00+09:00
            2026-09-30T05:05:00Z
            2026-09-30T05:05:00+00:00

            [뜻이 다른 것]
            2026-09-30T05:05:00-00:00   ← UTC 시각은 알지만 현지 오프셋을 모른다
          note: |-
            "보관" 줄을 함께 적는 것이 좋다. 받는 형식과 저장하는 방식은 다른 결정인데,
            적어 두지 않으면 개발자마다 다르게 저장하고 화면마다 다른 시각이 보인다.
        predict:
          question: |-
            상대가 `orderedAt: "2026-09-30T14:05:00"` 을 보냈습니다. 오프셋이 없습니다.
            우리 서버(UTC)가 이것을 그대로 파싱하면 몇 시로 저장될까요?
          choices:
            - UTC 14:05 로 읽혀 한국 기준 23:05 이 된다 — 9시간 어긋난다
            - 자동으로 한국 시간으로 보정된다
            - 파싱에 실패해 오류가 난다
          answer: UTC 14:05 로 읽혀 한국 기준 23:05 이 된다 — 9시간 어긋난다
          explanation: |-
            오프셋이 없으면 파서는 자기 기준으로 읽는다. 서버가 UTC면 UTC 14:05다.
            **오류가 나면 차라리 다행이다** — 조용히 9시간 어긋난 값이 저장되는 것이 더 나쁘다.
            그래서 명세에서 오프셋을 필수로 못 박고, 없는 값은 받지 않아야 한다.
        complete:
          question: RFC 3339 형식의 빈칸을 채우세요. 한국 시간 오후 두 시 오 분입니다.
          code: |-
            2026-09-30T14:05:00___
          answers:
            - ["+09:00"]
          explanation: |-
            `time-offset = "Z" / time-numoffset` 이므로 `Z` 또는 `+09:00` 형태가 와야 한다.
            한국 표준시는 UTC보다 9시간 빠르므로 `+09:00`이다.
            같은 순간을 `2026-09-30T05:05:00Z`로 적어도 값은 같다.
        problem:
          prompt: |-
            POS 매출 파일의 `salesDate` 를 두고 상대 담당자와 이야기하다 이런 답을 받았습니다.

            "저희는 영업 마감 기준이라 새벽 2시까지는 전날 매출로 잡습니다.
            파일은 매일 새벽 3시에 올려 드립니다."

            이 한 마디에서 명세에 적어야 할 결정이 몇 개 나옵니다.
            찾아서 명세 조각으로 쓰고, 이 규칙 때문에 생기는 경계 상황 하나를 예로 드세요.
          deliverables:
            - 이 답변에서 나오는 명세 결정 3개 이상
            - 그것을 반영한 명세 조각 (salesDate 와 파일 전달 규칙)
            - 경계 상황 예시 1개와 그때 기대하는 동작
          hints:
            - 영업일과 달력 날짜가 다르다는 뜻입니다. 그 차이를 명세가 말해 줘야 합니다.
            - 새벽 3시에 올린다는 것은 파일이 없을 수도 있다는 뜻입니다. 없으면 어떻게 합니까.
            - 경계는 자정 직후에 있습니다. 2시 30분의 매출은 어느 파일에 들어갑니까.
          modelAnswer: |-
            **나오는 결정**

            1. `salesDate`는 **달력 날짜가 아니라 영업일**이다. 정의가 필요하다 —
               "해당 영업일 06:00(KST)부터 다음 날 02:00(KST)까지의 매출"
            2. 파일 전달 시각과 **지연 허용 범위**가 필요하다 — 03:00 예정, 언제까지 안 오면 문제로 볼 것인가
            3. 파일이 **없는 날**의 의미가 필요하다 — 매출 0원인가, 아직 안 온 것인가.
               둘은 완전히 다르고, 구분하지 못하면 정산이 0원으로 조용히 넘어간다
            4. 재전송 규칙 — 같은 영업일 파일이 두 번 오면 어느 것이 유효한가

            **명세 조각**

            ```text
            salesDate  문자  필수  10자
              형식: YYYY-MM-DD
              의미: 영업일. 해당 일 06:00(KST) ~ 다음 날 02:00(KST) 의 매출
                    달력 날짜가 아니다 — 09-30 02:30 의 매출은 salesDate=2026-09-29 다

            파일 전달
              예정 시각: 매일 03:00 (KST)
              지연 판단: 05:00 까지 오지 않으면 미수신으로 보고 담당자에게 알린다
              빈 날: 매출이 0원이어도 헤더만 있는 파일을 보낸다 (파일 없음 ≠ 매출 0원)
              재전송: 같은 salesDate 파일이 다시 오면 나중 것이 유효하고, 앞의 것은 전부 취소한다
            ```

            **경계 상황**

            9월 30일 새벽 2시 30분에 발생한 매출.
            달력으로는 9월 30일이지만 영업일 정의로는 **9월 29일**이다.
            따라서 9월 30일 03:00에 오는 파일의 `salesDate`는 `2026-09-29`이고,
            그 매출은 그 파일에 들어 있어야 한다.
            우리 쪽 정산 배치도 같은 정의로 날짜를 잘라야 한다 — 한쪽만 영업일 기준이면 매일 두 시간이 어긋난다.
          selfChecks:
            - 영업일과 달력 날짜의 차이를 시각까지 넣어 정의했는가
            - 파일이 없는 날의 의미를 정했는가 (매출 0원과 구분했는가)
            - 재전송 규칙을 정했는가
            - 경계 예시에 구체적인 날짜·시각과 기대 동작을 넣었는가
      - key: LESSON.INTEGRATION.INTERFACE_SPEC.001.U3
        title: 틀어졌을 때의 절차까지 적기
        minutes: 10
        core: true
        prerequisiteUnits:
          - LESSON.INTEGRATION.INTERFACE_SPEC.001.U2
        explain: |-
          명세서의 절반은 **잘될 때**를 적는다. 사고는 나머지 절반이 비어 있어서 난다.
          "오류가 나면 연락 주세요"가 적힌 명세서는 오류가 난 날 아무 도움이 안 된다.

          적어야 하는 것은 셋이다.

          | | 질문 |
          |---|---|
          | 오류 코드 | 무엇이 잘못됐는지 **기계가 구분**할 수 있는가 |
          | 재처리 절차 | 누가, 무엇을, 언제까지 다시 하는가 |
          | 연락 경로 | 사람이 개입해야 할 때 누구에게 |

          오류 응답의 모양은 이미 표준이 있다. HTTP API의 문제 응답은
          `application/problem+json`을 쓰고, 자리는 `type`, `title`, `status`, `detail`, `instance`다.
          규격은 누가 무엇을 보는지까지 정해 두었다 — 소비자는 `type` URI를
          "**문제 유형의 주 식별자로 사용해야 한다(MUST)**", 그리고 `detail`은
          "이 발생 건에 대한 **사람이 읽을** 설명"이며
          "소비자는 정보를 얻으려고 `detail`을 **파싱하지 않아야 한다(SHOULD NOT)** —
          확장 항목이 더 알맞고 실수가 적은 방법이다"라고 적는다.

          그 확장 항목은 규격이 허용한다. "문제 유형 정의는 그 유형에 특화된 추가 항목으로
          문제 상세 객체를 **확장할 수 있다(MAY)**." 줄 번호나 문제가 된 코드값은 여기에 넣는다.

          재처리에서 빠지기 쉬운 것은 **경계**다. "실패하면 다시 보낸다"만 있으면
          몇 번까지 보내는지, 그 사이 우리가 받은 절반은 어떻게 되는지가 없다.
        example:
          language: json
          code: |-
            {
              "type": "urn:pos:problem:unknown-product",
              "title": "Unknown product code",
              "status": 422,
              "detail": "상품코드 SKU-9999 를 찾을 수 없습니다. 상품 등록 후 재전송하세요.",
              "instance": "/sales-files/2026-09-29",
              "line": 142,
              "productCode": "SKU-9999"
            }
          note: |-
            분기는 `type`으로 한다 — `urn:pos:problem:unknown-product`. `detail`은 담당자가 읽을 문장이고
            문구가 언제든 바뀔 수 있다. `line`과 `productCode`는 표준에 없는 추가 항목인데,
            **어느 줄의 어떤 값이 문제인지** 없으면 1만 줄 파일에서 사람이 찾아야 한다.
        predict:
          question: |-
            상대 시스템이 오류를 `detail` 문장으로만 구분합니다.
            우리가 `detail.contains("찾을 수 없습니다")` 로 분기하면 언제 깨지나요?
          choices:
            - 상대가 문장을 다듬거나 번역하는 날 조용히 깨진다
            - 절대 깨지지 않는다. 문장은 바뀌지 않는다
            - HTTP 상태 코드가 바뀔 때만 깨진다
          answer: 상대가 문장을 다듬거나 번역하는 날 조용히 깨진다
          explanation: |-
            규격이 `detail`을 "사람이 읽을 설명"으로 정한 이유가 이것이다.
            사람용 문구는 다듬어지는 것이 정상이고, 그때 우리 분기가 조용히 빠진다.
            기계가 볼 값은 `type`에 있어야 하고, 상대 명세에 그것이 없으면 **넣어 달라고 요구하는 것**이 맞다.
        complete:
          question: 문제 응답의 Content-Type 빈칸을 채우세요.
          code: |-
            HTTP/1.1 422 Unprocessable Content
            Content-Type: application/___+json
          answers:
            - [problem]
          explanation: |-
            `application/problem+json`이 HTTP API 문제 응답의 표준 미디어 타입이다.
            이것을 쓰면 상대도 우리도 응답의 모양을 따로 합의할 필요가 없다 —
            `type`으로 분기하고 `detail`을 읽으면 된다는 것이 이미 정해져 있다.
        problem:
          prompt: |-
            POS 매출 파일 연동의 "틀어졌을 때" 절을 쓰세요.

            상황은 셋입니다.
            (가) 파일이 오지 않았다
            (나) 파일은 왔지만 100줄 중 3줄의 상품코드를 우리가 모른다
            (다) 파일 전체가 깨져 읽을 수 없다 (인코딩 문제)

            각각 오류 코드, 우리가 하는 일, 상대가 하는 일, 기한을 정하세요.
            (나)에서 나머지 97줄을 어떻게 할지가 이 문제의 핵심입니다.
          deliverables:
            - 상황 3개의 오류 코드와 처리 (기계가 구분할 값 포함)
            - (나)의 부분 실패 정책과 그렇게 정한 이유
            - 각 상황의 기한과 연락 경로
          hints:
            - (나)에는 선택지가 둘뿐입니다. 전부 되돌리거나, 되는 것만 받고 나머지를 따로 처리하거나.
            - 어느 쪽을 골라도 좋지만, **정하지 않는 것**만은 안 됩니다. 구현마다 달라집니다.
            - 기한이 없는 절차는 절차가 아닙니다. "언제까지"가 없으면 아무도 움직이지 않습니다.
          modelAnswer: |-
            **(가) 파일 미수신**

            | | |
            |---|---|
            | 코드 | `urn:pos:problem:file-missing` |
            | 우리가 | 05:00까지 없으면 미수신으로 판정하고 담당자에게 알린다. 그 영업일은 **정산 보류**(0원으로 확정하지 않는다) |
            | 상대가 | 당일 12:00까지 재전송 |
            | 기한 | 판정 05:00 / 재전송 12:00 |

            **(나) 일부 줄의 상품코드를 모름 — 부분 실패**

            | | |
            |---|---|
            | 코드 | `urn:pos:problem:unknown-product` (줄 번호와 상품코드를 함께 준다) |
            | 정책 | **97줄은 받고, 3줄은 보류 목록에 남긴다** |
            | 우리가 | 97줄 반영 → 보류 3줄을 담당자 화면에 띄운다. 상품 등록 후 보류분만 재처리 |
            | 상대가 | 상품 마스터에 없는 코드를 왜 보냈는지 확인. 필요하면 상품 등록 요청 |
            | 기한 | 보류분은 당일 마감(18:00) 전까지 해소, 넘기면 다음 영업일 정산에 이월 |

            **그렇게 정한 이유**

            전부 되돌리면 하루 매출 전체가 멈춘다. 3줄 때문에 97줄이 못 들어가는 것은
            사업 쪽에서 받아들이기 어렵다. 반대로 3줄을 **조용히 버리면** 매출이 소리 없이 빠진다.
            그래서 "되는 것은 받고, 안 되는 것은 **보이게** 남긴다"를 고른다.
            보류 목록이 화면에 있다는 것이 이 정책의 전제다 — 목록이 없으면 버리는 것과 같다.

            **(다) 파일 전체 손상**

            | | |
            |---|---|
            | 코드 | `urn:pos:problem:file-unreadable` |
            | 정책 | **부분 반영하지 않는다.** 한 줄도 넣지 않는다 |
            | 우리가 | 원본 파일을 그대로 보관하고 담당자에게 알린다. 앞부분만 읽혀도 반영하지 않는다 |
            | 상대가 | 인코딩(UTF-8) 확인 후 재전송 |
            | 기한 | 당일 12:00 재전송 |

            깨진 파일을 부분 반영하지 않는 이유는 **어디까지 온전한지 알 수 없기** 때문이다.
            (나)는 어느 줄이 문제인지 알지만, (다)는 그것을 모른다. 모르면 받지 않는다.

            **연락 경로**

            자동 알림은 운영 채널로, 사람 판단이 필요한 (가)·(다)는 상대 담당자에게 직접.
            연락처는 명세서 첫 장에 두고 양쪽 담당자와 백업 담당자를 적는다.
          selfChecks:
            - 기계가 구분할 오류 코드를 사람이 읽을 문장과 분리했는가
            - 부분 실패 정책을 정하고 그 이유를 적었는가
            - 보류된 것이 보이게 남는다는 전제를 적었는가
            - 세 상황 모두에 기한을 넣었는가
    commonMistakes:
      - 시각 항목에 오프셋을 정하지 않는다. 오류가 나지 않고 9시간 어긋난 값이 저장되므로, 정산이 틀린 것을 며칠 뒤에 발견한다.
      - 코드값 목록을 적지 않고 "상태 코드"라고만 쓴다. `완료`·`COMPLETE`·`01` 이 섞여 오고, 모르는 값을 무시하도록 만들어 두면 데이터가 조용히 빠진다.
      - 부분 실패 정책을 정하지 않는다. 구현하는 사람마다 다르게 만들어, 같은 연동이 어떤 날은 전체 실패하고 어떤 날은 일부만 들어간다.
    inProject: |-
      주문 시스템에서 명세서가 필요한 자리는 POS 매출 수신이다.
      상대가 다른 회사이고 코드를 같이 볼 수 없으므로, 이 노트의 세 단위가 그대로 한 문서가 된다 —
      항목 표, 시각 규칙, 틀어졌을 때의 절차. 문서는 저장소의 `docs/` 아래 두고
      바뀌면 커밋으로 남겨, "그때 이렇게 말했다"를 뒤지지 않게 한다.
    sources:
      - title: "RFC 3339 — Date and Time on the Internet: Timestamps"
        url: https://www.rfc-editor.org/rfc/rfc3339
        versionScope: RFC 3339
      - title: RFC 4180 — Common Format and MIME Type for Comma-Separated Values (CSV) Files
        url: https://www.rfc-editor.org/rfc/rfc4180
        versionScope: CSV
      - title: RFC 9457 — Problem Details for HTTP APIs
        url: https://www.rfc-editor.org/rfc/rfc9457
        versionScope: RFC 9457
    verifiedAt: 2026-09-30
