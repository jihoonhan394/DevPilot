# DevPilot 개념 노트 — 무엇을 만들지 정하기
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 0단계(환경과 첫 API)에서 쓴다. 코드를 쓰기 전에 오는 단계다
# - 예제는 주문 시스템 상황으로 쓴다 (CV-134)
lessons:
  - key: LESSON.PRACTICAL_ENGINEERING.REQUIREMENTS.001
    skillCode: PRACTICAL_ENGINEERING.REQUIREMENTS
    title: 만들기 전에 무엇을 만들지 정하기
    whyItMatters: |-
      받은 명세대로만 고쳐 왔다면 "무엇을 만들지 내가 정하는" 자리에 서 본 적이 없다.
      그 자리에서 막히는 이유는 실력이 아니라 **끝을 정하지 않아서**다. 끝이 없으면
      언제 다 한 것인지 알 수 없고, 다 한 것 같지 않으니 계속 손댄다.
      한 문장을 확인 가능한 조건으로 바꾸는 이 연습이, 혼자 만드는 모든 과제의 첫 칸이다.
    oneLine: 요구사항은 "무엇을 넣으면 무엇이 나오는가"로 적어야 끝났는지 확인할 수 있다.
    units:
      - key: LESSON.PRACTICAL_ENGINEERING.REQUIREMENTS.001.U1
        title: 한 문장을 확인할 수 있는 조건으로
        minutes: 12
        core: true
        explain: |-
          "주문을 취소할 수 있어야 한다" 같은 문장은 요구사항처럼 보이지만
          **다 했는지 확인할 방법이 없다.** 취소가 언제 되고 언제 안 되는지,
          되면 무엇이 달라지는지가 없기 때문이다.

          확인할 수 있게 만드는 방법은 하나다 — **입력 → 조건 → 결과**로 쪼갠다.

          | 쪼개는 칸 | 주문 취소의 예 |
          |---|---|
          | 누가 | 그 주문을 낸 사람이 |
          | 무엇을 넣으면 | 주문 번호로 취소를 요청하면 |
          | 어떤 조건에서 | 아직 배송이 시작되지 않았을 때 |
          | 무엇이 나오는가 | 주문 상태가 `CANCELED`가 되고 200을 받는다 |
          | 아니면 무엇이 나오는가 | 이미 배송 중이면 409를 받고 상태는 그대로다 |

          마지막 줄이 가장 자주 빠진다. **안 되는 경우를 적지 않으면 그 경우가 오면
          코드가 아무렇게나 동작한다.** 그때 정하는 것은 늦다.
        example:
          language: text
          code: |-
            [고치기 전]
            - 주문을 취소할 수 있어야 한다.

            [고친 뒤]
            AC-1  주문한 본인이 PAID 상태의 주문을 취소하면
                  → 200, 상태가 CANCELED, 취소 시각이 남는다
            AC-2  이미 SHIPPED 상태면
                  → 409, 상태는 SHIPPED 그대로
            AC-3  남의 주문 번호로 취소하면
                  → 404 (있는지 없는지도 알려 주지 않는다)
            AC-4  없는 주문 번호면
                  → 404
          output: |-
            확인 방법: AC 하나가 테스트 하나가 된다
            AC-1 → shouldCancelPaidOrder()
            AC-2 → shouldRejectCancelAfterShipping()
            AC-3 → shouldHideOtherPersonsOrder()
            AC-4 → shouldAnswerNotFoundForUnknownOrder()
          note: |-
            - 각 줄이 **한 번에 하나씩** 확인된다. 붙어 있으면 무엇이 깨졌는지 모른다
            - AC-2·AC-3·AC-4가 "안 되는 경우"다. 셋 다 없으면 절반만 정한 것이다
            - 번호를 붙이면 나중에 "AC-2가 바뀌었다"로 말할 수 있다
            - 결과에 **상태 코드와 남는 데이터**를 같이 적는다. 둘 중 하나만으론 확인이 안 된다
        predict:
          question: "AC-3을 404가 아니라 403으로 정하면 무엇이 달라지나?"
          choices:
            - 남의 주문 번호가 존재한다는 사실이 밖으로 새어 나간다
            - 아무 차이도 없다
            - 본인 주문 취소가 안 된다
            - 상태가 CANCELED로 바뀐다
          answer: 남의 주문 번호가 존재한다는 사실이 밖으로 새어 나간다
          explanation: |-
            403은 "있긴 한데 네 것이 아니다"이고 404는 "그런 것 없다"다.
            번호를 바꿔 가며 눌러 보면 403이 돌아오는 번호만 실제 주문이다.
            **남의 리소스는 404로 감추는 것**이 이 프로젝트의 규칙인 이유다.
        complete:
          question: 비어 있는 칸을 채워 AC를 확인 가능하게 만드세요.
          code: |-
            AC-5  장바구니가 ___ 상태에서 주문을 만들면
                  → 400, 주문은 만들어지지 않는다

            AC-6  재고보다 많은 수량으로 주문하면
                  → ___, 재고는 줄지 않는다
          answers:
            - [비어 있는]
            - [409]
          explanation: |-
            AC-5의 조건 칸이 비어 있으면 "언제 400인지"를 모른다.
            AC-6은 요청 형식이 틀린 것이 아니라 **지금 상태와 맞지 않는 것**이라 409다.
            둘 다 "무엇이 일어나지 않는가"까지 적은 것이 핵심이다.
        problem:
          prompt: |-
            주문 시스템에서 직접 정하세요. 아래 한 문장만 주어졌습니다.

            > "쿠폰을 주문에 적용할 수 있어야 한다."

            - 이 문장을 확인 가능한 AC 5개 이상으로 바꾸세요
            - 그중 **최소 3개는 안 되는 경우**여야 합니다
            - AC마다 상태 코드와 남는 데이터를 적으세요
            - 마지막에 AC 하나를 골라 그것을 확인하는 테스트 이름을 적으세요
          deliverables:
            - AC 5개 이상 (안 되는 경우 3개 이상 포함)
            - AC마다 상태 코드와 남는 데이터
            - AC 하나에 대응하는 테스트 이름
          hints:
            - 쿠폰이 "쓸 수 없는" 경우를 떠올려 보세요. 기간, 중복, 최소 금액 같은 것들입니다.
            - 안 되는 경우마다 "무엇이 바뀌지 않는가"를 같이 적으면 확인할 거리가 생깁니다.
            - 상태 코드가 400인지 409인지 헷갈리면 "형식이 틀렸나, 지금 상태와 안 맞나"를 물어보세요.
          modelAnswer: |-
            ```text
            AC-1  유효 기간 안이고 최소 금액을 넘는 주문에 쿠폰을 적용하면
                  → 200, 결제 금액이 할인액만큼 줄고 쿠폰이 USED가 된다
            AC-2  기간이 지난 쿠폰을 적용하면
                  → 409, 금액과 쿠폰 상태 모두 그대로
            AC-3  이미 USED인 쿠폰을 적용하면
                  → 409, 금액 그대로
            AC-4  최소 금액에 미달하는 주문에 적용하면
                  → 409, 금액 그대로
            AC-5  남의 쿠폰 번호로 적용하면
                  → 404
            AC-6  쿠폰 번호 형식이 아예 틀리면
                  → 400
            ```

            AC-2 → `shouldRejectExpiredCoupon()`

            안 되는 경우를 적고 나니 한 가지가 드러난다 — **기간 만료와 이미 사용은 둘 다
            409지만 사유가 다르다.** 화면에서 다르게 말해 줘야 하므로 오류 본문에 구분할
            값이 필요하다. 이런 것은 코드를 쓰다가는 잘 안 보이고, AC를 적을 때 보인다.

            "쿠폰을 주문에 적용할 수 있어야 한다" 한 문장이 여섯 줄이 되었다.
            늘어난 것이 아니라 **원래 그만큼이었는데 안 보였던 것**이다.
          selfChecks:
            - AC마다 입력·조건·결과가 다 있는가
            - 안 되는 경우를 3개 이상 적었는가
            - 안 되는 경우에 "무엇이 바뀌지 않는가"를 적었는가
            - AC 하나가 테스트 하나로 바로 옮겨지는가
      - key: LESSON.PRACTICAL_ENGINEERING.REQUIREMENTS.001.U2
        title: 안 하는 것을 적어 범위를 닫기
        minutes: 10
        core: true
        explain: |-
          혼자 만들 때 가장 흔한 실패는 기능이 모자라서가 아니라 **끝나지 않아서**다.
          하나를 만들면 옆의 것이 보이고, 그것을 만들면 또 옆이 보인다.

          막는 방법은 **안 하는 것을 먼저 적어 두는 것**이다.
          적어 두면 나중에 그것이 떠올라도 "이번이 아니다"로 끝난다.

          | 칸 | 적는 것 |
          |---|---|
          | 이번에 하는 것 | 주문 생성·조회·취소 |
          | 이번에 **안 하는 것** | 결제 연동, 배송 추적, 쿠폰 |
          | 나중에 할 수도 | 주문 목록 검색 |
          | 정하지 못한 것 | 취소 기한을 며칠로 할지 |

          "안 하는 것"과 "나중에 할 수도"는 다르다. 앞은 **이 프로젝트에서 안 한다**이고
          뒤는 **순서가 뒤다**라는 뜻이다. 섞어 적으면 둘 다 결국 하게 된다.

          "정하지 못한 것" 칸이 있는 이유는 다음 단위에서 본다.
        example:
          language: text
          code: |-
            # 주문 시스템 — 1차 범위

            하는 것
            - 주문 생성 / 단건 조회 / 취소
            - 주문 상태: CREATED → PAID → SHIPPED / CANCELED

            안 하는 것 (이 프로젝트에서 하지 않는다)
            - 결제 연동 — PAID는 테스트용 API로 바꾼다
            - 배송 추적 — SHIPPED로 바꾸는 것까지만
            - 쿠폰 / 적립금

            나중에 할 수도 (순서가 뒤다)
            - 주문 목록 조회와 검색
            - 관리자 화면
          output: |-
            2주 뒤 실제 결과
            - 하는 것 3개: 전부 완료
            - '"쿠폰도 있어야 하지 않나" 하고 떠오름 → 안 하는 것에 이미 있음 → 넘어감'
            - 남은 시간으로 목록 조회를 시작함
          note: |-
            - '"결제 연동 — PAID는 테스트용 API로 바꾼다"처럼 **대신 무엇을 할지**를 적는다'
            - 안 적으면 "결제가 없어서 못 해"로 막힌다
            - 떠오른 것을 지우는 것이 아니라 **자리를 옮기는 것**이다. 그래서 덜 아깝다
            - 이 문서는 한 장을 넘기지 않는다. 길어지면 아무도(자신도) 안 읽는다
        predict:
          question: "\"안 하는 것\"을 아예 적지 않으면 대개 어떻게 되나?"
          choices:
            - 떠오를 때마다 다시 고민하게 되고 범위가 계속 늘어난다
            - 기능이 줄어든다
            - 일정이 짧아진다
            - 아무 차이가 없다
          answer: 떠오를 때마다 다시 고민하게 되고 범위가 계속 늘어난다
          explanation: |-
            한 번 "안 한다"고 적어 두면 그 판단이 남는다. 적지 않으면 같은 생각이
            떠오를 때마다 처음부터 다시 판단해야 하고, 판단할 때마다 조금씩 는다.
            **적는 것은 기억이 아니라 결정을 남기는 일**이다.
        complete:
          question: 범위 문서의 칸 이름을 채우세요.
          code: |-
            하는 것
            - 주문 생성 / 조회 / 취소

            ___ (이 프로젝트에서 하지 않는다)
            - 결제 연동, 배송 추적

            ___ (순서가 뒤다)
            - 주문 목록 검색
          answers:
            - [안 하는 것]
            - [나중에 할 수도]
          explanation: |-
            두 칸을 나누는 것이 핵심이다. 하나로 합치면 "안 하는 것"이 전부
            "나중에"가 되어 범위가 닫히지 않는다.
        problem:
          prompt: |-
            0단계에서 만들 주문 시스템의 **범위 문서 한 장**을 직접 쓰세요.

            - 하는 것 / 안 하는 것 / 나중에 할 수도 / 정하지 못한 것 네 칸을 채웁니다
            - '"안 하는 것"에는 **대신 무엇으로 대체할지**를 한 줄씩 적습니다'
            - 전체가 화면 한 장을 넘지 않게 합니다
            - 다 쓴 뒤, 지금 떠오르는 기능 하나를 골라 네 칸 중 어디에 들어가는지 정하세요
          deliverables:
            - 네 칸이 채워진 범위 문서 한 장
            - '"안 하는 것"마다 대체 방법 한 줄'
            - 새로 떠오른 기능 하나와 그것을 넣은 칸
          hints:
            - '"하는 것"은 3~5개면 충분합니다. 많을수록 끝나지 않습니다.'
            - 바깥 시스템(결제, 문자, 메일)은 거의 항상 "안 하는 것" 쪽입니다.
            - '"정하지 못한 것"이 비어 있다면 아직 깊이 생각하지 않은 것일 수 있습니다.'
          modelAnswer: |-
            ```text
            # 주문 시스템 — 0단계 범위

            하는 것
            - 주문 생성 (상품·수량·수령인)
            - 주문 단건 조회
            - 주문 취소

            안 하는 것 (대신 이렇게 한다)
            - 결제 연동 → 상태를 PAID로 바꾸는 테스트용 API 하나
            - 배송 추적 → SHIPPED로 바꾸는 것까지만
            - 회원 가입 → 토큰에서 사용자 id만 꺼내 쓴다

            나중에 할 수도
            - 주문 목록 조회 / 상태별 필터

            정하지 못한 것
            - 취소 가능 기한 (배송 전까지? 결제 후 24시간?)
            - 같은 상품을 두 줄로 담았을 때 합칠지
            ```

            떠오른 기능: **주문서 PDF 내려받기** → "안 하는 것".
            한 번 쓰고 나니 이유도 같이 적힌다 — 화면이 없으니 확인할 방법도 없다.

            "정하지 못한 것" 두 줄이 이 문서의 진짜 값이다. 코드를 쓰다 보면
            **어느 쪽으로든 골라 버리고 잊는다.** 적어 두면 고른 근거를 나중에 말할 수 있다.
          selfChecks:
            - 네 칸이 다 채워졌는가
            - '"안 하는 것"마다 대체 방법이 있는가'
            - 하는 것이 5개 이하인가
            - 떠오른 기능을 한 칸에 넣었는가
      - key: LESSON.PRACTICAL_ENGINEERING.REQUIREMENTS.001.U3
        title: 물을 사람이 없을 때 가정을 적는다
        minutes: 10
        core: true
        explain: |-
          받은 명세로 일할 때는 모르는 것이 생기면 **물어볼 사람**이 있었다.
          혼자 만들 때는 없다. 그렇다고 멈추면 아무것도 안 만들어진다.

          할 일은 정해져 있다 — **고르고, 고른 것을 적는다.**

          ```text
          가정 A-1
            무엇이 모호한가 : 취소 가능 기한이 없다
            무엇으로 정했나 : 배송 시작 전까지 (SHIPPED가 되면 불가)
            왜 그렇게       : 배송 후 취소는 환불·회수가 따라오는데 이번 범위 밖이다
            틀렸다면 무엇이 : AC-2 하나와 상태 검사 한 줄이 바뀐다
          ```

          마지막 줄이 중요하다. **틀렸을 때 바뀌는 범위가 작으면 그냥 고르고 진행한다.**
          크면 그때는 더 알아본 뒤에 정한다. 이 판단이 "혼자 정하기"의 전부다.

          RFC에서 요구사항을 적을 때 MUST·SHOULD·MAY를 나눠 쓰는 것도 같은 이유다 —
          **꼭 지켜야 하는 것과 권장을 섞어 놓으면 나중에 무엇을 포기해도 되는지 모른다.**
        example:
          language: text
          code: |-
            A-1  취소 가능 기한
                 정함 : SHIPPED 이전까지만
                 근거 : 환불·회수가 이번 범위 밖
                 영향 : AC-2, OrderCancelPolicy 한 줄

            A-2  같은 상품 두 줄
                 정함 : 합치지 않고 그대로 둔다
                 근거 : 합치면 줄마다 다른 옵션을 못 담는다
                 영향 : 주문 항목 표의 유니크 제약 (없음으로)

            A-3  주문 번호 형식
                 정함 : UUID
                 근거 : 순번은 하루 주문량이 밖으로 보인다
                 영향 : 표의 기본 키 타입 — 나중에 바꾸기 어렵다
          output: |-
            영향 범위로 나눠 보면
            A-1 작다 → 지금 고르고 진행
            A-2 작다 → 지금 고르고 진행
            A-3 크다 → 30분 더 알아보고 정한다
          note: |-
            - A-3처럼 **나중에 바꾸기 어려운 것**만 시간을 더 쓴다
            - 근거는 한 줄이면 된다. 길게 쓰려다 안 쓰게 된다
            - 이 기록이 그대로 "왜 그렇게 만들었나"의 답이 된다
            - 가정은 부끄러운 것이 아니다. 적지 않은 가정만 문제가 된다
        predict:
          question: 모호한 것을 적지 않고 그냥 코드로 정해 버리면 나중에 무엇이 어려워지나?
          choices:
            - 왜 그렇게 만들었는지 설명할 근거가 남지 않는다
            - 코드가 느려진다
            - 테스트를 못 쓴다
            - 빌드가 깨진다
          answer: 왜 그렇게 만들었는지 설명할 근거가 남지 않는다
          explanation: |-
            코드에는 **고른 결과만** 남고 고르지 않은 쪽과 이유는 사라진다.
            몇 주 뒤의 자신도, 그 코드를 보는 남도 "왜 이렇게 했지?"에서 멈춘다.
            가정 기록은 그 자리를 메우는 가장 싼 방법이다.
        complete:
          question: 가정 기록의 빠진 칸을 채우세요.
          code: |-
            A-4  재고가 모자랄 때
                 정함 : 주문 자체를 거절한다 (부분 주문 없음)
                 ___  : 부분 주문은 취소·환불이 줄 단위로 갈라져 복잡해진다
                 ___  : AC 하나와 재고 검사 한 곳
          answers:
            - [근거]
            - [영향]
          explanation: |-
            "정함"만 있으면 나중에 뒤집을 수 없다. **근거**가 있어야 상황이 바뀌었을 때
            다시 판단할 수 있고, **영향**이 있어야 뒤집는 비용을 가늠할 수 있다.
        problem:
          prompt: |-
            U2에서 쓴 "정하지 못한 것"을 가정 기록으로 바꾸세요.

            - 모호한 것 3개를 고르고 각각 정함·근거·영향을 적으세요
            - 영향이 **큰 것과 작은 것**을 나누고, 큰 것에는 왜 큰지 한 줄 더 적으세요
            - 셋 중 하나를 골라, 그 가정이 틀렸다고 가정하고 **무엇을 고쳐야 하는지** 적으세요
          deliverables:
            - 가정 3개 (정함·근거·영향)
            - 영향이 큰 것과 작은 것의 구분
            - 가정 하나가 틀렸을 때 고칠 목록
          hints:
            - 표 구조나 키 타입에 닿는 가정은 대개 영향이 큽니다.
            - 화면 문구나 기본값처럼 한 줄로 바뀌는 것은 작습니다.
            - '"틀렸다면"을 적어 보면 그 가정이 정말 큰지 작은지가 드러납니다.'
          modelAnswer: |-
            ```text
            A-1  취소 가능 기한 → SHIPPED 이전까지
                 근거: 환불·회수가 범위 밖
                 영향: 작다 — AC-2와 정책 클래스 한 줄

            A-2  같은 상품 두 줄 → 합치지 않는다
                 근거: 줄마다 옵션이 다를 수 있다
                 영향: 작다 — 유니크 제약을 안 거는 것뿐

            A-3  주문 번호 → UUID
                 근거: 순번은 하루 주문량이 밖으로 보인다
                 영향: 크다 — 기본 키 타입이라 이미 쌓인 데이터를 옮겨야 한다.
                       URL·로그·외부에 나간 번호까지 따라 바뀐다
            ```

            A-1이 틀렸다면(배송 후에도 취소해야 한다면) 고칠 것:
            - `AC-2`를 "SHIPPED면 409" → "SHIPPED면 환불 절차로" 로 바꾼다
            - 주문 상태에 `REFUND_REQUESTED`를 더한다
            - 재고를 되돌리는 시점이 취소 시점에서 회수 확인 시점으로 밀린다
            - 테스트 하나가 아니라 **상태 전이 표 전체**를 다시 본다

            적고 나니 A-1은 "작다"가 아니었다. 이렇게 **틀렸을 때를 적어 봐야
            진짜 크기가 보인다.** 그래서 이 칸을 마지막에 두지 않고 처음에 쓴다.
          selfChecks:
            - 가정마다 정함·근거·영향이 다 있는가
            - 영향이 큰 것과 작은 것을 나눴는가
            - 큰 것에 왜 큰지 적었는가
            - 하나를 골라 틀렸을 때 고칠 목록을 적었는가
    commonMistakes:
      - "AC에 되는 경우만 적는다. 안 되는 경우가 오면 코드가 아무렇게나 동작한다 (U1)"
      - "\"안 하는 것\"을 적지 않아 떠오를 때마다 범위가 는다 (U2)"
      - 모호한 것을 코드로 조용히 정해 버려 근거가 남지 않는다 (U3)
    inProject: |-
      0단계에서 첫 API를 만들기 **전에** 이 세 장을 쓴다 — AC 목록, 범위 한 장,
      가정 기록. 그리고 1단계 CRUD, 2단계 트랜잭션으로 갈 때마다 같은 세 장을
      다시 쓴다. 분량이 늘어서가 아니라, 단계마다 정할 것이 달라서다.
      나중에 "이 프로젝트를 왜 이렇게 만들었나"를 설명할 때 이 기록이 그대로 답이 된다.
