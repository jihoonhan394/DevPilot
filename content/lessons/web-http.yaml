# DevPilot 개념 노트 — HTTP 기초
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 메서드의 safe/idempotent 와 상태 코드 문구는 MDN 레퍼런스를 근거로 한다
# - 예제는 주문 시스템 상황으로 쓴다 (CV-134)
lessons:
  - key: LESSON.WEB_HTTP.BASICS.001
    skillCode: WEB_HTTP.HTTP_BASICS
    title: 서버와 주고받는 한 번의 대화 (HTTP)
    whyItMatters: |-
      백엔드가 하는 일은 결국 "요청 하나를 받아 응답 하나를 돌려주는 것"이다.
      이 한 번의 대화가 어떻게 생겼는지 모르면, 화면이 안 나올 때 앱이 잘못한 건지 서버가 잘못한 건지
      가릴 수가 없다. 401과 403 중 무엇을 줄지, 만들고 나서 200을 줄지 201을 줄지도 여기서 정해진다.
      주문 시스템의 모든 화면이 이 대화 위에 올라간다.
    oneLine: HTTP는 클라이언트가 메서드와 경로로 요청하고 서버가 상태 코드와 본문으로 답하는 약속이다.
    units:
      - key: LESSON.WEB_HTTP.BASICS.001.U1
        title: 요청과 응답은 무엇으로 이루어지나
        minutes: 10
        core: true
        explain: |-
          한 번의 대화는 **요청 하나와 응답 하나**다. 둘 다 생김새가 같다 — 첫 줄, 헤더 여러 줄, 빈 줄, 그리고 본문.

          **요청의 첫 줄**은 "무엇을 어디에"다: 메서드(`GET`)와 경로(`/orders/7`).
          **응답의 첫 줄**은 "어떻게 됐나"다: 상태 코드(`200`)와 짧은 설명(`OK`).

          헤더는 본문을 어떻게 읽어야 하는지, 누가 보냈는지 같은 **곁들이는 정보**다.
          `Content-Type`은 "본문이 무슨 형식인지", `Accept`는 "나는 무슨 형식으로 받고 싶은지"를 말한다.

          본문은 없을 수도 있다. `GET`에는 보통 본문이 없고, `204` 응답에는 본문이 아예 없다.
          **중요한 것은 헤더와 본문 사이의 빈 줄이다** — 거기까지가 헤더라는 표시다.
        example:
          language: http
          code: |-
            POST /orders HTTP/1.1
            Host: shop.example.com
            Content-Type: application/json
            Accept: application/json

            {"productId": 7, "quantity": 2}
          output: |-
            HTTP/1.1 201 Created
            Content-Type: application/json
            Location: /orders/1024

            {"orderId": 1024, "productId": 7, "quantity": 2}
          note: |-
            - 첫 줄 `POST /orders` — 무엇을(주문 만들기) 어디에(/orders)
            - `Content-Type: application/json` — 내가 **보내는** 본문이 JSON이다
            - `Accept: application/json` — 나는 JSON으로 **받고 싶다**
            - `Location: /orders/1024` — 만들어진 것이 어디에 있는지 알려 준다
        predict:
          question: '요청에 `Content-Type: application/json`을 빠뜨리고 JSON 본문을 보내면 보통 어떻게 되나?'
          choices:
            - 서버가 본문 형식을 몰라 415나 400으로 거절한다
            - 서버가 알아서 JSON으로 읽는다
            - 요청이 아예 전송되지 않는다
            - 200이 오지만 본문이 비어 있다
          answer: 서버가 본문 형식을 몰라 415나 400으로 거절한다
          explanation: |-
            본문이 무슨 형식인지는 **보내는 쪽이 말해 줘야** 한다. 서버가 글자를 보고 짐작하지 않는다.
            형식을 못 읽으면 415(지원하지 않는 형식)나 400(요청이 잘못됨)으로 거절한다.
            `Accept`는 반대 방향이다 — 내가 받고 싶은 형식이라 이것이 없다고 본문을 못 읽지는 않는다.
        complete:
          question: 주문 1024번을 JSON으로 조회하는 요청의 빈칸을 채우세요.
          code: |-
            ___ /orders/1024 HTTP/1.1
            Host: shop.example.com
            ___: application/json
          answers:
            - [GET]
            - [Accept]
          explanation: |-
            조회이므로 메서드는 `GET`이다. 본문을 보내지 않으므로 `Content-Type`이 아니라,
            받고 싶은 형식을 말하는 `Accept`다.
        problem:
          prompt: |-
            주문 1024번을 **취소**하는 요청과 그에 대한 성공 응답을, 첫 줄과 헤더까지 직접 써 보세요.
            취소는 주문을 지우는 것이 아니라 상태를 `CANCELLED`로 바꾸는 것이고, 돌려줄 본문은 없습니다.
          deliverables:
            - 요청의 첫 줄과 헤더 (본문이 있으면 본문도)
            - 응답의 첫 줄과 헤더, 그리고 그 상태 코드를 고른 이유 한 줄
          hints:
            - 지우는 것이 아니라 **일부를 바꾸는** 것입니다. 메서드 목록에서 어느 것이 그 뜻일까요?
            - 돌려줄 본문이 없다는 것은 상태 코드로 말할 수 있습니다. 200 말고 다른 것이 있습니다.
            - 본문을 보낸다면 그 형식을 말하는 헤더가 필요합니다.
          modelAnswer: |-
            **요청**

            ```http
            PATCH /orders/1024 HTTP/1.1
            Host: shop.example.com
            Content-Type: application/json

            {"status": "CANCELLED"}
            ```

            **응답**

            ```http
            HTTP/1.1 204 No Content
            ```

            - `204`를 고른 이유: 바꾸기는 성공했고 **돌려줄 본문이 없다**. MDN은 204를 "보낼 내용은 없지만 헤더는 쓸모 있다"고 설명한다. 바뀐 주문을 돌려주고 싶으면 `200`에 본문을 담으면 된다.

            (`DELETE /orders/1024`는 "주문을 지운다"는 뜻이 되므로 취소와는 다르다.)
          selfChecks:
            - 메서드가 `PATCH`(또는 `PUT`)이고 경로에 주문 번호가 들어 있는가
            - 본문을 보냈다면 `Content-Type`을 적었는가
            - 응답 상태 코드를 고른 이유를 "본문이 없다"로 설명했는가

      - key: LESSON.WEB_HTTP.BASICS.001.U2
        title: 메서드가 약속하는 것
        minutes: 12
        core: true
        explain: |-
          메서드는 단순한 이름표가 아니라 **약속**이다. MDN은 메서드마다 두 가지 성질을 표로 밝혀 둔다.

          - **안전(safe)** — 서버의 상태를 바꾸지 않는다. 읽기만 한다
          - **멱등(idempotent)** — 여러 번 불러도 **한 번 부른 것과 결과가 같다**

          | 메서드 | 뜻 | 안전 | 멱등 |
          |---|---|---|---|
          | `GET` | 그 자원의 표현을 요청한다 | O | O |
          | `POST` | 자원에 무언가를 제출한다. 보통 상태가 바뀐다 | X | **X** |
          | `PUT` | 그 자원을 요청 본문으로 **통째로 바꾼다** | X | O |
          | `DELETE` | 그 자원을 지운다 | X | O |
          | `PATCH` | 자원을 **부분만** 고친다 | X | **X** |

          멱등이 왜 중요한가. 네트워크가 끊기면 클라이언트는 **요청이 닿았는지 모른다.**
          멱등이면 그냥 다시 보내면 된다. `POST`는 멱등이 아니라서 다시 보내면 주문이 두 개 생길 수 있다 —
          그래서 실무에서는 같은 요청임을 알려 주는 키를 함께 보낸다.

          `DELETE`가 멱등인 이유가 헷갈릴 수 있다. 두 번째 호출은 404가 날 수 있지만,
          **서버의 상태는 "그것이 없다"로 같다.** 멱등은 응답 코드가 같다는 뜻이 아니라 결과 상태가 같다는 뜻이다.
        example:
          language: http
          code: |-
            # 멱등: 몇 번을 보내도 수량은 2다
            PUT /orders/1024 HTTP/1.1
            Content-Type: application/json

            {"productId": 7, "quantity": 2}

            # 멱등 아님: 보낸 횟수만큼 주문이 생긴다
            POST /orders HTTP/1.1
            Content-Type: application/json

            {"productId": 7, "quantity": 2}
          output: |-
            PUT  을 3번 → 주문 1024의 수량 = 2   (한 번 보낸 것과 같다)
            POST 를 3번 → 주문 3개 생성          (1024, 1025, 1026)
          note: |-
            - `PUT`은 "이 자원을 이 내용으로 만들어 둬라" — 몇 번을 해도 같은 자리에 같은 내용
            - `POST`는 "이걸 처리해라" — 처리할 때마다 새것이 생길 수 있다
            - `GET`은 안전하므로 브라우저·프록시가 마음대로 다시 불러도 된다. 그래서 `GET`으로 무언가를 바꾸면 안 된다
        predict:
          question: '`PATCH /orders/1024` `{"quantity": 3}`을 두 번 보내면 수량은?'
          choices:
            - 3이다. 값을 지정했으므로 결과가 같다
            - 6이다. 두 번 더해진다
            - 두 번째는 항상 409가 난다
            - 서버마다 다르다
          answer: 3이다. 값을 지정했으므로 결과가 같다
          explanation: |-
            이 경우는 결과가 같다. 그런데도 MDN 표에서 `PATCH`가 **멱등이 아닌** 것으로 되어 있는 이유는,
            PATCH의 본문이 "값을 이걸로 해라"일 수도 있고 "1 증가시켜라"일 수도 있기 때문이다.
            즉 **PATCH가 멱등인지는 본문 내용에 달려 있다.** 규격이 보장해 주지 않으므로 멱등이 아니라고 적는다.
            만드는 사람이 멱등이 되게 설계할 수는 있다.
        complete:
          question: 조회와 생성에 알맞은 메서드로 빈칸을 채우세요.
          code: |-
            # 주문 목록 조회 (안전·멱등)
            ___ /orders

            # 주문 새로 넣기 (멱등 아님)
            ___ /orders
          answers:
            - [GET]
            - [POST]
          explanation: |-
            조회는 `GET`(안전하고 멱등), 새로 만들기는 `POST`(멱등이 아니라서 두 번 보내면 주문이 둘 생긴다)다.
            같은 경로라도 **메서드가 다르면 다른 동작**이다.
        problem:
          prompt: |-
            결제 API를 설계합니다. 네트워크가 끊겨 클라이언트가 **응답을 못 받는 일**이 자주 생긴다고 합니다.
            이때 앱은 같은 결제를 다시 보내는데, 결제가 두 번 되면 큰일입니다.

            1. `POST /payments`가 왜 위험한지 멱등 개념으로 설명하세요.
            2. 결제가 두 번 되지 않게 하는 방법을 **두 가지** 제시하고, 각각 요청이 어떻게 생기는지 쓰세요.
          deliverables:
            - POST가 위험한 이유 (멱등이라는 말을 써서)
            - 서로 다른 해결 방법 2가지와 각각의 요청 예
          hints:
            - 클라이언트가 모르는 것은 "결제가 됐는지"가 아니라 "**요청이 닿았는지**"입니다.
            - 자원의 자리를 클라이언트가 정해 준다면 메서드가 달라질 수 있습니다. 멱등인 메서드가 무엇이었나요?
            - 메서드를 바꾸지 않고, 서버가 "이건 아까 그 요청"이라고 알아볼 수 있게 하려면 무엇을 같이 보내면 될까요?
          modelAnswer: |-
            **1. 왜 위험한가**

            `POST`는 멱등이 아니다 — 같은 요청을 두 번 보내면 처리도 두 번 된다.
            응답을 못 받은 클라이언트는 "닿지 않았다"와 "닿았는데 응답만 못 받았다"를 **구분할 수 없으므로**,
            재시도하면 결제가 두 번 될 수 있다.

            **방법 1 — 멱등인 메서드로 바꾼다 (자리를 클라이언트가 정한다)**

            ```http
            PUT /payments/9f3c1a84-2b77-4d0e-9a51-0c2f6b8e4d13
            Content-Type: application/json

            {"orderId": 1024, "amount": 19000}
            ```

            같은 id로 몇 번을 보내도 결제는 하나다. `PUT`은 멱등이다.

            **방법 2 — 같은 요청임을 알리는 키를 함께 보낸다**

            ```http
            POST /payments
            Idempotency-Key: 9f3c1a84-2b77-4d0e-9a51-0c2f6b8e4d13
            Content-Type: application/json

            {"orderId": 1024, "amount": 19000}
            ```

            서버는 이 키를 기록해 두고, 같은 키가 또 오면 **다시 처리하지 않고 처음 응답을 그대로** 돌려준다.
          selfChecks:
            - POST가 멱등이 아니라는 점과, 클라이언트가 "닿았는지"를 모른다는 점을 둘 다 짚었는가
            - 두 방법이 서로 다른 갈래인가 (메서드를 바꾸기 / 키를 더하기)
            - 두 방법 모두 **같은 요청을 두 번 보내도 결제가 하나**가 되는가

      - key: LESSON.WEB_HTTP.BASICS.001.U3
        title: 상태 코드로 답하기
        minutes: 12
        core: true
        explain: |-
          상태 코드는 첫 자리로 무리를 나눈다. MDN의 분류는 이렇다.

          | 무리 | 뜻 |
          |---|---|
          | `1xx` | 정보성 응답 |
          | `2xx` | 성공 |
          | `3xx` | 더 가야 한다(리다이렉트) |
          | `4xx` | **클라이언트** 잘못 |
          | `5xx` | **서버** 잘못 |

          4와 5를 가르는 기준이 제일 중요하다. **같은 요청을 다시 보내면 될 일이면 5xx, 요청을 고쳐야 할 일이면 4xx**다.
          서버 코드에서 NullPointerException이 났는데 400을 주면, 클라이언트는 자기 요청을 들여다보며 시간을 버린다.

          자주 헷갈리는 네 쌍을 정리하면 이렇다.

          - **401 vs 403** — 401은 "누구인지 모르겠다"(로그인이 필요), 403은 "누구인지는 알겠는데 권한이 없다".
            MDN도 401을 두고 "규격은 unauthorized라고 적지만 의미는 **unauthenticated**"라고 짚는다
          - **400 vs 422** — 400은 요청 자체가 망가진 것(형식이 깨짐), 422는 "형식은 멀쩡한데 **내용이 말이 안 된다**"
          - **404 vs 403** — 남의 자원을 훔쳐보려 할 때 403을 주면 "그런 게 있긴 하구나"를 알려 주게 된다. 보통 404가 안전하다
          - **200 vs 201 vs 204** — 만들었으면 201(+`Location`), 돌려줄 게 없으면 204, 나머지는 200
        example:
          language: http
          code: |-
            POST /orders           {"productId": 7, "quantity": 2}   → 201 Created + Location
            GET  /orders/1024                                        → 200 OK
            PATCH /orders/1024     {"status": "CANCELLED"}           → 204 No Content
            POST /orders           {"productId": 7, "quantity": -1}  → 400 Bad Request
            POST /orders           (토큰 없음)                        → 401 Unauthorized
            GET  /orders/9999      (남의 주문)                        → 404 Not Found
            PATCH /orders/1024     (이미 배송 시작)                    → 409 Conflict
          output: |-
            201 → 만들었고, 어디 있는지 Location 으로 알려 준다
            204 → 됐고, 돌려줄 본문은 없다
            400 → 수량이 -1: 요청을 고쳐야 한다
            401 → 누구인지 모른다 (403 아님)
            404 → 남의 것은 "없다"고 한다 (있다는 사실도 숨긴다)
            409 → 지금 상태와 부딪힌다 (요청 자체는 멀쩡하다)
          note: |-
            - `409`는 "요청은 맞는데 **지금은** 안 된다"다. MDN은 "서버의 현재 상태와 충돌할 때"라고 설명한다
            - `201`에는 `Location`을 같이 준다 — 만든 것을 찾아갈 주소다
            - 본문 없는 성공은 `200` + 빈 본문이 아니라 `204`가 정확하다
        predict:
          question: 로그인은 했지만 관리자만 볼 수 있는 화면을 일반 사용자가 열면 알맞은 코드는?
          choices:
            - 401 Unauthorized
            - 403 Forbidden (또는 숨기려면 404)
            - 400 Bad Request
            - 500 Internal Server Error
          answer: 403 Forbidden (또는 숨기려면 404)
          explanation: |-
            **누구인지는 알고 있다.** 그러므로 401(=인증이 안 됨)이 아니다.
            알겠는데 권한이 없으므로 403이다. 다만 그 자원이 있다는 사실조차 숨겨야 하면 404를 준다 —
            남의 주문을 조회할 때 404를 주는 것이 그 경우다.
        complete:
          question: 두 상황에 알맞은 상태 코드를 숫자로 채우세요.
          code: |-
            주문을 새로 만들었다                → ___
            이미 배송이 시작돼 취소할 수 없다     → ___
          answers:
            - ["201"]
            - ["409"]
          explanation: |-
            만들었으면 `201`(그리고 `Location`으로 어디 있는지 알려 준다),
            요청은 맞는데 지금 상태가 안 받아 주면 `409`다. 두 번째를 `400`으로 주면
            클라이언트는 요청을 고치려고 들여다보다 시간을 버린다 — 고칠 것은 요청이 아니라 **때**다.
        problem:
          prompt: |-
            주문 취소 API(`PATCH /orders/{id}` `{"status": "CANCELLED"}`)가 마주칠 수 있는 상황 **다섯 가지**를 적고,
            각각 어떤 상태 코드를 줄지 정하세요. 토큰 없음 · 남의 주문 · 이미 배송 시작 상황을 반드시 포함하세요.
          deliverables:
            - 상황 5가지와 각각의 상태 코드 (표나 목록)
            - 그중 헷갈리기 쉬운 한 쌍을 골라 왜 그렇게 갈랐는지 한두 줄
          hints:
            - 먼저 4xx와 5xx를 가르세요 — "요청을 고치면 될 일인가, 다시 보내면 될 일인가".
            - 남의 자원에 403을 주면 무엇을 알려 주게 되는지 생각해 보세요.
            - '"요청은 멀쩡한데 지금 상태가 안 받아 준다"에 해당하는 코드가 따로 있습니다.'
          modelAnswer: |-
            | 상황 | 코드 | 왜 |
            |---|---|---|
            | 정상 취소, 돌려줄 본문 없음 | `204` | 됐고 본문이 없다 |
            | 토큰이 없다 | `401` | 누구인지 모른다 |
            | 남의 주문이다 | `404` | 있다는 사실도 알리지 않는다 |
            | 없는 주문 번호다 | `404` | 찾을 수 없다 |
            | 이미 배송이 시작됐다 | `409` | 요청은 맞지만 지금 상태와 부딪힌다 |
            | `status` 값이 `"CANCELED"`처럼 목록에 없다 | `400` | 요청을 고쳐야 한다 |
            | DB 연결이 끊겼다 | `500` | 서버 잘못이다. 다시 보내면 될 수 있다 |

            **헷갈리는 한 쌍 — 403과 404**: 남의 주문에 403을 주면 "그 번호의 주문이 있긴 하다"를 알려 주는 셈이다.
            번호를 하나씩 넣어 보면 남의 주문 개수까지 셀 수 있다. 그래서 **남의 것은 없는 것과 같게 404**로 답한다.
          selfChecks:
            - 4xx와 5xx를 "요청을 고쳐야 하나 / 다시 보내면 되나"로 갈랐는가
            - 남의 주문에 403이 아니라 404를 골랐고 그 이유를 적었는가
            - '"이미 배송 시작"을 400이 아니라 409로 골랐는가'

      - key: LESSON.WEB_HTTP.BASICS.001.U4
        title: 주소를 자원으로 짓기
        minutes: 10
        core: false
        prerequisiteUnits:
          - LESSON.WEB_HTTP.BASICS.001.U2
        explain: |-
          U2에서 메서드가 **동작**을 맡는다고 했다. 그러면 경로는 무엇을 맡나 — **대상**이다.
          그래서 경로에는 동사를 쓰지 않는다. `POST /createOrder`는 동작을 두 번 말하는 셈이다.

          규칙은 셋이면 충분하다.

          1. **경로는 명사, 복수형** — `/orders`, `/products`. 하나를 가리킬 때는 뒤에 식별자: `/orders/1024`
          2. **포함 관계는 경로로** — 주문 1024의 항목들은 `/orders/1024/items`
          3. **거르기·정렬·쪽 나누기는 질의 문자열로** — `/orders?status=PAID&page=2`.
             이것들은 다른 자원이 아니라 **같은 목록을 다르게 본 것**이다

          한 가지 예외가 있다. 자원으로 억지로 바꾸기 어려운 동작들이다(결제 승인, 비밀번호 재설정).
          이때는 `POST /orders/1024/cancel`처럼 동사를 쓰되, **예외임을 알고 쓰는 것**이 중요하다.
          U2의 `PATCH /orders/1024` `{"status": "CANCELLED"}`가 먼저 고려할 형태다.
        example:
          language: http
          code: |-
            # 좋다 — 대상은 경로, 동작은 메서드
            GET    /orders                 주문 목록
            GET    /orders?status=PAID     결제된 주문만 (같은 목록의 다른 모습)
            GET    /orders/1024            주문 하나
            GET    /orders/1024/items      그 주문의 항목들
            POST   /orders                 주문 만들기
            DELETE /orders/1024            주문 지우기

            # 나쁘다 — 경로에 동작이 들어갔다
            POST   /createOrder
            POST   /orders/1024/delete
            GET    /getOrderList?id=1024
          output: |-
            경로 = 무엇을      (명사)
            메서드 = 어떻게    (동사)
            질의 = 어떤 것만   (거르기·정렬·쪽)
          note: |-
            - `/orders/1024/items`는 "그 주문에 딸린" 관계를 경로로 보여 준다
            - `?status=PAID`는 새 자원이 아니라 **같은 목록을 걸러 본 것**이다
            - `GET /getOrderList`는 메서드가 이미 "가져오기"라고 말하고 있어 `get`이 겹친다
        predict:
          question: '`GET /orders/1024/cancel`로 주문을 취소하게 만들면 무엇이 위험한가?'
          choices:
            - GET은 안전해야 하는데 상태를 바꾼다. 브라우저·프록시가 다시 부르면 멋대로 취소된다
            - 경로가 너무 길어 성능이 나빠진다
            - 질의 문자열을 쓸 수 없게 된다
            - 아무 문제 없다
          answer: GET은 안전해야 하는데 상태를 바꾼다. 브라우저·프록시가 다시 부르면 멋대로 취소된다
          explanation: |-
            `GET`은 **안전(safe)** 하다고 약속한 메서드다(U2). 안전하다고 믿기 때문에 브라우저가 미리 불러 두기도 하고,
            프록시가 캐시하기도 하고, 크롤러가 링크를 따라가기도 한다.
            그 자리에서 상태를 바꾸면 **아무도 누르지 않았는데 취소되는 일**이 생긴다.
        complete:
          question: 상품 7번에 달린 후기 목록을 최신순으로 2쪽 가져오는 요청의 빈칸을 채우세요.
          code: |-
            GET /products/7/___?sort=createdAt,desc&___=2
          answers:
            - [reviews]
            - [page]
          explanation: |-
            상품에 딸린 자원이므로 경로로 `reviews`(명사·복수형), 쪽 나누기는 질의 문자열 `page`다.
            정렬·쪽 나누기는 다른 자원이 아니라 같은 목록을 다르게 본 것이므로 경로에 넣지 않는다.
        problem:
          prompt: |-
            아래 API를 자원 중심으로 다시 설계하세요. 여섯 줄을 모두 고치고, 고친 것마다 무엇이 문제였는지 적으세요.

            ```http
            GET  /getAllOrders
            GET  /getOrder?orderId=1024
            POST /createOrder
            POST /updateOrderStatus?orderId=1024&status=PAID
            GET  /deleteOrder?orderId=1024
            GET  /getOrderItems?orderId=1024
            ```
          deliverables:
            - 고친 여섯 줄 (메서드와 경로)
            - 각 줄이 무엇을 어겼는지 (동사가 경로에 있음 / 메서드가 틀림 / 식별자 자리가 틀림 중에서)
          hints:
            - 먼저 각 줄에서 **동작**과 **대상**을 갈라 보세요. 동작은 메서드로 옮깁니다.
            - 하나를 가리키는 식별자는 질의 문자열이 아니라 경로의 어디에 들어가야 할까요?
            - 다섯째 줄은 두 가지가 한꺼번에 잘못됐습니다.
          modelAnswer: |-
            | 고친 것 | 무엇을 어겼나 |
            |---|---|
            | `GET /orders` | 경로에 동사(`getAll`) |
            | `GET /orders/1024` | 경로에 동사 + 식별자가 질의 문자열에 있음 |
            | `POST /orders` | 경로에 동사(`create`) |
            | `PATCH /orders/1024` 본문 `{"status": "PAID"}` | 경로에 동사 + 바꿀 값이 질의 문자열에 있음 |
            | `DELETE /orders/1024` | **메서드가 틀림**(GET이 상태를 바꾼다) + 경로에 동사 |
            | `GET /orders/1024/items` | 포함 관계를 경로가 아니라 질의 문자열로 표현 |

            다섯째 줄이 가장 위험하다. `GET`은 안전해야 하는데 지우고 있어서,
            누군가 그 주소를 한 번 열어 보기만 해도 주문이 사라진다.
          selfChecks:
            - 여섯 줄 모두 경로에서 동사가 사라졌는가
            - 식별자 `1024`가 질의 문자열이 아니라 경로에 들어갔는가
            - 지우기가 `DELETE`, 일부 바꾸기가 `PATCH`(또는 `PUT`)로 바뀌었는가

    commonMistakes:
      - '`GET`으로 상태를 바꾼다. 안전하다고 믿는 쪽들이 멋대로 다시 불러 사고가 난다 (U4)'
      - 서버에서 예외가 났는데 400을 준다. 클라이언트가 자기 요청만 들여다보게 된다
      - 남의 자원에 403을 줘서 "그게 있긴 하다"를 알려 준다. 404가 안전하다
    inProject: |-
      주문 시스템의 API를 처음 그릴 때 이 네 가지가 그대로 쓰인다.
      `/orders`·`/orders/{id}`·`/orders/{id}/items`로 자원을 잡고(U4),
      조회는 `GET`, 만들기는 `POST`, 취소는 `PATCH`로 정하고(U2),
      각 실패마다 401·403·404·409·400을 갈라 적어 두면(U3) 화면을 만들 때 "이럴 땐 뭐가 오지"를 묻지 않아도 된다.
      결제처럼 두 번 되면 안 되는 자리에는 U2의 멱등 키가 필요하다.
