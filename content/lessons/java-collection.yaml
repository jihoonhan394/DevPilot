  - key: LESSON.JAVA.GENERICS.001
    skillCode: JAVA.GENERICS
    title: 무엇이 들어 있는지 타입으로 적어 두기 (제네릭)
    whyItMatters: |-
      꺾쇠 안이 없으면 꺼낼 때마다 형변환을 해야 하고, 잘못 담아도 컴파일러가 아무 말을 하지 않는다.
      틀린 것은 실행 중에 ClassCastException으로 나타난다.
      주문 시스템에서 공통 응답 타입이나 목록 조회 결과를 만들 때, 제네릭이 없으면
      같은 클래스를 타입마다 복사해 만들게 된다.
    oneLine: 제네릭은 "무엇이 들어 있는지"를 컴파일러에게 알려 주는 표기이고, 실행 중에는 사라진다.
    units:
      - key: LESSON.JAVA.GENERICS.001.U1
        title: 타입 파라미터로 형변환 없애기
        minutes: 10
        core: true
        explain: |-
          공식 튜토리얼이 드는 이점은 세 가지다 —
          **컴파일 때 타입을 검사하고, 형변환을 없애고, 같은 코드를 여러 타입에 쓴다.**

          꺾쇠 안에 적는 `T`가 **타입 파라미터**다. 메서드의 매개변수가 값을 받듯,
          타입 파라미터는 **타입을 받는다**. 쓰는 쪽에서 `Box<String>`이라고 적으면
          그 자리의 `T`가 전부 `String`이 된다.

          이름에는 관례가 있다. `T`(Type), `E`(Element), `K`·`V`(Key·Value), `R`(Result).

          클래스뿐 아니라 **메서드 하나에만** 붙일 수도 있다.
          그때는 돌려주는 타입 앞에 `<T>`를 적는다 — 이것이 제네릭 메서드다.
        example:
          language: java
          code: |-
            record ApiResponse<T>(T data, String message) {

                static <T> ApiResponse<T> ok(T data) {
                    return new ApiResponse<>(data, "OK");
                }
            }

            record Product(String code, int price) {}

            ApiResponse<Product> one = ApiResponse.ok(new Product("KB-01", 39000));
            ApiResponse<List<String>> many = ApiResponse.ok(List.of("KB-01", "MS-02"));

            Product product = one.data();        // 형변환이 없다
            System.out.println(product.price());
            System.out.println(many.data().size());
            System.out.println(one.message());
          output: |-
            39000
            2
            OK
          note: |-
            - `ApiResponse<T>` — `T`가 무엇이 담기는지를 나타낸다
            - `static <T> ApiResponse<T> ok(...)` — 돌려주는 타입 앞의 `<T>`가 제네릭 메서드 표시다
            - `one.data()`가 이미 `Product`다. 꺼낼 때 형변환이 필요 없다
            - `new ApiResponse<>(...)` — 꺾쇠 안을 비우면 컴파일러가 채운다(다이아몬드)
        predict:
          question: '`ApiResponse<Product> one`에 `one.data().length()`를 부르면 어떻게 되나?'
          choices:
            - 컴파일 오류가 난다 — Product에 length()가 없다
            - 실행 중 ClassCastException이 난다
            - null이 돌아온다
            - 0이 돌아온다
          answer: 컴파일 오류가 난다 — Product에 length()가 없다
          explanation: |-
            `T`가 `Product`로 정해졌으므로 `data()`의 타입도 `Product`다.
            **실행하기 전에** 막힌다는 것이 제네릭의 값어치다.
            꺾쇠가 없었다면 `Object`를 `String`으로 형변환하다 실행 중에 터졌을 것이다.
        complete:
          question: 목록의 첫 원소를 돌려주는 제네릭 메서드를 완성하세요.
          code: |-
            static ___ E first(List<E> items) {
                if (items.isEmpty()) {
                    throw new IllegalArgumentException("비어 있다");
                }
                return items.___(0);
            }
          answers:
            - ["<E>"]
            - [get]
          explanation: |-
            메서드에만 타입 파라미터를 붙일 때는 **돌려주는 타입 앞에** `<E>`를 적는다.
            `E`는 원소(Element)를 가리키는 관례 이름이다.
        problem:
          prompt: |-
            주문 시스템의 목록 조회 응답을 담는 `PageResponse<T>`를 백지에서 작성하세요.

            - 한 페이지의 내용(`content`), 전체 건수(`totalCount`), 페이지 번호(`page`)를 담는다
            - `content`는 밖에서 바꿀 수 없어야 한다
            - 비어 있는 페이지를 만드는 `empty()`를 제네릭 메서드로 둔다
            - `Product`와 `String` 두 타입으로 각각 만들어 쓰는 예를 보이세요
          deliverables:
            - PageResponse의 전체 코드
            - 두 타입으로 만들어 쓰는 예제 코드
            - 제네릭을 쓰지 않았다면 무엇을 더 써야 했을지 한 줄
          hints:
            - 담기는 것이 무엇인지 모르는 채로 만들어야 합니다. 그 자리를 무엇으로 비워 둘까요?
            - 비어 있는 페이지는 담기는 타입과 상관없이 만들 수 있어야 합니다.
            - 내용을 바꿀 수 없게 하는 방법은 앞 노트(컬렉션)에서 이미 썼습니다.
          modelAnswer: |-
            ```java
            record PageResponse<T>(List<T> content, long totalCount, int page) {

                PageResponse {
                    content = List.copyOf(content);   // 받을 때 끊는다
                }

                static <T> PageResponse<T> empty(int page) {
                    return new PageResponse<>(List.of(), 0, page);
                }
            }

            PageResponse<Product> products =
                    new PageResponse<>(List.of(new Product("KB-01", 39000)), 1, 0);
            PageResponse<String> codes = PageResponse.empty(0);
            ```

            `record`의 압축 생성자에서 한 번 끊으면 안이 불변이 된다.
            `empty()`는 담기는 타입과 무관하므로 제네릭 메서드로 두었다.
            제네릭이 없었다면 `ProductPageResponse`, `StringPageResponse`처럼
            **타입마다 같은 클래스를 복사해** 만들어야 했다.
          selfChecks:
            - 담기는 타입을 타입 파라미터로 비워 두었는가
            - content를 밖에서 바꿀 수 없게 했는가
            - empty()를 타입마다 따로 만들지 않고 하나로 두었는가
            - 두 타입으로 실제로 만들어 써 봤는가
      - key: LESSON.JAVA.GENERICS.001.U2
        title: extends와 super — 받을 수 있는 폭 넓히기
        minutes: 12
        core: true
        explain: |-
          함정이 하나 있다. `List<Product>`는 `List<Object>`가 **아니다.**
          만약 맞다면 `Product` 목록에 아무 `Object`나 넣을 수 있게 되어 타입 검사가 무너진다.

          그래서 "이 타입이거나 그 아래면 된다"를 적는 표기가 필요하다. 그것이 와일드카드 `?`다.

          | 표기 | 뜻 | 할 수 있는 일 |
          |---|---|---|
          | `List<? extends T>` | `T`이거나 그 **하위** | 꺼내 읽는다 |
          | `List<? super T>` | `T`이거나 그 **상위** | 넣는다 |

          외우는 말이 있다 — **PECS**, Producer는 `extends`, Consumer는 `super`.
          값을 **주는**(읽는) 자리면 `extends`, 값을 **받는**(넣는) 자리면 `super`다.

          `? extends T`에 넣을 수 없는 이유는 간단하다. 정확히 어느 하위 타입인지
          모르는데 넣으면, 그 목록의 진짜 타입과 어긋날 수 있기 때문이다.
        example:
          language: java
          code: |-
            sealed interface Item permits Product, Coupon {}
            record Product(String code, int price) implements Item {}
            record Coupon(String code, int rate) implements Item {}

            // 읽기만 한다 → extends
            static int count(List<? extends Item> items) {
                return items.size();
            }

            // 넣는다 → super
            static void addProduct(List<? super Product> target) {
                target.add(new Product("KB-01", 39000));
            }

            List<Product> products = new ArrayList<>(List.of(new Product("MS-02", 12000)));
            List<Item> items = new ArrayList<>();

            System.out.println(count(products));
            System.out.println(count(items));
            addProduct(products);
            addProduct(items);
            System.out.println(products.size() + " " + items.size());
          output: |-
            1
            0
            2 1
          note: |-
            - `count`는 `List<Product>`와 `List<Item>`을 **둘 다** 받는다 — `extends` 덕분이다
            - `addProduct`도 둘 다 받는다 — `Product`를 담을 수 있는 목록이면 되기 때문이다
            - `count` 안에서 `items.add(...)`를 쓰면 컴파일 오류다. 읽기 전용이다
        predict:
          question: '`count`의 매개변수를 `List<Item>`으로 바꾸면 `count(products)`는 어떻게 되나?'
          choices:
            - 컴파일 오류가 난다 — List<Product>는 List<Item>이 아니다
            - 그대로 1이 출력된다
            - 0이 출력된다
            - 실행 중 ClassCastException이 난다
          answer: 컴파일 오류가 난다 — List<Product>는 List<Item>이 아니다
          explanation: |-
            `Product`가 `Item`의 하위라고 해서 `List<Product>`가 `List<Item>`의 하위가 되지는 않는다.
            이것을 잇는 표기가 `? extends Item`이다.
            매개변수에서 **읽기만 한다면** 거의 언제나 `extends`를 붙이는 편이 낫다.
        complete:
          question: 두 목록을 합치는 메서드입니다. PECS에 맞게 빈칸을 채우세요.
          code: |-
            static <T> void copyAll(List<? ___ T> source, List<? ___ T> target) {
                for (T item : source) {
                    target.add(item);
                }
            }
          answers:
            - [extends]
            - [super]
          explanation: |-
            `source`는 값을 **주는** 쪽이라 `extends`, `target`은 값을 **받는** 쪽이라 `super`다.
            이렇게 적어 두면 `copyAll(productList, itemList)` 같은 호출이 전부 통과한다.
        problem:
          prompt: |-
            주문 시스템의 합계를 구하는 유틸리티를 작성하세요.

            - `int totalPrice(List<? extends Product> products)` — 가격의 합을 돌려준다
            - `void collectCodes(List<? extends Item> items, List<? super String> target)` —
              각 항목의 코드를 꺼내 target에 담는다
            - 두 메서드를 `List<Product>`와 `List<Item>`, `List<String>`과 `List<Object>`로
              각각 불러 보고 **컴파일이 되는 조합과 안 되는 조합**을 정리하세요
          deliverables:
            - 두 메서드의 코드
            - 호출 조합별로 컴파일 여부를 적은 표
            - collectCodes의 target에 extends를 쓰면 왜 안 되는지 한 줄
          hints:
            - 매개변수마다 "여기서 값을 읽나, 넣나"를 먼저 정하세요.
            - 읽는 쪽과 넣는 쪽에 붙는 표기가 다릅니다. 외우는 말이 있었습니다.
            - 안 되는 조합은 컴파일러가 알려 줍니다. 그 메시지를 그대로 옮겨 적어도 됩니다.
          modelAnswer: |-
            ```java
            static int totalPrice(List<? extends Product> products) {
                int sum = 0;
                for (Product product : products) {
                    sum += product.price();
                }
                return sum;
            }

            static void collectCodes(List<? extends Item> items, List<? super String> target) {
                for (Item item : items) {
                    target.add(item instanceof Product p ? p.code() : ((Coupon) item).code());
                }
            }
            ```

            | 호출 | 컴파일 |
            |---|---|
            | `totalPrice(List<Product>)` | O |
            | `totalPrice(List<Item>)` | X — `Item`은 `Product`의 하위가 아니다 |
            | `collectCodes(items, List<String>)` | O |
            | `collectCodes(items, List<Object>)` | O — `Object`는 `String`의 상위다 |

            `target`에 `? extends String`을 쓰면 **정확히 어느 하위 타입인지 모르는 목록**이 되어
            넣는 것이 막힌다. 받는 자리에는 `super`를 쓴다.
          selfChecks:
            - 매개변수마다 읽는 자리인지 넣는 자리인지 먼저 정했는가
            - 컴파일이 안 되는 조합을 실제로 확인했는가
            - target에 extends를 쓰면 왜 막히는지 말로 설명할 수 있는가
      - key: LESSON.JAVA.GENERICS.001.U3
        title: 실행 중에는 꺾쇠가 사라진다 (타입 소거)
        minutes: 8
        core: false
        explain: |-
          제네릭은 **컴파일러를 위한 표기**다. 컴파일이 끝나면 꺾쇠 안은 지워지고
          필요한 자리에 형변환이 끼워진다. 이것을 **타입 소거(type erasure)** 라고 한다.

          이유는 호환이다. 제네릭이 없던 시절의 코드와 같은 바이트코드 위에서 돌아야 했다.

          여기서 몇 가지가 따라 나온다.

          - `List<String>`과 `List<Integer>`는 **실행 중에 같은 타입**이다
          - `items instanceof List<String>` 은 쓸 수 없다
          - `new T[10]` 처럼 타입 파라미터로 배열을 만들 수 없다
          - 지워진 타입이 같으면 **메서드 이름을 겹쳐 쓸 수 없다**

          그래서 실행 중에 타입을 알아야 하면 `Class<T>`를 함께 받아 두는 방법을 쓴다.
        example:
          language: java
          code: |-
            List<String> codes = new ArrayList<>();
            List<Integer> prices = new ArrayList<>();

            System.out.println(codes.getClass() == prices.getClass());
            System.out.println(codes.getClass().getName());

            // 꺾쇠를 지우고 담으면 컴파일러가 못 막는다
            List raw = codes;
            raw.add(39000);            // 경고만 나고 통과한다

            for (Object item : codes) {
                System.out.println(item);
            }
            String first = codes.get(0);   // 여기서 터진다
          output: |-
            true
            java.util.ArrayList
            39000
            Exception in thread "main" java.lang.ClassCastException:
              class java.lang.Integer cannot be cast to class java.lang.String
          note: |-
            - 두 목록의 클래스가 **같다** — 실행 중에는 `ArrayList` 하나다
            - 꺾쇠를 뗀 raw 타입에 담으면 컴파일러의 검사를 건너뛴다
            - 터지는 자리가 **담은 곳이 아니라 꺼내는 곳**이다. 원인에서 멀어진다
            - 그래서 꺾쇠를 떼지 않는 것이 규칙이다
        predict:
          question: '`raw.add(39000)` 줄을 지우면 마지막 `codes.get(0)`은 어떻게 되나?'
          choices:
            - IndexOutOfBoundsException이 난다 — 목록이 비어 있다
            - ClassCastException이 그대로 난다
            - null이 돌아온다
            - 빈 문자열이 돌아온다
          answer: IndexOutOfBoundsException이 난다 — 목록이 비어 있다
          explanation: |-
            `codes`에 담은 것은 그 한 줄뿐이었다. 지우면 목록이 비고,
            없는 자리를 꺼내니 범위 오류가 난다.
            형변환 오류는 **잘못된 것이 들어갔을 때만** 난다는 것을 뒤집어 보여 준다.
        complete:
          question: 실행 중에도 타입을 알아야 할 때 쓰는 방법입니다. 빈칸을 채우세요.
          code: |-
            record TypedCache<T>(___<T> type, Map<String, Object> values) {

                T get(String key) {
                    return type.___(values.get(key));
                }
            }
          answers:
            - [Class]
            - [cast]
          explanation: |-
            꺾쇠는 지워지지만 `Class<T>` 객체는 실행 중에도 남는다.
            그것을 들고 다니면 `cast`로 안전하게 형변환할 수 있다 —
            스프링의 여러 API가 `Class<T>`를 함께 받는 이유가 이것이다.
        problem:
          prompt: |-
            아래 코드는 컴파일되지 않는다.

            ```java
            static void handle(List<Product> products) { }
            static void handle(List<Coupon> coupons) { }
            ```

            - **왜** 컴파일되지 않는지 타입 소거로 설명하세요
            - 두 가지 방법으로 고치세요. 하나는 이름을 바꾸는 것이고,
              다른 하나는 이름을 그대로 두고 **매개변수를 바꾸는** 것입니다
            - 두 방법 중 주문 시스템에서 어느 쪽을 고르겠는지와 그 이유를 적으세요
          deliverables:
            - 컴파일되지 않는 이유
            - 고친 코드 두 가지
            - 고른 쪽과 그 이유 한 줄
          hints:
            - 컴파일이 끝난 뒤 두 메서드의 서명이 어떻게 보이는지 그려 보세요.
            - 꺾쇠가 지워지면 남는 것은 무엇인가요?
            - 이름을 그대로 두려면 지워진 뒤에도 서로 다른 것이 있어야 합니다.
          modelAnswer: |-
            타입 소거 뒤 두 메서드의 서명이 **둘 다 `handle(List)`** 가 된다.
            같은 이름에 같은 매개변수이므로 겹쳐 쓸 수 없다.

            ```java
            // 1. 이름을 나눈다
            static void handleProducts(List<Product> products) { }
            static void handleCoupons(List<Coupon> coupons) { }

            // 2. 공통 상위 타입 하나로 받는다
            static void handle(List<? extends Item> items) { }
            ```

            주문 시스템에서는 두 번째가 낫다. 항목 종류가 늘어날 때마다 메서드를 더 만들지 않아도 되고,
            안에서 `instanceof` 패턴으로 갈라 쓰면 된다.
            다만 종류마다 처리가 완전히 다르다면 첫 번째가 더 읽기 쉽다.
          selfChecks:
            - 지워진 뒤의 서명을 실제로 적어 보았는가
            - 두 가지 방법을 모두 컴파일해 보았는가
            - 고른 이유가 짧아서가 아니라 앞으로 늘어날 것을 본 이유인가
    commonMistakes:
      - 꺾쇠를 뗀 raw 타입을 쓴다. 컴파일러 검사를 건너뛰고 꺼낼 때 ClassCastException으로 터진다 (U3)
      - 읽기만 하는 매개변수에 정확한 타입을 적어 두고 하위 타입 목록을 못 받는다 (U2)
      - '`instanceof List<String>`처럼 실행 중에 없는 것을 확인하려 한다 (U3)'
    inProject: |-
      주문 시스템의 공통 응답(ApiResponse)과 목록 응답(PageResponse)이 첫 자리다.
      타입마다 클래스를 복사하지 않아도 되고, 컨트롤러가 무엇을 돌려주는지 서명만 봐도 드러난다.
      서비스 계층에서 여러 종류를 함께 다루는 메서드에는 `? extends`를 붙여 두면,
      나중에 항목 종류가 늘어도 그 메서드는 고치지 않는다.
