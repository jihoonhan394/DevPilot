# DevPilot 개념 노트 — 테스트 설계와 테스트 더블
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 기준 버전: JUnit 6 / Mockito (AGENTS.md §0)
# - 3단계(테스트)에서 쓴다. TESTING.JUNIT 노트를 먼저 본 것으로 전제한다
lessons:
  - key: LESSON.TESTING.UNIT_TEST_DESIGN.001
    skillCode: TESTING.UNIT_TEST_DESIGN
    title: 무엇을 시험할지 고르기 (테스트 설계)
    whyItMatters: |-
      테스트를 쓸 줄 아는 것과 **무엇을 시험할지 고를 줄 아는 것**은 다르다.
      성공 경로만 열 개 쓰면 초록색은 늘지만 잡히는 버그는 없다.
      실제로 터지는 자리는 0건일 때, 딱 맞을 때, 시간이 바뀔 때처럼 정해져 있고,
      그 자리를 고를 줄 알면 테스트 서너 개가 열 개보다 낫다.
    oneLine: 테스트는 개수가 아니라 고른 자리로 값어치가 정해지고, 그 자리는 경계·실패·비결정 셋이다.
    units:
      - key: LESSON.TESTING.UNIT_TEST_DESIGN.001.U1
        title: 성공 경로 하나로는 아무것도 증명되지 않는다
        minutes: 12
        core: true
        explain: |-
          처음 쓰는 테스트는 거의 언제나 이렇다.

          ```java
          @Test
          void shouldCalculateAmount() {
              assertThat(new OrderLine("KB-01", 2).amount(39_000)).isEqualTo(78_000);
          }
          ```

          틀린 테스트는 아니다. 다만 **이 테스트가 잡아 주는 것이 거의 없다.**
          곱셈이 깨질 일은 드물고, 정작 터지는 것은 수량이 0일 때나 음수일 때다.

          고를 자리는 세 갈래다.

          | 갈래 | 무엇을 시험하나 |
          |---|---|
          | **경계** | 0, 1, 딱 맞는 수, 하나 더, 최대, 최대 + 1 |
          | **실패** | 잘못된 입력, 없는 대상, 할 수 없는 상태 |
          | **비결정** | 시간, 난수, 순서, 바깥 세계 |

          그리고 테스트가 쓸모 있는지 확인하는 방법이 하나 있다 —
          **구현을 일부러 망가뜨려 보는 것.** 망가뜨렸는데 그대로 초록이면
          그 테스트는 아무것도 지키고 있지 않다.
        example:
          language: java
          code: |-
            record OrderLine(String productCode, int quantity) {
                OrderLine {
                    if (quantity < 1) {
                        throw new IllegalArgumentException("수량은 1개 이상이어야 한다");
                    }
                }
                int amount(int unitPrice) {
                    return unitPrice * quantity;
                }
            }

            @Test
            void shouldRejectQuantityBelowOne() {                  // 경계
                assertThatThrownBy(() -> new OrderLine("KB-01", 0))
                        .isInstanceOf(IllegalArgumentException.class);
            }

            @Test
            void shouldAcceptQuantityOfExactlyOne() {              // 경계 (바로 안쪽)
                assertThat(new OrderLine("KB-01", 1).amount(39_000)).isEqualTo(39_000);
            }
          output: |-
            구현의 조건을 quantity < 1 에서 quantity < 0 으로 망가뜨렸을 때

            shouldCalculateAmount            초록  ← 아무것도 못 잡는다
            shouldRejectQuantityBelowOne     빨강  ← 잡는다
            shouldAcceptQuantityOfExactlyOne 초록  ← 안쪽 경계는 그대로라 정상
          note: |-
            - 두 테스트가 **경계의 양쪽**을 잡고 있다 — 0은 막히고 1은 통과한다
            - 조건을 한 칸 밀었더니 하나가 빨강이 됐다. 이것이 쓸모 있다는 증거다
            - `shouldCalculateAmount`는 망가뜨려도 초록이다. 지키는 것이 없다
            - 테스트 이름이 **무엇을 지키는지**를 말한다. 이름만 읽어도 안다
        predict:
          question: 경계 바깥(0)만 시험하고 안쪽(1)을 빼면 무엇을 놓치나?
          choices:
            - 조건을 너무 넓게 막아 정상 값까지 거절하는 버그
            - 아무것도 안 놓친다
            - 곱셈 오류
            - 음수 입력
          answer: 조건을 너무 넓게 막아 정상 값까지 거절하는 버그
          explanation: |-
            `quantity < 1`을 실수로 `quantity < 2`로 쓰면 **1개짜리 주문이 전부 막힌다.**
            바깥만 시험하면 그대로 초록이다.
            경계는 **양쪽을 함께** 잡아야 한 칸 밀린 실수가 드러난다.
        complete:
          question: 페이지 크기 상한 100을 지키는 경계 테스트 두 개를 채우세요.
          code: |-
            @Test
            void shouldAcceptSizeOf___() {          // 바로 안쪽
                assertThat(page(orders, 0, 100)).hasSizeLessThanOrEqualTo(100);
            }

            @Test
            void shouldClampSizeAbove___() {        // 바로 바깥
                assertThat(page(orders, 0, 101)).hasSize(100);
            }
          answers:
            - ["100"]
            - ["100"]
          explanation: |-
            상한 자체(100)와 그 하나 바깥(101)을 나란히 둔다.
            **딱 맞는 값이 통과하고 하나 더가 잘리는지**를 함께 봐야
            `<=`를 `<`로 잘못 쓴 실수가 잡힌다.
        problem:
          prompt: |-
            주문 취소 기능에 테스트를 설계하세요. 구현은 이미 있다고 보고 **무엇을 시험할지**만 고릅니다.

            ```java
            void cancel(long orderId, long memberId)
            // PLACED 상태의 내 주문만 취소된다. 배송 시작 뒤에는 못 한다.
            // 이미 취소된 주문을 또 취소해도 오류가 아니다.
            ```

            - 경계·실패·비결정 세 갈래에서 각각 **테스트 케이스를 두 개씩** 뽑으세요
            - 여섯 개에 **테스트 이름**을 붙이세요. 이름만 읽고 무엇을 지키는지 알 수 있어야 합니다
            - 그중 **구현을 어떻게 망가뜨리면 빨강이 되는지**를 두 개에 대해 적으세요
            - 쓰지 않기로 한 케이스가 있다면 그것과 이유도 적으세요
          deliverables:
            - 세 갈래별 케이스 2개씩과 테스트 이름
            - 두 케이스에 대해 망가뜨리는 방법
            - 쓰지 않기로 한 케이스와 이유
          hints:
            - 상태 전이가 있으면 "허용되는 상태"와 "바로 옆 상태"가 경계입니다.
            - 실패 갈래에는 "남의 주문"이 반드시 들어갑니다.
            - 비결정은 시간입니다. 배송 시작 시각을 무엇으로 판단하나요?
          modelAnswer: |-
            | 갈래 | 케이스 | 테스트 이름 |
            |---|---|---|
            | 경계 | PLACED 주문 취소 → 성공 | `shouldCancelWhenOrderIsPlaced` |
            | 경계 | 이미 CANCELLED 주문 재취소 → 조용히 성공 | `shouldStaySilentWhenOrderIsAlreadyCancelled` |
            | 실패 | 남의 주문 → 404 | `shouldReturnNotFoundForAnotherMembersOrder` |
            | 실패 | 배송 시작된 주문 → 409 | `shouldRejectCancelAfterShipping` |
            | 비결정 | 배송 시작 직전 1초 → 취소됨 | `shouldCancelJustBeforeShippingStarts` |
            | 비결정 | 배송 시작 직후 1초 → 거절 | `shouldRejectJustAfterShippingStarts` |

            망가뜨리는 방법 —
            **`shouldReturnNotFoundForAnotherMembersOrder`**: 조회에서 `memberId` 조건을 빼면
            남의 주문이 취소되어 빨강이 된다.
            **`shouldRejectJustAfterShippingStarts`**: 시각 비교를 `>=`에서 `>`로 바꾸면
            경계 한 칸이 밀려 빨강이 된다.

            쓰지 않기로 한 것 — **없는 주문 번호(9999)로 취소**.
            남의 주문과 똑같이 404로 처리되므로 같은 것을 두 번 시험하는 셈이다.
            대신 그 사실(둘이 같은 응답)을 남의 주문 테스트의 이름과 주석에 남긴다.
          selfChecks:
            - 세 갈래에서 각각 뽑았는가
            - 이름만 읽고 무엇을 지키는지 알 수 있는가
            - 경계를 양쪽으로 잡았는가
            - 쓰지 않기로 한 것에 이유가 있는가
      - key: LESSON.TESTING.UNIT_TEST_DESIGN.001.U2
        title: 시간과 난수를 손에 쥐기
        minutes: 12
        core: true
        explain: |-
          테스트가 **가끔 실패**하면 사람들은 그 테스트를 믿지 않게 되고,
          결국 재실행하거나 꺼 버린다. 원인은 거의 늘 **비결정 요소**다.

          | 비결정 | 왜 흔들리나 |
          |---|---|
          | 현재 시각 | 자정을 넘거나 월말이면 결과가 달라진다 |
          | 난수·UUID | 매번 다르다 |
          | 실행 순서 | 앞 테스트가 남긴 데이터에 기댄다 |
          | 바깥 세계 | 네트워크, 파일 시스템 |

          해결은 하나다 — **바깥에서 주입받아 테스트가 고정할 수 있게 만든다.**

          시간이 대표다. 코드가 `Instant.now()`를 직접 부르면 테스트가 손댈 수 없지만,
          `Clock`을 주입받으면 `Clock.fixed(...)`로 원하는 순간에 세울 수 있다.

          ```java
          public OrderService(OrderRepository repository, Clock clock) { ... }
          Instant now = clock.instant();          // 테스트가 정할 수 있다
          ```

          이 저장소도 같은 규칙을 쓴다 — **무인자 `now()` 금지, 주입된 `Clock` 사용.**
          규칙이 까다로워서가 아니라 **시간을 시험할 수 있게** 하려는 것이다.
        example:
          language: java
          code: |-
            class OrderService {
                private final Clock clock;

                boolean isCancellable(Order order) {
                    return order.shippedAt() == null
                            || clock.instant().isBefore(order.shippedAt());
                }
            }

            @Test
            void shouldRejectCancelRightAfterShippingStarts() {
                Instant shippedAt = Instant.parse("2026-09-25T10:00:00Z");
                Clock oneSecondAfter =
                        Clock.fixed(shippedAt.plusSeconds(1), ZoneOffset.UTC);

                OrderService service = new OrderService(repository, oneSecondAfter);

                assertThat(service.isCancellable(orderShippedAt(shippedAt))).isFalse();
            }
          output: |-
            Clock.fixed 로 세운 시각에서 언제 돌려도 같은 결과

            10:00:01 에서 실행 → false   (몇 번을 돌려도)
            무인자 now() 였다면 → 실행한 시각에 따라 true 또는 false
          note: |-
            - 시각을 **테스트가 정했다**. 배송 1초 뒤라는 상황을 정확히 만들 수 있다
            - 이 테스트는 새벽에 돌리든 월말에 돌리든 같은 결과다
            - `Clock.fixed`가 아니라 `now()`였다면 **그 경계를 시험할 방법이 없다**
            - 생성자에 `Clock`이 하나 늘었을 뿐인데 시험 가능한 코드가 됐다
        predict:
          question: 코드가 `Instant.now()`를 직접 부를 때, 배송 1초 뒤를 어떻게 시험하나?
          choices:
            - 시험할 방법이 없다 — 시각을 테스트가 정할 수 없다
            - Thread.sleep으로 기다린다
            - 시스템 시계를 바꾼다
            - 그냥 되겠거니 하고 넘어간다
          answer: 시험할 방법이 없다 — 시각을 테스트가 정할 수 없다
          explanation: |-
            `sleep`은 느리고 여전히 정확한 순간을 못 잡으며, 시스템 시계를 바꾸는 것은
            다른 테스트를 망가뜨린다. **시험할 수 없는 코드는 시험되지 않는다.**
            그래서 시험 가능성은 나중에 붙이는 것이 아니라 설계에서 정해진다.
        complete:
          question: 시각을 고정해 월말 경계를 시험하세요.
          code: |-
            Clock lastDayOfMonth = Clock.___(
                    Instant.parse("2026-09-30T23:59:59Z"), ZoneOffset.UTC);
            BatchService service = new BatchService(repository, ___);
          answers:
            - [fixed]
            - [lastDayOfMonth, clock]
          explanation: |-
            `Clock.fixed(시각, 영역)`이 멈춘 시계를 만든다.
            그것을 주입하면 **그 순간에 고정된 세계**에서 테스트가 돈다.
            흐르는 시간이 필요하면 `Clock.offset`이나 직접 만든 테스트용 시계를 쓴다.
        problem:
          prompt: |-
            아래 코드는 테스트를 쓸 수 없다.

            ```java
            public class CouponService {
                public boolean isUsable(Coupon coupon) {
                    return !coupon.used() && coupon.expiresAt().isAfter(Instant.now());
                }

                public String issueCode() {
                    return "CPN-" + UUID.randomUUID().toString().substring(0, 8);
                }
            }
            ```

            - 시험할 수 없는 자리를 **두 곳** 찾고, 각각 왜 못 하는지 적으세요
            - 두 곳을 주입받는 구조로 고치세요
            - 고친 뒤 **만료 직전 1초와 직후 1초** 테스트를 쓰세요
            - 발급 코드는 무엇을 시험해야 하는지 정하세요 (값 자체는 시험할 수 없습니다)
          deliverables:
            - 시험할 수 없는 두 자리와 이유
            - 주입 구조로 고친 코드
            - 만료 경계 테스트 두 개
            - 발급 코드에서 시험할 것
          hints:
            - 코드 안에서 직접 만들어 내는 값을 찾으세요.
            - 난수는 값을 시험할 수 없지만 형식과 규칙은 시험할 수 있습니다.
            - 만료 경계는 isAfter인지 isBefore인지에 따라 한 칸 달라집니다.
          modelAnswer: |-
            시험할 수 없는 자리 — **`Instant.now()`** 와 **`UUID.randomUUID()`**.
            둘 다 코드 안에서 만들어 내므로 테스트가 값을 정할 수 없다.

            ```java
            public class CouponService {

                private final Clock clock;
                private final Supplier<UUID> uuids;

                public CouponService(Clock clock, Supplier<UUID> uuids) { ... }

                public boolean isUsable(Coupon coupon) {
                    return !coupon.used() && coupon.expiresAt().isAfter(clock.instant());
                }

                public String issueCode() {
                    return "CPN-" + uuids.get().toString().substring(0, 8);
                }
            }
            ```

            ```java
            private static final Instant EXPIRES_AT = Instant.parse("2026-10-01T00:00:00Z");

            @Test
            void shouldBeUsableOneSecondBeforeExpiry() {
                CouponService service = serviceAt(EXPIRES_AT.minusSeconds(1));
                assertThat(service.isUsable(couponExpiringAt(EXPIRES_AT))).isTrue();
            }

            @Test
            void shouldNotBeUsableExactlyAtExpiry() {
                CouponService service = serviceAt(EXPIRES_AT);
                assertThat(service.isUsable(couponExpiringAt(EXPIRES_AT))).isFalse();
            }
            ```

            발급 코드는 **값이 아니라 규칙**을 시험한다 —
            `CPN-`으로 시작하는지, 길이가 12자인지, 같은 `Supplier`를 주면 같은 값이 나오는지.
            난수 자체를 단언하려 들면 테스트가 구현을 베끼게 된다.
          selfChecks:
            - 두 자리를 모두 찾았는가
            - 주입받는 구조로 바꿨는가
            - 만료 경계를 양쪽으로 잡았는가
            - 난수는 값이 아니라 규칙을 시험했는가
      - key: LESSON.TESTING.UNIT_TEST_DESIGN.001.U3
        title: 한 테스트는 한 가지만 말한다
        minutes: 10
        core: false
        explain: |-
          테스트가 실패했을 때 **로그를 안 읽고도 원인을 알 수 있으면** 좋은 테스트다.
          그러려면 하나가 하나만 말해야 한다.

          긴 테스트는 대개 이렇게 생겼다.

          ```java
          @Test
          void testOrder() {
              // 주문 생성 확인
              // 재고 차감 확인
              // 쿠폰 사용 확인
              // 알림 발송 확인
          }
          ```

          중간에서 실패하면 **뒤쪽은 아예 돌지 않는다.** 재고가 틀렸는지
          쿠폰이 틀렸는지는 고치고 다시 돌려야 안다.

          쪼개는 기준은 **단언이 아니라 이유**다. 한 가지 이유로 깨지는 단언들은
          같이 있어도 된다. 다른 이유로 깨지면 나눈다.

          그리고 이름이 절반이다. `testOrder`는 실패해도 아무것도 안 알려 주지만
          `shouldDecreaseStockWhenOrderIsPlaced`는 **이름만으로 원인 후보가 좁아진다.**
        example:
          language: java
          code: |-
            // 한 덩어리 — 실패하면 어디인지 모른다
            @Test
            void testOrder() {
                Order order = service.place(request, MEMBER_ID);
                assertThat(order.status()).isEqualTo("PLACED");
                assertThat(stockRepository.findByCode("KB-01").available()).isEqualTo(1);
                assertThat(couponRepository.findByCode("W10").used()).isTrue();
            }

            // 이유별로 나눈 것
            @Test
            void shouldPlaceOrderWithPlacedStatus() { ... }

            @Test
            void shouldDecreaseStockWhenOrderIsPlaced() { ... }

            @Test
            void shouldMarkCouponUsedWhenOrderIsPlaced() { ... }
          output: |-
            재고 차감이 깨졌을 때 보이는 것

            [한 덩어리]  testOrder FAILED
                        expected 1 but was 3   ← 무엇의 1인지 읽어야 안다

            [나눈 것]    shouldPlaceOrderWithPlacedStatus      초록
                        shouldDecreaseStockWhenOrderIsPlaced  빨강  ← 이름이 원인을 말한다
                        shouldMarkCouponUsedWhenOrderIsPlaced 초록  ← 쿠폰은 멀쩡하다
          note: |-
            - 나눈 쪽은 **멀쩡한 것도 알려 준다** — 쿠폰은 문제가 아니라는 정보다
            - 한 덩어리는 중간에서 멈춰 쿠폰이 맞는지조차 모른다
            - 이름이 `should…When…` 형태라 **조건과 기대**가 다 들어 있다
            - 준비 코드가 겹치면 그것은 헬퍼 메서드로 뺀다. 테스트를 합칠 이유가 아니다
        predict:
          question: 세 단언을 한 테스트에 두고 재고가 깨졌다면, 쿠폰 처리가 맞는지 알 수 있나?
          choices:
            - 알 수 없다 — 그 줄에 닿기 전에 멈춘다
            - 알 수 있다
            - 쿠폰도 함께 실패한다
            - 경고만 난다
          answer: 알 수 없다 — 그 줄에 닿기 전에 멈춘다
          explanation: |-
            단언이 실패하면 그 자리에서 예외가 나고 뒤는 실행되지 않는다.
            그래서 한 번 돌릴 때마다 **하나씩만** 알게 되고, 고치고 돌리기를 반복하게 된다.
            나눠 두면 한 번에 전부 알 수 있다.
        complete:
          question: 실패 원인이 이름에 드러나게 고치세요.
          code: |-
            @Test
            void testCancel() { ... }
            →
            @Test
            void ___RejectCancel___OrderIsAlreadyShipped() { ... }
          answers:
            - [should]
            - [When]
          explanation: |-
            `should…When…` 은 **기대와 조건**을 한 이름에 담는다.
            실패 목록만 훑어도 무엇이 깨졌는지 알 수 있어, 로그를 열기 전에 후보가 좁아진다.
        problem:
          prompt: |-
            아래 테스트를 이유별로 나누세요.

            ```java
            @Test
            void testPlaceOrder() {
                OrderResponse response = service.place(request, MEMBER_ID);
                assertThat(response.orderId()).isNotNull();
                assertThat(response.status()).isEqualTo("PLACED");
                assertThat(response.totalAmount()).isEqualTo(78_000);
                assertThat(stockOf("KB-01")).isEqualTo(1);
                assertThat(events()).hasSize(1);
            }
            ```

            - 다섯 단언을 **깨지는 이유별로** 묶고, 몇 개로 나눌지 정하세요
            - 나눈 각각에 이름을 붙이세요
            - 준비 코드가 겹치면 어떻게 할지 적으세요 (합치는 것이 답은 아닙니다)
            - 나눈 뒤 **재고 계산이 깨졌을 때 보이는 결과**를 적으세요
          deliverables:
            - 이유별 묶음과 나눈 개수
            - 테스트 이름
            - 겹치는 준비 코드를 다루는 방법
            - 재고가 깨졌을 때의 실행 결과
          hints:
            - 같은 코드가 깨지면 함께 빨강이 되는 단언끼리 묶습니다.
            - 응답 필드 셋은 대개 한 가지 이유로 함께 깨집니다.
            - 준비 코드는 헬퍼로 빼면 됩니다.
          modelAnswer: |-
            | 묶음 | 단언 | 깨지는 이유 |
            |---|---|---|
            | 1 | `orderId`, `status`, `totalAmount` | 주문 생성·응답 매핑 |
            | 2 | `stockOf("KB-01")` | 재고 차감 |
            | 3 | `events()` | 이벤트 발행 |

            **세 개로 나눈다.** 응답 필드 셋은 한 가지 이유(생성·매핑)로 함께 깨지므로
            한 테스트에 둬도 된다.

            ```java
            @Test void shouldReturnPlacedOrderWhenOrderIsPlaced() { ... }
            @Test void shouldDecreaseStockWhenOrderIsPlaced() { ... }
            @Test void shouldPublishOrderPlacedEventWhenOrderIsPlaced() { ... }
            ```

            겹치는 준비 코드는 **헬퍼 메서드**로 뺀다.
            ```java
            private OrderResponse placeDefaultOrder() {
                return service.place(defaultRequest(), MEMBER_ID);
            }
            ```
            합치면 실패 원인이 다시 뭉개지므로, 겹침은 합칠 이유가 아니라 **뺄 이유**다.

            재고 계산이 깨지면 —
            ```text
            shouldReturnPlacedOrderWhenOrderIsPlaced       초록
            shouldDecreaseStockWhenOrderIsPlaced           빨강
            shouldPublishOrderPlacedEventWhenOrderIsPlaced 초록
            ```
            이름 한 줄로 원인이 정해지고, **나머지 둘이 멀쩡하다는 것까지** 알게 된다.
          selfChecks:
            - 깨지는 이유로 묶었는가 (단언 개수가 아니라)
            - 이름에 조건과 기대가 들어 있는가
            - 겹치는 준비를 헬퍼로 뺐는가
            - 실패했을 때 무엇이 보이는지 적어 봤는가
    commonMistakes:
      - 성공 경로만 여럿 쓴다. 초록은 늘지만 구현을 망가뜨려도 그대로 초록이다 (U1)
      - 코드가 `Instant.now()`를 직접 부른다. 시간 경계를 시험할 방법이 없어진다 (U2)
      - 한 테스트에 여러 이유의 단언을 넣는다. 중간에서 멈춰 나머지를 모른다 (U3)
    inProject: |-
      주문 시스템에서 테스트를 붙일 첫 자리는 **경계가 있는 계산**이다 —
      수량 검사, 페이지 자르기, 쿠폰 만료, 재고 차감.
      시간을 보는 곳은 전부 `Clock`을 주입받게 만들고,
      테스트를 쓴 뒤에는 구현을 한 칸 망가뜨려 빨강이 되는지 확인한다.
      빨강이 안 되면 그 테스트는 아직 아무것도 지키지 않는다.
    sources:
      - title: JUnit 5 User Guide — Writing Tests
        url: https://docs.junit.org/current/user-guide/
        versionScope: JUnit 5/6
      - title: Java SE API — java.time.Clock
        url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/time/Clock.html
        versionScope: Java SE 21+
      - title: Spring Boot — Testing
        url: https://docs.spring.io/spring-boot/reference/testing/index.html
        versionScope: Spring Boot 3.x+
    verifiedAt: 2026-09-25

  - key: LESSON.TESTING.TEST_DOUBLE.001
    skillCode: TESTING.TEST_DOUBLE
    title: 진짜 대신 무엇을 끼울까 (테스트 더블)
    whyItMatters: |-
      결제 서버를 진짜로 부르는 테스트는 느리고 가끔 실패하고 돈이 든다.
      그래서 가짜를 끼우는데, **무엇을 가짜로 둘지 잘못 고르면**
      테스트가 구현을 베끼게 되어 리팩터링할 때마다 깨진다.
      고치기만 하면 테스트가 깨지는 상황이 오면 사람들은 테스트를 지우기 시작한다.
    oneLine: 테스트 더블은 stub·mock·fake로 나뉘고, 바깥 세계만 대체하며 내 도메인은 진짜로 둔다.
    units:
      - key: LESSON.TESTING.TEST_DOUBLE.001.U1
        title: stub · mock · fake 가르기
        minutes: 12
        core: true
        explain: |-
          셋 다 "진짜 대신 끼우는 것"인데 **무엇을 확인하느냐**가 다르다.

          | 종류 | 하는 일 | 무엇을 확인하나 |
          |---|---|---|
          | **stub** | 정해진 값을 돌려준다 | **결과** — 그래서 무엇이 나왔나 |
          | **mock** | 호출을 기록한다 | **호출** — 불렸나, 몇 번, 어떤 인자로 |
          | **fake** | 진짜처럼 동작하는 가벼운 구현 | 결과 (진짜에 가깝게) |

          고르는 기준은 **그 협력이 결과에 드러나는가**다.

          재고 조회는 결과에 드러난다 → 값을 정해 주면 되므로 **stub**.
          알림 발송은 결과에 안 드러난다 → 보냈는지 자체가 확인 대상이라 **mock**.
          저장소는 넣고 꺼내는 동작이 필요하다 → **fake**(메모리 지도)가 편하다.

          자주 하는 실수는 **전부 mock으로 두고 호출을 단언하는 것**이다.
          그러면 테스트가 "어떻게 구현했는지"를 고정해 버려,
          같은 결과를 내는 다른 구현으로 바꿔도 빨강이 된다.
        example:
          language: java
          code: |-
            @Test
            void shouldPlaceOrderAndNotify() {
                // stub — 결과에 드러나므로 값만 정해 준다
                StockRepository stock = mock(StockRepository.class);
                when(stock.findByCode("KB-01")).thenReturn(Optional.of(new Stock("KB-01", 3)));

                // mock — 보냈는지 자체가 확인 대상이다
                NotificationClient notifications = mock(NotificationClient.class);

                // fake — 넣고 꺼내는 동작이 필요하다
                OrderRepository orders = new InMemoryOrderRepository();

                OrderService service = new OrderService(stock, orders, notifications, FIXED_CLOCK);
                OrderResponse response = service.place(request("KB-01", 2), MEMBER_ID);

                assertThat(response.status()).isEqualTo("PLACED");          // 결과
                assertThat(orders.findById(response.orderId())).isPresent(); // 결과
                verify(notifications).send(MEMBER_ID, "주문이 접수됐습니다");    // 호출
            }
          output: |-
            셋의 역할

            stock          값만 돌려준다. 어떻게 불렸는지는 단언하지 않는다
            orders (fake)  진짜처럼 저장되고 꺼내진다. 결과로 확인한다
            notifications  보냈는지를 verify 로 확인한다. 값이 없기 때문이다
          note: |-
            - 단언 세 줄 중 **둘이 결과**고 하나만 호출이다. 이 비율이 건강하다
            - `stock`은 `verify`하지 않았다 — 몇 번 불렸는지는 우리 관심이 아니다
            - 저장소를 mock으로 두면 `findById`가 안 되므로 fake가 편하다
            - 알림은 결과에 안 남으므로 `verify` 말고는 확인할 길이 없다
        predict:
          question: '`verify(stock, times(1)).findByCode("KB-01")` 를 추가하면 무엇이 나빠지나?'
          choices:
            - 조회를 한 번 더 하도록 고치기만 해도 테스트가 깨진다
            - 더 꼼꼼해져서 좋다
            - 실행이 느려진다
            - 아무 차이 없다
          answer: 조회를 한 번 더 하도록 고치기만 해도 테스트가 깨진다
          explanation: |-
            결과는 그대로인데 **구현 방식만 바뀌어도 빨강**이 된다.
            이런 테스트가 쌓이면 리팩터링할 때마다 테스트를 고치게 되고,
            결국 테스트가 변경을 막는 짐이 된다.
            **결과로 확인할 수 있으면 호출을 단언하지 않는다.**
        complete:
          question: 협력마다 알맞은 더블을 고르세요.
          code: |-
            // 재고를 조회해 계산에 쓴다 → 결과에 드러난다
            StockRepository stock = ___(StockRepository.class);
            when(stock.findByCode("KB-01")).thenReturn(Optional.of(new Stock("KB-01", 3)));

            // 메일을 보낸다 → 결과에 안 드러난다
            MailClient mail = mock(MailClient.class);
            // ...
            ___(mail).send(eq("a@example.invalid"), anyString());
          answers:
            - [mock]
            - [verify]
          explanation: |-
            Mockito에서는 stub도 `mock(...)`으로 만들고, **`when`으로 값을 정하면 stub,
            `verify`로 호출을 확인하면 mock**처럼 쓰는 것이다.
            도구가 아니라 **무엇을 확인하느냐**가 종류를 정한다.
        problem:
          prompt: |-
            주문 취소 서비스의 테스트에서 협력 객체 넷에 각각 무엇을 쓸지 정하세요.

            ```java
            OrderService(OrderRepository orders,       // 주문을 찾고 상태를 바꾼다
                         StockRepository stocks,       // 재고를 되돌린다
                         RefundClient refunds,         // 외부 환불 요청
                         AuditLogger audit)            // 취소 이력을 남긴다
            ```

            - 넷에 stub / mock / fake 중 무엇을 쓸지 정하고 **이유**를 적으세요
            - 그중 **호출을 단언해야 하는 것**과 **결과로 확인할 수 있는 것**을 가르세요
            - 넷을 전부 mock으로 두고 `verify`만 쓰면 무엇이 나빠지는지 적으세요
            - `RefundClient`가 실패했을 때의 테스트는 어떻게 쓸지도 적으세요
          deliverables:
            - 협력별 더블과 이유
            - 호출 단언 / 결과 확인 구분
            - 전부 mock일 때의 문제
            - 환불 실패 테스트 방법
          hints:
            - 그 협력의 효과가 단언할 수 있는 값으로 남는지 물어보세요.
            - 외부 호출은 대개 결과에 안 남습니다.
            - 실패를 만들려면 stub이 예외를 던지게 하면 됩니다.
          modelAnswer: |-
            | 협력 | 더블 | 이유 |
            |---|---|---|
            | `OrderRepository` | **fake** | 찾고 바꾼 결과를 다시 꺼내 확인해야 한다 |
            | `StockRepository` | **fake** | 되돌린 수량이 결과로 드러난다 |
            | `RefundClient` | **mock** | 외부 호출이라 결과에 안 남는다. 불렀는지가 확인 대상 |
            | `AuditLogger` | **mock** | 같은 이유 |

            **결과로 확인**: 주문 상태가 `CANCELLED`인지, 재고가 되돌아왔는지.
            **호출로 확인**: 환불을 불렀는지, 이력을 남겼는지.

            넷을 전부 mock으로 두면 `orders.findById`가 빈 값을 돌려줘
            **취소 자체가 안 되고**, 어쩔 수 없이 `verify(orders).save(any())` 같은
            호출 단언만 남는다. 그러면 테스트가 "save를 부른다"는 구현을 고정해,
            변경 감지로 바꾸는 순간 전부 빨강이 된다.

            환불 실패 테스트 —
            ```java
            doThrow(new RefundFailedException("timeout"))
                    .when(refunds).refund(anyLong(), anyInt());

            assertThatThrownBy(() -> service.cancel(ORDER_ID, MEMBER_ID))
                    .isInstanceOf(RefundFailedException.class);
            assertThat(orders.findById(ORDER_ID).orElseThrow().status())
                    .isEqualTo("PLACED");     // 롤백돼 상태가 안 바뀌었다
            ```
            **실패했을 때 무엇이 남지 않는지**까지 결과로 확인한다.
          selfChecks:
            - 협력마다 이유를 대고 골랐는가
            - 결과로 확인할 수 있는 것에 verify를 쓰지 않았는가
            - 저장소를 fake로 두었는가
            - 실패 경로에서 남은 상태까지 확인했는가
      - key: LESSON.TESTING.TEST_DOUBLE.001.U2
        title: 어디까지 가짜로 둘까
        minutes: 12
        core: true
        explain: |-
          가짜를 많이 끼울수록 테스트는 빨라지지만 **진짜와 멀어진다.**
          전부 가짜인 테스트는 초록인데 운영에서 터질 수 있다.

          경계는 하나로 정한다 — **바깥 세계만 가짜로 둔다.**

          | 대상 | 진짜 / 가짜 |
          |---|---|
          | 내 도메인 객체 (`Order`, `Stock`) | **진짜** |
          | 내 순수 규칙 클래스 | **진짜** |
          | 저장소 | fake 또는 진짜 DB (다음 노트) |
          | 외부 API, 메일, 알림 | **가짜** |
          | 시간, 난수 | 주입해서 고정 |

          도메인 객체를 mock으로 두는 것이 특히 나쁘다.
          `when(order.isCancellable()).thenReturn(true)` 라고 쓰면
          **그 판단이 맞는지는 아무도 시험하지 않는다.** 규칙을 가짜로 덮은 것이다.

          가짜가 진짜와 달라지는 것도 위험하다. fake 저장소가 중복 키를 안 막는데
          진짜 DB는 막는다면, 그 차이는 운영에서 처음 드러난다.
          그래서 **fake에도 진짜의 중요한 제약은 넣어 둔다.**
        example:
          language: java
          code: |-
            // 나쁜 예 — 도메인 규칙을 가짜로 덮었다
            Order order = mock(Order.class);
            when(order.isCancellable()).thenReturn(true);
            // 이 테스트는 isCancellable 이 틀려도 초록이다

            // 좋은 예 — 도메인은 진짜, 바깥만 가짜
            Order order = Order.placed(MEMBER_ID, 78_000, FIXED_TIME);
            RefundClient refunds = mock(RefundClient.class);

            // fake 에도 진짜의 제약을 넣는다
            class InMemoryOrderRepository implements OrderRepository {
                private final Map<Long, Order> rows = new HashMap<>();

                @Override public Order save(Order order) {
                    if (order.id() != null && rows.containsKey(order.id())) {
                        throw new DuplicateKeyException("id " + order.id());  // 진짜처럼
                    }
                    rows.put(order.id(), order);
                    return order;
                }
            }
          output: |-
            도메인을 mock으로 둔 테스트

            isCancellable 구현을 통째로 망가뜨림  →  여전히 초록
            (그 메서드는 테스트에서 한 번도 실행되지 않는다)

            도메인을 진짜로 둔 테스트

            isCancellable 구현을 망가뜨림        →  빨강
          note: |-
            - 도메인을 mock으로 두면 **규칙이 시험 범위에서 빠진다**
            - 진짜 객체를 쓰면 규칙이 함께 시험된다. 느려지지도 않는다
            - fake에 중복 키 검사를 넣어 **진짜와 벌어지는 틈**을 줄였다
            - 외부 호출(`RefundClient`)만 가짜다. 여기가 경계다
        predict:
          question: fake 저장소가 중복 키를 안 막고 진짜 DB는 막을 때, 언제 차이가 드러나나?
          choices:
            - 운영이나 통합 테스트에서 처음 드러난다
            - 단위 테스트에서 바로 드러난다
            - 컴파일 때 드러난다
            - 드러나지 않는다
          answer: 운영이나 통합 테스트에서 처음 드러난다
          explanation: |-
            단위 테스트는 전부 초록인데 실제로는 제약 위반이 난다.
            **가짜와 진짜가 벌어진 만큼이 그대로 사각지대**다.
            그래서 fake에는 진짜의 중요한 제약을 넣고,
            그래도 남는 차이는 실제 DB로 돌리는 테스트로 덮는다(다음 노트).
        complete:
          question: 가짜로 둘 경계를 정하세요.
          code: |-
            Order order = Order.placed(MEMBER_ID, 78_000, FIXED_TIME);   // 도메인은 ___
            RefundClient refunds = mock(RefundClient.class);              // 바깥은 ___
          answers:
            - [진짜, 진짜다]
            - [가짜, 가짜다]
          explanation: |-
            **내 도메인은 진짜, 바깥 세계는 가짜.** 이 한 줄이 경계다.
            도메인을 가짜로 두면 규칙이 시험되지 않고, 바깥을 진짜로 두면 느리고 흔들린다.
        problem:
          prompt: |-
            아래 테스트는 가짜를 너무 많이 쓰고 있다.

            ```java
            @Test
            void shouldCancelOrder() {
                Order order = mock(Order.class);
                when(order.isCancellable()).thenReturn(true);
                when(order.memberId()).thenReturn(MEMBER_ID);
                OrderRepository orders = mock(OrderRepository.class);
                when(orders.findById(1L)).thenReturn(Optional.of(order));

                service.cancel(1L, MEMBER_ID);

                verify(order).cancel();
                verify(orders).save(order);
            }
            ```

            - 이 테스트가 **시험하지 않는 것**을 두 가지 적으세요
            - 도메인을 진짜로 바꾸고 저장소를 fake로 바꿔 다시 쓰세요
            - 다시 쓴 테스트가 **어떤 버그를 새로 잡게 되는지** 적으세요
            - fake 저장소에 넣어 둘 진짜의 제약을 하나 고르세요
          deliverables:
            - 시험하지 않는 것 두 가지
            - 다시 쓴 테스트
            - 새로 잡게 되는 버그
            - fake에 넣을 제약
          hints:
            - mock으로 덮은 메서드는 실행되지 않습니다.
            - verify(save)를 단언하면 저장 방식을 바꿀 수 없게 됩니다.
            - 취소 상태가 실제로 바뀌었는지는 어떻게 확인할까요?
          modelAnswer: |-
            시험하지 않는 것 —
            **① `isCancellable()`의 판단 로직** (mock이 true를 돌려줘 실행되지 않는다)
            **② 취소 뒤 실제 상태가 `CANCELLED`가 되는지** (`verify(order).cancel()`은
            불렸다는 것만 말하고 결과를 말하지 않는다)

            ```java
            @Test
            void shouldCancelOrderWhenItIsPlaced() {
                InMemoryOrderRepository orders = new InMemoryOrderRepository();
                Order placed = orders.save(Order.placed(MEMBER_ID, 78_000, FIXED_TIME));
                OrderService service = new OrderService(orders, refunds, FIXED_CLOCK);

                service.cancel(placed.id(), MEMBER_ID);

                assertThat(orders.findById(placed.id()).orElseThrow().status())
                        .isEqualTo(OrderStatus.CANCELLED);
            }
            ```

            새로 잡게 되는 버그 — **`isCancellable`이 상태를 잘못 보는 경우**와
            **`cancel()`이 상태를 안 바꾸는 경우**. 앞 테스트는 둘 다 초록이었다.
            그리고 `verify(orders).save(...)`를 뺐으므로,
            변경 감지로 바꿔도 이 테스트는 그대로 초록이다.

            fake에 넣을 제약 — **없는 id로 `findById`하면 빈 값**을 돌려주는 것.
            진짜 저장소가 그렇게 동작하므로 fake도 같아야
            "없는 주문 취소" 테스트가 의미를 갖는다.
          selfChecks:
            - mock으로 덮여 실행되지 않던 것을 찾았는가
            - 도메인을 진짜 객체로 바꿨는가
            - 호출 단언을 결과 단언으로 바꿨는가
            - fake에 진짜의 제약을 하나 넣었는가
      - key: LESSON.TESTING.TEST_DOUBLE.001.U3
        title: 깨지기 쉬운 테스트 알아보기
        minutes: 10
        core: false
        explain: |-
          **고치기만 하면 깨지는 테스트**는 없는 것보다 나쁠 때가 있다.
          고칠 때마다 손이 가고, 결국 사람들이 테스트를 믿지 않게 된다.

          깨지기 쉬운 테스트에는 표가 있다.

          | 표 | 왜 깨지나 |
          |---|---|
          | `verify`가 단언의 절반 이상 | 구현 방식을 고정한다 |
          | `any()` 대신 정확한 인자를 전부 지정 | 인자 하나만 늘어도 깨진다 |
          | 내부 메서드 호출을 단언 | private에 가까운 것을 고정한다 |
          | 문자열 전체 일치 | 문구를 다듬으면 깨진다 |
          | `verifyNoMoreInteractions` | 호출이 하나만 늘어도 깨진다 |

          고치는 방향은 하나다 — **무엇을 했는가 대신 무엇이 되었는가를 단언한다.**

          다만 진짜로 호출을 단언해야 할 때가 있다.
          **결과에 아무 흔적이 없는 것**(메일 발송, 외부 호출)이다.
          그때도 인자는 꼭 필요한 것만 지정하고 나머지는 `any()`로 둔다.
        example:
          language: java
          code: |-
            // 깨지기 쉬움 — 구현을 고정한다
            verify(orders).findById(1L);
            verify(stocks).findByCode("KB-01");
            verify(orders).save(argThat(o -> o.status() == CANCELLED));
            verifyNoMoreInteractions(orders, stocks);

            // 잘 견딤 — 결과를 단언하고, 흔적 없는 것만 호출로 본다
            assertThat(orders.findById(1L).orElseThrow().status()).isEqualTo(CANCELLED);
            assertThat(stocks.findByCode("KB-01").orElseThrow().available()).isEqualTo(3);
            verify(refunds).refund(eq(1L), anyInt());     // 결과에 안 남는 것만
          output: |-
            조회를 캐시에서 가져오도록 리팩터링했을 때

            [깨지기 쉬운 쪽]  verify(orders).findById(1L)         빨강
                            verifyNoMoreInteractions            빨강
                            → 동작은 그대로인데 테스트를 고쳐야 한다

            [잘 견디는 쪽]   전부 초록
                            → 결과가 같으므로 통과한다
          note: |-
            - 아래쪽은 `verify`가 **한 줄뿐**이고 그것도 결과에 안 남는 것이다
            - 인자를 `eq(1L), anyInt()`로 둬 **꼭 필요한 것만** 고정했다
            - `verifyNoMoreInteractions`는 거의 언제나 짐이 된다
            - 리팩터링해도 초록이면 그 테스트는 **동작을 지키고 있는 것**이다
        predict:
          question: 테스트를 안 고치고 리팩터링할 수 있다면 그 테스트는?
          choices:
            - 구현이 아니라 동작을 지키고 있는 것이다
            - 너무 느슨한 것이다
            - 아무것도 안 잡는 것이다
            - 우연이다
          answer: 구현이 아니라 동작을 지키고 있는 것이다
          explanation: |-
            테스트의 목적은 **바꿔도 되는 것과 바꾸면 안 되는 것을 갈라 주는 것**이다.
            리팩터링에서 깨지면 그 선이 잘못 그어진 것이고,
            동작이 바뀔 때만 깨지면 제대로 그어진 것이다.
        complete:
          question: 깨지기 쉬운 단언을 결과 단언으로 바꾸세요.
          code: |-
            verify(orders).save(argThat(o -> o.status() == CANCELLED));
            →
            ___(orders.findById(1L).orElseThrow().status()).isEqualTo(CANCELLED);
          answers:
            - [assertThat]
          explanation: |-
            **"save를 불렀다"가 아니라 "상태가 CANCELLED다"** 를 단언한다.
            저장 방식을 바꿔도(변경 감지, 다른 메서드) 결과가 같으면 통과한다.
        problem:
          prompt: |-
            팀의 테스트 중 **리팩터링할 때 깨졌던 것** 하나를 떠올리거나, 아래를 쓰세요.

            ```java
            verify(repository).findById(1L);
            verify(repository).save(any());
            verify(mapper).toResponse(any());
            verifyNoMoreInteractions(repository, mapper);
            ```

            - 이 테스트가 **고정하고 있는 구현 결정**을 세 가지 적으세요
            - 각각을 **결과 단언으로 바꿀 수 있는지** 판단하세요. 못 바꾸는 것이 있다면 왜인지도
            - 다시 쓴 테스트를 적으세요
            - 앞으로 `verify`를 쓸지 말지 정하는 **나만의 기준**을 한 줄로 쓰세요
          deliverables:
            - 고정하고 있는 구현 결정 세 가지
            - 결과 단언으로 바꿀 수 있는지의 판단
            - 다시 쓴 테스트
            - verify를 쓸지 정하는 기준 한 줄
          hints:
            - '"이걸 다르게 구현하면 깨지나?"를 각 줄마다 물어보세요.'
            - mapper 호출은 응답 값으로 확인할 수 있습니다.
            - 기준은 "결과에 흔적이 남는가"로 정하면 간단합니다.
          modelAnswer: |-
            고정하고 있는 것 —
            **① 저장소에서 `findById`로 찾는다** (캐시나 다른 조회로 못 바꾼다)
            **② `save`를 명시적으로 부른다** (변경 감지로 못 바꾼다)
            **③ 별도 mapper로 변환한다** (생성자나 정적 팩터리로 못 바꾼다)

            셋 다 **결과 단언으로 바꿀 수 있다.** 모두 결과에 흔적이 남기 때문이다.

            ```java
            @Test
            void shouldReturnCancelledOrderWhenCancelSucceeds() {
                Order placed = orders.save(Order.placed(MEMBER_ID, 78_000, FIXED_TIME));

                OrderResponse response = service.cancel(placed.id(), MEMBER_ID);

                assertThat(response.status()).isEqualTo("CANCELLED");                  // ③
                assertThat(orders.findById(placed.id()).orElseThrow().status())
                        .isEqualTo(OrderStatus.CANCELLED);                              // ①②
            }
            ```

            기준 한 줄 — **그 협력의 효과가 결과에 남으면 `assertThat`,
            남지 않으면(메일·외부 호출·로그) `verify`.**

            이 기준이면 `verify`가 테스트당 0~1개로 줄고,
            리팩터링에서 깨지는 일이 거의 없어진다.
          selfChecks:
            - 각 줄이 무엇을 고정하는지 말할 수 있는가
            - 결과에 흔적이 남는 것을 assertThat으로 바꿨는가
            - verify가 테스트당 1개 이하로 줄었는가
            - 기준을 한 줄로 말할 수 있는가
    commonMistakes:
      - 도메인 객체를 mock으로 둔다. 그 규칙이 테스트 범위에서 통째로 빠진다 (U2)
      - 결과로 확인할 수 있는 것에 `verify`를 쓴다. 구현을 고정해 리팩터링에서 깨진다 (U1)
      - fake가 진짜의 제약을 안 지킨다. 그 차이만큼이 그대로 사각지대가 된다 (U2)
    inProject: |-
      주문 시스템에서 가짜로 둘 것은 **결제·알림 같은 외부 호출 하나뿐**이다.
      `Order`·`Stock` 같은 도메인은 진짜로 두고, 저장소는 메모리 fake를 만들되
      진짜의 제약(없는 id는 빈 값, 중복 키는 예외)을 넣어 둔다.
      테스트당 `verify`는 0~1개를 넘지 않게 하고, 넘으면 결과로 바꿀 수 있는지 먼저 본다.
