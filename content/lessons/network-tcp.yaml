# DevPilot 개념 노트 — 연결이 안 될 때 어디를 보나
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 0단계(환경과 첫 API)에서 쓴다. 기동은 됐는데 안 붙을 때 보는 노트다
# - 예제는 주문 시스템 상황으로 쓴다 (CV-134)
lessons:
  - key: LESSON.NETWORK.TCP_IP.001
    skillCode: NETWORK.TCP_IP
    title: 연결이 안 될 때 어디를 보나 (TCP와 포트)
    whyItMatters: |-
      "안 돼요"라는 말은 한 가지가 아니다. **주소를 못 찾은 것**, **연결을 거절당한 것**,
      **연결은 됐는데 답이 없는 것**은 원인도 고칠 곳도 전부 다르다.
      이것을 못 나누면 남의 서버를 붙들고 내 코드를 고치거나, 방화벽 문제를 코드로 풀려 한다.
      오류 메시지 한 줄로 어느 갈래인지 가르는 것이 디버깅의 절반이다.
    oneLine: 연결 실패는 주소 못 찾음·거절당함·답 없음 셋 중 하나이고, 메시지가 어느 쪽인지 알려 준다.
    units:
      - key: LESSON.NETWORK.TCP_IP.001.U1
        title: 세 가지 실패를 메시지로 가르기
        minutes: 12
        core: true
        explain: |-
          클라이언트가 서버에 붙기까지 세 관문이 있고, 각 관문에서 다른 오류가 난다.

          | 관문 | 하는 일 | 실패하면 |
          |---|---|---|
          | 1 이름 → 주소 | `db.example.com`을 IP로 | `UnknownHostException` |
          | 2 연결 맺기 | 그 IP의 그 포트로 손을 내밀기 | `Connection refused` / 연결 타임아웃 |
          | 3 주고받기 | 요청 보내고 답 기다리기 | 읽기 타임아웃 |

          2번 안에서도 둘로 갈린다. **거절(refused)** 은 그 주소까지는 갔는데
          그 포트에서 아무도 듣고 있지 않다는 뜻이고 — 대개 **서버가 안 떠 있다.**
          **연결 타임아웃**은 손을 내밀었는데 아무 대답이 없는 것이고 — 대개
          **중간에서 막혀 있다**(방화벽·보안그룹).

          거절은 빠르게, 타임아웃은 느리게 온다. **실패에 걸린 시간**도 단서다.
        example:
          language: text
          code: |-
            # 1) 서버가 그 포트를 듣고 있나
            $ ss -ltnp | grep 8080
            LISTEN 0  4096  *:8080  *:*  users:(("java",pid=2317,fd=12))

            # 2) 거기까지 갈 수 있나 (거절은 즉시 온다)
            $ curl -v --max-time 5 http://localhost:9999/orders
            *   Trying 127.0.0.1:9999...
            * connect to 127.0.0.1 port 9999 failed: Connection refused

            # 3) 갈 수는 있는데 답이 없다 (타임아웃까지 기다린다)
            $ curl -v --max-time 5 http://10.0.5.20:8080/orders
            *   Trying 10.0.5.20:8080...
            * Operation timed out after 5001 milliseconds
          output: |-
            해석
            1) LISTEN 줄이 있다 → 서버는 떠 있다
            2) 0.01초 만에 refused → 그 포트에 아무도 없다 (포트 번호를 틀렸다)
            3) 5초를 다 쓰고 실패 → 패킷이 중간에서 버려진다 (방화벽)
          note: |-
            - `ss -ltnp`의 `-l`은 듣고 있는 것, `-t`는 TCP, `-n`은 이름 대신 번호로
            - `*:8080`은 모든 주소에서 듣는다는 뜻. `127.0.0.1:8080`이면 **바깥에서는 못 붙는다**
            - refused가 0.01초면 방화벽이 아니다. 방화벽은 대개 조용히 버린다
            - 세 줄을 순서대로 해 보면 어디서 끊겼는지 한 번에 좁혀진다
        predict:
          question: "`ss -ltnp`에 `127.0.0.1:8080`으로 떠 있는데 다른 컴퓨터에서 붙으면 어떻게 되나?"
          choices:
            - 연결이 거절되거나 타임아웃된다 — 그 주소는 자기 자신만 쓸 수 있다
            - 정상적으로 붙는다
            - 포트가 자동으로 바뀐다
            - 서버가 죽는다
          answer: 연결이 거절되거나 타임아웃된다 — 그 주소는 자기 자신만 쓸 수 있다
          explanation: |-
            `127.0.0.1`은 **자기 컴퓨터 안에서만** 도는 주소다. 거기에 묶으면
            같은 컴퓨터의 curl은 되고 옆 컴퓨터는 안 된다.
            "내 PC에선 되는데 서버에선 안 돼요"의 흔한 원인 하나다.
        complete:
          question: 듣고 있는 포트를 확인하는 명령을 완성하세요.
          code: |-
            # TCP 중에 듣고 있는 것만, 이름 대신 번호로, 프로세스까지
            $ ss -___ | grep 8080

            # 그 포트에 실제로 붙어 보기 (5초 넘기면 포기)
            $ curl -v --___ 5 http://localhost:8080/orders
          answers:
            - [ltnp]
            - [max-time]
          explanation: |-
            `-l`(listening) `-t`(tcp) `-n`(numeric) `-p`(process)를 붙여 쓴다.
            `--max-time`이 없으면 막힌 주소에서 한참 매달려 있어 원인을 좁히기 어렵다.
        problem:
          prompt: |-
            주문 시스템을 띄워 놓고 **세 가지 실패를 일부러 하나씩** 만들어 보세요.

            - ① 안 듣고 있는 포트로 요청해 거절을 본다
            - ② 서버를 `127.0.0.1`에만 묶고, 다른 주소(`호스트 IP`)로 붙어 본다
            - ③ 응답을 일부러 10초 늦추는 끝점을 만들고 `--max-time 2`로 불러 본다
            - 각각의 **오류 메시지와 걸린 시간**을 적고, 그것만 보고 원인을 맞힐 수 있는지 쓰세요
          deliverables:
            - 세 경우의 명령·오류 메시지·걸린 시간
            - 메시지만 보고 원인을 가르는 기준 한 줄씩
            - ss 출력에서 바인딩 주소가 바뀐 것을 확인한 기록
          hints:
            - 바인딩 주소는 `server.address` 설정으로 바꿀 수 있습니다.
            - 응답을 늦추는 것은 끝점 안에서 잠깐 쉬게 하면 됩니다.
            - 걸린 시간을 재려면 명령 앞에 `time`을 붙여 보세요.
          modelAnswer: |-
            ```text
            ① $ time curl --max-time 5 http://localhost:9999/orders
               curl: (7) Failed to connect to localhost port 9999: Connection refused
               real 0m0.008s
               → 0.008초. 그 포트에 아무도 없다. 포트 번호나 기동 여부를 본다

            ② application.yml: server.address: 127.0.0.1
               $ ss -ltnp | grep 8080
               LISTEN 0 4096 127.0.0.1:8080 ...
               $ curl --max-time 5 http://192.168.0.31:8080/orders
               curl: (28) Operation timed out after 5001 milliseconds
               → ss에 이미 답이 있었다. 바인딩 주소부터 본다

            ③ @GetMapping("/slow") 안에서 10초 대기
               $ curl --max-time 2 http://localhost:8080/slow
               curl: (28) Operation timed out after 2001 milliseconds
               real 0m2.003s
               → ②와 메시지가 같다! 시간만으로는 못 가른다
            ```

            ②와 ③이 같은 메시지라는 것이 이 과제의 진짜 수확이다.
            가르는 방법은 **연결이 맺어졌는지**를 보는 것이다 — `curl -v`의
            `Connected to ...` 줄이 있으면 ③(답이 없다), 없으면 ②(못 붙었다)다.
            그래서 타임아웃을 하나로 두지 않고 **연결 타임아웃과 읽기 타임아웃을
            따로** 두는 것이 U2에서 할 일이다.
          selfChecks:
            - 세 경우의 메시지와 시간을 다 적었는가
            - ②와 ③의 메시지가 같다는 것을 확인했는가
            - curl -v의 Connected 줄로 둘을 갈랐는가
            - ss 출력에서 바인딩 주소가 바뀐 것을 봤는가
      - key: LESSON.NETWORK.TCP_IP.001.U2
        title: 타임아웃은 두 개다
        minutes: 12
        core: true
        explain: |-
          바깥 API를 부를 때 타임아웃을 **하나만** 두면 위험하다. 막는 지점이 둘이기 때문이다.

          | 타임아웃 | 무엇을 기다리는 시간 | 없으면 |
          |---|---|---|
          | 연결(connect) | 손을 내밀고 잡힐 때까지 | 막힌 주소에서 아주 오래 매달린다 |
          | 읽기(read) | 요청을 보낸 뒤 답이 올 때까지 | 느린 상대에게 스레드를 계속 준다 |

          둘 다 없을 때 무서운 것은 **내 서버가 같이 죽는다**는 점이다.
          바깥이 느려지면 요청마다 스레드가 붙들리고, 스레드가 동나면
          **아무 관계 없는 주문 조회까지** 안 된다. 남의 장애가 내 장애가 되는 경로다.

          값은 "넉넉히"가 아니라 **재시도와 같이** 정한다. 읽기 5초 + 1회 재시도는
          최악 10초가 넘고, 그 사이 스레드는 묶여 있다.
        example:
          language: java
          code: |-
            // 바깥 결제 API를 부르는 클라이언트
            @Bean
            RestClient paymentClient(RestClient.Builder builder) {
                var factory = new SimpleClientHttpRequestFactory();
                factory.setConnectTimeout(Duration.ofSeconds(2));   // 붙는 데 2초
                factory.setReadTimeout(Duration.ofSeconds(5));      // 답 기다리기 5초

                return builder
                        .baseUrl("https://payment.example.com")
                        .requestFactory(factory)
                        .build();
            }
          output: |-
            막힌 주소일 때   → 2초 뒤 ConnectException (연결 타임아웃)
            느린 상대일 때   → 5초 뒤 ResourceAccessException (읽기 타임아웃)
            설정이 없을 때   → 기본값이 무제한이라 끝까지 기다린다
          note: |-
            - 연결은 짧게(1~3초), 읽기는 그 API가 실제로 걸리는 시간을 보고 정한다
            - 둘을 같은 값으로 두면 "못 붙은 것"과 "느린 것"이 같은 시간에 실패해 안 갈린다
            - 타임아웃이 나면 **다시 걸어도 되는 요청인지**를 먼저 본다 (결제는 대개 아니다)
            - 이 프로젝트는 AI 호출에도 같은 이유로 타임아웃을 둔다
        predict:
          question: 읽기 타임아웃 없이 바깥 API를 부르는데 그 API가 갑자기 30초씩 걸리면?
          choices:
            - 요청마다 스레드가 묶여 결국 내 서버의 다른 기능도 안 된다
            - 그 API만 느려지고 나머지는 멀쩡하다
            - 자동으로 끊긴다
            - 응답이 캐시된다
          answer: 요청마다 스레드가 묶여 결국 내 서버의 다른 기능도 안 된다
          explanation: |-
            기다리는 동안 스레드는 아무것도 못 하고 붙들려 있다. 초당 몇 건만 들어와도
            풀이 금방 바닥난다. **남의 장애가 내 장애로 번지는 가장 흔한 길**이고,
            막는 첫 수단이 읽기 타임아웃이다.
        complete:
          question: 두 타임아웃을 설정하세요.
          code: |-
            var factory = new SimpleClientHttpRequestFactory();
            factory.set___(Duration.ofSeconds(2));   // 붙는 데까지
            factory.set___(Duration.ofSeconds(5));   // 답을 기다리는 동안
          answers:
            - [ConnectTimeout]
            - [ReadTimeout]
          explanation: |-
            이름이 그대로 두 관문을 가리킨다. 하나만 두면 다른 쪽이 무제한으로 남는다.
        problem:
          prompt: |-
            주문 시스템에서 **바깥 결제 API를 부르는 클라이언트**를 만들고 두 타임아웃을 확인하세요.

            - 연결 타임아웃 2초, 읽기 타임아웃 3초로 설정합니다
            - 막힌 주소(예: 라우팅되지 않는 IP)로 불러 **연결 타임아웃**을 실제로 보세요
            - 일부러 5초 걸리는 가짜 끝점을 만들어 **읽기 타임아웃**을 보세요
            - 두 경우의 예외 종류와 걸린 시간을 적고, 로그에 무엇을 남겨야 원인을 알 수 있을지 쓰세요
          deliverables:
            - 두 타임아웃을 설정한 클라이언트 코드
            - 연결·읽기 타임아웃 각각의 예외와 걸린 시간
            - 로그에 남길 항목 목록
          hints:
            - 라우팅되지 않는 주소를 쓰면 거절이 아니라 조용히 타임아웃이 납니다.
            - 가짜 끝점은 같은 프로젝트 안에 만들어도 됩니다.
            - 로그에 무엇을 남길지는 "이 줄만 보고 원인을 알 수 있나"로 판단하세요.
          modelAnswer: |-
            ```text
            연결 타임아웃 (10.255.255.1로 호출)
              ResourceAccessException: I/O error ... connect timed out
              real 0m2.03s

            읽기 타임아웃 (5초 걸리는 끝점 호출)
              ResourceAccessException: I/O error ... Read timed out
              real 0m3.02s
            ```

            둘 다 같은 예외 타입이고 **원인 메시지만 다르다**. 그래서 로그에
            예외 타입만 남기면 구분이 안 된다.

            남길 것:
            - 부른 곳 (어느 API의 어느 경로인지)
            - 두 타임아웃 설정값
            - 실제 걸린 시간
            - 원인 메시지 (`connect timed out` / `Read timed out`)
            - 요청 식별자 (여러 줄을 한 요청으로 묶기 위해)

            남기지 말 것: 요청 본문, 토큰, 결제 정보. **원인을 아는 데 필요 없고
            남으면 지울 수 없다.**

            걸린 시간을 남겨 두면 나중에 "3초가 짧았나"를 값으로 판단할 수 있다.
            느낌으로 타임아웃을 늘리는 일이 여기서 멈춘다.
          selfChecks:
            - 두 타임아웃을 각각 실제로 발생시켰는가
            - 두 경우의 예외와 걸린 시간을 적었는가
            - 두 예외가 같은 타입인 것을 확인했는가
            - 로그에 남기지 말아야 할 것을 골랐는가
      - key: LESSON.NETWORK.TCP_IP.001.U3
        title: 연결을 다시 쓰는 이유
        minutes: 10
        core: true
        explain: |-
          TCP 연결은 공짜가 아니다. 맺을 때마다 **왕복 한 번**(손 내밀고 → 받고 → 확인)이
          들고, HTTPS면 인증서 교환이 더 붙는다. 서울에서 도쿄면 왕복 하나가 30ms쯤 된다.

          요청 100번에 연결 100번을 새로 맺으면, 하는 일과 상관없이 **3초가 그냥 사라진다.**
          그래서 HTTP 클라이언트는 연결을 **끊지 않고 다시 쓴다**(keep-alive).

          여기서 나오는 것이 **연결 풀**이다. 풀이 있으면 두 가지가 생긴다 —
          연결을 기다리는 시간과, **풀이 동났을 때의 대기**다.
          그래서 타임아웃이 하나 더 는다: 연결을 빌려 오기까지의 시간.

          바깥 API마다 클라이언트를 새로 만들어 쓰면 풀도 따로 생긴다.
          **부르는 곳마다 하나씩** 두고 재사용하는 것이 기본이다.
        example:
          language: text
          code: |-
            # 연결을 다시 쓰는지 보기 (같은 곳으로 두 번)
            $ curl -v -o /dev/null -s \
                http://localhost:8080/orders/1 \
                http://localhost:8080/orders/2 2>&1 | grep -E "Connected|Re-using"

            *   Trying 127.0.0.1:8080...
            * Connected to localhost (127.0.0.1) port 8080
            * Re-using existing connection with host localhost

            # 지금 열려 있는 연결 세어 보기
            $ ss -tn state established '( dport = :8080 )' | wc -l
          output: |-
            Connected     → 처음 한 번만 맺었다
            Re-using      → 두 번째는 있던 연결을 다시 썼다
            established 수 → 풀 크기만큼만 있고, 요청 수만큼 늘지 않는다
          note: |-
            - `Re-using existing connection`이 안 보이면 매번 새로 맺고 있는 것이다
            - 요청이 늘어도 established 수가 안 늘면 풀이 제대로 도는 것이다
            - 클라이언트를 요청마다 새로 만들면 풀도 매번 새로 생긴다 — 재사용이 사라진다
            - 상대가 먼저 끊을 수도 있다. 풀은 죽은 연결을 걸러내야 한다
        predict:
          question: 바깥 API를 부를 때마다 `RestClient`를 새로 만들면 무엇이 문제인가?
          choices:
            - 연결 풀이 매번 새로 생겨 연결을 다시 쓰지 못한다
            - 코드가 짧아진다
            - 타임아웃이 무시된다
            - 응답이 캐시된다
          answer: 연결 풀이 매번 새로 생겨 연결을 다시 쓰지 못한다
          explanation: |-
            풀은 클라이언트가 들고 있다. 클라이언트를 버리면 풀도 같이 버려진다.
            요청마다 손을 새로 내밀게 되고, 왕복 시간이 요청 수만큼 쌓인다.
            **빈으로 하나 만들어 주입받아 쓰는** 이유가 이것이다.
        complete:
          question: 클라이언트를 재사용하도록 바꾸세요.
          code: |-
            @Service
            public class PaymentPort {

                private final RestClient client;   // 필드로 들고 ___

                PaymentPort(RestClient paymentClient) {   // ___으로 주입받는다
                    this.client = paymentClient;
                }
            }
          answers:
            - [재사용한다]
            - [생성자]
          explanation: |-
            빈으로 한 번 만들어 생성자로 받아 두면 그 풀이 앱이 도는 동안 유지된다.
            메서드 안에서 `RestClient.create()`를 부르면 매번 새 풀이다.
        problem:
          prompt: |-
            주문 시스템에서 **연결 재사용이 실제로 일어나는지** 눈으로 확인하세요.

            - 같은 끝점을 10번 연속 부르는 코드를 두 가지로 만듭니다
              — ① 클라이언트를 매번 새로 만드는 것 ② 하나를 재사용하는 것
            - 각각 총 걸린 시간을 재고, `ss`로 열린 연결 수를 세어 비교하세요
            - 두 숫자가 왜 그렇게 나왔는지 설명을 적으세요
          deliverables:
            - 두 방식의 코드와 총 걸린 시간
            - 각 방식에서 열린 연결 수
            - 두 숫자에 대한 설명
          hints:
            - 로컬은 왕복이 짧아 차이가 작게 보입니다. 횟수를 늘리면 드러납니다.
            - 연결 수는 요청이 도는 중에 세어야 합니다.
            - 차이가 안 보이면 정말 매번 새로 만들고 있는지부터 확인하세요.
          modelAnswer: |-
            ```text
            ① 매번 새로 만들기 (10회)
               총 312ms, established 최대 10개
            ② 하나 재사용 (10회)
               총 41ms,  established 1개
            ```

            로컬인데도 7배가 났다. 하는 일은 같고 **연결을 맺는 비용만** 다르다.
            서울↔도쿄처럼 왕복이 30ms인 곳이면 차이가 그대로 초 단위가 된다.

            연결 수가 더 중요한 신호다. ①은 요청 수만큼 늘었는데, 이것이
            운영에서 **상대 서버의 연결 한도를 밀어내는** 원인이 된다.
            내 코드가 느려지는 것으로 끝나지 않고 **남의 서버를 밀어내는 것**이다.

            다만 재사용에도 조건이 있다 — 상대가 이미 끊은 연결을 그대로 쓰면
            첫 요청이 실패한다. 풀이 죽은 연결을 걸러 주는지, 걸러 준다면 그때
            한 번 재시도할지를 정해 두어야 한다. 이것은 "타임아웃을 정하는 일"과
            같은 자리에서 같이 정한다.
          selfChecks:
            - 두 방식의 총 시간을 실제로 쟀는가
            - 열린 연결 수 차이를 확인했는가
            - 차이의 원인을 연결 비용으로 설명할 수 있는가
            - 재사용의 위험(죽은 연결)까지 적었는가
    commonMistakes:
      - 거절과 타임아웃을 같은 "안 됨"으로 보고 엉뚱한 곳을 고친다 (U1)
      - 타임아웃을 하나만 두거나 아예 두지 않아 남의 장애가 내 장애가 된다 (U2)
      - 요청마다 클라이언트를 새로 만들어 연결 재사용이 사라진다 (U3)
    inProject: |-
      0단계에서 주문 시스템이 떠도 붙지 않을 때 이 노트의 세 줄(`ss` → `curl -v` →
      걸린 시간)로 먼저 좁힌다. 4단계에서 서버에 올리면 같은 증상이 방화벽·보안그룹
      때문에 다시 나오고, 그때 U1의 구분이 그대로 쓰인다.
      바깥 API를 부르는 코드를 쓸 때는 U2의 두 타임아웃을 **처음부터** 넣는다 —
      나중에 넣으려면 이미 장애를 한 번 겪은 뒤다.
