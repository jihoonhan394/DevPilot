# DevPilot 개념 노트 — 서버는 왜 멈추는가
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 4단계(배포와 로그 확인)에서 쓴다. NETWORK.TCP_IP U2(타임아웃)를 전제한다
# - 예제는 주문 시스템 상황으로 쓴다 (CV-134)
lessons:
  - key: LESSON.CS.OS_PROCESS_THREAD.001
    skillCode: CS.OS_PROCESS_THREAD
    title: 서버는 왜 멈추는가 (프로세스와 스레드)
    whyItMatters: |-
      "서버가 죽었다"고 하는 상황의 대부분은 **죽은 것이 아니라 멈춘 것**이다.
      프로세스는 살아 있는데 응답만 안 온다. 이 둘을 못 나누면 재기동만 반복하게 되고,
      같은 일이 다음 주에 또 일어난다.
      스레드가 무엇을 기다리고 있는지 한 번 들여다볼 줄 알면, 멈춘 이유가
      대개 **그 자리에 그대로 적혀 있다.**
    oneLine: 요청은 스레드가 처리하고, 스레드가 다 기다리는 중이면 프로세스는 살아 있어도 응답이 없다.
    units:
      - key: LESSON.CS.OS_PROCESS_THREAD.001.U1
        title: 죽은 것과 멈춘 것을 가르기
        minutes: 10
        core: true
        explain: |-
          먼저 **프로세스가 있는지**부터 본다. 없으면 죽은 것이고, 있으면 멈춘 것이다.
          둘은 원인도 대응도 완전히 다르다.

          | 상태 | 확인 | 대개의 원인 |
          |---|---|---|
          | 프로세스가 없다 | `ps`에 안 보인다 | 메모리 부족으로 강제 종료, 기동 실패 |
          | 있는데 응답이 없다 | `ps`에 있고 포트도 LISTEN | 스레드가 전부 기다리는 중 |
          | 있는데 아주 느리다 | CPU가 100%에 붙어 있다 | 무한 반복, 과한 계산 |

          프로세스 안에는 **스레드가 여럿** 있고, 요청 하나를 스레드 하나가 맡는다.
          그래서 응답이 없다는 것은 대개 **맡을 스레드가 남아 있지 않다**는 뜻이다.

          이 구분이 중요한 이유는, 세 경우가 **로그에 똑같이 안 보이기 때문**이다.
          멈춘 서버는 오류 로그를 남기지 않는다. 아무 일도 안 하고 있으니까.
        example:
          language: text
          code: |-
            # 1) 프로세스가 있나
            $ ps -o pid,stat,etime,rss,args -C java
              PID STAT     ELAPSED   RSS COMMAND
             2317 Sl      02:14:39  784M java -jar order-service.jar

            # 2) CPU를 쓰고 있나, 스레드는 몇 개인가
            $ top -H -p 2317 -b -n 1 | head -12

            # 3) 각 스레드가 무엇을 하고 있나
            $ ps -L -o tid,stat,wchan:20,comm -p 2317 | head
          output: |-
            STAT  Sl     → S(자고 있다) + l(멀티스레드). 돌고는 있다
            RSS   784M   → 쓰는 메모리

            해석
              ps에 없다        → 죽었다. 왜 종료됐는지부터 본다
              STAT S, CPU 0%   → 멈췄다. 무엇을 기다리는지 본다  ← 가장 흔하다
              CPU 100%         → 돌고는 있다. 어디를 도는지 본다
          note: |-
            - '`STAT`의 `S`는 자는 중, `R`은 실행 중, `D`는 되돌릴 수 없는 대기(대개 디스크)'
            - '`ELAPSED`가 짧으면 방금 다시 떴다는 뜻 — 누가 재기동했거나 죽고 살아난 것이다'
            - '`-H`는 스레드까지 보여 준다. 프로세스만 보면 안쪽이 안 보인다'
            - 멈춘 서버는 **로그가 조용하다.** 조용한 것이 신호다
        predict:
          question: 프로세스는 `ps`에 보이고 CPU는 0%인데 요청이 전부 응답 없이 끊긴다면?
          choices:
            - 스레드들이 무언가를 기다리는 중이다
            - 프로세스가 죽었다
            - 무한 반복에 빠졌다
            - 포트가 닫혔다
          answer: 스레드들이 무언가를 기다리는 중이다
          explanation: |-
            CPU를 안 쓰면서 응답도 없다는 것은 **일을 안 하고 기다리고 있다**는 뜻이다.
            무한 반복이면 CPU가 올라간다. 무엇을 기다리는지는 U2에서 본다.
        complete:
          question: 프로세스와 스레드를 확인하는 명령을 채우세요.
          code: |-
            # 프로세스가 살아 있나, 얼마나 됐나
            $ ps -o pid,stat,etime,rss,args -C ___

            # 그 프로세스의 스레드까지 보기
            $ top -___ -p 2317 -b -n 1
          answers:
            - [java]
            - [H]
          explanation: |-
            `-C java`는 이름으로 프로세스를 고르는 것이고, `top -H`는 스레드 단위로
            보여 준다. 프로세스만 보면 "돌고 있는데 왜 응답이 없지"에서 멈춘다.
        problem:
          prompt: |-
            주문 시스템에서 **세 가지 상태를 일부러 만들고** 구분해 보세요.

            - ① 정상 상태의 `ps`·`top -H` 출력을 기록합니다
            - ② 요청 처리 중에 아주 오래 기다리게 만들어 **멈춘 상태**를 만듭니다
            - ③ 무한 반복을 도는 끝점을 만들어 **CPU 100%** 를 만듭니다
            - 세 경우의 출력 차이와, 각각 로그에 무엇이 남는지(또는 안 남는지) 적으세요
          deliverables:
            - 세 상태의 ps·top 출력
            - 각 상태에서 로그에 남은 것
            - 세 상태를 구분하는 기준 한 줄씩
          hints:
            - 오래 기다리게 하려면 끝점 안에서 아주 긴 대기를 걸면 됩니다.
            - 스레드 풀 크기를 작게 줄이면 ②를 훨씬 빨리 만들 수 있습니다.
            - 로그를 볼 때 "무엇이 남았나"보다 "아무것도 안 남았나"를 보세요.
          modelAnswer: |-
            ```text
            ① 정상
               STAT Sl  CPU 0.7%  스레드 42개
               로그: 요청마다 한 줄씩 남는다

            ② 멈춤 (풀 크기 4, 오래 걸리는 요청 4건)
               STAT Sl  CPU 0.0%  스레드 42개 (수는 그대로다!)
               5번째 요청부터 응답 없음
               로그: 아무것도 안 남는다

            ③ CPU 100%
               STAT Rl  CPU 99.8%
               로그: 아무것도 안 남는다
            ```

            ②에서 놀란 점: **스레드 수는 그대로였다.** 풀 크기가 정해져 있으니
            당연한데, "스레드가 부족하다"는 말 때문에 수가 줄었을 거라 생각하기 쉽다.
            부족한 것은 수가 아니라 **비어 있는 스레드**다.

            세 상태를 가르는 기준:
            - '`ps`에 없다 → 죽었다'
            - 있고 CPU 0% → 멈췄다. 무엇을 기다리는지 본다
            - 있고 CPU 100% → 돌고 있다. 어디를 도는지 본다

            ②와 ③이 **둘 다 로그가 조용하다**는 것이 이 과제의 수확이다.
            장애 때 "로그에 아무것도 없어요"는 정보가 없다는 뜻이 아니라
            **이 둘 중 하나라는 정보**다.
          selfChecks:
            - 세 상태를 실제로 만들었는가
            - 멈춤 상태에서 스레드 수가 그대로인 것을 봤는가
            - 세 상태를 구분하는 기준을 적었는가
            - 로그가 조용한 것이 신호라는 것을 확인했는가
      - key: LESSON.CS.OS_PROCESS_THREAD.001.U2
        title: 스레드가 무엇을 기다리는지 보기
        minutes: 12
        core: true
        explain: |-
          멈춘 서버에서 할 일은 하나다 — **스레드 덤프를 뜨는 것.**
          그 순간 각 스레드가 어느 줄에 서 있는지가 그대로 나온다.

          볼 것은 상태와 **가장 위 몇 줄**이다.

          | 상태 | 뜻 | 흔한 원인 |
          |---|---|---|
          | `RUNNABLE` + 소켓 읽기 | 답을 기다리는 중 | 바깥 API가 느리다 |
          | `WAITING` (풀에서) | 일감을 기다리는 중 | 정상 — 놀고 있다 |
          | `BLOCKED` | 락을 기다리는 중 | 다른 스레드가 쥐고 있다 |
          | `TIMED_WAITING` | 시간을 재며 기다림 | `sleep`, 타임아웃 있는 대기 |

          **같은 줄에 여러 스레드가 몰려 있으면** 거기가 원인이다.
          40개 중 38개가 같은 소켓 읽기에 서 있다면, 바깥 API 하나가
          내 서버 전체를 멈춰 세운 것이다.

          `RUNNABLE`인데 실제로는 기다리는 중일 수 있다는 점이 헷갈린다 —
          소켓 읽기는 운영체제가 재우는 것이라 JVM 입장에서는 "돌고 있음"으로 보인다.
          **상태만 보지 말고 맨 윗줄을 봐야 한다.**
        example:
          language: text
          code: |-
            $ jcmd 2317 Thread.print > dump.txt

            # 상태별로 몇 개인지
            $ grep -oE 'java\.lang\.Thread\.State: [A-Z_]+' dump.txt | sort | uniq -c
                 38 java.lang.Thread.State: RUNNABLE
                  4 java.lang.Thread.State: WAITING

            # 몰려 있는 자리 찾기 (각 스레드의 맨 윗줄)
            $ grep -A1 'Thread.State' dump.txt | grep '\sat ' | sort | uniq -c | sort -rn | head -3
                 38     at sun.nio.ch.SocketDispatcher.read0(Native Method)
                  3     at java.base@25/jdk.internal.misc.Unsafe.park(Native Method)
          output: |-
            읽히는 것
              38개가 소켓 읽기에 서 있다  → 바깥 어딘가의 답을 기다린다
              풀에서 노는 스레드는 4개뿐  → 새 요청을 받을 자리가 거의 없다

            더 내려가 보면
              at com.example.order.PaymentPort.charge(PaymentPort.java:41)
              → 결제 API 호출이다. 읽기 타임아웃이 없었다
          note: |-
            - '`Thread.print`는 **그 순간의 사진**이다. 몇 초 간격으로 두 번 떠서 비교하면 더 확실하다'
            - 두 번 떴는데 같은 스레드가 같은 줄에 있으면 정말 멈춘 것이다
            - '`BLOCKED`가 많으면 락 문제다. 덤프에 **누가 쥐고 있는지**까지 나온다'
            - 덤프를 뜨는 것은 앱을 멈추지 않는다. 장애 중에 떠도 된다
        predict:
          question: 스레드 38개가 전부 소켓 읽기에 서 있다면 가장 먼저 의심할 것은?
          choices:
            - 바깥 API 호출에 읽기 타임아웃이 없다
            - 데이터베이스 인덱스가 없다
            - 메모리가 부족하다
            - 포트가 닫혔다
          answer: 바깥 API 호출에 읽기 타임아웃이 없다
          explanation: |-
            타임아웃이 있었다면 그 시간이 지나 스레드가 풀려났을 것이다.
            계속 서 있다는 것은 **언제까지 기다릴지 정해 두지 않았다**는 뜻이다.
            `NETWORK.TCP_IP` U2에서 본 "남의 장애가 내 장애가 되는 길"이 이 모습이다.
        complete:
          question: 스레드 덤프를 뜨고 몰린 자리를 찾는 명령을 채우세요.
          code: |-
            # 지금 각 스레드가 어디 있는지 저장한다
            $ jcmd 2317 ___ > dump.txt

            # 스레드마다 맨 윗줄을 모아 많은 순으로
            $ grep -A1 'Thread.State' dump.txt | grep '\sat ' \
                | sort | ___ -c | sort -rn | head
          answers:
            - [Thread.print]
            - [uniq]
          explanation: |-
            `Thread.print`가 덤프를 뜨고, `uniq -c`가 같은 줄을 세어 준다.
            **가장 많은 줄이 원인일 확률이 가장 높다.**
        problem:
          prompt: |-
            U1의 ② 상태(멈춘 서버)를 다시 만들고 **덤프로 원인을 찾아** 보세요.

            - 스레드 풀을 작게 줄이고, 아주 느린 바깥 호출을 하는 끝점을 만듭니다
            - 풀이 다 찰 만큼 요청을 넣고 `jcmd ... Thread.print`를 뜹니다
            - 상태별 개수와 **가장 많이 몰린 줄**을 뽑으세요
            - 읽기 타임아웃을 넣고 같은 실험을 다시 해, 덤프가 어떻게 달라지는지 비교하세요
          deliverables:
            - 타임아웃 없을 때의 상태별 개수와 몰린 줄
            - 타임아웃 넣은 뒤의 같은 값
            - 두 덤프의 차이에 대한 설명
          hints:
            - 느린 바깥 호출은 같은 프로젝트의 다른 끝점을 불러도 됩니다.
            - 풀 크기를 4~8 정도로 줄이면 금방 재현됩니다.
            - 덤프는 요청이 몰려 있는 동안 떠야 합니다.
          modelAnswer: |-
            ```text
            [타임아웃 없음]
              RUNNABLE 8 / WAITING 0
              8     at sun.nio.ch.SocketDispatcher.read0(Native Method)
                    at com.example.order.PaymentPort.charge(PaymentPort.java:41)
              → 풀 8개가 전부 결제 호출에 묶였다. 주문 조회도 응답 없음

            [읽기 타임아웃 3초]
              RUNNABLE 2 / WAITING 6
              2     at sun.nio.ch.SocketDispatcher.read0(Native Method)
              → 3초마다 스레드가 풀려나 돌아온다. 주문 조회는 정상 응답
            ```

            같은 바깥 장애인데 **결과가 완전히 다르다.** 타임아웃이 없으면
            결제 API 하나가 서비스 전체를 멈추고, 있으면 결제만 실패하고
            나머지는 돈다.

            "결제만 실패한다"도 좋은 상태는 아니지만, **어디가 문제인지 보인다**는
            점에서 완전히 다르다. 로그에 타임아웃이 쌓이고, 그 줄이 곧바로
            바깥 API를 가리킨다. 멈춘 서버는 그 줄조차 안 남는다.

            덤프를 두 번 떠 보면 한 가지가 더 보인다 — 타임아웃이 있을 때는
            **같은 스레드가 다른 줄에 가 있다.** 돌고 있다는 증거다.
            없을 때는 두 번 다 같은 줄이다.
          selfChecks:
            - 멈춘 상태에서 덤프를 실제로 떴는가
            - 가장 많이 몰린 줄을 찾았는가
            - 타임아웃 전후 덤프를 비교했는가
            - 두 번 떠서 움직이는지 확인했는가
      - key: LESSON.CS.OS_PROCESS_THREAD.001.U3
        title: 스레드를 몇 개 둘 것인가
        minutes: 12
        core: true
        explain: |-
          "느리니까 스레드를 늘리자"가 흔한 반응인데, **늘려서 좋아지는 경우와
          더 나빠지는 경우**가 갈린다. 기준은 그 일이 **기다리는 일인가, 계산하는 일인가**다.

          | 일의 성격 | 스레드를 늘리면 | 적정선 |
          |---|---|---|
          | 기다리는 일 (DB·API 호출) | 좋아진다 — 기다리는 동안 다른 요청을 받는다 | 기다리는 비율만큼 |
          | 계산하는 일 (암호화·정렬) | 나빠진다 — 코어 수만큼만 실제로 돌고 전환 비용만 는다 | 코어 수 근처 |

          웹 애플리케이션은 대개 **기다리는 일**이다. 요청 시간의 대부분이
          DB와 바깥 API를 기다리는 데 쓰인다. 그래서 코어 수보다 많이 둔다.

          그런데 무작정 늘릴 수도 없다. 스레드마다 **스택 메모리**를 차지하고,
          **DB 연결 풀**이 더 작으면 스레드가 늘어도 거기서 다시 줄을 선다.

          그래서 순서가 있다 — **어디서 막히는지 먼저 찾고**, 그다음에 그 자리를 늘린다.
          덤프(U2)가 그 자리를 알려 준다.
        example:
          language: yaml
          code: |-
            # application.yml
            server:
              tomcat:
                threads:
                  max: 50           # 동시에 처리할 요청 수
                  min-spare: 10
                accept-count: 100   # 그 뒤로 줄 세울 수 (넘치면 거절)

            spring:
              datasource:
                hikari:
                  maximum-pool-size: 20    # DB 연결은 20개뿐
          output: |-
            스레드 50 / DB 연결 20 인 상태에서 DB 쓰는 요청이 몰리면

            덤프에서
              20  at ...HikariProxyConnection...   (DB에서 일하는 중)
              30  at ...HikariPool.getConnection   (연결을 기다리는 중)

            → 스레드를 100으로 늘려도 기다리는 줄만 길어진다
          note: |-
            - 스레드를 늘리기 전에 **덤프에서 어디에 몰려 있는지**부터 본다
            - DB 연결 풀에 몰려 있으면 늘릴 곳은 스레드가 아니라 연결 풀(또는 쿼리)이다
            - '`accept-count`를 넘으면 **거절**한다. 무한정 받는 것보다 낫다 — 받아 두고 다 실패하는 것이 최악이다'
            - 스레드마다 스택이 붙으므로 무한정 늘리면 메모리가 먼저 바닥난다
        predict:
          question: 덤프에서 30개가 DB 연결을 기다리고 있다. 스레드를 50에서 100으로 늘리면?
          choices:
            - 기다리는 스레드만 늘고 처리량은 그대로다
            - 두 배 빨라진다
            - DB 연결도 같이 늘어난다
            - 메모리가 줄어든다
          answer: 기다리는 스레드만 늘고 처리량은 그대로다
          explanation: |-
            병목은 DB 연결 20개다. 스레드를 늘려도 **동시에 DB를 쓸 수 있는 수는
            그대로**이고, 늘어난 스레드는 줄만 더 길게 선다.
            대기 시간은 늘고 메모리는 더 쓴다 — 나빠지기만 한다.
        complete:
          question: 병목을 찾고 조절하는 설정을 채우세요.
          code: |-
            server:
              tomcat:
                threads:
                  ___: 50           # 동시에 처리할 요청 수
                ___-count: 100      # 그 뒤로 줄 세울 수

            spring:
              datasource:
                hikari:
                  maximum-pool-size: 20
          answers:
            - [max]
            - [accept]
          explanation: |-
            `threads.max`가 동시에 일할 수 있는 수이고, `accept-count`는 그 뒤에
            **줄 설 수 있는 수**다. 둘 다 넘으면 거절한다 — 거절이 무응답보다 낫다.
        problem:
          prompt: |-
            주문 시스템에서 **병목 자리를 옮겨 가며** 어디를 늘려야 하는지 확인하세요.

            - 스레드 50 / DB 연결 5로 두고 DB를 쓰는 요청을 몰아넣습니다
            - 덤프를 떠서 **어디에 몰려 있는지** 확인합니다
            - 스레드를 100으로 늘려 보고 처리량이 달라지는지 봅니다
            - 이번에는 DB 연결을 20으로 늘려 보고 비교합니다
            - 세 경우의 처리량과 덤프를 표로 정리하세요
          deliverables:
            - 세 설정의 처리량 수치
            - 각 경우의 덤프에서 몰린 자리
            - 어디를 늘려야 했는지와 그 근거
          hints:
            - 처리량은 간단한 반복 호출로도 잴 수 있습니다.
            - 덤프는 부하가 걸린 상태에서 떠야 의미가 있습니다.
            - 연결 풀을 늘릴 때 DB 쪽 한도도 같이 보세요.
          modelAnswer: |-
            ```text
            설정                       처리량      덤프에서 몰린 자리
            스레드 50 / 연결 5         48 req/s    45 at HikariPool.getConnection
            스레드 100 / 연결 5        47 req/s    95 at HikariPool.getConnection
            스레드 50 / 연결 20        183 req/s   18 at HikariProxyConnection (일하는 중)
            ```

            스레드를 두 배로 늘렸더니 처리량이 **오히려 조금 줄었다.**
            일하는 수는 그대로인데 전환 비용만 늘었기 때문이다.
            연결을 늘렸더니 3.8배가 됐다 — 병목이 거기였다.

            근거는 처리량 숫자가 아니라 **덤프**였다. 숫자만 보면
            "스레드를 더 늘려 볼까"로 갈 수 있는데, 덤프는 처음부터
            `getConnection`을 가리키고 있었다.

            그래서 순서가 이렇다:
            1. 덤프를 떠서 **어디에 몰려 있는지** 본다
            2. 그 자리를 늘린다
            3. 다시 떠서 **몰린 자리가 옮겨 갔는지** 본다

            3번이 중요하다. 병목은 없어지는 것이 아니라 **옮겨 간다.**
            연결 20으로 늘린 뒤에는 DB 자체가 다음 병목이 되고,
            그때는 연결을 더 늘리는 것이 아니라 쿼리를 봐야 한다.
          selfChecks:
            - 세 설정의 처리량을 실제로 쟀는가
            - 각 경우 덤프에서 몰린 자리를 확인했는가
            - 스레드를 늘려도 안 좋아지는 것을 직접 봤는가
            - 병목이 옮겨 간다는 것을 확인했는가
    commonMistakes:
      - 응답이 없으면 죽은 것으로 보고 재기동만 한다. 멈춘 것이면 다음 주에 또 멈춘다 (U1)
      - 덤프를 안 뜨고 추측한다. 어느 줄에 몰려 있는지가 대개 원인 그 자체다 (U2)
      - 느리다고 스레드부터 늘린다. 병목이 다른 데 있으면 대기만 길어진다 (U3)
    inProject: |-
      4단계에서 주문 시스템을 서버에 올린 뒤 "응답이 없어요"를 처음 만날 때
      U1의 세 줄(`ps` → CPU → 덤프)로 시작한다.
      `NETWORK.TCP_IP` U2에서 넣은 읽기 타임아웃이 왜 필요했는지가 U2의 덤프에서
      눈으로 보인다 — 타임아웃이 없을 때와 있을 때의 덤프가 다르다.
      설정값(U3)은 한 번 정하고 끝내지 않고, 부하가 달라질 때마다 덤프로 다시 확인한다.
