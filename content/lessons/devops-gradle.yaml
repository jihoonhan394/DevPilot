# DevPilot 개념 노트 — Gradle 빌드
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 예제는 이 저장소의 실제 빌드 파일 모양(Kotlin DSL, version catalog)에 맞춘다
lessons:
  - key: LESSON.DEVOPS.BUILD_GRADLE.001
    skillCode: DEVOPS.BUILD_GRADLE
    title: 빌드가 무엇을 하고 있는지 알기 (Gradle)
    whyItMatters: |-
      매일 `./gradlew` 를 치면서도 그 안에서 무슨 일이 일어나는지 모르면,
      빌드가 깨졌을 때 할 수 있는 일이 "지우고 다시 받기"밖에 없다.
      의존성을 어디에 적는지, 왜 어떤 라이브러리는 실행할 때만 필요한지, 왜 `clean`을 함부로 쓰면 안 되는지 —
      전부 몇 가지 개념으로 설명된다. 주문 시스템에 라이브러리를 하나 더할 때마다 이 판단이 필요하다.
    oneLine: Gradle 빌드는 프로젝트를 찾고(초기화), 할 일 목록을 만들고(구성), 필요한 것만 실행한다(실행).
    units:
      - key: LESSON.DEVOPS.BUILD_GRADLE.001.U1
        title: 빌드는 세 단계로 돈다
        minutes: 10
        core: true
        explain: |-
          `./gradlew test` 한 줄이 무엇을 하는지 보자. 공식 문서는 빌드를 **세 단계**로 나눈다.

          | 단계 | 하는 일 |
          |---|---|
          | **초기화(initialization)** | "프로젝트와 포함된 빌드를 찾는다" — `settings.gradle.kts`를 읽고 프로젝트 객체를 만든다 |
          | **구성(configuration)** | "프로젝트를 구성하고 task 그래프를 만든다" — 빌드 파일을 실행해 task를 등록하고 의존 관계를 엮는다 |
          | **실행(execution)** | "고른 task를 스케줄해 실행한다" — 그래프 순서대로 돌린다 |

          여기서 놓치기 쉬운 것이 있다. **구성 단계는 `test` 하나만 치더라도 빌드 파일 전체를 실행한다.**
          그래서 빌드 파일에 무거운 코드를 적으면 어떤 명령을 쳐도 느려진다.

          그리고 task는 **혼자 돌지 않는다.** `test`는 `compileTestJava`에 기대고, 그건 `compileJava`에 기댄다.
          그래서 `./gradlew test` 한 줄이 컴파일까지 알아서 한다 — 내가 순서를 외울 필요가 없다.

          `build`는 공식 문서 표현으로 `check`와 `assemble`에 기대는 **모아 놓은 task**이고,
          `check`는 "테스트 실행 같은 검증 task를 모아 놓은" task다.
        example:
          language: bash
          code: |-
            ./gradlew test

            # 실제로 도는 것
            > Task :compileJava          # test 가 기대고 있다
            > Task :processResources
            > Task :classes
            > Task :compileTestJava
            > Task :testClasses
            > Task :test

            ./gradlew tasks              # 무슨 task 가 있는지
            ./gradlew test --dry-run     # 실행하지 않고 순서만 본다
          output: |-
            test 하나를 쳤는데 여섯 개가 돌았다
              → task 끼리 기대고 있기 때문 (의존 그래프)

            --dry-run
              SKIPPED 표시와 함께 순서만 보여 준다
              "왜 저게 도는지" 를 알아보는 가장 빠른 방법
          note: |-
            - '구성 단계는 **매번 빌드 파일 전체를 실행한다** — 여기 무거운 코드를 적지 않는다'
            - '`--dry-run`은 무엇이 도는지만 보여 준다. 원인을 찾을 때 먼저 쓴다'
            - '`build` = `check` + `assemble`. `check`는 검증을 모아 놓은 것이다'
        predict:
          question: '`./gradlew test`만 쳤는데 `compileJava`가 도는 이유는?'
          choices:
            - test task 가 컴파일 task 에 기대고 있다. Gradle 이 그래프를 따라 먼저 돌린다
            - Gradle 은 항상 모든 task 를 돌린다
            - 캐시가 없어서 처음 한 번만 그렇다
            - 설정이 잘못된 것이다
          answer: test task 가 컴파일 task 에 기대고 있다. Gradle 이 그래프를 따라 먼저 돌린다
          explanation: |-
            구성 단계에서 만들어진 **task 그래프**에 `test → testClasses → compileTestJava → classes → compileJava`가
            들어 있다. 실행 단계는 그 순서를 따라간다.
            그래서 "컴파일 먼저 하고 테스트"를 내가 외우거나 적어 줄 필요가 없다.
        complete:
          question: 무엇이 도는지 실행하지 않고 확인하도록 빈칸을 채우세요.
          code: |-
            ./gradlew check ___
          answers:
            - ["--dry-run"]
          explanation: |-
            `--dry-run`은 task 그래프만 만들고 실행하지 않는다.
            "이 명령이 무엇을 돌리는가"를 안전하게 확인하는 방법이다.
        problem:
          prompt: |-
            동료가 이렇게 말합니다. **"빌드가 이상하면 일단 `./gradlew clean build` 하세요."**

            1. `clean`이 무엇을 하는지 쓰세요
            2. 이 습관이 왜 대부분의 경우 **낭비**인지 설명하세요 (세 단계 중 어디와 관련이 있는지)
            3. 빌드가 이상할 때 `clean` 전에 해 볼 것 **두 가지**를 쓰세요
          deliverables:
            - clean 이 하는 일과 clean build 가 왜 대부분 낭비인지
            - clean 전에 해 볼 것 2가지
          hints:
            - Gradle은 이미 만든 결과물을 다시 만들지 않으려고 애씁니다. `clean`은 그것에 무엇을 할까요?
            - 무엇이 도는지 실행 없이 보는 방법이 있었습니다.
            - 문제가 **어느 단계**에서 나는지부터 가려야 합니다.
          modelAnswer: |-
            **1. `clean`이 하는 일**

            `build` 디렉터리를 통째로 지운다. 컴파일 결과, 테스트 결과, 생성된 코드가 모두 사라진다.

            **2. 왜 대부분 낭비인가**

            Gradle은 **실행 단계**에서 입력이 바뀌지 않은 task를 `UP-TO-DATE`로 건너뛴다.
            `clean`은 그 판단 근거를 전부 지워 버려서, 바뀐 것이 한 파일뿐이어도 **전부 다시 컴파일**한다.
            게다가 진짜 원인이 구성 단계(의존성 해석, 플러그인 설정)에 있으면 `clean`을 해도 그대로 재현된다 —
            "고쳤다"가 아니라 "오래 걸렸다"만 남는다.

            **3. `clean` 전에 해 볼 것**

            - '`./gradlew <task> --dry-run` — 내가 생각한 task가 실제로 도는지 본다. 엉뚱한 task를 치고 있던 경우가 많다.'
            - '`./gradlew <task> --info`(또는 `--stacktrace`) — 어느 단계에서 어떤 이유로 깨지는지 본다. `UP-TO-DATE`가 아닌 이유도 알려 준다.'

            (정말 결과물이 꼬였을 때만 `clean`을 쓴다 — 원인을 본 뒤에.)
          selfChecks:
            - '`clean`이 `build` 디렉터리를 지운다는 것과 그래서 전부 다시 만든다는 것을 연결했는가'
            - 낭비인 이유를 `UP-TO-DATE` 판단(실행 단계)으로 설명했는가
            - '`clean` 전에 해 볼 두 가지가 **원인을 보는** 방법인가'

      - key: LESSON.DEVOPS.BUILD_GRADLE.001.U2
        title: 의존성을 어디에 적을 것인가
        minutes: 12
        core: true
        prerequisiteUnits:
          - LESSON.DEVOPS.BUILD_GRADLE.001.U1
        explain: |-
          라이브러리를 더할 때 기준은 **"언제 필요한가"** 하나다. 공식 문서의 정의를 그대로 보자.

          | 자리 | 정의 |
          |---|---|
          | `implementation` | "main 소스의 **컴파일할 때와 실행할 때 모두** 필요한 의존성" |
          | `compileOnly` | "**컴파일할 때만** 필요하고 실행 classpath에는 들어가지 않는다" |
          | `runtimeOnly` | "**실행할 때만** 필요하고 컴파일 classpath에는 들어가지 않는다" |
          | `testImplementation` | "test 소스의 컴파일·실행에 모두 필요한 의존성" |

          `import` 하면 `implementation`, **DB 드라이버**는 `runtimeOnly`(코드는 JDBC 표준만 쓴다),
          JUnit·AssertJ는 `testImplementation`이다.

          `runtimeOnly`가 중요한 이유가 있다. **실수로 그 라이브러리의 클래스를 직접 쓰는 것을 컴파일러가 막아 준다.**
          드라이버를 `implementation`으로 두면 PostgreSQL 전용 타입을 무심코 import 하게 되고, DB를 바꿀 수 없는 코드가 된다.
        example:
          language: kotlin
          code: |-
            dependencies {
                // 코드에서 import 한다 — 컴파일·실행 모두
                implementation("org.springframework.boot:spring-boot-starter-web")
                implementation("org.springframework.boot:spring-boot-starter-data-jpa")

                // 실행할 때만 — 코드는 JDBC 표준만 쓴다
                runtimeOnly("org.postgresql:postgresql")

                // 컴파일할 때만 — 표시용 애너테이션
                compileOnly("org.jspecify:jspecify")

                // 테스트에서만 — 운영 jar 에 들어가지 않는다
                testImplementation("org.springframework.boot:spring-boot-starter-test")
                testImplementation("org.testcontainers:postgresql")
            }
          output: |-
            postgresql 을 runtimeOnly 로 두면
              import org.postgresql.PGConnection;   → 컴파일 오류
              "그 DB 전용 코드를 쓰지 않겠다"가 빌드로 강제된다

            testImplementation 의 것들은
              build/libs 의 운영 jar 에 들어가지 않는다
          note: |-
            - '기준은 **언제 필요한가** 하나다'
            - 'DB 드라이버를 `runtimeOnly`로 두는 것이 "DB에 묶이지 않기"의 첫걸음이다'
            - '테스트 라이브러리가 운영 jar에 들어가면 크기도 공격 표면도 커진다'
        predict:
          question: PostgreSQL 드라이버를 `implementation`으로 두면 무엇이 달라지나?
          choices:
            - 컴파일 classpath 에 들어가 PostgreSQL 전용 클래스를 무심코 import 할 수 있게 된다
            - 실행할 때 드라이버를 못 찾는다
            - 아무 차이도 없다
            - 테스트에서만 쓸 수 있게 된다
          answer: 컴파일 classpath 에 들어가 PostgreSQL 전용 클래스를 무심코 import 할 수 있게 된다
          explanation: |-
            동작은 똑같이 한다 — 그래서 더 위험하다. 달라지는 것은 **컴파일할 때 보이느냐**다.
            보이면 누군가 `PGConnection` 같은 전용 타입을 쓰게 되고, 그 순간 DB를 바꾸는 일이 코드 수정 작업이 된다.
            `runtimeOnly`는 그 유혹을 **빌드가 막아 준다.**
        complete:
          question: 각 의존성을 알맞은 자리에 넣도록 빈칸을 채우세요.
          code: |-
            dependencies {
                implementation("org.springframework.boot:spring-boot-starter-web")
                ___("org.postgresql:postgresql")
                ___("org.assertj:assertj-core")
            }
          answers:
            - [runtimeOnly]
            - [testImplementation]
          explanation: |-
            드라이버는 실행할 때만 필요하므로 `runtimeOnly`,
            AssertJ는 테스트에서만 쓰므로 `testImplementation`이다.
        problem:
          prompt: |-
            아래 `dependencies` 블록에는 잘못 놓인 것이 **셋** 있습니다. 찾아 고치고 이유를 쓰세요.

            ```kotlin
            dependencies {
                implementation("org.springframework.boot:spring-boot-starter-web")
                implementation("org.postgresql:postgresql")
                implementation("org.junit.jupiter:junit-jupiter")
                implementation("org.flywaydb:flyway-core")
                compileOnly("org.springframework.boot:spring-boot-starter-data-jpa")
            }
            ```

            (`flyway-core`는 기동할 때 migration을 돌릴 뿐 코드에서 `import` 하지 않는다고 가정합니다.)
          deliverables:
            - 고친 블록
            - 셋을 옮긴 이유 한 줄씩
          hints:
            - 각 줄에 "컴파일할 때 필요한가 / 실행할 때 필요한가"를 물어보세요.
            - 운영 jar 에 들어가면 안 되는 것이 하나 있습니다.
            - 마지막 줄은 실행할 때 없으면 어떻게 될까요?
          modelAnswer: |-
            ```kotlin
            dependencies {
                implementation("org.springframework.boot:spring-boot-starter-web")
                implementation("org.springframework.boot:spring-boot-starter-data-jpa")

                runtimeOnly("org.postgresql:postgresql")
                runtimeOnly("org.flywaydb:flyway-core")

                testImplementation("org.junit.jupiter:junit-jupiter")
            }
            ```

            - '`postgresql` → `runtimeOnly`: 코드에서 import 하지 않는다. 컴파일에 보이면 전용 타입을 쓰게 된다.'
            - '`junit-jupiter` → `testImplementation`: 테스트에서만 쓴다. `implementation`으로 두면 **운영 jar에 테스트 라이브러리가 들어간다.**'
            - '`spring-boot-starter-data-jpa` → `implementation`: `compileOnly`로 두면 컴파일은 되지만 **실행할 때 없어서** 기동이 실패한다. 이건 코드에서 import 하고 실행에도 필요하다.'

            `flyway-core`도 import 하지 않으므로 `runtimeOnly`가 맞는다.
          selfChecks:
            - 드라이버와 flyway가 `runtimeOnly`로 갔는가
            - JUnit이 `testImplementation`으로 갔는가
            - '`compileOnly`였던 JPA가 `implementation`이 됐고, 그대로 두면 **기동이 실패**한다고 설명했는가'

      - key: LESSON.DEVOPS.BUILD_GRADLE.001.U3
        title: 버전을 한 곳에서 관리하기
        minutes: 10
        core: false
        prerequisiteUnits:
          - LESSON.DEVOPS.BUILD_GRADLE.001.U2
        explain: |-
          프로젝트가 커지면 버전 문자열이 빌드 파일 여기저기에 흩어진다.
          같은 라이브러리가 모듈마다 다른 버전이 되고, 올릴 때 한 곳을 빠뜨린다.

          **버전 카탈로그**는 그것을 `gradle/libs.versions.toml` 한 파일에 모은다.

          ```toml
          [versions]
          testcontainers = "1.21.3"

          [libraries]
          testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
          ```

          빌드 파일에서는 `libs.testcontainers.postgresql`로 쓴다 — **점이 하이픈을 대신한다.**
          IDE가 자동완성해 주고, 오타를 내면 **빌드 파일이 컴파일되지 않는다**(Kotlin DSL이라 타입이 있다).

          Spring Boot 같은 플러그인은 여기에 더해 **BOM**을 준다.
          `spring-boot-starter-web`처럼 **버전을 아예 적지 않아도** 되는 이유가 이것이다 —
          Boot가 자기와 맞는 버전을 정해 준다. 억지로 버전을 적으면 오히려 조합이 깨질 수 있다.

          정리하면 **버전을 적는 자리는 셋 중 하나**다. BOM이 정해 주거나, 카탈로그에 적거나, 정말 예외적으로 그 자리에 적거나.
          마지막은 이유를 주석으로 남긴다.
        example:
          language: kotlin
          code: |-
            // gradle/libs.versions.toml
            // [versions]
            // archunit = "1.4.1"
            // [libraries]
            // archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

            dependencies {
                // BOM 이 정해 준다 — 버전을 적지 않는다
                implementation("org.springframework.boot:spring-boot-starter-web")

                // 카탈로그에서 — 점이 하이픈을 대신한다
                testImplementation(libs.archunit.junit5)
            }
          output: |-
            버전을 올릴 때
              카탈로그 한 줄만 고친다 → 쓰는 모든 자리에 반영

            libs.archunit.junit6 처럼 오타를 내면
              빌드 파일이 컴파일되지 않는다 (실행해 봐야 아는 것이 아니다)
          note: |-
            - 'Boot starter에 버전을 적지 않는 것은 실수가 아니라 **BOM에 맡기는 것**이다'
            - '카탈로그 키의 하이픈은 코드에서 점이 된다 (`archunit-junit5` → `libs.archunit.junit5`)'
            - '예외적으로 버전을 직접 적을 때는 **이유를 주석으로** 남긴다'
        predict:
          question: '`spring-boot-starter-web`에 버전을 적지 않아도 되는 이유는?'
          choices:
            - Spring Boot 플러그인의 BOM 이 자기와 맞는 버전을 정해 준다
            - Gradle 이 최신 버전을 자동으로 받는다
            - 버전이 필요 없는 라이브러리라서
            - 카탈로그에 이미 적혀 있어서
          answer: Spring Boot 플러그인의 BOM 이 자기와 맞는 버전을 정해 준다
          explanation: |-
            "최신을 알아서 받는" 것이 아니다. 그러면 어제 되던 빌드가 오늘 깨진다.
            Boot 플러그인이 **그 Boot 버전과 함께 검증된 조합**을 BOM으로 들고 있고, 거기서 버전이 정해진다.
            그래서 Boot 버전만 올리면 딸린 것들이 함께 맞는 조합으로 올라간다 —
            여기에 버전을 직접 적으면 그 조합을 깨뜨릴 수 있다.
        complete:
          question: 카탈로그의 `hibernate-validator` 키를 빌드 파일에서 쓰도록 빈칸을 채우세요.
          code: |-
            # libs.versions.toml
            # hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version.ref = "hv" }

            implementation(libs.hibernate___validator)
          answers:
            - ["."]
          explanation: |-
            카탈로그 키의 하이픈은 빌드 파일에서 **점**이 된다 — `hibernate-validator` → `libs.hibernate.validator`.
        problem:
          prompt: |-
            팀 프로젝트의 빌드 파일이 이렇습니다.

            ```kotlin
            dependencies {
                implementation("org.springframework.boot:spring-boot-starter-web:3.2.0")
                implementation("com.fasterxml.jackson.core:jackson-databind:2.15.2")
                testImplementation("org.assertj:assertj-core:3.24.2")
                testImplementation("org.testcontainers:postgresql:1.19.0")
                testImplementation("org.testcontainers:junit-jupiter:1.19.3")
            }
            ```

            문제를 **셋** 찾아 고치세요. 버전 카탈로그를 쓴다고 가정하고 `libs.versions.toml`도 함께 쓰세요.
          deliverables:
            - 찾은 문제 3가지
            - 고친 build 파일과 libs.versions.toml 조각
          hints:
            - 같은 묶음의 라이브러리 두 줄을 나란히 놓고 버전을 보세요.
            - Boot 가 정해 줄 수 있는 것에 버전을 적으면 무엇이 위험할까요?
            - 버전 문자열이 몇 군데에 흩어져 있나요?
          modelAnswer: |-
            **문제**

            1. `testcontainers` 두 줄의 버전이 **다르다**(1.19.0 / 1.19.3). 같이 쓰는 묶음인데 어긋나 있다
            2. Boot starter와 `jackson-databind`에 **버전을 직접 적었다.** BOM이 정해 주는 조합을 깨뜨릴 수 있다
            3. 버전 문자열이 **다섯 줄에 흩어져** 있어 올릴 때 빠뜨리기 쉽다

            ```toml
            # gradle/libs.versions.toml
            [versions]
            assertj = "3.24.2"
            testcontainers = "1.19.3"

            [libraries]
            assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
            testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
            testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
            ```

            ```kotlin
            dependencies {
                implementation("org.springframework.boot:spring-boot-starter-web")   // BOM
                implementation("com.fasterxml.jackson.core:jackson-databind")        // BOM

                testImplementation(libs.assertj.core)
                testImplementation(libs.testcontainers.postgresql)
                testImplementation(libs.testcontainers.junit)
            }
            ```

            이제 testcontainers 버전은 `[versions]` 한 줄이라 어긋날 수가 없다.
          selfChecks:
            - testcontainers 두 줄이 같은 `version.ref`를 보는가
            - Boot 가 정해 주는 것에서 버전 문자열을 지웠는가
            - 남은 버전이 전부 `libs.versions.toml` 한 파일에 있는가

      - key: LESSON.DEVOPS.BUILD_GRADLE.001.U4
        title: 남의 컴퓨터에서도 같게 돌리기
        minutes: 10
        core: true
        prerequisiteUnits:
          - LESSON.DEVOPS.BUILD_GRADLE.001.U1
        explain: |-
          "제 컴퓨터에서는 되는데요"의 절반은 빌드 환경 차이다. 막는 장치가 둘 있다.

          **Wrapper** — 저장소에 `gradlew`·`gradlew.bat`·`gradle/wrapper/` 를 함께 커밋해 둔다.
          그러면 Gradle을 따로 설치하지 않아도 되고, **모두가 같은 Gradle 버전**을 쓴다.
          그래서 `gradle build`가 아니라 **`./gradlew build`** 로 친다 —
          앞의 `./` 가 "내 컴퓨터에 깔린 것 말고 저장소에 있는 것"이라는 뜻이다.

          **toolchain** — 자바 버전을 빌드 파일이 정한다.

          ```kotlin
          java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
          ```

          이러면 개발자가 무슨 JDK를 깔았든 **빌드는 정해진 버전으로** 컴파일한다.
          없으면 Gradle이 받아 오거나 어디 있는지 알려 준다. 팀원마다 JDK가 달라 생기는 문제가 사라진다.

          CI에서도 같은 명령을 쓴다 — `./gradlew check`. 내 PC에서만 도는 검사는 결국 안 돌게 된다.
          **"CI에서 하는 일과 내가 치는 명령이 같다"** 가 목표다.

          하나 더. `gradlew`를 커밋할 때 **줄바꿈이 CRLF로 바뀌면 리눅스에서 실행되지 않는다.**
          `.gitattributes`로 LF를 강제해 둔다.
        example:
          language: bash
          code: |-
            # 저장소에 함께 있는 것
            gradlew                      # 리눅스·macOS
            gradlew.bat                  # 윈도우
            gradle/wrapper/gradle-wrapper.properties   # 어느 Gradle 버전인지

            ./gradlew --version          # 저장소가 정한 Gradle·JVM 버전
            ./gradlew wrapper --gradle-version 9.0   # 버전 올리기 (커밋한다)

            # .gitattributes
            gradlew text eol=lf
          output: |-
            ./gradlew build   → 저장소가 정한 Gradle 로
            gradle build      → 내 PC 에 깔린 것으로  (사람마다 다르다)

            toolchain 이 25 면
              JDK 21 만 깔린 사람도 25 로 컴파일된다
              (Gradle 이 받아 오거나 어디 있는지 알려 준다)
          note: |-
            - '`./gradlew` 의 `./` 를 빼면 저장소가 정한 버전을 쓰지 않는 것이다'
            - 'wrapper 파일은 **커밋한다** — 없으면 wrapper 의 의미가 없다'
            - '`gradlew` 가 CRLF 로 커밋되면 리눅스·CI 에서 실행되지 않는다'
        predict:
          question: '`./gradlew build` 대신 `gradle build`를 치면 무엇이 달라지나?'
          choices:
            - 내 PC 에 깔린 Gradle 로 돈다. 사람마다 버전이 달라 결과가 달라질 수 있다
            - 똑같다. 그냥 짧게 치는 방법이다
            - 더 빠르다
            - 오류가 난다
          answer: 내 PC 에 깔린 Gradle 로 돈다. 사람마다 버전이 달라 결과가 달라질 수 있다
          explanation: |-
            `./gradlew`는 **저장소 안의 wrapper**를 실행하고, 그것이 `gradle-wrapper.properties`에 적힌
            버전을 받아 쓴다. `gradle`은 내 PC에 설치된 것을 쓴다.
            그래서 같은 코드인데 사람마다 결과가 달라질 수 있다 — wrapper는 그걸 막으려고 있는 것이다.
        complete:
          question: 자바 25로 컴파일하도록 빈칸을 채우세요.
          code: |-
            java {
                ___ {
                    languageVersion = JavaLanguageVersion.of(25)
                }
            }
          answers:
            - [toolchain]
          explanation: |-
            `toolchain`이 **빌드가 쓸 자바 버전**을 정한다.
            개발자가 무엇을 깔았는지와 무관하게 정해진 버전으로 컴파일된다.
        problem:
          prompt: |-
            새 팀원이 저장소를 받아 `./gradlew build`를 돌렸더니 실패합니다.
            팀원은 JDK 17만 깔려 있고, 프로젝트는 자바 25를 씁니다.

            1. 빌드 파일에 **무엇이 있어야** 이 문제가 안 생기는지 쓰세요
            2. 그 팀원이 리눅스에서 `./gradlew: Permission denied` 또는 `bad interpreter` 를 본다면 원인이 무엇인지
            3. "제 컴퓨터에서는 됩니다"를 줄이기 위해 저장소에 **커밋해 두어야 할 것** 세 가지
          deliverables:
            - 세 물음에 대한 답
            - 3번은 각각 왜 필요한지 한 줄씩
          hints:
            - 자바 버전을 사람이 맞추게 하지 않는 장치가 있었습니다.
            - 줄바꿈 문자가 셸 스크립트에 어떤 영향을 줄지 생각해 보세요.
            - CI가 치는 명령과 내가 치는 명령이 같아야 합니다.
          modelAnswer: |-
            **1. toolchain**

            ```kotlin
            java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
            ```

            이러면 JDK 17만 깔린 사람도 빌드는 25로 컴파일된다. Gradle이 25를 받아 오거나 어디 있는지 알려 준다.
            toolchain이 없으면 "각자 JDK를 25로 맞추세요"라는 구두 약속에 기대게 된다.

            **2. `gradlew`의 줄바꿈이 CRLF로 커밋된 것**

            셸이 첫 줄 `#!/bin/sh` 뒤의 `\r`까지 인터프리터 이름으로 읽어 찾지 못한다.
            `.gitattributes`에 `gradlew text eol=lf`를 두어 막는다. (실행 권한 문제라면 `git update-index --chmod=+x gradlew`.)

            **3. 커밋해 둘 것**

            - '`gradlew`·`gradlew.bat`·`gradle/wrapper/` — 모두가 **같은 Gradle 버전**을 쓰게 한다.'
            - '`gradle/libs.versions.toml` — 라이브러리 버전이 사람마다 달라지지 않게 한다(U3).'
            - '`.gitattributes` — 줄바꿈이 OS마다 달라져 스크립트가 깨지는 것을 막는다.'

            그리고 CI가 치는 명령을 `./gradlew check` 하나로 맞춰 두면, 내가 치는 것과 CI가 치는 것이 같아진다.
          selfChecks:
            - toolchain을 답으로 들었고 "각자 맞추세요"가 왜 안 되는지 설명했는가
            - 2번의 원인을 CRLF 줄바꿈으로 짚었는가
            - 3번 세 가지가 각각 **다른 종류의 차이**를 막는가

    commonMistakes:
      - '`./gradlew` 대신 `gradle` 을 친다. 저장소가 정한 버전이 아니라 내 PC 것으로 돈다 (U4)'
      - 테스트 라이브러리를 `implementation` 으로 둬 운영 jar 에 넣는다 (U2)
      - 빌드가 이상하면 먼저 `clean` 한다. 원인이 구성 단계에 있으면 그대로 재현되고 시간만 버린다 (U1)
    inProject: |-
      주문 시스템에 라이브러리를 더할 때마다 U2의 기준으로 자리를 고른다 —
      import 하면 `implementation`, 드라이버처럼 실행에만 필요하면 `runtimeOnly`, 테스트면 `testImplementation`.
      버전은 카탈로그 한 파일에 모으고 Boot 가 정해 주는 것에는 적지 않는다(U3).
      `./gradlew check` 하나로 컴파일·검사·테스트가 다 돌게 해 두고 CI 도 같은 명령을 치게 한다(U4).
      빌드가 느려지거나 깨지면 `clean` 대신 `--dry-run`·`--info` 로 어느 단계인지부터 가린다(U1).
