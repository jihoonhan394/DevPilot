# DevPilot 개념 노트 — 코드 리뷰
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 도구(PMD·SpotBugs)의 성격은 각 공식 문서의 정의를 근거로 한다
# - 로그에 남기면 안 되는 것 목록은 OWASP Logging Cheat Sheet를 따른다
lessons:
  - key: LESSON.PRACTICAL_ENGINEERING.CODE_REVIEW.001
    skillCode: PRACTICAL_ENGINEERING.CODE_REVIEW
    title: 남의 코드를 읽고 말하기 (코드 리뷰)
    whyItMatters: |-
      혼자 만들어도 리뷰는 필요하다. **한 달 뒤의 나는 남이다.**
      리뷰를 받을 줄 알면 "왜 이렇게 했어요?"에 답하려다 스스로 설계를 다시 보게 되고,
      리뷰를 할 줄 알면 남의 코드에서 내가 몰랐던 방식을 가져올 수 있다.
      그리고 실무에서 막 들어온 사람이 가장 먼저 부딪히는 것이 리뷰다 — 무엇을 봐야 하는지 아무도 안 알려 준다.
    oneLine: 리뷰는 흠을 잡는 자리가 아니라, 기계가 못 보는 것을 사람이 보고 **왜 그렇게 했는지**를 남기는 자리다.
    units:
      - key: LESSON.PRACTICAL_ENGINEERING.CODE_REVIEW.001.U1
        title: 기계에 맡길 것과 사람이 볼 것
        minutes: 10
        core: true
        explain: |-
          리뷰에서 시간을 가장 많이 잡아먹는 것은 **기계가 해야 할 일**이다.
          들여쓰기, import 순서, 미사용 변수. 이런 것을 사람이 짚으면 정작 중요한 것을 볼 힘이 남지 않는다.

          | 도구 | 무엇을 잡나 |
          |---|---|
          | 포매터 (Spotless) | 모양. **사람이 고치지 않고 명령 한 번으로 맞춘다** |
          | 린터 (Checkstyle) | 정해진 코딩 스타일 |
          | 정적 분석 (PMD) | 공식 분류로 Design · **Error Prone** · Performance · **Security** 등 |
          | 바이트코드 분석 (SpotBugs) | 공식 문서가 **"오류일 가능성이 높은 코드 형태인 '버그 패턴'"** 이라 부르는 것 |

          PMD의 `Error Prone`은 **"망가졌거나, 몹시 헷갈리거나, 런타임 오류를 일으키기 쉬운 구성"** 을 찾는 규칙이다.
          이런 것을 사람이 눈으로 찾고 있으면 안 된다.

          사람은 **기계가 원리적으로 볼 수 없는 것**을 본다 — 이름이 하는 일과 맞나,
          풀려던 문제를 푸나, 경계와 예외를 다루나, 다음 변경을 견디나, 왜 그렇게 했는지가 남아 있나.
        example:
          language: bash
          code: |-
            # 리뷰 요청 전에 내가 돌린다 — 리뷰어가 볼 것을 남겨 두기 위해
            ./gradlew spotlessApply   # 모양을 맞춘다 (사람이 고치지 않는다)
            ./gradlew check           # checkstyle · pmd · spotbugs · 테스트

            # 그러고 나서 리뷰어가 보는 것
            #   - placeOrder 라는 이름이 하는 일과 맞나
            #   - 수량 0 · 재고 부족 · 두 번 누름은 어떻게 되나
            #   - 결제 실패 시 주문이 남지 않나
            #   - 왜 여기서 트랜잭션을 열었는지 남아 있나
          output: |-
            기계가 잡는 것
              들여쓰기 · import 순서 · 미사용 변수 · null 위험 · 빈 catch

            사람만 볼 수 있는 것
              이름이 하는 일과 맞나
              요구를 제대로 읽었나
              다음 변경을 견디나
              왜 그렇게 했는지
          note: |-
            - '리뷰 요청 **전에** 내가 `check`를 돌린다. 기계가 잡을 것을 리뷰어가 짚게 하지 않는다'
            - '포맷 지적이 리뷰에 나온다면 그건 코드 문제가 아니라 **파이프라인 문제**다'
            - 'SpotBugs는 바이트코드를 본다 — 소스만 보는 도구와 잡는 것이 다르다'
        predict:
          question: 리뷰 코멘트의 절반이 들여쓰기와 import 순서 지적이라면 무엇이 잘못된 것인가?
          choices:
            - 파이프라인 문제다. 포매터와 린터를 넣어 기계가 맡게 해야 한다
            - 리뷰어가 꼼꼼한 것이다. 좋은 일이다
            - 코드 작성자의 실력 문제다
            - 리뷰 규칙을 더 늘려야 한다
          answer: 파이프라인 문제다. 포매터와 린터를 넣어 기계가 맡게 해야 한다
          explanation: |-
            사람의 주의력은 한정돼 있다. 모양 지적에 다 쓰면 **경계 조건과 설계를 볼 힘이 남지 않는다.**
            게다가 모양은 취향 싸움이 되기 쉬워 감정도 상한다.
            포매터를 넣고 "모양은 명령 한 번으로 맞춘다"로 정하면 그 논쟁 자체가 사라진다.
        complete:
          question: 리뷰를 요청하기 전에 내가 먼저 돌릴 명령을 채우세요.
          code: |-
            ./gradlew ___     # 모양을 맞춘다
            ./gradlew ___     # 린터·정적 분석·테스트
          answers:
            - [spotlessApply]
            - [check]
          explanation: |-
            모양은 `spotlessApply`로 맞추고, 나머지 검사는 `check`로 한 번에 돌린다.
            이 둘을 통과시킨 상태로 요청해야 리뷰어가 **사람만 볼 수 있는 것**에 집중할 수 있다.
        problem:
          prompt: |-
            아래 리뷰 코멘트 여섯 개를 **"기계가 할 일"과 "사람이 볼 일"** 로 나누고,
            기계가 할 일은 각각 어떤 도구에 맡길지 쓰세요.

            1. "여기 들여쓰기가 2칸이네요"
            2. "이 변수 안 쓰이는 것 같아요"
            3. "`cancelOrder`인데 안에서 환불까지 하고 있어요"
            4. "`catch (Exception e) {}` 비어 있어요"
            5. "장바구니가 비었을 때는 어떻게 되나요?"
            6. "왜 여기서 새 트랜잭션을 여셨어요?"
          deliverables:
            - 여섯 개의 분류와 (기계인 경우) 맡길 도구
            - 사람이 볼 일 셋이 각각 **무엇을 확인하려는 것인지** 한 줄씩
          hints:
            - 기준은 "코드만 보고 기계가 판단할 수 있나"입니다.
            - 4번은 모양 문제일까요, 오류를 부르는 구성일까요?
            - 5번과 6번은 코드 어디에도 답이 없을 수 있습니다.
          modelAnswer: |-
            | # | 분류 | 맡길 곳 / 확인하려는 것 |
            |---|---|---|
            | 1 | 기계 | 포매터(Spotless). 사람이 짚을 일이 아니다 |
            | 2 | 기계 | 린터/정적 분석(Checkstyle·PMD). 미사용 변수는 기계가 확실히 안다 |
            | 3 | **사람** | **이름이 하는 일과 맞나.** 이름과 동작이 어긋나면 부르는 쪽이 오해한다 |
            | 4 | 기계 | PMD `Error Prone`(빈 catch). "런타임 오류를 일으키기 쉬운 구성"에 해당한다 |
            | 5 | **사람** | **경계 조건을 다루나.** 0개·null·중복 클릭은 요구에도 안 적혀 있고 코드에도 없을 때가 많다 |
            | 6 | **사람** | **왜 그렇게 했는지가 남아 있나.** 의도가 없으면 다음 사람이 지워 버린다 |

            기계에 맡긴 넷은 리뷰 요청 **전에** `spotlessApply` + `check`로 이미 걸러져 있어야 한다.
            그래야 리뷰에는 3·5·6만 남는다.
          selfChecks:
            - 3·5·6을 사람 쪽으로 갈랐는가
            - 4번을 "모양"이 아니라 오류를 부르는 구성으로 보고 정적 분석에 맡겼는가
            - 사람이 볼 셋의 "확인하려는 것"이 서로 다른가

      - key: LESSON.PRACTICAL_ENGINEERING.CODE_REVIEW.001.U2
        title: 어떤 순서로 읽나
        minutes: 12
        core: true
        prerequisiteUnits:
          - LESSON.PRACTICAL_ENGINEERING.CODE_REVIEW.001.U1
        explain: |-
          바뀐 파일을 위에서부터 한 줄씩 읽으면 **작은 것만 보인다.** 반쯤 읽을 때쯤 지치고,
          그 뒤로는 "LGTM"을 누르게 된다.

          순서를 바꾼다. **밖에서 안으로** 읽는다.

          1. **무엇을 하려는 변경인가** — 설명과 관련 이슈를 먼저 읽는다. 없으면 그것부터 묻는다
          2. **계약이 바뀌었나** — API 규격·DB 스키마·설정. 여기가 바뀌면 되돌리기 어렵다
          3. **테스트를 읽는다** — 무엇을 보장하려는지가 여기에 있다. **테스트가 없으면 그 자체가 지적**이다
          4. **구현을 읽는다** — 이제야 본문. 앞의 셋을 알고 읽으면 훨씬 빨리 읽힌다
          5. **빠진 것을 찾는다** — 가장 어려운 단계다. 있는 코드가 아니라 **없는 코드**를 본다

          5번을 하는 방법이 있다. 변경된 동작마다 이 셋을 소리 내어 물어본다.

          - **0개·비어 있음·없음**일 때는?
          - **두 번** 부르면?
          - **실패**하면 그 앞에서 한 일은 어떻게 되나?

          그리고 **바뀐 줄만 보지 않는다.** 그 함수를 부르는 다른 자리도 같이 본다 —
          바뀐 동작이 거기서도 맞는지는 diff에 안 나온다.
        example:
          language: diff
          code: |-
            @@ OrderService.java
            +    @Transactional
            +    public Long placeOrder(Long customerId, List<OrderLineRequest> lines) {
            +        Order order = new Order(customerId);
            +        for (OrderLineRequest line : lines) {
            +            order.add(line.productId(), line.quantity());
            +        }
            +        orderRepository.save(order);
            +        paymentClient.pay(order.getTotalAmount());
            +        return order.getId();
            +    }
          output: |-
            1 무엇을 하려는가  → "주문을 만들고 결제한다". 설명에 적혀 있나?
            2 계약이 바뀌었나  → 새 endpoint 면 API 규격도 같이 바뀌었나?
            3 테스트는        → 성공 / 결제 실패 / 빈 목록 테스트가 있나?
            4 구현           → 읽는다
            5 빠진 것        → lines 가 비었으면? 두 번 누르면? 결제가 실패하면?

            결제가 실패하면 → 예외가 나 트랜잭션이 롤백된다
                             그런데 결제사에는 요청이 갔을 수도 있다
                             (AI 노트가 아니라 사람만 떠올릴 수 있는 질문)
          note: |-
            - '테스트를 먼저 읽으면 "무엇을 보장하려는지"를 작성자의 말로 알 수 있다'
            - '`lines`가 빈 목록이면 금액 0원 주문이 만들어진다 — diff에는 안 보인다'
            - '외부 호출을 트랜잭션 안에서 하는 것은 이 저장소에서는 금지다(AGENTS.md §2) — 팀마다 이런 규칙이 있다'
        predict:
          question: 바뀐 파일을 위에서부터 한 줄씩 읽는 방식의 가장 큰 약점은?
          choices:
            - 지엽적인 것만 보이고 "빠진 것"을 찾지 못한다
            - 시간이 더 걸린다
            - 파일 순서가 뒤죽박죽이다
            - 테스트를 두 번 읽게 된다
          answer: 지엽적인 것만 보이고 "빠진 것"을 찾지 못한다
          explanation: |-
            한 줄씩 읽으면 **있는 코드**만 보게 된다. 그런데 리뷰에서 가장 값진 지적은
            "빈 목록일 때는요?", "실패하면 앞의 것은요?" 같은 **없는 코드**에 대한 것이다.
            그건 "이 변경이 무엇을 하려는가"를 먼저 알아야 떠오른다. 그래서 밖에서 안으로 읽는다.
        complete:
          question: 리뷰에서 "빠진 것"을 찾을 때 물어볼 세 가지를 채우세요.
          code: |-
            - 목록이 비었을 때는?
            - ___ 번 부르면?
            - ___ 하면 그 앞에서 한 일은?
          answers:
            - ["두", "2"]
            - [실패]
          explanation: |-
            **비어 있음 / 두 번 / 실패** 셋이다. 대부분의 빠진 처리가 이 셋 중 하나에 걸린다.
            변경된 동작마다 소리 내어 물어보면 된다.
        problem:
          prompt: |-
            아래 변경을 리뷰하세요. 설명에는 "쿠폰 사용 기능 추가"라고만 적혀 있습니다.

            ```java
            @Transactional
            public void useCoupon(Long couponId, Long orderId) {
                Coupon coupon = couponRepository.findById(couponId).orElseThrow();
                Order order = orderRepository.findById(orderId).orElseThrow();

                order.applyDiscount(coupon.getDiscountRate());
                coupon.use();
            }
            ```

            **밖에서 안으로** 읽으며 물어볼 것을 **다섯 가지 이상** 쓰세요.
            각 물음이 U2의 어느 단계에서 나온 것인지 적으세요.
          deliverables:
            - 물음 5개 이상 (각각 어느 단계에서 나왔는지)
            - 그중 **가장 중요한 하나**와 그 이유
          hints:
            - 1단계부터 시작하세요 — 이 변경이 무엇을 하려는지 설명이 충분한가요?
            - 쿠폰은 남의 것일 수도 있습니다.
            - '"두 번 부르면?"을 이 코드에 대입해 보세요.'
          modelAnswer: |-
            | 단계 | 물음 |
            |---|---|
            | 1 무엇을 하려는가 | "쿠폰 사용"이라는 설명만으로는 **할인이 어떻게 계산되는지** 알 수 없다. 정률인가 정액인가? 이미 할인이 적용된 주문에 또 쓰면? |
            | 2 계약 | 이 동작을 부르는 API가 새로 생겼나? 생겼다면 규격과 오류 코드도 함께 바뀌었나? |
            | 3 테스트 | **테스트가 하나도 없다.** 성공·이미 사용한 쿠폰·남의 쿠폰 세 가지는 있어야 한다 |
            | 5 빠진 것 — 권한 | `couponId`가 **그 주문의 주인 것인지** 확인하지 않는다. 남의 쿠폰 번호를 넣으면 쓸 수 있다 |
            | 5 빠진 것 — 두 번 | 같은 요청이 두 번 오면? `coupon.use()`가 막아 주는지, 아니면 할인만 두 번 적용되는지 |
            | 5 빠진 것 — 순서 | `applyDiscount`가 먼저고 `use()`가 나중이다. `use()`가 예외를 던지면 트랜잭션이 롤백되니 괜찮은가? **확인해야 한다** |
            | 5 빠진 것 — 만료 | 만료된 쿠폰인지 아무도 보지 않는다 |

            **가장 중요한 하나: 권한 확인이 없는 것.** 나머지는 버그지만 이것은 **남의 것을 쓸 수 있는 구멍**이다.
            테스트가 없는 것도 크지만, 테스트를 붙이려면 먼저 "무엇이 옳은지"를 정해야 하므로 이 질문이 앞선다.
          selfChecks:
            - 물음이 다섯 개 이상이고 서로 다른 단계에서 나왔는가
            - '"빠진 것" 물음에 비어 있음·두 번·실패 중 적어도 둘이 들어갔는가'
            - 가장 중요한 것으로 **권한 확인**을 골랐는가 (또는 그만한 이유를 댔는가)

      - key: LESSON.PRACTICAL_ENGINEERING.CODE_REVIEW.001.U3
        title: 보안 관점에서 반드시 보는 것
        minutes: 12
        core: true
        prerequisiteUnits:
          - LESSON.PRACTICAL_ENGINEERING.CODE_REVIEW.001.U2
        explain: |-
          보안 문제는 **기능 테스트를 전부 통과한다.** 그래서 리뷰에서 눈으로 잡지 못하면 그대로 나간다.
          매번 보는 목록을 정해 두면 놓치지 않는다.

          **1. 남의 것에 닿을 수 있나** — id를 받아 처리하는 모든 자리에서 "이게 **이 사용자 것**인지"를 확인하나.
          이 확인을 빠뜨리는 것이 가장 흔하고 가장 크다. 확인 실패 시 403보다 **404가 안전하다** —
          403은 "그게 있긴 하다"를 알려 준다.

          **2. 입력을 믿지 않나** — 클라이언트가 보낸 값은 전부 의심한다.
          특히 **정렬 컬럼·검색 필드처럼 질의에 끼워 넣는 값**은 허용 목록으로만 받는다.
          문자열을 이어 붙여 SQL을 만들면 그 자리가 구멍이다.

          **3. 비밀이 새지 않나** — OWASP Logging Cheat Sheet는 로그에 **"보통 직접 기록하지 말아야 할 것"** 으로
          **세션 식별 값, 접근 토큰, 민감한 개인정보, 인증 비밀번호, DB 접속 문자열, 암호화 키,
          결제 카드 정보, 애플리케이션 소스 코드**를 든다.
          응답 본문도 마찬가지다 — 오류에 스택 트레이스를 담으면 내부 구조가 나간다.

          **4. 무엇이 남나** — 같은 문서는 **"항상 기록할 것"** 으로
          **입력 검증 실패, 인증 성공·실패, 권한 검사 실패, 세션 관리 실패, 애플리케이션 오류,
          위험도 높은 기능 사용**을 든다. 사고가 났을 때 추적할 수 있으려면 이것들이 남아 있어야 한다.

          한 줄로: **비밀은 지우고 사건은 남긴다.**
        example:
          language: java
          code: |-
            // 나쁘다
            @GetMapping("/orders/{orderId}")
            public OrderView get(@PathVariable Long orderId) {
                log.info("주문 조회 token={} body={}", token, request);   // 토큰·본문이 로그에
                return orderService.get(orderId);                        // 누구 주문인지 안 본다
            }

            // 낫다
            @GetMapping("/orders/{orderId}")
            public OrderView get(CurrentUser user, @PathVariable Long orderId) {
                return orderService.get(user.id(), orderId);   // 소유자까지 조건에 넣는다
            }                                                   // 남의 것이면 404

            // 정렬 컬럼은 허용 목록으로만
            private static final Set<String> SORTABLE = Set.of("orderedAt", "totalAmount");

            if (!SORTABLE.contains(sort)) {
                throw new BusinessValidationException("sort", "VALUE_NOT_ALLOWED");
            }
          output: |-
            남의 주문 번호를 넣으면
              나쁜 쪽 → 남의 주문이 그대로 보인다
              나은 쪽 → 404 (있다는 사실도 알리지 않는다)

            로그에 남는 것
              나쁜 쪽 → 토큰·요청 본문   (OWASP 가 금지한 것)
              나은 쪽 → 권한 검사 실패   (OWASP 가 항상 남기라는 것)
          note: |-
            - '소유자 확인은 **조회 조건에 넣는 것**이 안전하다. 읽고 나서 비교하면 빠뜨리기 쉽다'
            - '정렬·검색 컬럼은 허용 목록. 이어 붙이면 그 자리가 구멍이다'
            - '"비밀은 지우고 사건은 남긴다" — 로그에서 뺄 것과 꼭 넣을 것이 둘 다 있다'
        predict:
          question: 남의 주문을 조회했을 때 403을 주면 무엇을 알려 주게 되나?
          choices:
            - 그 번호의 주문이 존재한다는 사실. 번호를 훑어 남의 주문 수를 셀 수 있다
            - 아무것도 알려 주지 않는다. 403이 더 정확하다
            - 서버 내부 구조
            - 사용자의 권한 등급
          answer: 그 번호의 주문이 존재한다는 사실. 번호를 훑어 남의 주문 수를 셀 수 있다
          explanation: |-
            403은 "있긴 한데 당신은 못 본다"는 뜻이다. 없는 번호는 404가 오므로,
            번호를 하나씩 넣어 보면 **어느 번호가 실재하는지** 구분할 수 있다.
            그래서 남의 자원에는 **없는 것과 똑같이 404**로 답한다 — 존재 자체를 숨기는 것이다.
        complete:
          question: 정렬 컬럼을 안전하게 받도록 빈칸을 채우세요.
          code: |-
            private static final Set<String> SORTABLE = Set.of("orderedAt", "totalAmount");

            if (!SORTABLE.___(sort)) {
                throw new BusinessValidationException("sort", "VALUE_NOT_ALLOWED");
            }
          answers:
            - [contains]
          explanation: |-
            **허용 목록에 있는지**(`contains`)만 통과시킨다.
            "위험한 글자를 거르는" 방식(금지 목록)은 빠뜨린 글자가 늘 생긴다 — 허용 목록이 안전하다.
        problem:
          prompt: |-
            아래 코드를 보안 관점에서 리뷰하세요. 문제를 **모두** 찾고 각각 고치세요.

            ```java
            @GetMapping("/orders")
            public List<OrderView> search(@RequestParam String sort,
                                          @RequestParam String keyword) {
                log.info("검색 요청 user={} token={} keyword={}", userEmail, accessToken, keyword);

                String sql = "select * from orders where memo like '%" + keyword
                           + "%' order by " + sort;
                return jdbcTemplate.query(sql, orderRowMapper);
            }
            ```
          deliverables:
            - 찾은 문제 목록 (각각 무엇이 위험한지)
            - 고친 코드
            - 이 코드에 **추가로 남겨야 할 로그** 하나
          hints:
            - 사용자가 보낸 값이 어디로 흘러가는지 따라가 보세요.
            - 로그에 찍히는 것 중 OWASP가 금지한 것이 있습니다.
            - 이 endpoint는 **누구의** 주문을 돌려주고 있나요?
          modelAnswer: |-
            **문제**

            1. **소유자 확인이 없다** — 모든 사용자의 주문이 나간다. 가장 크다
            2. **로그에 접근 토큰이 있다** — OWASP가 금지한 것(access tokens). 이메일도 개인정보다
            3. **`keyword`를 SQL에 이어 붙인다** — 값에 따옴표를 넣으면 질의를 바꿀 수 있다
            4. **`sort`를 그대로 이어 붙인다** — 허용 목록이 없다
            5. `select *` — 칸이 늘면 조용히 응답이 바뀐다

            ```java
            private static final Set<String> SORTABLE = Set.of("orderedAt", "totalAmount");

            @GetMapping("/orders")
            public List<OrderView> search(CurrentUser user,
                                          @RequestParam String sort,
                                          @RequestParam String keyword) {
                if (!SORTABLE.contains(sort)) {
                    throw new BusinessValidationException("sort", "VALUE_NOT_ALLOWED");
                }
                return jdbcTemplate.query("""
                        select id, total_amount, ordered_at from orders
                        where customer_id = ? and memo like ?
                        order by %s desc
                        """.formatted(sort),          // 허용 목록을 통과한 값만
                        orderRowMapper,
                        user.id(), "%" + keyword + "%");   // 값은 파라미터로
            }
            ```

            **추가로 남길 로그**: 허용 목록 밖의 `sort`가 들어왔을 때의 **입력 검증 실패**.
            OWASP가 "항상 기록하라"고 드는 항목이고, 누군가 값을 탐색하고 있다는 신호이기도 하다.
            (단, `keyword` 원문이나 토큰은 남기지 않는다.)
          selfChecks:
            - 소유자 확인을 **조회 조건**에 넣었는가
            - 값은 파라미터로 넘기고 정렬 컬럼만 허용 목록으로 검사했는가
            - 로그에서 토큰을 빼고, 대신 검증 실패를 남기기로 했는가

      - key: LESSON.PRACTICAL_ENGINEERING.CODE_REVIEW.001.U4
        title: 말하는 법과 받는 법
        minutes: 10
        core: false
        prerequisiteUnits:
          - LESSON.PRACTICAL_ENGINEERING.CODE_REVIEW.001.U2
        explain: |-
          같은 지적도 어떻게 쓰느냐에 따라 고쳐지기도 하고 싸움이 되기도 한다.

          **코멘트에 세 가지를 담는다.**

          1. **무엇이** 문제인지 (코드의 그 자리)
          2. **왜** 문제인지 (어떤 상황에서 무슨 일이 생기는지)
          3. **어떻게** 하면 좋을지 (제안. 명령이 아니라 제안)

          그리고 **강도를 표시한다.** 전부 같은 무게로 적으면 받는 쪽은 무엇부터 고칠지 모른다.

          | 표시 | 뜻 |
          |---|---|
          | **반드시** | 이대로 병합하면 안 된다 (버그·보안·계약 위반) |
          | **제안** | 이렇게 하면 더 낫다. 안 해도 병합 가능 |
          | **질문** | 내가 몰라서 묻는다 |
          | **사소** | 취향 수준. 무시해도 된다 |

          **사람이 아니라 코드를 말한다.** "왜 이렇게 짰어요?"가 아니라 "이 경우에 이렇게 됩니다".
          좋은 것도 말한다 — 리뷰가 지적만 오가면 아무도 요청하고 싶어지지 않는다.

          **받는 쪽**에도 할 일이 있다.

          - 고친 것은 고쳤다고 답하고, **안 고친 것은 왜 안 고치는지** 답한다. 침묵이 가장 나쁘다
          - 세 번 이상 말이 오가면 **글을 멈추고 직접 이야기한다**
          - PR을 작게 나눈다. 1000줄짜리는 아무도 제대로 못 본다 — 그건 리뷰어 탓이 아니다
        example:
          language: text
          code: |-
            [나쁜 코멘트]
              "이거 왜 이렇게 했어요?"
              "여기 이상한데요"
              "수정 바랍니다"

            [나은 코멘트]
              반드시 — 소유자 확인이 없습니다.
                다른 사용자의 orderId 를 넣으면 남의 주문이 조회됩니다.
                조회 조건에 customerId 를 함께 넣는 건 어떨까요?

              질문 — lines 가 빈 목록이면 0원 주문이 만들어질 것 같은데,
                의도한 동작인가요? 아니면 앞단에서 막고 있나요?

              사소 — 이 변수 이름은 items 가 더 읽기 쉬울 것 같습니다. 취향이라 무시하셔도 됩니다.

              좋았습니다 — 실패 케이스 테스트가 같이 있어서 읽기 편했습니다.
          output: |-
            나쁜 코멘트
              → 받는 쪽이 방어하게 된다. 무엇을 고쳐야 할지도 모른다

            나은 코멘트
              → 무엇을·왜·어떻게가 있어 바로 고칠 수 있다
              → 강도가 표시돼 있어 우선순위가 보인다
          note: |-
            - '"왜 이렇게 했어요?"는 질문처럼 보이지만 비난으로 읽힌다. 상황을 말한다'
            - '강도 표시가 없으면 사소한 지적 하나가 병합을 막는다'
            - '좋았던 점을 적는 데는 한 줄이면 된다'
        predict:
          question: 리뷰 코멘트에 강도 표시("반드시" / "제안" / "사소")가 없으면 무엇이 문제인가?
          choices:
            - 받는 쪽이 무엇부터 고쳐야 할지 몰라 사소한 지적까지 병합을 막는다
            - 코멘트가 길어진다
            - 리뷰어가 더 피곤하다
            - 아무 문제 없다
          answer: 받는 쪽이 무엇부터 고쳐야 할지 몰라 사소한 지적까지 병합을 막는다
          explanation: |-
            전부 같은 무게로 보이면 받는 쪽은 **전부 고쳐야 한다**고 느낀다.
            변수 이름 취향 하나 때문에 병합이 하루 늦어지고, 그런 일이 반복되면 리뷰 자체를 피하게 된다.
            반대로 정말 중요한 지적이 사소한 것들 사이에 묻히기도 한다. **한 단어로 표시하면 둘 다 해결된다.**
        complete:
          question: 좋은 코멘트에 담을 세 가지를 채우세요.
          code: |-
            - 무엇이 문제인지 (코드의 그 자리)
            - ___ 문제인지 (어떤 상황에서 무슨 일이)
            - ___ 하면 좋을지 (제안)
          answers:
            - [왜]
            - [어떻게]
          explanation: |-
            **무엇·왜·어떻게** 셋이다. 하나라도 빠지면 받는 쪽이 되묻게 되고,
            특히 "왜"가 없으면 지적이 취향처럼 읽힌다.
        problem:
          prompt: |-
            아래 코멘트 넷을 다시 쓰세요. **강도 표시**를 붙이고 무엇·왜·어떻게를 담으세요.

            1. "여기 왜 트랜잭션 거셨어요?"
            2. "이러면 안 되죠"
            3. "변수명이 별로네요"
            4. "테스트 없네요"

            그리고 이 PR이 800줄이라면 **리뷰어로서 먼저 할 말**을 한 줄 쓰세요.
          deliverables:
            - 다시 쓴 코멘트 4개 (강도 표시 포함)
            - 800줄 PR에 먼저 할 말
          hints:
            - 2번은 무엇이 문제인지조차 안 적혀 있습니다. 상황을 가정해서 채워 보세요.
            - 3번은 강도가 어느 정도일까요?
            - 800줄을 제대로 보려면 무엇이 필요할까요? 그건 리뷰어가 할 수 있는 일일까요?
          modelAnswer: |-
            **1** — 질문: 이 메서드에 트랜잭션을 여신 이유가 궁금합니다.
            안에서 외부 결제 API를 부르고 있어서, 결제가 느려지면 DB 커넥션을 오래 잡을 것 같습니다.
            의도한 범위인지, 아니면 결제를 트랜잭션 밖으로 빼는 게 나을지 의견 듣고 싶습니다.

            **2** — 반드시: 빈 목록이 들어오면 0원 주문이 만들어집니다.
            `lines`가 비었을 때 `IllegalArgumentException`을 던지거나, 앞단에서 막는 게 어떨까요?

            **3** — 사소: `data`보다 `orderLines`가 무엇이 담겼는지 바로 보일 것 같습니다.
            취향 차이라 무시하셔도 됩니다.

            **4** — 반드시: 이 변경에 테스트가 없습니다.
            할인 계산이 정수 나눗셈이라 경계에서 틀리기 쉬운데, 지금은 틀려도 아무도 모릅니다.
            성공 · 이미 사용한 쿠폰 · 만료된 쿠폰 세 가지만이라도 있으면 좋겠습니다.

            **800줄 PR에 먼저 할 말**

            "이 PR이 800줄이라 한 번에 제대로 보기 어렵습니다.
            **리팩터링과 기능 추가를 두 PR로 나눠** 주실 수 있을까요? 그러면 각각을 제대로 볼 수 있습니다."

            (그냥 대충 보고 승인하는 것이 가장 나쁘다 — 리뷰가 있었다는 기록만 남고 실제로는 없는 것이 된다.)
          selfChecks:
            - 넷 모두 강도 표시가 있고 서로 다른 강도가 섞여 있는가
            - 각 코멘트에 **왜**(어떤 상황에서 무슨 일이)가 들어 있는가
            - 800줄 PR에 "대충 승인" 대신 **나누자고** 말했는가

    commonMistakes:
      - 포맷·미사용 변수처럼 기계가 잡을 것을 사람이 짚는다. 정작 경계 조건을 볼 힘이 남지 않는다 (U1)
      - 바뀐 줄만 위에서부터 읽는다. "빠진 것"은 그렇게 읽으면 절대 안 보인다 (U2)
      - 강도 표시 없이 코멘트를 단다. 사소한 지적이 병합을 막고 중요한 지적은 묻힌다 (U4)
    inProject: |-
      혼자 만드는 주문 시스템에도 그대로 쓴다. 커밋하기 전에 `spotlessApply`와 `check`로
      기계가 잡을 것을 걸러 내고(U1), 내 변경을 **밖에서 안으로** 다시 읽는다(U2) —
      특히 "비어 있음·두 번·실패" 셋을 소리 내어 물어본다.
      id를 받는 자리마다 소유자 확인이 있는지, 로그에 토큰이 찍히지 않는지 훑는다(U3).
      동생과 함께 만든다면 U4의 강도 표시를 처음부터 쓰기로 정해 둔다 — 그것 하나로 리뷰의 분위기가 정해진다.
