# DevPilot 개념 노트 — 스프링 예외 처리와 오류 응답
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 기준 버전: Spring Boot 4.1 / Spring Framework 7 (AGENTS.md §0)
# - 1단계(CRUD와 검증)에서 쓴다. JAVA.EXCEPTION 노트를 먼저 본 것으로 전제한다
lessons:
  - key: LESSON.SPRING.EXCEPTION_HANDLING.001
    skillCode: SPRING.EXCEPTION_HANDLING
    title: 실패를 한 곳에서 응답으로 바꾸기 (ProblemDetail)
    whyItMatters: |-
      예외를 컨트롤러마다 잡아 응답을 만들면, 같은 실패가 화면마다 다른 모양으로 나간다.
      그러면 앱은 오류마다 다르게 파싱해야 하고, 어느 날 누군가 스택 트레이스를 그대로 내보낸다.
      주문 시스템의 재고 부족·쿠폰 만료·권한 없음이 **같은 모양의 응답**으로 나가야
      화면이 한 가지 방법으로 다룰 수 있다.
    oneLine: 예외를 HTTP 응답으로 바꾸는 일은 한 곳에 모으고, 응답 본문은 RFC 9457 ProblemDetail 한 가지로 맞춘다.
    units:
      - key: LESSON.SPRING.EXCEPTION_HANDLING.001.U1
        title: 예외를 응답으로 바꾸는 자리 한 곳
        minutes: 10
        core: true
        explain: |-
          스프링은 컨트롤러에서 예외가 올라오면 **그 예외를 다룰 줄 아는 메서드**를 찾는다.
          찾는 방법은 두 가지다.

          - `@ExceptionHandler` 를 붙인 메서드 — **그 컨트롤러 안에서만** 쓰인다
          - `@RestControllerAdvice` 클래스 안의 `@ExceptionHandler` — **모든 컨트롤러**에 쓰인다

          정석은 뒤쪽이다. 실패를 응답으로 바꾸는 규칙이 한 파일에 모이므로
          같은 실패가 어디서 나든 같은 모양으로 나간다.

          컨트롤러는 그래서 **예외를 잡지 않는다.** `try`-`catch` 없이 서비스를 부르고,
          실패는 그대로 위로 올라가 advice가 받는다.
          앞 노트에서 "여기서 할 수 있는 일이 있을 때만 잡는다"고 한 그 기준 그대로다.
        example:
          language: java
          code: |-
            @RestControllerAdvice
            public class ApiExceptionHandler {

                @ExceptionHandler(OutOfStockException.class)
                public ProblemDetail handleOutOfStock(OutOfStockException exception) {
                    return ProblemDetail.forStatusAndDetail(
                            HttpStatus.CONFLICT, exception.getMessage());
                }

                @ExceptionHandler(IllegalArgumentException.class)
                public ProblemDetail handleIllegalArgument(IllegalArgumentException exception) {
                    return ProblemDetail.forStatusAndDetail(
                            HttpStatus.BAD_REQUEST, exception.getMessage());
                }
            }

            @RestController
            class OrderController {

                @PostMapping("/orders")
                OrderResponse place(@RequestBody OrderRequest request) {
                    return orderService.place(request);   // 예외를 잡지 않는다
                }
            }
          output: |-
            POST /orders  (재고 부족)
            HTTP/1.1 409 Conflict
            Content-Type: application/problem+json

            {"type":"about:blank","title":"Conflict","status":409,
             "detail":"재고 부족: KB-01 요청 5, 남은 수량 3"}
          note: |-
            - 컨트롤러에 `try`가 없다. 짧고, 성공 경로만 읽으면 된다
            - advice가 예외 **타입별로** 상태 코드를 정한다 — 재고 부족은 409, 잘못된 값은 400
            - 응답 `Content-Type`이 `application/problem+json`이다. 보통 JSON과 구분된다
            - `detail`에 도메인 예외의 메시지가 그대로 들어갔다
        predict:
          question: '`handleOutOfStock`을 지우면 재고 부족 요청의 응답 상태 코드는?'
          choices:
            - 500 — 다룰 줄 아는 메서드가 없어 서버 오류가 된다
            - 409 — 그대로다
            - 400 — IllegalArgumentException 처리기가 대신 받는다
            - 404
          answer: 500 — 다룰 줄 아는 메서드가 없어 서버 오류가 된다
          explanation: |-
            `OutOfStockException`은 `RuntimeException`이지 `IllegalArgumentException`이 아니므로
            남은 처리기에 걸리지 않는다. 다루는 곳이 없는 예외는 서버 오류로 나간다.
            **재고 부족은 사용자가 고칠 수 있는 실패인데 500으로 나가는 것**이 문제다.
        complete:
          question: 모든 컨트롤러에 적용되는 예외 처리 클래스를 만드세요.
          code: |-
            @___
            public class ApiExceptionHandler {

                @___(CouponNotFoundException.class)
                public ProblemDetail handleCouponNotFound(CouponNotFoundException exception) {
                    return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, exception.getMessage());
                }
            }
          answers:
            - [RestControllerAdvice]
            - [ExceptionHandler]
          explanation: |-
            `@RestControllerAdvice`가 "모든 컨트롤러에 적용"을 뜻하고,
            `@ExceptionHandler`가 "이 타입의 예외를 내가 받는다"를 뜻한다.
            둘을 합치면 실패를 응답으로 바꾸는 규칙이 한 파일에 모인다.
        problem:
          prompt: |-
            주문 API의 예외 처리를 한 곳으로 모으세요.

            - 지금은 컨트롤러마다 `try`-`catch`로 `ResponseEntity`를 직접 만들고 있다
            - 다뤄야 할 실패: 잘못된 요청 값, 없는 주문, 이미 배송된 주문 취소 시도, 재고 부족
            - 넷에 각각 어떤 상태 코드를 줄지 정하고 그 이유를 적으세요
            - advice 클래스를 작성하고, 컨트롤러에서 `try`를 모두 걷어내세요
          deliverables:
            - 네 가지 실패와 각각의 상태 코드, 고른 이유
            - advice 클래스의 코드
            - try를 걷어낸 컨트롤러 코드
          hints:
            - 400과 404와 409는 각각 무엇이 잘못됐다는 뜻인지 먼저 정리하세요.
            - '"값이 잘못"과 "지금 그 일을 할 수 없음"은 다른 상태 코드입니다.'
            - 컨트롤러가 짧아지지 않았다면 아직 다 옮기지 않은 것입니다.
          modelAnswer: |-
            | 실패 | 상태 | 이유 |
            |---|---|---|
            | 잘못된 요청 값 | 400 | 보낸 값 자체가 규칙에 안 맞는다 |
            | 없는 주문 | 404 | 가리킨 자원이 없다 |
            | 이미 배송된 주문 취소 | 409 | 값은 맞지만 지금 상태에서 할 수 없다 |
            | 재고 부족 | 409 | 자원의 현재 상태와 충돌한다 |

            ```java
            @RestControllerAdvice
            public class ApiExceptionHandler {

                @ExceptionHandler(IllegalArgumentException.class)
                ProblemDetail handleBadRequest(IllegalArgumentException exception) {
                    return ProblemDetail.forStatusAndDetail(HttpStatus.BAD_REQUEST, exception.getMessage());
                }

                @ExceptionHandler(OrderNotFoundException.class)
                ProblemDetail handleNotFound(OrderNotFoundException exception) {
                    return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, exception.getMessage());
                }

                @ExceptionHandler({IllegalStateException.class, OutOfStockException.class})
                ProblemDetail handleConflict(RuntimeException exception) {
                    return ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT, exception.getMessage());
                }
            }

            @RestController
            class OrderController {

                @DeleteMapping("/orders/{id}")
                void cancel(@PathVariable long id) {
                    orderService.cancel(id);
                }
            }
            ```

            `@ExceptionHandler`에 타입을 여러 개 적을 수 있으므로 같은 상태 코드끼리 묶었다.
            컨트롤러는 성공 경로 한 줄만 남았다.
          selfChecks:
            - 컨트롤러에서 try-catch를 모두 걷어냈는가
            - 네 실패에 서로 맞는 상태 코드를 주었는가
            - 400과 409의 차이를 말로 설명할 수 있는가
            - 같은 상태 코드끼리 묶어 처리기 수를 줄였는가
      - key: LESSON.SPRING.EXCEPTION_HANDLING.001.U2
        title: 오류 응답의 표준 모양 (RFC 9457)
        minutes: 12
        core: true
        explain: |-
          오류 본문을 프로젝트마다 다르게 만들면, 앱은 API마다 다른 파싱 코드를 갖게 된다.
          그래서 표준이 생겼다 — **RFC 9457 Problem Details for HTTP APIs**.
          스프링은 이것을 `ProblemDetail` 타입으로 지원한다.

          | 필드 | 뜻 |
          |---|---|
          | `type` | 이 오류 종류를 설명하는 URI. 기본은 `about:blank` |
          | `title` | 사람이 읽는 짧은 요약. 같은 `type`이면 같다 |
          | `status` | HTTP 상태 코드 |
          | `detail` | **이번 건에 대한** 설명 |
          | `instance` | 이 오류가 난 자원의 URI |

          여기에 **우리만의 필드를 더할 수 있다.** `setProperty(이름, 값)` 으로 넣으면
          JSON 맨 위에 함께 나간다. 화면이 분기할 기계용 코드는 이렇게 넣는다 —
          `detail` 문구는 바뀔 수 있지만 코드는 안 바뀌기 때문이다.

          응답의 `Content-Type`은 `application/problem+json`이다.
        example:
          language: java
          code: |-
            @ExceptionHandler(OutOfStockException.class)
            public ProblemDetail handleOutOfStock(OutOfStockException exception) {
                ProblemDetail problem = ProblemDetail.forStatusAndDetail(
                        HttpStatus.CONFLICT, exception.getMessage());
                problem.setTitle("재고 부족");
                problem.setType(URI.create("https://api.example.com/errors/out-of-stock"));
                problem.setProperty("code", "OUT_OF_STOCK");
                problem.setProperty("productCode", exception.productCode());
                return problem;
            }
          output: |-
            HTTP/1.1 409 Conflict
            Content-Type: application/problem+json

            {
              "type": "https://api.example.com/errors/out-of-stock",
              "title": "재고 부족",
              "status": 409,
              "detail": "재고 부족: KB-01 요청 5, 남은 수량 3",
              "code": "OUT_OF_STOCK",
              "productCode": "KB-01"
            }
          note: |-
            - `title`은 종류의 이름, `detail`은 **이번 건**의 설명이다. 둘은 다르다
            - `code`는 화면이 분기할 기계용 값이다. 문구가 바뀌어도 이것은 안 바뀐다
            - `setProperty`로 넣은 값은 중첩되지 않고 **맨 위에** 붙는다
            - `productCode`처럼 화면이 쓸 값을 함께 주면 다시 조회할 필요가 없다
        predict:
          question: '`setProperty("code", "OUT_OF_STOCK")` 대신 `detail`의 문구로만 구분한다면 무엇이 문제인가?'
          choices:
            - 문구를 다듬을 때마다 화면의 분기 코드가 깨진다
            - JSON이 더 커진다
            - 상태 코드가 200으로 바뀐다
            - 아무 문제 없다
          answer: 문구를 다듬을 때마다 화면의 분기 코드가 깨진다
          explanation: |-
            사람이 읽는 문구는 자주 바뀐다. 번역이 붙거나 표현을 다듬는다.
            **사람용 문구와 기계용 코드를 갈라 두는 것**이 오류 응답 설계의 기본이고,
            RFC 9457이 확장 필드를 허용하는 이유이기도 하다.
        complete:
          question: 쿠폰 만료 오류에 기계용 코드와 상태를 붙이세요.
          code: |-
            ProblemDetail problem = ProblemDetail.___(
                    HttpStatus.CONFLICT, "만료된 쿠폰입니다");
            problem.setTitle("쿠폰 만료");
            problem.___("code", "COUPON_EXPIRED");
            return problem;
          answers:
            - [forStatusAndDetail]
            - [setProperty]
          explanation: |-
            `forStatusAndDetail(상태, 설명)`으로 만들고 `setProperty`로 우리 필드를 더한다.
            `status`는 만들 때 정한 값이 그대로 응답 상태 코드가 된다.
        problem:
          prompt: |-
            주문 API의 오류 응답 규격을 설계하고 구현하세요.

            - 모든 오류 응답에 `code` 필드가 들어간다. 값은 대문자와 밑줄로 쓴다
            - 검증 실패일 때는 **어느 필드가 왜 틀렸는지** 목록으로 함께 내려준다
            - 없는 주문, 재고 부족, 검증 실패 세 가지를 구현하세요
            - `title`과 `detail`에 각각 무엇을 넣을지 규칙을 정하고 적으세요
          deliverables:
            - 세 가지 오류의 응답 JSON 예시
            - advice 코드
            - title과 detail의 구분 규칙 한 줄씩
          hints:
            - title은 종류마다 하나, detail은 건마다 하나입니다.
            - 필드별 오류는 목록이므로 값 하나가 아니라 여러 개를 담아야 합니다.
            - 확장 필드에는 객체나 목록도 넣을 수 있습니다.
          modelAnswer: |-
            ```java
            @RestControllerAdvice
            public class ApiExceptionHandler {

                record FieldErrorView(String field, String reason) {}

                @ExceptionHandler(MethodArgumentNotValidException.class)
                ProblemDetail handleValidation(MethodArgumentNotValidException exception) {
                    ProblemDetail problem = ProblemDetail.forStatusAndDetail(
                            HttpStatus.BAD_REQUEST, "요청 값이 규칙에 맞지 않습니다");
                    problem.setTitle("검증 실패");
                    problem.setProperty("code", "VALIDATION_FAILED");
                    problem.setProperty("errors", exception.getBindingResult().getFieldErrors().stream()
                            .map(error -> new FieldErrorView(error.getField(), error.getDefaultMessage()))
                            .toList());
                    return problem;
                }
            }
            ```

            ```json
            {"type":"about:blank","title":"검증 실패","status":400,
             "detail":"요청 값이 규칙에 맞지 않습니다","code":"VALIDATION_FAILED",
             "errors":[{"field":"quantity","reason":"1 이상이어야 합니다"}]}
            ```

            규칙은 이렇다 — **`title`은 오류 종류의 이름**으로 같은 `code`면 항상 같고,
            **`detail`은 이번 건에서 무엇이 어긋났는지**를 적는다.
            화면은 `code`로 분기하고 `detail`을 사용자에게 보여 준다.
          selfChecks:
            - 세 오류 모두 code 필드를 갖는가
            - title이 종류마다 하나로 고정되는가
            - detail이 이번 건의 정보를 담고 있는가
            - 검증 실패에서 어느 필드가 틀렸는지 화면이 알 수 있는가
      - key: LESSON.SPRING.EXCEPTION_HANDLING.001.U3
        title: 내보낼 것과 감출 것 가르기
        minutes: 10
        core: true
        explain: |-
          오류 응답에 스택 트레이스를 담으면 공격자에게 **프레임워크 버전, 패키지 구조,
          쓰는 라이브러리, 쿼리 모양**을 통째로 알려 주게 된다.
          그런데 개발자는 원인을 알아야 한다. 그래서 둘을 갈라 둔다.

          | 어디 | 무엇 |
          |---|---|
          | **응답** | 상태 코드, 기계용 `code`, 사람이 읽을 `detail`. 그것뿐 |
          | **로그** | 예외 타입, 메시지, 스택 트레이스, 원인 사슬, 요청 식별자 |

          잇는 방법은 **요청 식별자**다. 응답에도 로그에도 같은 값을 남기면
          사용자가 그 값을 알려 줄 때 로그에서 그 건만 찾아낼 수 있다.

          로그 수준도 갈라야 한다. **사용자가 고칠 수 있는 실패**(400·404·409)는
          `WARN` 아래로 두고, **우리가 고쳐야 하는 실패**(500)만 `ERROR`다.
          모든 실패를 `ERROR`로 찍으면 진짜 장애가 묻힌다.
        example:
          language: java
          code: |-
            @ExceptionHandler(Exception.class)
            public ProblemDetail handleUnexpected(Exception exception) {
                String traceId = UUID.randomUUID().toString();
                log.error("처리하지 못한 오류 traceId={}", traceId, exception);   // 로그에만 전부

                ProblemDetail problem = ProblemDetail.forStatusAndDetail(
                        HttpStatus.INTERNAL_SERVER_ERROR,
                        "요청을 처리하지 못했습니다");                              // 응답에는 최소한만
                problem.setTitle("서버 오류");
                problem.setProperty("code", "INTERNAL_ERROR");
                problem.setProperty("traceId", traceId);
                return problem;
            }

            @ExceptionHandler(OutOfStockException.class)
            public ProblemDetail handleOutOfStock(OutOfStockException exception) {
                log.warn("재고 부족 {}", exception.getMessage());                  // 장애가 아니다
                return ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT, exception.getMessage());
            }
          output: |-
            [응답]
            {"title":"서버 오류","status":500,"detail":"요청을 처리하지 못했습니다",
             "code":"INTERNAL_ERROR","traceId":"6f1c..."}

            [로그]
            ERROR 처리하지 못한 오류 traceId=6f1c... java.lang.NullPointerException: ...
              at com.example.order.OrderService.place(OrderService.java:42)
              Caused by: ...
          note: |-
            - 응답에는 내부 이름이 하나도 없다. `traceId`만 다리로 남는다
            - 로그에는 예외 객체를 **마지막 인자로** 넘겨 스택 트레이스가 함께 찍히게 했다
            - 재고 부족은 `WARN`이다 — 사용자가 수량을 고치면 되는 일이지 장애가 아니다
            - `Exception.class` 처리기는 **여기 한 곳**에만 둔다. 마지막 그물이다
        predict:
          question: '`log.error("...", traceId, exception)` 에서 마지막 `exception` 인자를 빼면 로그는 어떻게 되나?'
          choices:
            - 스택 트레이스가 찍히지 않아 원인 위치를 알 수 없다
            - 로그 자체가 남지 않는다
            - traceId도 함께 사라진다
            - 아무 차이가 없다
          answer: 스택 트레이스가 찍히지 않아 원인 위치를 알 수 없다
          explanation: |-
            메시지 한 줄만 남는다. 응답에서도 감추고 로그에도 안 남기면
            **원인을 아는 사람이 아무도 없게 된다.**
            감추는 것은 응답이지 로그가 아니다.
        complete:
          question: 사용자 잘못과 서버 잘못의 로그 수준을 갈라 빈칸을 채우세요.
          code: |-
            @ExceptionHandler(IllegalArgumentException.class)
            ProblemDetail handleBadRequest(IllegalArgumentException exception) {
                log.___("잘못된 요청 {}", exception.getMessage());
                return ProblemDetail.forStatusAndDetail(HttpStatus.BAD_REQUEST, exception.getMessage());
            }

            @ExceptionHandler(Exception.class)
            ProblemDetail handleUnexpected(Exception exception) {
                log.___("처리하지 못한 오류", exception);
                return ProblemDetail.forStatusAndDetail(
                        HttpStatus.INTERNAL_SERVER_ERROR, "요청을 처리하지 못했습니다");
            }
          answers:
            - [warn, info, debug]
            - [error]
          explanation: |-
            사용자가 값을 고치면 해결되는 실패는 장애가 아니므로 `warn` 아래에 둔다.
            우리가 고쳐야 하는 실패만 `error`로 남겨야 경보가 의미를 갖는다.
        problem:
          prompt: |-
            아래 예외 처리기는 세 가지를 잘못하고 있다.

            ```java
            @ExceptionHandler(Exception.class)
            public ResponseEntity<String> handle(Exception e) {
                e.printStackTrace();
                return ResponseEntity.status(500).body(e.toString());
            }
            ```

            - 세 가지를 지적하고 **각각이 무엇을 새게 하거나 잃게 하는지** 적으세요
            - 고친 처리기를 작성하세요. 응답과 로그를 갈라 두어야 합니다
            - 이 처리기 하나만 두면 안 되는 이유도 적으세요
          deliverables:
            - 잘못 세 가지와 각각의 결과
            - 고친 처리기 코드
            - 이 처리기 하나만 두면 안 되는 이유
          hints:
            - 응답 본문에 무엇이 들어가는지 실제로 찍어 보세요. 클래스 이름이 보이나요?
            - printStackTrace가 어디로 나가는지, 그것이 운영 로그에 남는지 생각해 보세요.
            - 모든 실패가 500이 되면 사용자는 자기 잘못을 고칠 수 있을까요?
          modelAnswer: |-
            | 잘못 | 결과 |
            |---|---|
            | `e.toString()`을 응답 본문에 | 예외 타입과 내부 메시지가 그대로 밖으로 샌다 |
            | `printStackTrace()` | 표준 출력으로 흩어져 운영 로그에 제대로 남지 않는다 |
            | 모두 500 | 사용자 잘못까지 서버 오류가 되어 고칠 방법을 못 알려 준다 |

            ```java
            @ExceptionHandler(Exception.class)
            ProblemDetail handleUnexpected(Exception exception) {
                String traceId = UUID.randomUUID().toString();
                log.error("처리하지 못한 오류 traceId={}", traceId, exception);
                ProblemDetail problem = ProblemDetail.forStatusAndDetail(
                        HttpStatus.INTERNAL_SERVER_ERROR, "요청을 처리하지 못했습니다");
                problem.setProperty("code", "INTERNAL_ERROR");
                problem.setProperty("traceId", traceId);
                return problem;
            }
            ```

            이 처리기 하나만 두면 **모든 실패가 500이 된다.**
            재고 부족도, 없는 주문도, 잘못된 값도 전부 서버 오류로 나가
            화면이 사용자에게 무엇을 고치라고 말할 수 없다.
            타입별 처리기를 먼저 두고, 이것은 **마지막 그물**로만 쓴다.
          selfChecks:
            - 응답 본문에 예외 타입이나 스택이 들어가지 않는가
            - 로그에 스택 트레이스와 원인 사슬이 남는가
            - 응답과 로그를 잇는 식별자가 있는가
            - 타입별 처리기를 따로 두었는가
    commonMistakes:
      - 오류 응답에 스택 트레이스나 예외 타입을 담는다. 내부 구조가 그대로 밖으로 샌다 (U3)
      - 모든 실패를 500으로 내보낸다. 사용자가 고칠 수 있는 실패까지 서버 오류가 된다 (U3)
      - 사람이 읽는 문구로 화면이 분기하게 둔다. 문구를 다듬으면 화면이 깨진다 (U2)
    inProject: |-
      주문 시스템의 `ApiExceptionHandler` 한 파일이 이 노트의 결과물이다.
      도메인이 던진 예외(재고 부족·쿠폰 만료)를 상태 코드와 `code`로 옮기고,
      검증 실패는 어느 필드가 왜 틀렸는지 함께 내려준다.
      마지막 그물 하나가 500을 받아 `traceId`만 남기고 나머지는 로그로 보낸다.
