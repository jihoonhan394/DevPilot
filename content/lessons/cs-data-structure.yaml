# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 2단계(DB와 트랜잭션)에서 쓴다. JAVA.COLLECTION 노트가 "무엇을 고르나"였다면
#   이 노트는 "왜 그것이 빠른가"를 다룬다
lessons:
  - key: LESSON.CS.DATA_STRUCTURE.001
    skillCode: CS.DATA_STRUCTURE
    title: 왜 그것이 빠른가 (자료구조)
    whyItMatters: |-
      `List`와 `Map` 중에 고를 줄은 알아도, **왜** 한쪽이 빠른지 모르면
      처음 보는 상황에서 판단할 수 없다. 인덱스가 왜 조회를 빠르게 하는지,
      캐시가 왜 해시를 쓰는지도 같은 원리다.
      건수가 늘었을 때 어디가 먼저 무너질지 **미리 아는 것**이 이 노트의 목적이다.
    oneLine: 자료구조마다 빠른 연산과 느린 연산이 정해져 있고, 그 차이는 값을 어떻게 배치했는지에서 나온다.
    units:
      - key: LESSON.CS.DATA_STRUCTURE.001.U1
        title: 건수가 늘 때 어떻게 자라는가
        minutes: 10
        core: true
        explain: |-
          성능을 이야기할 때는 **건수가 늘면 일이 얼마나 늘어나는가**를 본다.
          이것을 표기하는 방법이 있다.

          | 표기 | 뜻 | 건수가 10배 되면 |
          |---|---|---|
          | `O(1)` | 건수와 무관 | 그대로 |
          | `O(log n)` | 절반씩 줄여 간다 | 조금 (3~4배) |
          | `O(n)` | 전부 훑는다 | 10배 |
          | `O(n log n)` | 정렬 | 30배쯤 |
          | `O(n²)` | 이중 반복 | **100배** |

          중요한 것은 **상수가 아니라 자라는 모양**이다.
          `O(n²)` 코드는 100건에서 멀쩡하고 10만 건에서 멈춘다.

          그래서 코드를 볼 때 묻는다 — **반복문 안에 반복문이 있나.**
          목록 안에서 다른 목록을 `contains`로 찾고 있으면 그것이 이중 반복이다.

          그리고 하나 더. **평균과 최악은 다르다.**
          해시는 평균 `O(1)`이지만 최악에는 `O(n)`이 될 수 있다.
          평균만 보고 설계하면 특정 입력에서 무너진다.
        example:
          language: java
          code: |-
            // O(n²) — 목록 안에서 목록을 찾는다
            static List<String> slowIntersect(List<String> a, List<String> b) {
                List<String> result = new ArrayList<>();
                for (String item : a) {
                    if (b.contains(item)) {     // contains 자체가 O(n)
                        result.add(item);
                    }
                }
                return result;
            }

            // O(n) — 한쪽을 Set으로 바꾼다
            static List<String> fastIntersect(List<String> a, List<String> b) {
                Set<String> lookup = new HashSet<>(b);
                List<String> result = new ArrayList<>();
                for (String item : a) {
                    if (lookup.contains(item)) {   // O(1)
                        result.add(item);
                    }
                }
                return result;
            }
          output: |-
            각 1000건
            slowIntersect  14 ms
            fastIntersect   1 ms

            각 50000건
            slowIntersect  31842 ms
            fastIntersect      8 ms
          note: |-
            - 1000건에서는 14ms 대 1ms다 — **차이가 눈에 안 띈다**
            - 50000건에서 31초 대 8ms가 된다. 50배 늘렸는데 2000배 느려졌다
            - 바뀐 것은 한 줄뿐이다. `List` 대신 `Set`에서 찾는다
            - `contains`가 무엇 위에서 도는지가 전부를 정한다
        predict:
          question: '`slowIntersect`에서 `a`와 `b`를 각각 100건으로 줄이면 몇 번 비교하나?'
          choices:
            - 최대 10000번 — 100 × 100
            - "200번"
            - "100번"
            - "10번"
          answer: 최대 10000번 — 100 × 100
          explanation: |-
            바깥 100번 × 안쪽 100번이다. 100건에서는 1만 번이라 순식간이지만,
            1만 건이면 **1억 번**이 된다.
            이중 반복은 작은 데이터에서 절대 드러나지 않는다 —
            그래서 코드 리뷰에서 **모양으로** 찾아야 한다.
        complete:
          question: 이중 반복을 없애세요.
          code: |-
            ___<String> lookup = new HashSet<>(b);   // 먼저 옮겨 담는다
            for (String item : a) {
                if (lookup.___(item)) {               // O(1)
                    result.add(item);
                }
            }
          answers:
            - [Set]
            - [contains]
          explanation: |-
            찾는 쪽을 `Set`으로 한 번 바꿔 두면 그 뒤 `contains`가 전부 `O(1)`이다.
            옮겨 담는 비용이 `O(n)` 한 번 드는데, 그 뒤 `n`번의 찾기가 싸져서 훨씬 이득이다.
        problem:
          prompt: |-
            아래 세 코드의 복잡도를 구하고, 필요하면 고치세요.

            ```java
            // A: 주문 목록에서 회원 이름 채우기
            for (Order order : orders) {
                for (Member member : members) {
                    if (member.id() == order.memberId()) { order.setMemberName(member.name()); }
                }
            }

            // B: 중복 제거
            List<String> unique = new ArrayList<>();
            for (String code : codes) {
                if (!unique.contains(code)) { unique.add(code); }
            }

            // C: 가장 비싼 주문 찾기
            Order max = orders.get(0);
            for (Order order : orders) {
                if (order.amount() > max.amount()) { max = order; }
            }
            ```

            - 셋의 복잡도를 각각 적으세요
            - 고쳐야 할 것을 고쳐 쓰고, **고친 뒤 복잡도**를 적으세요
            - 고칠 필요가 없는 것이 왜 괜찮은지 적으세요
          deliverables:
            - 셋의 복잡도
            - 고친 코드와 고친 뒤 복잡도
            - 고칠 필요 없는 것과 그 이유
          hints:
            - 반복문 안에 반복문이 있는지, 또는 O(n)짜리 메서드 호출이 있는지 보세요.
            - contains가 무엇 위에서 도는지 확인하세요.
            - 한 번만 훑는 코드는 더 줄일 수 없습니다.
          modelAnswer: |-
            | | 복잡도 | 고칠까 |
            |---|---|---|
            | A | `O(n × m)` | **고친다** |
            | B | `O(n²)` — `List.contains`가 `O(n)` | **고친다** |
            | C | `O(n)` | 괜찮다 |

            ```java
            // A: 회원을 지도로 바꿔 둔다 → O(n + m)
            Map<Long, String> nameById = members.stream()
                    .collect(Collectors.toMap(Member::id, Member::name));
            for (Order order : orders) {
                order.setMemberName(nameById.get(order.memberId()));
            }

            // B: Set이 중복을 막아 준다 → O(n)
            List<String> unique = new ArrayList<>(new LinkedHashSet<>(codes));
            ```

            A는 앞 노트의 **N+1과 같은 모양**이다 — 바깥 하나마다 안쪽을 전부 훑는다.
            지도로 바꿔 두면 안쪽이 `O(1)`이 된다.

            B는 `LinkedHashSet`으로 순서를 지키면서 중복을 막았다.
            "중복을 막는 그릇"을 쓰면 검사 코드가 아예 필요 없다.

            C는 **한 번만 훑으므로 `O(n)`이고 더 줄일 수 없다.**
            최댓값을 찾으려면 모든 값을 적어도 한 번은 봐야 하기 때문이다.
            이미 최선인 것을 고치려 드는 것도 낭비다.
          selfChecks:
            - 셋의 복잡도를 정확히 구했는가
            - List.contains가 O(n)이라는 것을 반영했는가
            - 고칠 필요 없는 것을 골라냈는가
            - 고친 뒤 복잡도를 다시 계산했는가
      - key: LESSON.CS.DATA_STRUCTURE.001.U2
        title: 배열과 연결 리스트, 해시 테이블
        minutes: 12
        core: true
        explain: |-
          자바 컬렉션 뒤에 있는 구조는 셋이다.

          **배열** (`ArrayList`) — 값을 **한 줄로 붙여** 담는다.
          `i`번째 자리는 시작 주소에서 바로 계산되므로 조회가 `O(1)`이다.
          대신 중간에 끼워 넣으면 **뒤를 전부 밀어야** 해서 `O(n)`이다.

          **연결 리스트** (`LinkedList`) — 값마다 "다음은 여기"를 들고 있다.
          중간 삽입이 `O(1)`이지만, `i`번째를 찾으려면 **처음부터 따라가야** 해서 `O(n)`이다.

          **해시 테이블** (`HashMap`, `HashSet`) — 값에서 **자리를 계산한다**.
          `hashCode()`로 번호를 얻어 그 칸으로 바로 간다. 평균 `O(1)`이다.

          | | 조회 | 중간 삽입 | 값으로 찾기 |
          |---|---|---|---|
          | 배열 | `O(1)` | `O(n)` | `O(n)` |
          | 연결 리스트 | `O(n)` | `O(1)` | `O(n)` |
          | 해시 테이블 | — | `O(1)` 평균 | **`O(1)` 평균** |

          실무에서는 **거의 언제나 `ArrayList`와 `HashMap`** 이다.
          `LinkedList`가 이기는 경우는 드물다 — 중간 삽입이 `O(1)`이어도
          그 자리를 찾아가는 데 `O(n)`이 들기 때문이다.
        example:
          language: java
          code: |-
            int size = 100_000;
            List<Integer> arrayList = new ArrayList<>();
            List<Integer> linkedList = new LinkedList<>();
            for (int i = 0; i < size; i++) {
                arrayList.add(i);
                linkedList.add(i);
            }

            long start = System.nanoTime();
            for (int i = 0; i < size; i += 1000) {
                arrayList.get(i);            // 바로 간다
            }
            System.out.println("ArrayList get  " + (System.nanoTime() - start) / 1000 + "us");

            start = System.nanoTime();
            for (int i = 0; i < size; i += 1000) {
                linkedList.get(i);           // 처음부터 따라간다
            }
            System.out.println("LinkedList get " + (System.nanoTime() - start) / 1000 + "us");
          output: |-
            ArrayList get  12us
            LinkedList get 48213us

            (같은 100번의 조회인데 4000배 차이)
          note: |-
            - `ArrayList.get`은 **주소 계산 한 번**이다. 건수와 무관하다
            - `LinkedList.get(50000)`은 5만 번 따라간다
            - 둘 다 `List`라서 **코드만 봐서는 차이가 안 보인다**
            - 그래서 선언 타입은 `List`로 두되 **무엇으로 만들지는 의식해서** 고른다
        predict:
          question: '`LinkedList`를 `for (Integer value : linkedList)` 로 전부 순회하면?'
          choices:
            - "O(n) — 순회는 빠르다. 느린 것은 인덱스로 찾는 것이다"
            - "O(n²)"
            - "O(1)"
            - ArrayList보다 언제나 느리다
          answer: "O(n) — 순회는 빠르다. 느린 것은 인덱스로 찾는 것이다"
          explanation: |-
            순회는 다음 칸을 따라가기만 하므로 한 번에 한 칸씩, 전체 `O(n)`이다.
            느려지는 것은 **`get(i)`를 반복할 때**다.
            `for (int i = 0; i < list.size(); i++) list.get(i)` 형태가 `O(n²)`이 되는 것이다.
        complete:
          question: 값으로 찾는 일이 잦은 자료를 담으세요.
          code: |-
            // 상품 코드로 상품을 자주 찾는다
            Map<String, Product> byCode = products.stream()
                    .collect(Collectors.toMap(Product::code, product -> product));

            Product found = byCode.___("KB-01");   // 평균 O(___)
          answers:
            - [get]
            - ["1"]
          explanation: |-
            해시 테이블은 **값에서 자리를 계산**하므로 건수가 늘어도 찾는 비용이 그대로다.
            목록을 매번 훑는 대신 한 번 지도로 바꿔 두면
            그 뒤의 모든 조회가 싸진다.
        problem:
          prompt: |-
            아래 요구에 맞는 자료구조를 고르고 이유를 적으세요.

            1. 주문 상세 화면에 보여 줄 주문 줄 목록 — 순서대로 보여 주기만 한다
            2. 상품 코드로 상품 정보를 자주 찾는다 — 10만 건
            3. 최근 본 상품 20개 — 새 것이 앞에 오고 오래된 것은 밀려난다
            4. 이미 처리한 요청 열쇠인지 확인 — 하루 100만 건

            - 넷에 각각 자료구조를 고르고 **어느 연산이 빨라야 하는지**와 함께 적으세요
            - 4번에서 메모리가 부담된다면 어떤 대안이 있는지 적으세요
          deliverables:
            - 넷의 자료구조와 고른 이유
            - 각각에서 빨라야 하는 연산
            - 4번의 메모리 대안
          hints:
            - 무엇을 자주 하는지가 먼저입니다. 조회인가, 삽입인가, 값으로 찾기인가.
            - 3번은 개수 상한이 있고 순서도 있습니다.
            - 100만 개를 메모리에 두면 얼마나 될까요?
          modelAnswer: |-
            | 요구 | 자료구조 | 빨라야 하는 연산 |
            |---|---|---|
            | 1. 주문 줄 목록 | `ArrayList` | 순회. 삽입·삭제가 없다 |
            | 2. 상품 코드 조회 | `HashMap` | 값으로 찾기 `O(1)` |
            | 3. 최근 본 상품 20개 | `LinkedHashMap` (접근 순서) 또는 `ArrayDeque` | 앞에 넣기, 뒤에서 빼기 |
            | 4. 처리한 열쇠 확인 | `HashSet` → **DB 표** | 있는지 확인 `O(1)` |

            3번은 **개수 상한과 순서**가 둘 다 필요하다.
            `ArrayDeque`는 양쪽 끝 연산이 `O(1)`이라 "앞에 넣고 넘치면 뒤를 버린다"에 맞다.

            4번은 `HashSet`이 맞지만 **하루 100만 건이면 메모리에 둘 수 없다.**
            열쇠 하나가 36자짜리 UUID라면 문자열 객체만 수십 MB이고,
            게다가 **서버가 여러 대면 각자 다른 집합을 갖게 되어** 중복을 못 막는다.

            대안은 앞 노트에서 쓴 것이다 — **DB 표에 기본 키로 두고 삽입을 시도한다.**
            모든 서버가 같은 것을 보고, 기간이 지난 것은 지울 수 있다.
            "메모리 자료구조로 충분한가"를 묻는 기준은
            **크기와, 서버가 여러 대일 때도 맞는가** 둘이다.
          selfChecks:
            - 무엇을 자주 하는지부터 정하고 골랐는가
            - 순서와 개수 상한이 둘 다 필요한 경우를 구분했는가
            - 메모리 크기를 실제로 어림해 봤는가
            - 서버가 여러 대일 때를 고려했는가
      - key: LESSON.CS.DATA_STRUCTURE.001.U3
        title: 정렬된 채로 두기와 우선순위
        minutes: 10
        core: false
        explain: |-
          해시는 빠르지만 **순서가 없다.** 순서가 필요하면 다른 구조를 쓴다.

          **균형 이진 탐색 트리** (`TreeMap`, `TreeSet`) —
          왼쪽은 작은 값, 오른쪽은 큰 값으로 나뉘어 있어
          찾을 때마다 **후보가 절반씩 줄어든다.** 그래서 `O(log n)`이다.

          해시보다 느리지만 얻는 것이 있다.

          - 언제나 **정렬된 순서**로 순회할 수 있다
          - **범위 조회**가 된다 — "1만 원 이상 5만 원 이하"
          - 첫 번째·마지막을 바로 꺼낸다

          **이것이 DB 인덱스와 같은 원리다.** B-tree 인덱스가
          등호뿐 아니라 범위와 정렬에 쓰이는 이유가 여기 있다.

          **힙** (`PriorityQueue`) — 전체를 정렬하지 않고
          **가장 작은(또는 큰) 것 하나만** 꼭대기에 유지한다.
          꺼내기와 넣기가 `O(log n)`이고, 꼭대기를 보는 것은 `O(1)`이다.
          "상위 10개"처럼 **전부 정렬할 필요가 없을 때** 쓴다.
        example:
          language: java
          code: |-
            TreeMap<Integer, String> byAmount = new TreeMap<>();
            byAmount.put(39000, "키보드");
            byAmount.put(12000, "마우스");
            byAmount.put(78000, "모니터");

            System.out.println(byAmount.keySet());                    // 정렬 순
            System.out.println(byAmount.firstKey() + " " + byAmount.lastKey());
            System.out.println(byAmount.subMap(10000, 50000));        // 범위

            PriorityQueue<Integer> top = new PriorityQueue<>();        // 작은 것이 꼭대기
            for (int amount : List.of(39000, 12000, 78000, 5000, 62000)) {
                top.offer(amount);
                if (top.size() > 3) {
                    top.poll();                                        // 가장 작은 것을 버린다
                }
            }
            System.out.println(new TreeSet<>(top).descendingSet());    // 상위 3개
          output: |-
            [12000, 39000, 78000]
            12000 78000
            {12000=마우스, 39000=키보드}
            [78000, 62000, 39000]
          note: |-
            - `TreeMap`은 넣은 순서와 무관하게 **언제나 키 순서**로 순회한다
            - `subMap`이 범위 조회다 — `HashMap`에는 없는 기능이다
            - 힙은 5개를 보면서 **크기 3을 유지**했다. 전부 정렬하지 않았다
            - 상위 k개를 뽑는 데 `O(n log k)`다. 전체 정렬 `O(n log n)`보다 싸다
        predict:
          question: '`HashMap`에 같은 값들을 넣고 `keySet()`을 순회하면 순서가 어떻게 되나?'
          choices:
            - 정해진 순서가 없다 — 넣은 순서도 정렬 순서도 보장하지 않는다
            - 넣은 순서대로 나온다
            - 정렬된 순서로 나온다
            - 역순으로 나온다
          answer: 정해진 순서가 없다 — 넣은 순서도 정렬 순서도 보장하지 않는다
          explanation: |-
            해시는 **자리를 계산해 흩어 놓는 것**이라 순서 개념이 없다.
            우연히 정렬돼 보이더라도 의존하면 안 된다 —
            원소가 늘어 내부 배열이 커지는 순간 순서가 통째로 바뀐다.
            순서가 필요하면 `LinkedHashMap`(넣은 순서)이나 `TreeMap`(정렬 순서)이다.
        complete:
          question: 금액 범위로 조회할 수 있게 담으세요.
          code: |-
            ___<Integer, String> byAmount = new TreeMap<>();
            // ...
            var range = byAmount.___(10000, 50000);   // 1만 이상 5만 미만
          answers:
            - [TreeMap, NavigableMap, SortedMap]
            - [subMap]
          explanation: |-
            `TreeMap`은 키가 정렬된 채로 유지되므로 **범위를 잘라 낼 수 있다.**
            이것이 DB 인덱스가 범위 조건을 처리하는 방식과 같다 —
            정렬돼 있으면 시작 지점을 찾아 그 구간만 읽으면 된다.
        problem:
          prompt: |-
            주문 시스템의 실시간 순위 화면을 만드세요.

            - 최근 1시간 주문 중 **금액 상위 10건**을 보여 준다
            - 주문은 초당 수십 건씩 들어온다
            - 화면은 5초마다 갱신된다

            - 전체를 매번 정렬하는 방식의 복잡도를 구하고, 왜 나쁜지 적으세요
            - 힙을 쓰는 방식을 설계하고 복잡도를 구하세요
            - 이 계산을 **메모리에서 할지 DB에서 할지** 판단하고 이유를 적으세요
          deliverables:
            - 전체 정렬 방식의 복잡도와 문제
            - 힙 방식의 설계와 복잡도
            - 메모리와 DB 중 고른 쪽과 이유
          hints:
            - 상위 10개만 필요한데 전부 정렬할 이유가 있을까요?
            - 힙의 크기를 10으로 유지하면 어떻게 될까요?
            - 서버가 여러 대라면 메모리 계산이 맞을까요?
          modelAnswer: |-
            전체 정렬은 `O(n log n)`이다. 1시간에 주문이 10만 건이면
            **10만 건을 정렬해서 앞의 10개만 쓰고 버린다.** 낭비가 크고,
            5초마다 반복하면 CPU를 계속 잡아먹는다.

            힙 방식은 **크기 10짜리 최소 힙**을 유지한다.

            ```java
            PriorityQueue<Order> top = new PriorityQueue<>(
                    Comparator.comparingInt(Order::amount));   // 작은 것이 꼭대기

            for (Order order : recentOrders) {
                top.offer(order);
                if (top.size() > 10) {
                    top.poll();          // 가장 작은 것을 버린다
                }
            }
            ```

            `O(n log 10)` = 사실상 `O(n)`이다. 10만 건을 한 번만 훑는다.

            그런데 **이 계산은 DB에서 하는 것이 맞다.**

            ```sql
            SELECT id, total_amount FROM orders
             WHERE created_at >= now() - interval '1 hour'
             ORDER BY total_amount DESC
             LIMIT 10;
            ```

            이유는 셋이다 — ① 10만 건을 애플리케이션으로 **가져오는 비용**이
            정렬 비용보다 크고, ② `(created_at, total_amount)` 인덱스가 있으면
            DB가 훨씬 적게 읽으며, ③ **서버가 여러 대면 각자 다른 순위**를 보게 된다.

            힙은 **이미 메모리에 있는 것**에서 상위 k개를 뽑을 때 쓰는 도구다.
            DB에 있는 것을 뽑을 때는 질의가 먼저다.
          selfChecks:
            - 전체 정렬과 힙의 복잡도를 각각 구했는가
            - 힙 크기를 k로 유지하는 구조를 썼는가
            - 데이터가 어디에 있는지로 판단했는가
            - 서버가 여러 대일 때를 고려했는가
    commonMistakes:
      - 목록 안에서 `List.contains`로 찾는다. `O(n²)`이 되어 건수가 늘면 멈춘다 (U1)
      - '`HashMap`의 순회 순서에 의존한다. 정해진 순서가 없고 언제든 바뀐다 (U3)'
      - 상위 10개를 위해 전체를 정렬한다. 힙이나 질의로 훨씬 싸게 끝난다 (U3)
    inProject: |-
      주문 시스템에서 이 노트가 쓰이는 자리는 **목록을 지도로 바꿔 두는 것**이다 —
      회원 이름 채우기, 상품 정보 붙이기처럼 두 목록을 맞출 때
      한쪽을 `Map`으로 만들면 이중 반복이 사라진다.
      순위·집계는 건수를 먼저 어림해 보고, 많으면 `ORDER BY ... LIMIT` 질의로 옮긴다.
      `TreeMap`의 범위 조회가 DB 인덱스와 같은 원리라는 것도 함께 기억해 둔다.
