# DevPilot 개념 노트 — 잠금과 실행 계획
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 기준 버전: PostgreSQL 16 (AGENTS.md §0). PG 17 전용 문법은 쓰지 않는다
# - 2단계(DB와 트랜잭션)에서 쓴다. DATABASE.TRANSACTION·DATABASE.INDEX 노트를 먼저 본 것으로 전제한다
lessons:
  - key: LESSON.DATABASE.TRANSACTION.LOCKING.001
    skillCode: DATABASE.TRANSACTION.LOCKING
    title: 동시에 고칠 때 한쪽이 사라지지 않게 (잠금)
    whyItMatters: |-
      두 사람이 같은 주문을 동시에 고치면 나중에 저장한 쪽이 앞 사람의 변경을 덮어쓴다.
      아무 오류도 안 나고 로그에도 안 남아서, 나중에 데이터가 이상하다는 문의로만 드러난다.
      재고 차감·포인트 사용·좌석 예약처럼 **수가 맞아야 하는 곳**은 전부 여기에 걸려 있다.
    oneLine: 갱신 손실은 읽고 고쳐 쓰는 사이에 다른 사람이 끼어들 때 생기고, 비관적 잠금이나 낙관적 잠금으로 막는다.
    units:
      - key: LESSON.DATABASE.TRANSACTION.LOCKING.001.U1
        title: 나중에 저장한 쪽이 이긴다 (갱신 손실)
        minutes: 10
        core: true
        explain: |-
          읽고 → 고치고 → 쓰는 흐름이 두 군데서 동시에 돌면 이렇게 된다.

          ```text
          A: 읽는다(수량 10) ────────────── 9로 쓴다
          B:      읽는다(수량 10) ── 9로 쓴다
          ```

          둘 다 하나씩 줄였는데 결과는 9다. **한 번의 차감이 사라졌다.**
          이것을 갱신 손실(lost update)이라 한다.

          앞 노트에서 본 "한 문장으로 합치기"(`SET available = available - 1`)로
          막을 수 있는 경우가 많지만, **읽은 값을 애플리케이션에서 판단해야 할 때**는
          그럴 수 없다. 예를 들어 "등급에 따라 할인율을 다르게 적용한 새 금액"처럼
          계산이 SQL 한 문장에 안 들어가는 경우다.

          그때 쓰는 방법이 둘이다 — **비관적 잠금**(미리 잠그고 남을 기다리게)과
          **낙관적 잠금**(안 잠그고 쓸 때 확인).
        example:
          language: sql
          code: |-
            -- 세션 A                              -- 세션 B
            BEGIN;                                  BEGIN;
            SELECT quantity FROM order_lines
             WHERE id = 5;
            -- 10
                                                    SELECT quantity FROM order_lines
                                                     WHERE id = 5;
                                                    -- 10

            -- 애플리케이션에서 10 - 1 = 9 계산
            UPDATE order_lines SET quantity = 9
             WHERE id = 5;
            COMMIT;
                                                    -- 역시 10 - 1 = 9
                                                    UPDATE order_lines SET quantity = 9
                                                     WHERE id = 5;
                                                    COMMIT;

            SELECT quantity FROM order_lines WHERE id = 5;
          output: |-
            SELECT 결과
            quantity
            --------
                   9

            (두 번 줄였는데 8이 아니라 9다. 한 번이 사라졌다)
          note: |-
            - 두 `UPDATE` 모두 성공했다. **오류가 하나도 없다**
            - B의 `UPDATE`는 A가 커밋할 때까지 잠깐 기다렸다가 통과했다
            - 기다렸지만 **다시 읽지는 않았다** — 손에 든 값은 여전히 10이었다
            - 이 손실은 로그에도 안 남는다. 나중에 재고가 안 맞는 것으로만 드러난다
        predict:
          question: '`UPDATE order_lines SET quantity = quantity - 1 WHERE id = 5` 로 바꾸면 결과는?'
          choices:
            - 8 — 각자 현재 값에서 빼므로 둘 다 반영된다
            - 9 — 그대로다
            - 오류가 난다
            - 10 — 둘 다 무시된다
          answer: 8 — 각자 현재 값에서 빼므로 둘 다 반영된다
          explanation: |-
            `quantity - 1`은 **그 시점의 DB 값**을 기준으로 계산된다.
            B는 A가 커밋한 뒤 잠금이 풀릴 때 9를 읽어 8로 만든다.
            그래서 계산이 SQL 안에 들어가면 갱신 손실이 아예 생기지 않는다.
            **가능하면 이 방법이 첫 번째 선택이다.**
        complete:
          question: 읽을 때부터 잠가 다른 세션이 끼어들지 못하게 하세요.
          code: |-
            BEGIN;

            SELECT quantity FROM order_lines
             WHERE id = 5
             FOR ___;              -- 이 줄을 잠근다

            UPDATE order_lines SET quantity = 9 WHERE id = 5;

            ___;                    -- 여기서 잠금이 풀린다
          answers:
            - [UPDATE]
            - [COMMIT]
          explanation: |-
            `FOR UPDATE`로 잠그면 다른 세션의 `SELECT ... FOR UPDATE`와 `UPDATE`가 기다린다.
            기다리다 깨어나면 **최신 값을 다시 읽으므로** 손실이 안 생긴다.
            잠금은 커밋까지 유지되니 그 사이를 짧게 유지해야 한다.
        problem:
          prompt: |-
            포인트 사용 기능에서 갱신 손실이 나고 있다.

            ```java
            @Transactional
            public void usePoint(long memberId, int amount) {
                Member member = memberRepository.findById(memberId).orElseThrow();
                if (member.getPoint() < amount) {
                    throw new NotEnoughPointException();
                }
                member.setPoint(member.getPoint() - amount);
            }
            ```

            - 같은 회원이 동시에 두 번 요청했을 때 **포인트가 어떻게 어긋나는지** 단계로 적으세요
            - 세 가지 방법으로 막을 수 있습니다: SQL 한 문장, 비관적 잠금, 낙관적 잠금.
              이 경우에 **어느 것이 맞는지** 정하고 이유를 적으세요
            - 고른 방법으로 코드를 고치세요
          deliverables:
            - 어긋나는 단계 표
            - 세 방법 중 고른 것과 이유
            - 고친 코드
          hints:
            - 잔액 검사와 차감 사이에 다른 요청이 끼어들 수 있습니다.
            - 검사까지 SQL 한 문장에 넣을 수 있는지 먼저 따져 보세요.
            - 조건을 WHERE에 넣으면 몇 건이 바뀌었는지로 성공 여부를 알 수 있습니다.
          modelAnswer: |-
            | 시각 | 요청 A | 요청 B | 포인트 |
            |---|---|---|---|
            | 1 | 읽는다 → 1000 | | 1000 |
            | 2 | | 읽는다 → 1000 | 1000 |
            | 3 | 1000 >= 800 통과 | | 1000 |
            | 4 | | 1000 >= 800 통과 | 1000 |
            | 5 | 200으로 쓴다 | | 200 |
            | 6 | | 200으로 쓴다 | **200** |

            1600점을 썼는데 800점만 빠졌다.

            **SQL 한 문장이 맞다.** 검사(`point >= amount`)와 차감을 한 문장에 넣을 수 있고,
            잠금을 오래 쥐지 않으며 기다리는 시간도 가장 짧다.

            ```java
            @Transactional
            public void usePoint(long memberId, int amount) {
                int updated = memberRepository.decreasePoint(memberId, amount);
                if (updated == 0) {
                    throw new NotEnoughPointException();
                }
            }

            @Modifying
            @Query("update Member m set m.point = m.point - :amount "
                    + "where m.id = :id and m.point >= :amount")
            int decreasePoint(@Param("id") long id, @Param("amount") int amount);
            ```

            **갱신된 줄 수가 0이면 잔액이 모자란 것**이다.
            검사와 차감 사이에 틈이 없으므로 동시에 들어와도 합이 맞는다.
          selfChecks:
            - 어긋나는 단계를 시각 순으로 적었는가
            - 검사와 차감 사이의 틈이 원인임을 짚었는가
            - 갱신된 줄 수로 성공 여부를 판단했는가
            - 세 방법 중 고른 이유를 댈 수 있는가
      - key: LESSON.DATABASE.TRANSACTION.LOCKING.001.U2
        title: 미리 잠글까, 쓸 때 확인할까
        minutes: 12
        core: true
        explain: |-
          계산이 SQL 한 문장에 안 들어갈 때 쓰는 두 방법이다.

          | | 비관적 잠금 | 낙관적 잠금 |
          |---|---|---|
          | 생각 | "충돌이 자주 날 것이다" | "충돌은 드물 것이다" |
          | 방법 | 읽을 때 `FOR UPDATE`로 잠근다 | 안 잠그고 **버전**으로 확인한다 |
          | 충돌 시 | 뒤에 온 쪽이 **기다린다** | 뒤에 온 쪽이 **실패한다** |
          | 대가 | 대기, 교착 위험 | 재시도 코드가 필요하다 |

          낙관적 잠금은 줄마다 `version` 값을 두고, 갱신할 때
          **읽을 때 본 버전과 같을 때만** 바꾼다.

          ```sql
          UPDATE orders SET status = 'PAID', version = version + 1
          WHERE id = 1 AND version = 3;
          ```

          누가 먼저 바꿨으면 `version`이 4가 되어 **0건**이 된다. 그때 실패로 처리한다.
          JPA에서는 필드에 `@Version`만 붙이면 이것이 자동으로 붙는다.

          고르는 기준은 **충돌 빈도**다. 좌석 예약처럼 같은 줄에 몰리면 비관적,
          주문 수정처럼 드물면 낙관적이다.
        example:
          language: java
          code: |-
            @Entity
            public class Order {

                @Id private Long id;
                private String status;

                @Version                       // 낙관적 잠금
                private Long version;
            }

            // 비관적 잠금
            public interface StockRepository extends JpaRepository<Stock, Long> {

                @Lock(LockModeType.PESSIMISTIC_WRITE)
                @Query("select s from Stock s where s.id = :id")
                Optional<Stock> findByIdForUpdate(@Param("id") Long id);
            }
          output: |-
            [낙관적 — 동시에 두 번 수정]
            Hibernate: update orders set status=?, version=? where id=? and version=?
            org.springframework.orm.ObjectOptimisticLockingFailureException:
              Row was updated or deleted by another transaction

            [비관적 — 동시에 두 번 차감]
            Hibernate: select ... from stocks where id=? for update
            (두 번째 세션은 첫 번째가 커밋할 때까지 기다린 뒤 최신 값을 읽는다)
          note: |-
            - `@Version` 하나로 모든 `UPDATE`에 `and version = ?` 가 붙는다
            - 충돌하면 **예외로 알려 준다** — 조용히 덮어쓰지 않는다
            - `PESSIMISTIC_WRITE`는 `SELECT ... FOR UPDATE`를 만든다
            - 낙관적은 예외를 **잡아서 재시도**해야 쓸 만해진다
        predict:
          question: '`@Version` 필드를 붙였는데 충돌 예외를 아무도 안 잡으면?'
          choices:
            - 사용자에게 500 오류가 나간다 — 덮어쓰기는 막았지만 화면이 이유를 모른다
            - 자동으로 재시도된다
            - 나중 값이 그냥 저장된다
            - 아무 일도 안 일어난다
          answer: 사용자에게 500 오류가 나간다 — 덮어쓰기는 막았지만 화면이 이유를 모른다
          explanation: |-
            낙관적 잠금은 **막아 주기만 한다.** 그다음에 무엇을 할지는 우리 몫이다.
            재시도하거나, "다른 사람이 먼저 수정했습니다"라고 409로 알려 줘야 한다.
            앞 노트의 예외 처리(`@RestControllerAdvice`)가 여기서 쓰인다.
        complete:
          question: 낙관적 잠금을 켜고 충돌을 409로 알리세요.
          code: |-
            @___
            private Long version;

            // 예외 처리기
            @ExceptionHandler(ObjectOptimisticLockingFailureException.class)
            ProblemDetail handleConflict(ObjectOptimisticLockingFailureException exception) {
                return ProblemDetail.forStatusAndDetail(
                        HttpStatus.___, "다른 사람이 먼저 수정했습니다. 다시 불러와 주세요");
            }
          answers:
            - [Version]
            - [CONFLICT]
          explanation: |-
            `@Version` 필드 하나로 충돌 감지가 켜진다.
            충돌은 "지금 상태와 맞지 않는다"는 뜻이므로 409가 맞고,
            화면은 다시 불러오라고 안내할 수 있다.
        problem:
          prompt: |-
            두 기능에 각각 맞는 방법을 고르고 구현하세요.

            - **좌석 예약**: 인기 공연은 같은 좌석에 수백 명이 동시에 몰린다
            - **주문 메모 수정**: 관리자 두 명이 같은 주문을 동시에 고치는 일이 가끔 있다

            - 각각 비관적·낙관적 중 무엇이 맞는지 정하고 **이유를 충돌 빈도로** 설명하세요
            - 두 기능의 코드를 쓰세요
            - 잘못 고르면 각각 어떤 문제가 생기는지도 적으세요
          deliverables:
            - 기능별로 고른 방법과 이유
            - 두 기능의 코드
            - 반대로 골랐을 때 생기는 문제
          hints:
            - 충돌이 잦으면 재시도가 계속 실패합니다.
            - 충돌이 드문데 미리 잠그면 아무도 안 오는 문에 자물쇠를 채우는 셈입니다.
            - 대기가 길어지면 무엇이 고갈되나요?
          modelAnswer: |-
            | 기능 | 방법 | 이유 |
            |---|---|---|
            | 좌석 예약 | **비관적** | 같은 줄에 몰려 충돌이 잦다 |
            | 주문 메모 수정 | **낙관적** | 충돌이 드물어 잠글 이유가 없다 |

            ```java
            // 좌석 — 비관적
            @Transactional
            public void reserve(long seatId, long memberId) {
                Seat seat = seatRepository.findByIdForUpdate(seatId).orElseThrow();
                seat.reserve(memberId);            // 이미 예약됐으면 예외
            }

            // 메모 — 낙관적 (@Version 필드로 충분)
            @Transactional
            public void updateMemo(long orderId, String memo, long version) {
                Order order = orderRepository.findById(orderId).orElseThrow();
                order.changeMemo(memo);            // 커밋 시 version 검사
            }
            ```

            반대로 골랐을 때 —
            좌석에 낙관적을 쓰면 **수백 명 중 한 명만 성공하고 나머지는 전부 예외**다.
            재시도해도 또 충돌해서 체감이 매우 나쁘다.
            메모에 비관적을 쓰면 거의 오지 않는 충돌을 막으려고
            **모든 수정이 잠금을 잡고 기다리게** 되어 연결이 낭비된다.
          selfChecks:
            - 충돌 빈도로 이유를 설명했는가
            - 낙관적 쪽에서 충돌 시 화면에 무엇을 보여 줄지 정했는가
            - 비관적 쪽의 잠금 구간이 짧은가
            - 반대로 골랐을 때의 증상을 구체적으로 적었는가
      - key: LESSON.DATABASE.TRANSACTION.LOCKING.001.U3
        title: 서로 기다리다 멈추는 것 (교착)
        minutes: 10
        core: false
        explain: |-
          잠금을 쓰면 새 위험이 생긴다. **서로가 서로를 기다리는 것**이다.

          ```text
          A: 1번 줄 잠금 → 2번 줄을 기다린다
          B: 2번 줄 잠금 → 1번 줄을 기다린다
          ```

          둘 다 영원히 못 나아간다. 이것이 교착(deadlock)이다.

          PostgreSQL은 이것을 **감지해서 한쪽을 죽인다.**
          죽은 쪽은 오류를 받고 트랜잭션이 롤백된다.
          그래서 서비스가 멈추지는 않지만, **간헐적으로 실패하는 요청**이 생긴다.

          막는 방법 중 가장 효과가 큰 것은 하나다 —
          **모든 곳에서 같은 순서로 잠근다.** 위 예에서 둘 다 1번 → 2번 순서로 잡으면
          뒤에 온 쪽은 그냥 기다렸다가 진행한다.

          나머지는 거들 뿐이다. 경계를 짧게 하고, 잠그는 줄 수를 줄이고,
          잠금이 필요 없는 방법(SQL 한 문장)을 먼저 찾는다.
        example:
          language: sql
          code: |-
            -- 교착이 나는 코드 (순서가 다르다)
            -- 세션 A                              -- 세션 B
            BEGIN;                                  BEGIN;
            UPDATE accounts SET balance = balance - 100
             WHERE id = 1;
                                                    UPDATE accounts SET balance = balance - 50
                                                     WHERE id = 2;
            UPDATE accounts SET balance = balance + 100
             WHERE id = 2;   -- B를 기다린다
                                                    UPDATE accounts SET balance = balance + 50
                                                     WHERE id = 1;   -- A를 기다린다
          output: |-
            ERROR:  deadlock detected
            DETAIL:  Process 1234 waits for ShareLock on transaction 5678;
                     blocked by process 5678.
                     Process 5678 waits for ShareLock on transaction 1234;
                     blocked by process 1234.
            HINT:  See server log for query details.

            (한쪽 트랜잭션이 강제로 롤백된다)
          note: |-
            - A는 1 → 2 순서, B는 2 → 1 순서로 잠갔다. **이 차이가 전부다**
            - PostgreSQL이 감지해 한쪽을 죽였다 — 영원히 멈추지는 않는다
            - 죽은 쪽 사용자는 이유를 알 수 없는 실패를 본다
            - 둘 다 **작은 id부터** 잠그면 이 교착은 생기지 않는다
        predict:
          question: 두 세션이 모두 `id = 1` 먼저, `id = 2` 나중 순서로 바꾸면?
          choices:
            - 교착이 나지 않는다 — 뒤에 온 쪽이 기다렸다가 진행한다
            - 여전히 교착이 난다
            - 둘 다 실패한다
            - 둘 다 동시에 성공한다
          answer: 교착이 나지 않는다 — 뒤에 온 쪽이 기다렸다가 진행한다
          explanation: |-
            순서가 같으면 **누가 먼저 1번을 잡느냐**로 줄이 정해진다.
            먼저 잡은 쪽이 2번까지 끝내고 나오면 뒤가 들어간다.
            서로를 기다리는 고리가 만들어지지 않는 것이다.
        complete:
          question: 여러 줄을 잠글 때 순서를 고정하세요.
          code: |-
            List<Long> ids = List.of(accountB, accountA);
            for (Long id : ids.stream().___().toList()) {   // 언제나 같은 순서로
                accountRepository.findByIdForUpdate(id);
            }
          answers:
            - [sorted]
          explanation: |-
            **정렬해서 잠그면** 어느 요청이 어느 순서로 들어와도 잠그는 순서가 같아진다.
            계좌 이체처럼 두 줄을 함께 잠가야 하는 곳에서 쓰는 표준 방법이다.
        problem:
          prompt: |-
            계좌 이체 기능에서 교착이 간헐적으로 난다.

            ```java
            @Transactional
            public void transfer(long fromId, long toId, int amount) {
                Account from = accountRepository.findByIdForUpdate(fromId).orElseThrow();
                Account to = accountRepository.findByIdForUpdate(toId).orElseThrow();
                from.withdraw(amount);
                to.deposit(amount);
            }
            ```

            - 교착이 나는 **구체적인 두 요청**을 적으세요
            - 잠그는 순서를 고정해 고치세요
            - 교착이 여전히 날 수 있는 경우가 있다면 무엇인지, 그때는 어떻게 할지 적으세요
          deliverables:
            - 교착이 나는 두 요청
            - 순서를 고정한 코드
            - 여전히 날 수 있는 경우와 대응
          hints:
            - 같은 두 계좌를 반대 방향으로 이체하면 어떻게 될까요?
            - 잠그는 순서를 요청이 아니라 무엇이 정하게 해야 할까요?
            - 교착은 완전히 없애기 어렵습니다. 났을 때 무엇을 할 수 있나요?
          modelAnswer: |-
            `transfer(1, 2, 100)` 과 `transfer(2, 1, 50)` 이 동시에 들어오면
            A는 1 → 2, B는 2 → 1 순서로 잠가 고리가 생긴다.

            ```java
            @Transactional
            public void transfer(long fromId, long toId, int amount) {
                long firstId = Math.min(fromId, toId);
                long secondId = Math.max(fromId, toId);

                accountRepository.findByIdForUpdate(firstId).orElseThrow();
                accountRepository.findByIdForUpdate(secondId).orElseThrow();

                Account from = accountRepository.findById(fromId).orElseThrow();
                Account to = accountRepository.findById(toId).orElseThrow();
                from.withdraw(amount);
                to.deposit(amount);
            }
            ```

            **잠그는 순서를 이체 방향이 아니라 식별자 크기가 정하게** 했다.
            어느 방향이든 작은 번호부터 잠그므로 고리가 안 생긴다.

            그래도 날 수 있다 — 다른 기능이 다른 순서로 같은 표를 잠그거나,
            인덱스·외래 키 때문에 우리가 지정하지 않은 잠금이 걸릴 때다.
            그래서 **교착 오류를 잡아 짧게 재시도하는 것**을 함께 둔다.
            교착으로 죽은 트랜잭션은 이미 롤백됐으므로 다시 해도 안전하다.
          selfChecks:
            - 교착이 나는 두 요청을 구체적으로 적었는가
            - 잠그는 순서를 식별자로 고정했는가
            - 완전히 없앨 수 없다는 것을 인정하고 대응을 준비했는가
            - 재시도가 안전한 이유를 설명할 수 있는가
    commonMistakes:
      - 읽고 계산해서 쓴다. 두 요청이 겹치면 한쪽 변경이 조용히 사라진다 (U1)
      - 낙관적 잠금만 켜 두고 충돌 예외를 안 잡는다. 사용자에게 500이 나간다 (U2)
      - 잠그는 순서가 호출마다 다르다. 반대 방향 요청이 겹치면 교착이 난다 (U3)
    inProject: |-
      주문 시스템에서 재고 차감과 포인트 사용은 **SQL 한 문장**으로 처리해 잠금 자체를 피한다.
      주문 상태처럼 화면에서 읽고 고치는 것은 `@Version`으로 낙관적 잠금을 켜고
      충돌을 409로 알린다. 여러 줄을 함께 잠가야 하면 식별자 순으로 정렬해 잠근다.
    sources:
      - title: PostgreSQL 16 — Explicit Locking
        url: https://www.postgresql.org/docs/16/explicit-locking.html
        versionScope: PostgreSQL 16
      - title: PostgreSQL 16 — Transaction Isolation
        url: https://www.postgresql.org/docs/16/transaction-iso.html
        versionScope: PostgreSQL 16
      - title: PostgreSQL 16 — Data Consistency Checks at the Application Level
        url: https://www.postgresql.org/docs/16/applevel-consistency.html
        versionScope: PostgreSQL 16
      - title: Spring Data JPA — JPA Repositories
        url: https://docs.spring.io/spring-data/jpa/reference/jpa.html
        versionScope: Spring Data JPA 3.x+
    verifiedAt: 2026-09-24

  - key: LESSON.DATABASE.INDEX.EXPLAIN_PLAN.001
    skillCode: DATABASE.INDEX.EXPLAIN_PLAN
    title: DB에게 어떻게 할 건지 물어보기 (실행 계획)
    whyItMatters: |-
      "느린 것 같다"와 "여기가 느리다"는 다르다. 추측으로 인덱스를 붙이면
      쓰기만 느려지고 정작 병목은 그대로다. 실행 계획을 읽을 줄 알면
      **어느 단계에서 몇 줄을 읽고 몇 밀리초가 걸렸는지** 숫자로 나온다.
      느린 질의 하나를 고치는 데 걸리는 시간이 하루에서 십 분으로 준다.
    oneLine: EXPLAIN은 DB가 세운 계획을, EXPLAIN ANALYZE는 실제로 돌려 본 결과를 보여 준다.
    units:
      - key: LESSON.DATABASE.INDEX.EXPLAIN_PLAN.001.U1
        title: 계획과 실측을 가려 읽기
        minutes: 10
        core: true
        explain: |-
          두 명령이 있고 하는 일이 다르다.

          | 명령 | 실행하나 | 보여 주는 것 |
          |---|---|---|
          | `EXPLAIN` | **아니다** | 세운 계획과 **예상** 비용·행 수 |
          | `EXPLAIN ANALYZE` | **한다** | 계획 + **실제** 시간·행 수 |

          `EXPLAIN ANALYZE`는 정말로 실행하므로 `UPDATE`·`DELETE`에 쓸 때는
          트랜잭션으로 감싸고 롤백해야 한다.

          읽을 때 보는 숫자는 넷이다.

          ```text
          Seq Scan on orders  (cost=0.00..92450.00 rows=18 width=12)
                                                (actual time=0.412..410.2 rows=20 loops=1)
          ```

          - `cost` — 추정 비용. **첫 행까지..전체까지**. 단위는 없고 비교용이다
          - `rows` (앞) — **예상** 행 수
          - `actual time` — 실제 시간 (밀리초)
          - `rows` (뒤) — **실제** 행 수

          가장 중요한 것은 **예상과 실제의 차이**다. 크게 벌어져 있으면
          통계가 낡아 플래너가 잘못된 계획을 고른 것이다.
        example:
          language: sql
          code: |-
            EXPLAIN
            SELECT id FROM orders WHERE member_id = 42;

            EXPLAIN ANALYZE
            SELECT id FROM orders WHERE member_id = 42;
          output: |-
            -- EXPLAIN (실행하지 않는다)
            Seq Scan on orders  (cost=0.00..92450.00 rows=18 width=8)
              Filter: (member_id = 42)

            -- EXPLAIN ANALYZE (실제로 실행한다)
            Seq Scan on orders  (cost=0.00..92450.00 rows=18 width=8)
                                (actual time=0.031..412.338 rows=20 loops=1)
              Filter: (member_id = 42)
              Rows Removed by Filter: 4999980
            Planning Time: 0.112 ms
            Execution Time: 412.401 ms
          note: |-
            - `EXPLAIN`에는 `actual`이 없다 — 돌려 보지 않았기 때문이다
            - 예상 18행, 실제 20행이다. **가깝다** — 통계가 최신이라는 뜻이다
            - `Rows Removed by Filter`가 499만이다. 읽고 나서 버린 줄이다
            - `Planning Time`과 `Execution Time`이 갈려 있다. 느린 쪽은 실행이다
        predict:
          question: 예상 `rows=18`인데 실제가 `rows=250000`이라면 무엇을 의심해야 하나?
          choices:
            - 통계가 낡아 플래너가 잘못된 계획을 골랐을 수 있다
            - 질의가 틀렸다
            - 인덱스가 깨졌다
            - 아무 문제 없다
          answer: 통계가 낡아 플래너가 잘못된 계획을 골랐을 수 있다
          explanation: |-
            플래너는 **통계를 보고** 어느 방식이 쌀지 정한다.
            "18행쯤 나오겠지" 하고 인덱스를 골랐는데 25만 행이 나오면
            그 선택이 최악이 된다. `ANALYZE 표이름;` 으로 통계를 갱신하고 다시 본다.
        complete:
          question: 변경 질의의 계획을 안전하게 확인하세요.
          code: |-
            ___;
            EXPLAIN ANALYZE
            UPDATE orders SET status = 'PAID' WHERE member_id = 42;
            ___;                -- 실제로 바뀌지 않게 되돌린다
          answers:
            - [BEGIN]
            - [ROLLBACK]
          explanation: |-
            `EXPLAIN ANALYZE`는 **정말 실행한다.** 변경 질의에 그냥 쓰면 데이터가 바뀐다.
            트랜잭션으로 감싸고 롤백하면 계획과 실측은 얻고 변경은 되돌린다.
        problem:
          prompt: |-
            아래 실행 계획을 읽고 진단하세요.

            ```text
            Index Scan using idx_orders_created_at on orders
              (cost=0.43..8.51 rows=12 width=24)
              (actual time=0.089..1842.551 rows=248310 loops=1)
              Index Cond: (created_at >= '2026-01-01')
              Filter: (status = 'PAID')
              Rows Removed by Filter: 51200
            Planning Time: 0.211 ms
            Execution Time: 1901.338 ms
            ```

            - 이 계획에서 **이상한 점 두 가지**를 찾으세요
            - 무엇이 원인인지 추정하고, **확인하는 방법**을 적으세요
            - 고칠 방법을 두 가지 제안하세요
          deliverables:
            - 이상한 점 두 가지
            - 원인 추정과 확인 방법
            - 고치는 방법 두 가지
          hints:
            - 예상 행 수와 실제 행 수를 나란히 놓고 보세요.
            - Index Cond와 Filter에 각각 무엇이 들어가 있나요?
            - 24만 행을 인덱스로 하나씩 따라가는 것이 빠를까요?
          modelAnswer: |-
            이상한 점 두 가지 —

            **① 예상 12행, 실제 248310행.** 2만 배 넘게 어긋났다.
            플래너가 "몇 건 안 나오겠지" 하고 인덱스 스캔을 골랐는데
            실제로는 24만 건이라, 표를 24만 번 오가느라 1.8초가 걸렸다.

            **② `status` 조건이 `Filter`에 있다.** 인덱스로 거르지 못하고
            읽은 뒤 5만 건을 버렸다.

            원인은 **통계가 낡았을 가능성**이 높다. 확인은
            `SELECT last_analyze, last_autoanalyze FROM pg_stat_user_tables WHERE relname = 'orders';`
            로 마지막 통계 갱신 시각을 보고, `ANALYZE orders;` 를 돌린 뒤
            같은 `EXPLAIN ANALYZE`를 다시 찍어 예상 행 수가 실제에 가까워지는지 본다.

            고치는 방법 —
            **① 통계를 갱신한다.** 그러면 플래너가 순차 스캔을 고를 수 있고,
            24만 행을 읽는다면 그편이 오히려 빠르다.
            **② 복합 인덱스로 바꾼다.** `(status, created_at)` 이면
            `status`가 등호라 앞에 오고 `created_at` 범위가 뒤에 와서
            두 조건이 모두 `Index Cond`에 들어간다.
          selfChecks:
            - 예상과 실제 행 수의 차이를 짚었는가
            - Index Cond와 Filter를 구분해 읽었는가
            - 통계를 확인하는 구체적인 방법을 적었는가
            - 고치는 방법을 두 가지 제시했는가
      - key: LESSON.DATABASE.INDEX.EXPLAIN_PLAN.001.U2
        title: 어떤 방식으로 읽는가
        minutes: 12
        core: true
        explain: |-
          계획의 각 줄은 **한 단계**이고, 안쪽으로 들여쓴 것이 먼저 실행된다.
          자주 보는 단계만 알면 대부분 읽힌다.

          | 단계 | 뜻 | 언제 좋은가 |
          |---|---|---|
          | `Seq Scan` | 표를 처음부터 끝까지 | 표가 작거나 대부분이 걸릴 때 |
          | `Index Scan` | 인덱스로 찾아 표를 읽는다 | 조금만 걸릴 때 |
          | `Index Only Scan` | **표를 안 읽고** 인덱스만으로 | 필요한 칸이 인덱스에 다 있을 때 |
          | `Bitmap Heap Scan` | 인덱스로 위치를 모아 한 번에 | 중간쯤 걸릴 때 |

          조인도 셋이다.

          | 조인 | 방식 | 언제 |
          |---|---|---|
          | `Nested Loop` | 바깥 한 줄마다 안쪽을 찾는다 | 한쪽이 아주 작을 때 |
          | `Hash Join` | 한쪽으로 해시를 만들어 맞춘다 | 양쪽이 클 때 |
          | `Merge Join` | 둘 다 정렬해 맞춰 나간다 | 이미 정렬돼 있을 때 |

          **`Seq Scan`이 무조건 나쁜 것이 아니다.** 24만 행을 읽어야 하면
          순차 스캔이 인덱스 스캔보다 훨씬 빠르다.
          나쁜 것은 **몇 건만 필요한데 전부 훑는 것**이다.
        example:
          language: sql
          code: |-
            EXPLAIN ANALYZE
            SELECT o.id, m.nickname
              FROM orders o
              JOIN members m ON m.id = o.member_id
             WHERE o.member_id = 42;
          output: |-
            Nested Loop  (cost=0.86..25.14 rows=20 width=40)
                         (actual time=0.041..0.128 rows=20 loops=1)
              ->  Index Scan using idx_orders_member_id on orders o
                    (cost=0.43..16.55 rows=20 width=16)
                    (actual time=0.021..0.055 rows=20 loops=1)
                    Index Cond: (member_id = 42)
              ->  Memoize  (cost=0.43..0.45 rows=1 width=32)
                    (actual time=0.002..0.002 rows=1 loops=20)
                    ->  Index Scan using members_pkey on members m
                          (cost=0.42..0.44 rows=1 width=32)
                          Index Cond: (id = 42)
            Execution Time: 0.187 ms
          note: |-
            - 들여쓴 두 줄이 먼저 실행되고, `Nested Loop`가 그 둘을 합친다
            - 바깥이 20행이라 안쪽을 20번 찾는다 — `loops=1` 과 `loops=20`이 그것이다
            - `Memoize`는 같은 키를 다시 찾을 때 **기억해 둔 결과를 쓴다**
            - 전체가 0.187ms다. 20행짜리에는 `Nested Loop`가 맞는 선택이다
        predict:
          question: '`WHERE o.member_id = 42` 를 빼고 전체 주문 500만 건을 조인하면 어떤 조인이 나올까?'
          choices:
            - Hash Join — 양쪽이 커서 한 줄씩 찾는 것이 너무 비싸다
            - 그대로 Nested Loop
            - Merge Join만 가능하다
            - 조인을 못 한다
          answer: Hash Join — 양쪽이 커서 한 줄씩 찾는 것이 너무 비싸다
          explanation: |-
            500만 번 안쪽을 찾으면 인덱스가 있어도 느리다.
            그래서 플래너는 **회원 표로 해시를 만들어 두고** 주문을 한 번 훑으며 맞춘다.
            조인 방식은 우리가 고르는 것이 아니라 **행 수에 따라 플래너가 고른다.**
        complete:
          question: 표를 읽지 않고 인덱스만으로 끝나게 하세요.
          code: |-
            -- SELECT member_id, created_at FROM orders WHERE member_id = 42;
            CREATE INDEX idx_orders_member_created
                ON orders (member_id, ___);
            -- 계획에 Index ___ Scan 이 나오면 표를 안 읽은 것이다
          answers:
            - [created_at]
            - [Only]
          explanation: |-
            **가져올 칸이 전부 인덱스에 들어 있으면** 표를 읽을 이유가 없다.
            이것이 `Index Only Scan`이고, 표를 오가지 않으니 훨씬 빠르다.
            자주 쓰는 조회의 칸이 적다면 노려 볼 만하다.
        problem:
          prompt: |-
            느린 관리자 화면의 질의를 진단하고 고치세요.

            ```sql
            SELECT o.id, o.total_amount, m.nickname
              FROM orders o
              JOIN members m ON m.id = o.member_id
             WHERE o.status = 'PAID'
               AND o.created_at >= '2026-09-01'
             ORDER BY o.created_at DESC
             LIMIT 50;
            ```

            - 이 질의에서 **볼 단계 세 가지**를 정하고, 각각 무엇이 나오면 좋고 무엇이 나오면 나쁜지 적으세요
            - `EXPLAIN ANALYZE`를 돌린다고 가정하고, 병목을 찾는 **순서**를 적으세요
            - 인덱스를 제안하고, 그것이 계획을 어떻게 바꿀지 예상해 쓰세요
          deliverables:
            - 볼 단계 세 가지와 좋고 나쁜 경우
            - 병목을 찾는 순서
            - 제안 인덱스와 계획이 바뀔 모습
          hints:
            - 조건 두 개, 조인 하나, 정렬 하나가 있습니다.
            - 정렬이 계획에 따로 나타나면 무슨 뜻일까요?
            - LIMIT 50인데 그 전에 몇 줄을 읽는지가 중요합니다.
          modelAnswer: |-
            | 볼 단계 | 좋으면 | 나쁘면 |
            |---|---|---|
            | `orders` 접근 | `Index Scan` + 두 조건이 `Index Cond` | `Seq Scan` 또는 조건이 `Filter` |
            | 정렬 | 계획에 `Sort`가 **없다** (인덱스 순서를 씀) | `Sort` + `Sort Method: external merge Disk` |
            | 조인 | `Nested Loop` + `loops` 50 이하 | `Hash Join`에 큰 `Hash Batches` |

            병목을 찾는 순서 —
            **① `Execution Time`이 큰 단계를 안쪽부터 찾는다**
            (안쪽 시간은 누적이므로 바깥에서 안쪽을 빼며 본다),
            **② `Rows Removed by Filter`가 큰 곳을 본다**,
            **③ 예상과 실제 행 수가 벌어진 곳을 본다.**

            ```sql
            CREATE INDEX idx_orders_status_created
                ON orders (status, created_at DESC);
            ```

            `status`가 등호라 앞, `created_at`이 범위이자 정렬이라 뒤다.
            이러면 두 조건이 `Index Cond`에 들어가고,
            인덱스가 이미 `created_at DESC` 순서라 **`Sort` 단계가 사라진다.**
            `LIMIT 50`이 인덱스를 50줄만 타고 끝내므로
            읽는 행 수가 수십만에서 50으로 줄어든다.
          selfChecks:
            - 세 단계에 대해 좋고 나쁜 경우를 모두 적었는가
            - 정렬이 사라지는 것을 목표로 인덱스 순서를 잡았는가
            - LIMIT이 실제로 읽는 행 수를 줄이는지 따져 봤는가
            - 병목을 찾는 순서를 근거와 함께 적었는가
      - key: LESSON.DATABASE.INDEX.EXPLAIN_PLAN.001.U3
        title: 느린 질의를 찾아내는 흐름
        minutes: 10
        core: false
        explain: |-
          실행 계획을 읽을 줄 알아도 **어느 질의를 볼지** 모르면 소용이 없다.
          찾는 순서가 있다.

          1. **느린 질의 로그를 켠다** — 일정 시간을 넘는 질의만 기록한다
          2. **가장 느린 것이 아니라 가장 많이 도는 것을 본다** —
             3초짜리 하루 한 번보다 50ms짜리 초당 100번이 더 아프다
          3. 그 질의에 `EXPLAIN ANALYZE`를 돌린다
          4. 고친 뒤 **같은 계획을 다시 찍어 비교한다**

          2번이 핵심이다. 사람은 눈에 띄는 것을 고치고 싶어 하지만,
          전체 시간에서 차지하는 몫은 **시간 × 횟수**다.

          그리고 고친 뒤에는 반드시 다시 재어 본다.
          인덱스를 붙였는데 플래너가 안 쓰는 경우가 흔하고,
          **확인하지 않으면 붙인 값만 치르고 얻는 것이 없다.**
        example:
          language: sql
          code: |-
            -- 1) 느린 질의 로그 (postgresql.conf 또는 세션)
            SET log_min_duration_statement = 200;   -- 200ms 넘으면 기록

            -- 2) 고치기 전 계획
            EXPLAIN ANALYZE
            SELECT id FROM orders WHERE member_id = 42 AND status = 'PAID';

            -- 3) 인덱스 추가
            CREATE INDEX idx_orders_member_status ON orders (member_id, status);

            -- 4) 통계 갱신 후 다시
            ANALYZE orders;
            EXPLAIN ANALYZE
            SELECT id FROM orders WHERE member_id = 42 AND status = 'PAID';
          output: |-
            -- 고치기 전
            Seq Scan on orders (actual time=0.03..398.2 rows=12 loops=1)
              Filter: ((member_id = 42) AND (status = 'PAID'))
              Rows Removed by Filter: 4999988
            Execution Time: 398.3 ms

            -- 고친 뒤
            Index Scan using idx_orders_member_status on orders
              (actual time=0.02..0.06 rows=12 loops=1)
              Index Cond: ((member_id = 42) AND (status = 'PAID'))
            Execution Time: 0.09 ms
          note: |-
            - 고치기 전후를 **같은 형식으로 나란히** 두었다. 이것이 증거다
            - `Rows Removed by Filter`가 499만에서 사라졌다
            - `Filter`에 있던 조건이 `Index Cond`로 옮겨 갔다
            - 398ms → 0.09ms. 숫자가 있으니 "빨라진 것 같다"고 말할 필요가 없다
        predict:
          question: 인덱스를 만들었는데 계획에 여전히 `Seq Scan`이 나온다면 먼저 무엇을 해 볼까?
          choices:
            - ANALYZE로 통계를 갱신하고 다시 확인한다
            - 인덱스를 지우고 다시 만든다
            - DB를 재시작한다
            - 질의를 포기한다
          answer: ANALYZE로 통계를 갱신하고 다시 확인한다
          explanation: |-
            방금 만든 인덱스의 통계가 아직 없으면 플래너가 그 값을 모른다.
            `ANALYZE`를 돌리면 판단 근거가 생긴다.
            그래도 순차 스캔을 고른다면 **정말 그편이 싼 것**일 수 있다 —
            걸러 내는 비율이 낮은 경우다.
        complete:
          question: 느린 질의만 기록하도록 설정하세요.
          code: |-
            SET log_min_duration_statement = ___;   -- 200ms 넘는 질의만
            -- 값을 0으로 하면 ___ 질의가 기록된다 (운영에서는 위험하다)
          answers:
            - ["200"]
            - [모든, 전체]
          explanation: |-
            밀리초 단위로 임계값을 준다. `0`은 모든 질의를 남겨 로그가 폭주하므로
            운영에서는 쓰지 않는다. `-1`이면 끈다.
        problem:
          prompt: |-
            운영에서 특정 화면이 느리다는 이야기가 나왔다. 진단 계획을 세우세요.

            - 어느 질의를 볼지 **고르는 기준**을 적고, 왜 "가장 느린 것"이 기준이 아닌지 설명하세요
            - 후보 질의 세 개가 아래와 같을 때 **어느 것부터** 볼지 정하고 근거를 숫자로 대세요

            | 질의 | 평균 시간 | 하루 호출 수 |
            |---|---|---|
            | A | 3200ms | 40 |
            | B | 45ms | 180000 |
            | C | 800ms | 1200 |

            - 고친 뒤 **효과를 증명하는 방법**을 적으세요
          deliverables:
            - 질의를 고르는 기준과 이유
            - 세 질의의 우선순위와 숫자 근거
            - 효과를 증명하는 방법
          hints:
            - 전체 시간에서 차지하는 몫을 계산해 보세요.
            - 단위를 맞춰 곱하면 비교할 수 있습니다.
            - 고친 뒤에도 같은 것을 재어야 비교가 됩니다.
          modelAnswer: |-
            기준은 **시간 × 횟수**, 즉 전체 소요 시간에서 차지하는 몫이다.
            "가장 느린 것"은 눈에 띄지만 **하루에 몇 번 안 돌면 영향이 작다.**

            | 질의 | 계산 | 하루 총합 |
            |---|---|---|
            | A | 3200ms × 40 | 128초 |
            | B | 45ms × 180000 | **8100초** |
            | C | 800ms × 1200 | 960초 |

            순서는 **B → C → A**다. B는 한 번은 빠르지만 전체의 대부분을 차지한다.
            B를 45ms에서 10ms로만 줄여도 A를 완전히 없애는 것보다 훨씬 크다.

            증명하는 방법 —
            고치기 전후의 `EXPLAIN ANALYZE`를 **같은 형식으로 나란히** 남기고,
            `Execution Time`과 `Rows Removed by Filter`를 비교한다.
            그리고 운영에서는 느린 질의 로그의 **건수와 총합이 줄었는지**를 본다.
            계획만 좋아지고 실제 호출이 안 줄었다면 다른 곳을 본 것이다.
          selfChecks:
            - 시간 × 횟수로 우선순위를 매겼는가
            - 가장 느린 것이 기준이 아닌 이유를 설명했는가
            - 전후 비교를 같은 지표로 하기로 했는가
            - 운영 지표까지 확인할 계획을 세웠는가
    commonMistakes:
      - '`Seq Scan`을 보면 무조건 인덱스를 붙인다. 많이 읽어야 하면 순차 스캔이 더 빠르다 (U2)'
      - 예상과 실제 행 수의 차이를 안 본다. 통계가 낡아 플래너가 잘못 고른 것을 놓친다 (U1)
      - 가장 느린 질의부터 고친다. 전체 시간의 몫은 시간 × 횟수다 (U3)
    inProject: |-
      주문 시스템에서 화면이 느리다는 말이 나오면 순서가 정해져 있다 —
      느린 질의 로그를 켜고, 시간 × 횟수로 우선순위를 매기고,
      `EXPLAIN ANALYZE`로 `Index Cond`와 `Filter`를 가려 읽고,
      고친 뒤 같은 계획을 다시 찍어 나란히 남긴다.
      인덱스를 붙인 뒤 `ANALYZE`를 돌리고 실제로 쓰이는지 확인하는 것까지가 한 작업이다.
