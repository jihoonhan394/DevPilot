# DevPilot 개념 노트 — 로그인 상태를 어디에 두는가 (세션·토큰)
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - CORS 노트가 "브라우저가 왜 막는가"를 다룬다. 여기서는 "로그인한 사람을 어떻게 기억하는가"를 다룬다
# - 실제 키·토큰 값은 쓰지 않는다. 자리표시자만 쓴다
lessons:
  - key: LESSON.WEB_HTTP.AUTH_SESSION_TOKEN.001
    skillCode: WEB_HTTP.AUTH_SESSION_TOKEN
    title: 로그인 상태를 어디에 두는가 (세션과 토큰)
    whyItMatters: |-
      로그인은 한 번인데 그 뒤 모든 요청은 "당신이 누구인지"를 다시 말해야 한다.
      HTTP가 요청마다 남의 일처럼 잊어버리기 때문이다.
      이 기억을 **서버에 둘지 클라이언트에 둘지**가 갈림길이고,
      한 번 정하면 로그아웃·만료·서버 늘리기·보안 사고 대응이 전부 그 결정에 딸려 온다.
      나중에 바꾸려면 저장 방식만이 아니라 화면·배포까지 같이 건드리게 된다.
    oneLine: 로그인 상태를 **서버가 기억하면 세션**, **클라이언트가 들고 다니면 토큰**이고, 로그아웃과 확장성이 그 대가로 갈린다.
    units:
      - key: LESSON.WEB_HTTP.AUTH_SESSION_TOKEN.001.U1
        title: HTTP는 왜 기억하지 못하는가
        minutes: 10
        core: true
        explain: |-
          HTTP는 **상태가 없다(stateless)**. 요청 하나가 끝나면 서버는 그 대화를 잊는다.
          다음 요청은 방금 로그인한 사람이 보냈어도 서버에게는 **처음 보는 요청**이다.

          그래서 로그인한 뒤의 모든 요청에는 "나는 아까 그 사람"이라는 표시가 붙어야 한다.
          그 표시를 담는 자리가 **`Cookie` 헤더**나 **`Authorization` 헤더**다.

          두 헤더는 성격이 다르다.

          - **`Cookie`는 브라우저가 자동으로 붙인다.** 서버가 `Set-Cookie`로 한 번 심어 두면
            그 뒤 같은 사이트 요청에 알아서 따라간다. 편한 만큼 **의도하지 않은 요청에도 붙는다**
          - **`Authorization`은 코드가 직접 붙인다.** 자동으로 붙지 않으므로
            붙이는 자리를 빠뜨리면 그냥 401이 난다

          **인증(authentication)** 은 "누구인가"이고 **인가(authorization)** 는 "무엇을 해도 되는가"다.
          여기서 다루는 것은 앞쪽이다.
        example:
          language: http
          code: |-
            # 1) 로그인 — 여기서만 아이디와 비밀번호를 보낸다
            POST /api/v1/login HTTP/1.1
            Content-Type: application/json

            {"email": "<user@example.com>", "password": "<password>"}

            # 2) 서버 응답 — 이후에 쓸 표시를 내려준다
            HTTP/1.1 200 OK
            Set-Cookie: SESSION=<session-id>; HttpOnly; Secure; SameSite=Lax; Path=/

            # 3) 그 다음 요청 — 브라우저가 쿠키를 자동으로 붙인다
            GET /api/v1/orders HTTP/1.1
            Cookie: SESSION=<session-id>
          output: |-
            로그인 요청     → 비밀번호가 오간다. 이 한 번뿐이다
            그 뒤 모든 요청 → 비밀번호 대신 표시만 오간다

            표시를 빼고 보내면
            HTTP/1.1 401 Unauthorized
          note: |-
            - 비밀번호는 **로그인 한 번**만 오간다. 그 뒤로는 표시만 오간다
            - `Cookie`는 브라우저가 자동으로, `Authorization`은 코드가 직접 붙인다
            - 표시가 없으면 401이다. 403이 아니다 — 누구인지부터 모른다
        predict:
          question: 로그인에 성공한 뒤 다음 요청에 아무 표시도 붙이지 않으면?
          choices:
            - 401이 난다. 서버는 이전 요청을 기억하지 못한다
            - 로그인한 지 얼마 안 됐으므로 통과한다
            - 403이 난다
            - 서버가 마지막 로그인 사용자로 처리한다
          answer: 401이 난다. 서버는 이전 요청을 기억하지 못한다
          explanation: |-
            HTTP는 상태가 없다. 방금 로그인했더라도 **다음 요청은 서버에게 처음 보는 요청**이다.
            누구인지 모르니 401(Unauthorized)이다.
            403(Forbidden)은 "누구인지는 알지만 그 일은 안 된다"일 때다 — 그건 인가의 영역이다.
        complete:
          question: 서버가 브라우저에 로그인 표시를 심는 응답 헤더와, 브라우저가 그 뒤 붙이는 요청 헤더를 쓰세요.
          code: |-
            HTTP/1.1 200 OK
            ___: SESSION=<session-id>; HttpOnly

            GET /api/v1/orders HTTP/1.1
            ___: SESSION=<session-id>
          answers:
            - [Set-Cookie]
            - [Cookie]
          explanation: |-
            서버가 심을 때는 `Set-Cookie`(응답), 브라우저가 돌려보낼 때는 `Cookie`(요청)다.
            이름이 갈려 있어서 어느 방향인지 헷갈릴 일이 없다.
        problem:
          prompt: |-
            동료가 묻습니다. **"로그인은 됐는데 다음 화면에서 계속 401이 나요. 서버가 로그인을 못 받은 걸까요?"**

            1. 이 증상에서 **가장 먼저 확인할 것** 하나와 그 이유
            2. 401과 403이 어떻게 다른지, 이 증상이 왜 401인지
            3. 로그인 요청과 그 뒤 요청이 **각각 무엇을 보내는지** 비교
          deliverables:
            - 세 물음에 대한 답
            - 1번은 확인 절차를 구체적으로
          hints:
            - 로그인 응답에 무엇이 들어 있어야 했는지부터 보세요.
            - 표시를 붙이는 주체가 브라우저인지 코드인지에 따라 확인할 자리가 다릅니다.
            - 401과 403은 서버가 "모른다"와 "안 된다" 중 무엇을 말하는가로 갈립니다.
          modelAnswer: |-
            **1. 가장 먼저 확인할 것 — 그 다음 요청에 표시가 실제로 붙어 나갔는가**

            개발자도구 Network에서 401이 난 요청의 **요청 헤더**를 본다.
            `Cookie`(또는 `Authorization`)가 아예 없으면 서버 문제가 아니라 **붙지 않은 것**이다.
            붙어 있는데도 401이면 그때 서버(만료·서명·저장소)를 본다.
            순서가 중요하다 — 안 붙은 것을 서버에서 찾으면 시간을 버린다.

            **2. 401과 403**

            - **401 Unauthorized**: 누구인지 모른다. 표시가 없거나 못 믿을 때다
            - **403 Forbidden**: 누구인지는 안다. 그런데 그 일은 허용되지 않는다

            지금은 로그인 뒤 표시가 전달되지 않아 서버가 **누구인지 모르는** 상태이므로 401이다.

            **3. 두 요청의 차이**

            - **로그인 요청**: 아이디와 비밀번호를 보낸다. 이 한 번뿐이다
            - **그 뒤 모든 요청**: 비밀번호를 다시 보내지 않는다. 로그인 응답으로 받은 **표시만** 보낸다

            비밀번호를 매 요청에 실어 보내고 있다면 그 자체가 고쳐야 할 설계다.
          selfChecks:
            - 확인 자리를 **요청 헤더**로 짚었는가 (서버부터 보지 않았는가)
            - 401과 403을 "모른다 / 안 된다"로 갈랐는가
            - 로그인 요청과 그 뒤 요청이 보내는 것이 다르다고 말했는가

      - key: LESSON.WEB_HTTP.AUTH_SESSION_TOKEN.001.U2
        title: 서버가 기억한다 — 세션
        minutes: 12
        core: true
        explain: |-
          **세션**은 로그인한 사람의 정보를 **서버가 들고 있고**, 클라이언트에게는
          그 사물함을 여는 **열쇠(세션 id)만** 준다. 쿠키에 담기는 것은 그 열쇠 하나다.

          그래서 성질이 이렇게 정해진다.

          - **로그아웃이 즉시 된다.** 서버에서 그 사물함을 지우면 끝이다.
            이미 나간 열쇠는 그 순간부터 아무것도 열지 못한다
          - **담는 양에 제한이 거의 없다.** 서버 메모리나 저장소에 두기 때문이다
          - **서버가 상태를 갖는다.** 서버를 두 대로 늘리면 1번에서 만든 사물함을
            2번은 모른다. 저장소를 밖으로 빼거나 같은 서버로 붙여야 한다

          쿠키에는 속성을 반드시 붙인다.

          - **`HttpOnly`** — 스크립트가 읽지 못한다. 화면에 끼어든 악성 스크립트가 열쇠를 훔쳐 가지 못한다
          - **`Secure`** — HTTPS에서만 보낸다
          - **`SameSite`** — 다른 사이트에서 시작된 요청에 쿠키가 따라붙는 것을 막는다

          `HttpOnly`는 특히 중요하다 — 쿠키를 스크립트가 읽을 수 있으면 붙인 의미가 없다.
        example:
          language: http
          code: |-
            # 로그인 — 서버가 사물함을 만들고 열쇠만 내려준다
            HTTP/1.1 200 OK
            Set-Cookie: SESSION=<session-id>; HttpOnly; Secure; SameSite=Lax; Path=/

            # 서버 안에는 이런 것이 남아 있다 (클라이언트는 못 본다)
            #   <session-id> → { userId: 17, roles: [USER], 만료: 30분 뒤 }

            # 로그아웃 — 서버가 사물함을 지운다
            POST /api/v1/logout HTTP/1.1
            Cookie: SESSION=<session-id>

            HTTP/1.1 204 No Content
            Set-Cookie: SESSION=; Max-Age=0
          output: |-
            로그아웃 전  GET /api/v1/orders  → 200
            로그아웃 후  GET /api/v1/orders  → 401   (같은 열쇠인데 사물함이 없다)

            서버를 2대로 늘리면
              1번에서 로그인 → 2번으로 간 요청 → 401  (사물함이 1번에만 있다)
          note: |-
            - 쿠키에 담기는 것은 **열쇠 하나**다. 사용자 정보가 아니다
            - 로그아웃이 즉시 듣는 이유는 **지울 대상이 서버에 있기** 때문이다
            - 서버를 늘리면 사물함을 공유해야 한다. 이것이 세션의 대가다
        predict:
          question: 세션 방식에서 서버를 2대로 늘렸는데 세션 저장소를 공유하지 않으면?
          choices:
            - 다른 서버로 간 요청이 401이 된다. 그 서버에는 세션이 없다
            - 쿠키에 사용자 정보가 있으므로 문제없다
            - 브라우저가 알아서 원래 서버로 보낸다
            - 두 서버가 자동으로 세션을 주고받는다
          answer: 다른 서버로 간 요청이 401이 된다. 그 서버에는 세션이 없다
          explanation: |-
            쿠키에 든 것은 **열쇠뿐**이고 사물함은 로그인을 처리한 그 서버에만 있다.
            다른 서버는 그 열쇠로 열 것이 없으므로 "누구인지 모른다" — 401이다.
            그래서 세션을 쓰면서 서버를 늘리려면 저장소를 밖으로 빼거나,
            같은 사용자를 같은 서버로 보내야 한다. **세션의 대가가 여기서 나온다.**
        complete:
          question: 스크립트가 쿠키를 읽지 못하게 막는 속성과, HTTPS에서만 보내게 하는 속성을 쓰세요.
          code: |-
            Set-Cookie: SESSION=<session-id>; ___; ___; SameSite=Lax
          answers:
            - [HttpOnly]
            - [Secure]
          explanation: |-
            `HttpOnly`는 `document.cookie`로 읽히지 않게 하고, `Secure`는 HTTPS에서만 전송한다.
            둘 다 빠지면 열쇠가 스크립트에도 읽히고 평문으로도 오간다.
        problem:
          prompt: |-
            주문 시스템에 세션 로그인을 붙였습니다. 운영에서 두 가지가 보고됐습니다.

            - 로그아웃을 눌렀는데 **가끔 그대로 로그인 상태**다
            - 서버를 2대로 늘린 뒤 **요청마다 로그인이 풀린다**

            각각 왜 그런지와 고칠 방향을 쓰세요.
          deliverables:
            - 두 증상의 원인과 고칠 방향
            - 세션의 어떤 성질에서 비롯됐는지 함께
          hints:
            - 로그아웃이 즉시 듣는 이유가 무엇이었는지 거꾸로 생각해 보세요.
            - 열쇠는 어디에 있고 사물함은 어디에 있었나요?
            - 두 번째 증상은 요청이 어느 서버로 가느냐에 따라 달라집니다.
          modelAnswer: |-
            **1. 로그아웃이 가끔 안 듣는다**

            로그아웃은 **서버의 세션을 지워야** 듣는다.
            브라우저 쿠키만 지우고 서버 세션을 남겨 두면, 그 열쇠를 가진 요청은 계속 통한다.
            (쿠키만 지우는 구현은 "내 브라우저에서만 로그아웃"이다.)

            고칠 방향: 로그아웃 요청에서 **서버 세션을 무효화**하고, 응답에서 쿠키도 함께 만료시킨다.

            **2. 서버를 늘리니 로그인이 풀린다**

            세션은 **서버가 상태를 갖는** 방식이다. 1번 서버에서 만든 세션을 2번 서버는 모른다.
            요청이 번갈아 가면 절반은 401이 된다.

            고칠 방향 — 둘 중 하나다.

            - **세션 저장소를 서버 밖으로** 뺀다. 두 서버가 같은 곳을 본다
            - 같은 사용자의 요청을 **같은 서버로** 보낸다. 다만 그 서버가 죽으면 세션도 같이 죽는다

            둘 다 세션이라는 선택에 딸려 오는 비용이다. 토큰이면 이 문제는 없지만 로그아웃이 어려워진다.
          selfChecks:
            - 로그아웃은 **서버 세션 무효화**가 본질이라고 말했는가
            - 두 번째 증상을 "서버가 상태를 갖는다"와 연결했는가
            - 고칠 방향을 둘(저장소 분리 / 같은 서버로 보내기) 중 하나 이상 구체적으로 적었는가

      - key: LESSON.WEB_HTTP.AUTH_SESSION_TOKEN.001.U3
        title: 클라이언트가 들고 다닌다 — 토큰
        minutes: 12
        core: true
        explain: |-
          **토큰**은 로그인한 사람의 정보를 **토큰 안에 담아** 클라이언트에게 준다.
          서버는 아무것도 기억하지 않고, 요청이 올 때마다 **서명을 검증**해서 믿을지 정한다.

          널리 쓰이는 형식이 **JWT**다. 점으로 나뉜 세 조각이고 **서명되어 있을 뿐 암호화가 아니다** —
          누구나 내용을 읽을 수 있다. 그래서 **토큰에 비밀을 담지 않는다.**

          성질이 세션과 정반대로 간다.

          - **서버가 상태를 갖지 않는다.** 서버를 몇 대로 늘려도 각자 검증만 하면 된다
          - **로그아웃이 어렵다.** 이미 나간 토큰은 만료될 때까지 유효하다.
            서버에 지울 것이 없기 때문이다
          - **내용이 굳는다.** 권한을 바꿔도 이미 나간 토큰에는 옛 권한이 들어 있다

          그래서 실무에서는 **수명을 짧게** 두고(access token), 갱신용 토큰을 따로 둔다.
          "로그아웃 즉시 차단"이 필요하면 결국 **서버에 무효 목록을 둬야** 하고,
          그 순간 무상태라는 장점이 절반 사라진다.

          토큰은 `Authorization: Bearer <토큰>`으로 보낸다. **코드가 직접 붙인다.**
        example:
          language: http
          code: |-
            # 로그인 응답 — 토큰을 준다 (서버는 저장하지 않는다)
            HTTP/1.1 200 OK
            Content-Type: application/json

            {"accessToken": "<header>.<payload>.<signature>", "expiresIn": 900}

            # 그 다음 요청 — 코드가 직접 붙인다
            GET /api/v1/orders HTTP/1.1
            Authorization: Bearer <header>.<payload>.<signature>

            # payload 는 누구나 디코딩해 읽을 수 있다 (암호화가 아니다)
            #   { "sub": "17", "roles": ["USER"], "exp": 1790000000 }
          output: |-
            서버 1번에서 발급 → 서버 2번으로 요청 → 200   (검증만 하면 되므로 통과)

            로그아웃 누른 직후 같은 토큰으로 요청 → 200   ← 서버에 지울 것이 없다
            만료 시각이 지난 뒤                    → 401
          note: |-
            - JWT는 **서명**이지 암호화가 아니다. payload는 누구나 읽는다
            - 서버를 늘려도 그대로 동작한다. 검증만 하면 되기 때문이다
            - 로그아웃 즉시 차단이 필요하면 서버에 무효 목록이 필요하다 — 무상태가 깨진다
        predict:
          question: 사용자의 권한을 관리자에서 일반으로 낮췄습니다. 이미 발급된 JWT를 들고 있는 요청은?
          choices:
            - 토큰이 만료될 때까지 옛 권한으로 통과한다
            - 다음 요청부터 곧바로 새 권한이 적용된다
            - 토큰이 즉시 무효가 된다
            - 서버가 권한을 다시 조회해 막는다
          answer: 토큰이 만료될 때까지 옛 권한으로 통과한다
          explanation: |-
            권한이 **토큰 안에 굳어** 있고 서버는 그 토큰을 검증만 한다.
            바깥에서 권한을 바꿔도 이미 나간 토큰의 내용은 바뀌지 않는다.
            그래서 토큰 수명을 짧게 두거나, 중요한 권한은 요청 때 다시 확인해야 한다.
            이것이 "무상태"의 대가다.
        complete:
          question: 토큰을 보내는 요청 헤더 이름과 그 앞에 붙이는 방식 이름을 쓰세요.
          code: |-
            GET /api/v1/orders HTTP/1.1
            ___: ___ <header>.<payload>.<signature>
          answers:
            - [Authorization]
            - [Bearer]
          explanation: |-
            `Authorization: Bearer <토큰>`이다. `Bearer`는 "이 토큰을 지닌 자"라는 뜻의 방식 이름이고,
            쿠키와 달리 **코드가 직접** 붙여야 한다.
        problem:
          prompt: |-
            팀에서 **"JWT를 쓰면 무상태라 좋다"** 며 도입하려 합니다.
            이 서비스에는 **관리자가 특정 사용자를 즉시 차단**하는 기능이 필요합니다.

            1. JWT만으로 "즉시 차단"이 되는지, 안 된다면 왜인지
            2. 그래도 하려면 무엇을 더해야 하고, 그때 무상태는 어떻게 되는지
            3. 토큰 payload에 비밀번호나 주민번호를 넣으면 안 되는 이유
          deliverables:
            - 세 물음에 대한 답
            - 2번은 장단점을 함께
          hints:
            - 차단하려면 무엇을 지워야 하는데, 그것이 어디에 있나요?
            - 서명은 위조를 막습니다. 내용을 감추지는 않습니다.
            - 즉시 차단을 넣는 순간 서버가 무엇을 들고 있게 되는지 생각해 보세요.
          modelAnswer: |-
            **1. JWT만으로는 즉시 차단이 안 된다**

            토큰은 이미 클라이언트에게 나갔고 **서버에는 지울 것이 없다.**
            서버가 하는 일은 서명 검증뿐이라, 서명이 맞고 만료 전이면 통과시킨다.
            차단하려면 "이 토큰은 이제 안 된다"를 **어딘가에 적어 두고 매 요청 확인**해야 한다.

            **2. 더해야 하는 것과 대가**

            - **무효 목록(차단 목록)을 서버에 둔다.** 요청마다 조회한다.
              → 즉시 차단은 되지만, **서버가 상태를 갖게 되어 무상태의 장점이 사라진다**
            - **토큰 수명을 아주 짧게(예: 몇 분) 두고 갱신 토큰으로 연장한다.**
              → 서버는 무상태로 남지만 차단이 **즉시**가 아니라 **수명만큼 늦다**

            현실에서는 둘을 섞는다 — 짧은 수명 + 갱신 토큰 쪽에만 무효 목록을 둔다.
            확인할 대상이 줄어 비용이 덜 든다.

            **3. payload에 비밀을 넣지 않는 이유**

            JWT는 **서명이지 암호화가 아니다.** payload는 누구나 디코딩해 읽을 수 있다.
            서명은 **내용이 바뀌지 않았음**을 보장할 뿐 **내용을 감추지 않는다.**
            비밀번호·주민번호처럼 노출되면 안 되는 값은 토큰에 담지 않는다.
          selfChecks:
            - 즉시 차단이 안 되는 이유를 "서버에 지울 것이 없다"로 설명했는가
            - 무효 목록을 두면 무상태가 깨진다는 대가를 말했는가
            - 서명과 암호화를 구분했는가

      - key: LESSON.WEB_HTTP.AUTH_SESSION_TOKEN.001.U4
        title: 무엇을 고를 것인가
        minutes: 10
        core: true
        explain: |-
          둘 중 하나가 우월한 것이 아니라 **무엇을 포기할지**가 다르다.

          | | 세션 | 토큰 |
          |---|---|---|
          | 상태를 두는 곳 | 서버 | 클라이언트 |
          | 로그아웃 | 즉시 | 어렵다(만료까지) |
          | 서버 늘리기 | 저장소 공유 필요 | 그대로 됨 |
          | 권한 변경 반영 | 즉시 | 토큰이 만료돼야 |
          | 보내는 자리 | `Cookie`(자동) | `Authorization`(직접) |

          고르는 기준은 대개 이 순서다.

          1. **로그아웃·차단이 즉시여야 하는가** — 그렇다면 세션이 자연스럽다
          2. **서버가 여러 대이고 저장소를 더 두기 어려운가** — 그렇다면 토큰이 편하다
          3. **브라우저 하나만 쓰는가, 앱·외부 시스템도 붙는가** — 쿠키는 브라우저의 편의이고,
             브라우저가 아닌 곳에서는 `Authorization`이 단순하다

          **어느 쪽이든 비밀번호는 저장하지 않는다.** 되돌릴 수 없게 해시해서 보관하고,
          로그인 때는 입력값을 같은 방식으로 처리해 비교만 한다.
          이건 세션·토큰 선택과 무관하게 공통이다.
        example:
          language: text
          code: |-
            상황 A — 사내 관리 도구, 서버 1대, 권한을 잃은 계정을 즉시 차단해야 함
              → 세션. 차단이 "서버에서 지우기" 한 번으로 끝난다

            상황 B — 모바일 앱 + 웹, 서버 여러 대, 외부 시스템도 API 사용
              → 토큰. 쿠키가 없는 클라이언트가 섞여 있고 서버 확장이 잦다

            상황 C — 웹 화면만 있고 서버를 늘릴 계획이 있다
              → 세션 + 저장소를 밖으로 분리. 로그아웃을 포기하지 않으면서 확장한다
          output: |-
            결정에 함께 남길 것

              무엇을 골랐나     : 세션
              무엇을 포기했나   : 서버를 늘릴 때 저장소를 따로 둬야 한다
              왜 그 대가를 택했나: 계정 즉시 차단이 이 도구의 핵심 요구사항이다
          note: |-
            - 고르는 일은 **무엇을 포기할지 정하는 일**이다. 장점만 적은 비교표는 결정에 쓸모가 없다
            - 상황 C처럼 **섞는 선택**도 있다. 세션 + 외부 저장소
            - 비밀번호 해시 보관은 어느 쪽을 골라도 똑같이 해야 한다
        predict:
          question: 서버를 여러 대로 늘려야 하고, 동시에 관리자가 사용자를 즉시 차단해야 한다면?
          choices:
            - 둘 다 만족하려면 어느 쪽이든 서버에 공유 상태가 필요하다
            - 토큰을 쓰면 둘 다 공짜로 해결된다
            - 세션을 쓰면 둘 다 공짜로 해결된다
            - 두 요구는 동시에 만족할 수 없다
          answer: 둘 다 만족하려면 어느 쪽이든 서버에 공유 상태가 필요하다
          explanation: |-
            세션으로 가면 **세션 저장소**를 공유해야 하고,
            토큰으로 가면 **무효 목록**을 공유해야 한다.
            즉시 차단은 "이 사람은 이제 안 된다"를 서버가 알고 있어야 가능하고,
            서버가 여러 대면 그 앎을 나눠 가져야 한다. **공짜로 되는 조합은 없다.**
        complete:
          question: 로그아웃이 즉시 듣는 쪽과, 서버를 늘리기 쉬운 쪽을 각각 쓰세요.
          code: |-
            로그아웃 즉시   → ___
            서버 늘리기 쉬움 → ___
          answers:
            - [세션]
            - [토큰]
          explanation: |-
            지울 대상이 서버에 있으므로 로그아웃은 **세션**이 즉시 듣고,
            서버가 아무것도 기억하지 않으므로 확장은 **토큰**이 쉽다. 정확히 맞바꾼 관계다.
        problem:
          prompt: |-
            내 사이드 프로젝트(주문 시스템)에 로그인을 붙이려 합니다.
            **웹 화면만 있고, 지금은 서버 1대이며, 나중에 늘릴 수도 있습니다.**

            세션과 토큰 중 하나를 고르고 **결정 기록**을 쓰세요.
          deliverables:
            - 고른 것과 그 이유
            - 포기한 것(대가)을 명시
            - 나중에 상황이 바뀌면 무엇이 문제가 되는지
          hints:
            - 지금 가장 중요한 요구가 무엇인지부터 적어 보세요.
            - 고르는 일은 무엇을 포기할지 정하는 일이었습니다.
            - 클라이언트가 브라우저뿐인지도 기준이었습니다.
          modelAnswer: |-
            **고른 것: 세션**

            **이유**

            - 클라이언트가 **브라우저뿐**이다. 쿠키가 자동으로 붙어 붙이는 자리를 빠뜨릴 일이 없고,
              `HttpOnly`로 스크립트에서 읽히지 않게 막을 수 있다
            - 지금 서버가 1대라 세션의 가장 큰 비용(저장소 공유)이 아직 없다
            - 로그아웃을 확실하게 만들기 쉽다. 학습용 프로젝트에서 "로그아웃이 안 된다"는 디버깅하기 나쁜 문제다

            **포기한 것**

            서버를 늘리는 순간 **세션 저장소를 밖으로 빼거나 같은 서버로 요청을 붙여야** 한다.
            그때 배포 구성이 한 단계 복잡해진다.

            **상황이 바뀌면**

            - 모바일 앱이나 외부 시스템이 붙으면 쿠키가 없는 클라이언트가 생긴다 →
              그때는 `Authorization` 기반으로 옮기거나 두 방식을 함께 지원해야 한다
            - 서버를 늘리면 위의 대가를 치러야 한다. **미리 저장소를 분리해 두면** 옮길 때 덜 아프다

            (토큰을 골랐다면 이유는 "클라이언트가 여럿", 대가는 "로그아웃·권한 변경이 즉시 듣지 않는다"가 된다.
            어느 쪽이든 **대가를 적어 두는 것**이 이 기록의 핵심이다.)
          selfChecks:
            - 고른 이유를 **지금 상황**(브라우저뿐, 서버 1대)에 근거해 적었는가
            - 포기한 것을 구체적으로 적었는가 (장점만 나열하지 않았는가)
            - 상황이 바뀔 때 무엇이 문제가 되는지 짚었는가

    commonMistakes:
      - 로그아웃에서 쿠키만 지우고 서버 세션을 남긴다. 그 열쇠를 가진 요청은 계속 통한다 (U2)
      - JWT가 암호화라고 생각해 payload에 비밀을 담는다. 서명일 뿐 누구나 읽는다 (U3)
      - 장점만 비교하고 대가를 적지 않는다. 결정 기록으로 쓸 수 없다 (U4)
    inProject: |-
      주문 시스템에 로그인을 붙이는 단계에서 바로 쓴다.
      먼저 "표시가 붙어 나가는가"를 요청 헤더에서 확인하는 습관을 들인다(U1).
      세션으로 간다면 `HttpOnly`·`Secure`·`SameSite`를 처음부터 붙이고 로그아웃에서
      서버 세션을 무효화한다(U2). 토큰으로 간다면 payload에 비밀을 담지 않고
      수명을 짧게 둔다(U3). 무엇을 골랐든 **포기한 것을 기록에 남긴다**(U4) —
      나중에 서버를 늘리거나 앱을 붙일 때 그 기록이 판단의 출발점이 된다.
    sources:
      - title: MDN — Using HTTP cookies
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies
        versionScope: HTTP/1.1
      - title: MDN — HTTP authentication
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Authentication
        versionScope: HTTP/1.1
      - title: 'RFC 6750 — The OAuth 2.0 Authorization Framework: Bearer Token Usage'
        url: https://www.rfc-editor.org/rfc/rfc6750
        versionScope: RFC 6750
    verifiedAt: 2026-09-23
