# DevPilot 개념 노트 — 멱등성과 재시도
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 2단계(DB와 트랜잭션)에서 쓴다. WEB_HTTP.HTTP_BASICS 노트를 먼저 본 것으로 전제한다
# - 이 저장소의 규칙(인증 POST에 Idempotency-Key 필수, docs/05)과 같은 주제다
lessons:
  - key: LESSON.WEB_HTTP.IDEMPOTENCY.001
    skillCode: WEB_HTTP.IDEMPOTENCY
    title: 두 번 눌러도 한 번만 (멱등성)
    whyItMatters: |-
      사용자가 결제 버튼을 두 번 누르거나, 앱이 응답을 못 받고 재시도하면
      주문이 두 건 들어간다. 네트워크는 **응답이 안 왔다고 요청이 안 갔다는 뜻이 아니다.**
      돈이 걸린 요청에서 이것을 막지 못하면 환불 처리와 사과로 이어진다.
      주문 생성·결제·쿠폰 발급이 전부 여기에 해당한다.
    oneLine: 멱등하다는 것은 같은 요청을 여러 번 보내도 결과가 한 번 보낸 것과 같다는 뜻이다.
    units:
      - key: LESSON.WEB_HTTP.IDEMPOTENCY.001.U1
        title: 어떤 요청이 안전한가
        minutes: 10
        core: true
        explain: |-
          HTTP 명세는 메서드마다 성질을 정해 두었다.

          | 메서드 | 안전한가 (상태를 안 바꾼다) | 멱등한가 (여러 번 = 한 번) |
          |---|---|---|
          | `GET` | 그렇다 | 그렇다 |
          | `PUT` | 아니다 | **그렇다** |
          | `DELETE` | 아니다 | **그렇다** |
          | `POST` | 아니다 | **아니다** |

          `PUT`이 멱등한 이유는 **"이 값으로 만들어라"** 이기 때문이다.
          같은 값으로 열 번 보내도 결과는 같다.
          `DELETE`도 "없게 만들어라"이므로 두 번째부터는 이미 없어서 같다.

          `POST`는 **"새로 만들어라"** 라서 부를 때마다 하나씩 늘어난다.
          그래서 **재시도가 위험한 것은 `POST`뿐**이다.

          명세가 정한 것은 **약속**이지 보장이 아니다.
          `PUT` 핸들러 안에서 로그를 한 줄씩 쌓으면 그 `PUT`은 멱등하지 않다.
          멱등성은 **우리가 구현으로 지키는 것**이다.
        example:
          language: http
          code: |-
            # 멱등하다 — 몇 번 보내도 수량이 3이다
            PUT /carts/1/lines/KB-01
            Content-Type: application/json

            {"quantity": 3}

            # 멱등하지 않다 — 보낼 때마다 주문이 하나씩 생긴다
            POST /orders
            Content-Type: application/json

            {"productCode": "KB-01", "quantity": 3}
          output: |-
            PUT 세 번
            → 200 OK  {"productCode":"KB-01","quantity":3}
            → 200 OK  {"productCode":"KB-01","quantity":3}
            → 200 OK  {"productCode":"KB-01","quantity":3}
            장바구니 줄 1개, 수량 3

            POST 세 번
            → 201 Created  {"orderId":1001}
            → 201 Created  {"orderId":1002}
            → 201 Created  {"orderId":1003}
            주문 3건
          note: |-
            - `PUT`은 **최종 상태**를 보낸다 — "3개로 만들어라"
            - 같은 것을 또 보내도 이미 3개라 바뀌는 것이 없다
            - `POST`는 **행위**를 보낸다 — "주문을 만들어라"
            - 그래서 재시도 대책이 필요한 것은 `POST` 쪽이다
        predict:
          question: '`PATCH /carts/1/lines/KB-01` 로 `{"quantityDelta": 1}` 을 세 번 보내면?'
          choices:
            - 수량이 3 늘어난다 — 증감 방식은 멱등하지 않다
            - 수량이 1 늘어난다
            - 오류가 난다
            - 아무 변화가 없다
          answer: 수량이 3 늘어난다 — 증감 방식은 멱등하지 않다
          explanation: |-
            **"얼마로 만들어라"는 멱등하고, "얼마만큼 바꿔라"는 멱등하지 않다.**
            메서드 이름이 아니라 **몸통이 무엇을 뜻하는지**가 성질을 정한다.
            API를 설계할 때 최종 상태를 받는 쪽을 고르면 재시도가 안전해진다.
        complete:
          question: 장바구니 수량 변경을 멱등하게 설계하세요.
          code: |-
            ___ /carts/{cartId}/lines/{productCode}

            {"quantity": 3}      # "3개로 만들어라" — 최종 ___ 를 보낸다
          answers:
            - [PUT]
            - [상태, 값]
          explanation: |-
            `PUT`에 최종 수량을 담으면 몇 번 보내도 결과가 같다.
            `POST /carts/1/lines` 에 `{"quantityDelta": 1}` 을 보내는 설계는
            재시도할 때마다 수량이 늘어난다.
        problem:
          prompt: |-
            주문 시스템의 API 다섯 개를 멱등성 관점에서 점검하세요.

            ```text
            POST   /orders                       주문 생성
            PUT    /orders/{id}/memo             메모 수정
            DELETE /orders/{id}                  주문 취소
            POST   /orders/{id}/cancel           주문 취소 (다른 설계)
            POST   /coupons/{code}/use           쿠폰 사용
            ```

            - 각각 멱등한지 판단하고 이유를 적으세요
            - 멱등하지 않은 것 중 **설계를 바꿔 멱등하게 만들 수 있는 것**을 고쳐 보세요
            - 설계로는 못 고치는 것이 무엇이고 왜 그런지 적으세요
          deliverables:
            - API별 멱등성 판단과 이유
            - 설계를 바꿔 고친 것
            - 설계로 못 고치는 것과 그 이유
          hints:
            - 두 번 보냈을 때 결과가 달라지는지 직접 그려 보세요.
            - 취소가 두 가지 설계로 나와 있습니다. 둘의 차이가 무엇인가요?
            - 상태 전이는 두 번째 호출에서 무엇을 할 수 있을까요?
          modelAnswer: |-
            | API | 멱등? | 이유 |
            |---|---|---|
            | `POST /orders` | **아니다** | 부를 때마다 주문이 생긴다 |
            | `PUT /orders/{id}/memo` | 그렇다 | 최종 메모 값을 보낸다 |
            | `DELETE /orders/{id}` | 그렇다 | 두 번째는 이미 취소 상태다 |
            | `POST /orders/{id}/cancel` | **그렇게 만들 수 있다** | 대상이 정해져 있다 |
            | `POST /coupons/{code}/use` | **그렇게 만들 수 있다** | 〃 |

            뒤의 둘은 **대상이 경로에 있으므로** 구현으로 멱등하게 만들 수 있다.

            ```java
            @Transactional
            public void cancel(long orderId, long memberId) {
                Order order = orderRepository.findByIdAndMemberId(orderId, memberId).orElseThrow();
                if (order.isCancelled()) {
                    return;                      // 이미 취소됐으면 조용히 성공
                }
                order.cancel();
            }
            ```

            상태 전이를 **"그 상태로 만들어라"** 로 읽으면 두 번째 호출이 할 일이 없다.
            이미 취소된 것을 또 취소해 달라는 요청에 409를 주는 설계도 있지만,
            재시도를 생각하면 조용히 성공하는 쪽이 낫다.

            설계로 못 고치는 것은 **`POST /orders`** 다.
            "새로 만들어라"는 요청에는 **어느 주문인지 가리키는 식별자가 없다.**
            그래서 서버가 두 요청이 같은 것인지 알 방법이 없다 — 다음 단위의 주제다.
          selfChecks:
            - 다섯 개를 모두 판단했는가
            - 두 번 보냈을 때를 실제로 그려 봤는가
            - 상태 전이를 멱등하게 만드는 코드를 썼는가
            - POST 생성이 왜 설계만으로 안 되는지 설명했는가
      - key: LESSON.WEB_HTTP.IDEMPOTENCY.001.U2
        title: 같은 요청임을 알려 주는 열쇠
        minutes: 12
        core: true
        explain: |-
          `POST /orders` 를 두 번 받았을 때 서버가 알 수 없는 것은 하나다 —
          **이것이 재시도인가, 정말 두 번째 주문인가.**

          몸통이 같아도 구분이 안 된다. 같은 상품을 정말 두 번 주문할 수도 있다.

          그래서 **클라이언트가 열쇠를 준다.** 요청마다 유일한 값을 만들어
          헤더에 담아 보내고, 재시도할 때는 **같은 값을 그대로** 보낸다.

          ```text
          Idempotency-Key: 9f1c2e5a-...
          ```

          서버는 이렇게 처리한다.

          1. 그 열쇠로 처리한 기록이 있나 본다
          2. 있으면 **그때 만든 응답을 그대로** 돌려준다 (다시 처리하지 않는다)
          3. 없으면 처리하고 **열쇠와 응답을 함께 기록한다**

          요점은 2번이다. "이미 처리됨" 오류를 주는 것이 아니라
          **처음과 똑같은 응답**을 준다. 클라이언트는 재시도인지 신경 쓸 필요가 없다.
        example:
          language: http
          code: |-
            # 첫 요청
            POST /orders
            Idempotency-Key: 9f1c2e5a-3b47-4d21-9e88-0a1b2c3d4e5f
            Content-Type: application/json

            {"productCode": "KB-01", "quantity": 3}

            # 응답을 못 받아 같은 열쇠로 재시도
            POST /orders
            Idempotency-Key: 9f1c2e5a-3b47-4d21-9e88-0a1b2c3d4e5f
            Content-Type: application/json

            {"productCode": "KB-01", "quantity": 3}
          output: |-
            첫 요청
            → 201 Created
              {"orderId": 1001, "status": "PLACED"}

            재시도 (같은 열쇠)
            → 201 Created
              {"orderId": 1001, "status": "PLACED"}    ← 같은 응답

            주문 표: 1건
          note: |-
            - 두 응답이 **완전히 같다.** 상태 코드도 본문도
            - 클라이언트는 어느 쪽이 처리된 것인지 알 필요가 없다
            - 주문은 한 건이다 — 두 번째는 처리하지 않고 기록을 꺼냈다
            - 열쇠는 **클라이언트가 만든다.** 요청 하나당 하나, 재시도에는 같은 것
        predict:
          question: 두 번째 요청이 같은 열쇠에 **다른 몸통**(수량 5)을 보내면 어떻게 해야 하나?
          choices:
            - 422나 409로 거절한다 — 같은 열쇠에 다른 요청은 클라이언트의 버그다
            - 수량 5로 새로 처리한다
            - 첫 응답을 그대로 준다
            - 조용히 무시한다
          answer: 422나 409로 거절한다 — 같은 열쇠에 다른 요청은 클라이언트의 버그다
          explanation: |-
            열쇠는 "이 요청과 저 요청이 같다"는 **약속**이다.
            몸통이 다르면 약속이 깨진 것이고, 어느 쪽을 처리해야 할지 알 수 없다.
            그래서 첫 요청의 몸통을 해시로 함께 저장해 두고 **달라지면 거절한다.**
        complete:
          question: 멱등 열쇠를 저장할 표를 설계하세요.
          code: |-
            CREATE TABLE idempotency_records (
                idempotency_key  VARCHAR(100) ___ KEY,   -- 같은 열쇠를 두 번 못 넣는다
                request_hash     VARCHAR(64)  NOT NULL,   -- 몸통이 같은지 확인
                response_body    TEXT         NOT NULL,   -- 그때 준 응답
                response_status  INTEGER      NOT NULL,
                created_at       TIMESTAMPTZ  NOT NULL ___ now()
            );
          answers:
            - [PRIMARY]
            - [DEFAULT]
          explanation: |-
            열쇠를 기본 키로 두면 **DB가 중복을 막아 준다.**
            동시에 같은 열쇠로 두 요청이 들어와도 하나만 삽입에 성공한다 —
            애플리케이션에서 확인하고 넣는 것보다 확실하다.
        problem:
          prompt: |-
            주문 생성 API에 멱등 처리를 붙이세요.

            - 요청은 `Idempotency-Key` 헤더를 필수로 받는다
            - 같은 열쇠 + 같은 몸통이면 첫 응답을 그대로 돌려준다
            - 같은 열쇠 + 다른 몸통이면 거절한다
            - 헤더가 없으면 400이다

            - 처리 흐름을 순서대로 적으세요
            - 두 요청이 **정확히 동시에** 들어왔을 때 무엇이 문제가 되는지 적고,
              그것을 막는 방법을 적으세요
            - 기록을 **언제까지 보관할지** 정하고 이유를 적으세요
          deliverables:
            - 처리 흐름
            - 동시 요청에서 생기는 문제와 막는 방법
            - 보관 기간과 이유
          hints:
            - 조회하고 없으면 삽입하는 흐름에는 틈이 있습니다. 앞 노트에서 본 그 틈입니다.
            - DB의 제약이 그 틈을 대신 막아 줄 수 있습니다.
            - 기록을 영원히 두면 무엇이 문제일까요?
          modelAnswer: |-
            흐름 —
            **① 헤더를 읽는다(없으면 400) → ② 몸통 해시를 만든다 →
            ③ 열쇠로 기록을 찾는다 → ④ 있으면 몸통 해시를 비교해
            같으면 저장된 응답을, 다르면 409를 → ⑤ 없으면 처리하고 기록을 남긴다.**

            동시에 들어오면 **③에서 둘 다 "없다"를 보고 ⑤로 가서 주문이 두 건** 생긴다.
            앞 노트의 "읽고 판단해서 쓰는 사이의 틈"과 같은 구조다.

            막는 방법은 **기록을 먼저 삽입하는 것**이다.

            ```java
            @Transactional
            public OrderResponse place(String key, OrderRequest request) {
                String hash = sha256(request);
                try {
                    idempotencyRepository.insertPending(key, hash);   // 기본 키 충돌 이용
                } catch (DataIntegrityViolationException duplicate) {
                    return idempotencyRepository.findByKey(key)
                            .filter(record -> record.requestHash().equals(hash))
                            .map(IdempotencyRecord::response)
                            .orElseThrow(() -> new IdempotencyConflictException(key));
                }
                OrderResponse response = doPlace(request);
                idempotencyRepository.complete(key, response);
                return response;
            }
            ```

            **삽입을 먼저 시도해** 기본 키 충돌로 중복을 걸러 낸다.
            DB가 원자적으로 판단하므로 틈이 없다.

            보관 기간은 **24시간 정도**가 적당하다. 재시도는 보통 몇 초에서 몇 분 안에 일어나고,
            영원히 두면 표가 끝없이 자라 조회가 느려진다.
            기간이 지난 기록은 주기적으로 지운다.
          selfChecks:
            - 흐름에 몸통 해시 비교가 들어 있는가
            - 조회 후 삽입의 틈을 DB 제약으로 막았는가
            - 재시도에 오류가 아니라 같은 응답을 주는가
            - 보관 기간을 정하고 이유를 댔는가
      - key: LESSON.WEB_HTTP.IDEMPOTENCY.001.U3
        title: 재시도하는 쪽의 규칙
        minutes: 10
        core: true
        explain: |-
          멱등성은 서버만의 일이 아니다. **부르는 쪽도 규칙을 지켜야** 한다.

          첫 번째는 **무엇을 재시도할지**다.

          | 응답 | 재시도 |
          |---|---|
          | 응답 없음 (시간 초과) | **한다** — 갔는지 모른다 |
          | 5xx, 429 | **한다** — 서버 사정이다 |
          | 4xx (429 제외) | **안 한다** — 같은 요청은 또 실패한다 |

          잘못된 요청을 재시도하는 것은 **상대를 괴롭히기만 할 뿐**이다.

          두 번째는 **어떻게 재시도할지**다. 바로 다시 보내면
          이미 힘든 서버에 더 몰린다. 그래서 **간격을 점점 늘리고**(지수 백오프),
          거기에 **약간의 무작위**를 섞는다 — 모두가 같은 순간에 다시 오는 것을 막기 위해서다.

          ```text
          1초 → 2초 → 4초 → 8초  (각각 ±20% 무작위)
          ```

          세 번째는 **언제 그만둘지**다. 무한 재시도는 장애를 길게 만든다.
          횟수 상한을 두고, 넘으면 실패로 처리해 사람이 보게 한다.
        example:
          language: java
          code: |-
            public OrderResponse placeWithRetry(OrderRequest request) {
                String key = UUID.randomUUID().toString();   // 재시도 전체에서 같은 열쇠
                int attempt = 0;

                while (true) {
                    try {
                        return orderClient.place(key, request);
                    } catch (TimeoutException | ServerErrorException retryable) {
                        attempt++;
                        if (attempt >= 4) {
                            throw new OrderFailedException("재시도 상한 초과", retryable);
                        }
                        sleepWithJitter(attempt);
                    }
                    // 4xx는 잡지 않는다 — 그대로 위로 올라간다
                }
            }

            private void sleepWithJitter(int attempt) throws InterruptedException {
                long base = 1000L << (attempt - 1);                  // 1s, 2s, 4s
                long jitter = (long) (base * 0.2 * Math.random());
                Thread.sleep(base + jitter);
            }
          output: |-
            시도 1 → 시간 초과
            1.13초 대기
            시도 2 → 503
            2.31초 대기
            시도 3 → 201 Created {"orderId":1001}

            서버의 주문 표: 1건 (열쇠가 같아 한 번만 처리됐다)
          note: |-
            - 열쇠를 **반복문 밖에서** 한 번 만들었다. 재시도마다 새로 만들면 의미가 없다
            - 4xx는 `catch`에 없다 — 재시도하지 않고 그대로 올라간다
            - 대기 시간이 1 → 2 → 4초로 늘고 무작위가 섞였다
            - 상한을 넘으면 예외로 끝낸다. 무한히 돌지 않는다
        predict:
          question: 열쇠를 `while` 안에서 매번 새로 만들면 어떻게 되나?
          choices:
            - 재시도마다 다른 요청으로 보여 주문이 여러 건 생길 수 있다
            - 그대로 한 건만 생긴다
            - 서버가 400을 준다
            - 아무 차이 없다
          answer: 재시도마다 다른 요청으로 보여 주문이 여러 건 생길 수 있다
          explanation: |-
            서버는 **열쇠로만** 같은 요청인지 판단한다. 열쇠가 다르면 새 요청이다.
            첫 시도가 사실은 성공했는데 응답만 못 받은 경우,
            새 열쇠로 다시 보내면 주문이 두 건 된다.
            **열쇠는 논리적인 요청 하나당 하나**다.
        complete:
          question: 재시도해야 할 응답만 걸러 내세요.
          code: |-
            if (status >= 500 || status == ___) {
                retry();                 // 서버 사정이니 다시 보낸다
            } else if (status >= 400) {
                ___();                    // 같은 요청은 또 실패한다
            }
          answers:
            - ["429"]
            - [fail, throw, 실패]
          explanation: |-
            `429`는 "너무 많이 보냈다"라 잠시 뒤에 다시 보내면 된다.
            나머지 4xx는 **요청 자체가 잘못**이라 몇 번을 보내도 같다.
            구분하지 않고 전부 재시도하면 상대에게 부담만 준다.
        problem:
          prompt: |-
            결제 API를 부르는 클라이언트를 설계하세요.

            - 결제는 **절대 두 번 나가면 안 된다**
            - 결제 서버는 가끔 느려지고(시간 초과) 가끔 503을 준다
            - 잔액 부족은 402로 온다

            - 재시도 규칙을 표로 정리하세요 (응답별로 할지 말지)
            - 멱등 열쇠를 **언제 만들고 어디까지 유지할지** 정하세요
            - 재시도 상한을 넘겼을 때 **결제가 됐는지 안 됐는지 모르는** 상황이 생깁니다.
              이때 무엇을 해야 하는지 적으세요
          deliverables:
            - 응답별 재시도 규칙 표
            - 열쇠의 생성 시점과 유지 범위
            - 상한 초과 시 대응
          hints:
            - 402는 재시도해서 해결될까요?
            - 열쇠를 만드는 시점이 재시도 반복문 안이면 안 됩니다.
            - 모르는 상태를 "실패"로 단정하면 무슨 일이 생길까요?
          modelAnswer: |-
            | 응답 | 재시도 | 이유 |
            |---|---|---|
            | 시간 초과 | **한다** | 갔는지 모른다. 열쇠가 중복을 막아 준다 |
            | 503, 502 | **한다** | 서버 사정이다 |
            | 429 | **한다** (더 길게 대기) | 잠시 뒤면 된다 |
            | 402 잔액 부족 | 안 한다 | 같은 요청은 또 실패한다 |
            | 400, 401 | 안 한다 | 요청이나 인증이 잘못됐다 |

            열쇠는 **결제를 시작하기로 결정한 시점에 한 번** 만들고,
            **그 결제 시도 전체**(모든 재시도)에서 같은 값을 쓴다.
            우리 쪽 주문 식별자로 만들면 더 좋다 —
            재기동 뒤에도 같은 열쇠를 다시 만들 수 있기 때문이다.

            상한을 넘기면 **"실패"로 단정하면 안 된다.**
            마지막 시도가 사실은 성공했을 수 있다.
            그래서 주문을 `PAYMENT_UNKNOWN` 같은 상태로 두고,
            **결제 서버에 조회해 확인한 뒤** 확정한다.
            조회 API가 없다면 사람이 볼 수 있게 기록을 남기고 알린다.
            잘못 실패로 처리하면 **돈은 나갔는데 주문이 없는** 최악이 된다.
          selfChecks:
            - 402를 재시도 대상에서 뺐는가
            - 열쇠를 재시도 전체에서 같게 유지했는가
            - 모르는 상태를 실패로 단정하지 않았는가
            - 확인 절차나 사람이 볼 경로를 마련했는가
    commonMistakes:
      - 재시도마다 멱등 열쇠를 새로 만든다. 서버가 다른 요청으로 보아 중복이 생긴다 (U3)
      - 4xx까지 재시도한다. 해결되지 않고 상대에게 부담만 준다 (U3)
      - 같은 열쇠의 재시도에 "이미 처리됨" 오류를 준다. 첫 응답을 그대로 줘야 한다 (U2)
    inProject: |-
      주문 시스템의 인증 POST에는 `Idempotency-Key` 헤더를 필수로 받는다.
      열쇠를 기본 키로 둔 표에 **먼저 삽입해** 동시 요청을 DB가 막게 하고,
      같은 열쇠의 재시도에는 저장해 둔 응답을 그대로 돌려준다.
      수량 변경처럼 최종 상태를 보낼 수 있는 것은 `PUT`으로 설계해 열쇠 없이도 안전하게 만든다.
