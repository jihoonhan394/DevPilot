# DevPilot 개념 노트 — 만든 것과 고른 것 설명하기
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 5단계(설명과 정리)에서 쓴다. implementation 목표가 0인 skill이라 과제도 글쓰기다
# - 듣는 사람은 같은 팀 동료와 리뷰어다. 예제는 모두 주문 시스템에서 가져온다
lessons:
  - key: LESSON.EXPLANATION.PROJECT_STORY.001
    skillCode: EXPLANATION.PROJECT_STORY
    title: 내가 만든 것을 2분 안에 설명하기
    whyItMatters: |-
      같은 것을 만들어도 설명하지 못하면 남에게는 없는 일이다. 새 팀에 합류했을 때,
      리뷰를 요청할 때, 스탠드업에서 어제 한 일을 말할 때 매번 이 능력이 쓰인다.
      특히 **고치는 일만 해 왔다면** 말할 것이 없다고 느끼기 쉬운데,
      사실은 고칠 때마다 판단을 했고 그 판단이 곧 이야기다.
    oneLine: 설명은 상황·과제·한 일·결과 순서로 하고, 2분 안에 끝나게 분량을 미리 정한다.
    units:
      - key: LESSON.EXPLANATION.PROJECT_STORY.001.U1
        title: 순서가 내용을 정한다
        minutes: 12
        core: true
        explain: |-
          설명이 길어지는 이유는 말이 많아서가 아니라 **순서가 없어서**다.
          순서가 없으면 듣는 사람이 "그래서 뭘 했다는 거지"를 계속 스스로 재구성해야 한다.

          널리 쓰이는 틀이 네 토막이다.

          | 토막 | 답할 것 | 분량 |
          |---|---|---|
          | **상황** | 무엇을 하는 시스템이고 무엇이 문제였나 | 20초 |
          | **과제** | 그중 **내가** 맡은 것은 무엇인가 | 20초 |
          | **한 일** | 무엇을 어떻게 했나 | 60초 |
          | **결과** | 무엇이 달라졌나 | 20초 |

          비율이 핵심이다. **한 일이 절반**이어야 한다. 대부분은 상황 설명에 1분을 쓰고
          정작 한 일은 한 문장으로 끝낸다.

          그리고 **상황은 듣는 사람이 모르는 것만** 말한다.
          "주문 시스템입니다"는 필요하지만 "이커머스는 주문이 중요합니다"는 필요 없다.
        example:
          language: text
          code: |-
            [순서 없는 설명]
            "주문 시스템을 했는데요, 요즘 이커머스가 워낙 많고 주문이 제일 중요하잖아요.
             근데 좀 느렸어요. 그래서 여러 가지를 봤는데 쿼리도 보고 인덱스도 보고...
             아무튼 좀 빨라졌습니다."

            [순서가 있는 설명]
            상황 — 주문 500만 건짜리 마이페이지가 평균 2초 걸렸습니다.
                   사용자 문의가 주에 서너 건 들어오고 있었습니다.
            과제 — 제가 그 목록 조회 한 곳을 맡아 원인을 찾고 고치기로 했습니다.
            한 일 — 느린 질의 로그를 켜서 시간 × 횟수로 후보를 추렸고,
                   EXPLAIN ANALYZE에서 조건이 Index Cond가 아니라 Filter에 있는 것을 봤습니다.
                   (member_id, created_at DESC) 복합 인덱스를 만들어 정렬 단계까지 없앴습니다.
                   쓰기가 느려질 수 있어 인덱스는 하나만 추가했습니다.
            결과 — 평균 2초에서 90밀리초가 됐고 관련 문의가 끊겼습니다.
          output: |-
            읽는 데 걸리는 시간
            순서 없는 설명   28초  — 듣고 나서 "무엇을 했는지" 말할 수 없다
            순서가 있는 설명 105초 — 네 가지를 각각 말할 수 있다
          note: |-
            - 아래 설명에는 **내가 한 일이 세 문장**이다. 위에는 없다
            - 상황에 숫자가 있다(500만, 2초, 주 서너 건) — 듣는 사람이 크기를 잡는다
            - '"여러 가지를 봤는데"가 사라지고 **무엇을 어떤 순서로** 봤는지가 남았다'
            - 마지막에 감수한 것("쓰기가 느려질 수 있어")이 한 줄 있다
        predict:
          question: 상황에서 숫자(500만 건, 2초)를 빼면 듣는 사람은 무엇을 못 하게 되나?
          choices:
            - 그 문제가 얼마나 큰 일인지 판단하지 못한다
            - 내가 무엇을 했는지 모른다
            - 결과를 모른다
            - 아무 차이 없다
          answer: 그 문제가 얼마나 큰 일인지 판단하지 못한다
          explanation: |-
            "느렸습니다"는 1초인지 30초인지, 10건인지 500만 건인지 알려 주지 않는다.
            **크기를 모르면 한 일이 대단한지 사소한지도 판단할 수 없다.**
            숫자는 자랑이 아니라 듣는 사람이 판단할 재료다.
        complete:
          question: 네 토막의 순서를 채우세요.
          code: |-
            ___ — 무엇을 하는 시스템이고 무엇이 문제였나 (20초)
            과제 — 그중 내가 맡은 것 (20초)
            ___  — 무엇을 어떻게 했나 (60초, 전체의 절반)
            결과 — 무엇이 달라졌나 (20초)
          answers:
            - [상황]
            - [한 일, 행동]
          explanation: |-
            상황으로 열고 결과로 닫는다. 가운데의 **한 일이 가장 길어야** 한다.
            분량을 미리 정해 두면 말하면서 스스로 시간을 조절할 수 있다.
        problem:
          prompt: |-
            최근에 직접 고치거나 만든 것 하나를 골라 네 토막으로 쓰세요.

            - 상황·과제·한 일·결과 순서로 쓰고, 각 토막에 **초 단위 분량**을 적으세요
            - 상황과 결과에 **숫자를 하나씩** 넣으세요. 없으면 세어서 만드세요
            - 다 쓴 뒤 소리 내어 읽고 **실제 걸린 시간**을 재세요
            - 2분을 넘으면 어느 토막을 줄일지 정하고 줄인 뒤 다시 재세요
          deliverables:
            - 네 토막으로 쓴 설명문과 토막별 분량
            - 소리 내어 읽은 실제 시간 (줄이기 전 / 후)
            - 무엇을 줄였고 왜 그것을 줄였는지
          hints:
            - 숫자가 없다고 느껴지면 건수·시간·파일 수·호출 수 중 셀 수 있는 것을 찾아보세요.
            - 2분을 넘으면 거의 언제나 상황이 깁니다.
            - 줄일 때는 듣는 사람이 이미 아는 것부터 지웁니다.
          modelAnswer: |-
            ```text
            상황(20초) — 사내 배치 작업이 매일 새벽에 도는데, 주 1회쯤 실패하고
                        다음 날 아침에야 알았습니다. 복구에 매번 한 시간쯤 걸렸습니다.
            과제(15초) — 실패를 당일에 알아채게 만드는 일을 제가 맡았습니다.
            한 일(60초) — 먼저 최근 3개월 실패 12건의 로그를 모아 원인을 나눴습니다.
                        9건이 외부 파일이 안 올라온 경우였고 3건이 DB 시간 초과였습니다.
                        둘의 대응이 달라서, 실패를 한 덩어리로 알리지 않고
                        원인 구분이 담긴 코드를 함께 남기도록 고쳤습니다.
                        그 코드로 알림을 나눠 보내게 했습니다.
            결과(20초) — 평균 인지 시간이 9시간에서 5분이 됐고,
                        복구 시간도 한 시간에서 15분으로 줄었습니다.
            ```

            줄이기 전 2분 40초였고, **상황에서 배치가 무엇을 하는지 설명하던 40초**를 지웠다.
            듣는 사람이 같은 팀이라 이미 아는 내용이었다.
            한 일은 줄이지 않았다 — 거기가 이 설명의 본문이다.
          selfChecks:
            - 네 토막이 모두 있는가
            - 한 일이 전체의 절반쯤인가
            - 상황과 결과에 숫자가 있는가
            - 소리 내어 읽어 2분 안에 끝나는가
      - key: LESSON.EXPLANATION.PROJECT_STORY.001.U2
        title: 고친 일도 이야기가 된다
        minutes: 12
        core: true
        explain: |-
          "저는 새로 만든 게 없어서 할 말이 없어요." 자주 나오는 말인데,
          대부분 **사실이 아니라 관점의 문제**다.

          고치는 일은 결정의 연속이다. 고칠 때마다 이런 것을 정했다.

          | 고칠 때 정한 것 | 이야기가 되는 형태 |
          |---|---|
          | 어디가 원인인지 좁혔다 | 무엇을 보고 어떻게 좁혔나 |
          | 어느 층에서 고칠지 골랐다 | 왜 거기였나, 다른 자리는 왜 아니었나 |
          | 급한 조치와 근본 조치를 나눴다 | 무엇을 먼저 했고 무엇을 남겼나 |
          | 건드리지 않기로 한 것이 있다 | 왜 그대로 두었나 |

          마지막 줄이 특히 값지다. **건드리지 않기로 한 판단**은
          그 시스템을 아는 사람만 할 수 있다.

          핵심은 "무엇을 만들었나"가 아니라 **"무엇을 알아냈고 무엇을 정했나"** 로
          질문을 바꾸는 것이다. 새로 만든 사람도 결국 그 질문에 답한다.
        example:
          language: text
          code: |-
            [할 말이 없다고 느끼는 형태]
            "기존 시스템 유지보수했습니다. 요청 오면 고치고 커스텀 넣고 그랬습니다."

            [같은 일을 결정으로 바꾼 형태]
            상황 — 10년 된 정산 배치가 월말마다 3시간씩 돌았고,
                   고객사마다 예외 처리가 조건문으로 쌓여 200줄이 넘었습니다.
            과제 — 새 고객사를 붙이면서 그 조건문을 더 늘리지 않는 것이 제 몫이었습니다.
            한 일 — 전체를 다시 쓰는 방법도 있었지만, 다른 고객사 정산에 영향을 주는
                   위험이 커서 하지 않기로 했습니다. 대신 새로 붙는 부분만
                   고객사별 규칙을 따로 두고 기존 조건문은 그대로 뒀습니다.
                   기존 고객사 12곳의 정산 결과가 바뀌지 않는지 이전 3개월치로 대조했습니다.
            결과 — 새 고객사가 조건문을 한 줄도 늘리지 않고 붙었고,
                   대조에서 기존 12곳 결과가 모두 같았습니다.
          output: |-
            두 설명이 말하는 사실은 같다. 다른 것은 무엇을 꺼냈는가다.

            앞 설명이 꺼낸 것   — 역할 이름
            뒤 설명이 꺼낸 것   — 판단 3개(다시 쓰지 않기로 함, 새 부분만 분리,
                                 결과 대조로 검증), 숫자 3개(200줄, 12곳, 3개월)
          note: |-
            - **하지 않기로 한 것**이 먼저 나온다 — "전체를 다시 쓰지 않기로 했습니다"
            - 그 이유가 붙어 있다. 이유 없는 결정은 설명이 아니다
            - 검증 방법이 있다("이전 3개월치로 대조") — 믿을 근거가 생긴다
            - 새로 만든 것은 없지만 **정한 것은 셋**이다
        predict:
          question: '"전체를 다시 쓰지 않기로 했습니다"에서 이유를 빼면 어떻게 들리나?'
          choices:
            - 할 줄 몰라서 안 한 것처럼 들린다
            - 더 겸손하게 들린다
            - 차이가 없다
            - 더 전문적으로 들린다
          answer: 할 줄 몰라서 안 한 것처럼 들린다
          explanation: |-
            **하지 않은 일은 이유와 함께여야 판단이 된다.** 이유가 없으면 회피로 읽힌다.
            반대로 "다른 고객사에 영향을 주는 위험이 커서"가 붙으면
            그 시스템을 알고 위험을 잰 사람으로 읽힌다.
        complete:
          question: 고친 일을 결정의 형태로 바꾸는 질문을 채우세요.
          code: |-
            무엇을 만들었나  →  무엇을 ___고 무엇을 정했나
            그냥 고쳤다     →  어디가 원인인지 어떻게 ___나
            시키는 대로 했다 →  건드리지 않기로 한 것은 무엇이고 왜인가
          answers:
            - [알아냈, 알아냈나]
            - [좁혔]
          explanation: |-
            질문을 바꾸면 같은 경험에서 다른 것이 나온다.
            **알아낸 것**과 **정한 것**은 고치는 일에도 반드시 있다.
        problem:
          prompt: |-
            "새로 만든 것이 없다"고 느끼는 경험 하나를 골라 결정의 형태로 다시 쓰세요.

            - 그 일에서 **정했던 것 세 가지**를 찾아 적으세요
              (원인을 좁힌 방법 / 고칠 자리를 고른 이유 / 건드리지 않기로 한 것)
            - 셋 중 하나에는 **하지 않기로 한 판단**이 들어가야 합니다
            - 네 토막 형태로 다시 쓰고, 검증 방법을 한 문장 넣으세요
            - 다시 쓰기 전과 후를 나란히 두고 **무엇이 새로 드러났는지** 적으세요
          deliverables:
            - 정했던 것 세 가지
            - 네 토막으로 다시 쓴 설명문
            - 전후 비교와 새로 드러난 것
          hints:
            - 고치면서 "이건 안 건드리는 게 낫겠다"고 생각한 순간이 있었을 겁니다.
            - 원인을 어떻게 찾았는지가 곧 한 일입니다. 로그를 봤다면 무엇을 보고 좁혔나요?
            - 검증은 거창하지 않아도 됩니다. 무엇을 보고 "됐다"고 판단했나요?
          modelAnswer: |-
            정했던 것 세 가지 —
            **① 원인을 좁힌 방법**: 실패 로그 12건을 모아 원인별로 나눴다.
            **② 고칠 자리**: 배치 본문이 아니라 알림 쪽을 골랐다. 본문은 다른 팀도 쓰고 있었다.
            **③ 하지 않기로 한 것**: 실패 시 자동 재시도를 넣지 않았다 —
            파일이 안 올라온 경우에는 재시도가 소용없고, 오히려 알림만 늘어난다.

            ```text
            상황 — 배치가 주 1회 실패했고 다음 날 아침에야 알았습니다.
            과제 — 당일에 알아채게 만드는 일을 맡았습니다.
            한 일 — 실패 12건을 원인별로 나누니 9건은 외부 파일 누락, 3건은 DB 시간 초과였습니다.
                   두 경우의 대응이 달라서 하나로 알리면 소용이 없다고 봤습니다.
                   배치 본문은 다른 팀도 쓰고 있어 건드리지 않고 알림 쪽만 고쳤습니다.
                   자동 재시도도 검토했지만 파일 누락에는 소용이 없어 넣지 않았습니다.
                   고친 뒤 지난 실패 12건을 같은 입력으로 재현해 알림이 갈리는지 확인했습니다.
            결과 — 인지 시간이 9시간에서 5분이 됐습니다.
            ```

            새로 드러난 것은 **판단이 세 번 있었다는 사실**이다.
            다시 쓰기 전에는 "알림 고쳤습니다" 한 줄이었다.
          selfChecks:
            - 정한 것을 세 가지 찾았는가
            - 하지 않기로 한 판단이 이유와 함께 들어갔는가
            - 검증 방법이 한 문장이라도 있는가
            - 다시 쓴 쪽이 실제로 더 많은 것을 말하는가
      - key: LESSON.EXPLANATION.PROJECT_STORY.001.U3
        title: 내가 한 것과 팀이 한 것을 가르기
        minutes: 10
        core: false
        explain: |-
          혼자 만든 것은 거의 없다. 그래서 설명할 때 두 가지 실수가 나온다.

          **하나, 전부 "우리"로 말한다.** 듣는 사람은 당신이 무엇을 했는지 끝내 모른다.
          **둘, 전부 "제가"로 말한다.** 한 번만 파 보면 드러나고, 그때 나머지 말까지 의심받는다.

          정직하면서 분명한 방법이 있다 — **범위를 먼저 말하고 그 안에서 내 몫을 말한다.**

          ```text
          "팀은 넷이었고 결제 연동 전체를 맡았습니다.
           그중 저는 실패 처리와 재시도를 맡았습니다."
          ```

          그다음부터는 **"제가"로 말해도 된다.** 범위를 그어 뒀기 때문이다.

          협업 자체도 내용이 된다. 남의 설계를 읽고 지적한 것, 리뷰에서 바꾼 것,
          다른 팀과 맞춘 규격 — 이런 것은 혼자서는 만들 수 없는 경험이다.
        example:
          language: text
          code: |-
            [전부 우리]
            "저희 팀이 결제 시스템을 만들었고 안정성을 많이 개선했습니다."
            → 무엇을 했는지 하나도 알 수 없다

            [전부 제가]
            "제가 결제 시스템을 만들었고 장애를 없앴습니다."
            → "결제 승인 쪽 타임아웃은 어떻게 잡으셨어요?" 한 번에 무너진다

            [범위를 긋고 내 몫을 말한다]
            "팀은 넷이었고 결제 연동 전체를 맡았습니다.
             그중 저는 실패 처리와 재시도를 맡았습니다.
             재시도해도 되는 응답과 안 되는 응답을 나누는 기준을 정했고,
             멱등 키를 재시도 전체에서 같게 유지하도록 클라이언트를 고쳤습니다.
             승인 로직은 다른 분이 맡아서, 저는 그쪽 실패 코드를 받아 쓰는 쪽이었습니다."
          output: |-
            세 번째 설명이 주는 것

            범위     팀 4명 / 결제 연동 / 내 몫은 실패 처리와 재시도
            한 일    기준 정하기, 멱등 키 유지
            경계     승인 로직은 내 것이 아님을 먼저 말함
          note: |-
            - 범위를 먼저 그었기 때문에 그 뒤의 "제가"가 과장이 아니다
            - 마지막 줄이 **내가 안 한 것을 먼저 말한다** — 파고들어도 무너지지 않는다
            - 안 한 것을 말해도 한 일이 줄어 보이지 않는다. 오히려 경계가 또렷해진다
            - '"안정성을 많이 개선"처럼 크지만 빈 말이 사라졌다'
        predict:
          question: 내가 안 한 부분을 미리 말하면 어떤 효과가 있나?
          choices:
            - 나머지 말의 신뢰가 올라간다
            - 한 일이 적어 보인다
            - 말이 길어지기만 한다
            - 듣는 사람이 혼란스러워한다
          answer: 나머지 말의 신뢰가 올라간다
          explanation: |-
            경계를 스스로 그은 사람은 **그 안에서 한 말도 정확할 것**으로 읽힌다.
            반대로 경계가 없으면 듣는 사람이 직접 찾아 봐야 하고,
            한 군데라도 어긋나면 전체를 의심하게 된다.
        complete:
          question: 범위를 긋는 두 문장을 채우세요.
          code: |-
            "팀은 넷이었고 결제 연동 전체를 맡았습니다."       ← 팀의 ___
            "그중 저는 실패 처리와 재시도를 맡았습니다."        ← 내 ___
            "승인 로직은 다른 분이 맡았습니다."                ← 내가 안 한 것
          answers:
            - [범위]
            - [몫, 범위, 담당]
          explanation: |-
            팀의 범위 → 내 몫 → 내가 안 한 것. 세 문장이면 경계가 선다.
            그 뒤로는 자세히 말해도 과장으로 읽히지 않는다.
        problem:
          prompt: |-
            여럿이 함께한 일 하나를 골라 경계를 그어 설명하세요.

            - 팀의 범위 / 내 몫 / 내가 안 한 것을 각각 한 문장으로 쓰세요
            - 내 몫 안에서 한 일을 세 문장으로 쓰세요
            - **협업에서 얻은 것** 하나를 적으세요
              (남의 설계에서 지적한 것, 리뷰에서 바꾼 것, 다른 팀과 맞춘 규격 중 하나)
            - 누가 "그 부분은 어떻게 하셨어요?"라고 물었을 때
              **내가 안 한 부분에 대해 뭐라고 답할지**도 미리 적어 두세요
          deliverables:
            - 경계 세 문장과 내 몫 세 문장
            - 협업에서 얻은 것 하나
            - 내가 안 한 부분을 물었을 때의 답
          hints:
            - 내가 안 한 것을 먼저 정하면 내 몫이 또렷해집니다.
            - 협업에서 얻은 것은 혼자서는 만들 수 없는 경험입니다.
            - 모르는 것을 물으면 "그건 제가 맡지 않아서 자세히는 모릅니다"로 시작해도 됩니다.
          modelAnswer: |-
            ```text
            팀 범위   — 넷이서 주문·결제 연동 전체를 맡았습니다.
            내 몫     — 저는 결제 실패 처리와 재시도를 맡았습니다.
            안 한 것  — 승인 로직과 정산 대사는 다른 두 분이 맡았습니다.

            한 일 1 — 응답을 재시도해도 되는 것과 안 되는 것으로 나눴습니다.
                     잔액 부족은 다시 보내도 같아서 뺐습니다.
            한 일 2 — 재시도할 때마다 멱등 키가 새로 만들어지고 있어서
                     시도 전체에서 같은 키를 쓰도록 고쳤습니다.
            한 일 3 — 상한을 넘겨 결과를 모르는 경우를 실패로 단정하지 않고
                     확인이 필요한 상태로 두게 했습니다.

            협업에서 얻은 것 — 승인 쪽 실패 코드를 제가 받아 쓰는 구조여서
                     코드 목록을 같이 정했습니다. 상대가 나중에 코드를 추가할 때
                     제 쪽이 모르는 코드를 만나면 어떻게 할지도 그때 정해 뒀습니다.
            ```

            안 한 부분을 물으면 이렇게 답한다 —
            "승인 로직은 제가 맡지 않아서 자세히는 모릅니다.
            다만 실패 코드를 받아 쓰는 쪽이라 어떤 코드가 어떤 상황에서 오는지는 정리해 뒀습니다."

            **모른다고 말한 뒤 아는 만큼을 덧붙이는 것**이 핵심이다.
            모른다고만 하면 대화가 끊기고, 아는 척하면 무너진다.
          selfChecks:
            - 팀 범위·내 몫·안 한 것이 각각 한 문장으로 있는가
            - 내 몫 안의 일이 구체적인가
            - 협업에서 얻은 것이 혼자서는 못 얻는 종류인가
            - 모르는 것을 묻는 질문에 답할 문장을 준비했는가
    commonMistakes:
      - 상황 설명에 시간을 다 쓰고 한 일은 한 문장으로 끝낸다. 듣는 사람이 알고 싶은 곳이 비어 있다 (U1)
      - '"새로 만든 게 없어서 할 말이 없다"고 여긴다. 고칠 때마다 한 판단이 곧 이야기다 (U2)'
      - 전부 "우리"나 전부 "제가"로 말한다. 앞은 내 몫이 안 보이고 뒤는 한 번에 무너진다 (U3)
    inProject: |-
      주문 시스템을 만들면서 **그때그때 네 토막으로 적어 두는 것**이 이 노트의 쓰임이다.
      기억은 한 달이면 흐려지고, 나중에 몰아서 쓰면 숫자가 남아 있지 않다.
      막혔다가 풀릴 때마다 상황·과제·한 일·결과를 다섯 줄로 남겨 두면,
      5단계에 와서 고를 거리가 생긴다.
    sources:
      - title: Git — git-commit (커밋 본문에 무엇을 왜 바꿨는지 남긴다)
        url: https://git-scm.com/docs/git-commit
        versionScope: Git 2.x
      - title: Pro Git — Viewing the Commit History
        url: https://git-scm.com/book/en/v2/Git-Basics-Viewing-the-Commit-History
        versionScope: Pro Git 2nd Edition
    verifiedAt: 2026-09-25

  - key: LESSON.EXPLANATION.TECH_DECISION.001
    skillCode: EXPLANATION.TECH_DECISION
    title: 왜 그것을 골랐는지 말하기 (기술 선택)
    whyItMatters: |-
      "왜 그렇게 하셨어요?"에 "그게 일반적이라서요"라고 답하면 대화가 끝난다.
      고른 이유를 말할 수 있다는 것은 **다른 것도 봤다는 뜻**이고,
      그것이 시키는 대로 한 사람과 정한 사람을 가른다.
      리뷰에서, 설계 논의에서, 새 팀에 합류해 기존 구조를 물을 때 매번 쓰인다.
    oneLine: 기술 선택 설명은 제약 → 대안 → 고른 것 → 감수한 단점 순서이고, 단점이 없으면 설명이 아니다.
    units:
      - key: LESSON.EXPLANATION.TECH_DECISION.001.U1
        title: 결정에는 대안이 있었다
        minutes: 12
        core: true
        explain: |-
          선택을 설명한다는 것은 **고르지 않은 것을 함께 말한다**는 뜻이다.
          대안이 없으면 그것은 선택이 아니라 기본값이다.

          네 토막으로 쓴다.

          | 토막 | 답할 것 |
          |---|---|
          | **제약** | 무엇이 정해져 있었나 (기한, 인원, 기존 시스템, 운영 환경) |
          | **대안** | 어떤 것들을 놓고 봤나 |
          | **고른 것** | 무엇을 골랐고 **어떤 제약 때문에** 그것이었나 |
          | **감수한 것** | 그 선택의 단점과 그것을 어떻게 다루기로 했나 |

          제약이 먼저인 이유가 있다. **같은 문제라도 제약이 다르면 답이 다르다.**
          제약을 말하지 않으면 듣는 사람은 교과서 답과 비교하게 되고,
          교과서 답은 언제나 우리 답보다 좋아 보인다.

          대안은 두세 개면 충분하다. 중요한 것은 개수가 아니라
          **각 대안이 어느 제약에서 걸렸는지**다.
        example:
          language: text
          code: |-
            [이유가 없는 설명]
            "재시도는 그냥 지수 백오프로 했습니다. 보통 그렇게 하니까요."

            [제약부터 말하는 설명]
            제약 —   결제 서버가 가끔 느려지는데 우리가 고칠 수 없고,
                    중복 결제는 절대 나면 안 됩니다. 운영 인력이 따로 없어
                    사람이 개입하는 절차는 만들 수 없었습니다.
            대안 —   (1) 실패하면 그냥 포기하고 사용자에게 다시 누르게 한다
                    (2) 서버가 자동 재시도한다
                    (3) 큐에 넣고 나중에 처리한다
            고른 것 — (2)입니다. (1)은 사용자가 두 번 눌러 중복이 나기 쉽고,
                    (3)은 큐를 새로 도입해야 하는데 운영할 사람이 없었습니다.
            감수한 것 — 재시도하는 동안 응답이 최대 8초까지 늘어납니다.
                    대신 상한을 4회로 두고, 넘으면 결과를 모르는 상태로 남겨
                    다음 조회에서 확정하게 했습니다.
          output: |-
            두 설명의 차이

            앞  — 고른 것 1개
            뒤  — 제약 3개, 대안 3개, 각 대안이 걸린 제약, 감수한 단점과 그 대응
          note: |-
            - 제약에 **"우리가 고칠 수 없고"** 가 있다. 이것이 대안을 절반 잘라 낸다
            - 대안 (3)이 기술이 나빠서가 아니라 **운영할 사람이 없어서** 빠졌다
            - 감수한 단점이 숫자로 있다(8초) — 막연한 "조금 느려집니다"가 아니다
            - 단점을 말하고 끝내지 않고 **어떻게 다루기로 했는지**까지 있다
        predict:
          question: 제약을 빼고 대안 비교만 말하면 어떻게 들리나?
          choices:
            - 왜 그 선택이 최선인지 판단할 근거가 없어진다
            - 더 간결해서 좋다
            - 대안이 많아 보인다
            - 차이가 없다
          answer: 왜 그 선택이 최선인지 판단할 근거가 없어진다
          explanation: |-
            대안을 거르는 것은 **제약**이다. 제약이 없으면 "큐가 더 좋은데 왜 안 했지"가 된다.
            "운영할 사람이 없었다"가 있어야 그 선택이 상황에 맞는 판단으로 읽힌다.
            제약은 변명이 아니라 **답을 정하는 조건**이다.
        complete:
          question: 기술 선택 설명의 네 토막을 채우세요.
          code: |-
            ___    — 무엇이 정해져 있었나 (기한·인원·기존 시스템·운영 환경)
            대안    — 어떤 것들을 놓고 봤나
            고른 것 — 무엇을 골랐고 어느 제약 때문이었나
            ___    — 그 선택의 단점과 그것을 어떻게 다루기로 했나
          answers:
            - [제약]
            - [감수한 것, 감수한 단점, 단점]
          explanation: |-
            제약으로 열고 감수한 것으로 닫는다.
            **가운데 둘만 말하면 교과서 답과 비교당하고, 양 끝이 있어야 우리 판단이 된다.**
        problem:
          prompt: |-
            내가 내렸거나 팀이 내린 기술 선택 하나를 골라 네 토막으로 쓰세요.
            작은 것이어도 됩니다 — 라이브러리 하나, 테이블 구조, 예외를 어디서 잡을지.

            - 제약을 **세 가지 이상** 적으세요. 기술이 아닌 제약(기한·인원·운영)을 하나 이상 넣으세요
            - 대안을 두 개 이상 적고, 각각 **어느 제약에서 걸렸는지** 짝지으세요
            - 감수한 단점을 적고, 그것을 **어떻게 다루기로 했는지**까지 쓰세요
            - 제약이 하나 바뀌면 답이 달라지는지 확인해 보세요 (예: 운영 인력이 있었다면?)
          deliverables:
            - 네 토막으로 쓴 설명문
            - 대안과 걸린 제약의 짝
            - 제약 하나를 바꿨을 때 답이 달라지는지
          hints:
            - 제약이 안 떠오르면 "그때 안 됐던 것"을 떠올려 보세요.
            - 대안이 하나도 없었다면 그것은 선택이 아니라 기본값입니다. 왜 기본값을 썼는지가 이야기입니다.
            - 단점이 없는 선택은 없습니다. 무엇을 포기했는지 찾아보세요.
          modelAnswer: |-
            ```text
            제약 — ① 기존 정산 배치를 다른 팀 3곳이 함께 쓰고 있어 본문을 못 고칩니다.
                  ② 새 고객사 오픈이 3주 뒤로 정해져 있었습니다.
                  ③ 배치 담당 인력이 저 혼자였습니다.

            대안 — (1) 배치 본문을 고객사별로 분기하게 리팩터링한다
                        → 제약 ①에서 걸림. 다른 팀 정산이 바뀔 위험
                  (2) 새 고객사만 별도 배치로 분리한다
                        → 제약 ③에서 걸림. 배치가 둘이 되면 혼자 운영이 어려움
                  (3) 본문은 그대로 두고 규칙만 밖에서 주입한다

            고른 것 — (3)입니다. 기존 동작을 안 건드리면서(①) 3주 안에 되고(②)
                     운영 대상도 하나로 유지됩니다(③).

            감수한 것 — 규칙이 코드와 설정 두 곳에 나뉘어 읽기 어려워집니다.
                     대신 규칙 파일에 주석으로 어느 고객사용인지 남기고,
                     기존 12곳 결과를 3개월치로 대조하는 검증을 붙였습니다.
            ```

            제약 ③(혼자)이 없었다면 **(2)가 나았을 것**이다.
            배치가 둘이면 서로 영향이 없어 더 안전하다.
            즉 이 선택은 기술적 우열이 아니라 **인력 제약이 정한 답**이다.
            그렇게 말할 수 있으면 "더 좋은 방법 있지 않나요"에 흔들리지 않는다.
          selfChecks:
            - 기술이 아닌 제약을 하나 이상 넣었는가
            - 각 대안이 어느 제약에서 걸렸는지 짝지었는가
            - 감수한 단점과 그 대응이 함께 있는가
            - 제약이 바뀌면 답이 달라지는지 확인했는가
      - key: LESSON.EXPLANATION.TECH_DECISION.001.U2
        title: 단점을 먼저 말한다
        minutes: 10
        core: true
        explain: |-
          설명에서 가장 신뢰를 얻는 자리는 **단점을 말하는 대목**이다.
          그런데 대부분은 단점을 숨기거나, 물어봤을 때 처음 생각한다.

          이유는 간단하다. **단점을 아는 사람만 그것을 다룰 수 있기** 때문이다.
          단점을 말하지 않으면 두 가지 중 하나로 읽힌다 — 모르거나, 숨기거나.

          좋은 형태는 셋이 붙어 있다.

          ```text
          "이 선택은 <단점>이 있습니다.
           <조건>에서는 문제가 되는데,
           그래서 <대응>을 해 뒀습니다."
          ```

          여기서 **조건**이 중요하다. "느려질 수 있습니다"는 빈 말이지만
          "건수가 10만을 넘으면 메모리에서 정렬하게 돼서 느려집니다"는 경계를 아는 말이다.

          대응은 완벽하지 않아도 된다. **"지금은 안 하기로 했고 언제 할지 정해 뒀다"**
          도 훌륭한 대응이다.
        example:
          language: text
          code: |-
            [단점을 숨긴 설명]
            "복합 인덱스를 추가해서 조회가 2초에서 90밀리초가 됐습니다."

            [물어봐서 나온 대답]
            Q: "쓰기는요?"
            A: "아... 그건 확인 안 해 봤습니다."

            [단점을 먼저 말한 설명]
            "복합 인덱스를 추가해 조회가 2초에서 90밀리초가 됐습니다.
             대신 주문을 넣을 때마다 인덱스도 갱신해야 해서 쓰기가 느려집니다.
             주문 INSERT가 초당 20건 수준이라 지금은 영향이 없다고 봤고,
             실제로 추가 전후 INSERT 평균이 3.1ms에서 3.4ms였습니다.
             초당 수백 건이 되면 다시 봐야 합니다."
          output: |-
            세 번째 설명이 담은 것

            단점    쓰기가 느려진다
            숫자    3.1ms → 3.4ms
            조건    초당 20건에서는 괜찮고, 수백 건이면 다시 봐야 한다
            근거    추가 전후를 직접 쟀다
          note: |-
            - 단점을 **묻기 전에** 말했다. 같은 내용인데 읽히는 것이 완전히 다르다
            - 숫자가 단점 쪽에도 있다(3.1 → 3.4) — 재 봤다는 증거다
            - **언제 문제가 되는지 경계**를 말했다. 그 경계가 곧 다음 할 일이다
            - '"지금은 영향이 없다고 봤고"가 판단이다. 측정 없이 괜찮다고 한 것이 아니다'
        predict:
          question: '"쓰기가 조금 느려집니다"처럼 숫자와 조건 없이 말하면?'
          choices:
            - 단점을 말했지만 다룰 수 있다는 근거는 없다
            - 충분히 정직한 설명이다
            - 숫자보다 더 겸손하다
            - 듣는 사람이 안심한다
          answer: 단점을 말했지만 다룰 수 있다는 근거는 없다
          explanation: |-
            "조금"은 재 보지 않았다는 뜻으로 읽힌다.
            단점을 **아는 것**과 **재 본 것**은 다르고, 신뢰는 후자에서 온다.
            숫자가 없으면 최소한 **언제부터 문제가 되는지 조건**이라도 말한다.
        complete:
          question: 단점을 말하는 세 토막을 채우세요.
          code: |-
            이 선택은 쓰기가 느려지는 ___이 있습니다.
            주문이 초당 수백 건이 되면 문제가 되는데,      ← ___
            지금은 20건 수준이라 두고 보기로 했습니다.      ← 대응
          answers:
            - [단점]
            - [조건, 경계]
          explanation: |-
            단점 → 조건 → 대응. **조건이 빠지면 "느려집니다"만 남아 아무 정보가 없다.**
            "지금은 두고 보기로 했다"도 조건이 분명하면 훌륭한 대응이다.
        problem:
          prompt: |-
            앞 단위에서 쓴 기술 선택으로 돌아가 **단점 쪽을 다시 쓰세요.**

            - 그 선택의 단점을 **두 가지** 찾으세요 (하나는 지금 당장, 하나는 나중에)
            - 각 단점에 **언제 문제가 되는지 조건**을 붙이세요
            - 조건에 숫자를 넣으세요. 모르면 **어떻게 재면 되는지**를 적으세요
            - 각 단점을 지금 다루기로 했는지, 두고 보기로 했는지 정하고 이유를 쓰세요
          deliverables:
            - 단점 두 가지와 각각의 조건
            - 조건의 숫자 또는 재는 방법
            - 지금 다룰지 두고 볼지의 판단과 이유
          hints:
            - 지금 당장의 단점은 대개 복잡도이고, 나중의 단점은 대개 규모입니다.
            - '"언제부터 문제가 되나"를 물으면 조건이 나옵니다.'
            - 재는 방법을 적어 두면 나중에 그것이 그대로 할 일이 됩니다.
          modelAnswer: |-
            ```text
            단점 1 (지금) — 규칙이 코드와 설정 두 곳에 나뉘어, 새로 오는 사람이
                          한 곳만 보고 전체를 파악할 수 없습니다.
              조건 — 규칙 파일이 5개를 넘어가면 어느 것이 적용되는지 추적이 어려워집니다.
                    지금은 2개입니다.
              판단 — 지금은 두고 봅니다. 대신 규칙 파일 맨 위에 적용 대상을 주석으로 남겼고,
                    3개째가 생길 때 목록 문서를 만들기로 했습니다.

            단점 2 (나중) — 고객사가 늘수록 규칙 파일도 늘어 배포 대상이 많아집니다.
              조건 — 고객사 20곳을 넘으면 파일 관리가 배포 실수의 원인이 됩니다.
                    지금은 13곳입니다.
              재는 방법 — 배포 때 적용된 규칙 파일 수와 실패 건수를 같이 남기면
                        상관이 보입니다. 지금은 남기지 않고 있습니다.
              판단 — 지금은 안 합니다. 20곳이 되기 전에 규칙을 DB로 옮길지 결정하기로 했습니다.
            ```

            둘 다 **"지금은 안 한다"** 인데, 조건과 다음 판단 시점이 붙어 있어
            미루기가 아니라 계획으로 읽힌다.
            숫자를 모르는 쪽(단점 2)은 **재는 방법을 적어** 두었고, 그것이 다음 할 일이 된다.
          selfChecks:
            - 단점을 두 가지 찾았는가
            - 각각에 언제 문제가 되는지 조건이 있는가
            - 숫자가 없는 곳에는 재는 방법을 적었는가
            - '"지금은 안 한다"에 다음 판단 시점이 붙어 있는가'
      - key: LESSON.EXPLANATION.TECH_DECISION.001.U3
        title: 결정을 코드 옆에 남기기
        minutes: 12
        core: true
        explain: |-
          말로 한 설명은 사라진다. 석 달 뒤 그 코드를 보는 사람(대개 나 자신)은
          **무엇을 했는지는 코드에서 읽지만 왜 그랬는지는 읽을 수 없다.**

          그래서 결정은 코드 옆에 남긴다. 자리가 셋이다.

          | 자리 | 남길 것 | 수명 |
          |---|---|---|
          | **커밋 본문** | 이 변경을 왜 했나 | 영구 (기록에 남는다) |
          | **코드 주석** | 이 줄이 왜 이렇게인가 | 그 코드가 사는 동안 |
          | **결정 문서** | 되돌리기 어려운 선택 | 프로젝트가 사는 동안 |

          커밋 메시지에는 관례가 있다 — **제목 한 줄, 빈 줄, 본문.**
          제목은 무엇을 했는지, 본문은 **왜**다.
          `git log`가 제목만 보여 주는 도구가 많아서 이 형식이 생겼다.

          주석에 적을 것은 **코드가 말하지 못하는 것**뿐이다.
          `// 수량을 1 더한다` 는 코드가 이미 말한다.
          `// 재시도해도 되는 응답만 여기 넣는다. 잔액 부족은 다시 보내도 같다` 는 코드가 못 한다.
        example:
          language: text
          code: |-
            [왜가 없는 커밋]
            git commit -m "인덱스 추가"

            [왜가 있는 커밋]
            git commit -F - <<'EOF'
            perf(order): 마이페이지 목록에 복합 인덱스를 추가한다

            주문 500만 건에서 목록 조회가 평균 2초였다. EXPLAIN ANALYZE에서
            member_id와 status가 Index Cond가 아니라 Filter에 있었고,
            499만 행을 읽고 버리고 있었다.

            (member_id, status, created_at DESC) 순서로 만들었다.
            등호 조건을 앞에, 범위 겸 정렬 컬럼을 뒤에 두어 Sort 단계도 없앴다.

            쓰기 비용은 INSERT 평균 3.1ms -> 3.4ms로 쟀다. 지금 초당 20건
            수준이라 감수한다. 수백 건이 되면 다시 본다.
            EOF
          output: |-
            석 달 뒤 git log -1 로 이 커밋을 볼 때 알 수 있는 것

            무엇을     복합 인덱스 추가
            왜         2초 걸렸고 조건이 Filter에 있었다
            왜 그 순서 등호 앞, 범위·정렬 뒤
            대가       쓰기 3.1 -> 3.4ms, 초당 20건에서는 감수
            언제 다시  초당 수백 건이 되면
          note: |-
            - 제목 한 줄 뒤에 **빈 줄**이 있다. 이 형식을 도구들이 전제한다
            - 본문이 **왜**로 채워져 있다. 무엇을 했는지는 diff가 이미 말한다
            - 컬럼 순서를 그렇게 정한 이유까지 있다 — 나중에 바꾸려는 사람이 읽을 것이다
            - 마지막 줄이 **다시 볼 조건**이다. 미래의 나에게 남기는 알림이다
        predict:
          question: 커밋 제목과 본문 사이의 빈 줄을 빼면 어떻게 되나?
          choices:
            - 많은 도구가 전체를 제목으로 읽어 로그가 뭉개진다
            - 아무 차이 없다
            - 커밋이 실패한다
            - 본문이 사라진다
          answer: 많은 도구가 전체를 제목으로 읽어 로그가 뭉개진다
          explanation: |-
            Git은 **첫 빈 줄까지를 제목**으로 본다. 빈 줄이 없으면 본문 전체가 제목이 되어
            `git log --oneline`이 한 줄에 다 나오고 읽을 수 없게 된다.
            형식은 취향이 아니라 도구와의 약속이다.
        complete:
          question: 커밋 메시지의 구조를 채우세요.
          code: |-
            perf(order): 마이페이지 목록에 복합 인덱스를 추가한다   ← 제목: ___을 했나
                                                                  ← ___ 줄
            주문 500만 건에서 목록 조회가 평균 2초였다. ...         ← 본문: 왜 했나
          answers:
            - [무엇]
            - [빈]
          explanation: |-
            제목은 무엇, 본문은 왜. 사이에 빈 줄을 둔다.
            **무엇은 diff가 말해 주므로 본문에 또 쓰지 않는다.**
        problem:
          prompt: |-
            최근 커밋 다섯 개를 열어 보고, 그중 **석 달 뒤에 왜인지 알 수 없는 것**을 고르세요.

            - 다섯 개를 훑고 각각 "왜"가 남아 있는지 O/X로 표시하세요
            - X인 것 하나를 골라 **지금 아는 것으로 본문을 다시 쓰세요**
              (실제로 고치지는 말고 어떻게 썼어야 하는지를 적으세요)
            - 그 변경에 **코드 주석**이 필요한 줄이 있었는지도 보세요.
              있다면 무엇이라고 적었어야 하는지 쓰세요
            - 커밋 본문과 코드 주석 중 **무엇을 어디에 적을지 기준**을 한 줄로 정하세요
          deliverables:
            - 커밋 5개의 O/X 표
            - 다시 쓴 커밋 본문
            - 필요했던 코드 주석과 그 내용
            - 본문과 주석을 가르는 나만의 기준 한 줄
          hints:
            - 제목만 보고 "왜 이걸 했지?"가 떠오르면 X입니다.
            - 본문에 무엇을 했는지만 적혀 있어도 X입니다. diff가 이미 말합니다.
            - 주석은 그 줄을 보는 사람에게, 커밋 본문은 그 변경을 보는 사람에게 필요합니다.
          modelAnswer: |-
            ```text
            a1b2c3  fix: null 체크 추가                 X  ← 왜 null이 들어왔는지가 없다
            d4e5f6  feat: 주문 취소 API                  O  ← 본문에 상태 전이 규칙이 있다
            g7h8i9  chore: 의존성 정리                   X  ← 무엇을 왜 뺐는지 없다
            j1k2l3  refactor: 서비스 분리                X  ← 왜 나눴는지 없다
            m4n5o6  fix: 타임아웃 3초 -> 10초            X  ← 왜 10초인지가 없다
            ```

            `m4n5o6`을 다시 쓰면 —

            ```text
            fix(payment): 결제 호출 타임아웃을 10초로 늘린다

            결제사 응답이 P99에서 7.2초였는데 타임아웃이 3초라
            정상 응답을 우리가 먼저 끊고 있었다. 끊긴 뒤 재시도가 나가
            중복 결제 위험도 있었다.

            P99의 1.4배인 10초로 잡았다. 결제사 SLA는 15초라
            그 안이다. P99가 다시 올라가면 SLA까지가 상한이다.
            ```

            코드 주석이 필요했던 줄 —
            ```java
            // 결제사 P99 7.2초 기준. SLA 15초가 상한이다 (커밋 m4n5o6)
            private static final Duration PAYMENT_TIMEOUT = Duration.ofSeconds(10);
            ```

            기준 — **그 줄만 봐도 이상해 보이는 값에는 주석,
            변경의 배경과 잰 근거는 커밋 본문.** 주석에서 커밋을 가리키면 둘이 이어진다.
          selfChecks:
            - 커밋 5개를 실제로 열어 봤는가
            - 다시 쓴 본문이 무엇이 아니라 왜를 담고 있는가
            - 주석에 코드가 이미 말하는 것을 적지 않았는가
            - 본문과 주석을 가르는 기준을 한 줄로 말할 수 있는가
    commonMistakes:
      - 제약을 말하지 않고 대안 비교만 한다. 교과서 답과 비교당해 우리 판단이 안 보인다 (U1)
      - 단점을 물어봤을 때 처음 생각한다. 모르거나 숨기는 것으로 읽힌다 (U2)
      - 커밋 본문에 무엇을 했는지만 적는다. 그것은 diff가 이미 말한다 (U3)
    inProject: |-
      주문 시스템에서 되돌리기 어려운 선택을 할 때마다 네 토막으로 남긴다 —
      인덱스를 추가할 때, 트랜잭션 경계를 정할 때, 외부 호출을 커밋 뒤로 뺄 때.
      커밋 본문에 제약·대안·감수한 것을 적어 두면 그것이 그대로 5단계의 재료가 된다.
      나중에 몰아서 떠올리려 하면 숫자가 남아 있지 않다.
