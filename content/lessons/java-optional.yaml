# DevPilot 개념 노트 — 없을 수 있는 값 다루기
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 1단계(CRUD와 검증)에서 쓴다. JAVA.COLLECTION 노트를 먼저 본 것으로 전제한다
# - 지금 통용되는 정석(Optional은 반환 타입 전용, 경계에서 한 번만 막기)을 기준으로 쓴다
lessons:
  - key: LESSON.JAVA.OPTIONAL.001
    skillCode: JAVA.OPTIONAL
    title: 없을 수도 있다고 타입으로 말하기 (Optional)
    whyItMatters: |-
      `findByCode`가 돌려주는 것이 null일 수도 있는지, 서명만 봐서는 알 수 없다.
      그래서 부른 쪽은 불안해서 null 검사를 붙이거나, 안심하다가 NullPointerException을 만난다.
      주문 시스템의 조회 메서드 대부분이 "있을 수도 없을 수도" 있는데,
      그 사실을 타입에 적어 두면 컴파일러가 빠뜨림을 잡아 준다.
    oneLine: Optional은 값이 없을 수 있다는 사실을 반환 타입에 적어 두는 그릇이다.
    units:
      - key: LESSON.JAVA.OPTIONAL.001.U1
        title: null 대신 없음을 타입에 적기
        minutes: 10
        core: true
        explain: |-
          자바독은 `Optional`을 **"값이 있을 수도, 없을 수도 있는 컨테이너"** 라고 정의하고
          쓰임을 한 줄로 못 박아 두었다 —
          **"결과가 없을 수 있음을 분명히 해야 하는 메서드 반환 타입을 위한 것"**.

          차이는 서명에서 난다.

          ```java
          Product findByCode(String code);            // null일까? 알 수 없다
          Optional<Product> findByCode(String code);  // 없을 수 있다고 적혀 있다
          ```

          두 번째는 부른 쪽이 **없을 때를 다루지 않으면 컴파일이 안 된다.**
          `Optional<Product>`에서 `price()`를 바로 부를 수 없기 때문이다.

          만드는 방법은 세 가지다. `Optional.of(값)` — null이면 즉시 예외.
          `Optional.ofNullable(값)` — null이면 빈 것. `Optional.empty()` — 빈 것.
        example:
          language: java
          code: |-
            record Product(String code, int price) {}

            static final Map<String, Product> CATALOG =
                    Map.of("KB-01", new Product("KB-01", 39000));

            static Optional<Product> findByCode(String code) {
                return Optional.ofNullable(CATALOG.get(code));
            }

            Optional<Product> found = findByCode("KB-01");
            Optional<Product> missing = findByCode("NONE");

            System.out.println(found.isPresent());
            System.out.println(missing.isPresent());
            System.out.println(found);
            System.out.println(missing);
            System.out.println(Optional.ofNullable(null).isEmpty());
          output: |-
            true
            false
            Optional[Product[code=KB-01, price=39000]]
            Optional.empty
            true
          note: |-
            - `Map.get`은 없으면 null이다 — 그 null을 `ofNullable`로 감싸 경계에서 끊었다
            - 서명이 `Optional<Product>`라 부른 쪽이 없을 때를 **무시할 수 없다**
            - `toString`이 `Optional.empty`라 로그에서도 비었다는 것이 보인다
            - `Optional.of(null)`이었다면 그 자리에서 `NullPointerException`이 난다
        predict:
          question: '`Optional.ofNullable` 대신 `Optional.of(CATALOG.get(code))`로 바꾸면 `findByCode("NONE")`은?'
          choices:
            - NullPointerException이 난다
            - Optional.empty가 돌아온다
            - null이 돌아온다
            - 컴파일 오류가 난다
          answer: NullPointerException이 난다
          explanation: |-
            `Optional.of`는 **null을 허용하지 않는다.** 값이 반드시 있다고 확신할 때만 쓴다.
            없을 수 있는 값을 감쌀 때는 `ofNullable`이다.
            둘을 구분해 쓰면 "여기는 반드시 있다"는 의도가 코드에 남는다.
        complete:
          question: 회원 조회가 없을 수 있다는 것을 타입으로 드러내도록 빈칸을 채우세요.
          code: |-
            ___<Member> findById(long id) {
                Member member = members.get(id);
                return Optional.___(member);
            }
          answers:
            - [Optional]
            - [ofNullable]
          explanation: |-
            반환 타입을 `Optional<Member>`로 적으면 없을 수 있다는 사실이 서명에 남는다.
            안에서 다루는 값이 null일 수 있으므로 `ofNullable`로 감싼다.
        problem:
          prompt: |-
            주문 시스템의 쿠폰 저장소를 작성하세요.

            - `CouponRepository.findByCode(String code)` 는 쿠폰이 없을 수 있다
            - `findActiveByCode(String code)` 는 있고 **아직 쓰지 않은** 쿠폰만 돌려준다
            - 둘 다 없을 때를 타입으로 드러내세요
            - 이 서명을 `Coupon`으로 바꾸면 부른 쪽 코드가 어떻게 달라지는지 적으세요
          deliverables:
            - CouponRepository의 코드
            - 두 메서드를 부르는 쪽 코드 예시
            - 반환 타입을 Coupon으로 바꿨을 때 부른 쪽이 달라지는 점
          hints:
            - '"없을 수 있다"를 주석이 아니라 타입으로 적는 방법이 있습니다.'
            - 두 번째 메서드는 첫 번째 결과를 한 번 더 거릅니다. 처음부터 다시 찾을 필요가 없습니다.
            - 부른 쪽이 없을 때를 빠뜨리면 무엇이 막아 주나요? 컴파일러인가요, 실행 중인가요?
          modelAnswer: |-
            ```java
            public class CouponRepository {

                private final Map<String, Coupon> coupons = new HashMap<>();

                public Optional<Coupon> findByCode(String code) {
                    return Optional.ofNullable(coupons.get(code));
                }

                public Optional<Coupon> findActiveByCode(String code) {
                    return findByCode(code).filter(coupon -> !coupon.used());
                }
            }

            Optional<Coupon> coupon = repository.findActiveByCode("WELCOME10");
            int discount = coupon.map(Coupon::discountRate).orElse(0);
            ```

            반환 타입이 `Coupon`이었다면 부른 쪽은 서명만 보고 null 여부를 알 수 없다.
            그래서 **불안해서 null 검사를 붙이거나, 안심하다 실행 중에 터지거나** 둘 중 하나가 된다.
            `Optional`이면 없을 때를 다루지 않는 코드가 아예 컴파일되지 않는다.
          selfChecks:
            - 두 메서드 모두 없을 수 있다는 사실이 반환 타입에 드러나는가
            - 두 번째 메서드가 첫 번째를 다시 쓰고 있는가
            - 부른 쪽에서 없을 때 무엇을 할지 정했는가
            - Optional.of와 ofNullable 중 맞는 것을 골랐는가
      - key: LESSON.JAVA.OPTIONAL.001.U2
        title: 꺼내지 말고 이어 붙이기
        minutes: 12
        core: true
        explain: |-
          `Optional`을 받아 놓고 이렇게 쓰면 얻은 것이 없다.

          ```java
          Optional<Product> found = findByCode(code);
          if (found.isPresent()) {
              return found.get().price();     // null 검사를 이름만 바꾼 것
          }
          return 0;
          ```

          `isPresent()` + `get()` 은 `if (x != null)` 과 똑같은 모양이고,
          `get()`은 비었으면 예외를 던진다. 그래서 요즘 자바에서는
          `get()`을 쓰지 않고 **이름이 분명한 메서드**를 쓴다.

          | 하고 싶은 일 | 메서드 |
          |---|---|
          | 값이 있으면 바꾼다 | `map` |
          | 조건에 맞는 것만 남긴다 | `filter` |
          | 없으면 기본값 | `orElse` / `orElseGet` |
          | 없으면 예외 | `orElseThrow` |
          | 있을 때만 무언가 한다 | `ifPresent` |

          `orElse`는 **항상** 인자를 먼저 계산하고, `orElseGet`은 **없을 때만** 계산한다.
          기본값을 만드는 데 비용이 들면 `orElseGet`이다.
        example:
          language: java
          code: |-
            record Product(String code, int price) {}

            static Optional<Product> findByCode(String code) {
                return "KB-01".equals(code)
                        ? Optional.of(new Product("KB-01", 39000))
                        : Optional.empty();
            }

            int price = findByCode("KB-01")
                    .map(Product::price)
                    .orElse(0);

            int cheap = findByCode("KB-01")
                    .filter(product -> product.price() < 10_000)
                    .map(Product::price)
                    .orElse(0);

            System.out.println(price);
            System.out.println(cheap);
            findByCode("NONE").ifPresent(product -> System.out.println("찾음"));
            System.out.println(findByCode("NONE").orElseGet(() -> new Product("기본", 0)).code());
          output: |-
            39000
            0
            기본
          note: |-
            - `map`은 **있을 때만** 함수를 부른다. 비었으면 그냥 빈 채로 지나간다
            - `filter`가 걸러 내면 그 뒤 `map`도 건너뛰고 `orElse(0)`이 나온다
            - `ifPresent`는 비었으므로 아무것도 출력되지 않았다 — 둘째 줄이 없다
            - 어디에도 `if`와 `get()`이 없다. 흐름이 한 줄로 이어진다
        predict:
          question: '`.filter(product -> product.price() < 10_000)` 의 기준을 100_000으로 바꾸면 `cheap`은?'
          choices:
            - "39000"
            - "0"
            - "100000"
            - NoSuchElementException이 난다
          answer: "39000"
          explanation: |-
            39000원은 100000보다 작으므로 `filter`를 통과한다.
            통과하면 `map`이 가격을 꺼내고 `orElse`는 쓰이지 않는다.
            `filter`는 **있는 것을 없는 것으로 만들 수 있다**는 점이 핵심이다.
        complete:
          question: 쿠폰이 없으면 정해진 예외를 던지도록 빈칸을 채우세요.
          code: |-
            Coupon coupon = repository.findByCode(code)
                    .___(() -> new CouponNotFoundException(code));

            int rate = repository.findByCode(code)
                    .___(Coupon::discountRate)
                    .orElse(0);
          answers:
            - [orElseThrow]
            - [map]
          explanation: |-
            없을 때 예외로 끝낼 자리에는 `orElseThrow`를 쓴다.
            `get()`과 달리 **무슨 예외를 던질지 내가 정한다** — 그래야 위에서 응답으로 바꿀 수 있다.
            값을 바꿔 꺼낼 때는 `map`이다.
        problem:
          prompt: |-
            아래 코드를 `if`와 `get()` 없이 다시 쓰세요.

            ```java
            public int discountFor(String code, int orderAmount) {
                Optional<Coupon> found = repository.findByCode(code);
                if (found.isPresent()) {
                    Coupon coupon = found.get();
                    if (!coupon.used() && orderAmount >= coupon.minimumAmount()) {
                        return orderAmount * coupon.discountRate() / 100;
                    }
                }
                return 0;
            }
            ```

            - `filter`, `map`, `orElse`만으로 같은 동작을 만드세요
            - 쿠폰이 아예 없을 때와 조건에 안 맞을 때의 결과가 같아도 되는지,
              아니면 갈라야 하는지 판단하고 이유를 적으세요
          deliverables:
            - 다시 쓴 discountFor 코드
            - 없을 때와 조건에 안 맞을 때를 같게 둘지 가를지에 대한 판단과 이유
            - 갈라야 한다면 그 버전의 코드
          hints:
            - 조건 두 개가 이어서 걸러 내고 있습니다. 걸러 내는 메서드를 두 번 써도 됩니다.
            - 마지막에 값을 계산해 꺼내는 자리는 바꾸는 것입니다.
            - 두 실패를 같은 0으로 뭉개면 사용자는 왜 할인이 안 됐는지 알 수 있을까요?
          modelAnswer: |-
            ```java
            public int discountFor(String code, int orderAmount) {
                return repository.findByCode(code)
                        .filter(coupon -> !coupon.used())
                        .filter(coupon -> orderAmount >= coupon.minimumAmount())
                        .map(coupon -> orderAmount * coupon.discountRate() / 100)
                        .orElse(0);
            }
            ```

            같은 0으로 뭉개면 **화면이 이유를 말해 줄 수 없다.**
            "그런 쿠폰이 없습니다"와 "3만 원 이상부터 쓸 수 있습니다"는 사용자에게 전혀 다른 말이다.
            갈라야 한다면 이렇게 쓴다.

            ```java
            public int discountFor(String code, int orderAmount) {
                Coupon coupon = repository.findByCode(code)
                        .orElseThrow(() -> new CouponNotFoundException(code));
                if (coupon.used()) {
                    throw new IllegalStateException("이미 사용한 쿠폰이다");
                }
                if (orderAmount < coupon.minimumAmount()) {
                    throw new MinimumAmountNotMetException(coupon.minimumAmount(), orderAmount);
                }
                return orderAmount * coupon.discountRate() / 100;
            }
            ```
          selfChecks:
            - if와 get()을 모두 없앴는가
            - filter가 걸러 냈을 때 뒤의 map이 건너뛰어지는 것을 이해했는가
            - 두 실패를 같게 둘지 가를지 이유를 대고 정했는가
            - 가르기로 했다면 각 실패에 다른 예외를 붙였는가
      - key: LESSON.JAVA.OPTIONAL.001.U3
        title: Optional을 쓰지 말아야 할 자리
        minutes: 8
        core: false
        explain: |-
          `Optional`은 만능 상자가 아니다. 자바독이 밝힌 쓰임은
          **"메서드 반환 타입"** 하나이고, 다른 자리에 쓰면 오히려 나빠진다.

          | 자리 | 왜 쓰지 않나 |
          |---|---|
          | **필드** | 직렬화되지 않고, 객체마다 상자가 하나씩 더 생긴다 |
          | **매개변수** | 부르는 쪽이 매번 `Optional.of(...)`로 감싸야 한다 |
          | **컬렉션 원소** | `List<Optional<T>>`는 빈 것과 없는 것이 섞여 읽기 어렵다 |
          | **컬렉션 반환** | 없으면 **빈 목록**을 돌려주면 된다. 상자가 필요 없다 |

          매개변수가 선택이라면 `Optional`이 아니라 **메서드를 둘로 나누는 것**이 정석이다.
          컬렉션은 `Optional<List<T>>`가 아니라 `List<T>`를 돌려주고 비면 `List.of()`다 —
          **빈 것은 이미 "없음"을 표현할 줄 안다.**
        example:
          language: java
          code: |-
            // 나쁜 예 — 부르는 쪽이 매번 감싸야 한다
            static List<String> badSearch(String keyword, Optional<Integer> limit) {
                return List.of();
            }

            // 좋은 예 — 메서드를 둘로 나눈다
            static List<String> search(String keyword) {
                return search(keyword, 20);
            }

            static List<String> search(String keyword, int limit) {
                return "없는키워드".equals(keyword) ? List.of() : List.of("KB-01", "MS-02");
            }

            badSearch("키보드", Optional.of(10));
            badSearch("키보드", Optional.empty());

            System.out.println(search("키보드").size());
            System.out.println(search("없는키워드").size());
            System.out.println(search("없는키워드").isEmpty());
          output: |-
            2
            0
            true
          note: |-
            - `badSearch`는 인자가 없을 때조차 `Optional.empty()`를 적어야 한다
            - 나눈 쪽은 `search("키보드")` 한 줄이면 끝난다 — 기본값이 한 곳에 있다
            - 결과가 없을 때 `Optional`이 아니라 **빈 목록**이다. 부른 쪽이 `isEmpty()`로 본다
            - 빈 목록은 `for`문에 그대로 넣어도 안전하다. 상자는 풀어야 한다
        predict:
          question: '`search("없는키워드")`가 `Optional<List<String>>`을 돌려준다면 부른 쪽은 무엇을 더 해야 하나?'
          choices:
            - 상자를 풀고 나서 다시 비었는지 확인해야 한다 — 확인이 두 번이다
            - 아무것도 더 하지 않아도 된다
            - for문에 그대로 넣을 수 있다
            - 컴파일 오류가 난다
          answer: 상자를 풀고 나서 다시 비었는지 확인해야 한다 — 확인이 두 번이다
          explanation: |-
            `Optional<List<T>>`는 **비어 있음이 두 가지**가 된다 —
            상자가 비었거나, 목록이 비었거나. 둘을 가를 뜻이 없다면 상자는 군더더기다.
            컬렉션은 `List.of()`로 "없음"을 이미 표현할 수 있다.
        complete:
          question: 선택 인자를 Optional 대신 메서드 나누기로 바꾸세요.
          code: |-
            public List<Order> findByMember(long memberId) {
                return findByMember(memberId, ___);        // 기본값을 한 곳에 둔다
            }

            public List<Order> findByMember(long memberId, int limit) {
                return orders.stream().limit(limit).___();
            }
          answers:
            - ["20", "DEFAULT_LIMIT"]
            - [toList]
          explanation: |-
            인자가 없는 쪽이 기본값을 정해 인자가 있는 쪽을 부른다.
            기본값이 **한 곳에만** 있으므로 나중에 바꿀 자리도 한 곳이다.
            부르는 쪽은 `Optional.empty()`를 적을 일이 없다.
        problem:
          prompt: |-
            아래 API는 `Optional`을 네 군데 잘못 쓰고 있다.

            ```java
            public class MemberService {
                private Optional<String> nickname;
                public Optional<List<Order>> findOrders(long memberId, Optional<LocalDate> from) { ... }
                public void updateNickname(Optional<String> nickname) { ... }
            }
            ```

            - 네 자리를 각각 지적하고 **무엇이 불편해지는지** 적으세요
            - 네 자리를 모두 고친 서명을 쓰세요
            - 고친 서명에서 "없음"을 무엇으로 표현했는지 정리하세요
          deliverables:
            - 잘못 쓴 네 자리와 각각의 불편
            - 고친 클래스 서명
            - 각 자리에서 없음을 표현한 방법 정리
          hints:
            - 자바독이 밝힌 Optional의 쓰임은 딱 하나였습니다. 나머지는 전부 그 밖입니다.
            - 목록에는 없음을 표현하는 더 간단한 값이 이미 있습니다.
            - 선택 인자는 상자로 감싸는 대신 메서드를 나누면 됩니다.
          modelAnswer: |-
            | 자리 | 불편 |
            |---|---|
            | `private Optional<String> nickname` | 필드마다 상자가 하나 더 생기고 직렬화되지 않는다 |
            | `Optional<List<Order>>` | 비어 있음이 두 가지가 되어 확인이 두 번이다 |
            | `Optional<LocalDate> from` | 부를 때마다 `Optional.empty()`를 적어야 한다 |
            | `Optional<String> nickname` (인자) | 위와 같다. 별명을 지우려는 것인지도 불분명하다 |

            ```java
            public class MemberService {

                private String nickname;                    // 없으면 null 또는 빈 문자열

                public List<Order> findOrders(long memberId) {
                    return findOrders(memberId, LocalDate.of(1970, 1, 1));
                }

                public List<Order> findOrders(long memberId, LocalDate from) { ... }

                public void updateNickname(String nickname) { ... }

                public void clearNickname() { ... }
            }
            ```

            없음을 표현한 방법은 자리마다 다르다 —
            목록은 **빈 목록**, 선택 인자는 **메서드 나누기**,
            "지운다"는 뜻은 **이름이 분명한 별도 메서드**다.
            상자는 조회 결과를 돌려주는 자리에만 남긴다.
          selfChecks:
            - 네 자리를 모두 고쳤는가
            - 목록의 없음을 빈 목록으로 바꿨는가
            - 선택 인자를 메서드 나누기로 바꿨는가
            - '"지운다"는 뜻을 null 전달이 아니라 이름으로 표현했는가'
    commonMistakes:
      - '`isPresent()` + `get()`으로 쓴다. `if (x != null)`을 이름만 바꾼 것이고 `get()`은 비면 예외다 (U2)'
      - '`Optional`을 필드나 매개변수에 쓴다. 자바독이 밝힌 쓰임은 반환 타입 하나다 (U3)'
      - '컬렉션을 `Optional<List<T>>`로 감싼다. 비어 있음이 두 가지가 되어 확인이 두 번이다 (U3)'
    inProject: |-
      주문 시스템의 저장소 조회 메서드가 첫 자리다 — `findByCode`, `findById` 처럼
      "있을 수도 없을 수도" 있는 것들은 전부 `Optional`로 돌려준다.
      서비스는 `orElseThrow`로 도메인 예외를 던지고, 그 예외를 응답으로 바꾸는 일은
      한 곳에 모은다. 목록 조회는 상자 없이 빈 목록을 돌려준다.
    sources:
      - title: Java SE API — java.util.Optional
        url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Optional.html
        versionScope: Java SE 21+
      - title: The Java Tutorials — Aggregate Operations
        url: https://docs.oracle.com/javase/tutorial/collections/streams/index.html
        versionScope: Java SE
    verifiedAt: 2026-09-24

  - key: LESSON.PRACTICAL_ENGINEERING.NULL_BOUNDARY.001
    skillCode: PRACTICAL_ENGINEERING.NULL_BOUNDARY
    title: 경계에서 한 번만 막기 (null과 경계값)
    whyItMatters: |-
      null 검사를 여기저기 붙이면 코드의 절반이 방어 코드가 되고, 그러고도 빠뜨린 한 곳에서 터진다.
      들어오는 자리에서 한 번 막고 안쪽은 믿는 편이 짧고 안전하다.
      주문 시스템에서 수량 0, 빈 장바구니, 목록의 마지막 한 칸 같은 경계값이
      실제 장애의 대부분을 차지한다.
    oneLine: null과 경계값은 들어오는 자리에서 한 번 막고, 안쪽 코드는 값이 온전하다고 믿는다.
    units:
      - key: LESSON.PRACTICAL_ENGINEERING.NULL_BOUNDARY.001.U1
        title: 들어오는 자리에서 즉시 막기
        minutes: 10
        core: true
        explain: |-
          두 가지 태도가 있다. **모든 메서드가 자기 인자를 의심하는** 방어적 프로그래밍과,
          **경계에서 한 번 막고 안쪽은 믿는** 방식이다. 지금 통용되는 정석은 뒤쪽이다.

          이유는 간단하다. 앞쪽은 검사 코드가 호출 수만큼 늘어나는데,
          **어디서 잘못된 값이 들어왔는지는 여전히 알 수 없다.**

          경계는 세 군데다 — 외부에서 들어오는 **요청**,
          객체를 만드는 **생성자**, 모듈 밖으로 열린 **공개 메서드**.
          여기서 막으면 **터지는 자리가 원인에 가장 가깝다**. 이것을 빨리 실패하기(fail fast)라 한다.

          `Objects.requireNonNull(값, "이름")` 은 null이면 그 자리에서
          이름이 붙은 `NullPointerException`을 던진다. 한 줄로 경계가 된다.
        example:
          language: java
          code: |-
            record OrderLine(String productCode, int quantity) {

                OrderLine {
                    Objects.requireNonNull(productCode, "productCode");
                    if (productCode.isBlank()) {
                        throw new IllegalArgumentException("상품 코드가 비었다");
                    }
                    if (quantity < 1) {
                        throw new IllegalArgumentException("수량은 1개 이상이어야 한다: " + quantity);
                    }
                }

                int amount(int unitPrice) {
                    return unitPrice * quantity;   // 여기서는 아무것도 의심하지 않는다
                }
            }

            System.out.println(new OrderLine("KB-01", 2).amount(39000));
            try {
                new OrderLine(null, 2);
            } catch (NullPointerException e) {
                System.out.println("막힘: " + e.getMessage());
            }
            new OrderLine("KB-01", 0);
          output: |-
            78000
            막힘: productCode
            Exception in thread "main" java.lang.IllegalArgumentException: 수량은 1개 이상이어야 한다: 0
          note: |-
            - 생성자가 경계다. 여기를 지난 `OrderLine`은 **언제나 온전하다**
            - `amount`에 null 검사가 없다 — 있을 필요가 없어졌다
            - `requireNonNull`의 두 번째 인자가 메시지가 된다. 어느 값인지 바로 안다
            - 잘못된 값을 메시지에 넣었다(`: 0`). 로그만 보고 재현할 수 있다
        predict:
          question: 생성자의 검사를 모두 지우고 `amount`에서만 검사하면 무엇이 나빠지나?
          choices:
            - 잘못된 값이 만들어진 뒤 한참 있다 터져서 원인을 찾기 어려워진다
            - 성능이 좋아지고 안전성은 그대로다
            - 컴파일 오류가 난다
            - 아무 차이가 없다
          answer: 잘못된 값이 만들어진 뒤 한참 있다 터져서 원인을 찾기 어려워진다
          explanation: |-
            잘못된 `OrderLine`이 목록에 담기고 저장까지 된 뒤에야 터질 수 있다.
            그때 스택 트레이스는 **`amount`를 부른 자리**를 가리키지,
            잘못된 값을 넣은 자리를 가리키지 않는다.
            경계에서 막는 것은 원인과 증상의 거리를 좁히는 일이다.
        complete:
          question: 서비스의 공개 메서드를 경계로 삼아 빈칸을 채우세요.
          code: |-
            public Order place(OrderRequest request) {
                Objects.___(request, "request");
                if (request.lines().___()) {
                    throw new IllegalArgumentException("주문 줄이 비었다");
                }
                return repository.save(Order.from(request));
            }
          answers:
            - [requireNonNull]
            - [isEmpty]
          explanation: |-
            공개 메서드는 모듈 밖에서 부르는 자리이므로 경계다.
            null과 **빈 목록**을 둘 다 막아야 안쪽에서 의심할 일이 없어진다.
        problem:
          prompt: |-
            아래 코드는 null 검사가 네 군데 흩어져 있는데도 여전히 안전하지 않다.

            ```java
            public int total(Cart cart) {
                if (cart == null) return 0;
                if (cart.lines() == null) return 0;
                int sum = 0;
                for (OrderLine line : cart.lines()) {
                    if (line == null) continue;
                    if (line.productCode() == null) continue;
                    sum += line.quantity() * priceOf(line.productCode());
                }
                return sum;
            }
            ```

            - 이 방식의 문제를 **세 가지** 적으세요 (하나는 "0을 돌려준다"와 관련 있습니다)
            - 경계를 어디에 둘지 정하고, `total`에서 검사를 모두 걷어낸 코드를 쓰세요
          deliverables:
            - 이 방식의 문제 세 가지
            - 경계를 어디에 두기로 했는지와 그 이유
            - 검사를 걷어낸 total과 경계 쪽 코드
          hints:
            - 잘못된 입력에 0을 돌려주면 부른 쪽은 그것이 진짜 0인지 알 수 있을까요?
            - continue로 건너뛴 줄은 어디에도 기록되지 않습니다.
            - 이 검사들이 total이 아니라 다른 곳에 있었다면 몇 줄로 끝났을까요?
          modelAnswer: |-
            문제는 **① 잘못된 입력을 0으로 뭉갠다 ② 잘못된 줄을 조용히 건너뛴다
            ③ 같은 검사가 `total`을 부르는 모든 곳에 필요하다** 는 것이다.
            첫 번째가 가장 나쁘다 — 빈 장바구니의 0과 구분되지 않는다.

            경계는 **`Cart`와 `OrderLine`의 생성자**에 둔다.
            거기를 지난 객체는 줄이 null이 아니고 상품 코드도 있다.

            ```java
            public record Cart(List<OrderLine> lines) {
                public Cart {
                    Objects.requireNonNull(lines, "lines");
                    lines = List.copyOf(lines);      // null 원소가 있으면 여기서 막힌다
                }
            }

            public int total(Cart cart) {
                int sum = 0;
                for (OrderLine line : cart.lines()) {
                    sum += line.quantity() * priceOf(line.productCode());
                }
                return sum;
            }
            ```

            `List.copyOf`는 null 원소를 허용하지 않으므로 그 검사까지 한 줄에 끝난다.
            `total`은 계산만 남아 읽기 쉬워졌고, 진짜 0과 잘못된 입력이 더는 섞이지 않는다.
          selfChecks:
            - 잘못된 입력을 0으로 뭉개지 않게 바꿨는가
            - 조용히 건너뛰는 코드를 없앴는가
            - 경계를 생성자나 공개 메서드에 두었는가
            - total에서 검사를 모두 걷어냈는가
      - key: LESSON.PRACTICAL_ENGINEERING.NULL_BOUNDARY.001.U2
        title: null 대신 빈 것을 돌려주기
        minutes: 8
        core: true
        explain: |-
          안쪽에서 null을 돌려주지 않으면 바깥에서 null을 검사할 일도 없다.
          **없음을 표현할 수 있는 값이 이미 있다면 그것을 쓴다.**

          | 돌려줄 것 | null 대신 |
          |---|---|
          | 목록 | `List.of()` — 빈 목록 |
          | 지도 | `Map.of()` |
          | 문자열 | `""` 또는 앞 노트의 `Optional` |
          | 개수·합계 | `0` |

          빈 목록은 `for`문에 넣어도, `stream()`을 걸어도, `size()`를 물어도 안전하다.
          null은 셋 다 터진다.

          그리고 요즘 자바 프로젝트는 **"여기는 null일 수 있다"를 표기로 남긴다.**
          `@Nullable` 같은 표시를 붙여 두면 도구가 빠뜨림을 컴파일 때 잡아 준다.
          주석으로 적어 둔 약속은 아무도 지키지 않지만, 표기는 검사된다.
        example:
          language: java
          code: |-
            static final Map<Long, List<String>> ORDERS_BY_MEMBER =
                    Map.of(1L, List.of("1001", "1002"));

            // 나쁜 예 — 없으면 null
            static List<String> badFind(long memberId) {
                return ORDERS_BY_MEMBER.get(memberId);
            }

            // 좋은 예 — 없으면 빈 목록
            static List<String> find(long memberId) {
                return ORDERS_BY_MEMBER.getOrDefault(memberId, List.of());
            }

            System.out.println(find(1L).size());
            System.out.println(find(99L).size());
            for (String orderId : find(99L)) {
                System.out.println(orderId);
            }
            System.out.println(badFind(99L).size());
          output: |-
            2
            0
            Exception in thread "main" java.lang.NullPointerException
          note: |-
            - 빈 목록은 `for`문을 **0번 돌고** 조용히 지나간다. 검사가 필요 없다
            - `find(99L).size()`가 0이다 — 부른 쪽이 특별히 할 일이 없다
            - `badFind`는 마지막 줄에서 터진다. 검사를 부르는 모든 곳에 붙여야 한다
            - `getOrDefault(키, List.of())` 한 줄이 그 모든 검사를 대신한다
        predict:
          question: '`find(99L).stream().count()`는 어떻게 되나?'
          choices:
            - "0이 돌아온다"
            - NullPointerException이 난다
            - 컴파일 오류가 난다
            - "1이 돌아온다"
          answer: "0이 돌아온다"
          explanation: |-
            빈 목록도 어엿한 목록이라 `stream()`을 걸 수 있고 원소가 0개다.
            **없음을 값으로 표현해 두면 그 뒤 코드가 전부 그대로 돌아간다** —
            이것이 null을 돌려주지 않는 진짜 이득이다.
        complete:
          question: 조회 결과가 없을 때도 부른 쪽이 검사하지 않게 빈칸을 채우세요.
          code: |-
            public List<Coupon> findByMember(long memberId) {
                List<Coupon> found = repository.findAllByMemberId(memberId);
                return found == null ? List.___() : found;
            }

            public Map<String, Integer> stockOf(List<String> codes) {
                if (codes.isEmpty()) {
                    return Map.___();
                }
                return repository.findStock(codes);
            }
          answers:
            - [of]
            - [of]
          explanation: |-
            `List.of()`와 `Map.of()`는 빈 불변 컬렉션이다.
            "없음"을 null이 아니라 **값**으로 돌려주면 부른 쪽 코드가 갈라지지 않는다.
        problem:
          prompt: |-
            주문 시스템의 조회 계층에서 null이 새어 나오는 자리를 없애세요.

            - `findOrders(long memberId)` 는 주문이 없으면 지금 null을 돌려준다
            - `nicknameOf(long memberId)` 는 별명이 없으면 null을 돌려준다
            - `summaryOf(long memberId)` 는 위 둘을 써서 "별명 (주문 N건)" 문자열을 만든다

            - 세 메서드를 고쳐 `summaryOf` 안에서 null 검사가 사라지게 하세요
            - 별명과 주문 목록에 **서로 다른 방법**을 쓰고, 왜 다르게 골랐는지 적으세요
          deliverables:
            - 고친 세 메서드의 코드
            - 별명과 주문 목록에 서로 다른 방법을 고른 이유
            - 고치기 전후 summaryOf의 줄 수 비교
          hints:
            - 목록에는 없음을 나타내는 값이 이미 있습니다.
            - 별명은 "없다"와 "빈 문자열"이 뜻이 다를 수 있습니다. 그렇다면 무엇을 쓸까요?
            - summaryOf가 짧아지는지가 잘 고쳤는지의 기준입니다.
          modelAnswer: |-
            ```java
            public List<Order> findOrders(long memberId) {
                return repository.findAllByMemberId(memberId);   // 저장소가 빈 목록을 돌려준다
            }

            public Optional<String> nicknameOf(long memberId) {
                return repository.findNickname(memberId);
            }

            public String summaryOf(long memberId) {
                String nickname = nicknameOf(memberId).orElse("이름 없음");
                return nickname + " (주문 " + findOrders(memberId).size() + "건)";
            }
            ```

            목록에는 **빈 목록**을, 별명에는 **`Optional`** 을 썼다.
            목록은 빈 것이 곧 "없음"이라 상자가 필요 없지만,
            별명은 "설정한 적 없음"과 "빈 문자열로 설정함"이 뜻이 다를 수 있어
            그 둘을 가를 수 있는 표현이 필요하다.

            고치기 전 `summaryOf`는 null 검사 두 개로 5줄이었고, 지금은 2줄이다.
          selfChecks:
            - summaryOf 안에서 null 검사가 모두 사라졌는가
            - 목록과 별명에 서로 다른 방법을 썼는가
            - 다르게 고른 이유를 뜻의 차이로 설명할 수 있는가
            - 고친 뒤 코드가 실제로 짧아졌는가
      - key: LESSON.PRACTICAL_ENGINEERING.NULL_BOUNDARY.001.U3
        title: 경계값 — 0, 1, 마지막 한 칸
        minutes: 10
        core: true
        explain: |-
          버그는 한가운데가 아니라 **끝에서** 난다. 100개를 20개씩 나눠 담는 코드는
          100개에서는 맞고 101개에서 틀린다.

          어디를 볼지는 정해져 있다.

          | 자리 | 봐야 할 값 |
          |---|---|
          | 개수 | `0`, `1`, 딱 맞는 수, 하나 더 |
          | 범위 | 아래 끝, 아래 끝 - 1, 위 끝, 위 끝 + 1 |
          | 목록 | 빈 목록, 원소 1개, 마지막 원소 |
          | 나눗셈 | 나누는 수가 `0` |

          특히 `<` 와 `<=` 를 잘못 쓰는 것을 **하나 차이(off-by-one)** 라 하고,
          목록 인덱스에서 가장 자주 난다.

          정석은 두 가지다. **끝값을 코드에 흩지 말고 이름 붙인 상수로 한 곳에 두고**,
          테스트를 끝값 위주로 쓴다. 한가운데 값 하나로는 아무것도 증명되지 않는다.
        example:
          language: java
          code: |-
            static final int PAGE_SIZE = 20;

            static int pageCount(int totalCount) {
                if (totalCount < 0) {
                    throw new IllegalArgumentException("건수는 0 이상이어야 한다: " + totalCount);
                }
                return (totalCount + PAGE_SIZE - 1) / PAGE_SIZE;   // 올림 나눗셈
            }

            System.out.println(pageCount(0));
            System.out.println(pageCount(1));
            System.out.println(pageCount(20));
            System.out.println(pageCount(21));
            System.out.println(pageCount(40));
          output: |-
            0
            1
            1
            2
            2
          note: |-
            - `0`건은 0쪽이다. `1`건은 1쪽 — 여기서 `totalCount / PAGE_SIZE`는 0을 준다
            - `20`은 딱 1쪽, `21`은 2쪽이다. **딱 맞는 수와 하나 더**가 갈리는 자리다
            - 올림 나눗셈은 `(a + b - 1) / b` 로 쓴다. 나누기 전에 더해 둔다
            - `PAGE_SIZE`가 상수라 바뀔 때 고칠 자리가 한 곳이다
        predict:
          question: '`(totalCount + PAGE_SIZE - 1) / PAGE_SIZE` 를 `totalCount / PAGE_SIZE` 로 바꾸면 출력은?'
          choices:
            - 0, 0, 1, 1, 2
            - 0, 1, 1, 2, 2 (그대로)
            - 1, 1, 1, 2, 2
            - 모두 0이 된다
          answer: 0, 0, 1, 1, 2
          explanation: |-
            정수 나눗셈은 버림이라 1건이 0쪽, 21건이 1쪽이 된다.
            **한가운데 값(40)만 보면 둘 다 2라서 버그가 안 보인다.**
            끝값을 먼저 보라는 말의 뜻이 이것이다.
        complete:
          question: 목록의 마지막 원소를 안전하게 꺼내도록 빈칸을 채우세요.
          code: |-
            static <T> T last(List<T> items) {
                if (items.___()) {
                    throw new IllegalArgumentException("빈 목록이다");
                }
                return items.get(items.size() - ___);
            }
          answers:
            - [isEmpty]
            - ["1"]
          explanation: |-
            인덱스는 0부터이므로 마지막 자리는 `size() - 1`이다.
            `size()`를 그대로 쓰면 `IndexOutOfBoundsException`이 난다 — 전형적인 하나 차이다.
            빈 목록은 그 앞에서 막아야 `-1`이 인덱스로 넘어가지 않는다.
        problem:
          prompt: |-
            주문 목록을 페이지로 잘라 주는 `page(List<Order> orders, int pageNumber)` 를 작성하세요.
            한 쪽은 20건이고 `pageNumber`는 0부터 시작한다.

            - 마지막 쪽이 20건보다 적어도 정상으로 동작해야 한다
            - 범위를 벗어난 쪽 번호를 물으면 **빈 목록**을 돌려준다
            - 음수 쪽 번호는 잘못된 인자다

            그리고 이 메서드를 검증할 **경계값 테스트 케이스 목록**을 만드세요.
            건수와 쪽 번호의 조합으로 최소 6가지를 적고 각각의 기대값을 쓰세요.
          deliverables:
            - page 메서드의 코드
            - 경계값 테스트 케이스 6가지 이상 (입력과 기대값)
            - 한가운데 값만으로는 못 잡는 케이스 하나를 짚기
          hints:
            - 자를 끝 위치가 목록 크기를 넘을 수 있습니다. 넘지 않게 하는 방법이 있습니다.
            - 시작 위치가 이미 목록 크기 이상이면 자를 것이 없습니다.
            - 케이스를 고를 때 건수는 0, 1, 20, 21을, 쪽 번호는 0과 마지막과 그 너머를 보세요.
          modelAnswer: |-
            ```java
            static final int PAGE_SIZE = 20;

            public List<Order> page(List<Order> orders, int pageNumber) {
                if (pageNumber < 0) {
                    throw new IllegalArgumentException("쪽 번호는 0 이상이어야 한다: " + pageNumber);
                }
                int from = pageNumber * PAGE_SIZE;
                if (from >= orders.size()) {
                    return List.of();
                }
                int to = Math.min(from + PAGE_SIZE, orders.size());
                return List.copyOf(orders.subList(from, to));
            }
            ```

            | 건수 | 쪽 | 기대 |
            |---|---|---|
            | 0 | 0 | 빈 목록 |
            | 1 | 0 | 1건 |
            | 20 | 0 | 20건 |
            | 20 | 1 | 빈 목록 — **딱 맞을 때 다음 쪽** |
            | 21 | 1 | 1건 — **마지막 쪽이 덜 찼을 때** |
            | 21 | 2 | 빈 목록 |
            | 1 | -1 | IllegalArgumentException |

            한가운데 값만으로는 못 잡는 것은 **20건에 1쪽**이다.
            `Math.min` 없이 `subList(20, 40)`을 부르면 `IndexOutOfBoundsException`이 나는데,
            30건짜리로만 시험하면 이 버그가 드러나지 않는다.
          selfChecks:
            - 마지막 쪽이 덜 찼을 때를 실제로 확인했는가
            - 딱 맞는 건수의 다음 쪽이 빈 목록인지 확인했는가
            - 음수 쪽 번호를 빈 목록이 아니라 예외로 다뤘는가
            - 테스트 케이스가 끝값 위주인가, 한가운데 값 위주인가
    commonMistakes:
      - null 검사를 호출하는 모든 곳에 붙인다. 코드는 늘고 원인은 여전히 안 보인다 (U1)
      - 잘못된 입력에 0이나 빈 값을 돌려준다. 진짜 0과 구분되지 않아 장애가 늦게 드러난다 (U1)
      - '`size()`와 `size() - 1`을 헷갈린다. 목록의 마지막 한 칸에서만 터진다 (U3)'
    inProject: |-
      주문 시스템에서 경계는 세 군데다 — 요청을 받는 컨트롤러, `Order`·`OrderLine`의 생성자,
      그리고 모듈 밖으로 열린 서비스 메서드. 여기서 null과 빈 목록과 범위를 막으면
      안쪽 계산 코드에는 검사가 한 줄도 없어도 된다.
      페이지 처리와 재고 차감은 경계값 테스트를 먼저 쓰고 구현한다.
