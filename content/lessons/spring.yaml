# DevPilot 개념 노트 — Spring
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 버전을 우리 것에 맞춘다: Spring Boot 4.1 / Spring Framework 7, Java 25
# - 단위 하나가 5~15분짜리 한 바퀴다: 설명 → 예제 → 예측 → 빈칸 → 문제 → 견주기
# - 문제는 예제의 복사가 아니라 변형이다. 가능하면 주문 시스템(상품·주문) 상황으로 쓴다 (CV-134)
# - 힌트는 답을 그대로 말하지 않는다 (CV-133)
lessons:
  - key: LESSON.SPRING.MVC_REST.001
    skillCode: SPRING.MVC_REST
    title: 요청을 메서드에 잇기 (Spring MVC REST)
    whyItMatters: |-
      주소 하나가 어느 메서드로 가는지 정하지 못하면 화면도 앱도 서버에 말을 걸 수 없다.
      404는 "그 주소를 아는 메서드가 없다"는 뜻이고, 500은 "찾긴 했는데 돌려줄 것이 없다"는 뜻이다.
      주문 시스템에서 상품 목록·상품 하나·주문 넣기를 만들려면 이 네 가지가 전부 필요하다.
    oneLine: 컨트롤러(controller)는 URL과 HTTP 메서드를 자바 메서드에 이어 주는 자리이고, 그 연결을 URL 매핑(URL mapping)이라고 한다.
    units:
      - key: LESSON.SPRING.MVC_REST.001.U1
        title: 주소 하나를 메서드에 잇기
        minutes: 10
        core: true
        explain: |-
          스프링은 요청이 오면 **등록된 URL 매핑**을 먼저 찾는다. 찾지 못하면 404를 돌려준다.
          매핑을 만드는 방법은 클래스에 `@RestController`를 붙이고, 메서드에 `@GetMapping("/주소")`를 붙이는 것이다.

          `@RestController`는 "이 클래스가 돌려주는 값을 **응답 본문으로 그대로 쓴다**"는 뜻이다.
          `@Controller`만 붙이면 스프링은 돌려준 문자열을 화면 파일 이름으로 읽으려 한다 — REST API를 만들 때 헷갈리는 자리다.

          `@GetMapping`은 `@RequestMapping(method = GET)`의 줄임이다. `@PostMapping`·`@PutMapping`·`@DeleteMapping`·`@PatchMapping`도 같은 식이다.
        example:
          language: java
          code: |-
            @RestController
            public class HelloController {

                @GetMapping("/hello")
                public String hello() {
                    return "안녕하세요";
                }
            }
          output: |-
            GET /hello  →  200 OK
            본문: 안녕하세요
          note: |-
            - `@RestController` — 돌려준 값이 응답 본문이 된다
            - `@GetMapping("/hello")` — GET `/hello` 요청을 이 메서드에 잇는다
            - `return "안녕하세요"` — 문자열이므로 그대로 본문이 된다(JSON으로 감싸지 않는다)
        predict:
          question: 같은 코드에서 `@RestController`를 `@Controller`로만 바꾸면 GET /hello의 결과는?
          code: |-
            @Controller
            public class HelloController {

                @GetMapping("/hello")
                public String hello() {
                    return "안녕하세요";
                }
            }
          choices:
            - 본문에 "안녕하세요"가 그대로 나온다
            - 화면 이름으로 읽혀 그런 화면을 찾다가 실패한다
            - 컴파일되지 않는다
            - 404가 난다
          answer: 화면 이름으로 읽혀 그런 화면을 찾다가 실패한다
          explanation: |-
            `@Controller`만 있으면 스프링은 돌려준 문자열을 **화면 이름**으로 읽는다. 그런 화면이 없으니 실패한다.
            본문으로 쓰고 싶으면 메서드에 `@ResponseBody`를 붙이거나, 클래스에 `@RestController`를 쓴다
            (`@RestController` = `@Controller` + `@ResponseBody`).
            매핑 자체는 찾았으므로 404는 아니다.
        complete:
          question: GET /ping 요청에 "pong"을 돌려주도록 빈칸을 채우세요.
          code: |-
            @___
            public class PingController {

                @___("/ping")
                public String ping() {
                    return "pong";
                }
            }
          answers:
            - [RestController]
            - [GetMapping]
          explanation: |-
            클래스에는 `@RestController`(돌려준 값을 본문으로), 메서드에는 `@GetMapping`(GET 매핑)이다.
        problem:
          prompt: |-
            주문 시스템에 "서버가 살아 있는지" 확인하는 주소를 만들려고 합니다.
            GET `/orders/health`를 부르면 본문에 `ok`만 돌려주는 컨트롤러를 백지에서 작성하세요.
            클래스 이름은 `OrderHealthController`로 합니다.
          deliverables:
            - 클래스 전체 코드 (import는 생략해도 됩니다)
            - 클래스와 메서드에 각각 어떤 애너테이션을 왜 붙였는지 한 줄씩
          starterCode: |-
            public class OrderHealthController {

                // 여기에 작성하세요
            }
          hints:
            - 클래스에 붙이는 애너테이션이 하나, 메서드에 붙이는 애너테이션이 하나입니다. 예제의 두 자리를 다시 보세요.
            - 돌려준 문자열이 화면 이름으로 읽히면 안 됩니다. 그것을 막는 애너테이션이 무엇이었나요?
            - GET 요청이므로 메서드 애너테이션은 HTTP 메서드 이름이 들어간 줄임 애너테이션을 씁니다.
          modelAnswer: |-
            ```java
            @RestController
            public class OrderHealthController {

                @GetMapping("/orders/health")
                public String health() {
                    return "ok";
                }
            }
            ```

            - `@RestController`를 쓴 이유: 돌려준 `"ok"`를 **응답 본문**으로 그대로 쓰기 위해서다. `@Controller`만 쓰면 `ok`라는 화면을 찾는다.
            - `@GetMapping("/orders/health")`를 쓴 이유: GET 요청과 이 메서드를 잇기 위해서다.
          selfChecks:
            - 클래스에 `@RestController`(또는 `@Controller` + 메서드에 `@ResponseBody`)를 붙였는가
            - 메서드에 `@GetMapping`을 붙이고 주소를 `/orders/health`로 정확히 적었는가
            - 반환 타입이 `String`이고 `ok`만 돌려주는가

      - key: LESSON.SPRING.MVC_REST.001.U2
        title: 주소 안의 값 받기
        minutes: 12
        core: true
        explain: |-
          `/orders/7`처럼 **주소 일부가 값**인 경우가 있다. 이때 주소에 중괄호로 자리를 만든다: `/orders/{orderId}`.
          그 자리에 들어온 값은 메서드 파라미터에 `@PathVariable`을 붙여 받는다.

          이름이 같으면 그대로 이어진다(`{orderId}` ↔ `Long orderId`). 이름이 다르면 `@PathVariable("orderId")`처럼 적어 준다.

          **타입은 스프링이 바꿔 준다.** 주소의 `7`은 글자인데 파라미터가 `Long`이면 숫자로 바꿔 넣는다.
          바꿀 수 없으면(`/orders/abc`) `TypeMismatchException`이 나고 400이 된다.

          자바 record를 돌려주면 스프링이 JSON으로 바꿔 준다. 필드 순서는 record에 적은 순서다.
        example:
          language: java
          code: |-
            public record OrderView(Long id, String status) {}

            @RestController
            public class OrderController {

                @GetMapping("/orders/{orderId}")
                public OrderView find(@PathVariable Long orderId) {
                    return new OrderView(orderId, "PAID");
                }
            }
          output: |-
            GET /orders/7    →  200 OK   {"id":7,"status":"PAID"}
            GET /orders/abc  →  400      (abc를 Long으로 바꿀 수 없다)
          note: |-
            - `{orderId}` — 주소에서 값이 들어올 자리
            - `@PathVariable Long orderId` — 그 자리의 값을 받는다. 이름이 같아서 따로 적지 않았다
            - `OrderView`를 돌려주니 JSON이 된다(문자열이 아니다)
        predict:
          question: 파라미터 타입은 `Long`인데 GET /orders/abc 를 부르면 어떻게 되나요?
          code: |-
            @GetMapping("/orders/{orderId}")
            public OrderView find(@PathVariable Long orderId) {
                return new OrderView(orderId, "PAID");
            }
          choices:
            - orderId에 null이 들어오고 200이 돌아온다
            - 타입을 바꾸지 못해 400이 돌아온다
            - abc가 문자열 그대로 들어온다
            - 주소를 못 찾아 404가 돌아온다
          answer: 타입을 바꾸지 못해 400이 돌아온다
          explanation: |-
            주소의 값은 글자지만 스프링이 파라미터 타입으로 **바꿔서** 넣는다.
            `abc`는 `Long`으로 바꿀 수 없으므로 `TypeMismatchException`이 나고 400이 된다.
            매핑 자체는 `/orders/{orderId}`와 맞으므로 404는 아니다.
        complete:
          question: GET /products/42 를 받아 그 번호를 그대로 돌려주도록 빈칸을 채우세요.
          code: |-
            @GetMapping("/products/___")
            public Long productId(@___ Long productId) {
                return productId;
            }
          answers:
            - ["{productId}"]
            - [PathVariable]
          explanation: |-
            주소에는 중괄호로 자리를 만들고(`{productId}`), 파라미터에는 `@PathVariable`을 붙인다.
            이름이 같으므로 애너테이션에 이름을 따로 적지 않아도 된다.
        problem:
          prompt: |-
            주문 상세 주소를 만듭니다. GET `/orders/{orderId}/items/{itemId}`를 받아
            `OrderItemView(Long orderId, Long itemId, String name)`를 돌려주는 메서드를 백지에서 작성하세요.
            `name`은 `"샘플"`로 고정해도 됩니다. 자리가 **두 개**라는 점에 주의하세요.
          deliverables:
            - record와 메서드 코드
            - 자리가 두 개일 때 U2의 예제와 무엇이 달라져야 하는지 한 줄
          hints:
            - 자리가 두 개면 파라미터도 두 개입니다. 각각에 애너테이션을 붙여야 합니다.
            - 자리와 파라미터가 하나씩일 때만 이름 없이 이어집니다. 두 개일 때는 무엇을 믿고 잇게 될까요?
            - 이름이 맞으면 그대로 이어집니다. 주소의 자리 이름과 파라미터 이름을 같게 맞춰 보세요.
          modelAnswer: |-
            ```java
            public record OrderItemView(Long orderId, Long itemId, String name) {}

            @GetMapping("/orders/{orderId}/items/{itemId}")
            public OrderItemView findItem(
                    @PathVariable Long orderId, @PathVariable Long itemId) {
                return new OrderItemView(orderId, itemId, "샘플");
            }
            ```

            자리가 두 개이므로 파라미터마다 `@PathVariable`을 붙이고, **이름을 주소의 자리 이름과 같게** 맞췄다.
            이름이 다르면 `@PathVariable("orderId") Long id`처럼 이름을 적어 줘야 한다.
          selfChecks:
            - 주소에 자리를 두 개(`{orderId}`, `{itemId}`) 만들었는가
            - 파라미터마다 `@PathVariable`을 붙였는가
            - 파라미터 이름이 주소의 자리 이름과 같은가(다르다면 애너테이션에 이름을 적었는가)

      - key: LESSON.SPRING.MVC_REST.001.U3
        title: 물음표 뒤의 값 받기
        minutes: 12
        core: true
        explain: |-
          `/orders?status=PAID&page=2`처럼 **물음표 뒤에 붙는 값**은 쿼리 파라미터(query parameter)다.
          `@RequestParam`으로 받는다.

          기본은 **필수**다. 값이 없으면 400이 난다. 없어도 되게 하려면 두 가지 방법이 있다.

          - `@RequestParam(required = false) String status` — 없으면 `null`
          - `@RequestParam(defaultValue = "1") int page` — 없으면 `1`

          `java.util.Optional<String>`로 받아도 된다. 타입 변환은 `@PathVariable`과 같다 — `page=2`는 `int 2`가 된다.

          참고: 단순한 타입이면 `@RequestParam`을 생략해도 쿼리 파라미터로 읽는다. 다만 **읽는 사람을 위해 붙여 두는 편**이 낫다.
        example:
          language: java
          code: |-
            @RestController
            public class OrderSearchController {

                @GetMapping("/orders")
                public String search(
                        @RequestParam(required = false) String status,
                        @RequestParam(defaultValue = "1") int page) {
                    return "status=" + status + ", page=" + page;
                }
            }
          output: |-
            GET /orders                      →  status=null, page=1
            GET /orders?status=PAID          →  status=PAID, page=1
            GET /orders?status=PAID&page=3   →  status=PAID, page=3
          note: |-
            - `required = false` — `status`가 없으면 `null`이 들어온다
            - `defaultValue = "1"` — `page`가 없으면 1이 된다. 기본값을 주면 필수가 아니게 된다
            - 둘 다 적지 않았다면 값이 없을 때 400이 난다
        predict:
          question: 아래처럼 `required`도 `defaultValue`도 적지 않았을 때 GET /orders 를 부르면?
          code: |-
            @GetMapping("/orders")
            public String search(@RequestParam String status) {
                return "status=" + status;
            }
          choices:
            - status=null 이 돌아온다
            - 400이 난다
            - 500이 난다
            - 빈 문자열이 들어온다
          answer: 400이 난다
          explanation: |-
            `@RequestParam`은 **기본이 필수**다. 값이 없으면 요청을 처리하지 못하고 400이 된다.
            없어도 되게 하려면 `required = false`나 `defaultValue`를 적거나 `Optional`로 받는다.
        complete:
          question: size가 없으면 20이 되도록 빈칸을 채우세요.
          code: |-
            @GetMapping("/products")
            public String list(@RequestParam(___ = "20") int size) {
                return "size=" + size;
            }
          answers:
            - [defaultValue]
          explanation: |-
            `defaultValue`를 주면 값이 없을 때 그 값이 들어오고, 동시에 필수가 아니게 된다.
            `required = false`만 주면 기본값이 없어 `int`에는 넣을 수 없다(`Integer`여야 한다).
        problem:
          prompt: |-
            상품 목록 주소를 만듭니다. GET `/products`를 받아 아래 조건을 지키는 메서드를 백지에서 작성하세요.
            반환은 문자열로 `keyword=..., page=..., size=...` 형태면 됩니다.

            - `keyword`는 없어도 된다(없으면 `null`)
            - `page`는 없으면 1
            - `size`는 없으면 20
          deliverables:
            - 메서드 코드
            - 세 파라미터에 각각 왜 그 방법을 골랐는지 한 줄씩
          hints:
            - 세 파라미터가 "없어도 되는" 방식이 서로 다릅니다. 하나는 null, 둘은 기본값입니다.
            - 기본값을 주는 속성과 그냥 없어도 되게 하는 속성은 다른 속성입니다.
            - '`int`처럼 null을 담을 수 없는 타입에는 어떤 쪽을 써야 할지 생각해 보세요.'
          modelAnswer: |-
            ```java
            @GetMapping("/products")
            public String list(
                    @RequestParam(required = false) String keyword,
                    @RequestParam(defaultValue = "1") int page,
                    @RequestParam(defaultValue = "20") int size) {
                return "keyword=" + keyword + ", page=" + page + ", size=" + size;
            }
            ```

            - `keyword`: 없으면 `null`이면 되므로 `required = false`. `String`은 null을 담을 수 있다.
            - `page`·`size`: 없을 때 넣을 값이 정해져 있으므로 `defaultValue`. `int`는 null을 담을 수 없어서 이쪽이 맞다.
          selfChecks:
            - '`keyword`에 `required = false`를 주었는가'
            - '`page`와 `size`에 `defaultValue`를 주었는가'
            - '`int` 파라미터에 `required = false`만 주지 않았는가(null을 담을 수 없다)'

      - key: LESSON.SPRING.MVC_REST.001.U4
        title: 공통 경로와 만들기 요청
        minutes: 13
        core: true
        explain: |-
          한 컨트롤러의 주소가 모두 `/orders`로 시작한다면, 클래스에 `@RequestMapping("/orders")`를 한 번 적는다.
          그러면 메서드의 주소는 **뒷부분만** 적으면 된다. 클래스 쪽과 메서드 쪽이 이어져 최종 주소가 된다.

          만들기 요청은 `@PostMapping`이고, 요청 본문(JSON)은 `@RequestBody`로 받는다.
          record를 파라미터로 두면 스프링이 JSON을 그 record로 바꿔 준다.

          만들었을 때는 200이 아니라 **201 Created**가 맞다. `@ResponseStatus(HttpStatus.CREATED)`로 정한다.
        example:
          language: java
          code: |-
            public record CreateOrderRequest(String productCode, int quantity) {}

            @RestController
            @RequestMapping("/orders")
            public class OrderController {

                @GetMapping("/{orderId}")
                public String find(@PathVariable Long orderId) {
                    return "order " + orderId;
                }

                @PostMapping
                @ResponseStatus(HttpStatus.CREATED)
                public String create(@RequestBody CreateOrderRequest request) {
                    return "created " + request.productCode();
                }
            }
          output: |-
            GET  /orders/7                                  →  200  order 7
            POST /orders  {"productCode":"A1","quantity":2}  →  201  created A1
          note: |-
            - 클래스의 `@RequestMapping("/orders")` + 메서드의 `"/{orderId}"` = `/orders/{orderId}`
            - `@PostMapping`에 주소를 적지 않았다 — 클래스 경로 그대로 `/orders`다
            - `@RequestBody` — 요청 본문 JSON을 record로 바꿔 받는다
            - `@ResponseStatus(HttpStatus.CREATED)` — 응답 코드를 201로 정한다
        predict:
          question: 위 컨트롤러에서 create 메서드를 `@PostMapping("/orders")`로 바꾸면 POST /orders 는?
          choices:
            - 그대로 201이 돌아온다
            - 404가 난다
            - 서버가 뜨지 않는다
          answer: 404가 난다
          explanation: |-
            클래스의 `@RequestMapping("/orders")`와 메서드의 `"/orders"`가 **이어져** `/orders/orders`가 된다.
            POST `/orders`를 아는 메서드가 없으므로 404다. 클래스에 공통 경로를 뒀으면 메서드에는 뒷부분만 적는다.
        complete:
          question: 클래스 공통 경로를 `/products`로 두고, POST /products 로 만들기를 받도록 빈칸을 채우세요.
          code: |-
            @RestController
            @___("/products")
            public class ProductController {

                @___
                @ResponseStatus(HttpStatus.CREATED)
                public String create(@RequestBody CreateProductRequest request) {
                    return "created";
                }
            }
          answers:
            - [RequestMapping]
            - [PostMapping]
          explanation: |-
            클래스에는 HTTP 메서드를 정하지 않는 `@RequestMapping`으로 공통 경로만 둔다.
            메서드에는 `@PostMapping`을 주소 없이 붙이면 클래스 경로 그대로 `/products`가 된다.
        problem:
          prompt: |-
            장바구니 컨트롤러를 백지에서 작성하세요. 공통 경로는 `/carts`입니다.

            - GET `/carts/{cartId}` — 문자열 `cart {cartId}`를 돌려준다
            - POST `/carts` — 본문으로 `AddItemRequest(String productCode, int quantity)`를 받고 **201**을 돌려준다

            클래스 이름은 `CartController`로 합니다.
          deliverables:
            - record와 컨트롤러 클래스 코드
            - 공통 경로를 클래스에 둔 덕분에 메서드에서 무엇을 적지 않아도 되는지 한 줄
          hints:
            - 공통 경로는 클래스에 한 번만 적습니다. 메서드에는 뒷부분만 남습니다.
            - POST 메서드의 주소는 공통 경로와 같습니다. 그러면 메서드 애너테이션에 주소를 적어야 할까요?
            - 201을 돌려주는 방법은 애너테이션 하나입니다. U4의 예제에서 만들기 메서드 위를 다시 보세요.
          modelAnswer: |-
            ```java
            public record AddItemRequest(String productCode, int quantity) {}

            @RestController
            @RequestMapping("/carts")
            public class CartController {

                @GetMapping("/{cartId}")
                public String find(@PathVariable Long cartId) {
                    return "cart " + cartId;
                }

                @PostMapping
                @ResponseStatus(HttpStatus.CREATED)
                public String add(@RequestBody AddItemRequest request) {
                    return "added " + request.productCode();
                }
            }
            ```

            공통 경로를 클래스에 두었으므로 메서드에는 `/carts`를 다시 적지 않는다.
            POST는 주소가 공통 경로와 같아서 `@PostMapping`에 주소를 아예 적지 않았다.
          selfChecks:
            - 클래스에 `@RequestMapping("/carts")`를 두고 메서드에서 `/carts`를 다시 적지 않았는가
            - GET 메서드의 주소가 `/{cartId}`이고 `@PathVariable`로 받았는가
            - POST 메서드에 `@ResponseStatus(HttpStatus.CREATED)`를 붙였는가
        prerequisiteUnits:
          - LESSON.SPRING.MVC_REST.001.U1
          - LESSON.SPRING.MVC_REST.001.U2
    commonMistakes:
      - "`@Controller`만 붙이고 문자열을 돌려줘서 화면을 찾다가 실패한다. REST API에서는 `@RestController`를 쓴다."
      - "클래스에 공통 경로를 두고 메서드에도 같은 경로를 또 적어 `/orders/orders`가 된다. 404가 나면 최종 주소를 먼저 계산해 본다."
      - "`@RequestParam`이 기본 필수인 것을 잊고 값을 안 보내 400을 받는다. 없어도 되면 `required = false`나 `defaultValue`를 적는다."
    inProject: |-
      주문 시스템의 첫 화면이 서버에 말을 걸려면 이 네 가지가 그대로 필요하다.
      상품 목록은 GET `/products`에 쿼리 파라미터(검색어·페이지), 상품 하나는 GET `/products/{id}`,
      주문 넣기는 POST `/orders` + `@RequestBody` + 201이다.
      컨트롤러마다 공통 경로를 클래스에 두면 주소가 한곳에 모여 나중에 바꾸기 쉽다.
