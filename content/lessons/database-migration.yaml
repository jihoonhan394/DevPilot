        url: https://docs.spring.io/spring-boot/how-to/data-initialization.html
        versionScope: Spring Boot 3.x+
      - title: Spring Boot — SQL Databases
        url: https://docs.spring.io/spring-boot/reference/data/sql.html
        versionScope: Spring Boot 3.x+
