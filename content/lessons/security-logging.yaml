# DevPilot 개념 노트 — 로그에 남기면 안 되는 것 (민감정보 로깅)
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 인증·인가 노트가 비밀번호 저장을 다룬다. 여기서는 그 값이 로그로 새는 경로를 다룬다
# - 실제 계정·키 값은 쓰지 않는다. 자리표시자만 쓴다
lessons:
  - key: LESSON.SECURITY.SENSITIVE_DATA_LOGGING.001
    skillCode: SECURITY.SENSITIVE_DATA_LOGGING
    title: 로그에 남기면 안 되는 것 (민감정보 로깅)
    whyItMatters: |-
      비밀번호를 해시로 저장해 놓고 **로그에는 평문으로 찍는** 일이 실제로 자주 일어난다.
      디버깅하려고 요청 본문을 통째로 찍어 두고 그대로 배포되는 식이다.
      로그는 저장소에 오래 남고, 보통 개발자와 운영 담당이 두루 보고,
      외부 수집 도구로 복사되기도 한다.
      한 번 새면 **지우기도 어렵고 어디까지 퍼졌는지 알기도 어렵다.**
    oneLine: 로그는 오래 남고 널리 읽히므로, 민감한 값은 **찍지 않도록 코드가 아니라 구조로** 막는다.
    units:
      - key: LESSON.SECURITY.SENSITIVE_DATA_LOGGING.001.U1
        title: 무엇이 민감한가
        minutes: 10
        core: true
        explain: |-
          "비밀번호만 조심하면 되지"가 첫 번째 함정이다. 로그에 남으면 안 되는 값은 여러 갈래다.

          - **인증에 쓰이는 값** — 비밀번호, 토큰, 세션 id, API 키, 쿠키 헤더
          - **개인을 식별하는 값** — 주민번호, 전화번호, 주소, 계좌·카드 번호
          - **그 자체로 열쇠가 되는 값** — 비밀번호 재설정 링크, 일회용 코드

          판단 기준 하나면 충분하다. **그 값을 본 사람이 남의 계정으로 들어가거나
          남을 특정할 수 있는가.** 그렇다면 로그에 남기지 않는다.

          자주 놓치는 자리도 정해져 있다.

          - **예외 메시지** — "login failed for `<password>`"처럼 값이 섞여 들어간다
          - **요청·응답 전체 덤프** — 디버깅용으로 켜 두고 잊는다
          - **URL 쿼리 문자열** — 접근 로그에 경로가 통째로 남는다.
            그래서 **토큰을 쿼리에 싣지 않는다**

          대신 남겨야 할 것도 있다. **누가 무엇을 언제 했는지**는 남겨야 추적이 된다 —
          식별자(사용자 id)와 행위, 결과를 남기고 **값 자체는 남기지 않는다.**
        example:
          language: java
          code: |-
            // 나쁜 예 — 값이 그대로 남는다
            log.info("login request: {}", request);            // 비밀번호 포함
            log.debug("token={}", accessToken);
            log.warn("reset link sent: {}", resetUrl);         // 링크 자체가 열쇠다

            // 좋은 예 — 무슨 일이 있었는지만 남긴다
            log.info("login attempt userId={} result={}", user.getId(), result);
            log.debug("token issued userId={} expiresIn={}", user.getId(), expiresIn);
            log.warn("reset link sent userId={}", user.getId());
          output: |-
            나쁜 예가 남기는 줄
              login request: CreateLoginRequest[email=<user@example.com>, password=<평문>]
              token=<전체 토큰>
              → 이 줄을 본 사람은 그 계정으로 로그인할 수 있다

            좋은 예가 남기는 줄
              login attempt userId=17 result=SUCCESS
              → 추적에는 충분하고, 들어갈 수는 없다
          note: |-
            - 기준: 그 줄을 본 사람이 **들어갈 수 있는가, 특정할 수 있는가**
            - 값 대신 **식별자와 결과**를 남긴다. 추적은 그것으로 된다
            - 토큰을 쿼리 문자열에 싣지 않는다. 접근 로그에 그대로 남는다
        predict:
          question: '로그인 요청 객체를 `log.info("request: {}", request)`로 찍으면?'
          choices:
            - toString 에 포함된 비밀번호가 평문으로 남는다
            - Spring이 비밀번호 필드를 자동으로 가린다
            - record 는 toString 이 없어 아무것도 안 남는다
            - 로그 수준이 info 라 안전하다
          answer: toString 에 포함된 비밀번호가 평문으로 남는다
          explanation: |-
            record나 lombok이 만들어 주는 `toString`은 **모든 필드를 그대로** 담는다.
            가려 주는 기본 동작은 없다.
            해시로 저장해 둔 의미가 이 한 줄로 사라진다 — 로그에는 평문이 남기 때문이다.
            로그 수준도 상관없다. `debug`도 운영에서 켜지는 순간 같은 일이 벌어진다.
        complete:
          question: 값 대신 식별자와 결과만 남기도록 빈칸을 채우세요.
          code: |-
            log.info("login attempt userId={} result={}", user.___(), result);
          answers:
            - [getId]
          explanation: |-
            사용자 **id**만 남기면 누가 언제 시도했는지 추적할 수 있으면서
            그 줄을 본 사람이 계정에 들어갈 수는 없다.
        problem:
          prompt: |-
            팀 코드에서 이런 로그를 발견했습니다.

            ```java
            log.info("login request: {}", request);
            log.debug("Authorization={}", authorizationHeader);
            log.error("payment failed: {}", cardNumber);
            ```

            1. 각각 무엇이 문제인지
            2. 같은 목적(디버깅·추적)을 지키면서 어떻게 바꿀지
            3. `debug` 수준이라 괜찮다는 주장에 대한 답
          deliverables:
            - 세 물음에 대한 답
            - 2번은 바꾼 로그 문장으로
          hints:
            - 그 줄을 본 사람이 무엇을 할 수 있게 되는지 따져 보세요.
            - 추적에 꼭 필요한 정보가 값 전체인지 생각해 보세요.
            - 운영에서 로그 수준이 바뀌는 일이 있는지 떠올려 보세요.
          modelAnswer: |-
            **1. 각각의 문제**

            - `request` — `toString`에 **비밀번호가 평문으로** 들어간다. 해시 저장이 무의미해진다
            - `Authorization` 헤더 — **토큰 자체**다. 그 줄을 본 사람이 그대로 그 사람 행세를 할 수 있다
            - `cardNumber` — 결제 정보다. 남기면 안 되고, 필요하면 **뒤 네 자리만** 남긴다

            **2. 바꾼 로그**

            ```java
            log.info("login attempt userId={} result={}", user.getId(), result);
            log.debug("authenticated userId={} tokenExpiresIn={}", user.getId(), expiresIn);
            log.error("payment failed orderId={} last4={} reason={}", orderId, last4, reason);
            ```

            추적에 필요한 것은 **누가·무엇을·결과**이지 값 전체가 아니다.

            **3. debug 수준이라 괜찮다는 주장**

            괜찮지 않다.

            - 운영에서 **문제를 파악하려고 debug를 켜는 일**이 있다. 그 순간 전부 남는다
            - 로컬·개발 환경의 로그도 수집 도구로 보내지거나 화면 공유·스크린샷으로 퍼진다
            - 애초에 **찍히지 않게 두는 편이** 수준을 관리하는 것보다 단순하고 확실하다

            수준으로 막는 것은 "설정이 계속 올바르다"에 기대는 방식이라 언젠가 깨진다.
          selfChecks:
            - 세 줄 각각의 위험을 "본 사람이 무엇을 할 수 있는가"로 설명했는가
            - 바꾼 로그에 식별자와 결과가 남고 값은 빠졌는가
            - debug 주장에 대해 운영에서 켜질 수 있다는 점을 짚었는가

      - key: LESSON.SECURITY.SENSITIVE_DATA_LOGGING.001.U2
        title: 사람이 기억하지 않아도 되게 만든다
        minutes: 12
        core: true
        explain: |-
          "조심해서 찍자"는 오래 못 간다. 사람은 잊고, 새로 온 사람은 모르고,
          급할 때는 일단 찍는다. **구조로 막아야** 한다.

          막는 자리가 세 군데 있다.

          - **값이 만들어지는 곳** — 민감한 필드를 가진 타입의 `toString`을 손본다.
            record라면 `toString`을 직접 작성해 그 필드를 빼거나 가린다.
            그러면 어디서 찍든 안전하다
          - **로그로 나가는 길목** — 공통 필터나 변환기에서 정해진 이름의 필드를 가린다.
            `password`, `token`, `authorization`처럼 **이름 기준 허용/거부 목록**을 둔다
          - **찍는 시점** — 요청 본문을 통째로 찍는 코드를 두지 않는다.
            필요한 필드만 골라 찍는 습관

          첫 번째가 가장 강하다. 타입이 스스로 안전하면 호출하는 쪽이 실수해도 새지 않는다.

          **가리는 방식도 정해 둔다.** 완전히 빼거나, 길이만 남기거나, 뒤 네 자리만 남긴다.
          `***`로만 바꾸면 "값이 있었다"는 사실은 남아 추적에 쓸 수 있다.
        example:
          language: java
          code: |-
            // 타입이 스스로 안전하다 — 어디서 찍어도 새지 않는다
            public record LoginRequest(String email, String password) {
                @Override
                public String toString() {
                    return "LoginRequest[email=" + email + ", password=***]";
                }
            }

            // 길목에서 가린다 — 이름으로 거른다
            private static final Set<String> MASKED =
                    Set.of("password", "token", "authorization", "cookie");

            static String mask(String field, String value) {
                return MASKED.contains(field.toLowerCase()) ? "***" : value;
            }
          output: |-
            log.info("login request: {}", request);
              → login request: LoginRequest[email=<user@example.com>, password=***]

            호출하는 쪽이 실수해도 평문은 나가지 않는다

            길목에서 가린 경우
              {"email": "<user@example.com>", "password": "***"}
          note: |-
            - **타입이 스스로 안전한 것**이 가장 강하다. 호출자의 실수를 덮는다
            - 길목 가리기는 **이름 기준**이다. 새 필드가 생기면 목록도 늘려야 한다
            - `***`로 남기면 "값이 있었다"는 사실은 추적에 쓸 수 있다
        predict:
          question: 민감한 필드를 가진 record의 `toString`을 직접 작성해 가렸습니다. 다른 개발자가 `log.info("{}", request)`를 쓰면?
          choices:
            - 가려진 형태로 남는다. 타입이 스스로 안전하다
            - 평문이 남는다. 로그 호출부에서 다시 가려야 한다
            - 컴파일 오류가 난다
            - 로그가 아예 남지 않는다
          answer: 가려진 형태로 남는다. 타입이 스스로 안전하다
          explanation: |-
            로그는 객체를 찍을 때 `toString`을 부른다.
            그 안에서 이미 가렸으므로 **어디서 찍든 같은 결과**다.
            이것이 "구조로 막는다"의 뜻이다 — 호출하는 사람이 기억하지 않아도 된다.
        complete:
          question: 로그가 객체를 찍을 때 부르는 메서드 이름을 쓰세요.
          code: |-
            public record LoginRequest(String email, String password) {
                @Override
                public String ___() {
                    return "LoginRequest[email=" + email + ", password=***]";
                }
            }
          answers:
            - [toString]
          explanation: |-
            `toString`이다. 로그뿐 아니라 문자열 연결·예외 메시지도 이것을 쓰므로,
            여기서 가리면 새는 경로가 한꺼번에 막힌다.
        problem:
          prompt: |-
            팀에 **"로그에 비밀번호를 찍지 말자"** 는 규칙이 있지만 반년에 한 번씩 또 발견됩니다.

            1. 규칙만으로 안 되는 이유
            2. 구조로 막는 방법 **두 가지**와 각각의 한계
            3. 이미 로그에 새어 나간 값을 발견했을 때 할 일
          deliverables:
            - 세 물음에 대한 답
            - 2번은 한계까지 함께
          hints:
            - 규칙을 지키는 주체가 누구인지 생각해 보세요.
            - 타입에서 막는 것과 길목에서 막는 것은 무엇이 다를까요?
            - 로그가 이미 퍼졌다면 값을 지우는 것만으로 끝날까요?
          modelAnswer: |-
            **1. 규칙만으로 안 되는 이유**

            규칙은 **사람이 매번 기억해야** 작동한다.
            새로 온 사람은 모르고, 급한 상황에서는 일단 찍고 보며, 리뷰에서도 놓친다.
            반년에 한 번 재발한다는 것 자체가 "기억에 기대는 방식은 실패한다"는 증거다.

            **2. 구조로 막는 두 가지**

            - **타입에서 막기** — 민감한 필드를 가진 타입의 `toString`을 가린다.
              *강점*: 어디서 찍든 안전하다. 호출자의 실수를 덮는다
              *한계*: 그 타입을 거치지 않고 **문자열이나 Map으로 다루는 경로**는 못 막는다
            - **길목에서 막기** — 공통 로깅에서 정해진 이름의 필드를 가린다.
              *강점*: 타입과 무관하게 걸린다
              *한계*: **이름 기준**이라 새 필드 이름(`pwd`, `secret` 등)이 생기면 목록을 늘려야 한다

            둘을 같이 쓴다. 어느 쪽도 혼자서는 완전하지 않다.

            **3. 이미 새어 나갔을 때**

            - **범위를 먼저 파악한다.** 언제부터, 어느 로그에, 어디까지 복사됐는지
              (수집 도구·백업·화면 공유 포함)
            - **값을 무효화한다.** 비밀번호라면 재설정을 요구하고, 토큰이라면 폐기한다.
              로그를 지우는 것만으로는 이미 본 사람을 되돌릴 수 없다
            - **찍던 코드를 고치고 재발 방지를 구조로** 넣는다 (2번)
            - 조직 규정에 따라 **보고·통지 절차**를 따른다

            순서가 중요하다 — 지우기보다 **무효화가 먼저**다.
          selfChecks:
            - 규칙의 한계를 "사람의 기억에 기댄다"로 설명했는가
            - 두 방법의 한계를 각각 적었는가 (장점만 나열하지 않았는가)
            - 유출 대응에서 **무효화가 지우기보다 먼저**라고 말했는가

      - key: LESSON.SECURITY.SENSITIVE_DATA_LOGGING.001.U3
        title: 오류를 남기되 사용자에게는 덜 말한다
        minutes: 10
        core: true
        explain: |-
          오류가 났을 때 두 방향을 갈라야 한다.

          - **서버 로그** — 원인을 찾을 수 있을 만큼 **자세히** 남긴다.
            예외 종류, 스택, 식별자, 요청 경로
          - **사용자 응답** — 필요한 만큼만 **간결하게** 준다.
            무엇이 잘못됐는지와 무엇을 하면 되는지

          응답에 스택이나 내부 정보를 담으면 **시스템 구조가 새어 나간다** —
          어떤 프레임워크, 어떤 테이블, 어떤 경로인지가 드러나고 다음 공격의 단서가 된다.

          두 방향을 잇는 것이 **추적 id**다. 응답에는 id만 주고 로그에는 그 id와 함께 자세히 남긴다.
          사용자가 "이 id로 문의합니다"라고 하면 그 줄을 찾을 수 있다.

          ```text
          응답  { "code": "INTERNAL_ERROR", "traceId": "<trace-id>" }
          로그  ERROR traceId=<trace-id> userId=17 path=/api/v1/orders ... (스택)
          ```

          로그인 실패처럼 **답 자체가 정보인 경우**는 응답을 일부러 뭉갠다 —
          "이메일이 없음"과 "비밀번호 틀림"을 나누지 않는다.
        example:
          language: java
          code: |-
            // 나쁜 예 — 내부가 그대로 나간다
            catch (DataAccessException e) {
                return ResponseEntity.status(500).body(e.getMessage());   // 질의문·테이블명이 샌다
            }

            // 좋은 예 — 로그는 자세히, 응답은 간결히
            catch (DataAccessException e) {
                String traceId = tracing.currentTraceId();
                log.error("order query failed traceId={} userId={}", traceId, userId, e);
                return problem(ErrorCode.INTERNAL_ERROR, traceId);
            }
          output: |-
            나쁜 예 응답
              could not execute statement; SQL [select * from orders where ...]
              → 테이블 구조와 질의가 드러난다

            좋은 예 응답
              { "code": "INTERNAL_ERROR", "traceId": "<trace-id>" }

            좋은 예 로그
              ERROR traceId=<trace-id> userId=17 ... (예외와 스택 전체)
          note: |-
            - 로그는 자세히, 응답은 간결히. **방향이 반대**다
            - 둘을 잇는 것은 **추적 id**다. 응답에는 그것만 준다
            - 스택을 응답에 담지 않는다. 구조가 새어 나간다
        predict:
          question: 예외 메시지를 그대로 응답 본문에 담으면 어떤 위험이 있나요?
          choices:
            - 테이블명·질의문 같은 내부 구조가 드러난다
            - 응답이 커져 느려질 뿐이다
            - 사용자가 더 정확히 이해해 좋다
            - 아무 위험이 없다. 어차피 오류다
          answer: 테이블명·질의문 같은 내부 구조가 드러난다
          explanation: |-
            프레임워크가 만든 예외 메시지에는 **질의문, 테이블·컬럼 이름, 파일 경로**가 섞여 있다.
            그것만으로 시스템의 생김새를 상당히 알 수 있고, 다음 시도를 좁히는 단서가 된다.
            사용자에게 필요한 것은 "무엇이 잘못됐고 무엇을 하면 되는가"이지 내부 사정이 아니다.
        complete:
          question: 응답과 로그를 잇는 값의 이름을 쓰세요.
          code: |-
            String ___ = tracing.currentTraceId();
            log.error("order query failed traceId={}", traceId, e);
          answers:
            - [traceId]
          explanation: |-
            추적 id를 응답에도 주고 로그에도 남기면,
            **응답은 간결하게 두면서도** 문의가 들어왔을 때 그 줄을 정확히 찾을 수 있다.
        problem:
          prompt: |-
            주문 API에서 DB 오류가 났을 때 이렇게 처리하고 있습니다.

            ```java
            catch (Exception e) {
                log.error(e.getMessage());
                return ResponseEntity.status(500).body(e.getMessage());
            }
            ```

            1. 로그 쪽 문제와 응답 쪽 문제를 각각
            2. 고친 코드
            3. 로그인 실패는 왜 다르게 다뤄야 하는지
          deliverables:
            - 세 물음에 대한 답
            - 2번은 코드로
          hints:
            - 로그에 스택이 남았는지 보세요.
            - 응답에 담긴 것이 사용자에게 필요한 정보인가요?
            - 로그인 실패에서는 답 자체가 정보가 될 수 있습니다.
          modelAnswer: |-
            **1. 두 쪽의 문제**

            - **로그** — `e.getMessage()`만 남겨 **스택이 없다.** 어디서 났는지 알 수 없어
              원인 추적이 거의 불가능하다. 식별자(userId·traceId)도 없다
            - **응답** — 예외 메시지를 그대로 줘서 **내부 구조가 샌다.**
              사용자는 그 문장으로 할 수 있는 일도 없다

            방향이 정확히 반대로 됐다 — 로그는 빈약하고 응답은 과하다.

            **2. 고친 코드**

            ```java
            catch (DataAccessException e) {
                String traceId = tracing.currentTraceId();
                log.error("order query failed traceId={} userId={}", traceId, userId, e);
                return problem(ErrorCode.INTERNAL_ERROR, traceId);
            }
            ```

            예외 객체를 마지막 인자로 넘겨 **스택까지** 남기고,
            응답에는 코드와 추적 id만 준다. `Exception`이 아니라 다룰 수 있는 예외를 잡는다.

            **3. 로그인 실패가 다른 이유**

            보통은 "무엇이 잘못됐는지"를 알려 주는 것이 좋지만,
            로그인 실패에서는 **그 답 자체가 정보**다.
            "가입되지 않은 이메일"과 "비밀번호가 틀림"을 나누면
            **어떤 이메일이 가입돼 있는지 알려 주는 셈**이 된다.
            그래서 응답은 하나로 합치고, **서버 로그에만** 실제 이유를 남긴다.
          selfChecks:
            - 로그의 문제를 "스택이 없다"로, 응답의 문제를 "내부가 샌다"로 갈랐는가
            - 고친 코드에서 예외 객체를 로그에 넘기고 응답에는 traceId만 두었는가
            - 로그인 실패를 "답 자체가 정보"로 설명했는가

    commonMistakes:
      - 해시로 저장해 놓고 로그에는 요청 본문을 통째로 찍는다. 평문이 그대로 남는다 (U1)
      - 규칙으로만 막으려 한다. 사람이 기억해야 하는 방식은 반복해서 새어 나간다 (U2)
      - 예외 메시지를 응답에 그대로 담는다. 테이블명·질의문이 드러난다 (U3)
    inProject: |-
      주문 시스템에 로그인과 결제를 붙일 때 바로 쓴다.
      요청 타입의 `toString`에서 비밀번호·토큰을 가려 두고(U2),
      공통 로깅에서도 이름 기준으로 한 번 더 거른다.
      오류 처리는 **로그는 스택까지, 응답은 코드와 추적 id만**으로 통일한다(U3).
      로그인 실패 메시지는 하나로 합치고 실제 이유는 로그에만 남긴다.
      이미 찍고 있는 로그를 한 번 훑어 값이 섞인 줄이 있는지 확인하는 것도 이 단계에서 한다(U1).
