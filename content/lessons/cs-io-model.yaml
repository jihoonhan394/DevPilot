# DevPilot 개념 노트 — 기다리는 동안 무엇을 할 수 있나
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 4단계(배포와 로그 확인)에서 쓴다. CS.OS_PROCESS_THREAD를 먼저 본 것으로 전제한다
# - 예제는 주문 시스템 상황으로 쓴다 (CV-134)
lessons:
  - key: LESSON.CS.IO_MODEL.001
    skillCode: CS.IO_MODEL
    title: 기다리는 동안 무엇을 할 수 있나 (I/O 모델)
    whyItMatters: |-
      웹 애플리케이션이 쓰는 시간의 대부분은 **계산이 아니라 기다림**이다.
      DB 응답, 바깥 API 응답, 디스크. 그 기다리는 동안 스레드가 묶여 있느냐
      아니냐가 "동시에 몇 명을 받을 수 있나"를 정한다.
      이걸 모르면 스레드 수만 만지다가 메모리가 먼저 바닥나고, 가상 스레드 같은
      선택지를 **왜 쓰는지 모른 채** 쓰거나 안 쓰게 된다.
    oneLine: 기다리는 동안 스레드를 묶어 두느냐 놓아 주느냐가 동시 처리 수를 정한다.
    units:
      - key: LESSON.CS.IO_MODEL.001.U1
        title: 요청 하나에 스레드 하나
        minutes: 10
        core: true
        explain: |-
          가장 단순한 방식이자 지금도 기본인 방식이다 — **요청 하나에 스레드 하나**를 붙인다.

          코드가 읽기 쉽다는 것이 큰 장점이다. 위에서 아래로 읽히고,
          예외가 나면 그 자리에서 잡히고, 스택 추적에 **지나온 길이 그대로** 남는다.

          대가는 기다림이다. DB를 부르면 그 스레드는 답이 올 때까지
          **아무것도 못 하고 묶여 있다.**

          ```text
          요청 처리 100ms 중
            DB 대기      70ms   ← 스레드가 묶인 채 논다
            바깥 API     20ms   ← 〃
            실제 계산    10ms
          ```

          90%를 노는 데 쓰는 셈이다. 그래서 동시 접속 수를 늘리려면
          **노는 스레드를 더 만드는 수밖에** 없고, 스레드마다 스택 메모리가 붙는다.
          수천 개를 만들면 메모리가 먼저 바닥난다.
        example:
          language: java
          code: |-
            @GetMapping("/orders/{id}")
            public OrderView get(@PathVariable UUID id) {
                Order order = orderRepository.findById(id)   // 여기서 스레드가 멈춰 기다린다
                        .orElseThrow(() -> new NotFoundException("order not found"));

                PaymentStatus paid = paymentPort.status(order.getPaymentId());  // 또 기다린다

                return OrderView.of(order, paid);
            }
          output: |-
            스레드 하나가 겪는 시간
              t=0ms    findById 호출 → 묶임
              t=70ms   결과 도착 → 깨어남
              t=71ms   status 호출 → 다시 묶임
              t=91ms   결과 도착
              t=100ms  응답 완료

            묶여 있던 시간 90ms / 실제 일한 시간 10ms
          note: |-
            - 코드에 "기다린다"가 안 보인다. 그냥 메서드 호출처럼 생겼다 — 읽기 쉬운 이유이자 잊기 쉬운 이유다
            - 스택 추적에 `get` → `findById`가 그대로 남아 디버깅이 쉽다
            - 스레드 풀 크기가 곧 **동시 처리 가능 수**다
            - 90%를 기다린다는 것은 스레드 수를 10배로 두면 같은 하드웨어로 10배를 받는다는 뜻이기도 하다
        predict:
          question: 요청 하나가 90ms를 기다리고 10ms만 계산한다. 스레드 풀이 10개면 이론상 초당 몇 건인가?
          choices:
            - 100건 — 스레드 하나가 초당 10건을 처리한다
            - 10건
            - 1000건
            - 계산할 수 없다
          answer: 100건 — 스레드 하나가 초당 10건을 처리한다
          explanation: |-
            요청 하나가 100ms를 쓰므로 스레드 하나는 초당 10건, 열 개면 100건이다.
            **계산이 10ms뿐인데도** 처리량이 그것에 묶이지 않고 전체 시간에 묶인다.
            기다림을 줄이거나 스레드를 늘리는 것 말고는 방법이 없는 구조다.
        complete:
          question: 묶이는 자리를 표시하세요.
          code: |-
            Order order = orderRepository.___(id)      // 스레드가 묶인다 (DB 대기)
                    .orElseThrow(...);

            PaymentStatus paid = paymentPort.___(order.getPaymentId());  // 또 묶인다
          answers:
            - [findById]
            - [status]
          explanation: |-
            둘 다 평범한 메서드 호출처럼 보이지만 **안에서 네트워크를 기다린다.**
            코드만 봐서는 안 보이는 것이 이 방식의 함정이다.
        problem:
          prompt: |-
            주문 시스템에서 **기다리는 시간과 계산하는 시간을 나눠** 재 보세요.

            - 주문 조회 끝점에서 DB 호출 전후, 바깥 호출 전후 시각을 찍습니다
            - 요청 하나의 전체 시간 중 **기다린 비율**을 계산하세요
            - 스레드 풀을 4로 줄이고 동시 요청 8건을 넣어 뒤의 4건이 얼마나 기다리는지 보세요
            - 그 수치로 "지금 하드웨어에서 초당 몇 건까지 가능한가"를 계산하세요
          deliverables:
            - 구간별 소요 시간과 기다린 비율
            - 풀 4일 때 뒤의 요청이 기다린 시간
            - 이론상 처리량 계산과 근거
          hints:
            - 시각은 나노초로 찍고 밀리초로 바꾸면 보기 좋습니다.
            - 동시 요청은 여러 개를 백그라운드로 동시에 보내면 됩니다.
            - 처리량 = 스레드 수 ÷ 요청 하나의 시간입니다.
          modelAnswer: |-
            ```text
            구간별 (단일 요청)
              DB 조회        68ms
              결제 상태 조회 19ms
              직렬화·기타     7ms
              합계           94ms   → 기다린 비율 87/94 = 93%

            풀 4 / 동시 8건
              1~4번째  94ms 에 완료
              5~8번째  188ms 에 완료  (앞의 4건이 끝나야 시작)

            이론상 처리량 = 4 ÷ 0.094s ≈ 42 req/s
            ```

            93%가 기다림이라는 것이 이 과제의 숫자다. **하드웨어가 놀고 있다.**
            CPU 사용률을 보면 한 자리 수인데 처리량은 42건에서 막힌다.

            여기서 갈 수 있는 길이 셋이다.
            1. **기다림을 줄인다** — 인덱스를 걸어 68ms를 5ms로 (가장 크게 듣는다)
            2. **스레드를 늘린다** — 42 → 400. 대신 메모리가 스레드 수만큼 든다
            3. **기다리는 동안 스레드를 놓아 준다** — U2에서 본다

            1번이 언제나 먼저다. 68ms가 5ms가 되면 처리량이 저절로 10배가 되고
            메모리도 안 든다. **모델을 바꾸기 전에 쿼리를 본다.**
          selfChecks:
            - 구간별 시간을 실제로 쟀는가
            - 기다린 비율을 계산했는가
            - 풀을 줄였을 때 뒤의 요청이 기다리는 것을 봤는가
            - 처리량을 스레드 수와 요청 시간으로 계산했는가
      - key: LESSON.CS.IO_MODEL.001.U2
        title: 기다리는 동안 스레드를 놓아 주기
        minutes: 12
        core: true
        explain: |-
          기다리는 동안 스레드를 **놓아 줄 수** 있다면, 같은 스레드 수로 훨씬 많이 받는다.
          방법은 크게 둘이다.

          | 방법 | 코드가 | 대가 |
          |---|---|---|
          | 콜백·리액티브 | 흐름이 쪼개진다 | 읽기 어렵고 스택 추적이 끊긴다 |
          | **가상 스레드** | 그대로다 | 거의 없다 (조건이 있다) |

          가상 스레드는 **똑같이 생긴 코드**로 이걸 해 준다. `findById`를 부르면
          기다리는 동안 그 가상 스레드가 진짜 스레드에서 내려오고,
          답이 오면 다시 올라온다. **코드는 위에서 아래로 그대로** 읽힌다.

          그래서 U1의 코드를 한 줄도 안 고치고 동시 처리 수를 크게 올릴 수 있다.

          다만 조건이 있다. **`synchronized` 안에서 기다리면** 가상 스레드가
          내려오지 못하고 진짜 스레드를 붙든 채로 있다. 이러면 이점이 사라진다.
          락이 필요하면 `ReentrantLock` 쪽을 쓴다.
        example:
          language: yaml
          code: |-
            # application.yml — 요청 처리를 가상 스레드로
            spring:
              threads:
                virtual:
                  enabled: true
          output: |-
            같은 코드, 같은 하드웨어 (요청 하나 94ms, 93%가 대기)

            플랫폼 스레드 200개
              동시 200건, 메모리 +200MB 남짓
            가상 스레드
              동시 수천 건, 메모리는 대기 중인 요청 수에 비례해 훨씬 적다

            주의: DB 연결 풀이 20이면 거기서 다시 줄을 선다
          note: |-
            - 설정 한 줄이지만 **바뀌는 것은 요청을 받는 방식 전체**다
            - 병목이 DB 연결이나 바깥 API 쪽이면 가상 스레드를 켜도 처리량이 안 는다
            - '`synchronized` 블록 안의 대기는 가상 스레드의 이점을 없앤다'
            - 켜기 전에 U1의 "어디서 기다리나"를 먼저 재 둔다. 안 그러면 좋아졌는지 알 수 없다
        predict:
          question: 가상 스레드를 켰는데 처리량이 거의 안 늘었다. 가장 먼저 볼 곳은?
          choices:
            - DB 연결 풀처럼 스레드 밖의 한도
            - JVM 힙 크기
            - 컨트롤러 매핑
            - 로그 레벨
          answer: DB 연결 풀처럼 스레드 밖의 한도
          explanation: |-
            가상 스레드는 **스레드가 병목일 때만** 듣는다. 동시에 DB를 쓸 수 있는 수가
            20개면 요청을 수천 개 받아도 20개씩만 일한다.
            `CS.OS_PROCESS_THREAD` U3에서 본 "병목은 옮겨 간다"가 여기서도 같다.
        complete:
          question: 가상 스레드를 켜는 설정을 채우세요.
          code: |-
            spring:
              ___:
                virtual:
                  ___: true
          answers:
            - [threads]
            - [enabled]
          explanation: |-
            설정은 두 줄이지만, 켜기 전에 **어디서 기다리는지**를 재 두어야
            켠 뒤의 숫자를 해석할 수 있다. 안 그러면 "켰는데 왜 그대로지"에서 멈춘다.
        problem:
          prompt: |-
            U1에서 잰 끝점을 **가상 스레드로 바꿔 비교**하세요.

            - 먼저 플랫폼 스레드(풀 20)로 동시 200건을 넣고 처리량과 지연을 잽니다
            - 가상 스레드를 켜고 같은 부하를 넣어 같은 값을 잽니다
            - DB 연결 풀을 5로 줄여 놓고 다시 재서, **가상 스레드가 안 듣는 경우**를 만드세요
            - 세 경우를 표로 정리하고 각각 무엇이 병목이었는지 적으세요
          deliverables:
            - 세 경우의 처리량과 지연
            - 각 경우의 병목
            - 가상 스레드가 듣는 조건 한 문장
          hints:
            - 동시 요청은 간단한 부하 도구나 스크립트로 만들 수 있습니다.
            - 잴 때 스레드 덤프를 같이 떠 두면 병목이 눈에 보입니다.
            - 지연은 평균보다 느린 쪽(상위 몇 %)을 보는 것이 낫습니다.
          modelAnswer: |-
            ```text
            설정                              처리량     느린 쪽 지연   병목
            플랫폼 20 / 연결 20               210 req/s   940ms        스레드 20개
            가상 스레드 / 연결 20             215 req/s   920ms        DB 연결 20개
            가상 스레드 / 연결 5               54 req/s  3700ms        DB 연결 5개
            ```

            둘째 줄이 이 과제의 핵심이다. **가상 스레드를 켰는데 거의 그대로였다.**
            덤프를 떠 보니 대부분이 `HikariPool.getConnection`에 서 있었다 —
            스레드는 넉넉해졌는데 **DB 연결에서 다시 줄을 선 것**이다.

            연결을 60으로 올리자 그제야 780 req/s가 나왔다. 즉 가상 스레드가
            한 일은 "스레드라는 병목을 없앤 것"이고, **그다음 병목은 그대로 남아 있었다.**

            듣는 조건 한 문장:
            **스레드가 병목일 때만 듣는다. 기다리는 대상 쪽에 한도가 있으면
            그 한도가 새 병목이 된다.**

            그래서 순서는 U1과 같다 — 재고, 어디서 기다리는지 보고, 그 자리를 고친다.
            가상 스레드는 그 도구 중 하나일 뿐 먼저 켜는 스위치가 아니다.
          selfChecks:
            - 세 경우를 실제로 재서 표로 만들었는가
            - 각 경우의 병목을 덤프나 근거로 짚었는가
            - 가상 스레드가 안 듣는 경우를 직접 만들었는가
            - 듣는 조건을 한 문장으로 말할 수 있는가
      - key: LESSON.CS.IO_MODEL.001.U3
        title: 운영체제는 어떻게 기다리나
        minutes: 10
        core: true
        explain: |-
          한 층 아래를 보면 왜 이런 선택지가 있는지가 보인다.
          운영체제가 "기다리기"를 제공하는 방식이 둘이기 때문이다.

          | 방식 | 부르면 | 쓰는 곳 |
          |---|---|---|
          | 막히는 읽기 | 데이터가 올 때까지 **그 자리에서 잔다** | U1 방식 |
          | 준비된 것 알려 주기 | **여러 연결 중 준비된 것**을 한 번에 알려 준다 | U2 방식의 바닥 |

          두 번째가 있어야 "스레드 하나로 연결 수천 개"가 가능해진다.
          스레드 하나가 "이 중에 답이 온 것 있어?"라고 묻고, 온 것만 처리한다.

          가상 스레드도 바닥에서는 이걸 쓴다. 기다리는 가상 스레드를 잠시 치워 두고,
          운영체제가 "이 연결 준비됐어"라고 알려 주면 그때 다시 올린다.
          **개발자에게는 U1처럼 보이고, 바닥에서는 두 번째 방식으로 돈다.**

          그래서 `jcmd`로 본 `RUNNABLE`이 헷갈렸던 것도 설명된다 —
          소켓 읽기에서 자는 것은 운영체제가 재우는 것이라 JVM은 그것을 모른다.
        example:
          language: text
          code: |-
            # 그 프로세스가 무슨 시스템 호출에서 기다리는지
            $ cat /proc/2317/task/2401/stack 2>/dev/null | head -3

            # 어떤 파일/소켓을 들고 있는지
            $ ls -l /proc/2317/fd | head -5
            lrwx------ 1 app app 64 ... 12 -> socket:[184722]
            lrwx------ 1 app app 64 ... 13 -> socket:[184730]

            # 지금 몇 개나 들고 있나 (연결 수와 비슷하게 움직인다)
            $ ls /proc/2317/fd | wc -l
            287
          output: |-
            fd 수가 요청 수를 따라 움직인다
              평상시     40
              부하 중    287
              한도 넘으면 "Too many open files"

            $ cat /proc/2317/limits | grep 'open files'
            Max open files   1024   4096   files
          note: |-
            - 소켓 하나가 파일 서술자 하나다. 연결이 늘면 이 숫자가 는다
            - 동시 연결을 크게 늘리려면 **파일 서술자 한도**도 같이 올려야 한다
            - '`Too many open files`는 메모리 문제로 보이지만 이 한도 문제다'
            - 가상 스레드로 동시 연결을 크게 늘릴 때 가장 먼저 만나는 벽이 이것이다
        predict:
          question: 가상 스레드를 켜고 동시 연결을 크게 늘렸더니 `Too many open files`가 났다면?
          choices:
            - 파일 서술자 한도를 올려야 한다
            - 힙 메모리를 늘려야 한다
            - 스레드 풀을 줄여야 한다
            - 가상 스레드를 꺼야 한다
          answer: 파일 서술자 한도를 올려야 한다
          explanation: |-
            연결 하나가 서술자 하나다. 동시 연결이 한도를 넘으면 새 연결을 못 받는다.
            **가상 스레드가 스레드 병목을 없애자 다음 한도가 드러난 것**이고,
            U2에서 본 "병목은 옮겨 간다"의 또 다른 모습이다.
        complete:
          question: 서술자 수와 한도를 확인하는 명령을 채우세요.
          code: |-
            # 지금 몇 개 들고 있나
            $ ls /proc/2317/___ | wc -l

            # 한도는 얼마인가
            $ cat /proc/2317/___ | grep 'open files'
          answers:
            - [fd]
            - [limits]
          explanation: |-
            `/proc/<pid>/fd`가 지금 들고 있는 것이고 `/proc/<pid>/limits`가 한도다.
            **부하 중에 둘을 같이 보면** 한도에 얼마나 가까운지 바로 알 수 있다.
        problem:
          prompt: |-
            주문 시스템에서 **연결 수와 서술자 수가 같이 움직이는 것**을 확인하세요.

            - 평상시 `/proc/<pid>/fd` 개수를 셉니다
            - 동시 연결을 늘려 가며(50 → 200 → 500) 개수 변화를 기록합니다
            - 한도를 아주 낮게(예: 64) 줄이고 부하를 넣어 **어떤 오류가 나는지** 보세요
            - 그 오류가 로그에 어떻게 보이는지와, 무엇을 보고 이 원인이라고 판단할지 적으세요
          deliverables:
            - 동시 연결별 서술자 수
            - 한도를 낮췄을 때의 오류 메시지
            - 이 원인이라고 판단하는 근거
          hints:
            - 한도는 프로세스를 띄울 때 ulimit으로 낮출 수 있습니다.
            - fd 수는 부하가 걸린 동안 세어야 합니다.
            - 오류 메시지는 예상과 다른 곳에서 나올 수 있습니다.
          modelAnswer: |-
            ```text
            동시 연결   fd 수
              0(평상시)    41
              50           96
              200          249
              500          551

            한도 64로 낮추고 부하
              java.net.SocketException: Too many open files
                at sun.nio.ch.Net.accept(Native Method)
              → 새 연결을 받는 자리에서 났다. 기존 연결은 멀쩡하다
            ```

            fd 수가 **연결 수 + 40 정도**로 거의 정확히 따라갔다.
            40은 평상시에 들고 있는 것(로그 파일, DB 연결, JAR 등)이다.

            판단 근거:
            - 메시지에 `Too many open files`가 그대로 나온다 — 찾기는 쉽다
            - 난 자리가 `accept`다 → **새 연결을 못 받는 것**이지 기존 처리가 깨진 게 아니다
            - 그래서 증상은 "일부는 되고 일부는 연결조차 안 됨"으로 보인다

            마지막 줄이 함정이다. 일부가 되니까 "서버는 살아 있는데 간헐적으로
            안 돼요"로 보고되고, 코드나 네트워크를 의심하게 된다.
            **fd 수와 한도를 한 번 세어 보면 1분 만에 끝난다.**

            그래서 동시 연결을 크게 늘리는 설정(가상 스레드 포함)을 켤 때는
            한도도 같이 본다. 켜는 것과 한도를 올리는 것은 한 작업이다.
          selfChecks:
            - 연결 수에 따라 fd 수가 움직이는 것을 봤는가
            - 한도를 낮춰 오류를 실제로 냈는가
            - 오류가 난 자리(accept)를 확인했는가
            - 증상이 "간헐적"으로 보이는 이유를 설명할 수 있는가
    commonMistakes:
      - 처리량이 안 나오면 스레드부터 늘린다. 대개는 기다리는 시간을 줄이는 쪽이 크게 듣는다 (U1)
      - 가상 스레드를 켜고 좋아졌는지 확인하지 않는다. 병목이 딴 데면 그대로다 (U2)
      - 동시 연결을 늘리면서 파일 서술자 한도를 안 본다 (U3)
    inProject: |-
      4단계에서 주문 시스템에 부하를 걸어 볼 때 U1의 측정(어디서 기다리나)을 먼저 한다.
      `CS.OS_PROCESS_THREAD` U3의 덤프가 "어디에 몰려 있나"를 알려 주고,
      이 노트가 "그래서 무엇을 바꿀 수 있나"를 알려 준다.
      가상 스레드를 켜는 것은 마지막이다 — 쿼리와 타임아웃을 먼저 손보고,
      켤 때는 연결 풀과 파일 서술자 한도를 같이 본다.
