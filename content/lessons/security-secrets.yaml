# DevPilot 개념 노트 — 비밀 값을 코드에 두지 않는다 (시크릿 관리)
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 민감정보 로깅 노트가 "값이 로그로 새는 경로"를 다룬다. 여기서는 "값을 어디에 둘 것인가"를 다룬다
# - 실제 키·비밀번호는 절대 쓰지 않는다. 자리표시자만 쓴다
lessons:
  - key: LESSON.SECURITY.SECRET_MANAGEMENT.001
    skillCode: SECURITY.SECRET_MANAGEMENT
    title: 비밀 값을 코드에 두지 않는다 (시크릿 관리)
    whyItMatters: |-
      DB 비밀번호나 API 키를 설정 파일에 적고 그대로 커밋하는 일은 지금도 흔하다.
      저장소가 공개든 비공개든, **한 번 커밋되면 기록에 영원히 남는다** —
      다음 커밋에서 지워도 이전 커밋에 그대로 있다.
      그래서 "지웠으니 됐다"가 아니라 **그 값을 바꿔야** 끝난다.
      처음부터 코드 밖에 두면 이 일 자체가 생기지 않는다.
    oneLine: 비밀 값은 **코드 밖(환경 변수·시크릿 저장소)** 에 두고, 코드에는 **어디서 읽을지만** 적는다.
    units:
      - key: LESSON.SECURITY.SECRET_MANAGEMENT.001.U1
        title: 커밋되면 지워도 남는다
        minutes: 10
        core: true
        explain: |-
          Git은 **모든 커밋을 보관**한다. 파일에서 값을 지우고 다시 커밋해도
          **이전 커밋에는 그대로** 있고, 이미 받아 간 사람의 복제본에도 남는다.

          그래서 유출을 발견했을 때 순서가 정해져 있다.

          1. **값을 무효화한다** — 비밀번호를 바꾸고, 키를 폐기하고 새로 발급받는다.
             이것이 **가장 먼저**다. 기록을 지우는 것보다 앞선다
          2. **코드를 고친다** — 값을 밖으로 빼고 `.gitignore`에 넣는다
          3. 필요하면 기록을 정리한다 — 어렵고, 이미 퍼진 것은 되돌릴 수 없다

          "비공개 저장소니까 괜찮다"도 위험하다. 권한이 바뀌거나 공개로 전환되거나
          복제본이 다른 곳에 올라갈 수 있다. **비밀 값의 안전이 저장소 설정에 기대면 안 된다.**

          코드에 두면 안 되는 것들은 대체로 이렇다 —
          DB 비밀번호, API 키·토큰, 암호화 키, 인증서 개인 키, 외부 서비스 접속 정보.
        example:
          language: text
          code: |-
            # 이렇게 커밋했다가
            spring.datasource.password=<실제-비밀번호>

            # 다음 커밋에서 지운다
            spring.datasource.password=${DB_PASSWORD}

            # 그래도 이전 커밋에는 남아 있다
            git log -p -- src/main/resources/application.properties
          output: |-
            git log 로 이전 커밋을 열면
              -spring.datasource.password=<실제-비밀번호>
              +spring.datasource.password=${DB_PASSWORD}

            → 값이 그대로 보인다. 이미 복제한 사람의 저장소에도 있다
            → 지우는 것으로 끝나지 않는다. 그 비밀번호를 바꿔야 한다
          note: |-
            - 지우는 커밋은 **현재 상태만** 바꾼다. 기록은 남는다
            - 발견하면 **무효화가 먼저**, 코드 수정은 그다음이다
            - "비공개 저장소"는 안전 장치가 아니다
        predict:
          question: 비밀번호를 커밋했다가 다음 커밋에서 지웠습니다. 저장소에서 그 값을 볼 수 있나요?
          choices:
            - 볼 수 있다. 이전 커밋에 그대로 남아 있다
            - 볼 수 없다. 최신 파일에서 지웠다
            - Git이 자동으로 이전 기록도 지운다
            - 비공개 저장소라면 볼 수 없다
          answer: 볼 수 있다. 이전 커밋에 그대로 남아 있다
          explanation: |-
            Git은 변경 이력을 전부 보관한다. `git log -p` 한 줄이면 이전 내용이 나온다.
            이미 복제해 간 사람의 저장소에도 남아 있어서 **내가 통제할 수 없다.**
            그래서 지우는 것으로는 끝나지 않고 **그 값 자체를 바꿔야** 한다.
        complete:
          question: 설정 파일에서 값을 직접 쓰지 않고 환경 변수를 읽도록 채우세요.
          code: |-
            spring.datasource.password=${___}
          answers:
            - [DB_PASSWORD]
          explanation: |-
            값 대신 **어디서 읽을지**만 적는다. 실제 값은 실행 환경이 준다.
            이렇게 두면 그 파일을 커밋해도 비밀이 새지 않는다.
        problem:
          prompt: |-
            동료가 실수로 API 키를 커밋해 push했습니다. 바로 다음 커밋에서 지우고
            **"지웠으니 괜찮다"** 고 합니다.

            1. 왜 괜찮지 않은지
            2. 지금 해야 할 일을 **순서대로**
            3. 다시 생기지 않게 하려면 무엇을 두어야 하는지
          deliverables:
            - 세 물음에 대한 답
            - 2번은 순서가 드러나게
          hints:
            - Git이 무엇을 보관하는지 떠올려 보세요.
            - 이미 그 값을 본 사람이 있다면 무엇부터 해야 할까요?
            - 사람이 매번 조심하는 방식은 오래가지 않습니다.
          modelAnswer: |-
            **1. 왜 괜찮지 않은가**

            Git은 모든 커밋을 보관하므로 **이전 커밋에 값이 그대로** 있다.
            push까지 됐다면 원격에도 있고, 이미 복제한 사람의 저장소에도 있다.
            내가 통제할 수 없는 사본이 생긴 것이다.

            **2. 순서대로 할 일**

            1. **키를 폐기하고 새로 발급받는다.** 가장 먼저다 —
               기록을 정리하는 동안에도 옛 키는 계속 유효하기 때문이다
            2. **새 키를 코드 밖에** 둔다. 환경 변수나 시크릿 저장소로 옮기고
               설정 파일에는 참조만 남긴다
            3. **`.gitignore`에 로컬 설정 파일을 추가**하고, 커밋된 적이 있다면 추적에서 뺀다
            4. 필요하면 **기록 정리**를 검토한다. 다만 이미 퍼진 사본은 되돌릴 수 없으므로
               1번을 대신하지 못한다
            5. 그 키로 **무엇이 일어났는지** 접근 기록을 확인한다

            **3. 다시 생기지 않게**

            - **커밋 전에 비밀 값을 찾아내는 검사**를 둔다(로컬 훅이나 CI).
              사람이 기억하는 대신 도구가 막는다
            - **예시 파일만 커밋한다** — `application.example.properties`처럼
              키 이름만 있고 값은 비어 있는 파일. 실제 파일은 `.gitignore`에 둔다
          selfChecks:
            - 이전 커밋과 복제본이 남는다는 점을 짚었는가
            - '**무효화(재발급)를 가장 먼저**에 두었는가'
            - 재발 방지를 도구·구조로 제시했는가 (조심하자가 아니라)

      - key: LESSON.SECURITY.SECRET_MANAGEMENT.001.U2
        title: 어디서 읽을지만 코드에 적는다
        minutes: 12
        core: true
        explain: |-
          비밀 값을 밖에 두는 방법은 여럿이고, 환경에 따라 고른다.

          - **환경 변수** — 가장 단순하다. 실행할 때 주입한다.
            다만 프로세스 목록이나 오류 덤프에 드러날 수 있으니 값을 로그에 찍지 않는다
          - **파일** — 배포 서버에 권한을 좁힌 파일로 두고 읽는다.
            `.gitignore`에 반드시 넣는다
          - **시크릿 저장소** — 값을 맡기고 필요할 때 받아 온다.
            교체·접근 기록이 남는 것이 장점이다

          Spring은 어느 쪽이든 **같은 방식으로 읽는다.**
          설정 파일에 `${ENV_NAME}`으로 적어 두면 환경 변수나 실행 인자에서 값을 찾는다.
          코드에는 **값이 아니라 이름만** 남는다.

          기본값을 주는 문법(`${DB_PASSWORD:기본값}`)은 편하지만 **비밀 값에는 쓰지 않는다** —
          환경 변수를 빠뜨렸을 때 조용히 기본값으로 뜨고, 그게 개발용 값이면 운영에 그대로 나간다.
          **값이 없으면 기동에 실패하는 편이 낫다.** 실패는 배포할 때 알지만,
          조용히 뜨면 사고가 난 뒤에 안다.
        example:
          language: text
          code: |-
            # application.properties — 이름만 적는다
            spring.datasource.url=${DB_URL}
            spring.datasource.username=${DB_USERNAME}
            spring.datasource.password=${DB_PASSWORD}

            # 비밀이 아닌 값에는 기본값을 줘도 된다
            server.port=${PORT:8080}

            # .gitignore
            .env
            application-local.properties
          output: |-
            환경 변수를 주고 실행
              DB_PASSWORD=<값> java -jar app.jar     → 정상 기동

            환경 변수를 빠뜨리고 실행
              java -jar app.jar
              → Could not resolve placeholder 'DB_PASSWORD'
              → 기동 실패. 배포 시점에 바로 안다
          note: |-
            - 코드에는 **이름만**, 값은 실행 환경이 준다
            - 비밀 값에 **기본값을 주지 않는다.** 없으면 기동 실패가 낫다
            - 비밀이 아닌 값(포트 등)에는 기본값이 편하다
        predict:
          question: '`spring.datasource.password=${DB_PASSWORD:devpass}`로 두고 운영에서 환경 변수를 빠뜨리면?'
          choices:
            - 개발용 값으로 조용히 기동한다. 사고가 난 뒤에 안다
            - 기동에 실패해 바로 알 수 있다
            - 경고만 남기고 비밀번호 없이 뜬다
            - Spring이 운영 환경을 감지해 막는다
          answer: 개발용 값으로 조용히 기동한다. 사고가 난 뒤에 안다
          explanation: |-
            기본값이 있으면 **빠뜨려도 뜬다.** 그게 편해 보이지만 비밀 값에서는 위험하다.
            개발용 비밀번호로 운영 DB에 붙으려다 실패하거나,
            더 나쁘게는 **개발 DB에 붙어 운영인 줄 알고 쓰게** 된다.
            비밀 값은 **없으면 실패**가 맞다 — 배포 시점에 알 수 있기 때문이다.
        complete:
          question: 비밀이 아닌 포트에는 기본값을 주고, 비밀번호에는 주지 않도록 채우세요.
          code: |-
            server.port=${PORT:___}
            spring.datasource.password=${___}
          answers:
            - ['8080']
            - [DB_PASSWORD]
          explanation: |-
            포트는 없어도 기본값으로 뜨는 편이 편하고 위험하지 않다.
            비밀번호는 기본값 없이 두어 **빠뜨리면 기동에 실패**하게 한다.
        problem:
          prompt: |-
            팀 설정 파일이 이렇습니다.

            ```text
            spring.datasource.url=jdbc:postgresql://localhost:5432/shop
            spring.datasource.username=app
            spring.datasource.password=devpass
            app.external-api.key=${API_KEY:test-key}
            ```

            1. 각 줄을 **그대로 둘 것 / 밖으로 뺄 것**으로 나누고 이유
            2. `${API_KEY:test-key}`의 문제
            3. 팀원이 로컬에서 쉽게 실행하게 하면서 값은 커밋하지 않는 방법
          deliverables:
            - 세 물음에 대한 답
            - 3번은 구체적인 파일 구성으로
          hints:
            - 새면 곤란한 값과 그렇지 않은 값을 갈라 보세요.
            - 기본값이 운영에서 어떻게 동작할지 생각해 보세요.
            - 값은 빼되 무엇이 필요한지는 알려 줘야 합니다.
          modelAnswer: |-
            **1. 나누기**

            - `url` — **밖으로.** 운영 주소가 드러나고 환경마다 다르다
            - `username` — **밖으로.** 접속 정보의 절반이다
            - `password` — **반드시 밖으로.** 지금 평문으로 커밋돼 있다
            - `app.external-api.key` — **밖으로.** 이미 참조 형태지만 기본값이 문제다(2번)

            기준은 "새면 곤란한가"와 "환경마다 다른가"다. 둘 중 하나라도 해당하면 뺀다.

            **2. `${API_KEY:test-key}`의 문제**

            환경 변수를 빠뜨려도 **`test-key`로 조용히 뜬다.**
            운영에서 외부 호출이 실패하거나, 더 나쁘게는 테스트 계정으로 붙어
            **운영인 줄 알고 쓰게** 된다. 비밀 값에는 기본값을 주지 않는다 —
            `${API_KEY}`로 두면 없을 때 기동에 실패해 배포 시점에 알 수 있다.

            **3. 로컬 실행을 쉽게 하면서 값은 안 남기기**

            ```text
            application.properties            커밋함. ${DB_PASSWORD} 같은 참조만
            .env.example                      커밋함. 키 이름만, 값은 비어 있음
            .env                              .gitignore. 각자 자기 값을 채움
            ```

            새로 온 사람은 `.env.example`을 복사해 `.env`로 만들고 값만 채우면 된다.
            **무엇이 필요한지는 알려 주되 값은 저장소에 남지 않는다.**
            여기에 커밋 전 비밀 값 검사를 더하면 실수로 `.env`를 올리는 것도 막힌다.
          selfChecks:
            - 네 줄을 기준(새면 곤란한가·환경마다 다른가)으로 갈랐는가
            - 기본값 문제를 "조용히 뜬다"로 설명했는가
            - 예시 파일 + `.gitignore` 구성을 구체적으로 적었는가

      - key: LESSON.SECURITY.SECRET_MANAGEMENT.001.U3
        title: 바꿀 수 있게 만들어 둔다
        minutes: 10
        core: true
        explain: |-
          비밀 값은 **언젠가 반드시 바꾸게 된다.** 유출됐거나, 사람이 바뀌었거나,
          주기적으로 바꾸기로 했거나. 그때 바꾸기 어려우면 미루게 되고, 미루면 위험이 쌓인다.

          바꾸기 쉬우려면 두 가지가 필요하다.

          - **값이 한 곳에만 있다.** 코드 여기저기에 복사돼 있으면 어디를 바꿔야 하는지 모른다.
            설정에서 한 번 읽어 쓰는 구조로 둔다
          - **바꾸는 절차가 적혀 있다.** "어디를 고치고 무엇을 다시 띄우는가"가
            기록돼 있어야 급할 때 할 수 있다

          그리고 **권한을 좁힌다.** 하나의 키로 모든 것을 할 수 있으면
          그 키 하나가 새는 순간 전부 잃는다.
          읽기만 필요한 곳에는 읽기 전용 키를, 서비스마다 다른 키를 쓴다.
          새어도 **피해 범위가 그 키가 할 수 있는 만큼으로 제한**된다.

          마지막으로, 비밀 값이 **어디에 쓰이는지 목록**을 둔다.
          바꿀 때 무엇이 영향을 받는지 알아야 안전하게 바꿀 수 있다.
        example:
          language: text
          code: |-
            # 값이 한 곳에만 있다
            app.external-api.key=${API_KEY}      ← 설정에서 한 번 읽는다

            # 권한을 좁힌 키
            READ_API_KEY     조회 전용 — 통계 배치가 쓴다
            WRITE_API_KEY    변경 가능 — 주문 서비스만 쓴다

            # 바꾸는 절차 (운영 기록에 남긴다)
            1. 새 키 발급
            2. 환경 변수 교체
            3. 재기동 후 외부 호출 확인
            4. 옛 키 폐기
          output: |-
            키 하나로 전부 할 수 있을 때
              그 키가 새면 → 조회·변경·삭제까지 전부 뚫린다

            권한을 좁혔을 때
              READ_API_KEY 가 새면 → 조회만 가능. 데이터가 바뀌지는 않는다
              피해 범위가 그 키가 할 수 있는 만큼으로 제한된다
          note: |-
            - 값이 **한 곳에만** 있어야 바꿀 수 있다
            - 권한을 좁히면 **새어도 피해가 그만큼**이다
            - 바꾸는 절차를 적어 둔다. 급할 때 떠올리는 것이 아니다
        predict:
          question: 조회·변경이 모두 가능한 키 하나를 모든 서비스가 함께 쓰다가 그 키가 새면?
          choices:
            - 그 키로 할 수 있는 모든 일이 가능해진다
            - 조회만 가능하다
            - 서비스별로 자동 차단된다
            - 키가 자동으로 만료된다
          answer: 그 키로 할 수 있는 모든 일이 가능해진다
          explanation: |-
            키에 붙은 권한이 곧 피해 범위다.
            하나의 키로 전부 할 수 있게 두면 **한 번 새는 것으로 전부 잃는다.**
            읽기만 필요한 곳에 읽기 전용 키를 주면, 그 키가 새도 데이터가 바뀌지는 않는다.
            바꿀 때도 쓰는 곳이 적을수록 쉽다.
        complete:
          question: 유출 대응에서 가장 먼저 할 일을 쓰세요.
          code: |-
            1. 키를 ___하고 새로 발급받는다
            2. 환경 변수를 교체하고 재기동한다
          answers:
            - [폐기]
          explanation: |-
            **폐기(무효화)가 가장 먼저**다. 기록을 정리하거나 코드를 고치는 동안에도
            옛 키는 계속 유효하기 때문이다.
        problem:
          prompt: |-
            외부 결제 API 키를 쓰고 있습니다. 지금은 **키 하나를 모든 서비스가 공유**하고,
            값은 각 서버의 환경 변수에 직접 넣어 두었으며, 바꿔 본 적은 없습니다.

            1. 지금 구조의 위험 **두 가지**
            2. 키를 바꿔야 할 때 무엇이 어려운지
            3. 개선안을 우선순위와 함께
          deliverables:
            - 세 물음에 대한 답
            - 3번은 무엇부터 할지가 드러나게
          hints:
            - 그 키가 샜을 때 무엇까지 가능한지 따져 보세요.
            - 값이 어디에 있는지 전부 알고 있나요?
            - 한 번에 다 바꾸기 어렵다면 무엇부터가 효과가 클까요?
          modelAnswer: |-
            **1. 위험 두 가지**

            - **피해 범위가 넓다.** 키 하나로 결제와 관련된 모든 일이 가능하므로,
              한 번 새면 전부 뚫린다. 어느 서비스에서 샜는지도 구분되지 않는다
            - **값이 여러 서버에 흩어져 있다.** 어디에 몇 개가 있는지 목록이 없으면
              바꿀 때 빠뜨리는 곳이 생긴다. 빠뜨린 곳은 옛 키로 남아 조용히 실패한다

            **2. 바꿀 때 어려운 것**

            - 어느 서버·서비스가 쓰는지 **전부 찾아야** 한다
            - 동시에 바꿀 수 없으면 잠시 **옛 키와 새 키가 섞인다.**
              옛 키를 바로 폐기하면 아직 안 바꾼 곳이 멈춘다
            - 바꿔 본 적이 없어 **절차가 없다.** 급할 때 처음 해 보게 된다

            **3. 개선안 — 우선순위**

            1. **쓰는 곳 목록을 만든다.** 무엇이 영향을 받는지 모르면 아무것도 못 바꾼다.
               가장 싸고 효과가 크다
            2. **한 번 바꿔 본다.** 절차를 기록으로 남긴다. 평온할 때 해 봐야
               급할 때 할 수 있다
            3. **권한을 나눈다.** 조회 전용과 변경 가능 키를 갈라 피해 범위를 줄인다
            4. **시크릿 저장소로 옮긴다.** 교체와 접근 기록이 남는다. 앞의 셋보다 비용이 크다

            순서가 중요하다 — 저장소 도입부터 하면 목록도 절차도 없는 채로 도구만 늘어난다.
          selfChecks:
            - 위험을 "피해 범위"와 "흩어진 값" 두 갈래로 짚었는가
            - 교체의 어려움에서 옛 키·새 키가 섞이는 구간을 말했는가
            - 개선안에 순서를 매기고 그 이유를 적었는가

    commonMistakes:
      - 커밋한 비밀 값을 지우고 끝냈다고 여긴다. 이전 커밋과 복제본에 그대로 남는다 (U1)
      - 비밀 값에 기본값을 준다. 환경 변수를 빠뜨려도 조용히 떠서 사고 뒤에 안다 (U2)
      - 키 하나로 전부 할 수 있게 둔다. 한 번 새는 것으로 전부 잃는다 (U3)
    inProject: |-
      주문 시스템에 DB와 외부 API를 붙이는 순간 바로 쓴다.
      설정 파일에는 `${DB_PASSWORD}`처럼 **이름만** 적고 값은 `.env`에 둔다.
      `.env`는 `.gitignore`에 넣고 `.env.example`만 커밋해 무엇이 필요한지 알린다(U2).
      비밀 값에는 기본값을 주지 않아 빠뜨리면 기동에 실패하게 한다.
      커밋 전에 비밀 값을 찾는 검사를 걸어 두면 실수 자체가 막힌다(U1).
      키가 늘어나면 **쓰는 곳 목록**을 먼저 만들고 한 번 바꿔 본다 — 절차가 있어야 급할 때 할 수 있다(U3).
