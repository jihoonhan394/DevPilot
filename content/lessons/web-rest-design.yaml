# DevPilot 개념 노트 — REST API 설계
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - HTTP 기초(LESSON.WEB_HTTP.BASICS.001)가 메서드·상태 코드·자원 경로를 다룬다.
#   여기서는 그 위에서 "응답을 어떻게 생기게 할 것인가"를 다룬다 — 겹치지 않게 쓴다
# - 예제는 주문 시스템 상황으로 쓴다 (CV-134)
lessons:
  - key: LESSON.WEB_HTTP.REST_DESIGN.001
    skillCode: WEB_HTTP.REST_API_DESIGN
    title: 남이 쓸 수 있는 API로 만들기 (REST 설계)
    whyItMatters: |-
      API를 쓰는 쪽은 매번 문서를 읽지 않는다. **한 군데를 보고 나머지를 짐작한다.**
      그래서 응답 모양이 endpoint마다 다르거나 오류가 어떤 때는 문자열, 어떤 때는 객체로 오면
      쓰는 쪽은 endpoint마다 따로 코드를 짜야 하고, 그 코드는 서버가 조금만 바뀌어도 깨진다.
      주문 시스템의 화면을 내가 만들더라도 마찬가지다 — 규칙이 없으면 화면마다 예외 처리가 달라진다.
    oneLine: 좋은 API는 기능이 많은 것이 아니라 **다음 것을 짐작할 수 있는** API다.
    units:
      - key: LESSON.WEB_HTTP.REST_DESIGN.001.U1
        title: 응답 모양을 한 가지로
        minutes: 10
        core: true
        explain: |-
          endpoint가 늘어날 때 **모양이 조금씩 달라지는 것**이 가장 흔한 사고다.
          `id`가 어디선 숫자 어디선 문자열, 날짜가 어디선 `2026-09-22` 어디선 `2026/09/22`.
          쓰는 쪽은 그때마다 다르게 다뤄야 한다.

          정해 두면 좋은 것이 넷이다.

          | 무엇 | 정하는 법 |
          |---|---|
          | 이름 | `lowerCamelCase` 하나로. 약어도 `sourceUrl`처럼 |
          | 날짜·시각 | ISO 8601 (`2026-09-22`, `2026-09-22T14:02:11Z`). **시각에는 시간대를 넣는다** |
          | 돈 | 정수(원 단위). 실수는 쓰지 않는다 — `0.1 + 0.2`가 `0.3`이 아니다 |
          | 없는 값 | 필드를 **빼지 말고** `null`로 내린다. 목록은 `null` 대신 `[]` |

          마지막 줄이 중요하다. 필드를 빼 버리면 쓰는 쪽은 "없는 것"과 "안 온 것"을 구분하지 못하고
          매번 존재 여부부터 확인해야 한다. **자리는 항상 있고 값만 비는 것**이 다루기 쉽다.

          하나 더. 목록 응답은 배열을 그대로 주지 말고 **객체로 감싼다.**
          그래야 나중에 전체 개수나 다음 쪽 표시를 넣을 자리가 생긴다(U3).
        example:
          language: json
          code: |-
            {
              "id": "5a1d7c1e-3f4b-4f39-9a0b-6e9f4c2b8d10",
              "customerId": "b7c2f0a1-...",
              "totalAmount": 42000,
              "status": "PAID",
              "orderedAt": "2026-09-22T14:02:11Z",
              "canceledAt": null,
              "lines": [
                { "productName": "키보드", "quantity": 1, "amount": 30000 }
              ],
              "memo": null
            }
          output: |-
            canceledAt: null  → "취소되지 않았다" (필드를 빼지 않는다)
            lines: []         → "항목이 없다"    (null 이 아니다)
            totalAmount: 42000 → 원 단위 정수    (42000.0 이 아니다)
            orderedAt 끝의 Z  → UTC. 시간대 없는 시각은 쓰지 않는다
          note: |-
            - '`null`과 "필드 없음"을 섞지 않는다 — 쓰는 쪽의 분기가 절반으로 준다'
            - '상태는 `"PAID"` 같은 **정해진 문자열**로. 숫자 코드는 쓰는 쪽이 표를 들고 다녀야 한다'
            - '금액을 실수로 두면 0.1 + 0.2 문제가 그대로 돈 계산에 들어온다'
        predict:
          question: 취소되지 않은 주문의 응답에서 `canceledAt` 필드를 **아예 빼면** 쓰는 쪽에 무엇이 생기나?
          choices:
            - "'값이 없다'와 '서버가 안 보냈다'를 구분할 수 없어 매번 존재 여부부터 확인해야 한다"
            - 응답이 작아져서 좋기만 하다
            - 자동으로 null로 채워진다
            - 파싱 오류가 난다
          answer: "'값이 없다'와 '서버가 안 보냈다'를 구분할 수 없어 매번 존재 여부부터 확인해야 한다"
          explanation: |-
            필드가 없으면 쓰는 쪽은 "취소 안 됨"인지 "이 버전 서버가 그 필드를 모름"인지 알 수 없다.
            그래서 **있는지 확인 → 값 확인** 두 단계를 매번 거치게 된다.
            자리를 두고 `null`을 내리면 한 단계로 끝난다. 응답 크기보다 다루기 쉬움이 훨씬 중요하다.
        complete:
          question: 목록 응답이 나중에 확장될 수 있도록 빈칸을 채우세요.
          code: |-
            {
              "___": [
                { "id": "...", "totalAmount": 42000 }
              ],
              "totalCount": 137
            }
          answers:
            - [items, content, data]
          explanation: |-
            배열을 그대로 주지 않고 `items`(또는 `content`) 같은 이름으로 감싼다.
            그래야 `totalCount`처럼 목록에 딸린 정보를 넣을 자리가 생긴다.
            배열을 최상위로 주면 나중에 무엇을 더하려 할 때 **깨는 변경**이 된다.
        problem:
          prompt: |-
            아래 두 응답은 같은 서버의 서로 다른 endpoint입니다. 규칙이 어긋난 곳을 **모두** 찾아 고치세요.

            ```json
            // GET /orders/1024
            { "order_id": 1024, "amount": 42000.0, "ordered_at": "2026/09/22 14:02",
              "status": 2 }

            // GET /orders
            [ { "id": "1024", "totalAmount": 42000, "orderedAt": "2026-09-22T14:02:11Z" } ]
            ```
          deliverables:
            - 어긋난 곳 목록 (각각 무엇이 문제인지 한 줄씩)
            - 고친 두 응답
          hints:
            - 두 응답에서 **같은 것을 가리키는 필드**의 이름과 타입을 나란히 놓고 보세요.
            - 날짜 형식과 돈의 타입에 정해 둔 규칙이 있었습니다.
            - 목록 응답의 모양에도 규칙이 있었습니다.
          modelAnswer: |-
            **어긋난 곳**

            - '`order_id` vs `id` — 이름 규칙이 다르다(snake_case / camelCase). `id`로 통일한다.'
            - '`1024`(숫자) vs `"1024"`(문자열) — 같은 값의 타입이 다르다. 하나로 정한다.'
            - '`amount` vs `totalAmount` — 같은 것을 다른 이름으로 부른다.'
            - '`42000.0` — 돈을 실수로 뒀다. 원 단위 정수로 한다.'
            - '`"2026/09/22 14:02"` — ISO 8601도 아니고 시간대도 없다.'
            - '`"status": 2` — 숫자 코드라 쓰는 쪽이 표를 들고 다녀야 한다. 문자열 상수로 한다.'
            - '목록이 배열 그대로다 — 객체로 감싸야 나중에 개수·쪽 정보를 넣을 자리가 생긴다.'

            ```json
            // GET /orders/1024
            { "id": "1024", "totalAmount": 42000,
              "orderedAt": "2026-09-22T14:02:11Z", "status": "PAID", "canceledAt": null }

            // GET /orders
            { "items": [
                { "id": "1024", "totalAmount": 42000,
                  "orderedAt": "2026-09-22T14:02:11Z", "status": "PAID", "canceledAt": null }
              ],
              "totalCount": 137 }
            ```
          selfChecks:
            - 같은 것을 가리키는 필드의 **이름과 타입**이 두 응답에서 같아졌는가
            - 날짜가 ISO 8601이고 시각에 시간대가 있는가
            - 목록이 객체로 감싸였는가

      - key: LESSON.WEB_HTTP.REST_DESIGN.001.U2
        title: 오류도 한 가지 형식으로
        minutes: 12
        core: true
        prerequisiteUnits:
          - LESSON.WEB_HTTP.REST_DESIGN.001.U1
        explain: |-
          상태 코드만으로는 부족하다. RFC 9457은 그 이유를 한 줄로 적는다 —
          **"HTTP 상태 코드만으로는 오류에 대해 도움이 될 만큼의 정보를 늘 전할 수는 없다."**

          400 하나에도 "수량이 음수다"와 "상품이 없다"가 섞여 있다. 쓰는 쪽은 어느 칸이 잘못됐는지 알아야
          그 칸에 빨간 줄을 그을 수 있다.

          그래서 **오류 본문의 표준 모양**이 정해져 있다. 미디어 타입은 `application/problem+json`이고,
          칸은 다섯이다.

          | 칸 | RFC의 정의 |
          |---|---|
          | `type` | "문제 유형을 식별하는 URI 참조" |
          | `title` | "그 문제 유형의 짧은 사람이 읽을 요약" |
          | `status` | "이 문제에 대해 서버가 낸 HTTP 상태 코드" |
          | `detail` | "이번 발생에 한정된 사람이 읽을 설명" |
          | `instance` | "문제가 난 그 자리를 식별하는 URI 참조" |

          **칸을 더 넣어도 된다.** RFC의 예제도 `balance`·`accounts` 같은 칸을 덧붙인다.
          그래서 보통 여기에 **기계가 읽을 코드**와 **필드별 오류 목록**을 더한다.

          한 가지 주의. `detail`은 사람이 읽는 글이므로 **분기 조건으로 쓰면 안 된다.**
          문구를 다듬는 순간 쓰는 쪽이 깨진다. 분기는 `type`이나 따로 둔 코드로 한다.

          그리고 **오류 본문에 내부 사정을 담지 않는다** — 스택 트레이스, SQL, 파일 경로, 토큰은 로그로만 간다.
        example:
          language: json
          code: |-
            HTTP/1.1 400 Bad Request
            Content-Type: application/problem+json

            {
              "type": "urn:shop:problem:validation-failed",
              "title": "Validation failed",
              "status": 400,
              "detail": "요청한 값을 확인해 주세요.",
              "instance": "/orders",
              "code": "VALIDATION_FAILED",
              "errors": [
                { "field": "quantity", "code": "Min", "message": "1개 이상이어야 합니다" }
              ]
            }
          output: |-
            쓰는 쪽이 하는 일
              status 400  → 내 요청이 잘못됐다
              code        → 분기 (문구가 아니라 이것으로)
              errors[]    → quantity 칸에 빨간 줄
              detail      → 그대로 보여 주기만

            담지 않는 것
              스택 트레이스 · SQL · 파일 경로 · 토큰
          note: |-
            - '`Content-Type`이 `application/json`이 아니라 `application/problem+json`이다'
            - '`errors[]`는 RFC의 확장 칸이다 — 표준이 허용한다'
            - '`detail`의 문구로 분기하면 문구를 다듬을 때마다 쓰는 쪽이 깨진다'
        predict:
          question: 쓰는 쪽이 `detail`의 문구를 보고 분기하도록 만들면 나중에 무슨 일이 생기나?
          choices:
            - 서버가 문구를 다듬는 순간 쓰는 쪽이 조용히 깨진다
            - 아무 문제 없다. 문구는 잘 안 바뀐다
            - 응답이 느려진다
            - 다국어 지원이 쉬워진다
          answer: 서버가 문구를 다듬는 순간 쓰는 쪽이 조용히 깨진다
          explanation: |-
            `detail`은 **사람이 읽는 글**이다. 오타를 고치거나 말투를 다듬는 것은 깨는 변경으로 치지 않는다.
            그런데 쓰는 쪽이 그 문구를 비교하고 있으면 그때 분기가 빗나간다.
            게다가 오류도 안 나고 조용히 다른 길로 가서 찾기 어렵다.
            **기계가 읽을 것과 사람이 읽을 것을 칸부터 나눠 두는 이유**가 이것이다.
        complete:
          question: 오류 응답의 미디어 타입과 기계가 읽을 칸을 채우세요.
          code: |-
            Content-Type: application/___+json

            {
              "status": 409,
              "detail": "이미 배송이 시작된 주문입니다.",
              "___": "ORDER_ALREADY_SHIPPED"
            }
          answers:
            - [problem]
            - [code]
          explanation: |-
            오류 본문의 미디어 타입은 `application/problem+json`이고,
            쓰는 쪽이 분기에 쓸 기계용 값은 `code` 같은 확장 칸에 둔다(`detail`이 아니다).
        problem:
          prompt: |-
            주문 생성 API(`POST /orders`)의 오류 응답을 설계하세요.

            일어날 수 있는 일은 넷입니다.
            - 수량이 0 이하다
            - 그런 상품이 없다
            - 재고가 모자란다
            - 서버에서 예외가 났다

            네 경우의 **상태 코드와 응답 본문**을 적고, 쓰는 쪽이 이 넷을 어떻게 갈라내는지 쓰세요.
          deliverables:
            - 네 경우의 상태 코드와 본문 (problem+json 형식)
            - 쓰는 쪽이 넷을 가르는 기준 한 줄
            - 서버 예외일 때 본문에 **담지 않을 것** 한 줄
          hints:
            - 먼저 4xx와 5xx를 가르고, 4xx 안에서 "값이 틀렸다"와 "지금 상태가 안 받아 준다"를 나눠 보세요.
            - 같은 400이라도 어느 칸이 문제인지 알려 줄 자리가 있었습니다.
            - 분기에 쓸 값과 보여 줄 문구는 칸이 달라야 합니다.
          modelAnswer: |-
            ```json
            // 1) 수량이 0 이하 — 값이 틀렸다
            400 { "type": "urn:shop:problem:validation-failed", "title": "Validation failed",
                  "status": 400, "detail": "요청한 값을 확인해 주세요.", "instance": "/orders",
                  "code": "VALIDATION_FAILED",
                  "errors": [{ "field": "quantity", "code": "Min", "message": "1개 이상이어야 합니다" }] }

            // 2) 그런 상품이 없다 — 가리킨 것이 없다
            400 { "status": 400, "detail": "상품을 찾을 수 없습니다.", "instance": "/orders",
                  "code": "VALIDATION_FAILED",
                  "errors": [{ "field": "productId", "code": "REFERENCE_NOT_FOUND" }] }

            // 3) 재고가 모자란다 — 요청은 맞지만 지금 상태가 안 받아 준다
            409 { "status": 409, "detail": "재고가 모자랍니다.", "instance": "/orders",
                  "code": "OUT_OF_STOCK" }

            // 4) 서버 예외
            500 { "status": 500, "detail": "잠시 후 다시 시도해 주세요.", "instance": "/orders",
                  "code": "INTERNAL_ERROR", "traceId": "bb91e7e3367b44ae" }
            ```

            - '쓰는 쪽이 가르는 기준: **`status`로 크게, `code`로 정확히.** 400이면 `errors[]`의 `field`를 보고 그 칸에 표시하고, 409면 안내 문구를 보여 주고, 500이면 재시도를 권한다. `detail` 문구로는 분기하지 않는다.'
            - '500에 담지 않을 것: **스택 트레이스와 예외 메시지 원문.** 대신 `traceId`만 주고 자세한 것은 서버 로그에 남긴다 — 그래야 쓰는 쪽은 신고할 값이 생기고 내부 구조는 새지 않는다.'
          selfChecks:
            - 네 경우의 상태 코드가 400·400·409·500으로 갈렸고 그 근거가 있는가
            - 어느 칸이 문제인지 알려 주는 자리(`errors[]`)가 있는가
            - 500 응답에 스택 트레이스·예외 원문이 없고 추적용 값만 있는가

      - key: LESSON.WEB_HTTP.REST_DESIGN.001.U3
        title: 목록은 통째로 주지 않는다
        minutes: 10
        core: true
        prerequisiteUnits:
          - LESSON.WEB_HTTP.REST_DESIGN.001.U1
        explain: |-
          `GET /orders`가 전부를 준다면, 주문이 10건일 때는 잘 되고 10만 건일 때 서버와 화면이 함께 멈춘다.
          **처음부터 나눠 준다.**

          나누는 방법은 둘이다.

          **쪽 번호(offset)** — `?page=2&size=20`. 구현이 쉽고 "3쪽으로 가기"가 된다.
          약점은 둘이다. 뒤쪽으로 갈수록 DB가 앞의 줄을 세느라 느려지고,
          보는 중에 새 주문이 들어오면 **줄이 밀려 같은 것을 두 번 보거나 건너뛴다.**

          **커서(cursor)** — `?cursor=<지난 마지막 위치>&limit=20`.
          "이 다음부터"를 정확히 가리키므로 밀리지 않고 뒤쪽도 빠르다. 대신 **쪽 번호로 못 뛴다.**

          | 언제 | 무엇 |
          |---|---|
          | 관리 화면처럼 쪽을 오가는 곳 | 쪽 번호 |
          | 계속 이어 보는 목록(무한 스크롤), 자주 바뀌는 데이터 | 커서 |

          어느 쪽이든 **정렬을 반드시 정한다.** 정렬이 없으면 순서가 보장되지 않아 나누는 의미가 사라진다.
          그리고 정렬 기준이 같은 값일 때를 대비해 **id를 마지막 정렬 기준으로** 덧붙인다.

          `limit`에는 **상한을 둔다.** `?limit=1000000`이 그대로 통하면 나눈 보람이 없다.
        example:
          language: http
          code: |-
            GET /orders?limit=20&sort=orderedAt,desc

            {
              "items": [ { "id": "1024", "orderedAt": "2026-09-22T14:02:11Z" } ],
              "nextCursor": "eyJvcmRlcmVkQXQiOiIyMDI2LTA5LTIyVDE0OjAyOjExWiIsImlkIjoiMTAyNCJ9"
            }

            GET /orders?limit=20&cursor=eyJvcmRlcmVkQXQiOi...

            {
              "items": [ ... ],
              "nextCursor": null
            }
          output: |-
            nextCursor 가 있으면  → 더 있다
            nextCursor 가 null 이면 → 마지막 쪽이다

            정렬은 orderedAt DESC, 같으면 id DESC
              → 같은 시각 주문이 둘이어도 순서가 흔들리지 않는다

            limit 상한 100
              → ?limit=1000000 은 100으로 깎거나 400
          note: |-
            - '`nextCursor: null`이 "끝"이다 — 쓰는 쪽이 개수를 세지 않아도 된다'
            - '정렬 기준이 같을 때를 대비해 `id`를 덧붙인다'
            - '커서 안에 무엇이 들었는지는 쓰는 쪽이 몰라도 된다 — 그대로 돌려주기만 한다'
        predict:
          question: 쪽 번호 방식으로 1쪽을 보는 동안 새 주문이 3건 들어오면 2쪽에서 무슨 일이 생기나?
          choices:
            - 줄이 밀려 1쪽에서 본 주문을 2쪽에서 또 보게 된다
            - 2쪽이 비어 버린다
            - 새 주문은 다음 조회부터 보인다
            - 아무 일도 생기지 않는다
          answer: 줄이 밀려 1쪽에서 본 주문을 2쪽에서 또 보게 된다
          explanation: |-
            최신순 정렬이라면 새 주문 3건이 맨 앞에 끼어들고, 그만큼 전체가 뒤로 밀린다.
            "21번째부터 20건"을 다시 세므로 1쪽 끝에서 봤던 것이 2쪽 앞에 다시 나온다.
            커서는 "이 위치 다음부터"를 값으로 들고 있어서 이런 밀림이 없다.
        complete:
          question: 커서 방식 목록 응답에서 "더 있다"를 알리는 칸을 채우세요.
          code: |-
            {
              "items": [ ... ],
              "___": "eyJvcmRlcmVkQXQiOi..."
            }
          answers:
            - [nextCursor]
          explanation: |-
            다음 쪽을 가리키는 값을 `nextCursor`로 내린다.
            마지막 쪽에서는 `null`을 내려 "끝"을 알린다 — 쓰는 쪽이 전체 개수를 몰라도 된다.
        problem:
          prompt: |-
            관리자 화면의 `GET /orders`가 주문 12만 건을 전부 내려 주고 있어 화면이 멈춥니다.

            1. 이 화면은 "3쪽으로 가기"와 "몇 건 중 몇 번째"를 보여 줘야 합니다. 어느 방식을 고를지 정하고 이유를 쓰세요
            2. 요청과 응답을 설계하세요 (정렬과 상한 포함)
            3. 고른 방식의 **약점**과 그것을 줄이는 방법을 한 줄 쓰세요
          deliverables:
            - 고른 방식과 이유
            - 요청 예와 응답 예
            - 약점과 완화 방법
          hints:
            - 화면이 요구하는 것 중에 **한 방식만 할 수 있는 것**이 있습니다.
            - 정렬을 정하지 않으면 나누는 것 자체가 의미가 없어집니다.
            - 뒤쪽 쪽으로 갈수록 무슨 일이 생기는지 떠올려 보세요.
          modelAnswer: |-
            **1. 쪽 번호(offset) 방식**

            "3쪽으로 가기"와 "몇 건 중 몇 번째"는 전체 개수와 쪽 번호가 있어야 하는데,
            커서 방식은 둘 다 줄 수 없다. 관리 화면은 쪽을 오가는 것이 기능이므로 쪽 번호가 맞는다.

            **2. 요청과 응답**

            ```http
            GET /orders?page=0&size=20&sort=orderedAt,desc
            ```

            ```json
            {
              "items": [ { "id": "1024", "orderedAt": "2026-09-22T14:02:11Z" } ],
              "page": 0,
              "size": 20,
              "totalCount": 120000,
              "totalPages": 6000
            }
            ```

            - '정렬: `orderedAt DESC`, 같으면 `id DESC`를 덧붙여 순서가 흔들리지 않게 한다.'
            - '`size`는 상한 100. 넘으면 100으로 깎거나 400 `VALIDATION_FAILED`.'

            **3. 약점과 완화**

            뒤쪽 쪽일수록 앞의 줄을 세느라 느려지고(`page=5000`), 보는 중에 새 주문이 들어오면 줄이 밀린다.
            줄이는 방법은 **기간 필터를 함께 두는 것**이다 — `?from=2026-09-01&to=2026-09-30`으로 좁히면
            쪽 수 자체가 줄어 깊은 쪽으로 갈 일이 없어진다.
          selfChecks:
            - 고른 이유가 "쪽 번호와 전체 개수가 필요하다"에 닿아 있는가
            - 정렬 기준과 `size` 상한을 둘 다 적었는가
            - 약점을 "깊은 쪽이 느리다 / 줄이 밀린다"로 짚었는가

      - key: LESSON.WEB_HTTP.REST_DESIGN.001.U4
        title: 바꿔도 깨지지 않게
        minutes: 12
        core: false
        prerequisiteUnits:
          - LESSON.WEB_HTTP.REST_DESIGN.001.U1
        explain: |-
          API는 한 번 내보내면 **쓰는 쪽이 생긴다.** 그때부터 모든 변경은 "깨는가 아닌가"로 갈린다.

          | 안 깨는 변경 | 깨는 변경 |
          |---|---|
          | 응답에 **칸을 더한다** | 칸을 **지우거나 이름을 바꾼다** |
          | 선택 파라미터를 더한다 | 필수 파라미터를 더한다 |
          | 오류에 새 `code`를 더한다 | 칸의 **타입을 바꾼다** (`1024` → `"1024"`) |
          | 새 endpoint를 만든다 | enum 값의 **뜻을 바꾼다** |

          "칸을 더하는 것"이 안 깨지려면 조건이 하나 있다 —
          **쓰는 쪽이 모르는 칸을 만나도 무시해야 한다.** 이걸 서로 지키기로 하는 것이 암묵적인 약속이다.
          (반대로 요청은 모르는 칸을 **거부**하는 편이 낫다. 오타를 조용히 무시하면 찾기 어렵다.)

          그래도 깨는 변경이 필요할 때가 온다. 방법은 셋이다.

          1. **경로에 버전** — `/api/v1/orders` → `/api/v2/orders`. 제일 흔하고 눈에 보인다
          2. **새 칸을 더하고 옛 칸을 한동안 같이 준다** — 쓰는 쪽이 옮길 시간을 준다
          3. **새 endpoint를 만든다** — 모양이 많이 다르면 이쪽이 깔끔하다

          어느 쪽이든 **옛것을 언제 없앨지 미리 알린다.** 말없이 사라지는 것이 가장 나쁘다.

          그리고 **enum 값을 늘릴 때**를 주의한다. 쓰는 쪽이 모르는 값을 만나면 터지지 않고
          "알 수 없음"으로 다루도록 처음부터 약속해 두면, 나중에 상태 하나 늘리는 일이 깨는 변경이 되지 않는다.
        example:
          language: json
          code: |-
            // v1 응답
            { "id": "1024", "totalAmount": 42000, "status": "PAID" }

            // 안 깨는 변경 — 칸을 더한다
            { "id": "1024", "totalAmount": 42000, "status": "PAID",
              "discountAmount": 3000 }

            // 깨는 변경 — 이름을 바꾼다
            { "id": "1024", "amount": 42000, "status": "PAID" }

            // 옮길 시간을 주는 방법 — 둘 다 준다
            { "id": "1024", "totalAmount": 42000, "amount": 42000, "status": "PAID" }
          output: |-
            칸 추가     → 모르는 칸을 무시하는 쪽은 아무 일 없다
            이름 변경   → totalAmount 를 읽던 쪽이 그날로 깨진다
            둘 다 주기  → "amount 로 옮기세요. totalAmount 는 3개월 뒤 없앱니다"

            status 에 "REFUNDED" 를 더하면?
              모르는 값을 "알 수 없음"으로 다루기로 했다면 → 안 깨진다
              switch 에서 터지게 짰다면                   → 깨진다
          note: |-
            - '요청은 모르는 칸을 **거부**, 응답은 모르는 칸을 **무시** — 방향이 반대다'
            - '옛 칸을 남겨 두는 기간과 없앨 날짜를 같이 알린다'
            - 'enum을 늘릴 일이 있다면 "모르는 값" 처리를 처음부터 약속해 둔다'
        predict:
          question: 응답에 `discountAmount` 칸을 새로 더했다. 옛 클라이언트는 어떻게 되나?
          choices:
            - 모르는 칸을 무시하도록 만들었다면 아무 일 없다
            - 반드시 깨진다
            - 새 칸이 null로 온다
            - 서버가 옛 클라이언트를 구분해 빼 준다
          answer: 모르는 칸을 무시하도록 만들었다면 아무 일 없다
          explanation: |-
            칸을 더하는 것이 "안 깨는 변경"인 이유는 **쓰는 쪽이 모르는 칸을 무시한다는 약속** 덕분이다.
            그 약속이 없으면(모르는 칸에서 오류를 내도록 짰다면) 칸 추가조차 깨는 변경이 된다.
            그래서 이 약속을 API 문서 맨 앞에 적어 두는 것이다.
        complete:
          question: 옛 칸을 남긴 채 새 이름으로 옮겨 가도록 빈칸을 채우세요.
          code: |-
            {
              "id": "1024",
              "totalAmount": 42000,
              "___": 42000
            }
          answers:
            - [amount]
          explanation: |-
            새 이름(`amount`)을 더하고 옛 이름(`totalAmount`)을 한동안 **함께** 준다.
            쓰는 쪽이 옮길 시간을 번 뒤, 미리 알린 날짜에 옛 칸을 없앤다.
        problem:
          prompt: |-
            운영 중인 `GET /orders/{id}`에 아래 네 가지를 하려고 합니다.
            각각 **깨는 변경인지** 판정하고, 깨는 것은 안 깨게 하는 방법을 쓰세요.

            1. `status`에 `"REFUNDED"` 값을 추가한다
            2. `totalAmount`를 원 단위 정수에서 `"42000.00"` 문자열로 바꾼다
            3. 응답에 `estimatedDeliveryAt` 칸을 더한다
            4. `memo` 칸을 없앤다 (아무도 안 쓴다고 생각한다)
          deliverables:
            - 넷의 판정 (깨는 변경인지)
            - 깨는 것들을 안 깨게 하는 방법
            - 4번을 "아무도 안 쓴다"로 판단하면 안 되는 이유 한 줄
          hints:
            - 판정 기준은 "옛 클라이언트가 그대로 돌아가는가"입니다.
            - 1번은 쓰는 쪽이 **모르는 값을 어떻게 다루기로 했는지**에 달려 있습니다.
            - 안 쓰는 것처럼 보이는 칸을 없애기 전에 **확인할 방법**이 있을까요?
          modelAnswer: |-
            | # | 판정 | 안 깨게 하는 방법 |
            |---|---|---|
            | 1 | **경우에 따라 다름** | 모르는 enum 값을 "알 수 없음"으로 다루기로 약속돼 있으면 안 깨진다. 아니면 깨진다 — 새 값을 쓰는 새 버전을 따로 내거나, 쓰는 쪽이 대비한 뒤에 내보낸다 |
            | 2 | **깨는 변경** | 타입이 바뀌면 숫자로 읽던 쪽이 그날로 깨진다. 새 칸(`totalAmountText`)을 더하거나 `/api/v2`로 간다 |
            | 3 | **안 깨는 변경** | 그대로 하면 된다 (모르는 칸 무시 약속이 있다면) |
            | 4 | **깨는 변경** | 없애기 전에 사용 여부를 확인하고, 없앨 날짜를 미리 알린 뒤 그 기간이 지나서 없앤다 |

            - '4번을 "아무도 안 쓴다"로 판단하면 안 되는 이유: **쓰는 쪽을 서버가 다 알 수 없다.** 화면 하나, 배치 하나, 동생이 만든 스크립트 하나가 그 칸을 읽고 있을 수 있다. 접근 로그로 확인하거나, 한동안 값을 `null`로 내려 보고 문의가 없는지 본 뒤에 없앤다.'
          selfChecks:
            - 넷의 판정이 "옛 클라이언트가 그대로 도는가" 기준으로 갈렸는가
            - 1번을 "약속에 달려 있다"로 갈랐는가 (무조건 안 깨진다고 하지 않았는가)
            - 4번에서 없애기 전에 **확인하고 미리 알리는** 절차를 적었는가

    commonMistakes:
      - 없는 값을 `null`이 아니라 필드 생략으로 표현한다. 쓰는 쪽이 매번 존재 여부부터 확인하게 된다 (U1)
      - 오류 문구(`detail`)로 분기하게 만든다. 문구를 다듬으면 조용히 깨진다 (U2)
      - 목록을 배열 그대로 내린다. 나중에 개수·쪽 정보를 넣으려면 깨는 변경이 된다 (U1·U3)
    inProject: |-
      주문 시스템의 API를 처음 그릴 때 **화면보다 먼저** 이 네 가지를 정해 두면 나중에 고칠 일이 없다.
      응답 모양과 이름 규칙을 한 장에 적고(U1), 오류는 problem+json 한 형식으로 통일하고(U2),
      목록은 처음부터 나눠 주고(U3), 칸을 더하는 것 말고는 함부로 바꾸지 않는다(U4).
      쓰는 쪽이 나 하나뿐이어도 그렇다 — 내가 만든 화면도 **한 달 뒤에는 남이 만든 것과 같다.**
    sources:
      - title: "RFC 9457: Problem Details for HTTP APIs"
        url: https://www.rfc-editor.org/rfc/rfc9457.html
        versionScope: RFC 9457
      - title: MDN — HTTP response status codes
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status
        versionScope: HTTP/1.1
    verifiedAt: 2026-09-22
