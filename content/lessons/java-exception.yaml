# DevPilot 개념 노트 — 예외와 자원 관리
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 1단계(CRUD와 검증)에서 쓴다. JAVA.OOP 노트를 먼저 본 것으로 전제한다
# - 지금 통용되는 정석(예외 변환, 원인 사슬, try-with-resources)을 기준으로 쓴다
lessons:
  - key: LESSON.JAVA.EXCEPTION.001
    skillCode: JAVA.EXCEPTION
    title: 실패를 어디까지 올릴지 정하기 (예외)
    whyItMatters: |-
      실패를 다루는 방식이 서비스의 성격을 정한다. 아무 데서나 잡아 삼키면 장애가 나도 로그가 비고,
      전부 위로 던지면 사용자에게 내부 구조가 그대로 나간다.
      주문 시스템에서 "재고가 없다"와 "DB가 죽었다"는 전혀 다른 실패인데,
      이 둘을 가르지 못하면 둘 다 500으로 나가고 원인은 끝내 못 찾는다.
    oneLine: 예외는 "여기서는 더 못 한다"는 신호이고, 어디서 잡을지는 그 실패를 처리할 수 있는 곳이 정한다.
    units:
      - key: LESSON.JAVA.EXCEPTION.001.U1
        title: 두 갈래 — 잡거나 알리거나
        minutes: 10
        core: true
        explain: |-
          공식 튜토리얼은 예외를 두 갈래로 나눈다.

          | 갈래 | 대표 | 컴파일러가 강제하나 | 언제 쓰나 |
          |---|---|---|---|
          | **checked** | `IOException` | 잡거나 `throws`로 알려야 한다 | 부른 쪽이 **회복할 수 있는** 실패 |
          | **unchecked** | `IllegalArgumentException`, `NullPointerException` | 강제하지 않는다 | 보통 **코드가 잘못된** 경우 |

          문서의 기준은 이 한 줄이다 — **"부른 쪽이 그 예외에서 회복할 것이라고
          기대할 수 있는가?"** 그렇다면 checked, 아니라면 unchecked다.

          지금 통용되는 정석은 **도메인 규칙 위반을 unchecked로 두는 것**이다.
          재고 부족을 checked로 만들면 그 예외를 처리하지 못하는 중간 계층들까지
          전부 `throws`를 달아야 하고, 결국 아무 데서나 잡아 삼키게 된다.
        example:
          language: java
          code: |-
            // 도메인 규칙 위반 — 부른 쪽이 값을 고쳐야 한다
            static class OutOfStockException extends RuntimeException {
                OutOfStockException(String productCode, int requested, int available) {
                    super("재고 부족: " + productCode + " 요청 " + requested + ", 남은 수량 " + available);
                }
            }

            record Stock(String productCode, int available) {

                Stock take(int quantity) {
                    if (quantity < 1) {
                        throw new IllegalArgumentException("수량은 1개 이상이어야 한다");
                    }
                    if (quantity > available) {
                        throw new OutOfStockException(productCode, quantity, available);
                    }
                    return new Stock(productCode, available - quantity);
                }
            }

            Stock stock = new Stock("KB-01", 3);
            System.out.println(stock.take(2).available());
            System.out.println(stock.take(5).available());
          output: |-
            1
            Exception in thread "main" OutOfStockException: 재고 부족: KB-01 요청 5, 남은 수량 3
          note: |-
            - `RuntimeException`을 상속하므로 `throws`를 달 필요가 없다
            - 메시지에 **무엇이 얼마나 모자랐는지**가 들어 있다 — 로그만 보고 원인을 안다
            - `take`는 상태를 바꾸지 않고 새 `Stock`을 돌려준다. 실패해도 원본이 망가지지 않는다
            - 잘못된 인자(`quantity < 1`)와 규칙 위반(재고 부족)을 **다른 예외로** 갈랐다
        predict:
          question: '`OutOfStockException`이 `Exception`을 상속하도록 바꾸면 무슨 일이 생기나?'
          choices:
            - take 메서드에 throws를 달아야 하고, take를 부르는 곳도 전부 처리해야 한다
            - 아무 차이가 없다. 실행 결과도 같다
            - 컴파일은 되지만 실행 중에 무시된다
            - RuntimeException보다 빠르게 전파된다
          answer: take 메서드에 throws를 달아야 하고, take를 부르는 곳도 전부 처리해야 한다
          explanation: |-
            checked 예외는 **잡거나 알리거나** 둘 중 하나를 컴파일러가 강제한다.
            그 실패를 처리할 수 없는 중간 계층까지 전부 `throws`가 번져 나가는 것이
            도메인 규칙 위반을 checked로 두지 않는 이유다.
        complete:
          question: 잘못된 인자와 잘못된 상태를 각각 알맞은 표준 예외로 알리도록 빈칸을 채우세요.
          code: |-
            void cancel(int orderId) {
                if (orderId < 1) {
                    throw new ___("주문 번호는 1 이상이어야 한다");
                }
                if (alreadyShipped(orderId)) {
                    throw new ___("이미 배송된 주문은 취소할 수 없다");
                }
            }
          answers:
            - [IllegalArgumentException]
            - [IllegalStateException]
          explanation: |-
            **넘어온 값이 잘못**이면 `IllegalArgumentException`,
            **값은 맞지만 지금 그 일을 할 수 없는 상태**면 `IllegalStateException`이다.
            표준 예외로 표현되는 것에 새 예외 타입을 만들지 않는 것이 정석이다.
        problem:
          prompt: |-
            주문 시스템의 쿠폰 적용 규칙을 예외로 표현하세요.

            - `Coupon.apply(int orderAmount)`는 할인된 금액을 돌려준다
            - 규칙 세 가지: 주문 금액이 0 이하면 잘못된 인자, 이미 쓴 쿠폰이면 잘못된 상태,
              최소 주문 금액에 못 미치면 **도메인 규칙 위반**이다
            - 셋 중 둘은 표준 예외로, 하나는 직접 만든 예외로 표현하세요
            - 직접 만든 예외를 checked로 두지 않은 이유를 한 줄로 적으세요
          deliverables:
            - Coupon 클래스와 직접 만든 예외 타입의 코드
            - 규칙 세 가지를 각각 어떤 예외로 표현했는지와 그 이유
            - 직접 만든 예외를 unchecked로 둔 이유 한 줄
          hints:
            - 세 가지 실패가 서로 다른 성격입니다. 먼저 "값이 잘못"과 "지금 못 함"을 갈라 보세요.
            - 표준 예외로 충분히 표현되는 것에는 새 타입을 만들지 않습니다.
            - 남은 하나는 화면에 그대로 보여 줄 만한 실패입니다. 무엇이 모자랐는지가 메시지에 있어야 합니다.
          modelAnswer: |-
            ```java
            public class MinimumAmountNotMetException extends RuntimeException {
                public MinimumAmountNotMetException(int required, int actual) {
                    super("최소 주문 금액 미달: 필요 " + required + "원, 주문 " + actual + "원");
                }
            }

            public class Coupon {

                private final int minimumAmount;
                private final int discountRate;
                private boolean used;

                public int apply(int orderAmount) {
                    if (orderAmount <= 0) {
                        throw new IllegalArgumentException("주문 금액은 0원보다 커야 한다");
                    }
                    if (used) {
                        throw new IllegalStateException("이미 사용한 쿠폰이다");
                    }
                    if (orderAmount < minimumAmount) {
                        throw new MinimumAmountNotMetException(minimumAmount, orderAmount);
                    }
                    used = true;
                    return orderAmount - orderAmount * discountRate / 100;
                }
            }
            ```

            unchecked로 둔 이유는 **중간 계층이 이 실패를 회복할 수 없기** 때문이다.
            서비스도 컨트롤러도 할 수 있는 일이 없고, 응답으로 바꿔 주는 한 곳에서만 다루면 된다.
            checked로 두면 그 한 곳까지 오는 모든 메서드에 `throws`가 붙는다.
          selfChecks:
            - 값이 잘못된 경우와 지금 할 수 없는 상태를 다른 예외로 갈랐는가
            - 표준 예외로 충분한 곳에 새 타입을 만들지 않았는가
            - 직접 만든 예외의 메시지에 무엇이 얼마나 모자랐는지가 들어 있는가
            - unchecked로 둔 이유를 "귀찮아서"가 아닌 말로 설명할 수 있는가
      - key: LESSON.JAVA.EXCEPTION.001.U2
        title: 원인을 잃지 않고 계층 넘기기
        minutes: 12
        core: true
        explain: |-
          계층이 나뉘면 예외도 계층을 넘는다. 저장소에서 난 `SQLException`을
          컨트롤러가 그대로 받으면, 컨트롤러가 DB 기술을 알게 된다.

          그래서 정석은 **예외 변환(exception translation)** 이다 —
          계층의 경계에서 그 계층의 말로 바꿔 던진다.
          스프링의 `DataAccessException` 계층이 바로 이것을 한다.

          이때 반드시 지킬 것이 **원인 사슬(cause chain)** 이다.
          공식 문서가 말하는 목적은 하나 — **"어떤 예외가 어떤 예외 때문에 일어났는지"** 를 남기는 것.
          `new MyException(message, cause)` 로 원인을 함께 넘기면
          스택 트레이스에 `Caused by:` 줄이 따라붙는다.

          원인을 빠뜨리면 스택 트레이스가 **변환한 자리에서 끊긴다.**
          진짜 터진 줄 번호를 영영 못 보게 된다.
        example:
          language: java
          code: |-
            static class OrderPersistenceException extends RuntimeException {
                OrderPersistenceException(String message, Throwable cause) {
                    super(message, cause);      // 원인을 함께 넘긴다
                }
            }

            static void save(long orderId) {
                try {
                    throw new SQLException("duplicate key value violates unique constraint");
                } catch (SQLException cause) {
                    throw new OrderPersistenceException("주문 저장 실패: " + orderId, cause);
                }
            }

            try {
                save(1001L);
            } catch (OrderPersistenceException e) {
                System.out.println(e.getMessage());
                System.out.println("원인: " + e.getCause().getMessage());
                System.out.println("원인 타입: " + e.getCause().getClass().getSimpleName());
            }
          output: |-
            주문 저장 실패: 1001
            원인: duplicate key value violates unique constraint
            원인 타입: SQLException
          note: |-
            - 위 계층은 `SQLException`을 모른다 — 기술이 바뀌어도 위는 안 고친다
            - 그런데 원인은 **버리지 않았다**. `getCause()`로 그대로 남아 있다
            - 로그에 찍으면 `Caused by: java.sql.SQLException: duplicate key ...` 가 붙는다
            - 메시지에 주문 번호를 넣어 **어느 건인지** 알 수 있게 했다
        predict:
          question: '`new OrderPersistenceException("주문 저장 실패: " + orderId)`처럼 cause 없이 던지면 무엇을 잃나?'
          choices:
            - 스택 트레이스가 변환한 자리에서 끊겨 진짜 터진 위치를 알 수 없다
            - 예외가 전파되지 않고 그 자리에서 멈춘다
            - 메시지까지 함께 사라진다
            - 컴파일 오류가 난다
          answer: 스택 트레이스가 변환한 자리에서 끊겨 진짜 터진 위치를 알 수 없다
          explanation: |-
            메시지는 남지만 `Caused by:` 줄이 사라진다.
            장애가 났을 때 "주문 저장 실패"라는 것만 알고 **왜 실패했는지**는 못 보게 된다.
            원인 없이 변환하는 것은 예외를 삼키는 것과 크게 다르지 않다.
        complete:
          question: 외부 결제 호출 실패를 우리 말로 바꾸되 원인을 남기도록 빈칸을 채우세요.
          code: |-
            try {
                paymentClient.charge(orderId, amount);
            } catch (IOException ___) {
                throw new PaymentFailedException("결제 요청 실패: " + orderId, ___);
            }
          answers:
            - [cause, e, exception]
            - [cause, e, exception]
          explanation: |-
            잡은 예외에 이름을 붙이고, 그것을 새 예외의 **두 번째 인자**로 넘긴다.
            이름은 `cause`나 `e` 무엇이든 되지만, 넘기는 것 자체를 빠뜨리면 안 된다.
        problem:
          prompt: |-
            아래 코드는 원인을 두 번 잃고 있다.

            ```java
            public Order find(long id) {
                try {
                    return repository.findById(id);
                } catch (SQLException e) {
                    throw new RuntimeException("조회 실패");
                }
            }
            ```

            - 잃고 있는 것 **두 가지**를 지적하세요 (하나는 원인, 다른 하나는 예외 타입입니다)
            - 계층 경계에 맞는 예외 타입을 만들고 고쳐 쓰세요
            - 고치기 전과 후의 스택 트레이스가 어떻게 다른지 적으세요
          deliverables:
            - 잃고 있는 두 가지
            - 고친 코드와 새로 만든 예외 타입
            - 고치기 전후 스택 트레이스의 차이
          hints:
            - 예외를 새로 만들 때 넘길 수 있는 것이 메시지만은 아닙니다.
            - RuntimeException을 그대로 던지면 위에서 이 실패만 골라 잡을 수 있을까요?
            - 메시지에 무엇이 빠져 있는지도 보세요. 어느 건인지 알 수 있나요?
          modelAnswer: |-
            잃는 것은 **원인 예외**와 **구분 가능한 타입** 두 가지다.

            ```java
            public class OrderNotAccessibleException extends RuntimeException {
                public OrderNotAccessibleException(long orderId, Throwable cause) {
                    super("주문 조회 실패: " + orderId, cause);
                }
            }

            public Order find(long id) {
                try {
                    return repository.findById(id);
                } catch (SQLException cause) {
                    throw new OrderNotAccessibleException(id, cause);
                }
            }
            ```

            고치기 전에는 스택 트레이스가 `RuntimeException: 조회 실패` 한 덩어리로 끝난다.
            고친 뒤에는 그 아래에 `Caused by: java.sql.SQLException: ...` 이 붙고,
            **DB에서 터진 실제 줄**까지 따라간다.
            타입을 나눈 덕분에 위 계층이 이 실패만 골라 다룰 수도 있게 됐다.
          selfChecks:
            - 원인 예외를 새 예외의 인자로 넘겼는가
            - RuntimeException 대신 구분되는 타입을 만들었는가
            - 메시지에 어느 건인지 알 수 있는 값이 들어 있는가
            - 고친 뒤 스택 트레이스에 Caused by 줄이 붙는 것을 확인했는가
      - key: LESSON.JAVA.EXCEPTION.001.U3
        title: 잡지 말아야 할 것 잡지 않기
        minutes: 10
        core: true
        explain: |-
          가장 흔한 사고는 **너무 넓게 잡는 것**이다.

          ```java
          try {
              process(order);
          } catch (Exception e) {       // 무엇이든 잡힌다
              log.warn("실패");          // 원인은 어디에도 없다
          }
          ```

          이 한 덩어리에 `NullPointerException`도, 설정 오류도, 위에서 처리했어야 할
          도메인 예외도 전부 빨려 들어간다. 프로그램은 계속 돌지만
          **잘못된 상태로 계속 돈다.** 그리고 로그에는 "실패" 네 글자만 남는다.

          정석은 세 가지다.

          1. **잡을 예외만 이름으로 잡는다.** `catch (Exception)`은 최상단 한 곳에서만
          2. **잡았으면 반드시 무언가 한다.** 회복하든, 바꿔 던지든, 원인과 함께 로그를 남기든
          3. **빈 `catch` 블록을 두지 않는다.** 삼킨 예외는 되찾을 수 없다
        example:
          language: java
          code: |-
            // 나쁜 예 — 무엇이 실패했는지 남지 않는다
            static void bad(String rawQuantity) {
                try {
                    int quantity = Integer.parseInt(rawQuantity);
                    System.out.println("수량 " + quantity);
                } catch (Exception e) {
                    System.out.println("실패");
                }
            }

            // 좋은 예 — 잡을 것만 잡고, 잡았으면 바꿔 던진다
            static int good(String rawQuantity) {
                try {
                    return Integer.parseInt(rawQuantity);
                } catch (NumberFormatException cause) {
                    throw new IllegalArgumentException("수량이 숫자가 아니다: " + rawQuantity, cause);
                }
            }

            bad("three");
            System.out.println(good("2"));
            System.out.println(good("three"));
          output: |-
            실패
            2
            Exception in thread "main" java.lang.IllegalArgumentException: 수량이 숫자가 아니다: three
              Caused by: java.lang.NumberFormatException: For input string: "three"
          note: |-
            - `bad`는 무엇이 잘못됐는지 **입력값조차** 남기지 않는다
            - `good`은 잡는 예외를 이름으로 좁혔다 — 다른 실패는 그대로 위로 간다
            - 바꿔 던지면서 원인을 넘겨 `Caused by` 가 붙었다
            - 메시지에 들어온 값이 있어 재현할 수 있다
        predict:
          question: '`bad`에 넘긴 값이 `null`이면 출력은 무엇이 되나?'
          choices:
            - 실패
            - 수량 0
            - NullPointerException이 밖으로 던져진다
            - 아무것도 출력되지 않는다
          answer: 실패
          explanation: |-
            `Integer.parseInt(null)`은 `NumberFormatException`을 던지는데,
            `catch (Exception)`이 그것까지 삼킨다. 코드의 버그와 사용자 입력 오류가
            **같은 한 줄로** 뭉개지는 것이 넓게 잡기의 진짜 비용이다.
        complete:
          question: 잡을 것만 좁게 잡고, 잡은 뒤 원인과 함께 다시 던지도록 빈칸을 채우세요.
          code: |-
            try {
                return LocalDate.parse(rawDate);
            } catch (___ cause) {
                throw new IllegalArgumentException("날짜 형식이 잘못됐다: " + rawDate, ___);
            }
          answers:
            - [DateTimeParseException]
            - [cause]
          explanation: |-
            `LocalDate.parse`가 던지는 것은 `DateTimeParseException` 하나다.
            그것만 이름으로 잡으면 다른 실패는 위로 그대로 올라간다.
            잡은 예외는 원인으로 넘겨 사슬을 잇는다.
        problem:
          prompt: |-
            아래 코드에는 예외를 다루는 잘못이 **세 가지** 있다.

            ```java
            public void placeOrder(OrderRequest request) {
                try {
                    validate(request);
                    stockService.take(request.productCode(), request.quantity());
                    paymentClient.charge(request.orderId(), request.amount());
                } catch (Exception e) {
                } catch (Throwable t) {
                    log.error("주문 실패");
                }
            }
            ```

            - 세 가지를 각각 지적하고 **무엇이 안 보이게 되는지** 적으세요
            - 세 호출이 서로 다른 실패를 낸다고 보고 고쳐 쓰세요
          deliverables:
            - 잘못 세 가지와 각각이 감추는 것
            - 고친 placeOrder 코드
            - 어느 실패를 여기서 잡고 어느 실패를 위로 올릴지 정한 기준 한 줄
          hints:
            - 잡는 범위, 잡은 뒤의 행동, 그리고 잡아서는 안 되는 것 — 세 각도로 보세요.
            - 아무 문장도 없는 블록이 무엇을 뜻하는지 생각해 보세요.
            - 세 호출의 실패는 성격이 다릅니다. 하나로 묶어 다룰 수 있을까요?
          modelAnswer: |-
            세 가지는 **① 빈 catch로 삼키기 ② `catch (Exception)` 으로 너무 넓게 잡기
            ③ `Throwable`까지 잡기** 다. 순서대로 모든 실패가 사라지고,
            코드 버그가 사용자 오류와 섞이고, 메모리 부족 같은 회복 불가능한 오류까지 붙잡는다.

            ```java
            public void placeOrder(OrderRequest request) {
                validate(request);                      // 잘못된 요청은 위로 올린다
                stockService.take(request.productCode(), request.quantity());
                try {
                    paymentClient.charge(request.orderId(), request.amount());
                } catch (IOException cause) {           // 외부 호출만 좁게 잡는다
                    throw new PaymentFailedException(request.orderId(), cause);
                }
            }
            ```

            기준은 하나다 — **여기서 할 수 있는 일이 있을 때만 잡는다.**
            검증 실패와 재고 부족은 응답으로 바꾸는 한 곳에서 다루면 되므로 그대로 올린다.
            외부 호출만 우리 말로 바꿔 던져, 위에서 결제 실패임을 알 수 있게 한다.
          selfChecks:
            - 빈 catch 블록을 하나도 남기지 않았는가
            - 잡는 예외를 이름으로 좁혔는가
            - Throwable이나 Error를 잡지 않았는가
            - 잡은 자리마다 회복, 변환, 로그 중 하나는 하고 있는가
    commonMistakes:
      - '`catch (Exception e)`로 넓게 잡는다. 코드 버그와 사용자 오류가 한 줄로 뭉개진다 (U3)'
      - 예외를 바꿔 던지면서 원인을 넘기지 않는다. 스택 트레이스가 그 자리에서 끊긴다 (U2)
      - 도메인 규칙 위반을 checked로 만든다. 처리하지 못하는 계층까지 `throws`가 번진다 (U1)
    inProject: |-
      주문 시스템에서 세 층이 각자 자기 말로 실패를 알린다. 도메인은 재고 부족·쿠폰 만료를
      unchecked 도메인 예외로 던지고, 저장소는 기술 예외를 우리 예외로 **원인과 함께** 바꿔 던지며,
      서비스는 잡을 수 있는 것만 좁게 잡는다. 이렇게 올라온 예외를 응답으로 바꾸는 일은
      다음 노트(스프링 예외 처리)에서 한 곳에 모은다.
    sources:
      - title: The Java Tutorials — Exceptions
        url: https://docs.oracle.com/javase/tutorial/essential/exceptions/index.html
        versionScope: Java SE
      - title: The Java Tutorials — The Catch or Specify Requirement
        url: https://docs.oracle.com/javase/tutorial/essential/exceptions/catchOrDeclare.html
        versionScope: Java SE
      - title: The Java Tutorials — Unchecked Exceptions, The Controversy
        url: https://docs.oracle.com/javase/tutorial/essential/exceptions/runtime.html
        versionScope: Java SE
      - title: The Java Tutorials — Chained Exceptions
        url: https://docs.oracle.com/javase/tutorial/essential/exceptions/chained.html
        versionScope: Java SE
    verifiedAt: 2026-09-24

  - key: LESSON.JAVA.EXCEPTION.TRY_WITH_RESOURCES.001
    skillCode: JAVA.EXCEPTION.TRY_WITH_RESOURCES
    title: 연 것을 반드시 닫기 (try-with-resources)
    whyItMatters: |-
      파일, DB 연결, HTTP 응답은 쓰고 나서 닫아야 한다. 닫지 않으면 당장은 멀쩡하다가
      며칠 뒤 커넥션 풀이 마르거나 파일 핸들이 바닥나서 서비스가 멈춘다.
      더 나쁜 것은 닫는 코드를 잘못 써서 **진짜 원인이 사라지는** 경우인데,
      이것은 finally로 손수 닫을 때 실제로 일어난다.
    oneLine: try 괄호 안에서 연 자원은 블록을 벗어날 때 자동으로, 역순으로 닫힌다.
    units:
      - key: LESSON.JAVA.EXCEPTION.TRY_WITH_RESOURCES.001.U1
        title: finally의 함정과 try-with-resources
        minutes: 10
        core: true
        explain: |-
          자바 7 전에는 `finally`에서 손수 닫았다. 공식 튜토리얼이 지적하는 문제는 두 가지다.

          첫째, **길다.** 자원마다 null 검사와 `close()`의 예외 처리가 붙는다.
          둘째, 더 심각한 것 — **`finally` 안에서 예외가 나면 원래 예외를 덮어쓴다.**

          ```java
          try {
              reader.read();      // ← 여기서 IOException (진짜 원인)
          } finally {
              reader.close();     // ← 여기서도 IOException (덮어쓴다)
          }
          ```

          밖에서 받는 것은 **닫다가 난 예외**뿐이다. 진짜 원인은 사라진다.

          `try` 괄호 안에 자원을 선언하면 컴파일러가 닫는 코드를 넣어 준다.
          닫히는 순서는 **선언의 역순**이고, 조건은 하나 — `AutoCloseable`을 구현할 것.
        example:
          language: java
          code: |-
            static final class Resource implements AutoCloseable {
                private final String name;
                Resource(String name) {
                    this.name = name;
                    System.out.println("열림 " + name);
                }
                void use() {
                    System.out.println("사용 " + name);
                }
                @Override public void close() {
                    System.out.println("닫힘 " + name);
                }
            }

            try (Resource first = new Resource("연결");
                 Resource second = new Resource("파일")) {
                first.use();
                second.use();
                throw new IllegalStateException("처리 중 실패");
            } catch (IllegalStateException e) {
                System.out.println("잡음: " + e.getMessage());
            }
          output: |-
            열림 연결
            열림 파일
            사용 연결
            사용 파일
            닫힘 파일
            닫힘 연결
            잡음: 처리 중 실패
          note: |-
            - 예외가 났는데도 **둘 다 닫혔다** — `finally`를 쓰지 않았는데도
            - 닫히는 순서가 `파일` → `연결` 로 **선언의 역순**이다
            - 닫기가 `catch`보다 **먼저** 일어난다 — 잡기 전에 이미 정리가 끝나 있다
            - `AutoCloseable`을 구현하지 않으면 `try` 괄호 안에 쓸 수 없다
        predict:
          question: 두 자원의 선언 순서를 바꾸면 출력의 닫힘 순서는 어떻게 되나?
          choices:
            - 닫힘 연결 → 닫힘 파일
            - 닫힘 파일 → 닫힘 연결 (그대로)
            - 닫히지 않는다
            - 순서는 그때그때 다르다
          answer: 닫힘 연결 → 닫힘 파일
          explanation: |-
            항상 **선언의 역순**으로 닫힌다. 뒤에 연 것이 앞에 연 것에 기대고 있을 수 있기 때문이다.
            DB 연결을 먼저 열고 그 위에 statement를 여는 순서가 자연스러운 이유다.
        complete:
          question: 파일을 읽는 코드를 try-with-resources로 바꾸세요.
          code: |-
            try (var reader = Files.newBufferedReader(path)___ {
                return reader.readLine();
            } catch (IOException cause) {
                throw new UncheckedIOException("읽기 실패: " + path, ___);
            }
          answers:
            - [")"]
            - [cause]
          explanation: |-
            자원 선언은 `try` **괄호 안**에 두고 세미콜론 없이 닫는다.
            `close()`는 컴파일러가 넣어 주므로 `finally`가 필요 없다.
        problem:
          prompt: |-
            아래 코드를 try-with-resources로 고치세요.

            ```java
            BufferedReader reader = null;
            try {
                reader = Files.newBufferedReader(path);
                return reader.readLine();
            } catch (IOException e) {
                return null;
            } finally {
                if (reader != null) {
                    try { reader.close(); } catch (IOException ignored) { }
                }
            }
            ```

            - 이 코드에 있는 문제를 **세 가지** 지적하세요
            - try-with-resources로 고치고, 실패를 삼키지 않도록 바꾸세요
          deliverables:
            - 문제 세 가지
            - 고친 코드
            - 고친 뒤 몇 줄이 줄었는지와 무엇이 더 안전해졌는지
          hints:
            - 닫는 코드 말고도 문제가 있습니다. 실패했을 때 무엇을 돌려주고 있나요?
            - 닫다가 난 예외를 어떻게 하고 있는지 보세요.
            - 앞 노트에서 "잡았으면 반드시 무언가 한다"고 했습니다. 여기는 어떤가요?
          modelAnswer: |-
            문제는 **① 실패를 `null`로 뭉개기 ② 닫기 실패를 빈 catch로 삼키기
            ③ null 검사와 중첩 try로 길어진 정리 코드** 다.

            ```java
            try (BufferedReader reader = Files.newBufferedReader(path)) {
                return reader.readLine();
            } catch (IOException cause) {
                throw new UncheckedIOException("파일 읽기 실패: " + path, cause);
            }
            ```

            12줄이 5줄이 됐고, 더 중요한 것은 **실패가 사라지지 않는다**는 점이다.
            읽기 실패는 원인과 함께 위로 올라가고, 닫기 실패도 삼켜지지 않는다
            (다음 단위에서 그것이 어디로 가는지 본다).
            부른 쪽은 `null`인지 확인할 필요가 없어졌다.
          selfChecks:
            - finally와 null 검사를 모두 없앴는가
            - 실패를 null로 바꾸지 않고 위로 올렸는가
            - 빈 catch 블록이 남아 있지 않은가
            - 원인 예외를 함께 넘겼는가
      - key: LESSON.JAVA.EXCEPTION.TRY_WITH_RESOURCES.001.U2
        title: 닫다가 난 예외는 어디로 가나 (suppressed)
        minutes: 10
        core: true
        explain: |-
          본문에서도 예외가 나고 닫다가도 예외가 나면 어느 것이 밖으로 갈까.

          공식 문서의 규칙은 분명하다 — **본문의 예외가 밖으로 나가고,
          닫다가 난 예외는 거기에 매달려 간다.** 매달린 쪽을
          **suppressed 예외**라 하고 `getSuppressed()`로 꺼낸다.

          `finally`로 손수 닫을 때와 정반대다. `finally`에서는 나중에 난 예외가
          먼저 난 예외를 **덮어써서** 진짜 원인이 사라졌다.
          try-with-resources는 **둘 다 남긴다.**

          이것이 손수 닫기보다 나은 진짜 이유다. 짧아서가 아니라,
          **원인을 잃지 않아서**다.
        example:
          language: java
          code: |-
            static final class FailingResource implements AutoCloseable {
                @Override public void close() {
                    throw new IllegalStateException("닫기 실패");
                }
            }

            try (FailingResource resource = new FailingResource()) {
                throw new IllegalArgumentException("본문 실패");
            } catch (RuntimeException e) {
                System.out.println("밖으로 나온 것: " + e.getMessage());
                for (Throwable suppressed : e.getSuppressed()) {
                    System.out.println("매달린 것: " + suppressed.getMessage());
                }
            }
          output: |-
            밖으로 나온 것: 본문 실패
            매달린 것: 닫기 실패
          note: |-
            - 밖으로 나온 것은 **본문의 예외**다 — 진짜 원인이 살아 있다
            - 닫기 실패는 `getSuppressed()` 안에 남았다. 사라지지 않았다
            - 로그에 찍으면 `Suppressed:` 줄로 함께 나온다
            - `finally`로 닫았다면 밖에 나오는 것은 "닫기 실패" 하나뿐이었을 것이다
        predict:
          question: 본문에서 예외를 던지지 않고 정상으로 끝나면 출력은 어떻게 되나?
          choices:
            - 닫기 실패가 그대로 밖으로 던져진다
            - 아무 일도 없이 끝난다
            - 본문 실패가 출력된다
            - 컴파일 오류가 난다
          answer: 닫기 실패가 그대로 밖으로 던져진다
          explanation: |-
            매달릴 본문 예외가 없으면 닫기 예외가 **주인공이 되어** 밖으로 나간다.
            suppressed는 "둘 다 났을 때 어느 쪽을 앞에 세우나"의 규칙이지,
            닫기 실패를 숨기는 장치가 아니다.
        complete:
          question: 잡은 예외에 매달린 예외가 있는지 확인하는 코드입니다. 빈칸을 채우세요.
          code: |-
            } catch (RuntimeException e) {
                log.error("작업 실패", e);
                for (Throwable suppressed : e.___()) {
                    log.warn("정리 중 실패: {}", suppressed.___());
                }
            }
          answers:
            - [getSuppressed]
            - [getMessage, toString]
          explanation: |-
            `getSuppressed()`는 배열을 돌려준다. 매달린 것이 없으면 빈 배열이다.
            대부분의 로그 구현은 예외를 넘기면 `Suppressed:` 줄까지 알아서 찍어 준다.
        problem:
          prompt: |-
            두 가지 방식이 **원인을 얼마나 남기는지** 직접 비교하세요.

            - 닫을 때 반드시 예외를 던지는 자원 타입을 하나 만드세요
            - 같은 상황(본문 실패 + 닫기 실패)을 `finally`로 닫는 방식과
              try-with-resources 방식으로 각각 작성하고 실행하세요
            - 두 경우에 **밖으로 나온 예외**와 **잃어버린 예외**를 표로 정리하세요
          deliverables:
            - 자원 타입과 두 가지 방식의 코드
            - 두 방식의 실행 결과
            - 밖으로 나온 것과 잃어버린 것을 비교한 표
          hints:
            - 두 방식 모두 본문과 닫기에서 각각 다른 메시지의 예외를 던지게 하세요.
            - finally 쪽은 잡은 예외의 메시지만 찍어 보면 차이가 바로 보입니다.
            - try-with-resources 쪽은 메시지 하나만 봐서는 부족합니다. 매달린 것도 꺼내 보세요.
          modelAnswer: |-
            ```java
            static final class FailingResource implements AutoCloseable {
                @Override public void close() {
                    throw new IllegalStateException("닫기 실패");
                }
            }

            // finally 방식 — 덮어쓴다
            FailingResource resource = new FailingResource();
            try {
                throw new IllegalArgumentException("본문 실패");
            } finally {
                resource.close();
            }

            // try-with-resources — 둘 다 남는다
            try (FailingResource r = new FailingResource()) {
                throw new IllegalArgumentException("본문 실패");
            }
            ```

            | 방식 | 밖으로 나온 예외 | 잃어버린 예외 |
            |---|---|---|
            | `finally` | 닫기 실패 | **본문 실패 (진짜 원인)** |
            | try-with-resources | 본문 실패 | 없음 — 닫기 실패는 suppressed |

            `finally`가 위험한 이유가 이 표 한 칸이다.
            장애 분석에서 보게 되는 것이 "닫기 실패"뿐이라면 원인을 영영 못 찾는다.
          selfChecks:
            - 두 방식 모두 실제로 실행해 결과를 확인했는가
            - finally 방식에서 본문 예외가 사라지는 것을 눈으로 보았는가
            - try-with-resources 쪽에서 매달린 예외를 꺼내 확인했는가
      - key: LESSON.JAVA.EXCEPTION.TRY_WITH_RESOURCES.001.U3
        title: 내가 만든 타입을 자원으로 쓰기
        minutes: 8
        core: false
        explain: |-
          `AutoCloseable`은 메서드 하나짜리 인터페이스다.

          ```java
          public interface AutoCloseable {
              void close() throws Exception;
          }
          ```

          내 타입에 이것을 구현하면 `try` 괄호 안에 쓸 수 있다.
          쓸 때 지킬 것이 두 가지 있다.

          **하나, `close()`가 예외를 던지지 않게 만드는 편이 낫다.**
          던질 수 있으면 부르는 쪽이 매번 그것까지 신경 써야 한다.
          `Closeable`(IO 전용)은 `IOException`만 던지도록 좁혀 놓은 것이다.

          **둘, 여러 번 불러도 안전하게 만든다.** 닫힌 것을 또 닫아도
          아무 일도 일어나지 않아야 한다 — 이것을 멱등(idempotent)이라 한다.
        example:
          language: java
          code: |-
            static final class OrderBatch implements AutoCloseable {

                private final List<String> pending = new ArrayList<>();
                private boolean closed;

                void add(String orderId) {
                    if (closed) {
                        throw new IllegalStateException("이미 닫힌 배치다");
                    }
                    pending.add(orderId);
                }

                @Override public void close() {
                    if (closed) {
                        return;                      // 두 번 닫아도 안전하다
                    }
                    closed = true;
                    System.out.println("정리 " + pending.size() + "건");
                    pending.clear();
                }
            }

            try (OrderBatch batch = new OrderBatch()) {
                batch.add("1001");
                batch.add("1002");
                batch.close();                        // 일부러 먼저 닫아 본다
            }
          output: |-
            정리 2건
          note: |-
            - `close()`에 `throws`가 없다 — 부르는 쪽이 신경 쓸 것이 없다
            - `closed` 깃발로 두 번째 호출을 막았다. 그래서 출력이 한 번뿐이다
            - 손으로 닫은 뒤 블록을 벗어나며 한 번 더 불렸지만 조용히 지나갔다
            - 닫힌 뒤에 쓰려 하면 `IllegalStateException`으로 분명히 알린다
        predict:
          question: '`close()`에서 `closed` 검사를 지우면 출력은 어떻게 되나?'
          choices:
            - 정리 2건, 정리 0건 두 줄이 나온다
            - 정리 2건 한 줄 그대로다
            - 예외가 난다
            - 아무것도 출력되지 않는다
          answer: 정리 2건, 정리 0건 두 줄이 나온다
          explanation: |-
            손으로 한 번, 블록을 벗어나며 한 번 — 모두 두 번 불린다.
            두 번째는 이미 비워진 뒤라 0건이다.
            정리 작업이 로그 출력이 아니라 **커밋이나 전송**이었다면
            같은 일이 두 번 일어났을 것이다. 멱등이 필요한 이유다.
        complete:
          question: 시간을 재는 자원을 만드세요. 블록을 벗어나면 걸린 시간을 찍습니다.
          code: |-
            static final class Timer implements ___ {
                private final long startedAt = System.nanoTime();
                @Override public void ___() {
                    System.out.println((System.nanoTime() - startedAt) / 1_000_000 + "ms");
                }
            }
          answers:
            - [AutoCloseable]
            - [close]
          explanation: |-
            `AutoCloseable`의 메서드는 `close()` 하나뿐이다.
            이렇게 "블록을 벗어날 때 반드시 할 일"을 자원으로 만들면
            빠뜨릴 수 없게 된다 — 파일이나 연결이 아니어도 쓸 수 있는 방식이다.
        problem:
          prompt: |-
            주문 처리 구간의 소요 시간을 재는 `MeasuredSection`을 작성하세요.

            - `try (var section = MeasuredSection.start("주문 저장")) { ... }` 로 쓴다
            - 블록을 벗어나면 이름과 걸린 밀리초를 남긴다
            - **본문에서 예외가 나도** 시간이 남아야 한다
            - 두 번 닫아도 두 번 남지 않아야 한다
            - 예외가 났을 때와 정상일 때를 구분해 남기도록 만들어 보세요
          deliverables:
            - MeasuredSection의 코드
            - 정상 실행과 예외 발생 두 경우의 실행 결과
            - 예외 여부를 어떻게 알아냈는지 설명 한 줄
          hints:
            - 블록을 벗어날 때 부르는 메서드는 예외가 났는지 모릅니다. 어떻게 알려 줄 수 있을까요?
            - 본문 마지막 줄에서 "여기까지 왔다"고 표시해 두는 방법이 있습니다.
            - 두 번 닫는 것을 막는 방법은 앞 예제에 있습니다.
          modelAnswer: |-
            ```java
            public final class MeasuredSection implements AutoCloseable {

                private final String name;
                private final long startedAt = System.nanoTime();
                private boolean succeeded;
                private boolean closed;

                private MeasuredSection(String name) {
                    this.name = name;
                }

                public static MeasuredSection start(String name) {
                    return new MeasuredSection(name);
                }

                public void succeed() {
                    succeeded = true;
                }

                @Override public void close() {
                    if (closed) {
                        return;
                    }
                    closed = true;
                    long millis = (System.nanoTime() - startedAt) / 1_000_000;
                    System.out.println(name + " " + (succeeded ? "성공" : "실패") + " " + millis + "ms");
                }
            }
            ```

            `close()`는 예외가 났는지 알 수 없으므로, 본문 마지막에서 `succeed()`를 불러
            **끝까지 갔다는 사실**을 남긴다. 예외로 빠져나가면 그 줄에 닿지 못하니 실패로 찍힌다.
            `closed` 깃발로 두 번 남는 것을 막았다.
          selfChecks:
            - 예외가 나도 시간이 남는 것을 확인했는가
            - 두 번 닫아도 한 번만 남는가
            - close()가 예외를 던지지 않게 만들었는가
            - 성공과 실패를 구분하는 방법이 본문을 어지럽히지 않는가
    commonMistakes:
      - '`finally`에서 손수 닫는다. 닫다가 난 예외가 본문 예외를 덮어써 진짜 원인이 사라진다 (U2)'
      - '닫기 실패를 빈 `catch (IOException ignored) {}`로 삼킨다. 자원이 새는 것을 영영 못 본다 (U1)'
      - '`close()`를 여러 번 불러도 안전하게 만들지 않는다. 정리 작업이 두 번 일어난다 (U3)'
    inProject: |-
      주문 시스템에서 파일 업로드, 외부 결제 응답 읽기, 대량 처리 배치가 이 자리다.
      JDBC를 직접 쓰는 곳이 있다면 연결·statement·결과 집합을 한 `try` 괄호 안에서 열어
      역순으로 닫히게 둔다. 시간 측정이나 임시 잠금처럼 **반드시 풀어야 하는 것**도
      `AutoCloseable`로 만들어 두면 빠뜨릴 수 없게 된다.
