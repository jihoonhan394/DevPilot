# DevPilot 개념 노트 — 들어오는 값을 믿지 않는다 (입력 검증)
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - Bean Validation 노트가 "형식을 어떻게 선언하는가"를 다룬다. 여기서는 "왜 서버가 마지막 방어선인가"를 다룬다
# - 실제 계정·키 값은 쓰지 않는다. 자리표시자만 쓴다
lessons:
  - key: LESSON.SECURITY.INPUT_VALIDATION.001
    skillCode: SECURITY.INPUT_VALIDATION
    title: 들어오는 값을 믿지 않는다 (입력 검증)
    whyItMatters: |-
      화면에서 이미 검사했으니 서버는 안 해도 된다고 생각하기 쉽다.
      그런데 화면은 사용자 쪽에서 돌고, 요청은 화면을 거치지 않고도 만들 수 있다.
      **서버가 마지막이자 유일한 방어선**이다.
      여기가 뚫리면 남의 데이터가 새거나, 값이 조용히 망가진 채 DB에 쌓인다.
      나중에 "언제부터 이 값이 이상했지"를 되짚는 일이 훨씬 비싸다.
    oneLine: 입력 검증은 **서버에서** 하고, 막는 방식은 **허용할 것을 정하는 쪽**이며, 위험한 자리는 값을 조립하지 않고 **자리표시자로 넘긴다**.
    units:
      - key: LESSON.SECURITY.INPUT_VALIDATION.001.U1
        title: 서버가 마지막 방어선이다
        minutes: 10
        core: true
        explain: |-
          화면의 검사는 **사용자 경험**이다. 잘못 입력했을 때 빨리 알려 주는 것.
          보안이나 데이터 무결성을 지키는 것은 **서버의 검사**다.

          이유는 단순하다. 요청은 화면 없이도 만들 수 있다.

          - 개발자도구로 화면 코드를 고칠 수 있다
          - `curl` 한 줄이면 화면을 아예 거치지 않는다
          - 모바일 앱·외부 시스템은 애초에 그 화면을 쓰지 않는다

          검사해야 할 것은 세 겹이다.

          - **형식** — 타입, 길이, 범위, 필수 여부. "이메일 모양인가"
          - **업무 규칙** — "취소된 주문에 또 취소를 걸 수 있는가"
          - **권한** — "이 값이 가리키는 자원이 이 사람 것인가" (인가와 겹치는 자리)

          형식만 검사하고 뒤의 둘을 빠뜨리는 일이 흔하다.
          형식이 완벽한 요청도 **남의 주문 id**를 담고 있을 수 있다.

          그리고 검증 실패는 **400**이다. 서버 오류(500)가 아니다 —
          잘못은 요청에 있고, 같은 요청을 다시 보내도 결과는 같다.
        example:
          language: http
          code: |-
            # 화면에서 수량을 1~10 으로 제한해 두었다고 하자

            # 화면을 거친 요청
            POST /api/v1/orders HTTP/1.1
            Content-Type: application/json

            {"productId": "<product-id>", "quantity": 3}

            # 화면을 거치지 않은 요청 — 같은 API, 다른 값
            POST /api/v1/orders HTTP/1.1
            Content-Type: application/json

            {"productId": "<product-id>", "quantity": -5}
          output: |-
            서버에 검사가 없으면
              → 수량 -5 로 주문이 만들어진다. 금액이 음수가 된다

            서버에 검사가 있으면
              HTTP/1.1 400 Bad Request
              {"code": "VALIDATION_FAILED", "errors": [{"field": "quantity", "code": "Min"}]}
          note: |-
            - 화면 검사는 편의, 서버 검사는 방어선이다
            - 형식·업무 규칙·권한 세 겹을 본다. 형식만 보면 절반이다
            - 검증 실패는 400이다. 500이 아니다
        predict:
          question: '화면에서 수량을 1~10으로 제한했는데 서버에는 검사가 없습니다. `quantity: -5`로 요청하면?'
          choices:
            - 그대로 저장된다. 화면을 거치지 않으면 막을 것이 없다
            - 브라우저가 막는다
            - Spring이 자동으로 음수를 거른다
            - DB가 거부한다
          answer: 그대로 저장된다. 화면을 거치지 않으면 막을 것이 없다
          explanation: |-
            화면의 제한은 그 화면을 쓸 때만 작동한다.
            `curl`이나 앱에서 보낸 요청은 그 코드를 지나지 않는다.
            DB 제약이 있다면 거기서 막힐 수도 있지만, 그건 **우연히 막힌 것**이고
            오류 메시지도 사용자에게 쓸 수 없는 형태로 나온다. 서버에서 명시적으로 막아야 한다.
        complete:
          question: 수량을 1 이상 10 이하로 제한하는 검증 애너테이션을 쓰세요.
          code: |-
            public record CreateOrderRequest(
                    @NotNull UUID productId,
                    @___(1) @___(10) int quantity) {}
          answers:
            - [Min]
            - [Max]
          explanation: |-
            `@Min(1)`과 `@Max(10)`이다. 요청 record에 선언해 두면
            컨트롤러에 닿기 전에 걸러지고, 실패는 400으로 내려간다.
        problem:
          prompt: |-
            주문 생성 API에 이런 요청 record가 있습니다.

            ```java
            public record CreateOrderRequest(UUID productId, int quantity, String memo) {}
            ```

            검증이 하나도 없습니다.

            1. 형식 수준에서 **무엇을 막아야 하는지** 항목별로
            2. 형식 검사만으로는 못 막는 것 하나와 그 이유
            3. 검증 실패를 400으로 내려야 하는 이유
          deliverables:
            - 세 물음에 대한 답
            - 1번은 필드마다
          hints:
            - 각 필드에 들어올 수 있는 최악의 값을 떠올려 보세요.
            - 형식이 완벽한 요청도 남의 것을 가리킬 수 있습니다.
            - 잘못이 요청에 있는지 서버에 있는지로 갈라 보세요.
          modelAnswer: |-
            **1. 형식 수준에서 막을 것**

            - `productId` — **필수**. 비어 있으면 무엇을 주문하는지 알 수 없다
            - `quantity` — **1 이상**, 그리고 상한. 음수면 금액이 음수가 되고,
              상한이 없으면 터무니없는 수량이 들어온다
            - `memo` — **길이 제한**. 제한이 없으면 아주 긴 문자열로 저장소와 로그를 밀어낼 수 있다.
              선택 값이면 없어도 되게 둔다

            **2. 형식으로 못 막는 것**

            **`productId`가 실제로 존재하는지, 그리고 지금 주문 가능한 상품인지.**
            형식(UUID 모양)은 완벽해도 없는 상품이거나 판매 중지 상품일 수 있다.
            이건 **업무 규칙**이라 조회해서 확인해야 한다.
            같은 이유로 "이 자원이 이 사람 것인가"도 형식으로는 못 막는다.

            **3. 400인 이유**

            잘못이 **요청에 있기** 때문이다. 서버는 정상이고, 같은 요청을 다시 보내도 결과는 같다.
            500을 주면 클라이언트는 "서버 문제니 재시도하면 되겠다"로 읽고 같은 요청을 반복한다.
            또 운영 로그에서 **서버 장애와 잘못된 요청이 섞여** 진짜 장애를 놓치게 된다.
          selfChecks:
            - 세 필드 각각에 대해 막을 것을 적었는가 (길이 제한을 빠뜨리지 않았는가)
            - 형식으로 못 막는 것을 업무 규칙·권한으로 설명했는가
            - 400인 이유를 "잘못이 요청에 있다"로 말했는가

      - key: LESSON.SECURITY.INPUT_VALIDATION.001.U2
        title: 막을 것을 고르지 말고 허용할 것을 정한다
        minutes: 12
        core: true
        explain: |-
          검증에는 두 가지 방식이 있다.

          - **거부 목록(denylist)** — 위험한 것을 골라 막는다
          - **허용 목록(allowlist)** — 괜찮은 것만 통과시키고 나머지는 전부 막는다

          **허용 목록이 옳다.** 거부 목록은 "내가 떠올린 위험"만 막는데,
          공격자는 내가 떠올리지 못한 것을 쓴다. 새 위험이 생기면 목록도 따라가야 하고,
          따라가는 쪽은 항상 늦는다.

          허용 목록이 특히 중요한 자리들이 있다.

          - **정렬 컬럼** — 사용자가 `sort=name`처럼 컬럼 이름을 준다.
            그대로 질의에 넣으면 아무 컬럼이나 지정할 수 있다.
            **미리 정한 이름만** 받고 나머지는 거부한다
          - **파일 이름·경로** — `../`가 섞이면 의도하지 않은 자리를 읽는다
          - **리다이렉트 주소** — 외부 주소를 넣으면 사용자를 다른 사이트로 보낸다

          공통 원리는 하나다. **사용자 입력이 "무엇을 할지"를 고르게 두지 않는다.**
          값은 받되, 그 값이 가리킬 수 있는 후보는 서버가 미리 정해 둔다.
        example:
          language: java
          code: |-
            // 거부 목록 — 빠뜨린 것이 반드시 생긴다
            if (sort.contains(";") || sort.contains(" ")) {
                throw new ValidationException("bad sort");
            }
            String sql = "select * from orders order by " + sort;   // 여전히 위험하다

            // 허용 목록 — 정한 것만 통과한다
            private static final Map<String, String> SORTABLE =
                    Map.of("createdAt", "created_at", "amount", "total_amount");

            String column = SORTABLE.get(sort);
            if (column == null) {
                throw new ValidationException("sort not allowed: " + sort);
            }
          output: |-
            거부 목록
              sort=created_at            → 통과
              sort=password_hash         → 통과 (막을 생각을 못 한 값)

            허용 목록
              sort=createdAt             → created_at 으로 바뀌어 통과
              sort=password_hash         → 거부
              sort=<생각지 못한 값>       → 거부
          note: |-
            - 거부 목록은 **내가 떠올린 것만** 막는다. 빠뜨린 쪽이 구멍이다
            - 허용 목록은 모르는 값을 **기본으로 거부**한다
            - 사용자가 준 이름을 그대로 쓰지 말고 **내부 이름으로 바꿔서** 쓴다
        predict:
          question: 정렬 파라미터를 거부 목록으로 검사하면 어떤 일이 생길 수 있나요?
          choices:
            - 막을 생각을 못 한 컬럼 이름이 통과한다
            - 모든 위험한 값이 확실히 막힌다
            - 성능이 느려질 뿐 안전하다
            - 컴파일 단계에서 걸러진다
          answer: 막을 생각을 못 한 컬럼 이름이 통과한다
          explanation: |-
            거부 목록은 **열거한 것만** 막는다. 열거하지 못한 값은 그대로 지나간다.
            정렬 컬럼처럼 후보가 정해져 있는 자리는 **허용 목록이 자연스럽고 안전하다** —
            "이 셋만 된다"가 요구사항 그대로이기 때문이다.
        complete:
          question: 허용 목록에서 내부 컬럼 이름을 꺼내고, 없으면 거부하도록 채우세요.
          code: |-
            String column = SORTABLE.___(sort);
            if (column == ___) {
                throw new ValidationException("sort not allowed");
            }
          answers:
            - [get]
            - ['null']
          explanation: |-
            허용 목록에서 꺼내 보고 **없으면(null) 거부**한다.
            이렇게 두면 목록에 없는 값은 전부 자동으로 막히고, 새 정렬을 추가할 때만 목록을 건드린다.
        problem:
          prompt: |-
            주문 목록 API에 정렬과 검색을 붙이려 합니다.

            ```text
            GET /api/v1/orders?sort=createdAt&direction=desc&keyword=<검색어>
            ```

            1. `sort`와 `direction`을 어떻게 검증할지
            2. `keyword`는 허용 목록으로 다룰 수 있는지, 없다면 어떻게 할지
            3. 셋 중 **가장 위험한 것**과 그 이유
          deliverables:
            - 세 물음에 대한 답
            - 1번은 구체적인 방식으로
          hints:
            - 후보가 정해져 있는 값과 그렇지 않은 값을 갈라 보세요.
            - 검색어는 사람이 자유롭게 쓰는 값입니다. 목록을 만들 수 있을까요?
            - 값이 질의의 어느 자리에 들어가는지가 위험도를 가릅니다.
          modelAnswer: |-
            **1. `sort`와 `direction`**

            둘 다 **후보가 정해져 있으므로 허용 목록**이다.

            - `sort` — `createdAt`, `amount`처럼 **미리 정한 이름만** 받고,
              내부 컬럼 이름으로 바꿔서 쓴다. 목록에 없으면 400
            - `direction` — `asc`/`desc` 둘뿐이다. 값 객체(enum)로 받으면 자동으로 걸러진다

            **2. `keyword`**

            검색어는 사람이 자유롭게 쓰는 값이라 **허용 목록을 만들 수 없다.**
            대신 다르게 다룬다.

            - **길이 상한**을 둔다
            - 질의에 **문자열로 이어 붙이지 않고 자리표시자로 넘긴다.**
              그러면 내용이 무엇이든 "값"으로만 쓰인다
            - 화면에 다시 보여 줄 때는 그대로 그리지 않는다

            **3. 가장 위험한 것 — `sort`**

            `keyword`는 값이 들어갈 자리가 정해져 있어 자리표시자로 넘기면 안전해진다.
            그런데 **컬럼 이름은 자리표시자로 넘길 수 없다.** 질의의 구조에 해당하기 때문에
            결국 문자열로 조립된다. 그래서 **허용 목록 외에는 막을 방법이 없고**,
            빠뜨리면 그대로 구멍이 된다.
          selfChecks:
            - '`sort`·`direction`을 허용 목록(또는 enum)으로 다뤘는가'
            - '`keyword`는 목록이 불가능함을 인정하고 다른 방법(길이·자리표시자)을 냈는가'
            - '`sort`가 가장 위험한 이유를 "구조라서 자리표시자로 못 넘긴다"로 설명했는가'

      - key: LESSON.SECURITY.INPUT_VALIDATION.001.U3
        title: 값을 문장에 붙이지 않는다
        minutes: 12
        core: true
        explain: |-
          입력이 **명령의 일부로 해석되는** 자리가 가장 위험하다.
          SQL이 대표적이다.

          ```java
          // 값을 문자열로 이어 붙인다 — 입력이 문장 구조를 바꿀 수 있다
          "select * from users where email = '" + email + "'"
          ```

          `email`에 따옴표와 조건이 섞여 들어오면 **조건 자체가 달라진다.**
          입력이 "값"이 아니라 "문법"으로 읽히기 때문이다.

          막는 방법은 검사보다 앞선 자리에 있다. **자리표시자로 넘긴다.**

          - 질의문에는 `?`나 이름만 두고 값은 따로 전달한다
          - DB는 문장을 먼저 해석하고 값을 나중에 끼운다.
            그래서 값에 무엇이 들어 있든 **문장 구조가 바뀌지 않는다**
          - JPA·Spring Data의 파라미터 바인딩이 이 일을 해 준다

          같은 원리가 다른 자리에도 적용된다 — 운영체제 명령, 파일 경로, 템플릿.
          **입력을 검사해서 안전하게 만들려 하지 말고, 해석되지 않는 자리에 넣는다.**

          검사는 여전히 필요하다. 다만 그것은 **업무 규칙**을 위한 것이지
          문법 해석을 막는 수단이 아니다.
        example:
          language: java
          code: |-
            // 위험 — 값이 문장 구조를 바꿀 수 있다
            String sql = "select * from users where email = '" + email + "'";
            jdbcTemplate.queryForList(sql);

            // 안전 — 값은 자리표시자로 따로 넘어간다
            jdbcTemplate.queryForList(
                    "select id, email from users where email = ?", email);

            // JPA 도 같다
            @Query("select u from User u where u.email = :email")
            Optional<User> findByEmail(@Param("email") String email);
          output: |-
            email 에 따옴표가 섞인 값이 들어왔을 때

              이어 붙인 경우 → 조건이 달라져 의도하지 않은 행이 나온다
              자리표시자    → 그 값 전체를 하나의 문자열로 찾는다. 결과 0건

            구조는 이미 정해졌고 값은 값으로만 쓰인다
          note: |-
            - 자리표시자는 **문장을 먼저 해석하고 값을 나중에** 끼운다
            - 그래서 값에 무엇이 들어 있든 구조가 바뀌지 않는다
            - 컬럼·테이블 이름은 구조라서 자리표시자로 못 넘긴다 → 허용 목록(U2)
        predict:
          question: 자리표시자로 넘긴 값에 따옴표와 조건문이 섞여 있으면?
          choices:
            - 그 전체가 하나의 값으로 취급되어 구조가 바뀌지 않는다
            - 조건이 추가되어 결과가 달라진다
            - 구문 오류가 난다
            - DB가 자동으로 특수문자를 지운다
          answer: 그 전체가 하나의 값으로 취급되어 구조가 바뀌지 않는다
          explanation: |-
            자리표시자를 쓰면 DB가 **질의문을 먼저 해석**하고 값을 나중에 끼운다.
            그 시점에는 구조가 이미 정해져 있어서 값이 문법으로 읽힐 수 없다.
            따옴표가 섞여 있어도 "따옴표가 들어간 문자열"을 찾을 뿐이다.
            특수문자를 지우거나 바꾸는 것이 아니라 **해석 순서**가 지켜 주는 것이다.
        complete:
          question: 값을 자리표시자로 넘기도록 빈칸을 채우세요.
          code: |-
            jdbcTemplate.queryForList(
                    "select id, email from users where email = ___", email);
          answers:
            - ['?']
          explanation: |-
            `?`를 두고 값을 인자로 넘긴다. 문장에는 값이 들어가지 않으므로
            입력이 무엇이든 구조를 바꿀 수 없다.
        problem:
          prompt: |-
            팀 코드에서 이런 것을 발견했습니다.

            ```java
            String sql = "select * from orders where user_id = '" + userId
                       + "' order by " + sort;
            ```

            1. 이 한 줄에 있는 **서로 다른 두 가지 문제**
            2. 각각 어떻게 고쳐야 하는지 (같은 방법이 아니다)
            3. "입력에서 위험한 문자를 지우면 되지 않나"에 대한 답
          deliverables:
            - 세 물음에 대한 답
            - 2번은 두 방법을 구분해서
          hints:
            - 두 값이 질의에서 하는 역할이 같은지 보세요.
            - 하나는 값이고 하나는 구조입니다.
            - 문자를 지우는 방식이 왜 따라가는 쪽이 되는지 생각해 보세요.
          modelAnswer: |-
            **1. 두 가지 문제**

            - `userId` — **값**인데 문자열로 이어 붙였다. 입력이 문법으로 읽힐 수 있다
            - `sort` — **구조(컬럼 이름)** 인데 사용자 입력을 그대로 넣었다.
              아무 컬럼이나 지정할 수 있다

            둘은 같은 줄에 있지만 성격이 다르다.

            **2. 고치는 방법 — 다르다**

            - `userId`는 **자리표시자로** 넘긴다.
              `"... where user_id = ?"` + 값 전달. 구조가 고정되므로 안전해진다
            - `sort`는 **자리표시자로 넘길 수 없다.** 컬럼 이름은 질의의 구조라서
              값 자리에 들어가지 않는다. **허용 목록**으로 미리 정한 이름만 받고
              내부 컬럼 이름으로 바꿔 쓴다

            같은 문제로 보고 한 가지 방법만 적용하면 절반이 남는다.

            **3. 위험한 문자를 지우는 방식**

            그건 **거부 목록**이고, 빠뜨린 문자와 인코딩 변형이 늘 남는다.
            또 값을 임의로 바꾸므로 **정상 입력까지 망가진다** —
            이름에 따옴표가 들어가는 사람도 있다.
            해석되지 않는 자리(자리표시자)에 넣는 편이 더 단순하고 더 안전하다.
          selfChecks:
            - 두 문제를 "값"과 "구조"로 갈랐는가
            - 고치는 방법을 자리표시자와 허용 목록으로 나눠 적었는가
            - 문자 제거 방식의 문제를 두 가지 이상 말했는가 (빠뜨림·정상 입력 훼손)

    commonMistakes:
      - 화면에서 검사했으니 서버는 생략한다. 요청은 화면을 거치지 않고도 만들어진다 (U1)
      - 위험한 문자를 지우는 방식으로 막으려 한다. 빠뜨린 것이 반드시 생긴다 (U2·U3)
      - 값과 구조를 같은 방법으로 막으려 한다. 컬럼 이름은 자리표시자로 넘길 수 없다 (U3)
    inProject: |-
      주문 시스템에 목록·검색·생성 API를 붙일 때 바로 쓴다.
      요청 record에 형식 검증을 선언해 컨트롤러 앞에서 걸리게 하고(U1),
      정렬 컬럼은 **허용 목록**으로 내부 이름에 맞춰 바꾼다(U2).
      질의에서 값은 전부 자리표시자로 넘기고, 문자열로 이어 붙인 자리가 있는지 훑는다(U3).
      그리고 형식이 통과한 뒤에도 **그 자원이 내 것인지**를 조회 조건에서 확인한다 —
      형식 검증은 소유권을 대신하지 못한다.
