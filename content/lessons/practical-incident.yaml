# DevPilot 개념 노트 — 장애 분석과 보고
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 4단계(배포와 로그)에서 쓴다. PRACTICAL_ENGINEERING.LOGGING 노트를 먼저 본 것으로 전제한다
# - 5단계의 EXPLANATION.TROUBLESHOOTING_STORY와 짝이다 — 여기는 현장, 거기는 설명이다
lessons:
  - key: LESSON.PRACTICAL_ENGINEERING.INCIDENT_ANALYSIS.001
    skillCode: PRACTICAL_ENGINEERING.INCIDENT_ANALYSIS
    title: 터졌을 때 무엇부터 하나 (장애 분석)
    whyItMatters: |-
      장애 때 가장 흔한 실수는 **원인을 찾으려다 피해를 키우는 것**이다.
      원인은 나중에도 찾을 수 있지만 멈춰 있는 시간은 되돌릴 수 없다.
      순서가 정해져 있으면 판단력이 떨어진 순간에도 손이 움직이고,
      그 순서를 아는 사람과 모르는 사람의 차이가 장애 때 가장 크게 벌어진다.
    oneLine: 장애는 영향 확인 → 완화 → 증거 보존 → 원인 분석 → 재발 방지 순서로 다루고, 완화가 원인보다 앞이다.
    units:
      - key: LESSON.PRACTICAL_ENGINEERING.INCIDENT_ANALYSIS.001.U1
        title: 원인보다 완화가 먼저다
        minutes: 12
        core: true
        explain: |-
          장애를 만나면 본능적으로 **왜 그런지** 보게 된다. 그런데 순서가 틀렸다.

          ```text
          1. 영향 확인   누가 얼마나 못 쓰고 있나
          2. 완화        지금 멈추게 한다
          3. 증거 보존   되돌리기 전에 남긴다
          4. 원인 분석   왜 그랬나
          5. 재발 방지   다음에 안 나게
          ```

          **2번이 4번보다 앞**인 것이 핵심이다.
          원인을 몰라도 멈출 수 있는 방법이 대개 있다.

          | 완화 수단 | 언제 |
          |---|---|
          | **되돌리기** | 최근 배포가 의심될 때. 가장 빠르다 |
          | 재시작 | 자원 고갈·메모리 누수로 보일 때 |
          | 기능 끄기 | 특정 기능만 문제일 때 |
          | 트래픽 줄이기 | 과부하일 때 |

          **1번을 건너뛰지 않는 것**도 중요하다.
          영향이 "전체 다운"인지 "특정 기능만"인지에 따라 완화 수단이 달라지고,
          알려야 할 사람도 달라진다.

          그리고 **3번**을 빠뜨리면 되돌린 뒤 원인을 못 찾는다.
          되돌리는 순간 그 상태의 로그와 지표가 의미를 잃기 때문이다.
        example:
          language: text
          code: |-
            10:05  알림 수신 (5xx 비율 초과)

            [1] 영향 확인 — 2분
                주문 생성만 실패, 조회는 정상
                5분간 약 340건 실패, 고객 문의 3건
                → 전체 다운은 아니다. 주문 경로만

            [2] 완화 — 판단
                최근 배포 09:50 (15분 전) → 되돌리기가 가장 빠름

            [3] 증거 보존 — 3분
                journalctl --since "09:45" > /tmp/incident-1005.log
                curl -s localhost:18081/actuator/metrics/hikaricp.connections.pending \
                    > /tmp/metrics-1005.json
                docker ps -a > /tmp/containers-1005.txt

            [2'] 되돌리기 실행 — 10:19
                이전 버전 배포, 10:21 정상 확인

            [4] 원인 분석 — 되돌린 뒤 차분히
                보존한 로그에서 결제 호출이 트랜잭션 경계 안으로 들어간 것 확인
          output: |-
            시간 배분

            10:05  알림
            10:07  영향 확인 완료
            10:10  증거 보존 완료
            10:19  되돌리기 완료
            10:21  정상 확인        ← 장애 16분

            [원인부터 찾았다면]
            로그 분석 40분 → 되돌리기 → 장애 50분 이상
          note: |-
            - 증거 보존이 **되돌리기 앞**에 있다. 순서가 바뀌면 증거가 사라진다
            - 영향 확인에 2분만 썼다. **정확할 필요는 없고 범위만** 알면 된다
            - 원인 분석은 **정상화된 뒤** 한다. 그때는 시간에 쫓기지 않는다
            - 340건·3건이라는 숫자가 나중에 보고의 "영향"이 된다
        predict:
          question: 되돌리기 전에 증거를 안 남기면?
          choices:
            - 정상화된 뒤 원인을 찾을 근거가 사라진다
            - 더 빨리 복구된다
            - 차이가 없다
            - 로그는 어차피 남는다
          answer: 정상화된 뒤 원인을 찾을 근거가 사라진다
          explanation: |-
            로그가 남아 있어도 **그때의 지표, 컨테이너 상태, 스레드 덤프**는 사라진다.
            그리고 로그도 보관 기간이 짧으면 며칠 뒤엔 없다.
            증거 보존은 3분이면 되고, 그 3분이 원인 분석을 가능하게 한다.
            다만 **피해가 매우 크면 완화를 먼저** 하고 남은 것으로 분석한다.
        complete:
          question: 장애 대응 순서를 채우세요.
          code: |-
            1. 영향 확인 — 누가 얼마나 못 쓰고 있나
            2. ___      — 지금 멈추게 한다 (원인을 몰라도 한다)
            3. 증거 보존 — 되돌리기 전에 남긴다
            4. ___      — 왜 그랬나 (정상화된 뒤)
            5. 재발 방지 — 다음에 안 나게
          answers:
            - [완화]
            - [원인 분석, 원인]
          explanation: |-
            **완화가 원인 분석보다 앞**이다. 원인은 나중에도 찾을 수 있지만
            멈춰 있는 시간은 되돌릴 수 없다.
        problem:
          prompt: |-
            아래 장애에서 **분 단위 대응 계획**을 세우세요.

            ```text
            14:20  결제 완료 알림이 안 간다는 문의 접수
                   주문은 정상, 결제도 정상, 알림만 안 감
                   최근 배포: 어제 18:00 (20시간 전)
            ```

            - 1~5단계를 **각각 몇 분씩** 쓸지 계획하고 무엇을 할지 적으세요
            - 이 경우 **되돌리기가 최선인지** 판단하고 이유를 적으세요
            - 완화 수단을 **두 가지** 제시하고 각각의 부작용을 적으세요
            - 보존할 증거를 **네 가지** 적으세요 (명령도 함께)
          deliverables:
            - 단계별 시간 배분과 할 일
            - 되돌리기 판단과 이유
            - 완화 수단 두 가지와 부작용
            - 보존할 증거 네 가지와 명령
          hints:
            - 20시간 전 배포면 배포가 원인일 가능성이 낮습니다.
            - 알림만 안 가면 전체 서비스는 살아 있습니다. 급한 정도가 다릅니다.
            - 못 간 알림을 나중에 보낼 수 있는지도 완화입니다.
          modelAnswer: |-
            | 단계 | 시간 | 할 일 |
            |---|---|---|
            | 1 영향 확인 | 5분 | 언제부터인지, 전부인지 일부인지, 몇 건인지 |
            | 2 완화 | 10분 | 아래 참조 |
            | 3 증거 보존 | 3분 | 아래 참조 |
            | 4 원인 분석 | 30분+ | 정상화 뒤 |
            | 5 재발 방지 | 별도 | 당일 안에 계획만 |

            **되돌리기는 최선이 아니다.** 20시간 전 배포이고 그 사이에 알림이 갔다면
            배포가 원인일 가능성이 낮다. 되돌려도 안 고쳐질 것이고
            **다른 정상 기능만 옛 버전으로 돌아간다.**
            게다가 이 장애는 **주문과 결제가 정상**이라 전체 다운보다 급하지 않다.
            시간을 조금 더 써서 원인을 좁히는 것이 낫다.

            **완화 수단**
            **① 알림 발송을 수동으로 재시도** — 못 간 건을 찾아 다시 보낸다.
            부작용: 중복 발송 가능. 멱등 처리가 없으면 두 번 받는다.
            **② 알림 채널을 임시로 다른 것으로** (예: 앱 푸시 실패 시 메일).
            부작용: 사용자가 평소와 다른 경로로 받아 혼란. 그리고 채널별 실패율이 다르다.

            **보존할 증거**
            ```bash
            journalctl -u order-service --since "어제 18:00" > /tmp/inc-1420.log
            curl -s localhost:18081/actuator/metrics/http.server.requests > /tmp/metrics.json
            psql -c "select count(*), status from notifications
                     where created_at > now() - interval '24 hours' group by status" \
                 > /tmp/notification-status.txt
            curl -sI https://notification-vendor.example/health > /tmp/vendor-health.txt
            ```
            네 번째가 중요하다 — **외부 알림 업체 쪽 상태**다.
            우리 배포가 아니라면 상대 쪽 변화일 수 있다.
          selfChecks:
            - 완화를 원인 분석보다 앞에 두었는가
            - 되돌리기가 최선인지 근거를 대고 판단했는가
            - 완화 수단의 부작용을 적었는가
            - 외부 의존의 상태도 증거에 넣었는가
      - key: LESSON.PRACTICAL_ENGINEERING.INCIDENT_ANALYSIS.001.U2
        title: 재현할 수 있어야 고친 것이다
        minutes: 12
        core: true
        explain: |-
          정상화된 뒤 원인을 찾을 때 기준이 하나 있다 —
          **원인을 알았다면 그 장애를 다시 일으킬 수 있어야 한다.**

          재현하지 못하면 "아마 이것 때문일 것이다"에서 멈춘 것이고,
          고쳤다고 생각한 것이 사실은 다른 것일 수 있다.

          재현하는 순서는 앞 노트(문제 해결 설명)와 같다 —
          **가설 → 검증 → 결과**. 다만 현장에서는 **재현 환경**을 만드는 것이 먼저다.

          | 재현 방법 | 언제 |
          |---|---|
          | 같은 입력으로 다시 호출 | 특정 요청에서만 날 때 |
          | 부하를 걸어 본다 | 동시성·자원 고갈 |
          | 느린 상대를 흉내 낸다 | 외부 의존 문제 |
          | 그때 데이터를 복사해 온다 | 특정 데이터에서만 날 때 |

          재현이 안 되면 **조건을 좁혀 가며** 시도한다.
          동시 요청 수를 올려 보고, 데이터 양을 늘려 보고, 시각을 바꿔 본다.
          앞 노트에서 쓴 테스트(느린 상대 흉내)가 여기서 그대로 쓰인다.

          그리고 재현에 성공하면 **그것을 테스트로 남긴다.**
          그 순간 재현 절차가 재발 방지 장치가 된다.
        example:
          language: java
          code: |-
            // 장애 재현: 결제가 느릴 때 커넥션이 마르는가
            @Test
            void shouldNotExhaustPoolWhenPaymentIsSlow() {
                when(paymentClient.charge(anyLong(), anyInt()))
                        .thenAnswer(inv -> { Thread.sleep(5_000); return "OK"; });

                List<CompletableFuture<Void>> calls = IntStream.range(0, 20)
                        .mapToObj(i -> CompletableFuture.runAsync(
                                () -> service.place(request(), MEMBER_ID), executor))
                        .toList();

                // 장애 때의 증상: 관계없는 조회까지 죽는가
                assertThatCode(() -> queryService.find(ORDER_ID, MEMBER_ID))
                        .doesNotThrowAnyException();
            }
          output: |-
            [고치기 전 — 장애 재현 성공]
            queryService.find → CannotGetJdbcConnectionException
            테스트 빨강 = 원인을 제대로 짚었다는 증거

            [고친 뒤]
            queryService.find → 정상
            테스트 초록 = 고쳤다는 증거

            → 같은 테스트가 재현 도구이자 재발 방지 장치가 된다
          note: |-
            - 단언이 **장애 때의 증상 그대로**다 — "조회까지 죽었다"
            - 고치기 전에 **빨강이 되는 것**을 먼저 확인했다. 이것이 재현이다
            - 빨강을 못 봤다면 원인을 잘못 짚은 것이다
            - 고친 뒤 초록이 되면 그때부터 **회귀 테스트**로 남는다
        predict:
          question: 고치기 전에 테스트가 빨강이 되는 것을 확인하지 않으면?
          choices:
            - 원인을 제대로 짚었는지 알 수 없다 — 다른 것을 고쳤을 수 있다
            - 시간이 절약된다
            - 차이가 없다
            - 테스트가 더 정확해진다
          answer: 원인을 제대로 짚었는지 알 수 없다 — 다른 것을 고쳤을 수 있다
          explanation: |-
            고친 뒤에 초록이면 **원래도 초록이었을 수 있다.**
            앞 노트(테스트 설계)의 "망가뜨려 보기"와 같은 원리다.
            **빨강 → 고침 → 초록** 순서를 눈으로 봐야 인과가 확인된다.
        complete:
          question: 장애를 재현하는 순서를 채우세요.
          code: |-
            1. 장애 때의 증상을 ___으로 표현한다   (조회까지 죽는가)
            2. 고치기 전에 ___ 이 되는지 확인한다
            3. 고친다
            4. 초록이 되는지 확인한다 → 회귀 테스트로 남긴다
          answers:
            - [단언, 테스트]
            - [빨강, 실패]
          explanation: |-
            **빨강을 먼저 보는 것**이 재현이다. 그것 없이는
            무엇 때문에 나아졌는지 알 수 없고, 다음에 같은 일이 나도 모른다.
        problem:
          prompt: |-
            아래 장애를 재현하는 방법을 설계하세요.

            ```text
            월말 정산 배치가 3개월에 3번 실패했다.
            실패 시각은 매번 새벽 2시 30분 전후, 로그는 SQLTimeoutException 한 줄.
            평일에 같은 배치를 돌리면 항상 성공한다.
            ```

            - 재현하려면 **무엇을 같게 만들어야 하는지** 세 가지 적으세요
            - 재현 환경을 만드는 **구체적인 방법**을 적으세요
            - 재현에 성공하면 그것을 **테스트로 남기는 방법**을 적으세요
              (매번 12만 건을 넣을 수는 없습니다)
            - 재현이 끝내 안 되면 **그다음 무엇을 할지** 적으세요
          deliverables:
            - 같게 만들어야 하는 것 세 가지
            - 재현 환경 구성 방법
            - 테스트로 남기는 방법
            - 재현 실패 시의 다음 단계
          hints:
            - 평일에는 성공한다는 것이 큰 단서입니다. 무엇이 다른가요?
            - 데이터 양을 흉내 내는 것과 실행 계획을 확인하는 것은 다릅니다.
            - 12만 건 없이도 인덱스를 타는지는 확인할 수 있습니다.
          modelAnswer: |-
            **같게 만들어야 하는 것**
            **① 대상 건수** — 평일 3천 건 대 월말 12만 건. 40배 차이가 핵심이다.
            **② 대상 기간 조건** — 월말은 조회 범위가 한 달 전체다.
            **③ 그 시각의 DB 부하** — 새벽 2시 30분에 백업이 도는지 확인해야 한다.

            **재현 환경**
            ```sql
            -- 운영과 같은 PostgreSQL 16 컨테이너에
            -- 월말 규모의 데이터를 생성한다
            INSERT INTO orders (member_id, total_amount, status, created_at)
            SELECT (random()*1000)::bigint, (random()*100000)::int, 'PAID',
                   timestamptz '2026-09-01' + (random() * interval '30 days')
            FROM generate_series(1, 120000);

            ANALYZE orders;   -- 통계를 갱신해야 플래너가 실제처럼 고른다
            ```
            `ANALYZE`를 빠뜨리면 **플래너가 다른 계획을 골라 재현이 안 된다.**

            **테스트로 남기는 방법** — 12만 건을 CI에서 매번 만들 수 없으므로
            **데이터가 아니라 실행 계획을 단언한다.**
            ```java
            @Test
            void settlementQueryShouldUseIndex() {
                String plan = jdbc.queryForObject(
                        "explain (format text) " + SETTLEMENT_SQL, String.class, params);
                assertThat(plan).doesNotContain("Seq Scan on orders");
                assertThat(plan).contains("Index");
            }
            ```
            건수와 무관하게 **인덱스를 못 타는 조건이 다시 들어왔는지**를 잡는다.
            앞 노트(골든 회귀)에서 데이터를 흉내 내려다 막혔던 그 문제의 답이다.

            **재현이 끝내 안 되면** — 가설을 좁힐 증거를 더 모은다.
            다음 월말에 대비해 **그 시각의 지표를 미리 남기도록** 해 두고
            (`pg_stat_activity` 스냅숏, 배치 각 단계 소요 시간),
            질의 타임아웃을 늘려 **실패 대신 느리게라도 끝나게** 해 관찰 기회를 만든다.
            재현 못 한 채 고치면 다음 월말에 같은 일이 난다.
          selfChecks:
            - 평일과 다른 점에서 조건을 뽑았는가
            - 통계 갱신을 빠뜨리지 않았는가
            - 데이터 없이 실행 계획으로 단언했는가
            - 재현 실패 시의 다음 단계를 준비했는가
      - key: LESSON.PRACTICAL_ENGINEERING.INCIDENT_ANALYSIS.001.U3
        title: 사람을 탓하지 않고 구조를 고친다
        minutes: 10
        core: false
        explain: |-
          원인을 찾고 나면 **"누가 그랬나"** 로 흐르기 쉽다. 그러면 두 가지가 일어난다.

          1. 다음부터 **장애를 숨긴다.** 보고가 늦어지고 피해가 커진다
          2. 대책이 **"주의한다"** 로 끝난다. 아무것도 안 바뀐다

          그래서 "왜"를 **사람이 아니라 구조**로 이어 간다.

          ```text
          결제 호출이 트랜잭션 안에 있었다
            → 왜? 리뷰에서 못 봤다
              → 왜? 그것을 잡는 규칙이 없었다
                → 왜? 그런 규칙을 둘 수 있다는 것을 몰랐다
                  → 대책: ArchUnit 규칙을 추가한다
          ```

          "왜"를 몇 번 이어 가면 **사람의 실수에서 장치의 부재로** 옮겨 간다.
          그 자리에서 나온 대책이 실제로 재발을 막는다.

          판단 기준 하나 — **대책이 "조심한다·확인한다·교육한다"로 끝나면
          아직 구조에 닿지 않은 것이다.** 사람은 다음에도 같은 실수를 한다.
        example:
          language: text
          code: |-
            [사람으로 끝난 분석]
            원인: 개발자가 트랜잭션 안에서 외부 호출을 했다
            대책: 앞으로 주의한다. 리뷰에서 꼼꼼히 본다
            → 석 달 뒤 다른 사람이 같은 실수를 한다

            [구조로 이어 간 분석]
            원인: 결제 호출이 트랜잭션 경계 안에 있었다
            왜1:  리뷰에서 발견되지 않았다
            왜2:  그것을 자동으로 잡는 장치가 없었다
            왜3:  경계 안에서 하면 안 되는 것이 문서에도 없었다

            대책
              (구조) 결제 호출을 커밋 뒤 이벤트로 옮긴다
              (장치) @Transactional 안에서 외부 클라이언트 호출 시 빌드 실패 규칙
              (기록) 코딩 규칙 문서에 "경계 안에는 DB 작업만" 한 줄 추가
              (관측) 커넥션 대기 알림 추가
          output: |-
            두 대책의 차이

            "주의한다"        검증할 수 없다. 지켜졌는지 알 방법이 없다
            ArchUnit 규칙     지켜지지 않으면 빌드가 깨진다. 사람이 기억 안 해도 된다
          note: |-
            - '"왜"를 세 번 이으니 **사람에서 장치의 부재로** 옮겨 갔다'
            - 대책이 네 층이다 — 구조·장치·기록·관측. 하나가 뚫려도 다음이 받는다
            - 가장 강한 것이 **빌드를 깨뜨리는 장치**다
            - 이 저장소도 같은 규칙을 ArchUnit으로 강제하고 있다
        predict:
          question: 대책이 "리뷰에서 꼼꼼히 본다"로 끝나면?
          choices:
            - 검증할 수 없고 사람이 바뀌면 사라진다
            - 충분한 대책이다
            - 가장 빠른 대책이다
            - 자동으로 지켜진다
          answer: 검증할 수 없고 사람이 바뀌면 사라진다
          explanation: |-
            리뷰는 **사람의 주의력**에 기댄다. 바쁘거나 새로 온 사람이면 못 본다.
            그리고 지켜졌는지 확인할 방법이 없어 **나중에 뚫려도 모른다.**
            "다음에 같은 실수를 하면 빌드가 깨지나?"를 물어보면
            그 대책이 구조에 닿았는지 알 수 있다.
        complete:
          question: 대책이 구조에 닿았는지 판단하세요.
          code: |-
            대책이 "___한다·확인한다·교육한다"로 끝나면
            아직 구조에 닿지 않은 것이다.

            판단 질문: 다음에 같은 실수를 하면 ___가 깨지나?
          answers:
            - [주의, 조심]
            - [빌드, 테스트]
          explanation: |-
            **사람의 주의에 기대는 대책은 검증할 수 없다.**
            빌드나 테스트가 깨지는 장치로 바꿀 수 있는지 먼저 본다.
        problem:
          prompt: |-
            아래 장애의 원인 분석을 **구조까지 이어 가세요.**

            ```text
            운영 DB의 주문 테이블에서 3천 건이 잘못 갱신됐다.
            원인: 운영 반영 스크립트에서 UPDATE 문의 WHERE 절이 빠졌다.
            ```

            - '"왜"를 **네 번 이상** 이어 가세요. 사람의 실수에서 멈추지 마세요'
            - 대책을 **네 층**(구조 / 장치 / 기록 / 관측)에 하나씩 적으세요
            - 그중 **가장 강한 것**을 고르고 이유를 적으세요
            - 이 장애를 보고할 때 **개인 이름을 쓸지** 정하고 이유를 적으세요
          deliverables:
            - 왜를 네 번 이상 이은 분석
            - 네 층의 대책
            - 가장 강한 대책과 이유
            - 이름을 쓸지에 대한 판단
          hints:
            - 왜 그 스크립트가 검토 없이 실행됐는지 물어보세요.
            - 실행 전에 몇 건이 바뀌는지 확인할 수 있었을까요?
            - 보고의 목적은 책임 추궁이 아니라 재발 방지입니다.
          modelAnswer: |-
            ```text
            원인: UPDATE 의 WHERE 절이 빠졌다
            왜1:  실행 전에 아무도 확인하지 않았다
            왜2:  운영 DB에 직접 붙어 손으로 실행하는 것이 관행이었다
            왜3:  운영 반영 절차가 정해져 있지 않았다
            왜4:  절차를 만들 만큼 자주 있는 일이 아니라고 여겼다
            ```

            | 층 | 대책 |
            |---|---|
            | **구조** | 운영 DB 직접 접속을 막고, 데이터 변경은 마이그레이션 파일로만 |
            | **장치** | 변경 스크립트는 트랜잭션으로 감싸고 **영향 건수를 먼저 출력**한 뒤 확인받게 |
            | **기록** | 운영 반영 절차 문서화 + 실행 기록 남기기 |
            | **관측** | 주문 테이블 대량 변경(1분에 100건 초과) 알림 |

            **가장 강한 것은 구조**다 — 직접 접속을 막으면 그 실수를 **할 수가 없다.**
            장치(건수 확인)는 사람이 건너뛸 수 있고, 기록은 사후이며,
            관측은 이미 벌어진 뒤에 알려 준다.
            다만 구조 하나만으로는 긴급 상황을 못 다루므로 네 층을 함께 둔다.

            **이름은 쓰지 않는다.** 보고의 목적은 **다음에 안 나게 하는 것**이고,
            이름이 들어가면 읽는 사람의 초점이 거기로 간다.
            더 나쁜 것은 **다음부터 장애를 늦게 보고하게 되는 것**이다 —
            숨기면 피해가 훨씬 커진다.
            역할("운영 반영 담당")은 절차를 설명하는 데 필요하면 쓴다.
            왜4까지 가 보면 결국 **절차를 안 만든 팀의 결정**이지 개인의 실수가 아니다.
          selfChecks:
            - 왜를 네 번 이상 이었는가
            - 사람의 실수에서 멈추지 않았는가
            - 네 층에 각각 대책이 있는가
            - 이름을 쓰지 않기로 한 이유를 댈 수 있는가
    commonMistakes:
      - 원인부터 찾는다. 멈춰 있는 시간이 늘고, 그 시간은 되돌릴 수 없다 (U1)
      - 되돌리기 전에 증거를 안 남긴다. 정상화 뒤 원인을 찾을 근거가 사라진다 (U1)
      - 대책이 "주의한다"로 끝난다. 검증할 수 없고 사람이 바뀌면 사라진다 (U3)
    inProject: |-
      주문 시스템에 **장애 대응 순서 한 장**을 저장소에 둔다 —
      영향 확인, 완화, 증거 보존, 원인 분석, 재발 방지.
      증거 보존 명령 네 줄을 스크립트로 만들어 두면 3분이 30초가 된다.
      원인을 찾으면 **재현 테스트를 먼저 빨강으로 만들고** 고치며,
      대책은 네 층으로 나눠 최소한 하나는 빌드가 깨지는 장치로 만든다.
    sources:
      - title: Spring Boot — Production-ready Features (Actuator)
        url: https://docs.spring.io/spring-boot/reference/actuator/index.html
        versionScope: Spring Boot 3.x+
      - title: PostgreSQL 16 — The Statistics Collector (pg_stat_activity)
        url: https://www.postgresql.org/docs/16/monitoring-stats.html
        versionScope: PostgreSQL 16
      - title: Git — git-bisect (언제부터 이상했는지 좁힌다)
        url: https://git-scm.com/docs/git-bisect
        versionScope: Git 2.x
    verifiedAt: 2026-09-25

  - key: LESSON.PRACTICAL_ENGINEERING.TROUBLESHOOTING_REPORT.001
    skillCode: PRACTICAL_ENGINEERING.TROUBLESHOOTING_REPORT
    title: 읽는 사람이 판단할 수 있게 적기 (보고)
    whyItMatters: |-
      장애를 잘 해결해도 **보고가 부실하면 그 일이 없었던 것이 된다.**
      읽는 사람은 대개 그 자리에 없었고, 코드도 안 본다.
      현상·영향·원인·조치·재발 방지 다섯 칸이 채워져 있으면
      5분 만에 읽고 판단할 수 있고, 그 기록이 다음 사람의 시작점이 된다.
    oneLine: 보고는 현상·영향·원인·조치·재발 방지 다섯 칸이고, 영향이 빠지면 그 장애의 크기를 알 수 없다.
    units:
      - key: LESSON.PRACTICAL_ENGINEERING.TROUBLESHOOTING_REPORT.001.U1
        title: 다섯 칸을 채운다
        minutes: 12
        core: true
        explain: |-
          형식이 있으면 쓰는 사람도 읽는 사람도 빠르다.

          | 칸 | 답할 것 | 자주 빠지는 것 |
          |---|---|---|
          | **현상** | 무엇이 언제부터 어떻게 | 시각과 지속 시간 |
          | **영향** | 누가 얼마나 못 했나 | **이 칸 자체가 자주 통째로 빠진다** |
          | **원인** | 왜 그랬나 | 구조가 아닌 사람 얘기로 끝남 |
          | **조치** | 무엇을 했나 | 완화와 근본 조치를 안 나눔 |
          | **재발 방지** | 다음에 안 나게 | "주의한다" |

          **영향이 가장 자주 빠지고 가장 중요하다.**
          읽는 사람은 그 숫자로 **얼마나 심각한 일이었는지**를 판단하고,
          거기서 대책에 얼마를 쓸지가 정해진다.

          "20분간 340건 실패, 문의 11건"과 "잠깐 오류가 있었습니다"는
          같은 사건인데 전혀 다른 결정을 부른다.

          길이는 **한 화면**이면 된다. 자세한 것은 링크로 단다.
          길면 안 읽히고, 안 읽히면 없는 것과 같다.
        example:
          language: text
          code: |-
            [부실한 보고]
            주문 API에 오류가 있어서 수정했습니다. 지금은 정상입니다.

            [다섯 칸을 채운 보고]
            현상 — 2026-03-12 10:05~10:21 (16분) 주문 생성 API가 503을 반환했습니다.
                  평소 200ms이던 응답이 타임아웃(3초)까지 올라갔고,
                  조회 API는 정상이었습니다.

            영향 — 주문 시도 약 340건 실패, 고객 문의 11건.
                  결제까지 간 건은 없어 환불은 발생하지 않았습니다.

            원인 — 09:50 배포에서 결제 외부 호출이 트랜잭션 경계 안으로 들어갔습니다.
                  결제사 응답이 평소 0.3초에서 9초로 느려지면서
                  DB 커넥션(풀 10)을 함께 점유해 고갈됐습니다.

            조치 — (완화) 10:19 이전 버전으로 되돌려 10:21 정상 확인
                  (근본) 결제 호출을 커밋 뒤 이벤트로 분리 — PR #412

            재발 방지 — @Transactional 안에서 외부 클라이언트 호출 시
                  빌드가 깨지는 ArchUnit 규칙 추가(PR #413).
                  커넥션 대기 5분 초과 알림 추가.
          output: |-
            읽는 데 걸리는 시간

            부실한 보고   5초 — 읽고 나서 아무것도 판단할 수 없다
            다섯 칸       90초 — 심각도·원인·대책이 전부 판단된다
          note: |-
            - 영향에 **숫자 셋**이 있다(340건, 11건, 환불 0) — 크기가 잡힌다
            - 조치가 **완화와 근본으로 나뉘어** 있다. 되돌린 것과 고친 것은 다르다
            - 재발 방지에 **PR 번호**가 있다. 정말 했는지 확인할 수 있다
            - '"결제까지 간 건은 없어"가 중요하다 — **없었던 피해를 명시**한다'
        predict:
          question: 영향 칸을 빼면 읽는 사람은 무엇을 못 하나?
          choices:
            - 얼마나 심각했는지 판단하지 못해 대책에 얼마를 쓸지 정할 수 없다
            - 원인을 모른다
            - 조치를 모른다
            - 아무 문제 없다
          answer: 얼마나 심각했는지 판단하지 못해 대책에 얼마를 쓸지 정할 수 없다
          explanation: |-
            340건 실패와 3건 실패는 **완전히 다른 결정**을 부른다.
            앞이면 아키텍처를 바꿀 만하고 뒤면 알림만 추가해도 된다.
            영향이 없으면 읽는 사람이 **판단할 근거 없이 판단**하게 된다.
        complete:
          question: 보고의 다섯 칸을 채우세요.
          code: |-
            현상 — 10:05~10:21 주문 생성 API 503
            ___  — 주문 시도 340건 실패, 문의 11건
            원인 — 결제 호출이 트랜잭션 경계 안에 있어 커넥션 고갈
            조치 — (완화) 되돌리기 / (근본) 커밋 뒤 이벤트로 분리
            ___  — ArchUnit 규칙 + 커넥션 대기 알림
          answers:
            - [영향]
            - [재발 방지, 재발방지]
          explanation: |-
            **영향이 크기를 말하고 재발 방지가 다음을 말한다.**
            둘이 빠지면 "고쳤습니다" 한 줄과 같아진다.
        problem:
          prompt: |-
            앞 노트에서 다룬 **월말 정산 배치 실패**를 다섯 칸으로 보고하세요.

            ```text
            3개월간 3회 실패, 매번 월말 마지막 영업일 새벽 2시 30분 전후.
            원인은 월말에 대상이 40배가 되는데 질의가 형 변환 때문에 인덱스를 못 탔다.
            매번 수동 재실행에 1시간, 담당자 새벽 호출 3회.
            ```

            - 다섯 칸을 각각 채우세요. **영향에 숫자를 세 개 이상** 넣으세요
            - 조치를 **완화와 근본으로 나눠** 적으세요
            - 재발 방지를 **검증 가능한 형태**로 적으세요 ("주의한다" 금지)
            - 이 보고를 **누가 읽을지** 정하고, 그 사람에게 불필요한 부분을 덜어 내세요
          deliverables:
            - 다섯 칸을 채운 보고
            - 완화와 근본의 구분
            - 검증 가능한 재발 방지
            - 독자 설정과 덜어 낸 부분
          hints:
            - 영향에는 건수·시간·사람 수가 들어갑니다.
            - 수동 재실행은 완화지 근본 조치가 아닙니다.
            - 읽는 사람이 팀장인지 동료 개발자인지에 따라 기술 세부가 달라집니다.
          modelAnswer: |-
            ```text
            현상 — 2026-06~09 월말 정산 배치가 3회 완료 표시 없이 종료됐습니다.
                  매번 마지막 영업일 새벽 2시 30분 전후이고,
                  로그에 SQLTimeoutException 한 줄 뒤로 기록이 없습니다.
                  평일 실행은 3개월간 한 번도 실패하지 않았습니다.

            영향 — 고객사 13곳의 정산이 매번 반나절 지연됐습니다.
                  수동 재실행에 회당 1시간, 담당자 새벽 호출 3회.
                  정산 금액 오류는 없었습니다(재실행 결과 일치 확인).

            원인 — 정산 질의의 날짜 조건이 created_at::date = ... 형태라
                  컬럼에 형 변환이 걸려 인덱스를 타지 못했습니다.
                  평일 대상 3천 건에서는 순차 스캔으로도 끝났지만,
                  월말에는 12만 건(40배)이 되어 질의 타임아웃을 넘겼습니다.

            조치 — (완화) 실패 시 수동 재실행 — 3회 모두 이 방법으로 처리
                  (근본) 조건을 범위 비교로 변경하고 (created_at, status) 인덱스 추가.
                        월말 규모 데이터로 확인: 4분 12초 → 3.8초 (PR #501)

            재발 방지 — 정산 질의의 실행 계획에 Seq Scan 이 나오면 실패하는 테스트 추가
                  (데이터 양과 무관하게 동작, PR #502).
                  배치 소요 시간이 평소의 3배를 넘으면 알림.
            ```

            **독자는 팀장**으로 잡았다. 그래서 —
            `EXPLAIN` 출력 원문, 인덱스 컬럼 순서를 그렇게 정한 이유,
            `ANALYZE` 통계 이야기는 **덜어 내고 PR 링크로** 넘겼다.
            대신 **영향과 소요 시간 개선(4분 12초 → 3.8초)** 을 남겼다 —
            그것이 판단에 쓰이는 숫자다.

            동료 개발자가 읽는다면 반대로 한다. 기술 세부를 본문에 두고
            고객사 숫자를 줄인다. **같은 사건도 독자에 따라 덜어 낼 것이 다르다.**
          selfChecks:
            - 영향에 숫자가 세 개 이상 있는가
            - 완화와 근본 조치를 나눴는가
            - 재발 방지가 검증 가능한가
            - 독자를 정하고 그에 맞게 덜어 냈는가
      - key: LESSON.PRACTICAL_ENGINEERING.TROUBLESHOOTING_REPORT.001.U2
        title: 사실과 추정을 가른다
        minutes: 12
        core: true
        explain: |-
          보고에서 신뢰를 잃는 가장 빠른 길은 **추정을 사실처럼 적는 것**이다.

          ```text
          "결제사 장애로 보입니다"  →  "결제사 장애였습니다" 로 적음
          ```

          나중에 아니었던 것으로 밝혀지면 **그 보고 전체가 의심받는다.**

          그래서 문장마다 **근거를 함께** 적는다.

          | 확신 수준 | 쓰는 말 | 함께 적을 것 |
          |---|---|---|
          | 확인됨 | "~했습니다" | 무엇으로 확인했는지 |
          | 강한 추정 | "~로 보입니다" | 그렇게 보는 근거 |
          | 미확인 | "확인 중입니다" | 언제까지 확인할지 |

          그리고 **모르는 것을 모른다고 적는다.**
          "원인은 아직 확인 중이며 X까지 파악하겠습니다"가
          그럴듯한 추측보다 훨씬 신뢰를 준다.

          빈칸을 억지로 채우려 하면 **틀린 원인이 기록으로 남아**
          다음 사람이 그것을 믿고 엉뚱한 곳을 보게 된다.
        example:
          language: text
          code: |-
            [추정을 사실처럼]
            원인 — 결제사 장애로 인한 지연입니다.

            [사실과 추정을 가름]
            원인 — (확인) 09:50 배포에서 결제 호출이 트랜잭션 경계 안으로 이동했습니다.
                        커밋 diff와 ArchUnit 미적용 상태로 확인했습니다.
                  (확인) 커넥션 풀이 고갈됐습니다.
                        hikaricp.connections.pending 이 10:05~10:20 동안 20 이상이었습니다.
                  (추정) 결제사 응답이 평소 0.3초에서 9초로 느려진 것이 방아쇠로 보입니다.
                        우리 호출 로그의 P99가 그 시간대에 9.1초였으나,
                        결제사 쪽 장애 공지는 확인하지 못했습니다.
                  (미확인) 결제사가 왜 느려졌는지는 알 수 없습니다.
                        업체에 문의했고 회신을 받으면 추가하겠습니다.
          output: |-
            읽는 사람이 받는 것

            확인된 것 2개   되돌리기와 코드 수정의 근거가 된다
            추정 1개       근거가 있어 판단할 수 있다
            미확인 1개     다음에 무엇이 채워질지 알 수 있다

            → 나중에 결제사가 "장애 없었다"고 해도 이 보고는 무너지지 않는다
          note: |-
            - 확인된 것에 **무엇으로 확인했는지**가 붙어 있다(diff, 지표)
            - 추정에도 근거가 있다(P99 9.1초) — 그리고 **없는 근거도 밝혔다**
            - 미확인을 숨기지 않았다. **언제 채울지**까지 적혀 있다
            - 이 보고는 결제사가 부인해도 무너지지 않는다. 우리 쪽 원인이 확인됐기 때문이다
        predict:
          question: 미확인 항목을 그럴듯한 추측으로 채우면?
          choices:
            - 틀렸을 때 보고 전체가 의심받고 다음 사람이 엉뚱한 곳을 본다
            - 보고가 완성도 있어 보인다
            - 문제없다
            - 더 빨리 끝난다
          answer: 틀렸을 때 보고 전체가 의심받고 다음 사람이 엉뚱한 곳을 본다
          explanation: |-
            더 나쁜 것은 **그 추측이 기록으로 남는 것**이다.
            반년 뒤 같은 장애가 났을 때 누군가 이 보고를 읽고
            **틀린 원인부터 확인하느라** 시간을 쓴다.
            빈칸은 빈칸으로 두는 것이 정확하다.
        complete:
          question: 확신 수준을 표시해 적으세요.
          code: |-
            (___) 커넥션 풀이 고갈됐습니다. pending 지표가 20 이상이었습니다.
            (추정) 결제사 지연이 방아쇠로 보입니다. 우리 쪽 P99가 9.1초였습니다.
            (___) 결제사가 왜 느려졌는지는 알 수 없습니다. 문의 회신을 기다립니다.
          answers:
            - [확인]
            - [미확인]
          explanation: |-
            **확인·추정·미확인**을 표시하고 각각에 근거나 계획을 붙인다.
            이렇게 하면 나중에 추정이 틀려도 확인된 부분은 그대로 남는다.
        problem:
          prompt: |-
            아래 보고를 **사실과 추정을 가르는 형태**로 다시 쓰세요.

            ```text
            원인 — 트래픽이 갑자기 몰려서 서버가 못 버틴 것으로 보입니다.
                  메모리 누수도 있는 것 같습니다. 재시작으로 해결했습니다.
            ```

            - 이 문단에서 **확인된 것, 추정, 미확인**을 갈라 보세요
            - 각 항목에 **무엇으로 확인하면 되는지** 적으세요 (확인 방법)
            - '"재시작으로 해결했습니다"의 문제를 지적하세요'
            - 다시 쓴 보고를 적으세요. **모르는 것은 모른다고** 쓰세요
          deliverables:
            - 확인·추정·미확인 구분
            - 항목별 확인 방법
            - '"재시작으로 해결"의 문제'
            - 다시 쓴 원인·조치
          hints:
            - '"몰렸다"는 지표로 확인할 수 있습니다.'
            - 메모리 누수는 재시작으로 증상만 사라집니다.
            - 해결과 완화는 다른 말입니다.
          modelAnswer: |-
            | 항목 | 구분 | 확인 방법 |
            |---|---|---|
            | 트래픽이 몰렸다 | **확인 가능** | `http.server.requests` 건수 추이 |
            | 서버가 못 버텼다 | **확인 가능** | 5xx 비율, 응답 P99, 스레드 사용률 |
            | 메모리 누수 | **미확인** | 힙 사용률 추이, 재시작 후 다시 오르는지 |
            | 재시작으로 해결 | **틀린 표현** | 아래 참조 |

            **"재시작으로 해결했습니다"의 문제** — 재시작은 **완화**이지 해결이 아니다.
            원인이 남아 있으므로 같은 일이 또 난다.
            게다가 "해결됐다"고 보고되면 **아무도 더 안 본다.**

            ```text
            원인 — (확인) 09:40~10:10 요청 수가 평소 초당 20건에서 180건으로 9배 증가했습니다.
                        http.server.requests 지표로 확인했습니다.
                  (확인) 같은 시간 5xx 비율이 0.1%에서 34%로 올랐습니다.
                  (추정) 요청 증가가 방아쇠로 보입니다. 다만 초당 180건은
                        설계 용량 안이라 이것만으로 설명되지 않습니다.
                  (미확인) 힙 사용률이 재시작 전 92%였으나 누수인지는 확인하지 못했습니다.
                        향후 1주간 힙 추이를 관찰해 9/30까지 판단하겠습니다.

            조치 — (완화) 10:12 재시작으로 정상화. 원인은 제거되지 않았습니다.
                  (근본) 미정 — 위 미확인 항목 확인 후 결정합니다.
            ```

            **"원인은 제거되지 않았습니다"** 를 명시한 것이 핵심이다.
            이 한 줄이 있어야 읽는 사람이 **아직 끝나지 않았다는 것**을 안다.
          selfChecks:
            - 확인·추정·미확인을 갈랐는가
            - 각 항목에 확인 방법을 적었는가
            - 완화와 해결을 구분했는가
            - 모르는 것을 모른다고 적었는가
      - key: LESSON.PRACTICAL_ENGINEERING.TROUBLESHOOTING_REPORT.001.U3
        title: 기록이 다음 사람의 시작점이 되게
        minutes: 10
        core: false
        explain: |-
          보고는 **한 번 읽히고 끝나는 글이 아니다.**
          반년 뒤 비슷한 장애가 났을 때 누군가 검색해서 찾는다.
          그때 도움이 되려면 몇 가지가 더 필요하다.

          | 넣을 것 | 왜 |
          |---|---|
          | **검색될 말** | 오류 메시지 원문, 지표 이름 |
          | **링크** | PR, 커밋, 대시보드, 로그 보관 위치 |
          | **당시 판단** | 왜 그때 그렇게 결정했나 |
          | **안 한 것** | 검토했지만 하지 않은 대책과 이유 |

          **오류 메시지 원문**이 특히 중요하다. 다음 사람은
          `Connection is not available` 로 검색하지 `커넥션 고갈` 로 검색하지 않는다.

          그리고 **안 한 것**을 적는 것이 값어치가 크다.
          "풀 크기를 늘리는 방안도 검토했으나 점유 시간이 원인이라 효과가 없다고 판단"
          이 적혀 있으면 다음 사람이 같은 검토를 반복하지 않는다.

          보고를 **어디에 둘지**도 정해 둔다. 흩어지면 찾을 수 없다.
          저장소 안(`docs/incidents/`)에 두면 코드와 함께 옮겨 다니고 검색된다.
        example:
          language: text
          code: |-
            docs/incidents/2026-03-12-order-503.md

            # 2026-03-12 주문 생성 API 503 (16분)

            ## 검색어
            `Connection is not available`, `HikariPool-1`, `hikaricp.connections.pending`,
            커넥션 고갈, 트랜잭션 경계, 결제 호출

            ## 현상 / 영향 / 원인 / 조치 / 재발 방지
            (본문)

            ## 링크
            - 원인 커밋: abc1234
            - 근본 조치 PR: #412
            - 재발 방지 PR: #413 (ArchUnit 규칙)
            - 보존 로그: s3://ops-archive/incidents/2026-03-12/

            ## 검토했으나 하지 않은 것
            - 커넥션 풀 10 → 50 증설
              점유 시간이 9초라 동시 182건이 필요해 효과가 없다고 판단.
              점유 시간을 15ms로 줄이는 쪽을 택함.
            - 결제 호출 재시도 추가
              이미 타임아웃이 있고, 재시도는 중복 결제 위험이 있어 보류.
              멱등 키가 붙은 뒤 재검토.
          output: |-
            반년 뒤 비슷한 장애가 났을 때

            grep -r "Connection is not available" docs/incidents/
            → 2026-03-12-order-503.md

            읽고 알게 되는 것
            - 같은 증상의 원인 후보 1개 (트랜잭션 경계)
            - 풀 증설은 이미 검토됐고 효과 없다는 판단
            - 그때 쓴 재발 방지 장치가 지금 살아 있는지 확인할 PR 번호
          note: |-
            - **검색어 절**이 따로 있다. 오류 메시지 원문을 그대로 넣었다
            - 링크에 **보존 로그 위치**가 있다. 로그 보관 기간이 지나도 이건 남는다
            - '"안 한 것"에 **이유와 재검토 조건**이 있다("멱등 키가 붙은 뒤")'
            - 저장소 안에 있어 코드와 함께 검색된다
        predict:
          question: 오류 메시지를 "커넥션 고갈"로만 적고 원문을 안 넣으면?
          choices:
            - 다음 사람이 원문으로 검색할 때 이 기록을 못 찾는다
            - 더 읽기 쉽다
            - 차이가 없다
            - 보안상 낫다
          answer: 다음 사람이 원문으로 검색할 때 이 기록을 못 찾는다
          explanation: |-
            장애를 만난 사람은 **화면에 뜬 문자열을 그대로 복사해 검색**한다.
            번역된 표현으로는 안 걸린다.
            원문과 우리말 설명을 **둘 다** 넣는 것이 답이다.
        complete:
          question: 다음 사람이 찾을 수 있게 만드세요.
          code: |-
            ## ___
            `Connection is not available`, `HikariPool-1`, 커넥션 고갈

            ## 검토했으나 ___ 것
            - 풀 증설: 점유 시간이 원인이라 효과 없다고 판단
          answers:
            - [검색어]
            - [하지 않은, 안 한]
          explanation: |-
            **오류 메시지 원문**이 있어야 검색된다.
            **안 한 것과 그 이유**가 있어야 다음 사람이 같은 검토를 반복하지 않는다.
        problem:
          prompt: |-
            앞 단위에서 쓴 정산 배치 보고를 **반년 뒤에도 쓸모 있게** 다듬으세요.

            - **검색어 절**을 만들고 5개 이상 넣으세요 (오류 원문 포함)
            - 링크로 달 것 **네 가지**를 적으세요
            - **검토했으나 하지 않은 것**을 두 가지 적고, 각각 이유와
              **재검토 조건**을 붙이세요
            - 이 기록을 **어디에 둘지** 정하고 이유를 적으세요
            - 반년 뒤 비슷한 장애를 만난 사람이 이 문서에서 **무엇을 얻게 되는지** 적으세요
          deliverables:
            - 검색어 5개 이상과 링크 네 가지
            - 안 한 것 두 가지 (이유 + 재검토 조건)
            - 보관 위치와 이유
            - 다음 사람이 얻는 것
          hints:
            - 다음 사람은 로그에 뜬 문자열로 검색합니다.
            - 지표 이름도 검색어입니다.
            - 재검토 조건이 있으면 "나중에"가 언제인지 정해집니다.
          modelAnswer: |-
            ```markdown
            docs/incidents/2026-09-30-settlement-timeout.md

            ## 검색어
            `SQLTimeoutException`, `could not extract ResultSet`, `Seq Scan on orders`,
            정산 배치 실패, 월말, 형 변환, created_at::date, 인덱스 미사용

            ## 링크
            - 근본 조치 PR: #501 (조건을 범위 비교로 + 복합 인덱스)
            - 재발 방지 PR: #502 (실행 계획 단언 테스트)
            - 실패 시점 로그: s3://ops-archive/incidents/2026-09-30/
            - 배치 소요 시간 대시보드: (링크)

            ## 검토했으나 하지 않은 것
            - 질의 타임아웃을 5초 → 60초로 증설
              증상만 늦추고 월말 소요 시간이 계속 늘어날 것으로 판단.
              재검토 조건: 인덱스를 적용하고도 30초를 넘으면 다시 본다.
            - 정산을 고객사별로 쪼개어 병렬 실행
              현재 13곳이라 순차로도 4분이면 끝나 효과 대비 복잡도가 크다.
              재검토 조건: 고객사 30곳을 넘거나 소요 시간이 15분을 넘으면.
            ```

            **보관 위치는 저장소 안(`docs/incidents/`)** 이다.
            코드와 함께 옮겨 다니고, `grep`으로 검색되며,
            변경 이력이 git에 남아 **언제 무엇이 추가됐는지**도 보인다.
            사내 위키에 두면 검색은 되지만 코드에서 멀어지고,
            이관·정리 과정에서 사라지는 일이 많다.

            **반년 뒤 사람이 얻는 것**
            ① `SQLTimeoutException` 으로 검색해 **같은 증상의 선례**를 찾는다
            ② 원인 후보 하나(형 변환으로 인덱스 미사용)를 **먼저 확인**할 수 있다
            ③ 타임아웃 증설은 **이미 검토됐고 왜 안 했는지** 안다
            ④ 그때 넣은 실행 계획 테스트가 **아직 살아 있는지** PR로 확인한다

            즉 **시작점이 40분 뒤가 아니라 5분 뒤**가 된다.
          selfChecks:
            - 오류 메시지 원문을 검색어에 넣었는가
            - 링크에 보존 로그 위치가 있는가
            - 안 한 것에 재검토 조건을 붙였는가
            - 저장소 안에 두기로 한 이유를 댈 수 있는가
    commonMistakes:
      - 영향 칸을 빼먹는다. 읽는 사람이 심각도를 판단할 수 없다 (U1)
      - 추정을 사실처럼 적는다. 틀렸을 때 보고 전체가 의심받는다 (U2)
      - 오류 메시지를 우리말로만 적는다. 다음 사람이 원문으로 검색해도 안 걸린다 (U3)
    inProject: |-
      주문 시스템의 장애 기록은 `docs/incidents/{날짜}-{요약}.md` 에 둔다.
      다섯 칸(현상·영향·원인·조치·재발 방지)에 **검색어와 링크, 안 한 것**을 더하고,
      확인·추정·미확인을 표시한다.
      5단계의 `EXPLANATION.TROUBLESHOOTING_STORY`가 이 기록을 재료로 쓴다 —
      여기서 적어 두지 않으면 거기서 꺼낼 것이 없다.
