# DevPilot 개념 노트 — 막혔던 일과 배운 것 설명하기
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 5단계(설명과 정리)에서 쓴다. implementation 목표가 0인 skill이라 과제도 글쓰기다
# - 듣는 사람은 같은 팀 동료와 리뷰어다. 예제는 모두 주문 시스템에서 가져온다
lessons:
  - key: LESSON.EXPLANATION.TROUBLESHOOTING_STORY.001
    skillCode: EXPLANATION.TROUBLESHOOTING_STORY
    title: 어떻게 좁혔는지 말하기 (문제 해결)
    whyItMatters: |-
      장애를 고친 이야기는 **어떻게 고쳤나보다 어떻게 찾았나**가 중요하다.
      운이 좋아 찾은 것과 좁혀 들어가 찾은 것은 다음에 또 할 수 있는지가 다르고,
      듣는 사람이 보는 것도 그 차이다.
      그리고 좁히는 순서를 말로 설명할 수 있으면, 다음 장애에서 그 순서가 스스로에게도 남는다.
    oneLine: 문제 해결 설명은 현상·가설·검증·원인·조치·재발 방지 순서이고, 가설과 검증이 없으면 운이었던 것과 구분되지 않는다.
    units:
      - key: LESSON.EXPLANATION.TROUBLESHOOTING_STORY.001.U1
        title: 현상부터 말한다 (증상은 원인이 아니다)
        minutes: 12
        core: true
        explain: |-
          설명이 엉키는 첫 번째 이유는 **원인부터 말하기** 때문이다.

          ```text
          "커넥션 풀이 말라서 장애가 났습니다."
          ```

          듣는 사람은 그게 왜 말랐는지, 애초에 무슨 일이 있었는지 모른 채로
          결론부터 받는다. 그리고 그 결론이 맞는지 판단할 근거도 없다.

          시작은 **현상**이다. 현상은 **누가 봐도 같게 보이는 사실**이어야 한다.

          | 나쁜 현상 기술 | 좋은 현상 기술 |
          |---|---|
          | 느려졌습니다 | 주문 생성 API가 평소 200ms인데 3초를 넘겼습니다 |
          | 가끔 죽습니다 | 하루 2~3회, 주로 오전 10시대에 503이 났습니다 |
          | 에러가 납니다 | `HikariPool-1 - Connection is not available` 이 1분에 40건 찍혔습니다 |

          차이는 셋이다 — **무엇이, 얼마나, 언제.**
          이 셋이 있으면 듣는 사람이 같은 것을 볼 수 있고,
          없으면 당신이 본 것을 믿는 수밖에 없다.
        example:
          language: text
          code: |-
            [원인부터 말한 설명]
            "커넥션 풀이 말라서 장애가 났고, 풀 크기를 늘려서 해결했습니다."

            [현상부터 말한 설명]
            현상 — 3월 12일 오전 10시 5분부터 20분간 주문 생성 API가 503을 냈습니다.
                  평소 200ms이던 응답이 타임아웃(3초)까지 올라갔고,
                  같은 시간 로그에 HikariPool-1 - Connection is not available 이
                  1분에 40건씩 찍혔습니다. 조회 API는 정상이었습니다.
          output: |-
            현상만으로 좁혀지는 것

            "주문 생성만" 이상  → 조회 경로는 무관
            "10시 5분부터 20분" → 그 시각에 시작한 무언가가 있다
            "커넥션 없음"        → 풀을 오래 쥐는 쪽이 있다
            "타임아웃까지 올라감" → 못 얻어서 기다리다 끊겼다
          note: |-
            - 현상 한 덩어리로 **가설 후보가 이미 좁아졌다**
            - '"조회 API는 정상이었습니다"가 중요하다 — **아닌 것을 말하면 범위가 준다**'
            - 시각과 지속 시간이 있다. 그 시각에 무엇이 있었는지 찾아볼 수 있다
            - 로그 원문을 그대로 적었다. 요약하면 다른 사람이 검색할 수 없다
        predict:
          question: '"조회 API는 정상이었습니다"를 빼면 무엇을 잃나?'
          choices:
            - 범위를 좁혀 주는 정보를 잃는다 — 공통 구간이 원인일 가능성이 남는다
            - 아무것도 잃지 않는다
            - 설명이 짧아져서 좋다
            - 원인이 달라진다
          answer: 범위를 좁혀 주는 정보를 잃는다 — 공통 구간이 원인일 가능성이 남는다
          explanation: |-
            **아닌 것을 말하는 것이 맞는 것을 말하는 것만큼 좁혀 준다.**
            조회가 멀쩡했다면 DB 자체나 네트워크 전체는 아니다.
            현상에 "정상이었던 것"을 한 줄 넣는 습관이 범위를 절반으로 줄인다.
        complete:
          question: 현상 기술에 반드시 들어갈 셋을 채우세요.
          code: |-
            무엇이 — 주문 생성 API가 503
            ___   — 평소 200ms → 3초 초과, 1분에 40건
            ___   — 3월 12일 10시 5분부터 20분간
            (그리고 정상이었던 것 한 줄)
          answers:
            - [얼마나]
            - [언제]
          explanation: |-
            무엇이·얼마나·언제. 여기에 **정상이었던 것**을 더하면 범위가 선다.
            이 넷이 없는 현상 기술은 "느립니다"와 같은 말이다.
        problem:
          prompt: |-
            겪었던 장애나 버그 하나를 골라 **현상만** 다시 쓰세요. 원인은 아직 쓰지 마세요.

            - 무엇이·얼마나·언제를 각각 한 줄로 쓰세요
            - **정상이었던 것**을 한 줄 넣으세요
            - 로그나 오류 메시지가 있었다면 **원문 그대로** 한 줄 넣으세요
            - 다 쓴 뒤, 그 현상만 읽고 **떠오르는 가설 세 개**를 적으세요
              (당신이 이미 아는 진짜 원인 말고, 현상만 보고 떠오르는 것)
          deliverables:
            - 현상 기술 (무엇이·얼마나·언제·정상이었던 것·로그 원문)
            - 현상만 보고 떠오르는 가설 세 개
            - 실제 원인이 그 셋 안에 있었는지
          hints:
            - 숫자가 기억 안 나면 "몇 배 느렸나", "몇 명이 겪었나"로 바꿔 보세요.
            - 정상이었던 것을 찾으려면 "같이 죽었어야 하는데 안 죽은 것"을 떠올려 보세요.
            - 가설은 틀려도 됩니다. 중요한 것은 현상에서 나오는지입니다.
          modelAnswer: |-
            ```text
            무엇이 — 정산 배치가 완료 표시 없이 끝났습니다.
            얼마나 — 12건 중 3건, 모두 월말 마지막 영업일이었습니다.
            언제   — 최근 3개월, 매번 새벽 2시 30분 전후였습니다.
            정상이던 것 — 같은 시각에 도는 다른 배치 4개는 모두 정상이었습니다.
            로그   — "could not extract ResultSet ... SQLTimeoutException" 한 줄 뒤로 로그가 없습니다.
            ```

            현상만 보고 떠오르는 가설 —
            **① 월말이라 데이터가 많아 질의가 시간 초과된다**
            **② 새벽 2시 30분에 다른 무언가(백업 등)가 돌아 DB가 느려진다**
            **③ 특정 고객사 데이터에만 있는 값 때문에 질의가 느려진다**

            실제 원인은 ①이었다. 월말에만 대상 건수가 40배가 되는데
            질의에 인덱스를 못 타는 조건이 있었다.

            **①이 떠오른 이유는 현상에 "월말 마지막 영업일"이 있었기 때문**이다.
            현상을 "가끔 실패합니다"로 적었다면 그 가설이 나오지 않았다.
          selfChecks:
            - 무엇이·얼마나·언제가 각각 있는가
            - 정상이었던 것을 한 줄 넣었는가
            - 로그를 요약하지 않고 원문으로 넣었는가
            - 현상만 읽고 가설이 나오는가
      - key: LESSON.EXPLANATION.TROUBLESHOOTING_STORY.001.U2
        title: 가설과 검증 — 한 번에 하나씩
        minutes: 12
        core: true
        explain: |-
          "이것저것 해 봤더니 됐습니다"는 **고친 것이 아니라 멈춘 것**이다.
          무엇이 원인이었는지 모르니 다음에 또 난다.

          좁히는 방법은 하나다 — **가설을 세우고, 그것만 확인하고, 다음으로 간다.**

          ```text
          가설  이 질의가 월말에 느려진다
          검증  월말 데이터로 EXPLAIN ANALYZE를 돌린다
          결과  Seq Scan, 24만 행 → 가설 유지
          ```

          검증에서 지켜야 할 것이 하나 있다. **한 번에 하나만 바꾼다.**
          인덱스를 추가하면서 동시에 타임아웃도 늘리면,
          나아져도 **무엇 덕분인지 모른다.**

          범위를 반씩 줄이는 방법도 있다. 언제부터 이상했는지 알면
          그 사이의 변경을 절반씩 갈라 확인한다. `git bisect`가 그것을 자동으로 해 준다 —
          "언제부터"를 아는 것이 "무엇 때문에"로 가는 지름길이다.
        example:
          language: text
          code: |-
            [이것저것 해 본 설명]
            "인덱스도 추가하고 타임아웃도 늘리고 커넥션 풀도 키웠더니 괜찮아졌습니다."

            [좁혀 간 설명]
            가설 1 — DB가 전체적으로 느리다
              검증 — 같은 시각 다른 배치 4개의 소요 시간을 봤습니다. 모두 평소와 같았습니다.
              결과 — 기각. DB 전체 문제가 아닙니다.

            가설 2 — 월말에 대상 건수가 늘어 질의가 느려진다
              검증 — 월말과 평일의 대상 건수를 세니 3천 건 대 12만 건이었습니다.
              결과 — 유지. 40배입니다.

            가설 3 — 건수가 늘 때 인덱스를 못 타는 조건이 있다
              검증 — 월말 조건으로 EXPLAIN ANALYZE를 돌렸습니다.
                    created_at::date = ... 가 Filter에 있었고 Seq Scan이었습니다.
              결과 — 확정. 컬럼에 형 변환을 씌워 인덱스를 못 쓰고 있었습니다.
          output: |-
            좁혀 간 설명이 주는 것

            기각 1개  DB 전체 문제 아님 (범위 절반 감소)
            근거 3개  다른 배치 시간 / 건수 40배 / 실행 계획
            확정      원인이 한 줄로 말해진다
            재현성    다음에 비슷하면 같은 순서로 좁힐 수 있다
          note: |-
            - **기각한 가설이 먼저 나온다.** 아닌 것을 지운 것도 일이다
            - 가설마다 검증 방법이 하나씩 붙어 있다. 근거 없는 확신이 없다
            - 마지막에 고친 것이 아니라 **원인**이 나온다
            - 이것저것 한 쪽은 세 가지를 바꿨는데 무엇이 들었는지 모른다
        predict:
          question: 인덱스 추가와 타임아웃 증가를 동시에 배포하고 좋아졌다면?
          choices:
            - 무엇 덕분인지 알 수 없어 다음에 같은 판단을 못 한다
            - 둘 다 효과가 있었던 것이다
            - 빨리 끝났으니 더 좋다
            - 인덱스 덕분이라고 봐도 된다
          answer: 무엇 덕분인지 알 수 없어 다음에 같은 판단을 못 한다
          explanation: |-
            게다가 **필요 없는 것을 그대로 안고 가게 된다.**
            타임아웃을 늘린 것이 소용없었다면 그것은 다음 장애를 늦게 발견하게 만든다.
            급할 때는 한꺼번에 해도 되지만, **끝난 뒤 하나씩 되돌려 확인**한다.
        complete:
          question: 가설 하나를 다루는 세 줄을 채우세요.
          code: |-
            가설 — 월말에 대상 건수가 늘어 질의가 느려진다
            ___  — 월말과 평일의 대상 건수를 센다
            결과 — 3천 건 대 12만 건. ___
          answers:
            - [검증]
            - [유지, 확인, 유지된다]
          explanation: |-
            가설 → 검증 → 결과(유지 또는 기각). 세 줄이 한 덩어리다.
            **검증 방법이 없는 가설은 의견**이고, 의견은 좁혀 주지 않는다.
        problem:
          prompt: |-
            앞 단위에서 쓴 현상으로 돌아가, **좁혀 간 과정**을 가설·검증·결과로 쓰세요.

            - 가설을 **세 개 이상** 쓰고, 그중 **기각된 것을 하나 이상** 넣으세요
            - 가설마다 검증 방법을 한 줄로 쓰세요. 무엇을 보고 판단했나요?
            - 당시에 **한 번에 여러 개를 바꾼 적**이 있다면 그것도 적고,
              지금이라면 어떤 순서로 했을지 쓰세요
            - 마지막에 원인을 **한 문장**으로 쓰세요
          deliverables:
            - 가설·검증·결과 세 덩어리 이상 (기각 포함)
            - 한 번에 여러 개를 바꾼 적과 지금이라면의 순서
            - 원인 한 문장
          hints:
            - 기각한 가설이 기억 안 나면 "처음에 의심했던 것"을 떠올려 보세요.
            - 검증은 거창하지 않아도 됩니다. 로그를 본 것도 검증입니다.
            - 원인 한 문장이 안 써지면 아직 좁혀지지 않은 것일 수 있습니다.
          modelAnswer: |-
            ```text
            가설 1 — 서버 메모리가 부족해 죽는다
              검증 — 장애 시각 전후 메모리 사용률 그래프를 봤습니다. 60%대로 평소와 같았습니다.
              결과 — 기각.

            가설 2 — 외부 결제사 응답이 느려 우리 스레드가 묶인다
              검증 — 결제 호출 로그의 소요 시간 분포를 봤습니다.
                    장애 시각에 P99가 0.8초에서 9초로 올랐습니다.
              결과 — 유지.

            가설 3 — 결제 호출이 트랜잭션 안에 있어 DB 커넥션까지 함께 묶인다
              검증 — 코드를 보니 @Transactional 메서드 안에서 결제 클라이언트를 부르고 있었습니다.
                    풀 크기 10인데 동시 주문 15건이면 마릅니다.
              결과 — 확정.
            ```

            당시에는 **풀 크기를 20으로 늘리고 타임아웃도 5초로 줄이는 것을 같이 배포**했다.
            증상은 사라졌지만 원인은 그대로여서 두 달 뒤 다시 났다.

            지금이라면 **① 결제 호출을 트랜잭션 밖으로 빼고 그것만 배포해 확인 →
            ② 그래도 부족하면 풀 크기** 순서로 한다.
            첫 번째가 원인 제거이고 두 번째는 여유 확보라, 순서가 바뀌면 원인이 숨는다.

            원인 한 문장 — **결제 외부 호출이 트랜잭션 경계 안에 있어,
            결제사가 느려진 동안 DB 커넥션을 함께 붙잡고 있었다.**
          selfChecks:
            - 가설이 세 개 이상이고 기각된 것이 있는가
            - 가설마다 검증 방법이 있는가
            - 한 번에 하나씩 바꿨는지 돌아봤는가
            - 원인이 한 문장으로 써지는가
      - key: LESSON.EXPLANATION.TROUBLESHOOTING_STORY.001.U3
        title: 재발 방지까지가 이야기다
        minutes: 12
        core: true
        explain: |-
          원인을 찾고 고쳤으면 절반이다. 나머지 절반은 **다음에 또 나지 않게 하는 것**이고,
          설명에서 가장 마지막에 오지만 가장 오래 기억된다.

          재발 방지에는 층이 있다.

          | 층 | 무엇 | 예 |
          |---|---|---|
          | **못 하게 막기** | 구조로 막는다 | 외부 호출을 경계 밖으로 빼는 구조 |
          | **빨리 알기** | 나면 즉시 안다 | 커넥션 대기 시간 알림 |
          | **테스트로 잡기** | 다시 들어오면 빌드가 깨진다 | 트랜잭션 안 외부 호출 금지 규칙 |
          | **적어 두기** | 다음 사람이 읽는다 | 커밋 본문, 장애 기록 |

          위로 갈수록 강하다. **막을 수 있으면 막고, 못 막으면 빨리 알고,
          그것도 안 되면 최소한 적어 둔다.**

          그리고 보고는 짧게 네 줄이면 된다 —
          **현상 · 영향 · 원인 · 조치.** 영향이 빠지는 경우가 많은데,
          "몇 명이 얼마 동안 무엇을 못 했나"가 그 장애의 크기다.
        example:
          language: text
          code: |-
            [고친 데서 끝난 설명]
            "결제 호출을 트랜잭션 밖으로 뺐습니다. 이제 괜찮습니다."

            [재발 방지까지 간 설명]
            조치 — 결제 호출을 커밋 뒤 이벤트로 옮겼습니다. (못 하게 막기)
                  ArchUnit 규칙을 추가해 @Transactional 메서드에서
                  외부 클라이언트를 부르면 빌드가 깨지게 했습니다. (테스트로 잡기)
                  커넥션 대기 시간이 1초를 넘으면 알림이 가게 했습니다. (빨리 알기)
                  커밋 본문과 장애 기록에 왜 그렇게 했는지 남겼습니다. (적어 두기)

            [네 줄 보고]
            현상 — 3/12 10:05~10:25 주문 생성 API 503, 평소 200ms → 타임아웃
            영향 — 20분간 주문 시도 약 340건 실패, 고객 문의 11건
            원인 — 결제 외부 호출이 트랜잭션 경계 안에 있어 커넥션을 함께 점유
            조치 — 커밋 뒤 이벤트로 분리, ArchUnit 규칙 추가, 대기 시간 알림 설정
          output: |-
            네 층이 모두 있는지 확인하기

            못 하게 막기  O  커밋 뒤 이벤트로 구조 변경
            테스트로 잡기 O  ArchUnit 규칙
            빨리 알기     O  커넥션 대기 알림
            적어 두기     O  커밋 본문 + 장애 기록
          note: |-
            - 네 가지가 **서로 다른 층**이다. 하나가 뚫려도 다음이 받는다
            - `ArchUnit` 규칙이 특히 강하다 — **사람이 기억하지 않아도 된다**
            - 보고의 "영향"에 숫자가 있다(340건, 11건). 이것이 그 장애의 크기다
            - 조치가 넷인데 보고는 한 줄로 요약했다. 자세한 것은 기록에 있다
        predict:
          question: 구조를 고치지 않고 알림만 추가하면?
          choices:
            - 다음에도 나지만 빨리 알게 된다 — 막은 것이 아니다
            - 재발이 완전히 막힌다
            - 알림이 원인을 없앤다
            - 차이가 없다
          answer: 다음에도 나지만 빨리 알게 된다 — 막은 것이 아니다
          explanation: |-
            알림은 **빨리 아는 층**이지 막는 층이 아니다. 둘 다 필요하지만 섞으면 안 된다.
            "알림 넣었으니 됐다"로 끝내면 같은 장애가 계속 나면서
            **대응이 빨라졌다는 착각**만 남는다.
        complete:
          question: 장애 보고의 네 줄을 채우세요.
          code: |-
            현상 — 3/12 10:05~10:25 주문 생성 API 503
            ___  — 20분간 주문 시도 약 340건 실패, 고객 문의 11건
            원인 — 결제 외부 호출이 트랜잭션 경계 안에 있었다
            ___  — 커밋 뒤 이벤트로 분리, ArchUnit 규칙 추가
          answers:
            - [영향]
            - [조치]
          explanation: |-
            현상 · 영향 · 원인 · 조치. **영향이 빠지면 그 장애가 큰 일인지 알 수 없다.**
            몇 명이 얼마 동안 무엇을 못 했는지가 영향이다.
        problem:
          prompt: |-
            앞 두 단위에서 쓴 장애를 **네 줄 보고**로 정리하고 재발 방지를 설계하세요.

            - 현상·영향·원인·조치를 각각 한 줄로 쓰세요. 영향에 숫자를 넣으세요
            - 재발 방지를 **네 층**(못 하게 막기 / 빨리 알기 / 테스트로 잡기 / 적어 두기)에
              대응시키고, 각 층에 무엇을 했는지 또는 **할 수 있었는지** 적으세요
            - 네 층 중 **비어 있는 층**이 있으면 왜 안 했는지 적으세요
            - 실제로는 안 했지만 **지금 할 수 있는 것**이 있다면 하나 고르세요
          deliverables:
            - 네 줄 보고
            - 네 층 대응표
            - 비어 있는 층과 그 이유
            - 지금 할 수 있는 것 하나
          hints:
            - 영향의 숫자가 기억 안 나면 "몇 분간", "몇 명이"만이라도 적어 보세요.
            - 테스트로 잡는 층은 대개 비어 있습니다. 무엇을 단언하면 잡혔을까요?
            - 안 한 이유가 "시간이 없어서"여도 됩니다. 적어 두면 다음에 판단할 재료가 됩니다.
          modelAnswer: |-
            ```text
            현상 — 3개월간 월말 정산 배치 3회가 완료 표시 없이 종료
            영향 — 고객사 13곳 정산 지연, 매번 수동 재실행에 1시간, 담당자 새벽 호출 3회
            원인 — 월말에 대상이 40배가 되는데 질의가 컬럼 형 변환 때문에 인덱스를 못 탔다
            조치 — 조건을 범위 비교로 바꾸고 (created_at, status) 인덱스를 추가
            ```

            | 층 | 했나 | 무엇 |
            |---|---|---|
            | 못 하게 막기 | O | 조건을 범위 비교로. 형 변환이 사라져 구조적으로 인덱스를 탄다 |
            | 빨리 알기 | O | 배치 소요 시간이 평소의 3배를 넘으면 알림 |
            | 테스트로 잡기 | **X** | — |
            | 적어 두기 | O | 커밋 본문에 전후 EXPLAIN 결과를 붙였다 |

            테스트 층이 빈 이유 — **월말 규모의 데이터를 테스트에서 만들 방법을 못 찾았다.**
            12만 건을 넣는 테스트는 너무 느려 CI에 둘 수 없었다.

            지금 할 수 있는 것 — **데이터 없이도 잡을 수 있다.**
            그 질의의 실행 계획을 뽑아 `Seq Scan`이 아닌지 단언하는 테스트를 두면,
            건수와 무관하게 "인덱스를 못 타는 조건이 다시 들어왔는지"를 잡는다.
            데이터를 흉내 내려 한 것이 막힌 원인이었다.
          selfChecks:
            - 네 줄 보고에 영향과 숫자가 있는가
            - 네 층 중 무엇을 했고 무엇이 비었는지 구분했는가
            - 비어 있는 층에 이유를 적었는가
            - 지금 할 수 있는 것을 하나 골랐는가
    commonMistakes:
      - 원인부터 말한다. 듣는 사람이 그 결론이 맞는지 판단할 근거를 못 받는다 (U1)
      - 한 번에 여러 개를 바꾼다. 나아져도 무엇 덕분인지 모르고 필요 없는 것을 안고 간다 (U2)
      - 알림만 추가하고 막았다고 여긴다. 빨리 아는 것과 못 하게 막는 것은 다른 층이다 (U3)
    inProject: |-
      주문 시스템에서 막혔던 순간마다 **현상·가설·검증을 그 자리에서** 적어 둔다.
      풀고 나면 가설이 기억나지 않고, 기각했던 것은 더 빨리 사라진다.
      풀린 뒤에는 네 줄 보고로 정리하고 재발 방지를 네 층에 맞춰 본다 —
      그중 테스트 층이 비어 있으면 그것이 다음 할 일이다.
    sources:
      - title: PostgreSQL 16 — Using EXPLAIN (가설을 검증하는 도구)
        url: https://www.postgresql.org/docs/16/using-explain.html
        versionScope: PostgreSQL 16
      - title: Git — git-bisect (언제부터 이상했는지 반씩 좁힌다)
        url: https://git-scm.com/docs/git-bisect
        versionScope: Git 2.x
      - title: Spring Boot — Logging (현상을 남기는 자리)
        url: https://docs.spring.io/spring-boot/reference/features/logging.html
        versionScope: Spring Boot 3.x+
    verifiedAt: 2026-09-25

  - key: LESSON.EXPLANATION.LEARNING_RETROSPECTIVE.001
    skillCode: EXPLANATION.LEARNING_RETROSPECTIVE
    title: 배운 뒤 무엇이 달라졌는지 말하기
    whyItMatters: |-
      "공부했습니다"와 "공부해서 이것이 달라졌습니다"는 전혀 다른 말이다.
      앞은 확인할 방법이 없고 뒤는 있다.
      그리고 이 구분은 남에게 말할 때보다 **스스로 확인할 때** 더 쓸모가 있다 —
      읽기만 하고 아무것도 달라지지 않았다면, 그것은 아직 배운 것이 아니다.
    oneLine: 배운 것은 "전에는 이렇게 했고 지금은 이렇게 한다"로 말할 수 있을 때 확인된다.
    units:
      - key: LESSON.EXPLANATION.LEARNING_RETROSPECTIVE.001.U1
        title: 배웠다는 증거는 달라진 행동이다
        minutes: 12
        core: true
        explain: |-
          배운 것을 말할 때 가장 흔한 형태가 이것이다.

          ```text
          "트랜잭션에 대해 공부했습니다."
          ```

          여기서 확인할 수 있는 것이 없다. 읽었는지, 이해했는지, 쓸 수 있는지 구분이 안 된다.

          확인 가능한 형태는 **전후 대비**다.

          ```text
          "전에는 서비스 메서드에 @Transactional을 습관적으로 붙였습니다.
           지금은 외부 호출이 있으면 경계 밖으로 빼고 붙입니다.
           결제 호출이 트랜잭션 안에 있어 커넥션이 함께 묶인 적이 있어서입니다."
          ```

          세 줄에 셋이 들어 있다 — **전에 하던 것 · 지금 하는 것 · 바뀐 계기.**

          계기가 중요하다. 계기가 없으면 "그렇게 배웠다"가 되고,
          계기가 있으면 **겪어서 안 것**이 된다. 겪은 것은 잊히지 않는다.

          그리고 이 형태는 **스스로를 점검하는 자**이기도 하다.
          전후가 안 써지면 아직 읽기만 한 것이다.
        example:
          language: text
          code: |-
            [확인할 수 없는 형태]
            "JPA와 영속성 컨텍스트를 공부했습니다."

            [전후로 쓴 형태]
            전에는 — 조회한 엔티티를 고치고 나서 항상 save()를 불렀습니다.
                    부르지 않으면 저장이 안 될까 봐 불안했습니다.
            지금은 — 트랜잭션 안에서 조회한 것은 save() 없이 고치고,
                    대신 그 객체가 영속 상태인지를 먼저 확인합니다.
            계기   — 요청 본문으로 받은 객체에 세터를 불렀는데 DB가 안 바뀌어
                    반나절을 헤맸습니다. 그 객체는 방에 들어온 적이 없었습니다.
          output: |-
            전후로 쓰면 드러나는 것

            읽었다 → 무엇을 읽었는지만 남는다
            전후    → 판단 기준이 바뀐 지점이 드러난다
            계기    → 그 기준이 어디서 왔는지가 드러난다
          note: |-
            - '"불안했습니다"가 솔직하게 들어 있다 — **전에 하던 것에는 이유가 있었다**'
            - 지금 하는 것이 "안 부른다"가 아니라 **"영속 상태인지 확인한다"** 다. 기준이 바뀐 것이다
            - 계기가 구체적이다(요청 본문 객체, 반나절). 겪은 일이다
            - 이 셋이 써지면 그 개념은 이미 쓸 수 있는 상태다
        predict:
          question: 전후는 썼는데 계기가 없으면 어떻게 읽히나?
          choices:
            - 책에서 읽어 그렇게 한다는 말로 읽힌다
            - 더 객관적으로 읽힌다
            - 차이가 없다
            - 더 믿음직하게 읽힌다
          answer: 책에서 읽어 그렇게 한다는 말로 읽힌다
          explanation: |-
            계기는 **그 지식이 내 것이 된 순간**이다.
            계기가 없으면 "그렇게 하라고 하더라"와 구분되지 않고,
            조금만 다른 상황이 오면 적용하지 못한다.
            계기가 떠오르지 않으면, 아직 한 번도 그것 때문에 곤란해 본 적이 없다는 뜻이다.
        complete:
          question: 배운 것을 확인 가능한 형태로 바꾸는 세 줄을 채우세요.
          code: |-
            ___ — 서비스 메서드에 습관적으로 @Transactional을 붙였다
            지금은 — 외부 호출이 있으면 경계 밖으로 빼고 붙인다
            ___   — 결제 호출이 경계 안에 있어 커넥션이 함께 묶인 적이 있다
          answers:
            - [전에는]
            - [계기]
          explanation: |-
            전에는 · 지금은 · 계기. **셋이 다 써지면 배운 것이고, 안 써지면 아직 읽은 것이다.**
            이 형태는 남에게 말하기 전에 스스로 확인하는 데 먼저 쓴다.
        problem:
          prompt: |-
            최근 두 달 안에 배운 것 **세 가지**를 골라 전후로 쓰세요.

            - 각각 전에는·지금은·계기 세 줄로 쓰세요
            - 셋 중 **계기가 안 써지는 것**이 있으면 그것을 표시하세요
            - 계기가 안 써지는 것에 대해, **어떻게 하면 계기를 만들 수 있을지** 적으세요
              (어떤 상황에서 그것이 필요해지는가)
            - 세 가지 중 **지금 하는 것이 전과 똑같은 것**이 있으면 솔직히 적으세요
          deliverables:
            - 세 가지의 전에는·지금은·계기
            - 계기가 없는 것과 그것을 만드는 방법
            - 전과 똑같은 것이 있으면 그것
          hints:
            - 계기는 대개 "곤란했던 순간"입니다. 헤맸던 일을 떠올려 보세요.
            - 전과 똑같아도 괜찮습니다. 그것을 아는 것이 이 과제의 목적입니다.
            - 계기를 만들려면 그 개념이 없으면 막히는 상황을 일부러 만들면 됩니다.
          modelAnswer: |-
            ```text
            1. 트랜잭션 경계
               전에는 — 서비스 메서드에 습관적으로 붙였다
               지금은 — 외부 호출이 있으면 밖으로 빼고 붙인다
               계기   — 결제 호출 때문에 커넥션이 마른 장애를 겪었다

            2. 인덱스 컬럼 순서
               전에는 — 조건에 쓰는 컬럼을 그냥 나열해 인덱스를 만들었다
               지금은 — 등호 조건을 앞, 범위와 정렬을 뒤에 둔다
               계기   — 순서를 바꿨더니 EXPLAIN에서 Filter가 Index Cond로 옮겨 갔다

            3. Optional
               전에는 — 조회 메서드가 null을 돌려줬다
               지금은 — (아직 똑같다)
               계기   — 없음
            ```

            3번은 **아직 읽기만 한 것**이다. 지금 하는 일에 조회 메서드를 새로 만들 일이 없어
            적용할 자리가 없었다.

            계기를 만드는 방법 — 다음에 저장소 메서드를 하나라도 손댈 때
            **반환 타입을 `Optional`로 바꾸고 부르는 쪽을 고쳐 본다.**
            그때 `isPresent()` + `get()`으로 쓰고 싶어지는 순간이 올 텐데,
            그 순간이 바로 계기가 된다.

            셋 중 하나가 비어 있다는 것을 아는 것이 이 정리의 수확이다.
            **모르는 줄 몰랐던 것이 아니라, 안다고 여겼던 것이었다.**
          selfChecks:
            - 세 가지 모두 전에는·지금은을 썼는가
            - 계기가 겪은 일로 되어 있는가
            - 계기가 없는 것을 솔직히 표시했는가
            - 전과 똑같은 것을 숨기지 않았는가
      - key: LESSON.EXPLANATION.LEARNING_RETROSPECTIVE.001.U2
        title: 기억이 아니라 기록에서 찾기
        minutes: 12
        core: true
        explain: |-
          되돌아볼 때 기억에 의존하면 두 가지가 일어난다.
          **최근 것만 떠오르고, 잘된 것만 떠오른다.**

          그래서 기록을 본다. 이미 남아 있는 것이 있다.

          | 기록 | 무엇을 알려 주나 |
          |---|---|
          | `git log` | 무엇을 언제 얼마나 했나 |
          | 커밋 diff | 코드 습관이 실제로 바뀌었나 |
          | 커밋 본문 | 그때 무슨 판단을 했나 |
          | 장애 기록 | 무엇 때문에 곤란했나 |

          가장 강한 것이 **diff**다. 말은 꾸밀 수 있지만
          석 달 전 코드와 지금 코드를 나란히 두면 바뀌었는지가 그냥 보인다.

          ```bash
          git log --since="3 months ago" --oneline
          git log --since="3 months ago" --stat -- src/main/java/.../OrderService.java
          ```

          바뀐 것이 없다면 그것도 결과다. **바쁘게 일했는데 습관은 그대로**인
          기간이 있었다는 사실을 아는 것이 다음 계획을 정한다.
        example:
          language: text
          code: |-
            $ git log --since="3 months ago" --oneline | wc -l
            87

            $ git log --since="3 months ago" --oneline | grep -c "^\w* fix"
            41

            # 석 달 전 코드
            @Transactional
            public void place(OrderRequest request) {
                orderRepository.save(...);
                paymentClient.charge(...);      // 경계 안
                notificationClient.send(...);   // 경계 안
            }

            # 지금 코드
            @Transactional
            public Order place(OrderRequest request) {
                return orderRepository.save(...);
            }
            // 결제와 알림은 커밋 뒤 이벤트로
          output: |-
            기록이 말해 주는 것

            커밋 87개 중 fix가 41개  — 절반이 고치는 일이었다
            경계 안 외부 호출 2개 → 0개  — 습관이 실제로 바뀌었다
            바뀐 시점: 5월 둘째 주  — 장애 다음 주다
          note: |-
            - 숫자가 기억을 교정한다. "많이 고쳤다"가 아니라 **87개 중 41개**다
            - diff가 **습관이 바뀐 증거**다. 말이 아니라 코드다
            - 바뀐 시점이 장애 다음 주다 — 계기가 기록으로 확인된다
            - 이 셋을 기억으로 재구성하려 하면 거의 안 된다
        predict:
          question: 석 달 치 diff를 봤는데 습관이 바뀐 흔적이 없다면?
          choices:
            - 그것도 결과다 — 무엇을 배울지 다시 정할 근거가 된다
            - 되돌아볼 것이 없으니 넘어간다
            - 기록이 잘못된 것이다
            - 더 오래 전을 봐야 한다
          answer: 그것도 결과다 — 무엇을 배울지 다시 정할 근거가 된다
          explanation: |-
            **바뀐 것이 없다는 사실을 모르는 것**이 가장 나쁘다.
            바빴던 기간과 자란 기간은 다르고, 기록은 그 둘을 구분해 준다.
            바뀐 것이 없으면 "읽기만 하고 적용할 자리가 없었다"는 뜻이고,
            다음 계획은 **적용할 자리를 먼저 만드는 것**이 된다.
        complete:
          question: 기록에서 되돌아보는 명령을 채우세요.
          code: |-
            git ___ --since="3 months ago" --oneline        # 무엇을 했나
            git log --since="3 months ago" --___ -- <파일>   # 어느 파일을 얼마나 고쳤나
          answers:
            - [log]
            - [stat]
          explanation: |-
            `git log`가 한 일의 목록이고 `--stat`이 변경 규모를 보여 준다.
            **기억이 아니라 여기서 시작**하면 최근 것만 떠오르는 편향이 줄어든다.
        problem:
          prompt: |-
            최근 3개월 기록을 열어 **자란 곳과 안 자란 곳**을 찾으세요.

            - `git log --since="3 months ago" --oneline` 으로 커밋 수를 세세요
            - 가장 많이 고친 파일 세 개를 찾고, 각각 **왜 자주 고쳤는지** 적으세요
            - 그중 하나를 골라 **3개월 전 버전과 지금 버전을 나란히** 두고,
              코드 습관이 바뀐 곳을 찾으세요. 없으면 없다고 적으세요
            - 마지막으로 **기록에는 남았는데 기억에 없던 것** 하나를 적으세요
          deliverables:
            - 커밋 수와 가장 많이 고친 파일 세 개
            - 파일별로 자주 고친 이유
            - 전후 비교에서 찾은 습관 변화 (또는 없음)
            - 기억에 없던 것 하나
          hints:
            - 자주 고친 파일은 대개 설계가 불안한 곳이거나 요구가 자주 바뀌는 곳입니다.
            - 습관 변화는 이름 짓는 방식, 예외 처리, 메서드 길이에서 잘 드러납니다.
            - 기억에 없던 것을 찾는 것이 이 과제의 목적입니다.
          modelAnswer: |-
            ```bash
            $ git log --since="3 months ago" --oneline | wc -l
            87
            $ git log --since="3 months ago" --stat --oneline | grep "|" \
                | awk '{print $1}' | sort | uniq -c | sort -rn | head -3
                 14 src/main/java/com/example/order/OrderService.java
                  9 src/main/resources/application-prod.yml
                  7 src/main/java/com/example/order/OrderController.java
            ```

            | 파일 | 자주 고친 이유 |
            |---|---|
            | `OrderService` | 새 요구가 전부 여기로 들어왔다. 책임이 너무 많다 |
            | `application-prod.yml` | 설정 값을 그때그때 조정했다. 기준이 없었다 |
            | `OrderController` | 응답 형식이 계속 바뀌었다. DTO가 없어 엔티티를 그대로 썼다 |

            `OrderService` 전후 비교 — **예외 처리가 바뀌었다.**
            3개월 전에는 `catch (Exception e) { log.warn(...) }` 가 세 군데 있었고
            지금은 전부 타입별로 좁혀졌다. 삼키는 코드가 사라졌다.
            반면 **메서드 길이는 그대로**다. 가장 긴 것이 그때도 지금도 80줄이 넘는다.

            기억에 없던 것 — **`application-prod.yml`을 9번 고쳤다는 사실.**
            설정을 그렇게 자주 만졌다는 감각이 전혀 없었다.
            돌아보니 매번 타임아웃이나 풀 크기를 조금씩 올리고 있었고,
            **그때마다 왜 그 값인지는 아무 데도 안 적혀 있었다.**
            다음에 배울 것이 여기서 나온다.
          selfChecks:
            - 기억이 아니라 명령을 돌려 시작했는가
            - 자주 고친 이유를 파일마다 적었는가
            - 습관이 안 바뀐 곳도 찾았는가
            - 기억에 없던 것을 하나 찾았는가
      - key: LESSON.EXPLANATION.LEARNING_RETROSPECTIVE.001.U3
        title: 막혔던 자리를 다음 계획으로 잇기
        minutes: 10
        core: true
        explain: |-
          되돌아보기가 감상으로 끝나면 아무것도 바뀌지 않는다.
          마지막 한 걸음은 **다음에 무엇을 할지로 잇는 것**이다.

          잇는 재료는 세 곳에서 나온다.

          | 어디서 | 무엇이 나오나 |
          |---|---|
          | **계기가 없던 것** | 적용할 자리를 만들어야 하는 것 |
          | **자주 고친 파일** | 설계가 불안한 곳 |
          | **모르고 넘어간 것** | 기록에는 있는데 기억에 없던 것 |

          그리고 다음 계획은 **"무엇을 공부한다"가 아니라
          "무엇을 해서 무엇이 달라지게 한다"** 로 쓴다.

          ```text
          나쁨  — 다음 달에는 테스트를 공부한다
          좋음  — OrderService의 가장 긴 메서드에 실패 경로 테스트를 먼저 쓰고,
                 그다음에 쪼갠다. 다 쓰면 "전에는 무서워서 못 쪼갰다 → 지금은 쪼갠다"가 써진다
          ```

          뒤쪽은 **끝났는지 판단할 수 있다.** 그것이 계획과 소망의 차이다.
        example:
          language: text
          code: |-
            [되돌아본 결과]
            - Optional은 읽기만 했고 계기가 없다
            - OrderService를 14번 고쳤다. 책임이 많다
            - application-prod.yml을 9번 고쳤는데 왜 그 값인지 아무 데도 없다

            [다음 계획으로 잇기]
            1. 다음에 저장소 메서드를 손댈 때 반환 타입을 Optional로 바꾸고
               부르는 쪽을 고친다.
               → 끝난 표시: "전에는 null을 돌려줬다 → 지금은 없을 수 있음을 타입에 적는다"가 써진다

            2. OrderService에서 가장 긴 메서드 하나를 골라 실패 경로 테스트를 먼저 쓴다.
               → 끝난 표시: 그 메서드를 쪼갰고 테스트가 초록이다

            3. application-prod.yml의 값 9개 중 3개에 대해
               왜 그 값인지 커밋 본문이나 주석으로 남긴다.
               → 끝난 표시: 세 값의 근거를 다른 사람이 읽을 수 있다
          output: |-
            세 계획의 공통점

            대상이 하나로 정해져 있다   OrderService의 가장 긴 메서드 하나
            끝난 표시가 있다            테스트가 초록 / 문장이 써진다
            지금 하는 일 안에서 된다     따로 시간을 내지 않아도 된다
          note: |-
            - 셋 다 **"공부한다"가 아니라 "한다"** 로 되어 있다
            - 끝난 표시가 있어 다음 회고에서 O/X를 매길 수 있다
            - 1번의 끝난 표시가 **U1의 전후 문장**이다 — 되돌아보기가 순환한다
            - 지금 하는 일 안에서 되게 잡았다. 따로 시간이 필요한 계획은 밀린다
        predict:
          question: '"다음 달에는 JPA를 더 깊이 공부한다"는 계획의 문제는?'
          choices:
            - 끝났는지 판단할 방법이 없다
            - 너무 쉽다
            - 범위가 좁다
            - 문제가 없다
          answer: 끝났는지 판단할 방법이 없다
          explanation: |-
            "더 깊이"는 어디까지인지 아무도 모른다. 그래서 **영원히 안 끝나고,
            안 끝나니 못 했다는 느낌만 쌓인다.**
            대상 하나와 끝난 표시를 정하면 그 느낌이 사라진다 —
            했으면 O, 안 했으면 X로 끝난다.
        complete:
          question: 다음 계획을 판단 가능한 형태로 바꾸세요.
          code: |-
            나쁨 — 테스트를 공부한다
            좋음 — OrderService의 가장 긴 메서드에 실패 경로 테스트를 쓴다
                  → 끝난 ___: 그 메서드를 쪼갰고 테스트가 ___이다
          answers:
            - [표시, 기준]
            - [초록, 통과]
          explanation: |-
            **대상 하나 + 끝난 표시.** 둘이 있으면 계획이고, 없으면 소망이다.
            끝난 표시는 다음 되돌아보기에서 그대로 O/X가 된다.
        problem:
          prompt: |-
            앞 두 단위의 결과를 **다음 계획 세 개**로 이으세요.

            - 계기가 없던 것 / 자주 고친 파일 / 기억에 없던 것에서 각각 하나씩 뽑으세요
            - 각 계획에 **대상 하나**와 **끝난 표시**를 쓰세요
            - 셋 다 **지금 하는 일 안에서** 되게 잡으세요. 따로 시간을 내야 하면 더 작게 쪼개세요
            - 각 계획이 끝났을 때 쓰게 될 **전에는·지금은 문장**을 미리 써 보세요
          deliverables:
            - 계획 세 개 (대상 · 끝난 표시)
            - 셋이 지금 하는 일 안에서 되는지 확인
            - 끝났을 때 쓰게 될 전후 문장 세 개
          hints:
            - 끝난 표시는 O/X로 답할 수 있어야 합니다.
            - '"따로 시간을 내야 한다"면 그 계획은 다음 달에도 그대로 남습니다.'
            - 전후 문장을 미리 써 보면 그 계획이 정말 무언가를 바꾸는지 보입니다.
          modelAnswer: |-
            | 출처 | 대상 | 끝난 표시 |
            |---|---|---|
            | 계기 없음 | 다음에 손댈 저장소 메서드 1개의 반환 타입 | 부르는 쪽까지 고쳐 빌드 통과 |
            | 자주 고친 파일 | `OrderService`의 가장 긴 메서드 1개 | 실패 경로 테스트 초록 + 쪼갬 |
            | 기억에 없던 것 | `application-prod.yml`의 값 3개 | 세 값의 근거가 커밋 본문에 있음 |

            셋 다 **지금 하는 일 안에서 된다.**
            첫째는 어차피 손댈 파일에서 하고, 둘째는 다음 기능이 들어올 때 하고,
            셋째는 다음에 설정을 만질 때 한 줄 더 쓰는 것이다.

            끝났을 때 쓰게 될 문장 —
            ```text
            1. 전에는 조회 메서드가 null을 돌려줘 부르는 쪽마다 검사했다.
               지금은 없을 수 있다는 것을 반환 타입에 적는다.
            2. 전에는 긴 메서드를 고칠 때 무서워서 그대로 뒀다.
               지금은 실패 경로 테스트를 먼저 쓰고 쪼갠다.
            3. 전에는 설정 값을 감으로 올렸다.
               지금은 잰 근거를 커밋 본문에 남긴다.
            ```

            미리 써 보니 **2번이 가장 크다.** "무서워서 못 했던 것을 하게 된다"는 변화라
            셋 중 먼저 할 것을 2번으로 정한다.
          selfChecks:
            - 세 계획에 각각 대상 하나와 끝난 표시가 있는가
            - 끝난 표시가 O/X로 답해지는가
            - 따로 시간을 내지 않아도 되는가
            - 전후 문장을 미리 써 봤는가
    commonMistakes:
      - '"공부했습니다"로 말한다. 읽었는지 쓸 수 있는지 구분되지 않는다 (U1)'
      - 기억으로 되돌아본다. 최근 것과 잘된 것만 떠올라 안 자란 곳이 안 보인다 (U2)
      - '다음 계획을 "더 깊이 공부한다"로 적는다. 끝났는지 판단할 방법이 없다 (U3)'
    inProject: |-
      주문 시스템에서 한 단계를 마칠 때마다 이 순서를 한 바퀴 돈다 —
      **전에는·지금은·계기 세 줄을 쓰고, `git log`로 기록을 확인하고, 다음 계획 세 개로 잇는다.**
      전후가 안 써지는 개념이 있으면 그것이 아직 적용할 자리를 못 만난 것이고,
      다음 단계에서 그 자리를 먼저 만든다.
