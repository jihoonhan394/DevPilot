# DevPilot 개념 노트 — OWASP Top 10 기초
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 1단계(CRUD와 검증)에서 쓴다. SECURITY.AUTHN_AUTHZ·SECURITY.INPUT_VALIDATION과 짝이다
# - 목록 암기가 아니라 점검 목록으로 쓰는 법을 가르친다
lessons:
  - key: LESSON.SECURITY.OWASP_TOP10.001
    skillCode: SECURITY.OWASP_TOP10
    title: 무너지는 자리를 미리 아는 법 (OWASP Top 10)
    whyItMatters: |-
      보안 사고는 새로운 수법보다 **이미 알려진 같은 자리**에서 훨씬 자주 난다.
      그 자리들을 모아 순위를 매겨 놓은 목록이 있으니, 기능 하나를 만들 때마다
      그 목록으로 자기 코드를 훑으면 된다.
      주문 시스템에서 남의 주문이 보이거나 조회 조건에 코드가 섞여 들어가는 일이 여기서 갈린다.
    oneLine: OWASP Top 10은 외우는 목록이 아니라, 기능을 내보내기 전에 코드를 훑는 점검 목록이다.
    units:
      - key: LESSON.SECURITY.OWASP_TOP10.001.U1
        title: 목록을 점검 목록으로 바꾸기
        minutes: 10
        core: true
        explain: |-
          OWASP Top 10은 **웹 애플리케이션에서 가장 자주, 가장 크게 무너지는 자리**를
          모은 목록이다. 실제 사고와 취약점 데이터를 모아 몇 년에 한 번 순위를 새로 매긴다.

          중요한 것은 순위 자체가 아니라 쓰는 방법이다. **목록을 외우는 것이 아니라,
          기능 하나를 내보내기 전에 그 기능에 해당하는 항목만 골라 훑는다.**

          백엔드 1단계에서 늘 걸리는 것은 다음 셋이다.

          | 항목 | 한 줄 | 우리가 할 일 |
          |---|---|---|
          | **접근 통제 실패** | 남의 것을 볼 수 있다 | 자원마다 소유자를 함께 확인한다 |
          | **주입** | 데이터가 명령으로 읽힌다 | 값과 명령을 섞지 않는다 |
          | **보안 설정 오류** | 기본값 그대로 열려 있다 | 안 쓰는 것을 끄고 비밀을 밖에 둔다 |

          나머지는 그 기능에 해당할 때만 본다. 암호 저장을 다루지 않는 화면에서
          암호 관련 항목을 훑는 것은 시간 낭비다.
        example:
          language: java
          code: |-
            // 기능 하나를 내보내기 전 훑는 목록을 코드 옆에 둔 모습
            //
            // [ ] 이 API가 남의 자원을 돌려줄 수 있나        → 접근 통제
            // [ ] 사용자 입력이 질의나 명령에 섞이나          → 주입
            // [ ] 응답이나 로그에 비밀이 나가나              → 설정 오류·민감정보
            //
            @GetMapping("/orders/{orderId}")
            OrderResponse find(@PathVariable long orderId, @AuthenticationPrincipal Member member) {
                Order order = orderRepository
                        .findByIdAndMemberId(orderId, member.id())     // 소유자를 함께 조회
                        .orElseThrow(() -> new OrderNotFoundException(orderId));
                return OrderResponse.from(order);
            }
          output: |-
            GET /orders/1001   (내 주문)        → 200 OK
            GET /orders/2002   (남의 주문)      → 404 Not Found
            GET /orders/9999   (없는 주문)      → 404 Not Found
          note: |-
            - 점검 목록이 **그 기능 옆에** 있다. 따로 문서를 찾아갈 필요가 없다
            - 소유자를 조회 조건에 넣었다 — 찾은 뒤 비교하는 것이 아니다
            - 남의 주문과 없는 주문의 응답이 **똑같이 404**다. 다음 단위에서 그 이유를 본다
            - 목록의 나머지 항목은 이 기능에 해당하지 않아 훑지 않았다
        predict:
          question: 남의 주문 조회에 404가 아니라 403을 돌려주면 무엇이 드러나나?
          choices:
            - 그 번호의 주문이 실재한다는 사실이 드러난다
            - 아무것도 드러나지 않는다. 403이 더 정확하다
            - 응답 속도가 느려진다
            - 인증이 풀린다
          answer: 그 번호의 주문이 실재한다는 사실이 드러난다
          explanation: |-
            없는 주문은 404, 남의 주문은 403이면 **번호를 훑어 보며 어느 번호가 존재하는지**
            알아낼 수 있다. 이것을 자원의 존재가 새어 나간다고 한다.
            권한이 없는 자원은 **없는 것과 똑같이** 다루는 것이 안전하다.
        complete:
          question: 소유자를 조회 조건에 함께 넣도록 빈칸을 채우세요.
          code: |-
            Order order = orderRepository
                    .findByIdAnd___(orderId, member.id())
                    .orElseThrow(() -> new OrderNotFoundException(orderId));
            // 찾은 뒤에 비교하지 않는다. 애초에 남의 것은 ___ 되지 않는다
          answers:
            - [MemberId]
            - [조회]
          explanation: |-
            찾은 뒤 `if (order.memberId() != member.id())` 로 비교하면
            그 비교를 빠뜨린 곳이 하나라도 생기는 순간 새어 나간다.
            조회 조건에 넣으면 **빠뜨릴 자리가 없다.**
        problem:
          prompt: |-
            주문 시스템에 "주문 취소" 기능을 새로 붙인다고 하자.
            `DELETE /orders/{orderId}` 하나다.

            - 이 기능에 해당하는 점검 항목을 **세 가지 이상** 고르고,
              각각에 대해 **이 기능에서 구체적으로 무엇을 확인할지** 적으세요
            - 고르지 않은 항목이 있다면 왜 해당하지 않는지도 한 줄씩 적으세요
            - 점검을 통과하는 컨트롤러와 서비스 코드를 쓰세요
          deliverables:
            - 고른 점검 항목 3가지 이상과 각각의 구체적 확인 내용
            - 고르지 않은 항목과 그 이유
            - 점검을 통과하는 코드
          hints:
            - 남의 주문을 취소할 수 있는지부터 보세요. 그것이 첫 항목입니다.
            - 취소는 상태를 바꾸는 일입니다. 같은 요청이 두 번 오면 어떻게 될까요?
            - 취소 사유를 입력받는다면 그 값이 어디에 쓰이는지 따라가 보세요.
          modelAnswer: |-
            | 항목 | 이 기능에서 확인할 것 |
            |---|---|
            | 접근 통제 실패 | 내 주문만 취소되는가. 소유자를 조회 조건에 넣었는가 |
            | 보안 설정 오류 | 이 경로가 인증 없이 열려 있지 않은가 |
            | 민감정보 노출 | 실패 응답에 주문 소유자나 내부 상태가 새지 않는가 |
            | 주입 | 취소 사유를 받는다면 질의나 로그에 그대로 섞이지 않는가 |

            해당하지 않는 것: 암호 저장(다루지 않는다), 파일 업로드(없다),
            외부 URL 호출(없다 — 있다면 SSRF를 봐야 한다).

            ```java
            @DeleteMapping("/orders/{orderId}")
            @ResponseStatus(HttpStatus.NO_CONTENT)
            void cancel(@PathVariable long orderId, @AuthenticationPrincipal Member member) {
                orderService.cancel(orderId, member.id());
            }

            @Transactional
            public void cancel(long orderId, long memberId) {
                Order order = orderRepository
                        .findByIdAndMemberId(orderId, memberId)
                        .orElseThrow(() -> new OrderNotFoundException(orderId));
                order.cancel();     // 이미 취소됐거나 배송됐으면 여기서 막는다
            }
            ```

            남의 주문도 없는 주문도 똑같이 `OrderNotFoundException` → 404다.
            상태 전이 규칙은 도메인 안에 두어, 두 번 취소해도 같은 결과가 되게 했다.
          selfChecks:
            - 소유자 확인을 조회 조건에 넣었는가
            - 남의 자원과 없는 자원의 응답이 같은가
            - 이 기능에 해당하지 않는 항목을 걸러 냈는가
            - 같은 요청이 두 번 와도 결과가 달라지지 않는가
      - key: LESSON.SECURITY.OWASP_TOP10.001.U2
        title: 접근 통제는 서버가 매번 묻는다
        minutes: 12
        core: true
        explain: |-
          가장 자주 무너지는 자리다. 원인은 거의 늘 같다 —
          **화면에서 막았으니 됐다고 여기는 것.**

          화면에서 버튼을 감추는 것은 편의이지 통제가 아니다.
          브라우저 주소창, 개발자도구, `curl` 한 줄이면 화면을 거치지 않고 부를 수 있다.
          **통제는 서버에만 있다.**

          지킬 규칙은 세 가지다.

          1. **기본은 거부다.** 명시적으로 허용한 것만 통과시킨다
          2. **자원마다 묻는다.** 로그인했다는 사실은 "무엇을 해도 되는가"의 답이 아니다
          3. **식별자를 믿지 않는다.** 요청에 실려 온 `memberId`는 사용자가 고칠 수 있다.
             누구인지는 **표(토큰·세션)에서** 꺼낸다

          3번을 어기는 것을 **안전하지 않은 직접 객체 참조**라 하고,
          `?memberId=` 같은 매개변수를 그대로 쓸 때 난다.
        example:
          language: java
          code: |-
            // 나쁜 예 — 요청이 준 memberId를 그대로 믿는다
            @GetMapping("/orders")
            List<OrderResponse> badList(@RequestParam long memberId) {
                return orderRepository.findAllByMemberId(memberId).stream()
                        .map(OrderResponse::from)
                        .toList();
            }

            // 좋은 예 — 누구인지는 토큰에서 꺼낸다
            @GetMapping("/orders")
            List<OrderResponse> list(@AuthenticationPrincipal Member member) {
                return orderRepository.findAllByMemberId(member.id()).stream()
                        .map(OrderResponse::from)
                        .toList();
            }
          output: |-
            [나쁜 예]
            GET /orders?memberId=1   → 내 주문 2건
            GET /orders?memberId=2   → 남의 주문 5건   ← 숫자만 바꾸면 끝이다

            [좋은 예]
            GET /orders              → 내 주문 2건
            GET /orders?memberId=2   → 내 주문 2건   ← 매개변수를 보지 않는다
          note: |-
            - 나쁜 예는 화면에 버튼이 없어도 **주소만 고치면** 남의 것이 보인다
            - 좋은 예는 매개변수를 아예 받지 않는다 — 고칠 것이 없다
            - 누구인지는 **서버가 발급한 것**에서만 꺼낸다
            - 관리자가 남의 주문을 봐야 한다면 그것은 **다른 경로**로 따로 만든다
        predict:
          question: 나쁜 예에 화면 쪽 검사(내 memberId만 보내기)를 추가하면 안전해지나?
          choices:
            - 안전해지지 않는다. 화면을 거치지 않고 부를 수 있다
            - 안전해진다. 화면이 잘못된 값을 못 보낸다
            - 절반만 안전해진다
            - 컴파일 오류가 난다
          answer: 안전해지지 않는다. 화면을 거치지 않고 부를 수 있다
          explanation: |-
            화면은 사용자의 컴퓨터에서 돈다. 사용자가 바꿀 수 있는 것은 통제가 될 수 없다.
            `curl -H "Authorization: ..." ".../orders?memberId=2"` 한 줄이면 그대로 뚫린다.
            **화면의 검사는 친절이고, 서버의 검사가 통제다.**
        complete:
          question: 요청이 준 식별자 대신 토큰에서 꺼내도록 빈칸을 채우세요.
          code: |-
            @PostMapping("/orders")
            OrderResponse place(@RequestBody OrderRequest request,
                                @___ Member member) {
                return orderService.place(request, member.___());
            }
          answers:
            - [AuthenticationPrincipal]
            - [id]
          explanation: |-
            `@AuthenticationPrincipal`은 인증 과정에서 서버가 확인한 사용자를 넣어 준다.
            요청 본문의 `request.memberId()`를 쓰면 누구든 남의 이름으로 주문할 수 있다.
        problem:
          prompt: |-
            아래 API 세 개에서 접근 통제가 뚫리는 자리를 찾아 고치세요.

            ```java
            @GetMapping("/orders/{id}")          Order find(@PathVariable long id) { ... }
            @PutMapping("/members/{id}/email")   void changeEmail(@PathVariable long id, @RequestBody String email) { ... }
            @GetMapping("/admin/orders")         List<Order> all() { ... }
            ```

            - 각 API가 어떻게 뚫리는지 **공격 요청 한 줄씩**으로 보이세요
            - 셋을 모두 고치세요. 세 번째는 앞의 둘과 고치는 방법이 다릅니다
            - 왜 다른지 한 줄로 적으세요
          deliverables:
            - API별 공격 요청 한 줄과 그때 일어나는 일
            - 고친 코드 세 가지
            - 세 번째를 다르게 고친 이유
          hints:
            - 경로에 들어 있는 숫자를 하나 바꿔 보는 것부터 시작하세요.
            - 앞의 둘은 "내 것인가"를 묻는 문제입니다.
            - 세 번째는 "내 것인가"가 아니라 다른 것을 묻는 문제입니다.
          modelAnswer: |-
            | API | 공격 요청 | 일어나는 일 |
            |---|---|---|
            | 주문 조회 | `GET /orders/2002` | 남의 주문이 그대로 보인다 |
            | 이메일 변경 | `PUT /members/2/email` | 남의 계정 이메일을 바꾼다 |
            | 전체 주문 | `GET /admin/orders` | 로그인만 하면 누구나 전체를 본다 |

            ```java
            @GetMapping("/orders/{id}")
            OrderResponse find(@PathVariable long id, @AuthenticationPrincipal Member member) {
                return orderRepository.findByIdAndMemberId(id, member.id())
                        .map(OrderResponse::from)
                        .orElseThrow(() -> new OrderNotFoundException(id));
            }

            @PutMapping("/members/me/email")            // 경로에서 식별자를 없앤다
            void changeEmail(@RequestBody ChangeEmailRequest request,
                             @AuthenticationPrincipal Member member) {
                memberService.changeEmail(member.id(), request.email());
            }

            @GetMapping("/admin/orders")
            @PreAuthorize("hasRole('ADMIN')")           // 소유가 아니라 역할을 묻는다
            List<OrderResponse> all() { ... }
            ```

            앞의 둘은 **소유 확인**(이 자원이 내 것인가)이고,
            세 번째는 **역할 확인**(이 일을 할 자격이 있는가)이다.
            전체 주문에는 소유자가 없으므로 소유로는 막을 수 없다.
          selfChecks:
            - 세 API 모두 공격 요청을 실제로 적어 보았는가
            - 경로에서 남의 식별자를 받을 수 있는 자리를 없앴는가
            - 소유 확인과 역할 확인을 구분해 적용했는가
            - 남의 자원 조회가 404로 나가는가
      - key: LESSON.SECURITY.OWASP_TOP10.001.U3
        title: 데이터와 명령을 섞지 않기 (주입)
        minutes: 12
        core: true
        explain: |-
          주입은 **사용자가 준 값이 데이터가 아니라 명령으로 읽힐 때** 난다.
          SQL이 대표지만 원리는 어디서나 같다 — 명령을 문자열로 **조립**하면 생긴다.

          ```java
          "SELECT * FROM orders WHERE code = '" + code + "'"
          ```

          `code`에 `' OR '1'='1` 이 들어오면 조건문이 통째로 바뀐다.
          값이 따옴표를 넘어 **문법에 끼어든** 것이다.

          막는 방법은 **값을 따로 보내는 것**이다. 자리표시자 `?`를 두고 값을 인자로 넘기면,
          DB는 그 자리를 **언제나 값으로만** 읽는다. 문법에 끼어들 길이 없다.
          JPA의 이름 붙인 매개변수도 같은 원리다.

          그런데 **자리표시자를 쓸 수 없는 곳**이 있다 — 정렬 컬럼, 테이블 이름처럼
          **구조에 해당하는 자리**다. 여기는 값이 아니므로 `?`로 못 넘긴다.
          그래서 **허용 목록**으로 거른다. 사용자가 준 문자열을 그대로 쓰지 않고,
          미리 정해 둔 것 중 하나로 **바꿔서** 쓴다.
        example:
          language: java
          code: |-
            // 나쁜 예 — 값이 문법에 끼어든다
            String sql = "SELECT * FROM orders WHERE code = '" + code + "'";

            // 좋은 예 1 — 값은 자리표시자로
            @Query("select o from Order o where o.code = :code")
            Optional<Order> findByCode(@Param("code") String code);

            // 좋은 예 2 — 구조는 허용 목록으로
            private static final Map<String, String> SORTABLE =
                    Map.of("createdAt", "created_at", "amount", "total_amount");

            String sortColumn(String requested) {
                String column = SORTABLE.get(requested);
                if (column == null) {
                    throw new IllegalArgumentException("정렬할 수 없는 기준이다: " + requested);
                }
                return column;
            }
          output: |-
            [나쁜 예] code = "' OR '1'='1"
            SELECT * FROM orders WHERE code = '' OR '1'='1'    → 전체가 조회된다

            [좋은 예 1] code = "' OR '1'='1"
            → 그런 코드의 주문이 없다. 0건

            [좋은 예 2]
            sortColumn("amount")       → "total_amount"
            sortColumn("1; DROP ...")  → IllegalArgumentException
          note: |-
            - 자리표시자는 **값과 문법을 아예 다른 길로** 보낸다. 이스케이프보다 확실하다
            - 정렬 컬럼은 값이 아니라 구조라 자리표시자를 못 쓴다
            - 허용 목록은 거르는 것이 아니라 **바꾸는** 것이다 — 사용자 문자열이 질의에 닿지 않는다
            - 막을 것을 고르는 방식(금지 목록)은 빠뜨린 하나에서 뚫린다
        predict:
          question: 나쁜 예에서 `code`의 작은따옴표만 제거하는 방식으로 막으면 어떻게 되나?
          choices:
            - 빠뜨린 다른 문법 요소로 뚫릴 수 있다. 막을 것을 고르는 방식은 안전하지 않다
            - 완전히 안전해진다
            - 성능이 나빠질 뿐 안전성은 같다
            - 컴파일 오류가 난다
          answer: 빠뜨린 다른 문법 요소로 뚫릴 수 있다. 막을 것을 고르는 방식은 안전하지 않다
          explanation: |-
            주석 기호, 유니코드 변형, 숫자 자리처럼 따옴표가 필요 없는 길이 남는다.
            **위험한 것을 하나씩 지우는 방식은 언제나 빠뜨린 하나가 있다.**
            값과 문법을 아예 갈라 두는 쪽이 셈이 끝난 방법이다.
        complete:
          question: 값과 구조를 각각 알맞은 방법으로 다루도록 빈칸을 채우세요.
          code: |-
            @Query("select o from Order o where o.memberId = ___memberId")
            List<Order> findByMember(@Param("memberId") long memberId);

            String column = SORTABLE.___(requested);
            if (column == null) {
                throw new IllegalArgumentException("정렬할 수 없는 기준이다: " + requested);
            }
          answers:
            - [":"]
            - [get]
          explanation: |-
            값은 이름 붙인 매개변수 `:memberId` 로 넘겨 문법과 갈라 두고,
            구조에 해당하는 정렬 컬럼은 허용 목록에서 **꺼내 바꿔** 쓴다.
            두 자리는 막는 방법이 다르다.
        problem:
          prompt: |-
            주문 목록 검색 API를 안전하게 만드세요.

            - 검색어(`keyword`), 정렬 기준(`sort`), 정렬 방향(`direction`), 페이지 크기(`size`)를 받는다
            - 네 가지 중 **자리표시자로 넘길 것**과 **허용 목록으로 바꿀 것**을 가르세요
            - 네 가지 모두 안전하게 다룬 코드를 쓰세요
            - 각 입력에 대해 공격 시도 예시를 하나씩 적고, 왜 막히는지 설명하세요
          deliverables:
            - 네 입력을 자리표시자와 허용 목록으로 가른 표
            - 검색 메서드의 코드
            - 입력별 공격 시도와 막히는 이유
          hints:
            - 질의에서 값이 들어가는 자리와 구조가 들어가는 자리를 먼저 구분하세요.
            - 정렬 방향은 값이 두 개뿐입니다. 문자열을 그대로 쓸 필요가 있을까요?
            - 페이지 크기는 숫자지만 그대로 믿으면 안 됩니다. 아주 큰 값이 오면 어떻게 될까요?
          modelAnswer: |-
            | 입력 | 방법 | 이유 |
            |---|---|---|
            | `keyword` | 자리표시자 | 값이다 |
            | `sort` | 허용 목록 | 컬럼 이름은 구조다 |
            | `direction` | 허용 목록(enum) | 값이 둘뿐이다 |
            | `size` | 범위 제한 | 값이지만 자원 고갈을 막아야 한다 |

            ```java
            private static final Map<String, String> SORTABLE =
                    Map.of("createdAt", "created_at", "amount", "total_amount");
            private static final int MAX_SIZE = 100;

            public List<Order> search(String keyword, String sort, String direction, int size) {
                String column = SORTABLE.get(sort);
                if (column == null) {
                    throw new IllegalArgumentException("정렬할 수 없는 기준이다: " + sort);
                }
                Sort.Direction way = Sort.Direction.fromString(direction);   // 값이 둘뿐이라 여기서 막힌다
                int limited = Math.clamp(size, 1, MAX_SIZE);
                return repository.search(keyword, PageRequest.of(0, limited, way, column));
            }
            ```

            | 입력 | 공격 시도 | 막히는 이유 |
            |---|---|---|
            | `keyword` | `' OR '1'='1` | 자리표시자라 값으로만 읽힌다 |
            | `sort` | `1; DROP TABLE orders` | 허용 목록에 없어 예외 |
            | `direction` | `ASC; DELETE ...` | 허용된 두 값이 아니라 예외 |
            | `size` | `999999999` | 상한으로 잘려 100이 된다 |
          selfChecks:
            - 값과 구조를 가르고 각각 다른 방법을 썼는가
            - 정렬 컬럼에 사용자 문자열이 그대로 닿지 않는가
            - 페이지 크기에 상한을 두었는가
            - 네 입력 모두 공격 시도를 실제로 적어 보았는가
    commonMistakes:
      - 화면에서 버튼을 감춘 것을 통제로 여긴다. 주소창이나 curl로 그대로 부를 수 있다 (U2)
      - 남의 자원에 403, 없는 자원에 404를 준다. 어느 번호가 실재하는지 새어 나간다 (U1)
      - 위험한 문자를 지우는 방식으로 주입을 막는다. 빠뜨린 하나에서 뚫린다 (U3)
    inProject: |-
      주문 시스템의 모든 조회·변경 API가 이 노트의 대상이다.
      자원을 다루는 자리에서는 소유자를 조회 조건에 함께 넣고, 남의 것은 없는 것처럼 404로 돌려준다.
      검색과 목록은 값을 자리표시자로 넘기고 정렬 기준은 허용 목록으로 바꿔 쓴다.
      기능을 하나 내보낼 때마다 이 세 항목만 훑으면 1단계에서 날 사고의 대부분을 막는다.
