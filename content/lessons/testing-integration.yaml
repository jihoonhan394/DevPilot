# DevPilot 개념 노트 — 진짜 DB로 시험하기와 골든 회귀
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 기준 버전: PostgreSQL 16 / Spring Boot 4.1 / JUnit 6 (AGENTS.md §0)
# - 3단계(테스트)에서 쓴다. TESTING.UNIT_TEST_DESIGN 노트를 먼저 본 것으로 전제한다
lessons:
  - key: LESSON.TESTING.TESTCONTAINERS.001
    skillCode: TESTING.TESTCONTAINERS
    title: 가짜로는 못 잡는 것 (실제 DB로 시험하기)
    whyItMatters: |-
      메모리 DB로 테스트하면 빠르지만, **진짜 DB만 아는 것**이 통째로 빠진다.
      제약 조건, 방언이 다른 SQL, 마이그레이션 순서, 잠금 동작 —
      전부 운영에서 처음 드러난다.
      운영과 같은 PostgreSQL을 컨테이너로 띄워 돌리면 그 사각지대가 사라진다.
    oneLine: Testcontainers는 테스트가 시작할 때 진짜 DB 컨테이너를 띄워, 가짜와 진짜의 차이만큼 생기던 사각지대를 없앤다.
    units:
      - key: LESSON.TESTING.TESTCONTAINERS.001.U1
        title: 메모리 DB가 놓치는 것
        minutes: 12
        core: true
        explain: |-
          테스트를 빨리 돌리려고 메모리 DB를 쓰는 경우가 많다. 그런데 **다른 DB다.**

          | 진짜 PostgreSQL만 아는 것 | 메모리 DB에서는 |
          |---|---|
          | `BIGSERIAL`, `TIMESTAMPTZ` 같은 타입 | 없거나 다르게 동작 |
          | 부분 인덱스, `ON CONFLICT` | 지원 안 하거나 문법이 다름 |
          | 실행 계획, 인덱스를 타는지 | 아예 다른 계획 |
          | `SELECT ... FOR UPDATE` 잠금 | 흉내만 내거나 없음 |
          | Flyway 마이그레이션이 실제로 도는지 | DDL 방언이 달라 못 도는 경우 |

          그래서 **초록인데 운영에서 터진다.** 그 차이만큼이 사각지대다.

          Testcontainers는 테스트가 시작할 때 **운영과 같은 이미지**로 컨테이너를 띄운다.
          빈 DB에서 시작하므로 마이그레이션이 처음부터 전부 돌고,
          그 뒤 엔티티와 표가 맞는지(`ddl-auto: validate`)까지 확인된다.

          대가는 시간이다. 컨테이너 기동에 몇 초가 든다.
          그래서 **단위 테스트는 가짜로, 통합 테스트만 컨테이너로** 나눠 돌린다.
        example:
          language: java
          code: |-
            @SpringBootTest
            @Testcontainers
            class OrderRepositoryIntegrationTest {

                @Container
                @ServiceConnection                       // 접속 정보를 스프링에 넘긴다
                static PostgreSQLContainer<?> postgres =
                        new PostgreSQLContainer<>("postgres:16");

                @Autowired OrderRepository orders;

                @Test
                void shouldRejectDuplicateOrderNumber() {
                    orders.save(Order.of("ORD-1001", MEMBER_ID));

                    assertThatThrownBy(() -> orders.save(Order.of("ORD-1001", MEMBER_ID)))
                            .isInstanceOf(DataIntegrityViolationException.class);
                }
            }
          output: |-
            Creating container for image: postgres:16
            Container postgres:16 started in PT3.412S
            Flyway: Successfully applied 14 migrations
            Started ... in 6.204 seconds

            shouldRejectDuplicateOrderNumber  초록
            (메모리 DB에서는 UNIQUE 제약이 없어 두 번째 save가 그냥 성공했다)
          note: |-
            - 이미지 태그가 `postgres:16`이다 — **운영과 같은 메이저 버전**이어야 의미가 있다
            - `@ServiceConnection` 하나로 접속 정보가 스프링에 전달된다
            - 마이그레이션 14개가 빈 DB에서 전부 돌았다. 이것 자체가 검증이다
            - 기동에 6초가 들었다. 이 값이 통합 테스트를 따로 돌리는 이유다
        predict:
          question: 이미지를 `postgres:16`에서 `postgres:17`로 바꾸면?
          choices:
            - 운영과 달라져서 여기서 통과해도 운영 동작을 보장하지 못한다
            - 더 최신이라 더 좋다
            - 아무 차이 없다
            - 컨테이너가 안 뜬다
          answer: 운영과 달라져서 여기서 통과해도 운영 동작을 보장하지 못한다
          explanation: |-
            테스트용 DB는 **운영과 같은 메이저 버전**이어야 한다.
            메이저가 다르면 기본값·문법·계획이 달라질 수 있고,
            그 차이가 다시 사각지대가 된다.
            이 저장소도 운영이 PostgreSQL 16이라 테스트 이미지도 16으로 고정한다.
        complete:
          question: 운영과 같은 DB를 띄우는 테스트를 완성하세요.
          code: |-
            @SpringBootTest
            @___
            class OrderRepositoryIntegrationTest {

                @Container
                @ServiceConnection
                static PostgreSQLContainer<?> postgres =
                        new PostgreSQLContainer<>("postgres:___");
            }
          answers:
            - [Testcontainers]
            - ["16"]
          explanation: |-
            `@Testcontainers`가 컨테이너 생명주기를 맡고,
            이미지 태그는 **운영과 같은 메이저 버전**으로 고정한다.
            `static`으로 두면 그 클래스의 모든 테스트가 한 컨테이너를 함께 쓴다.
        problem:
          prompt: |-
            주문 시스템에 통합 테스트를 붙이세요. **메모리 DB로는 못 잡는 것**을 노립니다.

            - 진짜 DB로만 잡히는 케이스를 **세 가지** 고르세요
              (제약 조건 / 마이그레이션 / 잠금이나 방언 중에서)
            - 그중 하나를 골라 테스트로 쓰세요
            - 이 테스트를 단위 테스트와 **따로 돌리는 방법**을 적으세요
              (전부 같이 돌리면 왜 곤란한지도)
            - 컨테이너를 `static`으로 둘 때와 테스트마다 새로 띄울 때의 차이를 적으세요
          deliverables:
            - 진짜 DB로만 잡히는 케이스 세 가지
            - 그중 하나의 테스트 코드
            - 따로 돌리는 방법과 이유
            - static 컨테이너의 장단점
          hints:
            - 유니크 제약, 외래 키, NOT NULL은 메모리 DB에서 흉내만 내는 경우가 많습니다.
            - 마이그레이션이 빈 DB에서 처음부터 도는지가 그 자체로 검증입니다.
            - 태그나 별도 소스 세트로 나눌 수 있습니다.
          modelAnswer: |-
            진짜 DB로만 잡히는 것 —
            **① 유니크 제약 위반** (주문 번호 중복)
            **② 마이그레이션 전체 적용 + 엔티티와 표 일치** (`ddl-auto: validate`)
            **③ `SELECT ... FOR UPDATE` 잠금이 실제로 기다리는지**

            ```java
            @Test
            void shouldApplyAllMigrationsAndMatchEntities() {
                // 기동 성공 자체가 단언이다 —
                // 빈 postgres:16 에 V1부터 전부 적용되고 validate 까지 통과했다는 뜻
                assertThat(jdbc.queryForObject(
                        "select count(*) from flyway_schema_history where success = true",
                        Integer.class)).isEqualTo(14);
            }
            ```

            따로 돌리는 방법 — **태그로 나눈다.**
            ```java
            @Tag("integration")
            ```
            ```kotlin
            tasks.test { useJUnitPlatform { excludeTags("integration") } }
            tasks.register<Test>("integrationTest") {
                useJUnitPlatform { includeTags("integration") }
            }
            ```
            전부 같이 돌리면 **단위 테스트를 한 번 돌리는 데도 Docker가 필요**해지고
            수십 초가 걸려, 고치면서 자주 돌리는 습관이 사라진다.

            `static` 컨테이너는 **클래스의 모든 테스트가 한 컨테이너를 공유**해 빠르지만,
            테스트끼리 데이터가 남는다. 그래서 각 테스트가 스스로 정리하거나
            `@Transactional`로 롤백되게 해야 한다.
            테스트마다 새로 띄우면 깨끗하지만 몇 초씩 곱해져 쓸 수 없게 된다.
          selfChecks:
            - 메모리 DB로는 못 잡는 것을 골랐는가
            - 운영과 같은 메이저 버전을 썼는가
            - 단위 테스트와 분리해 돌릴 수 있게 했는가
            - 공유 컨테이너에서 데이터가 남는 문제를 다뤘는가
      - key: LESSON.TESTING.TESTCONTAINERS.001.U2
        title: 테스트끼리 서로 방해하지 않게
        minutes: 12
        core: true
        explain: |-
          컨테이너를 공유하면 **앞 테스트가 남긴 데이터**가 뒤에 영향을 준다.
          그러면 혼자 돌리면 초록인데 전체를 돌리면 빨강이 되고,
          **실행 순서를 바꾸면 결과가 바뀐다.** 가장 다루기 어려운 종류의 실패다.

          막는 방법이 셋이고, 위에서부터 권한다.

          | 방법 | 어떻게 | 주의 |
          |---|---|---|
          | **롤백** | `@Transactional`을 테스트에 붙인다 | 커밋 뒤 동작은 시험 못 한다 |
          | **정리** | 각 테스트 뒤 대상 표를 비운다 | 지우는 순서(외래 키)를 지켜야 한다 |
          | **격리** | 테스트마다 다른 값을 쓴다 | 남는 데이터는 그대로다 |

          `@Transactional`이 가장 간단하다. 스프링 테스트에서는 **기본이 롤백**이라
          테스트가 끝나면 없던 일이 된다.

          다만 **커밋 뒤 이벤트**(`AFTER_COMMIT`)를 시험하려면 롤백을 쓸 수 없다.
          커밋이 안 되니 리스너가 아예 안 불린다.
          그때는 롤백을 끄고 직접 정리한다.
        example:
          language: java
          code: |-
            @SpringBootTest
            @Testcontainers
            @Transactional                        // 기본이 롤백이다
            class OrderServiceIntegrationTest {

                @Test
                void shouldPlaceOrder() {
                    service.place(request("KB-01", 2), MEMBER_ID);
                    assertThat(orders.count()).isEqualTo(1);
                }

                @Test
                void shouldPlaceAnotherOrder() {
                    service.place(request("MS-02", 1), MEMBER_ID);
                    assertThat(orders.count()).isEqualTo(1);   // 앞 테스트가 안 남았다
                }
            }

            @SpringBootTest
            @Testcontainers                        // @Transactional 없음
            class OrderEventIntegrationTest {

                @AfterEach
                void clean() {
                    jdbc.execute("truncate table order_lines, orders cascade");
                }

                @Test
                void shouldSendNotificationAfterCommit() { ... }
            }
          output: |-
            [@Transactional 있음]
            두 테스트 모두 count = 1  — 순서를 바꿔도 같다

            [@Transactional 없음, 정리도 없음]
            먼저 돈 쪽 count = 1
            나중에 돈 쪽 count = 2   ← 앞의 데이터가 남았다
          note: |-
            - 두 테스트가 각각 `count = 1`을 기대한다 — **서로 모르는 상태**여야 한다
            - 롤백이 그것을 공짜로 해 준다. 데이터가 커밋되지 않는다
            - 아래 클래스는 커밋이 필요해서 롤백을 못 쓰고 **직접 비운다**
            - `truncate ... cascade`로 외래 키 순서를 신경 쓰지 않게 했다
        predict:
          question: '`@Transactional`을 붙인 테스트에서 `AFTER_COMMIT` 리스너를 시험하면?'
          choices:
            - 커밋이 안 되므로 리스너가 아예 불리지 않는다
            - 정상적으로 불린다
            - 롤백 직전에 불린다
            - 예외가 난다
          answer: 커밋이 안 되므로 리스너가 아예 불리지 않는다
          explanation: |-
            `AFTER_COMMIT`은 이름 그대로 **커밋된 뒤에만** 실행된다.
            테스트가 롤백으로 끝나면 그 시점이 오지 않는다.
            그래서 커밋 뒤 동작을 시험할 때는 롤백을 끄고 직접 정리해야 한다 —
            편한 방법 하나로 전부 덮으려 하면 여기서 막힌다.
        complete:
          question: 테스트가 서로 영향을 주지 않게 만드세요.
          code: |-
            @SpringBootTest
            @Testcontainers
            @___                      // 끝나면 되돌린다
            class OrderServiceIntegrationTest { ... }

            // 커밋이 필요한 테스트는 대신 직접 비운다
            @AfterEach
            void clean() {
                jdbc.execute("___ table order_lines, orders cascade");
            }
          answers:
            - [Transactional]
            - [truncate]
          explanation: |-
            스프링 테스트의 `@Transactional`은 **기본이 롤백**이다.
            커밋이 필요하면 그것을 못 쓰므로 `truncate ... cascade`로 직접 비운다.
        problem:
          prompt: |-
            통합 테스트 세 개가 **혼자 돌리면 초록, 같이 돌리면 빨강**이다.

            ```java
            @Test void shouldCountOrders()      { assertThat(orders.count()).isEqualTo(1); }
            @Test void shouldFindByOrderNumber(){ /* ORD-1001 로 저장하고 조회 */ }
            @Test void shouldSendMailAfterCommit() { /* 커밋 뒤 이벤트 확인 */ }
            ```

            - 셋이 서로 방해하는 방식을 각각 적으세요
            - 셋에 각각 **어떤 격리 방법**을 쓸지 정하고 이유를 적으세요
              (셋이 같은 방법일 필요는 없습니다)
            - `shouldCountOrders` 같은 **전체 개수 단언**의 문제를 지적하고 더 나은 단언을 쓰세요
            - 순서를 바꿔도 통과하는지 확인하는 방법을 적으세요
          deliverables:
            - 셋이 서로 방해하는 방식
            - 각각의 격리 방법과 이유
            - 개수 단언의 문제와 더 나은 단언
            - 순서를 바꿔 확인하는 방법
          hints:
            - 전체 개수를 세는 단언은 다른 테스트가 넣은 데이터에 직접 걸립니다.
            - 유니크한 값을 쓰는 테스트는 앞에서 같은 값을 넣었으면 깨집니다.
            - 커밋이 필요한 테스트는 롤백을 못 씁니다.
          modelAnswer: |-
            | 테스트 | 방해 방식 | 격리 방법 |
            |---|---|---|
            | `shouldCountOrders` | 다른 테스트가 넣은 주문까지 센다 | `@Transactional` 롤백 |
            | `shouldFindByOrderNumber` | 앞에서 `ORD-1001`을 넣었으면 유니크 위반 | 롤백 + 테스트마다 다른 번호 |
            | `shouldSendMailAfterCommit` | 커밋하므로 뒤 테스트에 데이터를 남긴다 | 롤백 불가 → `@AfterEach` 정리 |

            **개수 단언이 가장 나쁘다.** `count() == 1`은 이 테스트가 만든 것이
            하나라는 뜻이 아니라 **표 전체가 하나**라는 뜻이라, 다른 테스트에 직접 걸린다.

            ```java
            // 나쁨: 표 전체에 의존한다
            assertThat(orders.count()).isEqualTo(1);

            // 좋음: 이 테스트가 만든 것만 본다
            OrderResponse placed = service.place(request("KB-01", 2), MEMBER_ID);
            assertThat(orders.findById(placed.orderId())).isPresent();
            assertThat(orders.findAllByMemberId(MEMBER_ID)).hasSize(1);
            ```
            회원 ID도 테스트마다 다르게 만들면 마지막 줄까지 안전해진다.

            순서를 바꿔 확인하는 방법 — JUnit의 **무작위 순서**를 켠다.
            ```text
            junit.jupiter.testmethod.order.default = \
                org.junit.jupiter.api.MethodOrderer$Random
            ```
            켜고 몇 번 돌려서 계속 초록이면 서로 독립이다.
            한 번이라도 빨강이면 숨은 의존이 있는 것이다.
          selfChecks:
            - 셋이 방해하는 방식을 각각 적었는가
            - 커밋이 필요한 테스트에 롤백을 쓰지 않았는가
            - 전체 개수 단언을 자기 데이터 단언으로 바꿨는가
            - 순서를 바꿔 실제로 돌려 봤는가
      - key: LESSON.TESTING.TESTCONTAINERS.001.U3
        title: 느린 테스트를 견딜 만하게
        minutes: 10
        core: false
        explain: |-
          통합 테스트가 느리면 **안 돌리게 된다.** 그러면 없는 것과 같다.
          빠르게 만드는 방법이 몇 가지 있다.

          | 방법 | 효과 |
          |---|---|
          | 컨테이너를 **모든 테스트 클래스가 공유** | 기동을 한 번만 한다 |
          | 스프링 컨텍스트를 **재사용** | 설정이 같으면 다시 안 만든다 |
          | 통합 테스트를 **따로 돌린다** | 평소에는 단위 테스트만 |
          | 꼭 필요한 것만 통합으로 | 대부분은 단위로 충분하다 |

          가장 큰 것이 **컨텍스트 재사용**이다. 스프링은 설정이 같은 테스트끼리
          컨텍스트를 공유하는데, 클래스마다 `@MockitoBean`으로 다른 빈을 바꾸면
          **설정이 달라져 매번 새로 만든다.** 그래서 통합 테스트에서는
          가짜를 최소한으로 두는 편이 결과적으로 빠르다.

          그리고 **무엇을 통합으로 시험할지** 고르는 것이 가장 효과가 크다.
          계산 규칙은 단위로 충분하고, 통합으로만 잡히는 것은
          제약 조건·마이그레이션·실제 질의다.
        example:
          language: java
          code: |-
            // 모든 통합 테스트가 한 컨테이너를 쓴다
            abstract class IntegrationTestBase {

                @Container
                @ServiceConnection
                static final PostgreSQLContainer<?> POSTGRES =
                        new PostgreSQLContainer<>("postgres:16");

                static { POSTGRES.start(); }     // JVM 당 한 번
            }

            @SpringBootTest
            @Transactional
            class OrderRepositoryIntegrationTest extends IntegrationTestBase { ... }

            @SpringBootTest
            @Transactional
            class CouponRepositoryIntegrationTest extends IntegrationTestBase { ... }
          output: |-
            [클래스마다 컨테이너]
            OrderRepositoryIntegrationTest   기동 3.4s + 테스트 0.9s
            CouponRepositoryIntegrationTest  기동 3.3s + 테스트 0.7s
            합계 8.3s

            [공유]
            컨테이너 기동 3.4s (한 번)
            두 클래스 테스트 1.6s
            합계 5.0s
          note: |-
            - 컨테이너가 `static final`이고 부모 클래스에 있다 — **JVM 당 하나**다
            - 클래스가 늘수록 차이가 커진다. 10개면 30초 대 5초다
            - 두 클래스의 `@SpringBootTest` 설정이 같아 **컨텍스트도 공유**된다
            - 공유하므로 데이터 격리(`@Transactional`)가 더 중요해진다
        predict:
          question: 통합 테스트 클래스마다 다른 빈을 `@MockitoBean`으로 바꾸면?
          choices:
            - 설정이 달라져 스프링 컨텍스트를 매번 새로 만든다
            - 더 빨라진다
            - 컨테이너가 여러 개 뜬다
            - 아무 차이 없다
          answer: 설정이 달라져 스프링 컨텍스트를 매번 새로 만든다
          explanation: |-
            컨텍스트 재사용은 **설정이 같을 때만** 일어난다.
            가짜 빈을 클래스마다 다르게 두면 매번 새 컨텍스트를 띄워,
            컨테이너를 공유해도 전체 시간이 크게 늘어난다.
            통합 테스트에서 가짜를 줄이는 것이 속도에도 도움이 되는 이유다.
        complete:
          question: 컨테이너를 모든 통합 테스트가 공유하게 만드세요.
          code: |-
            abstract class IntegrationTestBase {
                @Container
                @ServiceConnection
                ___ final PostgreSQLContainer<?> POSTGRES =
                        new PostgreSQLContainer<>("postgres:16");
            }

            @SpringBootTest
            class OrderRepositoryIntegrationTest ___ IntegrationTestBase { }
          answers:
            - [static]
            - [extends]
          explanation: |-
            `static`으로 두면 클래스마다가 아니라 **JVM 당 하나**가 된다.
            공통 부모를 상속하면 설정도 같아져 스프링 컨텍스트까지 재사용된다.
        problem:
          prompt: |-
            통합 테스트가 12개인데 전체 실행에 4분이 걸린다. 줄이세요.

            - 느려지는 원인을 **세 가지** 추정하고, 각각 **확인하는 방법**을 적으세요
            - 12개 중 **단위 테스트로 내려도 되는 것**을 고르는 기준을 정하세요
            - 컨테이너와 컨텍스트를 공유하도록 구조를 바꾸세요
            - 바꾼 뒤 **실제로 줄었는지 재는 방법**을 적으세요 (추측하지 않습니다)
          deliverables:
            - 느린 원인 세 가지와 확인 방법
            - 단위로 내릴 것을 고르는 기준
            - 공유 구조 코드
            - 전후를 재는 방법
          hints:
            - 로그에 컨테이너 기동과 컨텍스트 생성이 몇 번 찍히는지 세어 보세요.
            - 그 테스트가 DB 없이도 같은 것을 잡을 수 있는지 물어보세요.
            - Gradle이 테스트별 소요 시간을 리포트로 남깁니다.
          modelAnswer: |-
            | 원인 추정 | 확인 방법 |
            |---|---|
            | 컨테이너가 클래스마다 뜬다 | 로그에서 `Creating container` 횟수를 센다 |
            | 컨텍스트가 매번 새로 생긴다 | 로그에서 `Started ... in` 횟수를 센다 |
            | DB가 필요 없는 테스트가 통합에 있다 | 각 테스트가 실제로 DB를 쓰는지 본다 |

            단위로 내릴 기준 — **DB 없이 같은 것을 잡을 수 있으면 단위로 내린다.**
            계산 규칙, 상태 전이, 검증 로직이 여기 해당한다.
            남길 것은 제약 조건·마이그레이션·실제 질의·잠금뿐이다.

            ```java
            abstract class IntegrationTestBase {
                @Container @ServiceConnection
                static final PostgreSQLContainer<?> POSTGRES =
                        new PostgreSQLContainer<>("postgres:16");
            }

            @SpringBootTest
            @Transactional
            class OrderRepositoryIntegrationTest extends IntegrationTestBase { }
            ```
            모든 통합 테스트가 이 부모를 상속하고 **`@MockitoBean`을 쓰지 않으면**
            컨텍스트가 하나로 유지된다.

            재는 방법 — `build/reports/tests/integrationTest/index.html`에
            테스트별 소요 시간이 있다. 바꾸기 전후를 **같은 리포트로 비교**하고,
            로그의 `Creating container` 횟수가 1로 줄었는지 확인한다.
            "빨라진 것 같다"가 아니라 숫자로 남긴다.
          selfChecks:
            - 원인마다 확인 방법을 적었는가
            - 단위로 내릴 기준이 "DB 없이 되는가"인가
            - 컨테이너와 컨텍스트를 둘 다 공유하게 했는가
            - 전후를 같은 지표로 쟀는가
    commonMistakes:
      - 메모리 DB로 통합 테스트를 대신한다. 제약·방언·마이그레이션이 통째로 빠진다 (U1)
      - 전체 개수를 단언한다. 다른 테스트가 넣은 데이터에 직접 걸린다 (U2)
      - 클래스마다 가짜 빈을 다르게 둔다. 컨텍스트를 매번 새로 만들어 전체가 느려진다 (U3)
    inProject: |-
      주문 시스템에서 통합 테스트로 남길 것은 넷이다 —
      마이그레이션 전체 적용, 유니크·외래 키 제약, 실제 질의의 결과, 잠금 동작.
      그 밖의 계산과 상태 전이는 단위로 내린다.
      컨테이너는 `postgres:16`으로 고정하고 공통 부모에서 공유하며,
      태그로 단위 테스트와 분리해 평소에는 단위만 돌린다.
    sources:
      - title: Spring Boot — Testcontainers Support
        url: https://docs.spring.io/spring-boot/reference/testing/testcontainers.html
        versionScope: Spring Boot 3.x+
      - title: Spring Framework — Testing (Context Caching)
        url: https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/ctx-management/caching.html
        versionScope: Spring Framework 6.x+
      - title: PostgreSQL 16 — Constraints
        url: https://www.postgresql.org/docs/16/ddl-constraints.html
        versionScope: PostgreSQL 16
    verifiedAt: 2026-09-25

  - key: LESSON.TESTING.GOLDEN_REGRESSION.001
    skillCode: TESTING.GOLDEN_REGRESSION
    title: 확인해 둔 결과를 기준으로 두기 (골든 회귀)
    whyItMatters: |-
      정산 결과나 응답 JSON처럼 **필드가 수십 개인 출력**은 단언을 하나씩 쓰기 어렵다.
      그렇다고 안 쓰면 리팩터링할 때 어디가 달라졌는지 알 수 없다.
      한 번 눈으로 확인한 결과를 파일로 두고 **달라지면 실패**하게 하면,
      의도하지 않은 변화가 전부 걸린다.
    oneLine: 골든 회귀는 확인해 둔 출력을 파일로 두고 지금 출력과 비교해, 달라진 것을 전부 보여 주는 테스트다.
    units:
      - key: LESSON.TESTING.GOLDEN_REGRESSION.001.U1
        title: 단언을 하나씩 쓸 수 없을 때
        minutes: 12
        core: true
        explain: |-
          출력이 크면 단언을 손으로 쓰는 것이 현실적이지 않다.

          ```java
          assertThat(response.orderId()).isEqualTo(1001L);
          assertThat(response.status()).isEqualTo("PLACED");
          // ... 40줄 더
          ```

          쓰다 지치고, 필드가 하나 늘면 아무도 안 고친다.

          **골든 파일**은 확인해 둔 출력 전체를 파일로 저장해 두고
          지금 출력과 통째로 비교하는 방식이다.

          ```text
          src/test/resources/golden/order-response.json   ← 한 번 눈으로 확인한 결과
          ```

          맞는 자리는 정해져 있다.

          | 잘 맞는다 | 안 맞는다 |
          |---|---|
          | 응답 JSON 전체 모양 | 값 하나의 규칙 |
          | 정산·집계 결과표 | 예외가 나는지 |
          | 생성한 문서·리포트 | 성능 |

          핵심 규칙이 하나 있다 — **골든 파일은 사람이 한 번 읽고 승인한 것**이어야 한다.
          출력을 그대로 받아 적기만 하면 **틀린 결과를 기준으로 고정**하게 된다.
        example:
          language: java
          code: |-
            @Test
            void shouldMatchGoldenOrderResponse() throws Exception {
                OrderResponse response = service.place(fixedRequest(), MEMBER_ID);

                String actual = objectMapper.writerWithDefaultPrettyPrinter()
                        .writeValueAsString(response);
                String golden = Files.readString(
                        Path.of("src/test/resources/golden/order-response.json"));

                assertThat(actual).isEqualToIgnoringWhitespace(golden);
            }
          output: |-
            totalAmount 계산을 바꿨을 때

            expected: ..."totalAmount" : 78000...
             but was: ..."totalAmount" : 70200...

            (한 줄 차이가 그대로 보인다. 필드가 40개여도 다른 곳만 나온다)
          note: |-
            - 단언이 **한 줄**이다. 필드가 늘어도 테스트를 안 고쳐도 된다
            - 실패 메시지가 **어느 필드가 어떻게 달라졌는지**를 그대로 보여 준다
            - 보기 좋게 출력해 저장하면 diff가 읽힌다. 한 줄 JSON은 읽을 수 없다
            - 입력이 고정(`fixedRequest()`)이어야 출력도 고정된다
        predict:
          question: 계산이 틀린 상태에서 골든 파일을 처음 만들면?
          choices:
            - 틀린 결과가 기준이 되어 앞으로 그 버그를 영영 못 잡는다
            - 테스트가 실패한다
            - 자동으로 고쳐진다
            - 경고가 뜬다
          answer: 틀린 결과가 기준이 되어 앞으로 그 버그를 영영 못 잡는다
          explanation: |-
            골든 파일은 **사람이 확인한 것**이라는 전제 위에서만 쓸모가 있다.
            출력을 그대로 받아 적으면 "지금 나오는 대로"가 정답이 되고,
            나중에 누가 제대로 고치면 오히려 빨강이 난다.
            그래서 **처음 만들 때와 갱신할 때 반드시 사람이 읽는다.**
        complete:
          question: 골든 파일과 비교하는 테스트를 완성하세요.
          code: |-
            String actual = objectMapper.writerWithDefaultPrettyPrinter()
                    .writeValueAsString(response);
            String golden = Files.___(
                    Path.of("src/test/resources/golden/order-response.json"));

            assertThat(actual).___(golden);
          answers:
            - [readString]
            - [isEqualToIgnoringWhitespace, isEqualTo]
          explanation: |-
            파일을 읽어 통째로 비교한다.
            줄바꿈이나 들여쓰기 차이로 깨지지 않게 공백을 무시하는 비교를 쓰면 안정적이다.
        problem:
          prompt: |-
            월 정산 결과를 골든 회귀로 시험하세요. 결과는 고객사별 합계 표 30줄쯤입니다.

            - 골든 파일에 담을 **형식**을 정하세요 (JSON / CSV / 텍스트 표 중 하나와 이유)
            - 입력을 **고정하는 방법**을 적으세요. 무엇이 고정되어야 출력이 같아지나요?
            - 골든 파일을 **처음 만드는 절차**를 적으세요. 사람이 확인하는 단계를 넣으세요
            - 이 테스트가 **잡지 못하는 것** 하나를 적으세요
          deliverables:
            - 골든 파일 형식과 이유
            - 입력을 고정하는 방법
            - 처음 만드는 절차 (확인 단계 포함)
            - 잡지 못하는 것 하나
          hints:
            - diff가 읽히는 형식이 좋습니다. 한 줄에 한 항목이면 차이가 한 줄로 보입니다.
            - 시간·난수·정렬 순서가 고정되지 않으면 출력이 매번 달라집니다.
            - 골든이 맞는지는 테스트가 판단해 주지 않습니다.
          modelAnswer: |-
            **형식은 CSV나 한 줄 한 항목 텍스트**가 낫다.
            고객사 30곳이면 JSON 중첩보다 **한 줄에 한 고객사**가 diff를 읽기 쉽다.
            ```text
            customerCode,orderCount,totalAmount,feeAmount
            ACME,120,4820000,241000
            BETA,88,3110000,155500
            ```

            입력을 고정하려면 **① 대상 기간을 고정 날짜로**(`2026-09-01`~`2026-09-30`),
            **② `Clock`을 고정**, **③ 시드 데이터를 파일로 고정**,
            **④ 정렬을 명시**(`ORDER BY customer_code`)해야 한다.
            정렬을 안 정하면 DB가 순서를 바꿀 수 있어 매번 diff가 난다.

            처음 만드는 절차 —
            **① 테스트를 골든 없이 돌려 출력을 파일로 뽑는다
            ② 고객사 3곳을 골라 손으로 계산해 맞는지 확인한다
            ③ 합계가 전체 주문 금액과 맞는지 따로 확인한다
            ④ 확인한 뒤에야 `golden/settlement-2026-09.csv`로 커밋하고,
            커밋 본문에 무엇을 어떻게 확인했는지 적는다.**

            잡지 못하는 것 — **입력에 없는 상황.**
            고정 시드에 환불 건이 없으면 환불 계산이 틀려도 골든은 그대로 초록이다.
            그래서 골든 회귀는 **경계값 단위 테스트를 대신하지 못한다.**
            둘은 다른 것을 잡는다.
          selfChecks:
            - diff가 읽히는 형식을 골랐는가
            - 시간·정렬까지 고정했는가
            - 사람이 확인하는 단계를 절차에 넣었는가
            - 골든이 못 잡는 것을 알고 있는가
      - key: LESSON.TESTING.GOLDEN_REGRESSION.001.U2
        title: 골든을 갱신할 때가 위험하다
        minutes: 12
        core: true
        explain: |-
          골든 회귀의 진짜 위험은 만들 때가 아니라 **갱신할 때**다.

          기능을 바꾸면 골든이 깨진다. 그때 흔히 이렇게 한다.

          ```bash
          ./gradlew test -Dgolden.update=true    # 그냥 덮어쓴다
          git add golden/ && git commit -m "골든 갱신"
          ```

          **diff를 안 읽고 덮어쓰면 그 테스트는 죽는다.**
          의도한 변화와 의도하지 않은 변화가 함께 들어가고,
          그 뒤로는 무엇이 기준인지 아무도 모른다.

          규칙 셋을 둔다.

          1. **갱신은 diff를 읽고 나서** — 달라진 줄마다 왜 달라졌는지 말할 수 있어야 한다
          2. **커밋 본문에 왜 달라졌는지 적는다** — 리뷰어가 그것만 보고 판단한다
          3. **의도한 변화와 그 밖의 변화를 나눈다** — 섞이면 리뷰가 불가능하다

          골든 파일의 diff는 **그 변경이 무엇을 바꿨는지 가장 정확하게 보여 주는 문서**다.
          읽지 않고 덮어쓰는 것은 그 문서를 버리는 것이다.
        example:
          language: text
          code: |-
            $ ./gradlew integrationTest
            shouldMatchGoldenSettlement FAILED

            $ git diff src/test/resources/golden/settlement-2026-09.csv
            -ACME,120,4820000,241000
            +ACME,120,4820000,240000        ← 의도한 변화 (수수료 반올림 규칙 변경)
            -BETA,88,3110000,155500
            +BETA,88,3110000,155500
            -GAMMA,45,1200000,60000
            +GAMMA,44,1180000,59000         ← 의도하지 않은 변화 (주문 1건이 빠졌다)
          output: |-
            diff를 읽었을 때 알게 되는 것

            ACME   수수료 1000원 감소  → 반올림 규칙을 바꿨으니 맞다
            BETA   변화 없음           → 이 고객사는 반올림이 안 걸렸다. 맞다
            GAMMA  주문이 120→44 ...   → 이건 의도한 적이 없다. 버그다
          note: |-
            - **세 줄 중 하나가 버그**다. 덮어썼으면 그대로 기준이 됐을 것이다
            - `BETA`가 안 바뀐 것도 정보다 — 규칙이 일부에만 걸린다는 확인이다
            - 한 줄에 한 고객사라 diff가 이렇게 읽힌다. JSON 중첩이면 훨씬 어렵다
            - 이 diff 자체가 **그 변경의 영향 범위 보고서**다
        predict:
          question: diff를 안 읽고 골든을 덮어쓴 뒤, 같은 버그가 다음 달에도 나면?
          choices:
            - 골든이 이미 버그를 포함하고 있어 테스트가 초록이다
            - 테스트가 잡아 준다
            - 경고가 뜬다
            - 골든이 자동으로 되돌아간다
          answer: 골든이 이미 버그를 포함하고 있어 테스트가 초록이다
          explanation: |-
            골든은 **기준**이라서, 한 번 잘못 갱신하면 그때부터 그 잘못이 정답이 된다.
            게다가 나중에 누가 제대로 고치면 오히려 빨강이 나서
            "왜 깨지지?" 하다가 다시 덮어쓰게 된다.
            **갱신 한 번이 테스트 하나의 수명을 끝낸다.**
        complete:
          question: 골든 갱신 커밋의 본문을 채우세요.
          code: |-
            test: 수수료 반올림 규칙 변경에 맞춰 정산 골든을 갱신한다

            ACME 등 12곳의 수수료가 1000원 단위 내림으로 바뀌었다.
            BETA 등 6곳은 반올림이 걸리지 않아 그대로다.
            ___ 은 이번 변경과 무관해 보여 따로 확인했고, 주문 1건이
            취소 상태로 잘못 들어가 있던 것을 고쳤다. (별도 커밋)
          answers:
            - [GAMMA]
          explanation: |-
            **의도한 변화와 그 밖의 변화를 나눠 적는다.**
            그 밖의 변화가 있으면 그것은 골든 갱신이 아니라 **버그이므로 따로 고친다.**
            커밋 본문이 곧 리뷰어가 읽을 근거다.
        problem:
          prompt: |-
            골든 회귀를 팀에 도입한다고 하고 **운영 규칙**을 만드세요.

            - 골든을 갱신할 때의 **절차**를 단계로 적으세요 (diff 확인 단계 포함)
            - 리뷰어가 골든 변경 PR에서 **무엇을 봐야 하는지** 세 가지 적으세요
            - `-Dgolden.update=true` 같은 일괄 갱신 옵션을 **둘지 말지** 정하고 이유를 적으세요
            - 골든 파일이 커져서 diff를 읽기 어려워지면 어떻게 할지 적으세요
          deliverables:
            - 갱신 절차
            - 리뷰어가 볼 세 가지
            - 일괄 갱신 옵션에 대한 판단
            - 파일이 커질 때의 대응
          hints:
            - 절차에 "읽는다"를 명시적으로 넣지 않으면 아무도 안 읽습니다.
            - 리뷰어는 코드 diff와 골든 diff가 맞아떨어지는지를 봅니다.
            - 옵션이 있으면 편하지만 편한 만큼 안 읽게 됩니다.
          modelAnswer: |-
            **갱신 절차**
            1. 기능을 고치고 테스트를 돌려 골든이 깨지는 것을 확인한다
            2. 갱신 옵션으로 파일을 다시 만든다
            3. **`git diff`로 달라진 줄을 전부 읽는다**
            4. 줄마다 "이번 변경 때문인가"를 판단하고, 아닌 것은 **버그로 따로 고친다**
            5. 커밋 본문에 의도한 변화와 확인한 내용을 적는다
            6. 골든 갱신과 기능 변경을 **같은 PR에** 둔다 (따로 두면 근거가 끊긴다)

            **리뷰어가 볼 세 가지**
            ① 코드 변경과 골든 diff가 **맞아떨어지는가** (설명 안 되는 줄이 있는가)
            ② 달라진 **줄 수가 예상 범위인가** (12곳이라고 했는데 40줄이 바뀌었다면 이상하다)
            ③ 커밋 본문에 **확인한 방법**이 적혀 있는가

            **일괄 갱신 옵션은 둔다.** 다만 이름을 `-Dgolden.update=true`처럼
            의도를 드러내게 하고, **CI에서는 그 옵션이 켜지면 실패**하게 막는다.
            사람이 손으로 돌릴 때만 쓰고, 자동 갱신이 파이프라인에 들어가지 않게 한다.

            **파일이 커지면** 두 가지로 나눈다 —
            ① 골든을 **관심사별로 쪼갠다**(고객사별, 항목별), ② 전체 비교 대신
            **요약 지표**(합계, 건수, 체크섬)를 먼저 비교하고 다르면 상세를 본다.
            diff를 못 읽는 골든은 없는 것과 같다.
          selfChecks:
            - 절차에 diff를 읽는 단계가 명시돼 있는가
            - 의도하지 않은 변화를 따로 고치기로 했는가
            - 일괄 갱신이 CI에서 못 돌게 막았는가
            - 파일이 커질 때의 대응을 정했는가
      - key: LESSON.TESTING.GOLDEN_REGRESSION.001.U3
        title: 흔들리는 값 다루기
        minutes: 10
        core: false
        explain: |-
          골든 회귀는 **출력이 매번 같아야** 성립한다.
          그런데 실제 출력에는 매번 달라지는 것이 섞여 있다.

          | 흔들리는 값 | 다루는 법 |
          |---|---|
          | 생성 시각 | `Clock` 고정, 또는 비교에서 제외 |
          | UUID·주문 번호 | 주입해 고정, 또는 자리표시자로 치환 |
          | 정렬 순서 | 질의에 `ORDER BY`를 명시 |
          | 부동소수 | 정수(원·bp)로 다루거나 자릿수 고정 |
          | 환경 값 (호스트, 경로) | 비교에서 제외 |

          제외하는 방법도 두 가지다.
          **① 아예 출력에서 빼고 비교**, **② 자리표시자로 치환한 뒤 비교.**

          ②가 낫다. 필드가 **있다는 사실 자체**는 지켜지기 때문이다.
          `"createdAt": "2026-09-25T10:00:00Z"` 를 `"createdAt": "<TIME>"` 으로 바꿔 두면,
          그 필드가 사라지는 변경은 여전히 잡힌다.

          그리고 부동소수는 처음부터 피한다.
          이 저장소도 **학습 규칙 계산에 `double`·`float`를 쓰지 않고 정수(bp·micro)** 를 쓴다.
          같은 계산이 장비마다 마지막 자리가 달라지는 것을 막기 위해서다.
        example:
          language: java
          code: |-
            private static String normalize(String json) {
                return json
                        .replaceAll("\"createdAt\" : \"[^\"]+\"", "\"createdAt\" : \"<TIME>\"")
                        .replaceAll("\"id\" : \"[0-9a-f-]{36}\"", "\"id\" : \"<UUID>\"");
            }

            @Test
            void shouldMatchGoldenOrderResponse() throws Exception {
                String actual = normalize(toJson(service.place(fixedRequest(), MEMBER_ID)));
                String golden = Files.readString(GOLDEN.resolve("order-response.json"));

                assertThat(actual).isEqualToIgnoringWhitespace(golden);
            }
          output: |-
            golden/order-response.json

            {
              "id" : "<UUID>",
              "orderNumber" : "ORD-1001",
              "status" : "PLACED",
              "totalAmount" : 78000,
              "createdAt" : "<TIME>"
            }
          note: |-
            - 흔들리는 두 필드만 치환했다. **나머지는 그대로 비교**된다
            - `createdAt` 필드를 실수로 지우면 여전히 빨강이다 — 자리표시자가 남아 있다
            - `orderNumber`는 고정 입력에서 결정되므로 치환하지 않았다
            - 치환 규칙이 늘면 골든이 느슨해진다. **꼭 필요한 것만** 치환한다
        predict:
          question: 흔들리는 필드를 치환 대신 출력에서 아예 빼면?
          choices:
            - 그 필드가 사라지는 변경을 잡지 못한다
            - 더 안전하다
            - 차이가 없다
            - 테스트가 빨라진다
          answer: 그 필드가 사라지는 변경을 잡지 못한다
          explanation: |-
            빼 버리면 **있었는지 없었는지도 모르게 된다.**
            응답에서 `createdAt`이 통째로 사라져도 골든은 초록이다.
            자리표시자로 치환하면 값은 무시하되 **존재는 지킨다.**
        complete:
          question: 흔들리는 값을 자리표시자로 치환하세요.
          code: |-
            json.replaceAll("\"createdAt\" : \"[^\"]+\"", "\"createdAt\" : \"___\"")
            // 값은 무시하되 필드가 ___ 는 사실은 지킨다
          answers:
            - ["<TIME>"]
            - [있다, 존재한다]
          explanation: |-
            값 자리만 고정 문자열로 바꾼다.
            **값은 흔들려도 되지만 필드는 있어야 한다**는 것이 이 방식의 뜻이다.
        problem:
          prompt: |-
            정산 골든 테스트가 **하루에 한 번씩 이유 없이 깨진다.**

            - 흔들릴 수 있는 값을 **네 가지** 찾아 적으세요
              (출력 자체 / 입력 데이터 / 실행 환경 어디서든)
            - 각각을 고정할지, 치환할지, 제외할지 정하고 이유를 적으세요
            - **정렬**이 원인일 수 있는지 확인하는 방법을 적으세요
            - 고친 뒤 **흔들리지 않는지 확인하는 방법**을 적으세요 (한 번 초록은 증거가 아닙니다)
          deliverables:
            - 흔들리는 값 네 가지
            - 각각의 처리 방법과 이유
            - 정렬 원인 확인 방법
            - 흔들리지 않음을 확인하는 방법
          hints:
            - 하루에 한 번이면 날짜 경계일 수 있습니다.
            - DB는 ORDER BY가 없으면 순서를 보장하지 않습니다.
            - 같은 테스트를 여러 번 돌려 보는 것이 가장 확실합니다.
          modelAnswer: |-
            | 흔들리는 값 | 처리 | 이유 |
            |---|---|---|
            | 생성 시각 | **고정** (`Clock.fixed`) | 정산 대상 기간 판정에 쓰여 값 자체가 결과를 바꾼다 |
            | 주문 UUID | **치환** (`<UUID>`) | 결과에 영향은 없지만 필드 존재는 지켜야 한다 |
            | 조회 순서 | **고정** (`ORDER BY customer_code`) | 순서가 바뀌면 diff가 전부 난다 |
            | 수수료 소수점 | **정수로 변경** | 장비·JDK에 따라 마지막 자리가 달라진다 |

            "하루에 한 번"은 **날짜 경계**를 의심한다.
            테스트가 `LocalDate.now()`로 대상 기간을 잡고 있으면 자정을 넘길 때 결과가 바뀐다.

            정렬이 원인인지 확인하는 방법 — 같은 질의를 **여러 번 돌려 결과 순서를 비교**하거나,
            `EXPLAIN`에서 정렬 단계가 있는지 본다. `ORDER BY`가 없는데 순서가 맞아 보이는 것은
            **우연**이고, 데이터가 늘거나 계획이 바뀌면 깨진다.

            흔들리지 않음을 확인하는 방법 — **같은 테스트를 연속 20회 돌린다.**
            그리고 JUnit 무작위 순서를 켜고, 가능하면 시각을 자정 전후로 바꿔 한 번 더 돌린다.
            한 번 초록은 증거가 아니다 — **원래도 하루에 한 번만 깨졌다.**
          selfChecks:
            - 네 가지를 서로 다른 출처에서 찾았는가
            - 고정·치환·제외를 이유와 함께 골랐는가
            - 정렬을 명시했는가
            - 여러 번 돌려 확인하기로 했는가
    commonMistakes:
      - 출력을 그대로 받아 적어 골든을 만든다. 틀린 결과가 기준이 된다 (U1)
      - diff를 안 읽고 골든을 덮어쓴다. 의도한 변화와 버그가 함께 기준이 된다 (U2)
      - 흔들리는 필드를 출력에서 빼 버린다. 그 필드가 사라져도 잡지 못한다 (U3)
    inProject: |-
      주문 시스템에서 골든 회귀가 맞는 자리는 **응답 JSON 모양**과 **집계 결과표**다.
      `Clock`을 고정하고 질의에 `ORDER BY`를 명시해 출력을 결정적으로 만든 뒤,
      흔들리는 식별자만 자리표시자로 치환한다.
      골든을 갱신할 때는 diff를 줄마다 읽고 커밋 본문에 왜 달라졌는지 적는다 —
      그 diff가 그 변경의 영향 범위를 가장 정확히 보여 주는 문서다.
