        url: https://www.postgresql.org/docs/16/sql-select.html
        versionScope: PostgreSQL 16
      - title: Java SE API — java.nio.file.Files
        url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/nio/file/Files.html
        versionScope: Java SE 21+
