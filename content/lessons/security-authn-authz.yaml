# DevPilot 개념 노트 — 누구인가와 무엇을 해도 되는가 (인증·인가)
# Spec: docs/19-content-spec.md §3.14 (schema), §4.1 CV-126~CV-136 (검증)
# Screen: docs/02 SCR-LESSON · API: docs/05 §21
#
# - 설명과 예제는 공식 문서를 읽고 직접 쓴다. 읽은 문서를 sources에 남긴다 (CV-131)
# - 세션·토큰 노트가 "로그인 상태를 어디에 두는가"를 다룬다. 여기서는 그 뒤의 "무엇을 해도 되는가"를 다룬다
# - 실제 계정·키 값은 쓰지 않는다. 자리표시자만 쓴다
lessons:
  - key: LESSON.SECURITY.AUTHN_AUTHZ.001
    skillCode: SECURITY.AUTHN_AUTHZ
    title: 누구인가와 무엇을 해도 되는가 (인증·인가)
    whyItMatters: |-
      로그인만 붙이면 끝난 것 같지만, 실제 사고는 그 다음에서 난다.
      **남의 주문 번호를 주소창에 넣으면 그대로 보이는** 종류의 구멍이다.
      로그인은 통과했으니 인증은 됐고, 문제는 "이 사람이 **이 자원**에 손대도 되는가"를
      아무도 확인하지 않은 것이다.
      이 둘을 구분하지 못하면 화면에서 버튼을 숨기는 것으로 막았다고 착각하게 된다.
    oneLine: 인증은 **누구인지 확인**하는 일이고 인가는 **그 일을 해도 되는지 확인**하는 일이며, 인가는 반드시 서버에서 한다.
    units:
      - key: LESSON.SECURITY.AUTHN_AUTHZ.001.U1
        title: 401과 403이 갈리는 자리
        minutes: 10
        core: true
        explain: |-
          두 단어가 비슷해 보여서 코드에서도 자주 섞인다. 기준은 하나다 —
          **서버가 "모른다"고 말하는가, "안 된다"고 말하는가.**

          - **인증(authentication)** — 당신이 누구인지 확인한다. 실패하면 **401 Unauthorized**
          - **인가(authorization)** — 그 사람이 그 일을 해도 되는지 확인한다. 실패하면 **403 Forbidden**

          공식 정의도 그렇게 갈라 놓는다. `401`은 **"인증이 없거나 유효하지 않다"** 이고,
          `403`은 **"서버가 요청을 이해했고 인증도 됐지만 거부한다"** 이다.
          401에는 `WWW-Authenticate` 헤더로 "이렇게 인증하라"를 알려 주지만,
          403에는 그런 안내가 없다 — 다시 로그인한다고 풀릴 일이 아니기 때문이다.

          순서도 정해져 있다. **인증이 먼저고 인가가 나중이다.**
          누구인지 모르는 채로 권한을 따질 수는 없다.

          실무에서 헷갈리는 자리 하나. **남의 자원을 조회했을 때 403과 404 중 무엇을 줄 것인가** —
          403은 "그것이 존재하고 당신 것이 아니다"를 알려 준다. 존재 자체를 감추려면 404를 준다.
        example:
          language: http
          code: |-
            # (1) 표시 없이 요청 — 누구인지 모른다
            GET /api/v1/orders/1024 HTTP/1.1

            HTTP/1.1 401 Unauthorized
            WWW-Authenticate: Bearer

            # (2) 로그인했지만 남의 주문 — 누구인지는 안다
            GET /api/v1/orders/1024 HTTP/1.1
            Authorization: Bearer <token-of-user-17>

            HTTP/1.1 403 Forbidden

            # (3) 존재 자체를 감추는 선택
            HTTP/1.1 404 Not Found
          output: |-
            (1) 401 → 인증 단계에서 멈췄다. 다시 로그인하면 풀린다
            (2) 403 → 인증은 통과했다. 다시 로그인해도 안 풀린다
            (3) 404 → 있는지 없는지도 알려 주지 않는다

            로그를 볼 때도 갈린다
              401 이 많다 → 토큰·쿠키가 안 붙는 문제
              403 이 많다 → 권한 설계나 소유권 검사 문제
          note: |-
            - 401은 "모른다", 403은 "안 된다". 다시 로그인해서 풀리면 401이었다
            - 인증이 먼저, 인가가 나중이다. 순서가 바뀔 수 없다
            - 남의 자원은 403 또는 404다. **존재를 감출지**로 고른다
        predict:
          question: 로그인한 사용자가 다른 사람의 주문을 조회했습니다. 알맞은 응답은?
          choices:
            - 403. 누구인지는 알지만 그 자원에 대한 권한이 없다
            - 401. 권한이 없으므로 인증 실패다
            - 200. 로그인했으므로 통과시킨다
            - 500. 서버 오류로 처리한다
          answer: 403. 누구인지는 알지만 그 자원에 대한 권한이 없다
          explanation: |-
            인증은 **통과했다** — 서버는 이 사람이 누구인지 안다.
            막히는 자리는 그 다음, "이 주문에 손대도 되는가"이므로 **인가** 실패이고 403이다.
            401을 주면 클라이언트는 "다시 로그인하면 되겠구나"로 읽는데, 다시 로그인해도 풀리지 않는다.
            (존재 자체를 감추기로 했다면 404를 줄 수 있다 — 그건 별도의 정책 결정이다.)
        complete:
          question: 인증 실패와 인가 실패에 각각 맞는 상태 코드를 쓰세요.
          code: |-
            표시가 없거나 못 믿는다        → ___
            누구인지는 알지만 권한이 없다 → ___
          answers:
            - [401]
            - [403]
          explanation: |-
            401은 인증(누구인지) 실패, 403은 인가(해도 되는지) 실패다.
            401에는 `WWW-Authenticate`로 인증 방법을 알려 주고, 403에는 알려 줄 것이 없다.
        problem:
          prompt: |-
            팀 코드에서 이런 처리를 발견했습니다.

            ```text
            로그인 안 됨        → 401
            남의 주문 조회      → 401
            권한 없는 관리 기능 → 401
            ```

            1. 무엇이 잘못됐고 각각 어떤 코드여야 하는지
            2. 전부 401로 두면 **클라이언트와 운영에서 각각** 무엇이 곤란한지
            3. "남의 주문 조회"에 404를 주는 선택은 어떤 경우에 맞는지
          deliverables:
            - 세 물음에 대한 답
            - 2번은 클라이언트와 운영을 나눠서
          hints:
            - 다시 로그인하면 풀리는지 아닌지로 갈라 보세요.
            - 클라이언트는 상태 코드를 보고 다음 행동을 정합니다.
            - 404를 주면 무엇을 감추게 되는지 생각해 보세요.
          modelAnswer: |-
            **1. 무엇이 잘못됐나**

            뒤의 둘은 **인증에 성공한 뒤** 막힌 것이므로 인가 실패다.

            - 로그인 안 됨 → **401** (맞다)
            - 남의 주문 조회 → **403** (또는 정책에 따라 404)
            - 권한 없는 관리 기능 → **403**

            **2. 전부 401이면 곤란한 것**

            - **클라이언트**: 401을 받으면 보통 "토큰이 만료됐다"로 보고 **로그인 화면으로 보내거나 토큰을 갱신**한다.
              권한 문제인데 로그인을 다시 시키면 사용자는 "로그인했는데 또 로그인하라네"를 겪고,
              갱신 요청만 반복하는 고리에 빠질 수도 있다
            - **운영**: 로그에서 **"토큰이 안 붙는 문제"와 "권한 설계 문제"가 구분되지 않는다.**
              401 급증을 보고 인증 쪽을 뒤지는데 실제 원인은 권한일 수 있다

            **3. 404를 주는 선택**

            **자원의 존재 자체가 정보일 때**다. 403은 "그 주문은 있고 당신 것이 아니다"를 알려 준다.
            주문 번호를 하나씩 넣어 보며 **어떤 번호가 존재하는지 훑는 것**을 막으려면 404가 낫다.
            대신 개발자가 디버깅할 때 "없는 건지 권한이 없는 건지" 구분이 안 되므로,
            **서버 로그에는 실제 이유를 남긴다.**
          selfChecks:
            - 뒤의 둘을 403으로 바로잡고 그 이유를 "인증은 통과했다"로 설명했는가
            - 클라이언트 영향과 운영 영향을 나눠서 말했는가
            - 404 선택의 근거를 "존재를 감춘다"로 짚었는가

      - key: LESSON.SECURITY.AUTHN_AUTHZ.001.U2
        title: 화면에서 숨기는 것은 막는 것이 아니다
        minutes: 12
        core: true
        explain: |-
          가장 흔한 사고가 여기서 난다. **버튼을 숨겨 놓고 막았다고 생각하는 것.**

          화면 코드는 사용자의 브라우저에서 돈다. 사용자는 그것을 고칠 수 있고,
          아예 브라우저를 거치지 않고 API를 직접 부를 수도 있다.
          `curl` 한 줄이면 숨긴 버튼과 무관하게 요청이 나간다.

          그래서 규칙은 하나다. **인가는 서버에서 한다. 화면은 편의일 뿐이다.**

          - 화면에서 버튼을 숨기는 것은 **사용자 경험**이다. 할 수 없는 일을 보여 주지 않는 것
          - 실제로 막는 것은 **서버의 검사**다. 화면을 고쳐도, 화면을 안 써도 막혀야 한다

          서버에서 확인해야 하는 것도 두 종류다.

          - **역할(role) 검사** — "관리자만 쓸 수 있는 기능인가"
          - **소유권 검사** — "이 주문이 **이 사람의** 주문인가"

          두 번째를 빠뜨리기 쉽다. 역할만 보면 로그인한 아무나 남의 자원에 접근할 수 있다.
          자원을 다루는 API는 **id로 조회한 뒤 소유자를 반드시 대조**한다.
        example:
          language: java
          code: |-
            // 나쁜 예 — id 로 찾기만 하고 소유자를 보지 않는다
            public OrderView get(UUID orderId) {
                Order order = orderRepository.findById(orderId).orElseThrow();
                return toView(order);            // 남의 주문도 그대로 나간다
            }

            // 좋은 예 — 소유자를 함께 조건에 넣는다
            public OrderView get(UUID userId, UUID orderId) {
                Order order = orderRepository
                        .findByIdAndUserId(orderId, userId)
                        .orElseThrow(NotFoundException::new);
                return toView(order);
            }
          output: |-
            나쁜 예
              GET /api/v1/orders/1024  (남의 주문)  → 200, 남의 정보가 보인다

            좋은 예
              GET /api/v1/orders/1024  (남의 주문)  → 404
              GET /api/v1/orders/1024  (내 주문)    → 200

            화면에서 버튼을 숨겨도
              curl 로 직접 부르면 나쁜 예는 그대로 뚫린다
          note: |-
            - 화면에서 숨기기 = 사용자 경험. 서버에서 검사 = 보안
            - 역할 검사와 **소유권 검사**는 다르다. 후자를 빠뜨리기 쉽다
            - 조회 자체에 소유자 조건을 넣으면 빠뜨릴 자리가 줄어든다
        predict:
          question: 관리자 메뉴 버튼을 화면에서 숨겼습니다. 일반 사용자가 그 API를 직접 호출하면?
          choices:
            - 서버에 검사가 없으면 그대로 실행된다
            - 버튼이 없으므로 호출할 수 없다
            - 브라우저가 막는다
            - 서버가 자동으로 권한을 확인한다
          answer: 서버에 검사가 없으면 그대로 실행된다
          explanation: |-
            화면 코드는 사용자 쪽에서 돌고, 사용자는 그것을 거치지 않고 요청을 보낼 수 있다.
            **숨기는 것은 막는 것이 아니다.**
            서버가 "이 사람이 이 일을 해도 되는가"를 확인하지 않으면 요청은 그대로 처리된다.
            버튼 숨기기는 그 일을 할 수 없는 사람에게 보여 주지 않는 **편의**일 뿐이다.
        complete:
          question: 소유자까지 조건에 넣어 조회하도록 메서드 이름을 채우세요.
          code: |-
            Order order = orderRepository
                    .___(orderId, userId)
                    .orElseThrow(NotFoundException::new);
          answers:
            - [findByIdAndUserId]
          explanation: |-
            `findById`로 찾은 뒤 따로 비교하면 비교를 빠뜨린 경로가 생긴다.
            **조회 조건에 소유자를 넣으면** 빠뜨릴 자리 자체가 없어진다.
        problem:
          prompt: |-
            주문 시스템에 이런 API가 있습니다.

            ```text
            GET    /api/v1/orders/{orderId}          내 주문 상세
            DELETE /api/v1/orders/{orderId}          주문 취소
            GET    /api/v1/admin/orders              전체 주문 (관리자)
            ```

            화면에서는 남의 주문 링크를 만들지 않고, 관리자 메뉴도 숨겨 두었습니다.

            1. 이 상태에서 **남을 수 있는 구멍** 두 가지
            2. 각 API에 서버에서 무엇을 확인해야 하는지
            3. 확인을 **빠뜨리기 어렵게** 만드는 방법 하나
          deliverables:
            - 세 물음에 대한 답
            - 2번은 API마다 나눠서
          hints:
            - 화면을 거치지 않고 요청을 보낼 수 있다는 점에서 출발하세요.
            - 확인해야 하는 것이 역할 하나뿐이었는지 생각해 보세요.
            - 사람이 매번 기억해야 하는 검사는 언젠가 빠집니다.
          modelAnswer: |-
            **1. 남을 수 있는 구멍**

            - **남의 주문 조회·취소** — 주소창이나 `curl`로 남의 `orderId`를 넣으면 된다.
              화면이 링크를 안 만들 뿐 요청은 막히지 않는다
            - **관리자 API 직접 호출** — 메뉴를 숨겨도 경로는 알려져 있다.
              로그인한 일반 사용자가 그대로 부를 수 있다

            **2. 서버에서 확인할 것**

            - `GET /orders/{orderId}` — **소유권**. 그 주문이 요청한 사람의 것인가
            - `DELETE /orders/{orderId}` — **소유권** + 지금 취소할 수 있는 **상태**인가
            - `GET /admin/orders` — **역할**. 관리자인가

            앞의 둘은 역할만 봐서는 못 막는다. 로그인한 사람은 모두 같은 역할이기 때문이다.

            **3. 빠뜨리기 어렵게 만들기**

            **조회 조건에 소유자를 넣는다** — `findByIdAndUserId(orderId, userId)`.
            `findById`로 가져온 뒤 따로 비교하는 방식은 비교를 안 한 경로가 언젠가 생긴다.

            여기에 더할 수 있는 것:

            - 관리자 경로(`/admin/**`)에 **역할 검사를 한 자리에서** 걸어 둔다
            - **남의 자원에 접근하면 404가 나오는 테스트**를 API마다 둔다.
              사람이 기억하는 대신 테스트가 기억한다
          selfChecks:
            - 두 구멍을 "화면을 거치지 않고 부를 수 있다"로 설명했는가
            - 소유권 검사와 역할 검사를 API마다 갈라 적었는가
            - 빠뜨리기 어렵게 만드는 방법을 구체적으로 적었는가 (조회 조건·공통 검사·테스트 중 하나 이상)

      - key: LESSON.SECURITY.AUTHN_AUTHZ.001.U3
        title: 비밀번호는 저장하지 않는다
        minutes: 10
        core: true
        explain: |-
          인증의 출발점은 비밀번호이고, 여기서 저지르면 되돌릴 수 없다.
          **비밀번호는 저장하지 않는다.** 되돌릴 수 없게 바꾼 값만 저장한다.

          - **평문 저장** — 저장소가 한 번 새면 모든 계정이 끝난다. 다른 서비스까지 위험해진다
          - **되돌릴 수 있는 암호화** — 키가 같이 새면 평문과 다를 바 없다
          - **비밀번호 전용 해시** — 이것만이 답이다

          일반 해시(예: SHA-256)로는 부족하다. 너무 빨라서 짧은 시간에 엄청난 수를 대입해 볼 수 있다.
          비밀번호에는 **느리게 설계된 해시**를 쓴다. 대표적으로 **bcrypt** 계열이다.

          두 가지를 같이 기억한다.

          - **솔트(salt)** — 계정마다 다른 값을 섞는다. 같은 비밀번호라도 저장값이 달라져서
            "이 해시는 이 비밀번호"라는 표를 만들어 두는 공격이 통하지 않는다. bcrypt는 솔트를 결과에 포함한다
          - **비교는 대조로** — 저장값을 되돌리지 않는다. 입력값을 같은 방식으로 처리해 **맞는지만** 본다

          로그인 실패 메시지도 주의한다. "그런 계정 없음"과 "비밀번호 틀림"을 나눠 주면
          **어떤 이메일이 가입돼 있는지 알려 주는 셈**이다. 하나로 합친다.
        example:
          language: java
          code: |-
            // 저장 — 되돌릴 수 없는 값만 남긴다
            String stored = passwordEncoder.encode(rawPassword);
            user.setPasswordHash(stored);          // 평문은 어디에도 남기지 않는다

            // 로그인 — 되돌리지 않고 대조한다
            if (!passwordEncoder.matches(rawPassword, user.getPasswordHash())) {
                throw new AuthenticationException("이메일 또는 비밀번호가 올바르지 않습니다");
            }

            // 로그에도 남기지 않는다
            log.info("login attempt userId={}", user.getId());   // rawPassword 를 찍지 않는다
          output: |-
            같은 비밀번호를 두 계정이 써도 저장값이 다르다 (솔트가 다르다)
              계정 A → $2b$10$<salt+hash-a>
              계정 B → $2b$10$<salt+hash-b>

            로그인 실패 메시지는 하나로
              없는 이메일   → "이메일 또는 비밀번호가 올바르지 않습니다"
              틀린 비밀번호 → "이메일 또는 비밀번호가 올바르지 않습니다"
          note: |-
            - 저장하는 것은 **되돌릴 수 없는 값**이다. 암호화가 아니다
            - 솔트 덕분에 같은 비밀번호도 저장값이 다르다
            - 실패 메시지를 나누면 가입 여부가 새 나간다
        predict:
          question: 두 사용자가 같은 비밀번호를 썼습니다. 솔트를 쓰는 해시로 저장하면 저장값은?
          choices:
            - 서로 다르다. 계정마다 다른 솔트가 섞인다
            - 같다. 같은 비밀번호이므로
            - 같지만 순서만 다르다
            - 저장값이 하나로 합쳐진다
          answer: 서로 다르다. 계정마다 다른 솔트가 섞인다
          explanation: |-
            솔트는 계정마다 다르게 만들어 비밀번호와 함께 섞는다.
            그래서 같은 비밀번호라도 **저장값이 달라진다.**
            저장값이 같으면 "이 둘은 비밀번호가 같다"는 사실까지 새고,
            미리 만들어 둔 해시 표로 한 번에 뚫린다.
        complete:
          question: 저장할 때와 로그인할 때 쓰는 메서드를 각각 쓰세요.
          code: |-
            String stored = passwordEncoder.___(rawPassword);
            boolean ok    = passwordEncoder.___(rawPassword, stored);
          answers:
            - [encode]
            - [matches]
          explanation: |-
            저장은 `encode`, 확인은 `matches`다.
            **되돌리는 메서드가 없다**는 것이 핵심이다 — 되돌릴 수 있으면 해시가 아니다.
        problem:
          prompt: |-
            코드 리뷰에서 이런 것을 발견했습니다.

            ```text
            1. 비밀번호를 SHA-256 으로 한 번 해시해 저장한다
            2. 로그인 실패 시 "가입되지 않은 이메일입니다" / "비밀번호가 틀립니다" 를 나눠 보여 준다
            3. 디버깅용으로 로그인 요청 본문을 통째로 로그에 남긴다
            ```

            각각 무엇이 문제이고 어떻게 고칠지 쓰세요.
          deliverables:
            - 세 항목의 문제와 고칠 방향
            - 1번은 "해시를 쓰는데 왜 부족한가"를 설명
          hints:
            - 해시가 빠르다는 것이 왜 문제가 되는지 생각해 보세요.
            - 실패 메시지를 나누면 공격자가 무엇을 알게 되나요?
            - 로그는 보통 누구까지 볼 수 있나요?
          modelAnswer: |-
            **1. SHA-256 한 번으로는 부족하다**

            SHA-256은 **빠르라고 만든** 해시다. 빠르다는 것은 공격자도 빠르게 대입할 수 있다는 뜻이라,
            흔한 비밀번호는 금방 뚫린다. 솔트도 없으면 미리 만들어 둔 표로 한 번에 맞힌다.

            고칠 방향: **비밀번호 전용 해시(bcrypt 계열)** 로 바꾼다. 느리게 설계돼 있고 솔트를 포함한다.
            기존 값은 되돌릴 수 없으므로, 다음 로그인 때 새 방식으로 다시 저장하도록 옮긴다.

            **2. 실패 메시지를 나누면 가입 여부가 샌다**

            이메일을 넣어 보며 메시지가 갈리는 것만 봐도 **누가 가입했는지 목록을 만들 수 있다.**
            그 자체가 개인정보이고, 표적 공격의 출발점이 된다.

            고칠 방향: **하나로 합친다** — "이메일 또는 비밀번호가 올바르지 않습니다".
            서버 로그에는 실제 이유를 남겨 디버깅에는 지장이 없게 한다.

            **3. 요청 본문을 로그에 남기면 평문이 로그에 쌓인다**

            로그는 저장소에 오래 남고, 보통 개발자와 운영 담당이 두루 본다.
            해시로 저장한 의미가 사라진다.

            고칠 방향: **요청 본문을 통째로 찍지 않는다.** 필요한 식별자만 남긴다.
            공통 로깅에서 비밀번호 같은 필드를 가리는 처리를 두면 개별 코드가 실수해도 막힌다.
          selfChecks:
            - SHA-256의 문제를 "빠르다"와 "솔트 없음"으로 짚었는가
            - 실패 메시지 문제를 "가입 여부 노출"로 설명하고 합치는 해법을 냈는가
            - 로그 문제에서 "해시로 저장한 의미가 사라진다"를 연결했는가

    commonMistakes:
      - 인가 실패에 401을 준다. 다시 로그인해도 풀리지 않는데 클라이언트는 로그인 화면으로 보낸다 (U1)
      - 화면에서 버튼을 숨기고 막았다고 여긴다. 서버 검사가 없으면 그대로 뚫린다 (U2)
      - 역할만 확인하고 소유권을 빠뜨린다. 로그인한 아무나 남의 자원에 닿는다 (U2)
    inProject: |-
      주문 시스템에 로그인을 붙인 직후가 이 노트를 쓸 자리다.
      먼저 응답 코드를 401·403·404로 정리하고 그 기준을 기록에 남긴다(U1).
      주문 조회·취소는 `findByIdAndUserId`처럼 **조회 조건에 소유자를 넣어** 빠뜨릴 자리를 없앤다(U2).
      관리자 경로는 한 자리에서 역할을 검사한다. 그리고 **남의 자원에 접근하면 404**가 나오는
      테스트를 API마다 둔다 — 사람이 기억하는 대신 테스트가 기억하게 한다.
      비밀번호는 전용 해시로만 저장하고 로그에 요청 본문을 찍지 않는다(U3).
