# DevPilot curated repositories & code readings — READ_CODE 과제 콘텐츠
# Spec: docs/19-content-spec.md §3.8 (schema), §4.1 CV-80~CV-87 (검증), §8.2 (은퇴), §8.4 (줄 번호 관리), §8.5 (소스 점검)
# Rules: docs/06-learning-engine-rules.md §5.3 (READ_CODE 제안), §9.5 RC-1~RC-4
#
# - 서버는 이 저장소를 fetch하지 않는다. 사용자가 cloneHint로 직접 clone하거나 IDE의 소스 보기로 읽는다
# - lines는 pinnedCommit 기준이다. 저장소가 바뀌면 틀어지므로 pinnedCommit을 올릴 때
#   readings의 path·lines를 전부 다시 확인한다 (19 §8.4)
# - question은 답을 유도하지 않는 열린 질문이다. 러버덕 세션의 시작점이 된다 (06 §9.5 RD-2)
# - 은퇴한 reading은 지우지 않고 retired: true로 남긴다. key는 catalog.yaml retired.readingKeys에도 있다 (19 §8.2)
# - 코드 본문은 이 파일에 옮겨 적지 않는다. 좌표(path·lines)와 질문만 적는다
repos:
  - key: modulith
    name: Spring Modulith Example (full)
    url: https://github.com/spring-projects/spring-modulith
    subPath: spring-modulith-examples/spring-modulith-example-full
    pinnedCommit: e9e003a6363e2793a0e5eebe320cb02816ed1e0c
    license: Apache-2.0
    stack: "Spring Boot 4, Spring Modulith, Java 17+"
    why: "모듈러 모놀리스의 최소 형태. main 298줄 10파일이라 하루에 전부 읽을 수 있다. 모듈 경계와 이벤트로 결합을 끊는 방법을 본다."
    cloneHint: "git clone https://github.com/spring-projects/spring-modulith.git && cd spring-modulith && git checkout e9e003a6363e2793a0e5eebe320cb02816ed1e0c && cd spring-modulith-examples/spring-modulith-example-full"
  - key: petclinic
    name: Spring PetClinic
    url: https://github.com/spring-projects/spring-petclinic
    subPath: ""
    pinnedCommit: 818c4136ea971c21674525f9053de0d9c7ad8cfe
    license: Apache-2.0
    stack: "Spring Boot 4.1, Java 17, Spring Data JPA"
    why: "Spring 공식 샘플. 계층 구조와 테스트 작성법의 정석이고, 테스트 코드가 main보다 많다(main 1,878줄 / test 2,336줄)."
    cloneHint: "git clone https://github.com/spring-projects/spring-petclinic.git && cd spring-petclinic && git checkout 818c4136ea971c21674525f9053de0d9c7ad8cfe"
  # 은퇴한 저장소: reading 5개가 모두 retired다(2026-09-19 소스 점검, 라이선스 명시 없음 → modular-monolith로 교체).
  # 지난 READ_CODE 과제와 러버덕 세션이 가리키는 단위를 계속 조회할 수 있게 항목을 남긴다 (19 §8.2, CV-84)
  - key: restbucks
    name: Spring RESTBucks (server)
    url: https://github.com/odrotbohm/spring-restbucks
    subPath: server
    pinnedCommit: ad97ad03c367a69ff1de70c660be2731cbe7bc3d
    license: UNSPECIFIED
    stack: "Spring Boot 4.1, Spring Modulith 2.1, Spring Data REST, Java 17+"
    why: "주문·결제 도메인을 상태 전이로 다룬다. 우리가 만드는 주문 시스템과 문제가 같다."
    licenseNote: "저장소에 라이선스 명시가 없다. 읽기만 한다. 코드를 복사해 오거나 이 파일에 인용하지 않는다."
    cloneHint: "git clone https://github.com/odrotbohm/spring-restbucks.git && cd spring-restbucks && git checkout ad97ad03c367a69ff1de70c660be2731cbe7bc3d && cd server"
  # LICENSE 파일: Apache-2.0 (2026-09-19 확인). main HEAD 고정
  - key: modular-monolith
    name: Spring Modular Monolith (BookStore)
    url: https://github.com/sivaprasadreddy/spring-modular-monolith
    subPath: ""
    pinnedCommit: 2933f5f14481615e214ee7c35166b957cac4c6cc
    license: Apache-2.0
    stack: "Spring Boot 4.1, Spring Modulith 2.1, Java 25, PostgreSQL, RabbitMQ"
    why: "catalog·orders·inventory·users·notifications 모듈로 나눈 온라인 서점. 장바구니 → 주문 → 이벤트 → 재고 차감이 한 저장소에 있고 모듈 경계, 보안 설정, 구조 테스트, Testcontainers, compose, CI까지 갖췄다. 우리가 만드는 주문 시스템과 문제가 같다."
    cloneHint: "git clone https://github.com/sivaprasadreddy/spring-modular-monolith.git && cd spring-modular-monolith && git checkout 2933f5f14481615e214ee7c35166b957cac4c6cc"
  # 큰 저장소의 부분 읽기 (19 §8.5). 태그 jdk-25.0.4.1+1 = Temurin 25.0.4.1+1 설치본의 lib/src.zip과 같은 내용(2026-09-19 대조).
  # 아래 reading 파일은 jdk-25.0.4+1 태그에서도 줄 단위로 같다
  - key: jdk25
    name: OpenJDK 25 (java.base)
    url: https://github.com/openjdk/jdk25u
    subPath: src/java.base/share/classes
    pinnedCommit: 7b65d74bcbd7c3a0b4c1f5c5bd85e64aa2e51b4a
    license: GPL-2.0-only WITH Classpath-exception-2.0
    licenseNote: "GPL-2.0에 Classpath Exception이 붙은 라이선스다. 읽기만 하고 코드를 이 파일이나 문서에 옮겨 적지 않는다."
    stack: "Java SE 25 (java.base), 태그 jdk-25.0.4.1+1"
    why: "매일 쓰는 컬렉션, 스트림, 자원 해제가 실제로 어떻게 구현되어 있는지 본다. 저장소 전체가 아니라 클래스 하나의 메서드 몇 개만 읽는다."
    cloneHint: "IDE에서 JDK 25 소스(src.zip)로 java.util.HashMap을 연다. Temurin 25.0.4.1+1의 lib/src.zip이 이 태그와 같고 파일은 java.base/ 아래에 있다. JDK 버전이 달라 줄이 어긋나면 이 커밋을 받는다: git clone --depth 1 --branch jdk-25.0.4.1+1 https://github.com/openjdk/jdk25u.git && cd jdk25u && git checkout 7b65d74bcbd7c3a0b4c1f5c5bd85e64aa2e51b4a && cd src/java.base/share/classes"
  # 태그 v7.0.9 = backend/gradle.lockfile의 spring-tx·spring-aop 7.0.9. Maven Central sources jar와 줄 단위로 같다(2026-09-19 대조)
  - key: spring-framework
    name: Spring Framework
    url: https://github.com/spring-projects/spring-framework
    subPath: ""
    pinnedCommit: 82a6b40b9366ec181ededdad282b307ee5381a52
    license: Apache-2.0
    stack: "Spring Framework 7.0.9 (DevPilot backend와 같은 버전)"
    why: "@Transactional과 AOP 프록시가 실제로 무엇을 하는지 프레임워크 코드에서 본다. DevPilot backend와 같은 버전이라 IDE에서 의존성 소스를 열면 같은 줄이 보인다."
    cloneHint: "IDE에서 의존성 소스를 연다: TransactionAspectSupport 같은 클래스를 열고 소스 내려받기를 고르면 spring-tx·spring-aop 7.0.9 sources jar가 열리며 이 태그와 줄이 같다. 저장소로 보려면: git clone --depth 1 --branch v7.0.9 https://github.com/spring-projects/spring-framework.git && cd spring-framework && git checkout 82a6b40b9366ec181ededdad282b307ee5381a52"
  # 태그 HikariCP-7.0.2 = backend/gradle.lockfile의 HikariCP 7.0.2. Maven Central sources jar와 줄 단위로 같다(2026-09-19 대조)
  - key: hikaricp
    name: HikariCP
    url: https://github.com/brettwooldridge/HikariCP
    subPath: src/main/java/com/zaxxer/hikari
    pinnedCommit: 80c46aee46a000af61d700a2bd144c9a3ff777af
    license: Apache-2.0
    stack: "HikariCP 7.0.2 (Spring Boot 4.1 기본 커넥션 풀, DevPilot backend와 같은 버전)"
    why: "Spring Boot의 기본 커넥션 풀. 커넥션을 빌리고 돌려주는 코드가 짧아서 타임아웃과 자원 반납이 실제로 어떻게 동작하는지 직접 확인할 수 있다."
    cloneHint: "IDE에서 의존성 소스를 연다: HikariPool 클래스를 열고 소스 내려받기를 고르면 HikariCP-7.0.2 sources jar가 열리며 이 태그와 줄이 같다. 저장소로 보려면: git clone --depth 1 --branch HikariCP-7.0.2 https://github.com/brettwooldridge/HikariCP.git && cd HikariCP && git checkout 80c46aee46a000af61d700a2bd144c9a3ff777af && cd src/main/java/com/zaxxer/hikari"
  # 저장소 루트에 LICENSE 파일이 없다. 각 소스 파일 머리의 Apache License 2.0 헤더로 라이선스를 밝힌다(2026-09-19 확인)
  - key: security-samples
    name: Spring Security Samples
    url: https://github.com/spring-projects/spring-security-samples
    subPath: servlet/spring-boot/java
    pinnedCommit: 2e3f349b9a33b1b4e3d212398ef14d6383c447db
    license: Apache-2.0
    licenseNote: "저장소 루트에 LICENSE 파일이 없고, 각 소스 파일 머리의 Apache-2.0 헤더로 라이선스를 밝힌다."
    stack: "Spring Boot 4.1.1, Spring Security 7.1.1"
    why: "Spring Security 팀이 관리하는 공식 예제. 샘플 하나가 기능 하나(JWT 로그인, 메서드 보안, 세션 관리)만 보여줘서 설정 파일 하나로 개념을 확인할 수 있다."
    cloneHint: "git clone --filter=blob:none https://github.com/spring-projects/spring-security-samples.git && cd spring-security-samples && git checkout 2e3f349b9a33b1b4e3d212398ef14d6383c447db && cd servlet/spring-boot/java"
  # LICENSE.txt: SPDX GPL-2.0-or-later (2026-09-19 확인). 저장소가 커서 커밋 하나만 얕게 받고 lessons 폴더만 꺼낸다
  - key: webgoat
    name: OWASP WebGoat
    url: https://github.com/WebGoat/WebGoat
    subPath: src/main/java/org/owasp/webgoat/lessons
    pinnedCommit: 872d6149d4ef29e4929c2f4eda279f7fbedc52e8
    license: GPL-2.0-or-later
    licenseNote: "GPL 계열이다. 읽기만 하고 코드를 옮겨 적지 않는다. 일부러 취약하게 만든 교육용 앱이라 실행한다면 로컬에서만 띄우고 외부 네트워크에 열지 않는다."
    stack: "Spring Boot 4.1.1, Java 25, OWASP 교육용 취약 앱"
    why: "OWASP가 만든 일부러 취약한 앱. 취약한 코드와 고친 코드를 같은 수업 안에서 나란히 볼 수 있어 인젝션, XSS, 접근 제어 실패를 코드 수준에서 구분하는 연습에 맞다."
    cloneHint: "git clone --depth 1 --filter=blob:none --no-checkout https://github.com/WebGoat/WebGoat.git && cd WebGoat && git fetch --depth 1 origin 872d6149d4ef29e4929c2f4eda279f7fbedc52e8 && git sparse-checkout set src/main/java/org/owasp/webgoat/lessons && git checkout 872d6149d4ef29e4929c2f4eda279f7fbedc52e8 && cd src/main/java/org/owasp/webgoat/lessons"

readings:
  # ---------------------------------------------------------------- modulith
  - key: READ.MODULITH.EVENT_PUBLISH.001
    repo: modulith
    path: src/main/java/example/order/OrderManagement.java
    lines: [16, 40]
    skillCodes: [SPRING.DI_IOC, SPRING.TRANSACTION]
    estimatedMinutes: 12
    question: "이 서비스는 재고 모듈을 직접 호출하지 않고 이벤트를 발행합니다. 직접 호출했을 때와 비교해서 무엇이 달라지는지 설명해 보세요."
    lookFor:
      - 모듈 사이의 의존 방향
      - 트랜잭션 경계와 이벤트 발행 시점
      - 직접 호출로 바꾸면 무엇이 깨지는지
  - key: READ.MODULITH.EVENT_LISTEN.001
    repo: modulith
    path: src/main/java/example/inventory/InventoryManagement.java
    lines: [16, 51]
    skillCodes: [SPRING.TRANSACTION.PROPAGATION, JAVA.CONCURRENCY]
    estimatedMinutes: 12
    question: "이 리스너는 1초를 쉬는 느린 작업을 흉내 냅니다. 주문을 넣은 사람이 그 1초를 기다리게 되는지 아닌지, 무엇을 보고 판단할 수 있을까요?"
    lookFor:
      - 동기 리스너와 비동기 리스너의 차이
      - 이벤트가 발행되는 시점과 처리되는 시점
      - 리스너가 느릴 때 주문 쪽에 생기는 영향
  - key: READ.MODULITH.BOUNDARY_TEST.001
    repo: modulith
    path: src/test/java/example/ModularityTests.java
    lines: [16, 40]
    skillCodes: [TESTING.SPRING_TEST, PRACTICAL_ENGINEERING.CODE_REVIEW]
    estimatedMinutes: 12
    question: "테스트 두 줄이 모듈 구조를 검사한다고 합니다. 이 테스트가 실패하게 만들려면 코드에 무엇을 어떻게 써야 할지 생각해 보세요."
    lookFor:
      - 모듈의 경계가 코드에서 무엇으로 정해지는가
      - 내부 패키지와 공개 타입의 차이
      - 구조 규칙을 테스트로 두는 이유
  - key: READ.MODULITH.EVENT_FAILURE.001
    repo: modulith
    path: src/test/java/example/order/EventPublicationRegistryTests.java
    lines: [32, 78]
    skillCodes: [SPRING.TRANSACTION, TESTING.SPRING_TEST]
    estimatedMinutes: 18
    question: "리스너가 예외를 던졌는데도 테스트는 미완료 발행이 1건 남아 있다고 단언합니다. 이 상태가 그냥 유실되는 것보다 왜 나은지 설명해 보세요."
    lookFor:
      - 이벤트 발행과 리스너 처리가 같은 트랜잭션인지
      - 실패한 리스너를 나중에 다시 돌릴 수 있는 근거
      - 내 주문 시스템에서 이런 유실이 생길 만한 지점
  # --------------------------------------------------------------- petclinic
  - key: READ.PETCLINIC.CONTROLLER_SLICE.001
    repo: petclinic
    path: src/main/java/org/springframework/samples/petclinic/owner/OwnerController.java
    lines: [48, 122]
    skillCodes: [SPRING.MVC_REST, SPRING.VALIDATION]
    estimatedMinutes: 15
    question: "이 컨트롤러는 Repository를 직접 주입받고 Service 계층이 없습니다. 이렇게 두어도 괜찮은 경우와 곤란해지는 경우를 나눠서 설명해 보세요."
    lookFor:
      - 계층을 나누는 목적
      - 트랜잭션 경계가 어디에 생기는가
      - 지금 내 프로젝트는 어느 쪽에 가까운가
  - key: READ.PETCLINIC.ENTITY_MAPPING.001
    repo: petclinic
    path: src/main/java/org/springframework/samples/petclinic/owner/Owner.java
    lines: [47, 110]
    skillCodes: [DATABASE.JPA, DATABASE.JPA.FETCH_STRATEGY, DATABASE.MODELING]
    estimatedMinutes: 15
    question: "Owner가 Pet 목록을 갖는 방식은 단방향이고 즉시 로딩입니다. 이 선택이 조회 한 번에 어떤 SQL로 이어질지 예상해서 말해 보세요."
    lookFor:
      - cascade가 무엇을 정하는가
      - EAGER와 LAZY가 만드는 쿼리 차이
      - 연관을 양방향으로 두었을 때 생기는 일
  - key: READ.PETCLINIC.WEB_SLICE_TEST.001
    repo: petclinic
    path: src/test/java/org/springframework/samples/petclinic/owner/OwnerControllerTests.java
    lines: [60, 134]
    skillCodes: [TESTING.SPRING_TEST, TESTING.TEST_DOUBLE]
    estimatedMinutes: 15
    question: "이 테스트는 Repository를 가짜로 바꾸고 웹 계층만 띄웁니다. 이렇게 잘라서 얻는 것과 대신 확인하지 못하게 되는 것을 말해 보세요."
    lookFor:
      - 슬라이스 테스트가 띄우는 빈의 범위
      - 가짜 객체를 쓸 때 검증되지 않는 것
      - 통합 테스트와의 역할 분담
  - key: READ.PETCLINIC.DATA_JPA_TEST.001
    repo: petclinic
    path: src/test/java/org/springframework/samples/petclinic/service/ClinicServiceTests.java
    lines: [72, 145]
    skillCodes: [TESTING.SPRING_TEST, DATABASE.JPA.PERSISTENCE_CONTEXT]
    estimatedMinutes: 18
    question: "테스트 메서드에 붙은 트랜잭션은 끝나면 되돌려집니다. 되돌려지는데도 저장이 되었는지를 어떻게 확인할 수 있는 것인지 설명해 보세요."
    lookFor:
      - 영속성 컨텍스트와 flush 시점
      - 롤백되는 테스트가 감추는 문제
      - 테스트 사이의 데이터 격리 방법
  - key: READ.PETCLINIC.FIND_FORM_TESTS.001
    repo: petclinic
    path: src/test/java/org/springframework/samples/petclinic/owner/OwnerControllerTests.java
    lines: [144, 196]
    skillCodes: [TESTING.UNIT_TEST_DESIGN, TESTING.JUNIT, TESTING.TEST_DOUBLE]
    estimatedMinutes: 15
    question: "성으로 주인을 찾는 기능 하나에 테스트가 다섯 개 있습니다. 각 테스트가 어떤 입력과 결과의 경계를 겨냥하는지 나눠 보고, 여기에 없지만 있어야 한다고 생각하는 경우가 있다면 무엇인지 근거와 함께 말해 보세요."
    lookFor:
      - 결과가 0건, 1건, 여러 건일 때 응답이 어떻게 갈리는가
      - 앞뒤 공백 같은 입력 정리를 테스트로 고정하는 방식
      - stub(when)과 호출 검증(verify)을 각각 언제 썼는가
  - key: READ.PETCLINIC.CONSTRAINT_TESTS.001
    repo: petclinic
    path: src/test/java/org/springframework/samples/petclinic/service/ClinicServiceTests.java
    lines: [253, 313]
