# DevPilot 오늘의 팁 — 실무에서 자주 보는 증상 하나와 그 원인
# Spec: docs/19-content-spec.md §3.9 (schema), §4.1 CV-90~CV-96 (검증)
# Screen: docs/02 SCR-TODAY · API: docs/05 §20 · 선택 규칙: docs/06 §5.12
#
# - 한 팁 한 증상. symptom 이 둘이면 팁을 둘로 나눈다
# - sourceUrl 과 experiment 중 하나 이상이 반드시 있다 (CV-91)
# - example 은 15줄 이하이고 정답 코드를 그대로 주지 않는다
tips:
  - key: TIP.ERROR_READING.STACK_TRACE_BOTTOM.001
    series: ERROR_READING
    level: BASIC
    skillCodes: [JAVA.EXCEPTION.TRY_WITH_RESOURCES]
    title: 스택 추적은 위가 아니라 아래부터 읽는다
    symptom: |-
      로그에 스택 추적이 80줄 찍혔는데 맨 윗줄이 프레임워크 클래스라 내 코드가 안 보인다.
    cause: |-
      스택 추적은 **가장 최근 호출이 맨 위**다. 그래서 맨 위는 대개 예외를 던진 라이브러리 안쪽이고,
      내가 고칠 수 있는 줄은 그 아래 어딘가에 있다.
      `Caused by:`가 있으면 더 중요하다 — **맨 아래 `Caused by:`가 진짜 원인**이고 위쪽은 그것을 감싸 다시 던진 것이다.
      읽는 순서는 맨 아래 `Caused by:` → 거기서 내 패키지 이름이 처음 나오는 줄이다.
    example: |-
      ```text
      org.springframework.dao.DataIntegrityViolationException: could not execute statement
          at org.springframework.orm.jpa...      ← 여기부터 읽으면 헤맨다
          at com.example.order.OrderService.place(OrderService.java:52)   ← 내 코드
      Caused by: org.postgresql.util.PSQLException:
          ERROR: null value in column "recipient" violates not-null constraint   ← 진짜 원인
      ```
    whereToLook: |-
      맨 아래 `Caused by:` 한 줄과, 내 패키지 이름이 처음 나오는 줄 — 두 곳이면 대개 끝난다.
    experiment: |-
      일부러 not null 컬럼에 null을 넣어 보고, 맨 윗줄과 맨 아래 `Caused by:` 중 어느 쪽이 원인을 말해 주는지 본다.
    estimatedMinutes: 3
    retired: false

  - key: TIP.ERROR_READING.STACK_OVERFLOW.001
    series: ERROR_READING
    level: PRACTICAL
    skillCodes: [JAVA.OOP]
    title: 같은 줄이 수백 번 반복되면 재귀를 의심한다
    symptom: |-
      `StackOverflowError`가 났는데 스택 추적이 화면을 가득 채우고 같은 메서드 두세 개가 계속 반복된다.
    cause: |-
      스택이 넘쳤다는 것은 **호출이 돌아오지 않고 계속 쌓였다**는 뜻이다. 대개 재귀가 끝나지 않는 것이고,
      직접 쓴 재귀가 아니라 **서로 부르는 두 메서드**인 경우가 더 흔하다.
      `equals`가 `hashCode`를 부르고 그 안에서 다시 `equals`를 부르거나, `toString`이 자기를 담은 필드를 찍는 식이다.
      반복되는 이름 두세 개가 곧 고리다.
    whereToLook: |-
      반복 구간에서 서로 다른 이름 두세 개를 추려 그중 무엇이 무엇을 부르는지 본다. 고리가 거기 있다.
    sourceUrl: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/StackOverflowError.html
    estimatedMinutes: 3
    retired: false

  - key: TIP.RESOURCE.OPEN_FILES.001
    series: RESOURCE
    level: PRACTICAL
    skillCodes: [PRACTICAL_ENGINEERING.RESOURCE_TIMEOUT]
    title: Too many open files는 메모리 문제가 아니다
    symptom: |-
      한동안 잘 돌던 서버가 `java.net.SocketException: Too many open files`를 내며 새 요청만 거절한다.
      기존 요청은 멀쩡히 처리된다.
    cause: |-
      연결 하나가 **파일 서술자 하나**다. 프로세스마다 열 수 있는 수에 한도가 있고, 넘으면 새로 여는 것만 실패한다.
      그래서 "일부는 되고 일부는 연결조차 안 됨"으로 보여 간헐적 네트워크 문제처럼 읽힌다.
      닫지 않은 연결이 쌓여서일 수도 있고, 동시 접속이 늘어 한도에 닿았을 수도 있다.
      메시지에 원인이 그대로 적혀 있는데도 메모리를 먼저 보게 되는 것이 이 증상의 함정이다.
    whereToLook: |-
      지금 몇 개 들고 있는지와 한도를 나란히 본다. 요청이 끝나도 수가 줄지 않으면 닫지 않은 것이다.
    experiment: |-
      한도를 아주 낮게 줄여 서버를 띄우고 동시 요청을 넣어 본다. 어느 자리에서 실패하는지가 드러난다.
    sourceUrl: https://man7.org/linux/man-pages/man5/proc_pid_limits.5.html
    estimatedMinutes: 4
    retired: false

  - key: TIP.RESOURCE.OOM_HEAP.001
    series: RESOURCE
    level: PRACTICAL
    skillCodes: [DATABASE.JPA.FETCH_STRATEGY]
    title: 목록 조회 한 번에 힙이 터진다
    symptom: |-
      주문 목록 화면을 열자 `OutOfMemoryError: Java heap space`가 나고 서버가 멈춘다. 단건 조회는 멀쩡하다.
    cause: |-
      목록은 건수가 늘면 메모리도 같이 는다. 페이지를 나누지 않고 전부 읽으면 데이터가 쌓인 만큼 그대로 힙에 올라온다.
      연관까지 즉시 로딩이면 한 건이 수십 건을 끌고 와 곱절이 된다.
      개발 DB에 100건일 때는 안 보이다가 운영에서 10만 건이 되면 그날 터진다.
      **건수에 비례해 커지는 조회**가 있으면 언젠가는 넘친다.
    whereToLook: |-
      페이지 없이 전체를 읽는 조회와, 그 안에서 연관을 몇 번 더 따라가는지 두 곳을 본다.
    sourceUrl: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/OutOfMemoryError.html
    estimatedMinutes: 4
    retired: false

  - key: TIP.LOGGING.LEVELS.001
    series: LOGGING
    level: BASIC
    skillCodes: [PRACTICAL_ENGINEERING.LOGGING]
    title: 로그 레벨은 자세함이 아니라 누가 보는가로 나눈다
    symptom: |-
      장애가 났는데 로그에는 INFO 한 줄만 남아 있고, 평소에는 DEBUG가 초당 수천 줄씩 쌓여 아무도 안 본다.
    cause: |-
      레벨을 "얼마나 자세한가"로 나누면 이렇게 된다. 기준은 **누가 언제 보는가**다.
      ERROR는 사람이 지금 봐야 하는 것, WARN은 지금은 아니어도 쌓이면 봐야 하는 것,
      INFO는 나중에 흐름을 되짚을 때 필요한 것, DEBUG는 개발 중에만 쓰는 것이다.
      이 기준으로 나누면 "장애 때 ERROR만 봐도 되는가"가 바로 확인된다.
    whereToLook: |-
      기본 레벨 설정과, 예외를 잡는 자리에서 어떤 레벨로 남기는지 두 곳을 본다.
    experiment: |-
      레벨을 한 단계 올리고 같은 요청을 한 번 보내 어떤 줄이 사라지는지 본다. 사라진 줄이 장애 때 필요했는지 묻는다.
    sourceUrl: https://docs.spring.io/spring-boot/reference/features/logging.html
    estimatedMinutes: 3
    retired: false

  - key: TIP.LOGGING.NO_TRACE.001
    series: LOGGING
    level: PRACTICAL
    skillCodes: [PRACTICAL_ENGINEERING.LOGGING]
    title: 예외를 찍었는데 원인이 안 남는다
    symptom: |-
      로그에 `주문 저장 실패: null` 한 줄만 있고 어디서 왜 났는지가 없다.
    cause: |-
      예외의 메시지만 찍고 예외 자체를 넘기지 않으면 스택 추적이 사라진다.
      `log.error("...: " + e.getMessage())`가 그 모양이고, 메시지가 없는 예외(`NullPointerException` 등)면 `null`만 남는다.
      로깅 API는 마지막 인자로 예외를 받으면 스택 추적을 같이 남긴다.
      한 글자 차이인데 장애 때 있는 것과 없는 것이 갈린다.
    example: |-
      ```java
      // 원인이 사라진다
      log.error("주문 저장 실패: " + e.getMessage());

      // 스택 추적이 남는다 — 마지막 인자로 예외를 넘긴다
      log.error("주문 저장 실패 orderId={}", orderId, e);
      ```
    whereToLook: |-
      `catch` 블록을 훑어 예외 변수가 마지막 인자로 넘어가는지 본다. 문자열에 이어 붙였으면 거기가 사라진 자리다.
    sourceUrl: https://docs.spring.io/spring-boot/reference/features/logging.html
    estimatedMinutes: 3
    retired: false

  - key: TIP.HTTP_INTEGRATION.RETRY_409.001
    series: HTTP_INTEGRATION
    level: PRACTICAL
    skillCodes: [WEB_HTTP.IDEMPOTENCY]
    title: 타임아웃 뒤 재시도로 두 번 결제된다
    symptom: |-
      결제 API가 응답 없이 타임아웃 나서 다시 걸었더니 결제가 두 건 잡혔다.
    cause: |-
      타임아웃은 **실패했다는 뜻이 아니다.** 요청은 갔고 처리도 됐는데 응답만 못 받았을 수 있다.
      그래서 그냥 다시 걸면 같은 일이 두 번 일어난다.
      다시 걸어도 안전하려면 요청에 **같은 요청임을 알리는 키**를 붙여, 받는 쪽이 두 번째를 같은 결과로 돌려주게 해야 한다.
      조회는 다시 걸어도 되지만 결제·주문 생성은 아니다.
    whereToLook: |-
      재시도가 걸린 자리마다 "이 요청을 두 번 보내도 되는가"를 묻는다. 안 되면 키를 붙이거나 재시도를 빼야 한다.
    sourceUrl: https://www.rfc-editor.org/rfc/rfc9110.html
    estimatedMinutes: 4
    retired: false

  - key: TIP.HTTP_INTEGRATION.CORS_PREFLIGHT.001
    series: HTTP_INTEGRATION
    level: BASIC
    skillCodes: [WEB_HTTP.CORS]
    title: 브라우저에서만 막히고 curl로는 된다
    symptom: |-
      curl로는 200이 오는 API가 브라우저에서만 CORS 오류로 막힌다. 개발자 도구에 OPTIONS 요청이 하나 더 보인다.
    cause: |-
      CORS는 **브라우저가 거는 제한**이다. curl은 그 규칙을 지키지 않으므로 통과한다.
      게다가 `Content-Type: application/json`이나 커스텀 헤더가 있으면 브라우저가 본 요청 전에 `OPTIONS`로 먼저 묻는다.
      그 사전 요청이 막히면 본 요청은 아예 나가지도 않는다.
      그래서 서버 로그에 본 요청이 안 보이는 것이 정상이고, 그것 때문에 "요청이 안 왔다"고 오해하게 된다.
    whereToLook: |-
      개발자 도구 네트워크 탭에서 `OPTIONS` 응답의 상태 코드와 허용 헤더를 본다. 본 요청이 아니라 거기가 먼저다.
    sourceUrl: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
    estimatedMinutes: 3
    retired: false

  - key: TIP.DATABASE.COMPOSITE_INDEX_ORDER.001
    series: DATABASE
    level: PRACTICAL
    skillCodes: [DATABASE.INDEX.EXPLAIN_PLAN]
    title: 인덱스를 걸었는데 안 탄다
    symptom: |-
      `(status, created_at)` 인덱스를 만들었는데 `created_at`으로만 조회하면 여전히 전체를 훑는다.
    cause: |-
      여러 컬럼 인덱스는 **앞 컬럼부터 차례로** 쓴다. 전화번호부가 성으로 먼저 정렬돼 있어서
      이름만으로는 못 찾는 것과 같다.
      `(status, created_at)`은 `status`만, 또는 `status`와 `created_at`을 같이 쓸 때 탄다.
      `created_at`만 쓰는 조회가 있으면 그 컬럼이 앞에 오는 인덱스가 따로 필요하다.
      컬럼 순서가 곧 그 인덱스가 답할 수 있는 질문의 범위다.
    whereToLook: |-
      실행 계획을 떠서 그 인덱스를 실제로 쓰는지 보고, 안 쓰면 조회 조건의 컬럼 순서와 인덱스 순서를 맞춰 본다.
    experiment: |-
      같은 표에 순서만 바꾼 인덱스를 하나 더 만들고 두 조회의 실행 계획을 비교해 본다.
    sourceUrl: https://www.postgresql.org/docs/16/indexes-multicolumn.html
    estimatedMinutes: 5
    retired: false

  - key: TIP.DATABASE.SELF_INVOCATION.001
    series: DATABASE
    level: PRACTICAL
    skillCodes: [SPRING.TRANSACTION.PROPAGATION]
    title: 트랜잭션 애노테이션이 안 듣는다
    symptom: |-
      메서드에 트랜잭션을 걸었는데 중간에 실패해도 앞의 저장이 롤백되지 않고 남는다.
    cause: |-
      선언적 트랜잭션은 **프록시**가 건다. 바깥에서 그 메서드를 부르면 프록시를 지나가므로 걸리지만,
      **같은 클래스 안에서 부르면** 프록시를 거치지 않아 애노테이션이 아무 일도 하지 않는다.
      `this.save()` 같은 내부 호출이 그 모양이다.
      애노테이션이 붙어 있는데 안 듣는 가장 흔한 이유이고, 코드만 봐서는 잘 안 보인다.
    whereToLook: |-
      그 메서드를 누가 부르는지 따라가 본다. 같은 클래스 안이면 그 자리가 원인이다.
    sourceUrl: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
    estimatedMinutes: 4
    retired: false

  - key: TIP.OPERATIONS.HEALTHCHECK.001
    series: OPERATIONS
    level: BASIC
    skillCodes: [DEVOPS.DOCKER]
    title: 헬스체크가 통과하는데 서비스는 안 된다
    symptom: |-
      배포 후 헬스체크는 계속 초록인데 실제 API는 500을 낸다.
    cause: |-
      기본 헬스체크는 대개 **프로세스가 떠 있는가**만 본다. DB에 붙는지, 바깥 API가 닿는지까지는 안 본다.
      그래서 DB 비밀번호가 틀려도 헬스체크는 통과한다.
      무엇을 "건강하다"로 볼지 정해 두지 않으면, 헬스체크는 배포가 끝났다는 신호일 뿐 서비스가 된다는 신호가 아니다.
    whereToLook: |-
      헬스체크 응답을 직접 열어 어떤 항목이 들어 있는지 본다. DB 항목이 없으면 그것부터다.
    sourceUrl: https://docs.spring.io/spring-boot/reference/actuator/endpoints.html
    estimatedMinutes: 3
    retired: false

  - key: TIP.OPERATIONS.DOCKER_LAYER_CACHE.001
    series: OPERATIONS
    level: BASIC
    skillCodes: [DEVOPS.DOCKER]
    title: 코드 한 줄 고쳤는데 빌드가 5분 걸린다
    symptom: |-
      소스 한 줄만 바꿨는데 도커 빌드가 의존성을 처음부터 전부 다시 받는다.
    cause: |-
        도커는 명령 한 줄을 **층** 하나로 만들고, 바뀐 층부터 아래를 전부 다시 만든다.
        소스를 먼저 복사하고 의존성을 받으면, 소스가 바뀔 때마다 의존성 층이 같이 무효가 된다.
        **덜 바뀌는 것을 위에, 자주 바뀌는 것을 아래에** 두면 대부분의 빌드에서 의존성 층이 그대로 재사용된다.
        순서만 바꾸는 일인데 빌드 시간이 분 단위로 달라진다.
    whereToLook: |-
      Dockerfile에서 소스를 복사하는 줄과 의존성을 받는 줄의 순서를 본다.
    experiment: |-
      순서를 바꿔 두 번씩 빌드해 보고 두 번째 빌드에서 `CACHED`가 몇 줄 나오는지 비교한다.
    sourceUrl: https://docs.docker.com/build/cache/
    estimatedMinutes: 4
    retired: false

  - key: TIP.CONVENTION.COMMIT_MESSAGE.001
    series: CONVENTION
    level: BASIC
    skillCodes: [DEVOPS.GIT]
    title: 몇 달 뒤 기록을 볼 때 쓸모 있는 커밋 메시지
    symptom: |-
      `git log`를 열었더니 "수정", "버그 픽스", "ㅇㅇ"만 줄줄이 나와 어느 커밋이 무엇을 바꿨는지 알 수 없다.
    cause: |-
      커밋 메시지는 **나중에 읽는 사람**을 위한 것이고, 대개 그 사람은 몇 달 뒤의 자신이다.
      제목 한 줄에는 "무엇을 바꿨는가"를, 본문에는 "왜"를 적는다 — 무엇은 코드에 남지만 왜는 어디에도 안 남는다.
      제목과 본문 사이에 빈 줄을 두는 것은 관례가 아니라 형식이다. 도구가 그 줄로 제목을 잘라 낸다.
    whereToLook: |-
      지금 저장소의 최근 커밋 10개를 열어 제목만 보고 무엇이 바뀌었는지 맞힐 수 있는지 본다.
