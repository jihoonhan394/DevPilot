# DevPilot 과제 체크리스트 — 자바 백엔드 0~2단계
# Spec: docs/19-content-spec.md §3.11 · 응답: docs/05 §8.1 MainTaskView.checklist
#
# - 저장하지 않는다. 과제 카드를 만들 때 콘텐츠 최신본을 읽어 붙인다
# - 질문형("…했나")으로 쓴다. 지시문이 아니다
# - **그 문제의 해답이 아니라 어디서나 통하는 관례**를 쓴다. 특정 challenge의 정답을 흘리지 않는다
# - 같은 (taskType, skill) 조합은 하나만 둔다 — 여럿이면 key ASC 첫 번째만 붙는다
checklists:
  # ── 0단계 기반 다지기 ──────────────────────────────────────────────
  - key: CHK.API.DESIGN
    taskTypes: [CHALLENGE, PROJECT_TASK]
    skillCodes: [WEB_HTTP.REST_API_DESIGN, SPRING.MVC_REST]
    before:
      - 이 API가 무엇을 돌려주는지 한 문장으로 적었나
      - 경로를 복수 명사·소문자로 정했나
      - 이 동작에 맞는 메서드와 성공 상태 코드를 먼저 정했나
      - 요청과 응답을 도메인 객체가 아니라 전용 타입으로 둘 자리를 정했나
    after:
      - 실패했을 때의 응답 형식을 성공과 같은 모양으로 맞췄나
      - 같은 요청을 두 번 보내도 결과가 같은지 확인했나
      - 목록 응답에 개수 상한이나 페이지 기준을 넣었나
      - 직접 눌러 보고 상태 코드와 본문을 눈으로 확인했나

  - key: CHK.HTTP.BASICS
    taskTypes: [CHALLENGE, PROJECT_TASK, REDO]
    skillCodes: [WEB_HTTP.HTTP_BASICS, WEB_HTTP.CORS]
    before:
      - 요청이 어디서 출발해 어디로 가는지 그려 봤나
      - 성공과 실패에 각각 어떤 상태 코드를 줄지 정했나
      - 브라우저가 자동으로 붙이는 헤더와 코드가 붙이는 헤더를 갈랐나
    after:
      - 개발자도구에서 실제로 나간 요청 헤더를 확인했나
      - 서버 로그와 브라우저 콘솔을 둘 다 봤나
      - curl처럼 브라우저가 아닌 것으로도 같은 요청을 보내 봤나

  - key: CHK.SPRING.WIRING
    taskTypes: [CHALLENGE, PROJECT_TASK]
    skillCodes: [SPRING.DI_IOC, SPRING.BOOT_CONFIG]
    before:
      - 이 객체를 누가 만들어 주는지 말할 수 있나
      - 설정 값을 코드에 적지 않고 밖에서 받을 자리를 정했나
      - 환경마다 달라지는 값과 그렇지 않은 값을 갈랐나
    after:
      - 기동 로그에서 이 빈이 실제로 올라온 것을 확인했나
      - 비밀 값이 코드나 로그에 남지 않았는지 훑었나
      - 설정을 빼먹었을 때 기동이 실패하는지 확인했나

  - key: CHK.TESTING.UNIT
    taskTypes: [CHALLENGE, PROJECT_TASK, REDO]
    skillCodes: [TESTING.JUNIT, TESTING.UNIT_TEST_DESIGN, TESTING.SPRING_TEST]
    before:
      - 이 테스트가 무엇이 깨지면 실패해야 하는지 적었나
      - 준비·실행·확인을 나눌 자리를 정했나
      - 실제로 쓸 값과 가짜로 둘 값을 갈랐나
    after:
      - 구현을 일부러 망가뜨렸을 때 테스트가 실패하는지 봤나
      - 테스트 이름만 읽고도 무엇을 지키는지 알 수 있나
      - 실행 순서를 바꿔도 통과하는지 확인했나

  - key: CHK.JAVA.DESIGN
    taskTypes: [CHALLENGE, PROJECT_TASK]
    skillCodes: [JAVA.OOP, JAVA.MODERN_SYNTAX, JAVA.GENERICS]
    before:
      - 이 타입이 책임지는 것 하나를 말할 수 있나
      - 바뀌면 안 되는 값과 바뀌는 값을 갈랐나
      - 바깥에 열어야 하는 것만 열기로 정했나
    after:
      - 값을 넣는 쪽이 잘못된 상태를 만들 수 없게 막았나
      - 이름만 읽고 무엇인지 알 수 있는지 다시 봤나
      - 같은 일을 하는 코드가 두 곳에 남지 않았나

  - key: CHK.DEVOPS.REPO
    taskTypes: [CHALLENGE, PROJECT_TASK, REDO]
    skillCodes: [DEVOPS.GIT, DEVOPS.BUILD_GRADLE]
    before:
      - 이 변경이 한 가지 일만 하는지 확인했나
      - 커밋에 들어가면 안 되는 파일을 제외했나
      - 빌드가 어떤 명령 하나로 도는지 알고 있나
    after:
      - 받는 사람이 무엇이 왜 바뀌었는지 알 수 있게 적었나
      - 깨끗한 상태에서 빌드와 테스트가 도는지 확인했나
      - 비밀 값이 기록에 남지 않았는지 훑었나

  # ── 1단계 회원과 인증 ─────────────────────────────────────────────
  - key: CHK.SECURITY.AUTH
    taskTypes: [CHALLENGE, PROJECT_TASK, REDO]
    skillCodes:
      - WEB_HTTP.AUTH_SESSION_TOKEN
      - SECURITY.AUTHN_AUTHZ
      - SPRING.SECURITY
      - SPRING.SECURITY.JWT_RESOURCE_SERVER
    before:
      - 누구인지 확인하는 일과 무엇을 해도 되는지 정하는 일을 갈랐나
      - 로그인 상태를 서버에 둘지 클라이언트에 둘지 정하고 이유를 적었나
      - 비밀번호를 되돌릴 수 없게 저장하기로 했나
    after:
      - 표시 없이 부르면 401, 남의 자원을 부르면 403이나 404가 되는지 확인했나
      - 화면을 거치지 않고 직접 불러도 막히는지 확인했나
      - 자원을 다루는 곳에서 소유자를 함께 조회했나
      - 무엇을 고르고 무엇을 포기했는지 기록에 남겼나

  - key: CHK.SECURITY.INPUT
    taskTypes: [CHALLENGE, PROJECT_TASK]
    skillCodes: [SECURITY.INPUT_VALIDATION, SPRING.VALIDATION, SECURITY.OWASP_TOP10]
    before:
      - 각 입력에 들어올 수 있는 최악의 값을 떠올려 봤나
      - 막을 것을 고르지 않고 허용할 것을 정하기로 했나
      - 형식 검사로 막을 수 없는 것이 무엇인지 갈랐나
    after:
      - 잘못된 요청에 400을 돌려주는지 확인했나
      - 질의에 값을 문자열로 이어 붙인 자리가 없는지 훑었나
      - 컬럼 이름처럼 구조에 해당하는 입력을 허용 목록으로 걸렀나

  - key: CHK.SECURITY.SECRETS
    taskTypes: [CHALLENGE, PROJECT_TASK]
    skillCodes: [SECURITY.SECRET_MANAGEMENT, SECURITY.SENSITIVE_DATA_LOGGING]
    before:
      - 새면 곤란한 값이 무엇인지 적었나
      - 그 값을 코드 밖에서 받을 자리를 정했나
      - 로그에 남기면 안 되는 필드를 정했나
    after:
      - 설정 파일에 값이 아니라 이름만 남았는지 확인했나
      - 요청 본문을 통째로 찍는 자리가 없는지 훑었나
      - 오류 응답에 내부 구조가 새지 않는지 확인했나

  # ── 2단계 상품과 CRUD ─────────────────────────────────────────────
  - key: CHK.DATABASE.MODEL
    taskTypes: [CHALLENGE, PROJECT_TASK]
    skillCodes: [DATABASE.MODELING, DATABASE.JPA, DATABASE.JPA.PERSISTENCE_CONTEXT]
    before:
      - 이 표가 무엇 하나를 담는지 말할 수 있나
      - 어느 쪽이 관계를 들고 있을지 정했나
      - 지금 필요 없는 칸을 빼기로 했나
    after:
      - 목록을 불러올 때 질의가 몇 번 나가는지 확인했나
      - 없는 값을 다루는 자리를 정하고 지켰나
      - 표를 고치는 변경을 되돌릴 수 있게 남겼나

  - key: CHK.DATABASE.QUERY
    taskTypes: [CHALLENGE, PROJECT_TASK, REDO]
    skillCodes: [DATABASE.SQL_BASICS, SPRING.DATA_JPA]
    before:
      - 무엇을 묻는 질의인지 한 문장으로 적었나
      - 필요한 칸만 고르기로 했나
      - 값이 없을 수 있는 칸을 어떻게 다룰지 정했나
    after:
      - 바꾸기 전에 몇 건이 걸리는지 세어 봤나
      - 정렬 없이 개수만 제한한 자리가 없는지 확인했나
      - 결과가 0건일 때와 많을 때를 둘 다 눌러 봤나

  - key: CHK.ERROR.BOUNDARY
    taskTypes: [CHALLENGE, PROJECT_TASK]
    skillCodes:
      - SPRING.EXCEPTION_HANDLING
      - JAVA.EXCEPTION
      - PRACTICAL_ENGINEERING.NULL_BOUNDARY
    before:
      - 이 실패가 요청 잘못인지 서버 잘못인지 갈랐나
      - 어디서 잡고 어디로 올릴지 정했나
      - 없는 값을 어디까지 흘려보낼지 정했나
    after:
      - 응답에 스택이나 내부 이름이 담기지 않았는지 확인했나
      - 로그에는 원인을 남기고 응답에는 남기지 않았나
      - 같은 실패에 늘 같은 코드가 나가는지 확인했나

  - key: CHK.JAVA.COLLECTION
    taskTypes: [CHALLENGE, PROJECT_TASK]
    skillCodes: [JAVA.COLLECTION, JAVA.OPTIONAL, TESTING.TEST_DOUBLE]
    before:
      - 순서와 중복이 의미가 있는지 정했나
      - 없을 수 있는 값을 어떤 타입으로 돌려줄지 정했나
      - 진짜로 쓸 것과 가짜로 둘 것을 갈랐나
    after:
      - 바깥에서 내부 목록을 바꿀 수 있는 자리가 없는지 확인했나
      - 비어 있을 때의 동작을 확인했나
      - 가짜가 진짜와 다르게 동작하는 자리를 적어 뒀나
