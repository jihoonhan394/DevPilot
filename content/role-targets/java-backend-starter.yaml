# DevPilot role skill targets — JAVA_BACKEND_STARTER (Java 백엔드 입문)
# Spec: docs/19-content-spec.md §3.3 · §10.4 A, docs/06-learning-engine-rules.md §5.3
# 기준: 작은 기능을 도움 없이 고치고 테스트하고 배포한 뒤 스스로 확인할 수 있는 수준.
#       장애가 나면 로그와 DB를 눌러 원인을 좁히고 무슨 일이 있었는지 설명할 수 있다.
# - 이 트랙은 기본 트랙(JAVA_BACKEND)의 **낮은 수준판**이다. 같은 skill의 축별 목표는 기본 트랙 값 이하다(CV-26, §10.4 A).
#   기본 트랙 목표와 같은 축은 이 트랙이 실제로 그 수준까지 가야 하는 자리뿐이다(로그, Docker 구현, 설명 축 일부).
# - 트랙 기본값(06 §5.3): maxTaskDifficulty 3 / readCodeMinKnowledge 2 / basicTipsFirst true.
#   난이도 3까지만 제안되므로 구현 목표는 3을 넘기지 않는다. KNOWLEDGE 2가 코드 읽기의 문턱이라
#   MUST의 KNOWLEDGE는 최소 2로 둔다 — 그래야 READ_CODE가 열린다.
# - "공부는 했지만 운영에서 만져 본 적이 없다"는 사람을 기준으로 **읽기보다 손**에 무게를 둔다.
#   그래서 MUST의 IMPLEMENTATION은 2~3이고, KNOWLEDGE를 4로 올리는 대신 그 몫을 구현·디버깅에 쓴다.
# - 필수 목표 합계(06 §4.2 requiredMinutes, planning level 0 기준) = 9773분 = 162.9시간 (기준 9000~12000분)
#   같은 계산으로 JAVA_BACKEND는 33483분(558.0시간)이다. 이 트랙은 그 29.2%다.
#   평일 60분·주말 240분(주 780분)이면 약 12.5주 분량이다.
# - MUST 20개 = 기술 16개 + EXPLANATION 4개.
#   기술 16개는 Java 기본(객체·컬렉션·예외) 3, Spring 요청 흐름과 계층 2, 검증·오류 처리 2,
#   SQL과 트랜잭션 기초 2, HTTP 기본 1, JUnit 1, Git·코드 리뷰 2, 리눅스 1, Docker 1, 로그 1이다.
#   §3.3의 "MUST 14개 안팎"은 이 **기술 MUST** 기준으로 읽는다. EXPLANATION 4개는 트랙과 무관한
#   DEC-14 기본값이라 따로 센다.
# - 알고리즘·JPA 심화·JVM 심화·시스템 설계·연동·보안 심화는 LATER다. ALGORITHM이 SHOULD가 아니므로
#   CV-24 WARN 4건이 뜬다(의도한 구성, 19 §10.1 — 입문 단계에서 알고리즘 문제 풀이는 목표가 아니다).
# - DEC-14: EXPLANATION = MUST (설명이 러버덕 루프의 중심이다)
# - LATER 항목도 prerequisite로 쓰이는 skill은 IMPLEMENTATION 2로 둔다. 2 미만이면 readiness에
#   영원히 닿지 못해 뒤 skill이 열리지 않는다(CV-18과 같은 이유, 06 §5.4).
# - 순서: skill tree 파일 순서와 같게 유지한다 (검증 규칙은 아님)
