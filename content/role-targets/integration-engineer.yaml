# DevPilot role skill targets — INTEGRATION_ENGINEER (연동·구축 엔지니어)
# Spec: docs/19-content-spec.md §3.3 · §10.4 A, docs/06-learning-engine-rules.md §5.3
# 기준: 이미 돌아가는 시스템에 기능을 붙이고 데이터를 주고받는 일을 혼자 맡아 끝내고 설명할 수 있는 수준
# - 기본 트랙(JAVA_BACKEND)의 낮은 수준판이 아니라 **다른 구성**이다. 축별 목표를 기본 트랙과 비교하지 않는다(CV-26 대상 아님)
# - MUST 구성 비율(필수 목표 합계 기준): 기본기 70% / 연동 20% / 배포·운영 10%
#   기본기 = INTEGRATION·DEVOPS를 뺀 나머지 category, 연동 = INTEGRATION, 배포·운영 = DEVOPS
# - 필수 목표 합계(06 §4.2 requiredMinutes, planning level 0 기준) = 12850분 = 214.2시간 (기준 180~220시간)
#   기본기 8992분 (70.0%) / 연동 2535분 (19.7%) / 배포·운영 1323분 (10.3%)
# - 기본기 안의 비중 순서: Spring 핵심 > DB > HTTP·인증 > Java 기본 > 테스트 > 설명 (배포·운영은 별도 10% 몫)
#   시스템 설계 기초는 이 순서의 끝이라 180~220시간 안에 MUST로 넣지 못했다. SYSTEM_DESIGN은 SHOULD로 두고
#   계획 템플릿의 "확장 구조" milestone에서 다룬다
# - 깊이는 연동(INTEGRATION) skill이 가져간다. 기본기는 "읽고 고칠 수 있다(구현 2)" 수준을 목표로 두고,
#   대신 넓게 덮는다. 난이도 상한 4(06 §5.3)와 같은 생각이다
# - 알고리즘·JVM 심화·JPA 심화는 LATER. ALGORITHM이 SHOULD가 아니므로 CV-24 WARN이 뜬다(의도한 구성, 19 §10.1)
# - DEC-14: EXPLANATION = MUST
# - 순서: skill tree 파일 순서와 같게 유지한다 (검증 규칙은 아님)
