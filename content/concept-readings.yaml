    estimatedMinutes: 30
    whyRead: |-
      로그인 뒤의 상태를 어떻게 유지할지 규칙으로 정할 수 있게 된다. 세션 식별자를 어떻게 만들고 언제 새로
      발급하며 언제 끊을지 알면 탈취와 고정 공격을 막는 기준을 세울 수 있다.
    checkPoints:
      - 로그인에 성공한 직후 세션 식별자를 새로 발급하라고 하는 이유를 적어 보세요
      - 세션을 끝내야 하는 시점을 두 가지 이상 적어 보세요
      - 내 서비스의 로그아웃이 서버에서 무엇을 지우는지 확인하고 적어 보세요
    verifiedAt: 2026-09-21
    retired: false
  # ------------------------------------------------------------- WEB_HTTP.IDEMPOTENCY
  - key: DOC.HTTP.PUT_SEMANTICS.001
    title: RFC 9110 HTTP Semantics — 9.3.4. PUT
    url: https://www.rfc-editor.org/rfc/rfc9110.html#name-put
    publisher: IETF (RFC Editor)
    versionScope: RFC 9110 (2022-06)
    skillCodes: [WEB_HTTP.IDEMPOTENCY]
    estimatedMinutes: 20
    whyRead: |-
      같은 요청을 다시 보내도 되는 끝점을 스스로 만들 수 있게 된다. 대상 자원을 보낸 값으로 만든다는 정의를
      잡으면 왜 두 번 보내도 결과가 같은지, 왜 새로 만들기만 하는 끝점은 그렇지 않은지 설명된다.
    checkPoints:
      - 이 메서드가 서버에 남기는 결과가 새로 만들기만 하는 요청과 어떻게 다른지 적어 보세요
      - 같은 요청을 두 번 보냈을 때 자원과 응답이 각각 어떻게 되는지 적어 보세요
      - 내 API에서 재시도되면 값이 두 번 쌓이는 끝점을 찾아 어떻게 바꿀지 적어 보세요
    verifiedAt: 2026-09-21
    retired: false
  - key: DOC.HTTP.CONDITIONAL_REQUESTS.001
    title: RFC 9110 HTTP Semantics — 13. Conditional Requests
    url: https://www.rfc-editor.org/rfc/rfc9110.html#name-conditional-requests
    publisher: IETF (RFC Editor)
    versionScope: RFC 9110 (2022-06)
    skillCodes: [WEB_HTTP.IDEMPOTENCY]
    estimatedMinutes: 30
    whyRead: |-
      재시도와 동시 수정이 겹칠 때 덮어쓰기를 막을 수 있게 된다. 자원의 현재 상태를 가리키는 값을 받아
      조건이 맞을 때만 바꾸는 방법을 알면 늦게 도착한 요청이 앞선 변경을 지우는 일을 미리 막는다.
    checkPoints:
      - 자원의 상태를 가리키는 검증자 값이 무엇을 뜻하는지 한 줄로 적어 보세요
      - 조건이 맞지 않을 때 서버가 돌려주는 상태 코드와 그 뜻을 적어 보세요
      - 내 수정 API 하나를 골라 조건부 요청을 어떻게 적용할지 적어 보세요
    verifiedAt: 2026-09-21
    retired: false
  # ------------------------------------------------------- PRACTICAL_ENGINEERING.LOGGING
  - key: DOC.SPRING.LOGGING.001
    title: Spring Boot Reference — Logging
    url: https://docs.spring.io/spring-boot/reference/features/logging.html
    publisher: Spring (Broadcom)
    versionScope: Spring Boot 4.1.x
    skillCodes: [PRACTICAL_ENGINEERING.LOGGING]
    estimatedMinutes: 25
    whyRead: |-
      로그 수준을 감으로 정하지 않게 된다. 수준마다 무엇을 남기고 어느 묶음만 더 자세히 볼지 설정으로 바꾸는
      방법을 알면 평소에는 조용하다가 장애 때 필요한 줄만 켤 수 있다.
    checkPoints:
      - 로그 수준을 패키지나 묶음마다 다르게 주는 방법을 적어 보세요
      - 평소에 켜 둘 수준과 문제를 볼 때만 올릴 수준을 나눠 적어 보세요
      - 내 서비스에서 지금 너무 많이 남는 로그를 하나 찾아 어떻게 바꿀지 적어 보세요
    verifiedAt: 2026-09-21
    retired: false
  # --------------------------------------------------- PRACTICAL_ENGINEERING.CODE_REVIEW
  - key: DOC.REVIEW.RESPONSIBILITIES.001
    title: OpenJDK Developers' Guide — Responsibilities of a Reviewer
    url: https://openjdk.org/guide/#responsibilities-of-a-reviewer
    publisher: OpenJDK
    versionScope: 버전 없음 (2026-09-21 기준 내용)
    skillCodes: [PRACTICAL_ENGINEERING.CODE_REVIEW]
    estimatedMinutes: 15
    whyRead: |-
      리뷰를 오타 찾기로 두지 않게 된다. 승인한 사람이 그 변경의 결과까지 책임진다는 전제에서 무엇을 보고,
      잘 모르는 영역이면 어떻게 해야 하는지 적혀 있어 내 리뷰 기준을 세울 수 있다.
    checkPoints:
      - 승인한 변경에 대해 리뷰어가 어디까지 책임진다고 적혀 있는지 적어 보세요
      - 잘 모르는 영역의 변경을 받았을 때 리뷰어가 할 일을 적어 보세요
      - 내가 다음 리뷰에서 코드 말고 함께 볼 것을 정하고 이유를 적어 보세요
    verifiedAt: 2026-09-21
    retired: false
  # ---------------------------------------------------------------- JAVA.COLLECTION
  - key: DOC.JAVA.OBJECT_CONTRACT.001
    title: Java SE 25 API Documentation — Class Object (java.lang)
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html
    publisher: Oracle
    versionScope: Java SE 25
    skillCodes: [JAVA.COLLECTION]
    estimatedMinutes: 20
    whyRead: |-
      Set과 Map이 왜 내 객체를 중복으로 담는지 설명할 수 있게 된다. equals와 hashCode가 지켜야 한다고 적힌
      약속을 읽으면, 자료구조가 값을 찾는 방식과 그 약속을 어겼을 때 생기는 일을 이을 수 있다.
    checkPoints:
      - equals가 지켜야 하는 성질을 세 가지 이상 적어 보세요
      - equals가 같다고 본 두 객체의 hashCode는 어때야 하는지, 그 반대도 성립하는지 적어 보세요
      - 내 클래스 하나를 골라 Set에 넣어도 되는지 판단하고 이유를 적어 보세요
    verifiedAt: 2026-09-21
    retired: false
  # ----------------------------------------------------------------------- JAVA.OOP
  - key: DOC.JAVA.OVERRIDING.001
    title: The Java Language Specification, Java SE 25 Edition — 8.4.8. Inheritance, Overriding, and Hiding
    url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.8
    publisher: Oracle
    versionScope: Java SE 25 (JLS)
    skillCodes: [JAVA.OOP]
    estimatedMinutes: 25
    whyRead: |-
      상속을 쓸 때 무엇이 바뀌고 무엇이 그대로인지 규칙으로 말할 수 있게 된다. 재정의가 성립하는 조건과
      정적 메서드가 가려지는 것의 차이를 알면 부모 타입으로 불렀을 때 어느 코드가 도는지 설명할 수 있다.
    checkPoints:
      - 재정의한 메서드가 부모보다 좁게 만들 수 없는 것이 무엇인지 적어 보세요
      - 인스턴스 메서드의 재정의와 정적 메서드의 가리기가 호출 때 어떻게 다른지 적어 보세요
      - 내 코드에서 상속으로 푼 것 하나를 골라 구성으로 바꿀 수 있는지 적어 보세요
    verifiedAt: 2026-09-21
    retired: false
