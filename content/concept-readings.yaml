    whyRead: |-
      서버에서 Permission denied를 만났을 때 무엇이 막혔는지 읽어 낼 수 있게 된다. 권한 표기 열 자리가
      누구의 어떤 권한인지, 숫자 표기와 기호 표기가 어떻게 같은 것을 가리키는지 알면 무작정 모두에게
      권한을 여는 대신 필요한 자리만 열 수 있다.
    checkPoints:
      - 숫자 표기 세 자리가 각각 누구의 권한이고 4, 2, 1이 무엇을 뜻하는지 적어 보세요
      - 기호 표기에서 더하기와 등호가 결과를 어떻게 다르게 만드는지 적어 보세요
      - 내 서버의 애플리케이션 디렉터리와 로그 파일에 어떤 권한이 적당한지 정하고 이유를 적어 보세요
