      - 내 서비스가 평문 요청을 받았을 때 무엇을 할지 정하고 이유를 적어 보세요
    verifiedAt: 2026-09-21
    retired: false
  # ------------------------------------------------------------- DATABASE.MODELING
  - key: DOC.DDL.CONSTRAINTS.001
