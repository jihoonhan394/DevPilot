      - 같은 클래스의 다른 메서드를 직접 부르면 트랜잭션이 어떻게 되는지 이유와 함께 적어 보세요
      - 내 서비스 메서드 하나를 골라 트랜잭션이 실제로 걸리는지 무엇으로 확인할지 적어 보세요
