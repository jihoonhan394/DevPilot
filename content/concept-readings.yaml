      - 내 기능 중 실패해도 기록은 남겨야 하는 부분을 골라 어떤 전파 방식이 맞는지 적어 보세요
    verifiedAt: 2026-09-21
    retired: false
  # --------------------------------------------------------------------- TESTING.JUNIT
