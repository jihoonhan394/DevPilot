# DevPilot content catalog
# Spec: docs/19-content-spec.md §3.1
# - catalogVersion: seed 대상 파일(이 파일에 나열된 모든 파일)이 바뀌면 1 올린다 (§8)
# - YamlContentReader는 여기 나열된 파일만 읽는다. 나열 순서대로 읽는다
catalogVersion: 19
files:
  skillTrees:
    - skill-tree/java-backend.yaml
  # 학습 트랙마다 role target 파일 1개·계획 템플릿 1개 (19 §3.3·§3.4, CV-21·CV-25·CV-30)
  roleTargets:
    - role-targets/java-backend.yaml
    - role-targets/java-backend-starter.yaml
    - role-targets/integration-engineer.yaml
  planTemplates:
    - plan-templates/java-backend.yaml
    - plan-templates/java-backend-starter.yaml
    - plan-templates/integration-engineer.yaml
  reviewCards:
    - review-cards/java.yaml
    - review-cards/spring.yaml
    - review-cards/database.yaml
    - review-cards/web-http.yaml
    - review-cards/testing.yaml
    - review-cards/security.yaml
    - review-cards/practical-engineering.yaml
    - review-cards/devops.yaml
    - review-cards/integration.yaml
    - review-cards/network-cs.yaml
    - review-cards/explanation.yaml
  challenges:
    - challenges/java.yaml
    - challenges/spring.yaml
    - challenges/database.yaml
    - challenges/testing-security.yaml
    - challenges/integration.yaml
    - challenges/devops.yaml
    - challenges/practical-engineering.yaml
    - challenges/diagnostic.yaml
  # 개념 노트 (19 §3.14). 가르치는 단계의 본문이다 — 없으면 그 skill은 문제부터 나온다
  lessons:
    - lessons/database-sql.yaml
    - lessons/devops.yaml
    - lessons/java-oop.yaml
    - lessons/spring-config.yaml
    - lessons/spring-core.yaml
    - lessons/spring.yaml
    - lessons/testing-junit.yaml
    - lessons/web-http.yaml
  curatedSources: curated-sources.yaml
  # READ_CODE 과제용 저장소/읽기 목록 (19 §3.8). 서버는 저장소를 fetch하지 않는다
  curatedRepos: curated-repos.yaml
  # READING 과제가 읽을 공식 문서 목록 (19 §3.13). 선택 키이고 생략하면 같은 기본 경로를 읽는다.
  # 코드 읽기(READ.*)와 key namespace·은퇴 목록을 같이 쓴다 (CV-120)
  conceptReadings: concept-readings.yaml
# DIAGNOSTIC challenge가 반드시 있어야 하는 카테고리 (CV-59). 제안 로직은 challenge skills의 category로 고른다 (19 §9)
diagnosticCategories: [JAVA, SPRING, DATABASE, WEB_HTTP, TESTING, DEVOPS, SECURITY,
  PRACTICAL_ENGINEERING, EXPLANATION, INTEGRATION]
# 은퇴한 식별자. 다시 쓰지 않는다 (§8.3)
retired:
  skillCodes: []
  challengeSeedKeys: []
  conceptKeys: []
  curatedSourceIds: []
  # 은퇴한 reading은 curated-repos.yaml에 retired: true로 남는다 (19 §8.2, CV-83)
  # 2026-09-19 소스 점검: restbucks(라이선스 명시 없음) → modular-monolith로 교체
  readingKeys:
    - READ.RESTBUCKS.AGGREGATE.001
    - READ.RESTBUCKS.STATE_TRANSITION.001
    - READ.RESTBUCKS.REPOSITORY_TX.001
    - READ.RESTBUCKS.PAYMENT_TX.001
    - READ.RESTBUCKS.PAYMENT_API.001
