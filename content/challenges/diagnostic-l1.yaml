# Seed challenges — DIAGNOSTIC L1 (docs/19 §3.6, §4 CV-59, ADR-058·059)
# 14개 category 전부에 가장 낮은 칸을 만든다. 수준 1로 답한 사람에게 L2·L3을 내면
# 주장보다 어려운 문제로 재는 것이 되어 정직하게 답한 사람이 떨어진다.
# 통과 판정은 docs/06 §7.4 (CORRECT 이고 maxHintLevel <= QUESTION_ONLY)
challenges:
- seedKey: DIAGNOSTIC.JAVA.L1.001
  purpose: DIAGNOSTIC
  skills:
  - JAVA.COLLECTION
  difficulty: 1
  estimatedMinutes: 8
  isTransfer: false
  title: Java 진단 — 같은 값인데 두 번 들어간 이유
  scenario: '주문 번호를 담는 집합인데 같은 번호가 두 번 들어갑니다.

    ```java

    record OrderNo(String value) {}

    class Legacy { String no; Legacy(String no) { this.no = no; } }


    Set<OrderNo> a = new HashSet<>();

    a.add(new OrderNo("A-1")); a.add(new OrderNo("A-1"));


    Set<Legacy> b = new HashSet<>();

    b.add(new Legacy("A-1")); b.add(new Legacy("A-1"));

    ```'
  prompt: '1. `a.size()`와 `b.size()`를 각각 쓰세요.

    2. 두 결과가 다른 이유를 설명하세요.

    3. `Legacy`를 고치려면 무엇을 해야 하는지 쓰세요.


    힌트 없이 10분 안에 답하세요. 진단 결과는 학습 계획의 시작 수준을 정하는 데만 쓰입니다.'
  constraints:
  - Java 25 기준으로 답한다
  expectedConcepts:
  - HashSet의 중복 판정
  - equals와 hashCode
  - record가 만들어 주는 것
  rubric:
  - id: R1
    criterion: 두 크기를 각각 1과 2로 맞게 쓴다
    weightBp: 3000
    axis: IMPLEMENTATION
  - id: R2
    criterion: HashSet이 equals와 hashCode로 같음을 판정한다는 것을 설명한다
    weightBp: 4000
    axis: EXPLANATION
  - id: R3
    criterion: record는 그 둘을 자동으로 만들고 일반 클래스는 그렇지 않다는 것을 말한다
    weightBp: 3000
    axis: EXPLANATION
  commonMistakes:
  - 둘 다 1이라고 답함
  - 값이 같으면 항상 같은 객체로 본다고 답함
  - equals만 재정의하면 된다고 답함
  transferTargets: []
  hints:
    QUESTION_ONLY: 두 집합에 들어간 것은 각각 어떤 종류의 값인가요?
    CONCEPT_HINT: HashSet은 두 원소가 같은지를 무엇으로 판단하는지 떠올려 보세요.
    DIRECTION: 두 타입에서 equals와 hashCode가 어떻게 정의돼 있는지 각각 적어 보세요.
