    DIRECTION: 저장소를 만드는 자리와 쓰는 자리를 나눠 적어 보세요.
- seedKey: DIAGNOSTIC.DATABASE.L1.001
  purpose: DIAGNOSTIC
  skills:
  - DATABASE.SQL_BASICS
  difficulty: 1
  estimatedMinutes: 8
  isTransfer: false
  title: DB 진단 — 주문이 있는 회원만 나온다
  scenario: '회원마다 주문 건수를 세려고 썼는데, 주문이 한 건도 없는 회원이 결과에서 빠집니다.

    ```sql

    SELECT m.id, m.name, COUNT(o.id) AS order_count

    FROM members m

    JOIN orders o ON o.member_id = m.id

    GROUP BY m.id, m.name;

    ```'
  prompt: '1. 주문이 없는 회원이 빠지는 이유를 설명하세요.

    2. 모든 회원이 나오도록 고친 SQL을 쓰세요.

    3. 고친 뒤 주문이 없는 회원의 `order_count`가 얼마인지 쓰고 그 이유를 설명하세요.


    힌트 없이 10분 안에 답하세요. 진단 결과는 학습 계획의 시작 수준을 정하는 데만 쓰입니다.'
  constraints:
  - PostgreSQL 16 기준으로 답한다
  expectedConcepts:
  - INNER JOIN과 OUTER JOIN
  - COUNT와 NULL
  - GROUP BY
  rubric:
  - id: R1
    criterion: 조인 조건을 만족하는 행만 남기 때문이라는 것을 설명한다
    weightBp: 3000
    axis: EXPLANATION
  - id: R2
    criterion: LEFT JOIN으로 고친 SQL을 쓴다
    weightBp: 4000
    axis: IMPLEMENTATION
  - id: R3
    criterion: COUNT가 NULL을 세지 않아 0이 된다는 것을 설명한다
    weightBp: 3000
    axis: EXPLANATION
  commonMistakes:
  - COUNT(*)로 바꿔 0 대신 1이 나오게 함
  - WHERE로 해결하려 함
  - LEFT JOIN은 썼지만 COUNT 대상이 왜 중요한지 답하지 못함
  transferTargets: []
  hints:
    QUESTION_ONLY: 지금 쿼리는 어느 쪽 표를 기준으로 행을 남기고 있나요?
    CONCEPT_HINT: 한쪽 표의 행을 모두 남기는 조인이 따로 있습니다.
    DIRECTION: 고친 뒤 주문이 없는 회원의 o.id 값이 무엇이 되는지 적어 보세요.
