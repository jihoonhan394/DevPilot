# Seed challenges — TESTING, SECURITY (PRACTICE)
# Spec: docs/19-content-spec.md §3.6 (schema), §6 (난이도), §7 (rubric·hint 작성 가이드)
# 기준: JUnit Jupiter 5+, AssertJ, Mockito / OWASP Cheat Sheet Series
challenges:
  - seedKey: PRACTICE.TESTING.JUNIT.L1.001
    purpose: PRACTICE
    skills:
      - TESTING.JUNIT
    difficulty: 1
    estimatedMinutes: 18
    isTransfer: false
    title: 첫 테스트 한 개를 처음부터 끝까지 돌려보기
    scenario: |-
      주문 금액에서 할인을 빼는 메서드가 있습니다. 테스트는 아직 하나도 없습니다.
      ```java
      public class OrderAmount {

          /** 할인은 주문 금액을 넘을 수 없다. 넘으면 0원이다. */
          public long afterDiscount(long orderAmount, long discount) {
              return orderAmount - discount;
          }
      }
      ```
    prompt: |-
      1. 이 메서드에 대한 테스트 한 개를 작성해 실제로 실행하세요. 통과하는 것을 먼저 확인합니다.
      2. 주석에 적힌 규칙(할인이 주문 금액을 넘으면 0원)을 검증하는 테스트를 하나 더 작성하세요.
      3. 두 번째 테스트가 실패하면 그 실패가 무엇을 알려 주는지 한 문장으로 쓰고, 코드를 고쳐 통과시키세요.
    constraints:
      - JUnit Jupiter와 AssertJ만 사용한다
      - 테스트 메서드 이름은 무엇을 검증하는지 읽히게 쓴다
    expectedConcepts:
      - 테스트 하나의 구조(준비·실행·검증)
      - 실패를 먼저 보는 것의 뜻
      - 주석에 적힌 규칙과 코드의 차이
    rubric:
      - id: R1
        criterion: 준비·실행·검증이 구분되는 테스트 한 개를 작성해 통과시킨다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R2
        criterion: 할인이 주문 금액보다 큰 경우를 검증하는 테스트를 작성한다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R3
        criterion: 그 테스트의 실패가 코드가 주석의 규칙을 지키지 않는다는 뜻임을 설명한다
        weightBp: 2000
        axis: EXPLANATION
      - id: R4
        criterion: 음수가 나오지 않도록 고치고 두 테스트가 모두 통과하는 것을 확인한다
        weightBp: 2000
        axis: DEBUGGING
    commonMistakes:
      - 테스트를 작성하고 실행하지 않은 채 통과할 것이라고 적는다
      - 메서드 이름을 test1, test2 로 지어 무엇을 검증하는지 알 수 없게 한다
      - 실패를 보고 테스트를 고쳐 통과시킨다 — 고쳐야 하는 쪽은 코드다
    transferTargets: []
    hints:
      QUESTION_ONLY: 주석은 할인이 주문 금액을 넘으면 0원이라고 합니다. 코드도 그렇게 하고 있나요?
      CONCEPT_HINT: 테스트 하나는 보통 세 부분입니다 — 값을 준비하고, 메서드를 부르고, 결과가 기대와 같은지 봅니다. 두 번째 테스트는 통과하지 않는 것이 정상입니다.
      DIRECTION: orderAmount 10000, discount 15000 을 넣으면 무엇이 나오는지 먼저 손으로 계산해 보고, 그 값을 기대값으로 적은 테스트를 돌려 보세요.
  - seedKey: PRACTICE.TESTING.SPRING_TEST.L2.001
    purpose: PRACTICE
    skills:
      - TESTING.SPRING_TEST
      - TESTING.JUNIT
    difficulty: 2
    estimatedMinutes: 30
    isTransfer: false
    title: 컨트롤러만 띄워 주문 생성 응답을 검증하기
    scenario: |-
      주문 생성 API를 검증하는 테스트를 쓰려는데, 지금 있는 테스트는 애플리케이션 전체를 띄워
      한 번 도는 데 40초가 걸립니다. 검증하려는 것은 요청 형식과 응답 상태·본문뿐입니다.
      ```java
      @RestController
      @RequestMapping("/api/v1/orders")
      class OrderController {

          private final OrderService orderService;

          @PostMapping
          ResponseEntity<OrderResponse> create(@RequestBody @Valid CreateOrderRequest request) {
              OrderResponse created = orderService.create(request);
              return ResponseEntity.created(URI.create("/api/v1/orders/" + created.id())).body(created);
          }
      }
      ```
    prompt: |-
      1. 이 컨트롤러만 띄우는 테스트를 작성해 성공 응답(상태 코드, Location, 본문)을 검증하세요.
      2. 필수 항목이 빠진 요청이 400과 검증 오류를 돌려주는지 검증하세요.
      3. 전체를 띄우는 테스트와 이 방식의 차이를, 무엇을 검증할 수 있고 무엇을 검증할 수 없는지로 설명하세요.
    constraints:
      - Spring Boot 4.1 기준으로 작성한다
      - 서비스 계층은 테스트 더블로 대체한다
    expectedConcepts:
      - slice 테스트와 전체 통합 테스트의 차이
      - 컨트롤러 계층에서 검증되는 것(직렬화, 검증, 상태 코드)
      - 무엇이 검증되지 않는지(실제 DB, 트랜잭션 경계)
    rubric:
      - id: R1
        criterion: 컨트롤러만 띄우는 테스트로 성공 응답의 상태 코드와 본문을 검증한다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R2
        criterion: 검증 실패 요청이 400을 돌려주는지 검증한다
        weightBp: 2500
        axis: IMPLEMENTATION
      - id: R3
        criterion: 서비스 계층을 더블로 대체해 테스트가 컨트롤러의 책임만 보게 만든다
        weightBp: 2000
        axis: IMPLEMENTATION
      - id: R4
        criterion: 이 방식이 검증하지 못하는 것(실제 저장, 트랜잭션 경계)을 구체적으로 설명한다
        weightBp: 2500
        axis: EXPLANATION
    commonMistakes:
      - 전체를 띄우는 테스트를 그대로 쓰면서 이름만 slice 로 바꾼다
      - 서비스를 실제로 주입해 DB 까지 닿게 만들어 느린 테스트를 다시 만든다
      - 성공 경로만 검증하고 검증 실패 응답을 빼놓는다
    transferTargets: []
    hints:
      QUESTION_ONLY: 이 테스트가 확인하려는 것은 컨트롤러의 책임 중 어디까지인가요? 저장까지 확인해야 합니까?
      CONCEPT_HINT: 웹 계층만 띄우는 테스트는 직렬화·검증·상태 코드를 봅니다. 그 아래 계층은 더블로 대체하고, 실제 저장은 별도의 통합 테스트가 봅니다.
      DIRECTION: 먼저 성공 요청 하나로 201 과 Location 을 단언해 보고, 그다음 필수 항목을 하나 빼서 같은 방식으로 400 을 단언해 보세요.
