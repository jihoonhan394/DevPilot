# Seed challenges — 주문 흐름·기존 데이터 연동의 빈 자리 (PRACTICE)
# Spec: docs/19-content-spec.md §3.6 (schema), §6 (난이도), §7 (rubric·hint 작성 가이드)
# 기준: Java 25 / Spring Boot 4.1 / PostgreSQL 16 / Flyway
#
# 연동 트랙 3~4단계의 관문 skill 중 연습문제가 없던 넷을 채운다.
challenges:
  - seedKey: PRACTICE.DATABASE.MIGRATION.L2.001
    purpose: PRACTICE
    skills:
      - DATABASE.MIGRATION
    difficulty: 2
    estimatedMinutes: 30
    isTransfer: false
    title: 운영 중인 주문 테이블에 필수 컬럼 넣기
    scenario: |-
      운영 중인 orders 테이블(약 500만 행)에 주문 경로를 남길 컬럼을 넣어야 합니다.
      값은 앞으로 항상 채워지고, 기존 행에는 없습니다. 첫 시도는 이랬습니다.
      ```sql
      ALTER TABLE orders ADD COLUMN channel varchar(20) NOT NULL;
      ```
      이 문장은 실패했고, NOT NULL을 빼고 다시 올린 뒤로는 값이 비어 있는 행이 계속 늘고 있습니다.
      배포는 이전 버전으로 되돌릴 수 있어야 합니다.
    prompt: |-
      1. 첫 문장이 실패한 이유를 설명하세요.
      2. 무중단으로 이 컬럼을 넣는 단계를 순서대로 적고 각 단계의 migration을 쓰세요.
      3. 중간 단계에서 **이전 버전 애플리케이션이 함께 돌아도** 괜찮아야 하는 이유를 설명하세요.
    constraints:
      - PostgreSQL 16 · Flyway 기준으로 답한다
      - 이미 적용된 migration 파일은 고치지 않는다
      - 한 번에 배포할 수 있는 단계로 나눈다
    expectedConcepts:
      - 기본값 없는 NOT NULL 추가
      - 단계적 배포
      - 되돌릴 수 있는 중간 상태
      - 기존 행 채우기
      - 적용된 migration 불변
    rubric:
      - id: R1
        criterion: 기존 행에 채울 값이 없어 제약을 만족할 수 없다는 것을 설명한다
        weightBp: 2500
        axis: EXPLANATION
      - id: R2
        criterion: 컬럼 추가 → 채우기 → 제약 추가로 나눈 단계와 각 migration을 쓴다
        weightBp: 3500
        axis: IMPLEMENTATION
      - id: R3
        criterion: 각 중간 상태에서 이전 버전과 새 버전이 함께 돌 수 있음을 설명한다
        weightBp: 2500
        axis: EXPLANATION
      - id: R4
        criterion: 큰 테이블을 한 번에 갱신할 때 생기는 잠금 문제를 짚는다
        weightBp: 1500
        axis: DEBUGGING
    commonMistakes:
      - 한 migration에 컬럼 추가와 NOT NULL을 함께 넣음
      - 이미 적용된 migration 파일을 고쳐 체크섬을 깨뜨림
      - 500만 행을 한 문장으로 갱신해 오래 잠금
    transferTargets:
      - DATABASE.MODELING
    hints:
      QUESTION_ONLY: 기존 500만 행에는 이 컬럼의 값이 무엇이어야 하나요? 그 답이 없으면 제약을 지금 걸 수 있나요?
      CONCEPT_HINT: 스키마 변경은 배포와 맞물립니다. 새 코드와 옛 코드가 잠시 함께 도는 시간이 있고, 그 시간 동안 양쪽 모두 돌아가는 상태여야 합니다.
      DIRECTION: 컬럼을 널 허용으로 먼저 넣고, 코드가 값을 쓰기 시작한 뒤에 기존 행을 채우고, 마지막에 제약을 거세요. 각 단계를 따로 배포할 수 있는지 확인하면 됩니다.

  - seedKey: PRACTICE.JAVA.OPTIONAL.L2.001
    purpose: PRACTICE
    skills:
      - JAVA.OPTIONAL
    difficulty: 2
    estimatedMinutes: 20
    isTransfer: false
    title: 없을 수 있는 값을 경계에서만 다루기
    scenario: |-
      기존 시스템에서 회원 정보를 읽어 오는 코드가 이렇습니다.
      ```java
      public String couponCodeOf(UUID memberId) {
          Member member = memberRepository.findById(memberId).get();
          Coupon coupon = member.getCoupon();
          if (coupon != null) {
              return coupon.getCode().trim();
          }
          return null;
      }
      ```
      호출하는 쪽 세 군데 중 두 곳은 널 검사를 하고 한 곳은 하지 않아서, 그 한 곳에서
      NullPointerException이 납니다. `get()` 쪽에서도 가끔 예외가 납니다.
    prompt: |-
      1. 이 코드에서 없을 수 있는 값이 몇 군데인지 짚고 각각 어떻게 다뤄야 하는지 쓰세요.
      2. 코드를 다시 쓰세요.
      3. 반환 타입을 무엇으로 할지 정하고, 호출하는 쪽이 왜 검사를 빠뜨릴 수 없게 되는지 설명하세요.
    constraints:
      - Java 25 기준으로 답한다
      - 필드 타입은 바꾸지 않는다
    expectedConcepts:
      - Optional 반환 타입
      - get 대신 orElseThrow
      - map과 flatMap
      - 없음의 의미 구분
      - 널 대신 타입으로 말하기
    rubric:
      - id: R1
        criterion: 없을 수 있는 자리를 모두 짚고 각각이 오류인지 정상인지 구분한다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R2
        criterion: get 대신 orElseThrow를 쓰고 쿠폰 없음은 Optional로 이어 간다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R3
        criterion: 반환 타입을 Optional로 두면 호출부가 검사를 건너뛸 수 없다는 것을 설명한다
        weightBp: 2500
        axis: EXPLANATION
      - id: R4
        criterion: 지금 세 호출부 중 한 곳만 터진 이유를 짚는다
        weightBp: 1500
        axis: DEBUGGING
    commonMistakes:
      - Optional을 만들고 바로 get으로 꺼내 문제를 그대로 둠
      - 회원 없음과 쿠폰 없음을 같은 것으로 다룸
      - 필드나 파라미터 타입을 Optional로 바꿈
    transferTargets:
      - PRACTICAL_ENGINEERING.NULL_BOUNDARY
    hints:
      QUESTION_ONLY: 회원이 없는 것과 쿠폰이 없는 것은 같은 종류의 "없음"인가요?
      CONCEPT_HINT: Optional은 반환 타입에서 "없을 수 있다"를 타입으로 말하는 도구입니다. 받는 쪽이 꺼내는 절차를 거치게 만드는 것이 목적입니다.
      DIRECTION: 없을 수 있는 자리를 먼저 둘로 나누세요 — 없으면 오류인 것과 없어도 정상인 것. 앞은 예외로 끝내고 뒤는 Optional로 이어 보내세요.

  - seedKey: PRACTICE.TESTING.GOLDEN_REGRESSION.L3.001
    purpose: PRACTICE
    skills:
      - TESTING.GOLDEN_REGRESSION
    difficulty: 3
    estimatedMinutes: 40
    isTransfer: false
    title: 손댈 수 없는 정산 로직을 바꾸기 전에 지금 결과를 묶어 두기
    scenario: |-
      월 정산 계산기가 600줄짜리 메서드 하나에 들어 있습니다. 테스트는 없고, 무엇이 맞는
      동작인지 적힌 문서도 없습니다. 지금 결과가 맞다고 여겨지는 근거는 "몇 년째 이걸로
      정산해 왔고 항의가 없었다"뿐입니다.
      여기에 새 할인 규칙을 넣어야 합니다. 먼저 리팩터링하고 싶지만, 바꾸고 나서 숫자가
      달라지면 그것이 버그인지 원래 틀렸던 것인지 알 수 없습니다.
    prompt: |-
      1. 바꾸기 전에 지금 동작을 묶어 두는 방법을 적으세요. 입력을 어디서 얻고 무엇을 저장할지 포함하세요.
      2. 이 테스트가 **무엇을 보장하고 무엇을 보장하지 않는지** 설명하세요.
      3. 새 규칙 때문에 결과가 **의도적으로** 달라질 때 어떻게 다루는지 적으세요.
    constraints:
      - Java 25 · JUnit 6 기준으로 답한다
      - 실제 고객 데이터는 그대로 쓰지 않는다
      - 정산 로직 자체는 이 단계에서 바꾸지 않는다
    expectedConcepts:
      - 기준 결과 고정
      - 입력 표본 고르기
      - 민감 정보 가리기
      - 맞음이 아니라 같음
      - 기준 갱신 절차
    rubric:
      - id: R1
        criterion: 입력 표본과 기준 결과 파일을 만들고 비교하는 테스트를 구체적으로 쓴다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R2
        criterion: 경계·예외를 포함하도록 입력 표본을 고르는 기준을 적는다
        weightBp: 2000
        axis: IMPLEMENTATION
      - id: R3
        criterion: 이 테스트가 정확성이 아니라 변화 없음만 보장한다는 것을 설명한다
        weightBp: 3000
        axis: EXPLANATION
      - id: R4
        criterion: 기준을 갱신할 때 무엇을 남겨야 나중에 판단이 되는지 짚는다
        weightBp: 2000
        axis: DEBUGGING
    commonMistakes:
      - 결과가 달라지면 기준 파일을 그냥 덮어써서 회귀를 놓침
      - 정상 입력만 표본으로 골라 경계에서 깨지는 것을 못 잡음
      - 고객 이름이나 계좌를 그대로 기준 파일에 넣음
    transferTargets:
      - TESTING.UNIT_TEST_DESIGN
      - PRACTICAL_ENGINEERING.REQUIREMENTS
    hints:
      QUESTION_ONLY: 지금 결과가 맞다는 보장이 없는데도 그것을 기준으로 삼는 이유는 무엇일까요?
      CONCEPT_HINT: 바꾸기 전과 후를 비교하는 테스트는 "맞다"가 아니라 "달라지지 않았다"를 잽니다. 정답을 모르는 코드에도 걸 수 있는 것이 그 때문입니다.
      DIRECTION: 입력 표본을 파일로 고정하고 지금 출력을 그대로 저장한 뒤, 테스트가 그 둘을 비교하게 하세요. 표본에는 0원·환불·월말 같은 경계를 꼭 넣으세요.

  - seedKey: PRACTICE.JAVA.CONCURRENCY.VIRTUAL_THREAD.L3.001
    purpose: PRACTICE
    skills:
      - JAVA.CONCURRENCY.VIRTUAL_THREAD
      - JAVA.CONCURRENCY
    difficulty: 3
    estimatedMinutes: 35
    isTransfer: false
    title: 외부 연동 호출이 몰릴 때 스레드를 어떻게 쓸지 정하기
    scenario: |-
      밤마다 도는 배치가 상대 시스템에 건당 한 번씩 HTTP를 부릅니다. 한 건에 약 300ms가
      걸리고 대부분 응답을 기다리는 시간입니다. 지금은 고정 크기 20짜리 스레드 풀로 돌리는데
      건수가 늘면서 시간이 모자랍니다.
      "풀 크기를 500으로 올리자"와 "가상 스레드로 바꾸자"는 의견이 나왔습니다.
    prompt: |-
      1. 두 방안이 각각 무엇을 바꾸는지 설명하세요.
      2. 어느 쪽을 고를지 정하고 근거를 쓰세요. 코드를 함께 적으세요.
      3. 가상 스레드로 바꿔도 **나아지지 않는 경우**를 하나 들고 이유를 설명하세요.
    constraints:
      - Java 25 기준으로 답한다
      - 상대 시스템의 동시 호출 한도는 모른다고 가정한다
    expectedConcepts:
      - 기다리는 시간과 계산하는 시간
      - 플랫폼 스레드 비용
      - 가상 스레드
      - 동시 호출 한도
      - 병목의 위치
    rubric:
      - id: R1
        criterion: 두 방안이 각각 무엇을 바꾸는지 구분해 설명한다
        weightBp: 2500
        axis: EXPLANATION
      - id: R2
        criterion: 선택과 근거를 대고 실행기를 만드는 코드를 쓴다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R3
        criterion: 상대 시스템 한도를 모르므로 동시 호출 수를 스스로 제한해야 함을 짚는다
        weightBp: 2500
        axis: IMPLEMENTATION
      - id: R4
        criterion: 병목이 기다림이 아니라 계산이나 상대 쪽이면 효과가 없다는 것을 설명한다
        weightBp: 2000
        axis: DEBUGGING
    commonMistakes:
      - 가상 스레드로 바꾸면서 동시 호출 제한을 없애 상대 시스템을 밀어붙임
      - 계산이 병목인 작업에 가상 스레드를 적용하고 효과를 기대함
      - 풀 크기만 키워 메모리와 문맥 전환 비용을 그대로 떠안음
    transferTargets:
      - PRACTICAL_ENGINEERING.RESOURCE_TIMEOUT
    hints:
      QUESTION_ONLY: 한 건의 300ms 중 실제로 계산하는 시간은 얼마나 될까요? 나머지 시간에 스레드는 무엇을 하고 있나요?
      CONCEPT_HINT: 가상 스레드는 기다리는 동안 운영체제 스레드를 놓아 줍니다. 그래서 기다림이 대부분인 작업에서만 값이 싸집니다.
      DIRECTION: 먼저 한 건의 시간이 기다림인지 계산인지 나눠 보세요. 기다림이면 가상 스레드로 바꾸되, 상대 시스템을 밀어붙이지 않게 동시 호출 수를 따로 묶어야 합니다.
