      services:
        app:
          image: orders-api:1.0
          environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/orders
          ports: ["8080:8080"]
        db:
          image: postgres:16
          ports: ["5432:5432"]
      ```
      애플리케이션 로그에는 접속 거부가 반복해서 찍히고, 가끔은 DB가 아직 준비되기 전에 시도한 것처럼
      보이기도 합니다.
    prompt: |-
      1. 접속이 실패하는 이유를 설명하세요.
      2. 접속 설정을 어떻게 고쳐야 하는지 고친 값을 적으세요.
      3. 내 노트북에서 쓰던 주소와 컨테이너가 써야 하는 주소가 다른 이유를 설명하세요.
      4. DB가 아직 준비되지 않아 생기는 실패는 어떻게 다룰지 한 가지 방법을 적고, 그 방법을 고른 이유를
         적으세요.
    constraints:
      - 애플리케이션 코드는 고치지 않는다
      - 접속 정보의 실제 값은 적지 않고 자리표시자를 쓴다
    expectedConcepts:
      - 컨테이너마다 분리된 네트워크
      - 서비스 이름으로 상대 컨테이너 찾기
      - 호스트 포트 연결과 내부 포트의 차이
      - 의존 대상의 준비 상태 확인
    rubric:
      - id: R1
        criterion: 접속 주소를 상대 컨테이너의 서비스 이름으로 고친 값을 적는다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R2
        criterion: 컨테이너 안에서의 그 주소가 자기 자신을 가리킨다는 점으로 실패 원인을 설명한다
        weightBp: 3000
        axis: EXPLANATION
      - id: R3
        criterion: 밖에서 쓰는 주소와 컨테이너끼리 쓰는 주소가 갈리는 이유를 포트 연결과 함께 설명한다
        weightBp: 2000
        axis: EXPLANATION
      - id: R4
        criterion: 준비되지 않은 의존 대상에 대비하는 방법을 한 가지 적용한다
        weightBp: 2000
        axis: IMPLEMENTATION
    commonMistakes:
      - DB 컨테이너의 포트 연결을 바꿔 해결하려 함
      - 기동 순서만 지정하면 DB가 접속 가능한 상태라고 가정함
