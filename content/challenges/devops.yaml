# Seed challenges — DEVOPS (PRACTICE)
# Spec: docs/19-content-spec.md §3.6 (schema), §6 (난이도), §7 (rubric·hint 작성 가이드), §7.7 (문제 세 종류)
# 기준: Spring Boot 4.1 (Actuator) / Gradle 9.7.1 / 폐쇄망 반입은 현장 절차 기준
challenges:
  - seedKey: PRACTICE.DEVOPS.OFFLINE_DEPLOY.L3.001
    purpose: PRACTICE
    skills:
      - DEVOPS.OFFLINE_DEPLOY
    difficulty: 3
    estimatedMinutes: 40
    isTransfer: false
    title: 폐쇄망 현장 설치를 위한 반입 목록과 절차 만들기
    scenario: |-
      다음 주에 고객사 현장에 서비스를 설치합니다. 현장 망은 인터넷이 끊겨 있고 반입은 승인된 저장 매체로만
      가능하며 반입 심사에 3일이 걸립니다. 지금 계획은 현장에서 저장소를 내려받아 빌드하는 것이고, 사내에서
      빌드할 때는 의존성이 자동으로 받아집니다. 빌드 스크립트에는 버전을 범위로 적은 의존성이 몇 개 있고,
      기준 컨테이너 이미지 태그는 최신 태그를 가리킵니다. 현장에는 같은 서비스의 이전 버전이 이미 돌고
      있습니다.
    prompt: |-
      1. 반입 꾸러미에 무엇이 들어가야 하는지 목록으로 적으세요. 빠지면 현장에서 설치가 멈추는 것을 기준으로
         나눕니다.
      2. 버전이 흔들리지 않게 하려면 반입 전에 무엇을 고정하고 무엇을 함께 기록해야 하는지 적으세요.
      3. 설치 · 업그레이드 · 되돌리기 절차를 순서로 적으세요. 각 단계에서 무엇을 확인하고 실패하면 어디로
         돌아가는지 적습니다.
      4. 반입 심사 전에 이 꾸러미가 충분한지 사내에서 어떻게 검증할지 적고, 그 검증이 왜 필요한지 설명하세요.
    constraints:
      - 현장에서 인터넷 연결이 필요한 단계를 두지 않는다
      - 자격 증명과 실제 접속 정보는 꾸러미 문서에 적지 않는다
      - 현장 담당자가 문서만 보고 따라 할 수 있게 쓴다
    expectedConcepts:
      - 의존성 버전 고정
      - 이미지 태그 고정
      - 반입 목록과 체크섬
      - 되돌리기 절차
      - 네트워크 없는 사전 검증
    rubric:
      - id: R1
        criterion: 실행 산출물, 의존성, 런타임 이미지, 설정, 절차 문서를 빠짐없이 목록으로 적는다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R2
        criterion: 의존성과 기준 이미지의 버전을 고정하고 무엇을 받았는지 확인할 근거를 함께 남긴다
        weightBp: 2500
        axis: IMPLEMENTATION
      - id: R3
        criterion: 설치가 실패했을 때 이전 버전으로 되돌릴 수 있는 조건을 설명한다
        weightBp: 2500
        axis: EXPLANATION
      - id: R4
        criterion: 반입 전에 네트워크를 끊고 검증해야 하는 이유를 설명한다
        weightBp: 2000
        axis: EXPLANATION
    commonMistakes:
      - 애플리케이션 산출물만 담고 빌드 · 실행에 필요한 것을 빠뜨림
      - 버전을 범위나 최신 태그로 둔 채 반입해 현장 결과가 달라짐
      - 이전 버전을 지워 되돌릴 수 없게 만듦
      - 절차를 담당자 머릿속에 두고 문서에는 명령만 나열함
    transferTargets:
      - DEVOPS.DOCKER
      - DEVOPS.BUILD_GRADLE
    hints:
      QUESTION_ONLY: 현장에서 설치 도중 무엇 하나를 내려받아야 한다는 것을 알게 되면 그날 안에 끝낼 수 있을까요?
      CONCEPT_HINT: 버전을 실제로 해석된 값으로 적어 두는 방식과, 받은 파일이 그대로인지 확인하는 방법을 떠올려 보세요.
      DIRECTION: 사내 장비에서 네트워크를 끊고 처음부터 설치해 보면서 멈추는 지점마다 목록에 한 줄씩 더하고, 마지막에 이전 버전으로 되돌려 보세요.

  - seedKey: PRACTICE.DEVOPS.OBSERVABILITY.L2.001
    purpose: PRACTICE
    skills:
      - DEVOPS.OBSERVABILITY
    difficulty: 2
    estimatedMinutes: 30
    isTransfer: false
    title: 장애를 사용자 연락으로 알게 되는 서비스에 최소 관측 붙이기
    scenario: |-
      운영 중인 Spring Boot 서비스입니다. 로그는 문장 한 줄로만 남고, 지표는 없고, 배포 스크립트는 프로세스가
      떴는지만 확인합니다. 지난주에는 커넥션 풀이 고갈되어 30분 동안 요청이 모두 실패했는데, 고객사 담당자가
      전화를 걸어 왔을 때 처음 알았습니다. 그때 남은 로그는 "주문 처리 실패"가 수백 줄이었고 어느 요청의
      것인지 알 수 없었습니다.
    prompt: |-
      1. 헬스체크 끝점을 열고 무엇을 포함할지 정하세요. 외부에 열어도 되는 정보와 열면 안 되는 정보를 함께
         정합니다.
      2. 장애가 났을 때 먼저 볼 지표 세 개를 정하고 이름과 태그를 적으세요. 태그에 넣으면 안 되는 값도 함께
         적습니다.
      3. 한 요청의 흐름을 이어 볼 수 있도록 로그를 고치세요.
      4. 다음에 같은 일이 생기면 무엇을 어떤 순서로 볼지 설명하세요.
    constraints:
      - Spring Boot Actuator가 제공하는 것을 먼저 쓴다
      - 새 관측 인프라를 도입하지 않는다
      - 로그와 응답에 토큰 · 개인정보 · 요청 본문 원문을 남기지 않는다
    expectedConcepts:
      - 헬스체크 끝점 노출 범위
      - 지표 이름과 태그
      - 태그 값 가짓수
      - 상관 ID
      - 구조화 로그
    rubric:
      - id: R1
        criterion: 헬스체크 끝점을 열고 외부에 보여도 되는 범위를 구분해 설정한다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R2
        criterion: 먼저 볼 지표 세 개를 정하고 이름과 태그를 값 가짓수가 제한되게 정한다
        weightBp: 2500
        axis: IMPLEMENTATION
      - id: R3
        criterion: 요청마다 상관 ID를 부여해 모든 로그에 같은 값이 남게 한다
        weightBp: 2000
        axis: IMPLEMENTATION
      - id: R4
        criterion: 장애 때 무엇을 어떤 순서로 보는지 근거와 함께 설명한다
        weightBp: 2500
        axis: EXPLANATION
    commonMistakes:
      - 헬스체크 끝점에 내부 정보를 모두 열어 둠
      - 지표 태그에 주문 번호나 사용자 식별자를 넣음
      - 로그 양만 늘리고 요청을 잇는 값은 남기지 않음
      - 무엇을 먼저 볼지 정하지 않아 장애 때 로그를 처음부터 읽음
    transferTargets:
      - PRACTICAL_ENGINEERING.LOGGING
      - SECURITY.SENSITIVE_DATA_LOGGING
    hints:
      QUESTION_ONLY: 지난주 장애 때 남은 수백 줄 중에서 한 고객의 요청만 골라내려면 무엇이 더 있어야 했을까요?
      CONCEPT_HINT: 요청마다 붙는 식별자와, 이름과 구분값으로 나뉘는 측정값의 구조를 떠올려 보세요.
      DIRECTION: 먼저 서비스가 살아 있는지 알려 주는 끝점을 열고, 그다음 요청 수 · 실패 비율 · 응답 시간처럼 장애 때 가장 먼저 보고 싶은 값부터 이름을 붙여 보세요.

  - seedKey: PRACTICE.DEVOPS.OBSERVABILITY.L3.001
    purpose: PRACTICE
    skills:
      - DEVOPS.OBSERVABILITY
    difficulty: 3
    estimatedMinutes: 35
    isTransfer: false
    title: 남의 장애에 따라 재시작되는 헬스체크 고치기
    scenario: |-
      배포 환경은 헬스체크가 연속으로 실패하면 컨테이너를 재시작합니다. 우리 서비스의 헬스체크는 자기 DB와
      함께 연동 대상 외부 API까지 호출해 상태를 확인하도록 만들어져 있습니다. 어제 연동 대상이 예정된 점검으로
      40분 동안 응답하지 않았고, 그동안 우리 서비스는 계속 재시작되어 외부 API를 쓰지 않는 조회 기능까지
      멈췄습니다. 재시작 때마다 기동에 20초가 걸리고, 그 사이 들어온 요청도 실패했습니다.
    prompt: |-
      1. 왜 남의 점검이 우리 서비스의 재시작으로 이어졌는지 설명하세요.
      2. 재시작 판단에 쓰는 확인과 트래픽을 받을 준비가 되었는지 판단하는 확인을 나누고, 각각에 무엇을
         포함할지 정해 설정하세요.
      3. 연동 대상의 상태는 그래도 알아야 합니다. 헬스체크가 아니라면 어디에 두고 어떻게 볼지 적으세요.
      4. 헬스체크에 의존 대상을 넣을지 판단하는 기준을 한 문장으로 정리해 설명하세요.
    constraints:
      - 헬스체크를 아예 끄지 않는다
      - 연동 대상 상태를 확인하지 않는 것으로 마무리하지 않는다
      - 새 관측 인프라를 도입하지 않는다
    expectedConcepts:
      - 생존 확인과 준비 확인의 분리
      - 필수 의존과 선택 의존
      - 장애 전파
      - 지표와 알림으로 보기
      - 헬스체크 응답 시간
    rubric:
      - id: R1
        criterion: 외부 의존을 재시작 판단에 넣어 남의 장애가 내 장애로 번지는 과정을 설명한다
        weightBp: 3000
        axis: EXPLANATION
      - id: R2
        criterion: 재시작 판단용 확인과 트래픽 수용 판단용 확인을 나누고 각각의 포함 범위를 정해 설정한다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R3
        criterion: 연동 대상 상태를 지표나 알림 쪽으로 옮겨 계속 볼 수 있게 한다
        weightBp: 2000
        axis: IMPLEMENTATION
      - id: R4
        criterion: 의존 대상을 헬스체크에 넣을지 판단하는 기준을 설명한다
        weightBp: 2000
        axis: EXPLANATION
    commonMistakes:
      - 두 종류의 확인을 구분하지 않고 하나로 둠
      - 외부 의존을 뺐지만 어디서도 상태를 보지 않게 됨
      - 확인 실패 횟수나 시간 제한을 정하지 않아 느린 응답에도 재시작됨
      - 재시작이 늘 해결책이라고 보고 기동 시간을 고려하지 않음
    transferTargets:
      - INTEGRATION.SECURITY_APPLIANCE
    hints:
      QUESTION_ONLY: 우리 서비스를 다시 띄운다고 해서 남의 점검이 끝날까요?
      CONCEPT_HINT: 다시 띄우면 해결되는 상태와 기다려야 해결되는 상태를 나누는 관점, 그리고 확인의 종류가 하나가 아니라는 점을 떠올려 보세요.
      DIRECTION: 의존 대상을 하나씩 적고 그것이 멈췄을 때 재시작이 답인지 아닌지로 갈라 본 다음, 답이 아닌 것들은 확인 대상에서 빼고 볼 자리를 따로 마련해 보세요.
