    transferTargets:
      - DEVOPS.LINUX_BASICS
    hints:
      QUESTION_ONLY: 애플리케이션 컨테이너 안에서 그 주소는 누구를 가리킬까요?
      CONCEPT_HINT: 컨테이너마다 자기 주소를 따로 갖는다는 점과, 같은 묶음 안에서 서로를 이름으로 찾는 방식을 떠올려 보세요.
      DIRECTION: 밖에서 붙을 때 지나는 경로와 컨테이너끼리 붙을 때 지나는 경로를 각각 그림으로 그려 보고, 설정값이 어느 경로를 가리키는지 표시해 보세요.

