    title: 컨테이너 안에서만 DB 접속이 안 되는 이유 찾기
    scenario: |-
      애플리케이션과 PostgreSQL을 한 Compose 파일로 함께 띄웠습니다. DB 컨테이너는 정상이고, 내 노트북에서
      DB 도구로 붙으면 잘 붙습니다. 그런데 애플리케이션 컨테이너는 기동 중에 접속 실패로 죽습니다.
