      ```text
      <<<<<<< HEAD
          private static final int TIMEOUT_SECONDS = 3;
      =======
          private static final int TIMEOUT_SECONDS = 10;
      >>>>>>> main
      ```
      내 브랜치에서는 응답이 느린 연동을 빨리 끊으려고 3초로 줄였고, main 쪽에서는 이번 주에 상대
      시스템이 느려져 10초로 늘렸다고 합니다. 두 변경 모두 이유가 있습니다.
    prompt: |-
      1. 위쪽과 아래쪽이 각각 어느 쪽 변경인지 밝히고, 표시가 무엇을 뜻하는지 설명하세요.
      2. 어떤 값을 남길지 정하는 기준을 적고, 정하기 전에 누구에게 무엇을 확인할지 적으세요.
      3. 해결한 뒤 커밋까지 가는 절차를 순서로 적으세요.
      4. 충돌을 잘못 해결했다는 것을 나중에 알아채려면 무엇이 있어야 하는지 적으세요.
    constraints:
      - 한쪽 변경을 이유 없이 통째로 버리지 않는다
      - 공유 브랜치의 이력을 다시 쓰지 않는다
    expectedConcepts:
      - 충돌 표시의 구조
      - 양쪽 변경의 의도 확인
      - 해결 후 검증
      - 되돌릴 수 있는 커밋 단위
    rubric:
      - id: R1
        criterion: 표시의 위아래가 각각 어느 쪽 변경인지 밝히고 구분선의 뜻을 설명한다
        weightBp: 2500
        axis: EXPLANATION
      - id: R2
        criterion: 값을 고르는 기준과 확인할 상대를 적어 판단 근거를 만든다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R3
        criterion: 표시를 지우고 빌드와 테스트를 거쳐 커밋하는 절차를 순서로 적는다
        weightBp: 2500
        axis: IMPLEMENTATION
      - id: R4
        criterion: 잘못된 해결을 뒤늦게 알아채는 수단을 제시한다
        weightBp: 2000
        axis: DEBUGGING
    commonMistakes:
      - 표시만 지우고 어느 쪽 의도인지 확인하지 않음
      - 두 값을 모두 남겨 컴파일이 깨지거나 중복 정의가 생김
      - 해결 후 테스트 없이 바로 커밋함
      - 충돌이 난 파일만 보고 함께 바뀐 다른 파일을 확인하지 않음
    transferTargets: []
    hints:
