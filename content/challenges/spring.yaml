        weightBp: 2000
        axis: EXPLANATION
      - id: R3
        criterion: 요구에 맞는 방법을 골라 두 서비스가 서로 다른 구현을 받도록 고친 코드를 작성한다
        weightBp: 3500
        axis: IMPLEMENTATION
      - id: R4
