      1. 이 메시지가 무엇을 말하는지, 컨테이너가 어떤 순서로 후보를 찾다가 멈췄는지 설명하세요.
      2. 해결 방법을 세 가지 이상 적고 각각 어떤 상황에 맞는지 한 줄씩 적으세요.
