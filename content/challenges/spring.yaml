      CONCEPT_HINT: 후보가 여럿일 때 이름으로 지목하는 방법, 기본값을 정하는 방법, 아예 전부 받아 쓰는 방법 세 갈래를 떠올려 보세요.
      DIRECTION: 주문과 정산이 각각 어떤 구현을 원하는지 표로 적고, 앞으로 구현이 하나 더 늘어도 표만 고치면 되는 방법을 골라 보세요.

  - seedKey: PRACTICE.SPRING.MVC_REST.L1.001
    purpose: PRACTICE
    skills:
      - SPRING.MVC_REST
    difficulty: 1
    estimatedMinutes: 15
    isTransfer: false
    title: 요구에 맞지 않게 매핑된 조회 API 고치기
    scenario: |-
      주문 조회 API입니다. 지금은 물음표 뒤에 값을 붙여야만 동작하고, 없는 주문을 물어도 빈 본문과 함께
      200이 나옵니다.
      ```java
      @RestController
      public class OrderController {

          private final OrderService orderService;   // 생성자 생략

          @RequestMapping("/orders")
          public Order find(String id) {
              return orderService.findOrNull(id);
          }
      }
      ```
      요구는 이렇습니다. 단건 조회는 /orders/7 처럼 경로로 받고, 목록 조회는 /orders?status=PAID 로 받으며,
      없는 주문은 404로 답한다.
    prompt: |-
      1. 요구에 맞게 매핑을 고친 컨트롤러 코드를 작성하세요.
      2. 없는 주문일 때 404가 나가게 하는 방법을 적용하세요.
      3. 조회에 다른 메서드가 아닌 GET만 받도록 제한하는 이유를 설명하세요.
    constraints:
      - 서비스 계층의 시그니처는 그대로 둔다
      - 오류 응답 형식을 새로 설계하지 않는다
    expectedConcepts:
      - 경로 변수 받기
      - 조회 조건을 질의 문자열로 받기
      - 메서드별 매핑 제한
      - 없는 리소스에 맞는 상태 코드
    rubric:
      - id: R1
        criterion: 단건은 경로에서, 목록 조건은 질의 문자열에서 받도록 매핑을 나눈다
        weightBp: 3500
        axis: IMPLEMENTATION
      - id: R2
        criterion: 없는 주문에 404가 나가도록 처리한다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R3
        criterion: 조회를 GET으로 제한하는 이유를 메서드의 의미로 설명한다
        weightBp: 3500
        axis: EXPLANATION
    commonMistakes:
      - 모든 요청을 하나의 매핑으로 받고 안에서 다시 분기함
      - 없는 주문에 200과 빈 본문을 돌려줌
      - 경로에 동사를 넣어 조회와 변경을 구분하려 함
    transferTargets:
      - WEB_HTTP.REST_API_DESIGN
    hints:
      QUESTION_ONLY: 주소의 어느 부분이 무엇을 가리키는 이름이고, 어느 부분이 그 대상을 걸러 내는 조건일까요?
      CONCEPT_HINT: 값을 주소의 경로에서 받는 방식과 물음표 뒤에서 받는 방식이 나뉜다는 점, 그리고 찾지 못했을 때 쓰는 상태 코드를 떠올려 보세요.
      DIRECTION: 요구 세 줄을 각각 한 줄짜리 매핑으로 적어 보고, 응답이 정상인 경우와 없는 경우로 나눠 상태 코드를 먼저 정한 다음 코드를 채워 보세요.

  - seedKey: PRACTICE.SPRING.MVC_REST.L2.001
    purpose: PRACTICE
    skills:
      - SPRING.MVC_REST
    difficulty: 2
    estimatedMinutes: 25
    isTransfer: false
    title: 엔티티를 그대로 주고받는 생성 API 손보기
    scenario: |-
      주문 생성 API입니다. 요청 본문을 엔티티로 바로 받고, 저장한 엔티티를 그대로 돌려줍니다.
      ```java
      @PostMapping("/orders")
      public Order create(@RequestBody Order order) {
          return orderService.save(order);
      }

      @Entity
      public class Order {
          @Id @GeneratedValue private Long id;
          private String status;
          private long totalAmount;
          private long costAmount;       // 원가. 외부에 나가면 안 된다
          private String internalMemo;   // 담당자 메모
          // 연관관계와 생성자 생략
      }
      ```
      응답에는 원가와 담당자 메모가 함께 나가고 있고, 클라이언트가 보낸 본문에 status 나 id 가 들어오면
      그 값이 그대로 반영됩니다. 생성 성공에도 200이 나갑니다.
    prompt: |-
      1. 요청과 응답을 위한 형을 따로 두도록 고친 코드를 작성하세요.
      2. 생성이 성공했을 때 나가야 할 상태 코드와 헤더를 적용하세요.
      3. 엔티티를 그대로 주고받을 때 생기는 문제를 두 가지 들어 설명하세요. 하나는 응답 쪽, 하나는 요청
         쪽에서 고릅니다.
    constraints:
      - 저장 계층의 엔티티 구조는 바꾸지 않는다
      - 응답에 원가와 담당자 메모를 포함하지 않는다
    expectedConcepts:
      - 요청과 응답 형을 따로 두기
      - 생성 결과의 상태 코드와 위치 헤더
      - 내부 필드가 밖으로 새는 문제
      - 클라이언트가 정하면 안 되는 값
    rubric:
      - id: R1
        criterion: 요청과 응답을 위한 형을 따로 두고 엔티티를 직접 노출하지 않게 고친다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R2
        criterion: 생성 성공에 맞는 상태 코드와 만들어진 자원의 위치를 응답에 담는다
        weightBp: 2500
        axis: IMPLEMENTATION
      - id: R3
        criterion: 내부 전용 필드가 응답으로 새는 문제를 설명한다
        weightBp: 3000
        axis: EXPLANATION
      - id: R4
        criterion: 클라이언트가 정하면 안 되는 값을 그대로 받는 위험을 설명한다
        weightBp: 1500
        axis: EXPLANATION
    commonMistakes:
      - 직렬화에서 제외하는 표시만 붙이고 요청 쪽 문제를 그대로 둠
      - 응답 형만 만들고 요청은 엔티티로 계속 받음
      - 생성에도 200을 돌려주고 만들어진 자원의 위치를 알리지 않음
    transferTargets:
      - SECURITY.INPUT_VALIDATION
    hints:
      QUESTION_ONLY: 지금 이 응답 본문에는 고객에게 보여도 되는 값과 보이면 안 되는 값이 섞여 있지 않나요?
      CONCEPT_HINT: 저장 구조와 밖에 약속한 계약을 따로 두는 이유, 그리고 새로 만들었음을 알리는 응답 방식을 떠올려 보세요.
      DIRECTION: 밖에 나가도 되는 값과 밖에서 받아도 되는 값을 각각 목록으로 적고, 그 목록 그대로 형을 하나씩 만든 다음 컨트롤러에서 변환해 보세요.
