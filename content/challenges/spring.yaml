      두 클래스 모두 Notifier 인터페이스를 구현하고 컴포넌트로 등록되어 있습니다. 주문 서비스는 기본으로
      문자 발송을 쓰고, 정산 서비스는 이메일을 써야 합니다. 앞으로 두 곳 모두에 보내야 할 수도 있습니다.
