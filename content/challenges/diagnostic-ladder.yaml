  expectedConcepts:
  - 스트림 중간 연산
  - null과 Optional
  - flatMap
  - 실패를 드러내는 자리
  rubric:
  - id: R1
    criterion: 두 번째 map에서 null에 메서드를 부르기 때문이라고 짚는다
    weightBp: 3000
    axis: EXPLANATION
  - id: R2
    criterion: filter 방식과 Optional 방식을 각각 동작하는 코드로 쓴다
    weightBp: 4000
    axis: IMPLEMENTATION
  - id: R3
    criterion: 선택과 근거를 대고 그 선택이 이후 코드에 주는 영향을 설명한다
    weightBp: 3000
    axis: EXPLANATION
  commonMistakes:
  - 첫 map에서 예외가 난다고 답함
  - Optional을 쓰면서 get으로 꺼내 같은 문제를 남김
  - 두 방안을 쓰되 선택의 근거를 대지 못함
  transferTargets: []
  hints:
    QUESTION_ONLY: 스트림의 각 단계에서 흘러가는 값은 각각 무엇인가요?
    CONCEPT_HINT: null은 값이 아니라 값이 없다는 표시입니다. 표시에는 메서드를 부를 수 없습니다.
    DIRECTION: 배송지가 없는 주문 하나를 상상하고 각 단계에서 무엇이 되는지 따라가 보세요.
