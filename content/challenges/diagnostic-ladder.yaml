# Seed challenges — DIAGNOSTIC 사다리 보강 (docs/19 §3.6, §4 CV-59, ADR-058·059)
# L3 만 있던 category 에 L2 를 만들고, 진단이 하나도 없던 INTEGRATION 에 L2·L3 를 만든다.
# ALGORITHM·CS·NETWORK·SYSTEM_DESIGN 은 어느 트랙에서도 MUST(importance >= 0.70) 가 아니라
# CV-59 가 진단을 허용하지 않는다 — 콘텐츠가 빠진 것이 아니라 재지 않기로 한 자리다.
# 통과 판정은 docs/06 §7.4 (CORRECT 이고 maxHintLevel <= QUESTION_ONLY)
challenges:
- seedKey: DIAGNOSTIC.INTEGRATION.L2.001
  purpose: DIAGNOSTIC
  skills:
  - INTEGRATION.WEBHOOK
  difficulty: 2
  estimatedMinutes: 10
  isTransfer: false
  title: 연동 진단 — 같은 알림이 두 번 왔다
  scenario: "상대 시스템이 주문 상태 변경을 우리 쪽으로 보내 줍니다. 받는 코드는 이렇습니다.\n```java\n@PostMapping(\"/webhooks/order-status\")\n\
    public void receive(@RequestBody StatusChanged event) {\n    orderService.applyStatus(event.orderId(), event.status());\n\
    }\n```\n어제 같은 이벤트가 두 번 도착했고, 이미 취소된 주문이 다시 취소 처리되면서\n재고가 두 번 되돌아갔습니다. 상대 쪽은 \"응답이 늦어 재시도했다\"고 합니다."
  prompt: '1. 상대가 재시도하는 것이 잘못인지 판단하고 근거를 쓰세요.

    2. 같은 이벤트를 두 번 받아도 결과가 같게 하려면 무엇이 필요한지 쓰세요.

    3. 고친 코드의 뼈대를 쓰세요.


    힌트 없이 10분 안에 답하세요. 진단 결과는 학습 계획의 시작 수준을 정하는 데만 쓰입니다.'
  constraints:
  - 상대 시스템을 바꿀 수 없다고 가정한다
  expectedConcepts:
  - 적어도 한 번 전달
  - 멱등 처리
  - 이벤트 식별자
  - 중복 기록
  rubric:
  - id: R1
    criterion: 네트워크 위에서 재시도는 정상이고 받는 쪽이 대비해야 한다는 것을 설명한다
    weightBp: 3000
    axis: EXPLANATION
  - id: R2
    criterion: 이벤트 식별자를 기록해 두 번째를 걸러 내는 방식을 제시한다
    weightBp: 4000
    axis: IMPLEMENTATION
  - id: R3
    criterion: 상태 전이 자체를 여러 번 해도 결과가 같게 두는 방법을 함께 짚는다
    weightBp: 3000
    axis: EXPLANATION
  commonMistakes:
  - 상대 잘못이니 고쳐 달라고만 답함
  - 받은 시각으로 중복을 판단하려 함
  - 식별자는 기록하지만 동시에 두 건이 오는 경우를 다루지 않음
  transferTargets: []
  hints:
    QUESTION_ONLY: 상대가 응답을 못 받았을 때 할 수 있는 선택은 무엇이었나요?
    CONCEPT_HINT: 네트워크를 건너는 전달은 "정확히 한 번"을 약속하기 어렵습니다. 대개 "적어도 한 번"입니다.
    DIRECTION: 이벤트마다 고유한 값이 무엇인지 찾고, 그 값을 처음 볼 때만 처리하도록 순서를 적어 보세요.
