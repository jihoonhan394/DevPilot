        weightBp: 2000
        axis: EXPLANATION
      - id: R4
        criterion: 비우고 다시 넣는 방식이 중간 실패에서 무엇을 남기는지 설명한다
        weightBp: 2000
        axis: EXPLANATION
    commonMistakes:
