  - seedKey: PRACTICE.INTEGRATION.BATCH_SYNC.L3.001
    purpose: PRACTICE
    skills:
      - INTEGRATION.BATCH_SYNC
    difficulty: 3
    estimatedMinutes: 40
    isTransfer: true
    title: 매일 몇 건씩 조용히 빠지는 증분 동기화 고치기
    scenario: |-
      원본 시스템에서 변경된 회원만 매시간 가져옵니다. 조회 조건은 아래와 같고, 마지막 실행 시각은 배치가
      끝날 때 현재 시각으로 갱신합니다.
      ```sql
      SELECT * FROM member WHERE updated_at > :lastRunAt ORDER BY updated_at
      ```
      한 달에 몇 건씩 우리 쪽에만 없는 회원이 발견되는데, 그 회원들의 updated_at은 모두 배치가 돌던 시각
      부근입니다. 빠진 건은 그 뒤로 다시 들어오지 않고, 원본에서 다시 수정되어야만 들어옵니다.
      원본 테이블은 운영 중이라 구조를 바꾸려면 협의가 필요합니다.
    prompt: |-
      1. 행이 빠지는 이유를 트랜잭션 관점에서 설명하세요. 값이 정해지는 시점과 다른 트랜잭션에서 보이게
         되는 시점을 나누어 적습니다.
      2. 한 번 빠진 행이 왜 다음 실행에서도 들어오지 않는지 설명하세요.
      3. 커서 방식을 고치세요. 원본 구조를 바꾸지 않고 할 수 있는 방법과, 협의가 가능하다면 더 나은 방법을
         함께 적습니다.
      4. 고친 방식에서는 같은 행이 여러 번 들어올 수 있습니다. 적재 쪽이 어떤 조건을 만족해야 하는지 적고
         반영하세요.
    constraints:
      - 매번 전체를 다시 가져오는 방식으로 바꾸지 않는다
      - 원본 테이블 구조 변경은 협의가 필요한 선택지로만 제시한다
      - 새 인프라를 도입하지 않는다
    expectedConcepts:
      - 커밋 시점과 조회 스냅샷
      - 커서 기준 시각
      - 겹치는 구간 재조회
      - 단조 증가 변경 순번
      - 멱등 적재
    rubric:
      - id: R1
        criterion: 값이 정해지는 시점과 커밋 시점이 달라 조회에서 빠지는 과정을 설명한다
        weightBp: 3000
        axis: EXPLANATION
      - id: R2
        criterion: 커서를 겹쳐 읽거나 단조 증가 순번으로 바꾸는 방법을 구체적으로 적는다
        weightBp: 3000
        axis: IMPLEMENTATION
      - id: R3
        criterion: 같은 행이 다시 들어와도 결과가 같도록 적재를 멱등하게 만든다
        weightBp: 2000
        axis: IMPLEMENTATION
      - id: R4
        criterion: 한 번 빠진 행이 다음 실행에서도 들어오지 않는 이유를 설명한다
        weightBp: 2000
        axis: EXPLANATION
    commonMistakes:
      - 커서를 배치 종료 시각으로 갱신해 실행 중 커밋된 행을 영영 놓침
      - 겹쳐 읽도록 바꾸고 적재는 그대로 두어 중복 행이 쌓임
      - 빠진 건을 사람이 찾아 수동으로 넣는 것으로 마무리함
      - 전체 재적재로 바꿔 매시간 원본에 부하를 줌
    transferTargets:
      - DATABASE.TRANSACTION
    hints:
      QUESTION_ONLY: 조회가 시작된 뒤에 커밋된 행은 그 조회 결과에 나타날 수 있을까요?
      CONCEPT_HINT: 조회가 어느 시점의 상태를 보는지에 대한 규칙과, 시각 대신 쓸 수 있는 증가하는 값을 떠올려 보세요.
      DIRECTION: 행에 시각이 찍히는 순간과 다른 세션이 그 행을 볼 수 있게 되는 순간을 종이에 시간 순으로 그려 보고, 그 틈만큼 커서를 물리면 무엇이 더 필요해지는지 따져 보세요.

