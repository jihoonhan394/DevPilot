      @Transactional
      public void load(List<ProductRow> rows) {
          productRepository.deleteAll();
          rows.forEach(row -> productRepository.save(toEntity(row)));
      }
      ```
      어제는 파일 전송이 중간에 끊겨 6만 건 중 2만 건만 받은 상태로 배치가 돌았고, 오전 내내 상품 목록
      화면에 일부 상품이 보이지 않았습니다. 담당자는 배치를 다시 돌리는 것이 안전한지 몰라 연락을
      기다렸습니다.
    prompt: |-
      1. 배치를 다시 돌려도 안전하도록 적재 방식을 바꾼 코드를 작성하세요.
      2. 그 방식이 동작하려면 대상 테이블에 무엇이 있어야 하는지 적으세요.
      3. 원본에서 사라진 상품을 어떻게 다룰지 정하고 이유를 적으세요.
      4. 지우고 다시 넣는 방식이 왜 위험한지, 어제 같은 상황에서 무엇이 달라졌을지 설명하세요.
    constraints:
      - 대상 테이블을 통째로 비우지 않는다
      - 파일이 불완전할 때를 판단할 수 있어야 한다
      - 새 인프라를 도입하지 않는다
    expectedConcepts:
      - 업무 키와 유일 제약
      - 키 기준 upsert
      - 재실행 안전성
