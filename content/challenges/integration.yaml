# Seed challenges — INTEGRATION (PRACTICE)
# Spec: docs/19-content-spec.md §3.6 (schema), §6 (난이도), §7 (rubric·hint 작성 가이드), §7.7 (문제 세 종류)
# 기준: Spring Boot 4.1 / Spring Framework 7 / PostgreSQL 16 / OpenAPI 3.1.1 / RFC 9110 · 9457 · 6749 · 6750 · 4180
# 연동·구축 트랙의 난이도 상한은 4다 (06 §5.3). 이 파일은 2~3으로 둔다
challenges:
  - seedKey: PRACTICE.INTEGRATION.API_CONTRACT.L2.001
    purpose: PRACTICE
    skills:
      - INTEGRATION.API_CONTRACT
    difficulty: 2
    estimatedMinutes: 30
    isTransfer: false
    title: 메일로 보낸 필드 목록을 API 명세로 바꾸기
    scenario: |-
      주문 상태 조회 API에 고객사 두 곳이 붙습니다. 지금 전달한 문서는 메일 본문의 필드 목록 한 장이고,
      오류 응답은 적혀 있지 않습니다. 고객사 A는 실패해도 200이 오고 본문 message로 알 수 있다고 보고
      문자열을 비교하도록 구현했고, 고객사 B는 없는 주문이면 404가 온다고 보고 구현했습니다. 실제 서버는
      아래와 같습니다.
      ```java
      @GetMapping("/api/v1/orders/{orderNo}")
      OrderStatusResponse get(@PathVariable String orderNo) {
          return orderQueryService.findStatus(orderNo);   // 없으면 OrderNotFoundException
      }
      ```
      오류가 날 때 어떤 상태 코드와 어떤 본문이 나가는지는 아무 문서에도 없습니다.
    prompt: |-
      1. 이 끝점의 요청과 응답을 OpenAPI 3.1 문서로 작성하세요. 성공 응답과, 없는 주문·잘못된 형식·서버
         오류에 해당하는 응답을 상태 코드별로 모두 적습니다.
      2. 오류 본문 스키마를 한 곳에 정의하고 각 응답에서 참조하도록 문서를 구성하세요. 고객사가 분기에
         쓸 오류 구분 값과 그 값의 목록도 정하세요.
      3. 고객사가 오류 문구가 아니라 값으로 분기하게 해야 하는 이유와, 이 문서가 있을 때 고객사가 붙이기
         전에 무엇까지 구현할 수 있는지 설명하세요.
    constraints:
      - 오류 본문은 RFC 9457 problem detail 형식을 따른다
      - 새 라이브러리나 인프라를 도입하지 않는다
      - 내부 예외 이름이나 스택 트레이스를 응답 스키마에 넣지 않는다
    expectedConcepts:
      - 상태 코드별 응답 정의
      - 공용 스키마 참조
      - 오류 구분 코드 값
      - RFC 9457 problem detail
      - 명세 우선 합의
    rubric:
      - id: R1
        criterion: 성공과 실패를 상태 코드별로 나누어 각각의 본문 스키마를 명세에 적는다
        weightBp: 3500
        axis: IMPLEMENTATION
      - id: R2
        criterion: 오류 본문 스키마를 한 곳에 정의하고 각 응답에서 참조한다
        weightBp: 2500
        axis: IMPLEMENTATION
      - id: R3
        criterion: 문구가 아니라 오류 구분 값으로 분기하게 해야 하는 이유를 설명한다
        weightBp: 2000
        axis: EXPLANATION
      - id: R4
        criterion: 명세가 먼저 있을 때 상대가 붙이기 전에 구현할 수 있는 범위를 설명한다
        weightBp: 2000
        axis: EXPLANATION
    commonMistakes:
      - 성공 응답만 적고 오류는 "오류 시 메시지 반환"으로 뭉뚱그림
      - 끝점마다 오류 본문을 따로 적어 형식이 서로 달라짐
      - 오류를 사람이 읽는 문구로만 구분하게 둠
      - 내부 예외 이름을 그대로 응답 필드에 노출함
    transferTargets:
      - WEB_HTTP.REST_API_DESIGN
      - SPRING.EXCEPTION_HANDLING
    hints:
      QUESTION_ONLY: 지금 문서만 받은 사람이 실패했을 때 무엇을 보고 판단해야 하는지 알 수 있을까요?
      CONCEPT_HINT: 응답을 상태 코드별로 나누어 적는 것과, 같은 모양을 여러 응답이 함께 쓰도록 한 곳에 정의해 두는 방법을 떠올려 보세요.
      DIRECTION: 성공, 예상한 실패, 예상하지 못한 실패 세 갈래로 먼저 나누고 각각에 상태 코드를 배정한 다음, 본문에서 공통으로 빠지는 부분과 끝점마다 다른 부분을 갈라 보세요.

  - seedKey: PRACTICE.INTEGRATION.API_CONTRACT.L3.001
    purpose: PRACTICE
    skills:
      - INTEGRATION.API_CONTRACT
    difficulty: 3
    estimatedMinutes: 40
    isTransfer: false
    title: 이미 연동 중인 응답을 바꿔 달라는 요구 판정하기
    scenario: |-
      고객사 세 곳이 붙어 있는 조회 API에 내부 요구가 들어왔습니다. ① 응답 필드 customerNo를 partnerCode로
      바꾼다 ② 금액 필드를 문자열에서 숫자로 바꾼다 ③ 선택 항목이던 요청 파라미터 channel을 필수로 바꾼다
      ④ 응답에 새 필드 deliveryEta를 추가한다. 고객사 한 곳은 내부 일정 때문에 앞으로 6개월 동안 클라이언트를
      고칠 수 없다고 알려 왔습니다. 현재 명세 문서는 한 벌이고 버전 구분이 없습니다.
    prompt: |-
      1. ①~④가 각각 이미 붙어 있는 고객사의 구현을 깨뜨리는지 판정하고, 왜 그런지 근거를 적으세요.
      2. 깨뜨리는 요구를 지금 상태 그대로 내보낼 수 있는 방법이 있는지, 있다면 명세와 구현을 각각 어떻게
         두어야 하는지 적으세요.
      3. 그래도 깨뜨릴 수밖에 없는 요구에 대해 전환 절차를 설계하세요. 무엇을 언제 알리고, 두 형태를 얼마나
         함께 운영하며, 옛 형태를 언제 어떻게 끝낼지 적습니다.
      4. 명세만 고치고 구현을 두거나 구현만 고치고 명세를 두면 각각 어떤 일이 생기는지 설명하세요.
    constraints:
      - 고객사에게 같은 날 모두 고치라고 요구하지 않는다
      - 끝점을 통째로 새로 만들되 옛 끝점을 그대로 방치하는 방식은 쓰지 않는다
      - 변경 사항은 문서와 구현에 함께 반영한다
    expectedConcepts:
      - 호환을 깨는 변경과 깨지 않는 변경
      - 선택 필드 추가
      - 버전 분리와 병행 운영
      - 전환 기간 공지와 종료
      - 문서와 구현의 일치
    rubric:
      - id: R1
        criterion: 네 가지 요구를 각각 호환을 깨는지 판정하고 근거를 댄다
        weightBp: 3000
        axis: EXPLANATION
      - id: R2
        criterion: 두 형태를 함께 내보내거나 버전을 나누는 방법을 명세와 구현 양쪽으로 적는다
        weightBp: 2500
        axis: IMPLEMENTATION
      - id: R3
        criterion: 공지 시점과 병행 기간, 옛 형태 종료 시점을 포함한 전환 절차를 설명한다
        weightBp: 2500
        axis: EXPLANATION
      - id: R4
        criterion: 문서와 구현 중 한쪽만 바뀌었을 때 생기는 문제를 설명한다
        weightBp: 2000
        axis: EXPLANATION
    commonMistakes:
      - 필드 이름 변경을 "문서만 고치면 되는 일"로 봄
      - 모든 변경을 새 버전으로 미뤄 버전이 끝없이 늘어남
      - 전환 기간만 정하고 옛 형태를 끄는 시점을 정하지 않음
      - 선택 항목을 필수로 바꾸는 것을 추가와 같은 변경으로 봄
    transferTargets:
      - WEB_HTTP.REST_API_DESIGN
    hints:
      QUESTION_ONLY: 지금 붙어 있는 고객사가 아무것도 고치지 않았을 때, 네 가지 요구 중 어느 것이 그 코드를 멈추게 할까요?
      CONCEPT_HINT: 더하는 변경과 빼거나 바꾸는 변경의 차이, 그리고 두 형태를 한동안 함께 두는 방식을 떠올려 보세요.
      DIRECTION: 요구를 하나씩 "받는 쪽이 모르는 채로 지나갈 수 있는가"로 걸러 보고, 지나갈 수 없는 것만 남겨 공지와 병행 운영과 종료 순서로 일정을 잡아 보세요.

  - seedKey: PRACTICE.INTEGRATION.INTERFACE_SPEC.L3.001
    purpose: PRACTICE
    skills:
      - INTEGRATION.INTERFACE_SPEC
    difficulty: 3
    estimatedMinutes: 40
    isTransfer: false
    title: 메일 한 통으로 온 연동 요구를 명세서로 정리하기
    scenario: |-
      고객사 담당자에게서 이렇게 전달받았습니다. "매일 새벽에 회원 정보를 넘겨 주세요. 전부 말고 변경된
      것만요. 형식은 CSV로 주시면 되고, 실패하면 다시 보내 주세요. 필수 항목은 이름, 연락처, 가입일 정도면
      됩니다." 지난주 회의록에는 "회원 정보는 주 1회면 충분하다"고 적혀 있습니다. 사내 개인정보 처리
      기준에는 연락처를 그대로 내보내지 않는다는 항목이 있습니다. 이 상태로 구현을 시작하면 며칠 뒤부터
      같은 질문이 전화로 돌아옵니다.
    prompt: |-
      1. 이 요구에서 빠진 정보를 목록으로 적으세요. 항목 정의, 주기와 시각, 전달 방식, 실패 처리, 보안 ·
         개인정보처럼 성격별로 나누어 적습니다.
      2. 서로 어긋나는 대목을 짚고, 각각 누구에게 무엇을 확인해야 하는지 적으세요.
      3. 확인 전이라도 내가 기본값으로 정해 둘 것과 그 근거를 적으세요. 정하면 안 되는 것은 왜 정하면
         안 되는지도 함께 적습니다.
      4. 재처리 절차에 무엇이 들어가야 운영 중에 사람이 매번 판단하지 않아도 되는지 설명하세요.
    constraints:
      - 코드를 쓰지 않는다
      - 확인이 필요한 항목을 임의로 정하고 넘어가지 않는다
      - 개인정보 항목은 사내 기준을 우선한다
    expectedConcepts:
      - 항목 정의의 빈칸
      - 주기와 기준 시각
      - 요구 수준 구분
      - 재처리 절차와 한도
      - 중복 방지 식별자
    rubric:
      - id: R1
        criterion: 빠진 정보를 성격별로 나누어 항목 정의와 운영 조건까지 짚는다
        weightBp: 3000
        axis: DEBUGGING
      - id: R2
        criterion: 서로 어긋나는 대목을 짚고 무엇을 누구에게 확인할지 적는다
        weightBp: 2000
        axis: DEBUGGING
      - id: R3
        criterion: 스스로 정할 기본값과 정하면 안 되는 것을 근거와 함께 구분한다
        weightBp: 3000
        axis: EXPLANATION
      - id: R4
        criterion: 재처리 대상 판단과 재시도 한도, 중복 방지를 포함한 절차를 설명한다
        weightBp: 2000
        axis: EXPLANATION
    commonMistakes:
      - 빠진 것을 묻지 않고 "보통 이렇게 한다"로 정해 버림
      - 항목 이름만 나열하고 필수 여부 · 형식 · 값 목록을 비워 둠
      - 실패하면 다시 보낸다는 문장을 그대로 명세서에 옮겨 적음
      - 회의록과 메일이 다른 것을 알고도 한쪽만 보고 진행함
    transferTargets:
      - SECURITY.SENSITIVE_DATA_LOGGING
    hints:
      QUESTION_ONLY: 이 글만 읽고 구현을 시작한 사람이 가장 먼저 되물을 질문은 무엇일까요?
      CONCEPT_HINT: 값 하나를 정의하는 데 필요한 것들과, 반드시 해야 하는 일과 권장하는 일을 갈라 적는 방식을 떠올려 보세요.
      DIRECTION: 항목 하나를 골라 이름부터 예시 값까지 채워 보면서 채울 수 없는 칸을 모으고, 그다음 언제 · 무엇으로 · 실패하면 어떻게 순서로 운영 조건을 훑어 보세요.

  - seedKey: PRACTICE.INTEGRATION.CLIENT_AUTH.L2.001
    purpose: PRACTICE
    skills:
      - INTEGRATION.CLIENT_AUTH
    difficulty: 2
    estimatedMinutes: 30
    isTransfer: false
    title: 호출마다 새로 받던 토큰을 재사용과 만료 갱신으로 바꾸기
    scenario: |-
      연동 대상에서 "토큰 발급 호출이 분당 제한을 넘었다"는 연락이 왔습니다. 현재 코드는 아래와 같고,
      토큰 응답에는 수명이 초 단위로 들어 있습니다.
      ```java
      @Service
      class PartnerOrderSender {
          OrderResult send(OrderRequest request) {
              TokenResponse token = authClient.issueToken(clientId, clientSecret);
              return apiClient.postOrder(token.accessToken(), request);
          }
      }
      ```
      자원 서버는 만료된 토큰을 받으면 401과 함께 invalid_token을 돌려줍니다.
    prompt: |-
      1. 다음이 동작하게 고치세요. 토큰을 한 번 받아 만료 전까지 재사용하고, 만료가 가까우면 미리 새로
         받고, 그래도 401이 오면 새 토큰으로 한 번만 다시 보냅니다.
      2. 셋 중 무엇을 먼저 구현하고 무엇을 뒤로 미룰지 정하고, 그렇게 정한 이유를 한 줄로 적으세요.
    constraints:
      - 새 라이브러리나 캐시 인프라를 추가하지 않는다
      - 현재 시각은 주입된 Clock으로 판단한다
      - 토큰 값을 로그에 남기지 않는다
      - 공개 메서드 시그니처는 그대로 둔다
    expectedConcepts:
      - 토큰 캐시와 만료 시각 보관
      - 만료 여유 시간
      - 401 응답 후 한 번 재시도
      - 자격 증명 로그 금지
    rubric:
      - id: R1
        criterion: 발급받은 토큰을 만료 시각과 함께 보관해 다음 호출에서 재사용한다
        weightBp: 3500
        axis: IMPLEMENTATION
      - id: R2
        criterion: 만료 직전에 새로 받도록 여유 시간을 두고 판단한다
        weightBp: 2500
        axis: IMPLEMENTATION
      - id: R3
        criterion: 401 응답을 받으면 새 토큰으로 한 번만 다시 보내고 끝없이 반복하지 않는다
        weightBp: 2000
        axis: IMPLEMENTATION
      - id: R4
        criterion: 먼저 구현할 것과 뒤로 미룰 것을 정하고 그 근거를 설명한다
        weightBp: 2000
        axis: EXPLANATION
    commonMistakes:
      - 토큰만 보관하고 만료 시각을 보관하지 않아 만료를 알 수 없음
      - 만료 판단을 무인자 현재 시각으로 해 테스트할 수 없게 만듦
      - 401이 반복될 때 재시도가 끝나지 않음
      - 디버깅한다고 토큰 값을 로그에 찍음
    transferTargets:
      - SECURITY.SECRET_MANAGEMENT
    hints:
      QUESTION_ONLY: 지금 코드는 방금 받은 토큰이 아직 쓸 수 있는 토큰인지 어떻게 알 수 있을까요?
      CONCEPT_HINT: 발급 응답에 들어 있는 수명 값과, 값을 다시 쓰기 위해 함께 들고 있어야 하는 정보를 떠올려 보세요.
      DIRECTION: 보관할 것을 값 하나가 아니라 값과 쓸 수 있는 시한 한 쌍으로 잡고, 보낼 때마다 시한을 먼저 보고 필요하면 받아 오는 순서로 나눠 보세요.

  - seedKey: PRACTICE.INTEGRATION.CLIENT_AUTH.L3.001
    purpose: PRACTICE
    skills:
      - INTEGRATION.CLIENT_AUTH
