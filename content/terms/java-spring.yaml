# DevPilot 용어 사전 — Java · Spring
# Spec: docs/19-content-spec.md §3.10
terms:
  - key: TERM.SPRING.DEPENDENCY_INJECTION
    representative: 의존성 주입
    english: dependency injection
    definition: |-
      필요한 협력 객체를 스스로 만들지 않고 바깥에서 받아 쓰게 하는 방식이다.
    example: |-
      생성자로 받게 바꾸자 테스트에서 가짜 구현을 넣어 줄 수 있게 됐다.
    confusableWith: [TERM.SPRING.PROXY]
    skillCodes: [SPRING.DI_IOC]
    level: BASIC
    sourceUrl: https://docs.spring.io/spring-framework/reference/core/beans.html
    retired: false

  - key: TERM.SPRING.PROXY
    representative: 프록시
    english: proxy
    aliases: [대리 객체]
    definition: |-
      원래 객체 앞에 서서 같은 인터페이스로 호출을 먼저 받고, 앞뒤로 할 일을 얹은 뒤 넘겨주는 객체다.
    example: |-
      같은 클래스 안에서 부른 메서드에는 트랜잭션이 걸리지 않았는데, 호출이 그 앞을 지나가지 않았기 때문이었다.
    confusableWith: [TERM.SPRING.DEPENDENCY_INJECTION, TERM.SPRING.PROPAGATION]
    skillCodes: [SPRING.AOP_PROXY]
    level: PRACTICAL
    sourceUrl: https://docs.spring.io/spring-framework/reference/core/aop.html
    retired: false

  - key: TERM.SPRING.PROPAGATION
    representative: 전파 속성
    english: propagation
    definition: |-
      이미 열려 있는 작업 단위 안에서 다시 호출됐을 때 그 단위에 참여할지 새로 열지 정하는 설정이다.
    example: |-
      REQUIRES_NEW로 바꿔, 바깥이 롤백돼도 감사 로그만은 남게 했다.
    confusableWith: [TERM.DATABASE.TRANSACTION, TERM.SPRING.PROXY]
    skillCodes: [SPRING.TRANSACTION.PROPAGATION, SPRING.TRANSACTION]
    level: PRACTICAL
    sourceUrl: https://docs.spring.io/spring-framework/reference/data-access/transaction.html
    retired: false

  - key: TERM.JAVA.CHECKED_EXCEPTION
    representative: 체크 예외
    english: checked exception
    aliases: [검사 예외]
    definition: |-
      메서드가 던질 수 있다고 서명에 적어 두어야 하고, 부르는 쪽이 잡거나 다시 던지도록 컴파일러가 강제하는 종류다.
    example: |-
      IOException을 그대로 올리자 호출부마다 throws가 번져, 경계에서 한 번만 감싸기로 했다.
    confusableWith: [TERM.JAVA.UNCHECKED_EXCEPTION]
    skillCodes: [JAVA.EXCEPTION]
    level: BASIC
    sourceUrl: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Exception.html
    retired: false

  - key: TERM.JAVA.UNCHECKED_EXCEPTION
    representative: 언체크 예외
    english: unchecked exception
    aliases: [비검사 예외, 런타임 예외]
    definition: |-
      서명에 적지 않아도 되고 잡지 않아도 컴파일되는 종류로, 대개 호출 쪽의 잘못을 알리는 데 쓴다.
    example: |-
      입력이 규칙을 어겼을 때 IllegalArgumentException을 던져 경계 밖으로 그대로 올라가게 뒀다.
    confusableWith: [TERM.JAVA.CHECKED_EXCEPTION]
    skillCodes: [JAVA.EXCEPTION]
    level: BASIC
    sourceUrl: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/RuntimeException.html
    retired: false

  - key: TERM.JAVA.VIRTUAL_THREAD
    representative: 가상 스레드
    english: virtual thread
    definition: |-
      운영체제 것을 하나씩 차지하지 않고 JVM이 얹었다 내렸다 하며 쓰는 가벼운 실행 흐름이다.
    example: |-
      외부 API를 기다리는 동안 풀이 말라붙던 구간을 바꾸자 같은 장비에서 동시 처리량이 늘었다.
    confusableWith: []
    skillCodes: [JAVA.CONCURRENCY.VIRTUAL_THREAD, JAVA.CONCURRENCY]
    level: PRACTICAL
    sourceUrl: https://docs.oracle.com/en/java/javase/25/core/virtual-threads.html
    retired: false

  - key: TERM.TESTING.ASSERTION
    representative: 단언
    english: assertion
    definition: |-
      기대한 값과 실제 값이 같은지 테스트가 직접 확인해, 다르면 그 자리에서 실패로 끝내는 문장이다.
    example: |-
      "오류가 안 나면 통과"였던 테스트에 기대값을 적어 넣자 숨어 있던 반올림 버그가 드러났다.
    confusableWith: []
    skillCodes: [TESTING.JUNIT, TESTING.UNIT_TEST_DESIGN]
    level: BASIC
    sourceUrl: https://junit.org/junit5/docs/current/user-guide/
    retired: false
