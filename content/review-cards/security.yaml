# Seed review cards — SECURITY
# Spec: docs/19-content-spec.md §3.5 (schema), §7.3 (작성 가이드)
# 기준: OWASP Cheat Sheet Series, JWT(JWS)
cards:
  - conceptKey: SECURITY.OWASP_TOP10.SSRF
    skill: SECURITY.OWASP_TOP10
    reviewType: EXPLAIN
    prompt: >-
      사용자가 입력한 URL의 미리보기를 서버가 가져오는 기능이 있습니다. 어떤 공격이 가능하고, 위험을 어떻게
      줄이나요?
    expectedAnswer: >-
      SSRF(Server-Side Request Forgery)다. 공격자가 localhost, 사설 IP, 클라우드 메타데이터 주소 같은 내부
      주소를 입력해 외부에서 접근할 수 없는 자원에 서버가 대신 요청하게 만든다. 허용 도메인 allowlist를 두고,
      DNS 해석 결과가 사설·루프백·링크 로컬 주소면 차단하고, 리다이렉트는 따라가지 않거나 다시 검증하고,
      응답 크기와 타임아웃을 제한한다. 가능하면 서버가 사용자 URL을 가져오지 않는 설계를 고른다.
    rubric:
      - id: R1
        criterion: SSRF로 내부 자원에 접근하게 만드는 위험
      - id: R2
        criterion: allowlist와 내부 IP 차단
      - id: R3
        criterion: 리다이렉트 재검증, 크기·타임아웃 제한 또는 fetch하지 않는 설계

  - conceptKey: SECURITY.AUTHN_AUTHZ.IDOR
    skill: SECURITY.AUTHN_AUTHZ
    reviewType: BUG_SPOT
    prompt: |-
      인증된 사용자만 호출할 수 있는 API입니다. 어떤 보안 문제가 있고 어떻게 고치나요?
      ```java
      @GetMapping("/orders/{orderId}")
      OrderResponse get(@PathVariable UUID orderId) {
          Order order = orderRepository.findById(orderId)
              .orElseThrow(OrderNotFoundException::new);
          return OrderResponse.from(order);
      }
      ```
    expectedAnswer: >-
      인증만 확인하고 주문의 소유자를 확인하지 않아, 다른 사용자의 orderId를 알면 그 주문을 조회할 수 있다
      (IDOR, 접근 제어 실패). UUID는 추측을 어렵게 할 뿐 접근 제어가 아니다. 현재 사용자 ID를 조회 조건에
      포함(findByIdAndUserId)하고, 없으면 존재 여부를 숨기도록 404로 응답한다.
    rubric:
      - id: R1
        criterion: 소유권 확인 누락(IDOR)
      - id: R2
        criterion: 추측하기 어려운 ID는 접근 제어가 아니다
      - id: R3
        criterion: 사용자 ID를 조회 조건에 포함하고 404로 응답

  - conceptKey: SECURITY.AUTHN_AUTHZ.JWT_PAYLOAD_NOT_ENCRYPTED
    skill: SECURITY.AUTHN_AUTHZ
    reviewType: RECALL
    prompt: >-
      서명된 JWT의 payload에 사용자 휴대폰 번호를 넣어도 괜찮을까요? JWT 서명이 보장하는 것은 무엇인가요?
    expectedAnswer: >-
      괜찮지 않다. 서명된 JWT(JWS)의 header와 payload는 Base64URL로 인코딩되었을 뿐 암호화되지 않아 토큰을
      가진 누구나 디코딩해 읽을 수 있다. 서명은 발급자가 만든 뒤 내용이 바뀌지 않았다는 무결성과 출처를
      검증할 뿐 기밀성을 주지 않는다. 민감한 개인정보나 비밀 값은 claim에 넣지 않는다.
    rubric:
      - id: R1
        criterion: payload는 인코딩일 뿐 암호화가 아니다
      - id: R2
        criterion: 서명은 무결성과 출처만 보장한다
      - id: R3
        criterion: 민감 정보를 claim에 넣지 않는다

  - conceptKey: SECURITY.INPUT_VALIDATION.ORDER_BY_INJECTION
    skill: SECURITY.INPUT_VALIDATION
    reviewType: BUG_SPOT
    prompt: |-
      authorId는 바인딩했는데도 SQL 인젝션이 가능한 이유와 수정 방법은? (sort는 요청 파라미터 값)
      ```java
      String sql = "SELECT id, title FROM posts WHERE author_id = ? ORDER BY " + sort;
      return jdbcTemplate.query(sql, postRowMapper, authorId);
      ```
    expectedAnswer: >-
      sort를 문자열로 이어 붙여 사용자 입력이 SQL 구문의 일부가 된다. 컬럼 이름이나 정렬 방향 같은 식별자는
      바인드 변수로 넘길 수 없으므로, 요청 값을 허용 목록(예: createdAt은 created_at DESC)으로 매핑하고 목록에
      없으면 400으로 거부한다. 사용자 입력이 SQL 문자열에 직접 들어가지 않게 한다.
    rubric:
      - id: R1
        criterion: 식별자 위치의 문자열 연결이 인젝션을 만든다
      - id: R2
        criterion: 컬럼명·정렬 방향은 바인드 변수로 넘길 수 없다
      - id: R3
        criterion: allowlist 매핑과 거부

  - conceptKey: SECURITY.SECRET_MANAGEMENT.LEAKED_SECRET_RESPONSE
    skill: SECURITY.SECRET_MANAGEMENT
    reviewType: RECALL
    prompt: >-
      public GitHub 저장소에 API 키가 들어간 커밋을 푸시했습니다. 다음 커밋에서 키를 지우면 충분한가요? 올바른
      대응 순서는?
    expectedAnswer: >-
      충분하지 않다. 커밋 이력, fork, 캐시에 키가 남고 public 저장소는 자동 수집될 수 있으므로 이미 노출되었다고
      가정한다. 먼저 해당 키를 폐기하고 새 키로 교체(rotate)한 뒤, 노출 기간의 사용 기록을 확인하고, 필요하면
      이력을 정리한다. 이후 secret scanning과 push protection을 켜고 키는 환경변수나 secret 저장소로 주입한다.
    rubric:
      - id: R1
        criterion: 삭제 커밋만으로는 이력에 남아 노출된 것으로 본다
      - id: R2
        criterion: 즉시 폐기와 재발급(rotate)
      - id: R3
        criterion: 사용 기록 확인과 재발 방지(secret scanning, 외부 주입)

  - conceptKey: SECURITY.SENSITIVE_DATA_LOGGING.WHAT_NOT_TO_LOG
    skill: SECURITY.SENSITIVE_DATA_LOGGING
    reviewType: RECALL
    prompt: >-
      애플리케이션 로그에 그대로 남기면 안 되는 데이터 종류를 네 가지 이상 들고, 대신 어떻게 처리하나요?
    expectedAnswer: >-
      비밀번호, 액세스 토큰과 세션 식별자, API 키와 암호화 키, 결제 정보, 민감한 개인정보는 그대로 기록하지
      않는다. 제거하거나 마스킹, 해시, 암호화한다. 요청·응답 본문 전체나 Authorization 헤더를 통째로 로깅하면
      이런 값이 함께 남기 쉬우므로 필요한 필드만 기록한다.
    rubric:
      - id: R1
        criterion: 비밀번호, 토큰·세션 ID, 키, 결제·개인정보
      - id: R2
        criterion: 제거·마스킹·해시 처리
      - id: R3
        criterion: 본문과 헤더 전체 로깅을 피한다
