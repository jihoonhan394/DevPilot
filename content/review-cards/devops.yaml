# Seed review cards — DEVOPS
# Spec: docs/19-content-spec.md §3.5 (schema), §7.3 (작성 가이드)
cards:
  - conceptKey: DEVOPS.GIT.REBASE_SHARED_BRANCH
    skill: DEVOPS.GIT
    reviewType: EXPLAIN
    prompt: >-
      rebase는 무엇을 바꾸나요? 이미 동료가 받아 간 공유 브랜치를 rebase하고 force push하면 어떤 문제가
      생기고, rebase는 언제 쓰나요?
    expectedAnswer: >-
      rebase는 커밋을 새 기준 커밋 위에 다시 만들어 커밋 해시가 바뀌는 이력 재작성이다. 공유 브랜치를
      rebase하고 force push하면 동료의 로컬 이력과 어긋나 작업이 덮어써지거나 커밋이 중복된다. 아직 공유하지
      않은 개인 작업 브랜치를 PR 전에 정리할 때 쓰고, 공유 브랜치에는 merge를 쓴다. force push가 꼭 필요하면
      --force-with-lease를 쓴다.
    rubric:
      - id: R1
        criterion: rebase는 커밋 해시를 바꾸는 이력 재작성이다
      - id: R2
        criterion: 공유 브랜치 force push가 동료 작업을 망가뜨린다
      - id: R3
        criterion: 개인 브랜치 정리에만 쓰고 공유 브랜치는 merge

  - conceptKey: DEVOPS.DOCKER.CONTAINER_WRITABLE_LAYER
    skill: DEVOPS.DOCKER
    reviewType: RECALL
    prompt: >-
      Docker 이미지와 컨테이너의 차이는? PostgreSQL 컨테이너를 삭제 후 다시 만들었더니 데이터가 사라졌습니다.
      이유와 해결 방법은?
    expectedAnswer: >-
      이미지는 읽기 전용 레이어로 이루어진 실행 템플릿이고, 컨테이너는 이미지 위에 쓰기 가능한 레이어를
      더한 실행 인스턴스다. 컨테이너 안에서 쓴 데이터는 그 쓰기 레이어에 있어서 컨테이너를 삭제하면 함께
      사라진다. DB 데이터 디렉터리는 named volume이나 bind mount로 컨테이너 밖에 보관한다.
    rubric:
      - id: R1
        criterion: 이미지는 읽기 전용 템플릿, 컨테이너는 쓰기 레이어가 추가된 인스턴스
      - id: R2
        criterion: 컨테이너 삭제 시 쓰기 레이어 데이터가 사라진다
      - id: R3
        criterion: 볼륨으로 영속 데이터를 분리한다

  - conceptKey: DEVOPS.DOCKER.LAYER_CACHE_ORDER
    skill: DEVOPS.DOCKER
    reviewType: BUG_SPOT
    prompt: |-
      소스 한 줄만 바꿔도 이미지 빌드가 매번 오래 걸립니다. 원인과 개선 방법은?
      ```dockerfile
      FROM eclipse-temurin:25-jdk
      WORKDIR /app
      COPY . .
      RUN ./gradlew dependencies --no-daemon
      RUN ./gradlew bootJar --no-daemon
      CMD ["java", "-jar", "build/libs/app.jar"]
      ```
    expectedAnswer: >-
      COPY . .가 먼저 나와서 소스가 조금만 바뀌어도 그 레이어 캐시가 무효화되고, 이후 의존성 다운로드와 빌드
      단계도 매번 다시 실행된다. 빌드 스크립트와 Gradle wrapper 파일을 먼저 복사해 의존성을 받는 레이어를
      만든 뒤 소스를 복사한다. 또한 멀티 스테이지 빌드로 빌드 결과 jar만 JRE 기반 실행 이미지에 복사해
      이미지 크기를 줄인다.
    rubric:
      - id: R1
        criterion: 레이어 캐시는 앞 단계가 바뀌면 이후 단계가 모두 다시 실행된다
      - id: R2
        criterion: 자주 바뀌지 않는 빌드 스크립트를 먼저 복사한다
      - id: R3
        criterion: 멀티 스테이지로 실행 이미지를 분리한다

  - conceptKey: DEVOPS.CI_GITHUB_ACTIONS.FORK_PR_SECRETS
    skill: DEVOPS.CI_GITHUB_ACTIONS
    reviewType: RECALL
    prompt: >-
      public 저장소에 fork에서 PR이 올라왔습니다. 이 PR로 실행되는 GitHub Actions 워크플로에서 저장소 secret을
      쓸 수 있나요? CI와 배포 워크플로를 어떻게 설계해야 하나요?
    expectedAnswer: >-
      GITHUB_TOKEN을 제외한 secret은 fork 저장소에서 트리거된 워크플로에 전달되지 않는다. 따라서 PR용 CI는
      secret 없이 통과하도록 fake 설정이나 테스트 컨테이너로 구성하고, secret이 필요한 배포 job은 main 브랜치
      push처럼 신뢰할 수 있는 이벤트에서만 실행한다. pull_request_target은 fork 코드를 secret이 있는 권한으로
      실행할 위험이 있어 신중하게 쓴다.
    rubric:
      - id: R1
        criterion: fork PR 워크플로에는 secret이 전달되지 않는다
      - id: R2
        criterion: PR CI는 secret 없이 통과하도록 구성한다
      - id: R3
        criterion: 배포는 신뢰할 수 있는 이벤트에서만 실행한다

  - conceptKey: DEVOPS.OFFLINE_DEPLOY.DEPENDENCY_BUNDLE
    skill: DEVOPS.OFFLINE_DEPLOY
    reviewType: EXPLAIN
    prompt: >-
      내 PC에서는 빌드가 되는데 인터넷이 없는 현장에서는 의존성을 받지 못해 설치가 멈춥니다. 반입 꾸러미를
      만들 때 무엇을 고정하고 무엇을 함께 가져가야 하나요?
    expectedAnswer: >-
      먼저 의존성 버전을 고정한다. 범위나 변동 버전으로 적힌 의존성이 있으면 잠금 파일로 실제 해석된
      버전을 기록하고 그 파일을 저장소에 함께 둔다. 그다음 그 버전 그대로 받은 아티팩트와 빌드에 필요한
      도구(빌드 배포판, 런타임 이미지)를 같은 꾸러미에 담고, 받은 파일이 옮기는 동안 바뀌지 않았는지
      확인할 수 있게 체크섬을 함께 남긴다. 현장에서는 네트워크를 쓰지 않는 모드로 빌드해 빠진 것이
      없는지 반입 전에 한 번 검증한다.
    rubric:
      - id: R1
        criterion: 잠금 파일로 의존성 버전을 고정한다
      - id: R2
        criterion: 아티팩트와 빌드 도구를 함께 담고 체크섬을 남긴다
      - id: R3
        criterion: 네트워크 없이 빌드해 반입 전에 검증한다
  - conceptKey: DEVOPS.OFFLINE_DEPLOY.ROLLBACK_PLAN
    skill: DEVOPS.OFFLINE_DEPLOY
    reviewType: RECALL
    prompt: >-
      폐쇄망 서버에 새 버전을 올렸는데 기동에 실패했습니다. 인터넷으로 무엇도 다시 받을 수 없을 때
      되돌릴 수 있으려면 무엇이 미리 준비되어 있어야 하나요?
    expectedAnswer: >-
      이전 버전의 실행 산출물(이미지 또는 설치본)이 서버에 그대로 남아 있어야 하고, 어떤 명령으로 그
      버전을 다시 띄우는지가 절차로 적혀 있어야 한다. 설정 파일도 버전별로 보관해 새 버전에서 바꾼
      설정을 되돌릴 수 있어야 한다. DB 스키마를 바꿨다면 되돌릴 수 있는 변경인지 미리 확인하고, 되돌릴
      수 없으면 앞 버전도 새 스키마에서 동작하도록 두 단계로 나눠 배포한다. 반입 꾸러미에 이전 버전을
      함께 넣어 두면 실패해도 현장에서 끝낼 수 있다.
    rubric:
      - id: R1
        criterion: 이전 버전 산출물과 설정을 서버에 남겨 둔다
      - id: R2
        criterion: 되돌리는 명령과 순서를 절차로 적어 둔다
      - id: R3
        criterion: 스키마 변경은 되돌릴 수 있는지 미리 확인한다
  - conceptKey: DEVOPS.OBSERVABILITY.HEALTH_CHECK_SCOPE
    skill: DEVOPS.OBSERVABILITY
    reviewType: EXPLAIN
    prompt: >-
      헬스체크 끝점에서 연동 대상 외부 API까지 호출해 상태를 확인하도록 했습니다. 무엇이 위험한가요?
      생존 확인과 준비 확인은 각각 무엇을 판단해야 하나요?
    expectedAnswer: >-
      외부 API가 느려지거나 멈추면 내 서비스는 멀쩡한데도 헬스체크가 실패해 재시작되거나 트래픽에서
      빠진다. 남의 장애가 내 장애가 되는 구조다. 생존 확인은 프로세스가 스스로 회복할 수 없는 상태인지
      만 본다(실패하면 재시작이 답이어야 한다). 준비 확인은 지금 요청을 받아도 되는지를 보고, 기동 중
      초기화나 필수 의존(자기 DB) 정도만 포함한다. 선택적 외부 연동은 헬스체크가 아니라 지표와 알림으로
      본다.
    rubric:
      - id: R1
        criterion: 외부 의존 장애가 내 서비스 재시작으로 번진다
      - id: R2
        criterion: 생존 확인은 재시작이 답인 상태만 본다
      - id: R3
        criterion: 준비 확인은 필수 의존만 포함하고 선택 의존은 지표로 본다
  - conceptKey: DEVOPS.OBSERVABILITY.METRIC_TAG_CARDINALITY
    skill: DEVOPS.OBSERVABILITY
    reviewType: RECALL
    prompt: >-
      요청 지표에 주문 번호와 사용자 식별자를 태그로 붙이려고 합니다. 무슨 일이 생기나요? 지표 이름과
      태그는 각각 무엇을 담아야 하나요?
    expectedAnswer: >-
      태그 값의 가짓수만큼 시계열이 생기므로 주문 번호나 사용자 식별자처럼 값이 무한히 늘어나는 항목을
      태그로 쓰면 시계열이 폭증해 수집기와 저장소가 감당하지 못한다. 지표 이름은 무엇을 재는지(요청 수,
      처리 시간)를 담고, 태그는 가짓수가 제한된 구분값(끝점 템플릿, 메서드, 상태 코드, 결과 구분)만
      담는다. 건별 추적이 필요하면 지표가 아니라 로그나 추적에 식별자를 남기고 지표와는 상관 ID로 잇는다.
    rubric:
      - id: R1
        criterion: 값이 무한한 태그는 시계열을 폭증시킨다
      - id: R2
        criterion: 태그에는 가짓수가 제한된 구분값만 넣는다
      - id: R3
        criterion: 건별 식별자는 로그나 추적에 남긴다
  - conceptKey: DEVOPS.OBSERVABILITY.LOG_CORRELATION
    skill: DEVOPS.OBSERVABILITY
    reviewType: EXPLAIN
    prompt: >-
      연동 호출이 실패했다는 문의를 받았는데 로그가 여러 줄로 흩어져 있어 어느 요청의 것인지 알 수
      없습니다. 무엇을 남겨야 한 요청의 흐름을 이어 볼 수 있나요?
    expectedAnswer: >-
      요청마다 상관 ID를 만들고(또는 호출한 쪽이 보낸 값을 이어받고) 그 요청에서 남기는 모든 로그에
      같은 값을 붙인다. 연동 대상에도 그 값을 헤더로 넘기면 양쪽 로그를 이어 볼 수 있다. 로그는 문장
      하나로 쓰지 말고 키와 값이 나뉜 구조로 남겨 검색과 집계가 되게 한다. 이때 토큰, 비밀번호,
      개인정보, 요청 본문 원문은 남기지 않고 필요한 식별자만 남긴다.
    rubric:
      - id: R1
        criterion: 요청마다 상관 ID를 만들어 모든 로그에 붙인다
      - id: R2
        criterion: 연동 대상에도 같은 값을 전달해 흐름을 잇는다
      - id: R3
        criterion: 구조화해 남기되 민감 정보는 제외한다
