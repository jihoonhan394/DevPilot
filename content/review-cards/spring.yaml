# Seed review cards — SPRING
# Spec: docs/19-content-spec.md §3.5 (schema), §7.3 (작성 가이드)
# 기준: Spring Boot 4.1 / Spring Framework 7.0
cards:
  - conceptKey: SPRING.DI_IOC.CONSTRUCTOR_INJECTION
    skill: SPRING.DI_IOC
    reviewType: EXPLAIN
    prompt: >-
      필드 주입(@Autowired 필드) 대신 생성자 주입을 쓰는 이유를 세 가지 이상 설명하세요.
    expectedAnswer: >-
      생성자 주입은 필수 의존성을 생성자 시그니처로 드러내고, 의존성이 없으면 객체 생성 자체가 실패한다.
      필드를 final로 선언해 생성 후 바뀌지 않게 할 수 있다. 테스트에서 Spring 컨테이너 없이 new로 생성하며
      fake나 mock을 넘길 수 있다. 생성자 인자가 지나치게 많아지면 클래스 책임이 크다는 신호를 쉽게
      발견하고, 순환 의존도 기동 시점에 드러난다.
    rubric:
      - id: R1
        criterion: 필수 의존성이 생성자에 명시되고 누락 시 생성이 실패한다
      - id: R2
        criterion: final 필드로 불변을 보장한다
      - id: R3
        criterion: 컨테이너 없이 테스트에서 직접 생성할 수 있다
      - id: R4
        criterion: 과도한 의존성이나 순환 의존을 일찍 발견한다

  - conceptKey: SPRING.DI_IOC.SINGLETON_MUTABLE_STATE
    skill: SPRING.DI_IOC
    reviewType: BUG_SPOT
    prompt: |-
      동시에 여러 사용자가 주문할 때 생길 수 있는 문제와 수정 방법은?
      ```java
      @Service
      public class OrderService {
          private UUID currentUserId;

          public OrderResult place(UUID userId, OrderRequest request) {
              this.currentUserId = userId;
              validate(request);
              return save(request); // save()는 currentUserId를 사용한다
          }
      }
      ```
    expectedAnswer: >-
      기본 스코프의 Spring 빈은 싱글톤이라 하나의 OrderService 인스턴스를 모든 요청 스레드가 공유한다.
      요청별 값을 필드에 저장하면 다른 요청이 덮어써 다른 사용자 ID로 주문이 저장될 수 있다. 요청 상태는
      메서드 파라미터나 지역 변수로 전달하고, 싱글톤 빈은 무상태로 유지한다.
    rubric:
      - id: R1
        criterion: 싱글톤 빈을 여러 스레드가 공유한다
      - id: R2
        criterion: 요청별 상태를 필드에 저장하면 다른 요청이 덮어쓴다
      - id: R3
        criterion: 파라미터나 지역 변수로 전달해 빈을 무상태로 유지한다

  - conceptKey: SPRING.BOOT_CONFIG.ENV_OVERRIDE_RELAXED_BINDING
    skill: SPRING.BOOT_CONFIG
    reviewType: RECALL
    prompt: >-
      jar 안 application.yml에 payment.client.read-timeout=3s가 있고, 서버에 환경변수
      PAYMENT_CLIENT_READTIMEOUT=5s가 설정되어 있습니다. 애플리케이션은 어떤 값을 쓰나요? 환경변수 이름은
      어떤 규칙으로 속성에 연결되나요?
    expectedAnswer: >-
      5s를 쓴다. Spring Boot 외부 설정 우선순위에서 OS 환경변수가 jar에 포함된 application.yml보다 높다.
      relaxed binding 규칙에 따라 속성 이름의 점은 밑줄로, 대시는 제거하고, 대문자로 바꾼 환경변수 이름이
      같은 속성에 연결된다.
    rubric:
      - id: R1
        criterion: 외부 설정 우선순위
      - id: R2
        criterion: 환경변수가 패키징된 application.yml보다 우선한다
      - id: R3
        criterion: 점은 밑줄, 대시는 제거, 대문자라는 매핑 규칙

  - conceptKey: SPRING.MVC_REST.MESSAGE_CONVERSION_STATUS
    skill: SPRING.MVC_REST
    reviewType: RECALL
    prompt: >-
      @RequestBody로 JSON DTO를 받는 API에 클라이언트가 Content-Type text/plain으로 요청하면 어떤 상태
      코드가 나오나요? Accept가 application/xml뿐인데 서버가 JSON만 만들 수 있다면?
    expectedAnswer: >-
      요청 본문과 대상 타입을 읽을 수 있는 HttpMessageConverter가 없으면 415 Unsupported Media Type이다.
      Accept 헤더가 요구하는 형식으로 응답을 만들 수 있는 컨버터가 없으면 406 Not Acceptable이다. 요청과
      응답 본문 변환은 HttpMessageConverter(JSON은 Jackson 기반 컨버터)가 담당한다.
    rubric:
      - id: R1
        criterion: HttpMessageConverter가 본문 변환을 담당한다
      - id: R2
        criterion: 읽을 수 없는 Content-Type은 415
      - id: R3
        criterion: Accept를 만족할 수 없으면 406

  - conceptKey: SPRING.VALIDATION.VALID_ANNOTATION_REQUIRED
    skill: SPRING.VALIDATION
    reviewType: BUG_SPOT
    prompt: |-
      email이 빈 문자열이거나 address.zipCode가 비어 있어도 요청이 통과합니다. 이유와 수정 방법은?
      ```java
      public record SignUpRequest(@NotBlank @Email String email, @NotNull Address address) {}
      public record Address(@NotBlank String zipCode) {}

      @PostMapping("/users")
      ResponseEntity<Void> signUp(@RequestBody SignUpRequest request) {
          userService.signUp(request);
          return ResponseEntity.status(HttpStatus.CREATED).build();
      }
      ```
    expectedAnswer: >-
      @RequestBody 파라미터에 @Valid(또는 @Validated)가 없어 DTO의 제약이 검사되지 않는다. 또한 중첩
      객체의 제약은 해당 필드에 @Valid가 있어야 연쇄 검증되므로 address 컴포넌트에도 @Valid가 필요하다.
      수정 후 검증에 실패하면 MethodArgumentNotValidException이 발생하고 기본적으로 400 응답이 된다.
    rubric:
      - id: R1
        criterion: '@Valid가 있어야 요청 본문 검증이 실행된다'
      - id: R2
        criterion: 중첩 객체는 필드에 @Valid를 붙여야 연쇄 검증된다
      - id: R3
        criterion: 검증 실패 시 MethodArgumentNotValidException과 400 응답

  - conceptKey: SPRING.EXCEPTION_HANDLING.PROBLEM_DETAIL
    skill: SPRING.EXCEPTION_HANDLING
    reviewType: RECALL
    prompt: >-
      Spring MVC에서 RFC 9457 형식의 오류 응답을 만드는 데 쓰는 타입과 구성 방법은? 표준 필드 이름도
      말해 보세요.
    expectedAnswer: >-
      ProblemDetail이 RFC 9457 problem detail을 표현한다. 표준 필드는 type, title, status, detail,
      instance이고 code 같은 확장 속성을 추가할 수 있다. @RestControllerAdvice(또는 @ControllerAdvice)에서
      @ExceptionHandler로 ProblemDetail을 반환하거나, ResponseEntityExceptionHandler를 상속해 Spring MVC
      기본 예외도 같은 형식으로 응답한다.
    rubric:
      - id: R1
        criterion: ProblemDetail 타입과 RFC 9457
      - id: R2
        criterion: type, title, status, detail, instance 표준 필드
      - id: R3
        criterion: ControllerAdvice와 ResponseEntityExceptionHandler 구성

  - conceptKey: SPRING.EXCEPTION_HANDLING.INTERNAL_MESSAGE_LEAK
    skill: SPRING.EXCEPTION_HANDLING
    reviewType: BUG_SPOT
    prompt: |-
      이 전역 예외 처리기의 문제 두 가지는?
      ```java
      @RestControllerAdvice
      class ApiExceptionHandler {
          @ExceptionHandler(Exception.class)
          ResponseEntity<String> handle(Exception e) {
              return ResponseEntity.status(500).body(e.getMessage());
          }
      }
      ```
    expectedAnswer: >-
      첫째, 예외 메시지에는 SQL, 테이블이나 클래스 이름, 파일 경로 같은 내부 정보가 들어갈 수 있어 그대로
      응답하면 정보가 노출된다. 사용자에게는 일반 메시지와 추적 ID만 주고 상세는 서버 로그에 남긴다.
      둘째, 모든 예외를 500으로 바꿔 검증 실패(400)나 리소스 없음(404) 같은 예상된 오류를 구분하지
      못한다. 예상 예외는 개별 핸들러로 알맞은 상태 코드를 주고, 최후 방어선만 500을 반환한다.
    rubric:
      - id: R1
        criterion: 예외 메시지를 응답에 노출하는 정보 노출 위험
      - id: R2
        criterion: 사용자 메시지와 추적 ID만 응답하고 상세는 로그에 남긴다
      - id: R3
        criterion: 예상 예외를 개별 상태 코드로 구분한다

  - conceptKey: SPRING.AOP_PROXY.PROXY_TYPES
    skill: SPRING.AOP_PROXY
    reviewType: RECALL
    prompt: >-
      Spring AOP는 advice를 어떤 방식으로 적용하나요? JDK dynamic proxy와 CGLIB 프록시의 차이와 Spring
      Boot의 기본값, final 메서드에 미치는 영향을 설명하세요.
    expectedAnswer: >-
      Spring AOP는 런타임에 대상 빈을 감싸는 프록시 객체를 만들어 호출을 가로챈다. JDK dynamic proxy는
      인터페이스를 구현하는 프록시이고, CGLIB는 대상 클래스를 상속한 프록시다. Spring Boot 자동 구성은
      기본으로 CGLIB 프록시를 쓴다(spring.aop.proxy-target-class). CGLIB는 상속 방식이라 final 클래스는
      프록시할 수 없고 final 메서드에는 advice가 적용되지 않는다.
    rubric:
      - id: R1
        criterion: 런타임 프록시가 호출을 가로챈다
      - id: R2
        criterion: 인터페이스 기반 JDK proxy와 상속 기반 CGLIB의 차이
      - id: R3
        criterion: Spring Boot 기본은 CGLIB이며 final에는 적용되지 않는다

  - conceptKey: SPRING.TRANSACTION.SELF_INVOCATION
    skill: SPRING.TRANSACTION
    reviewType: EXPLAIN
    prompt: >-
      같은 클래스 안에서 @Transactional이 없는 메서드가 @Transactional 메서드를 this로 호출하면 트랜잭션이
      적용되지 않습니다. 이유와 해결 방법을 설명하세요.
    expectedAnswer: >-
      기본(proxy) 모드의 선언적 트랜잭션은 프록시가 외부에서 들어오는 호출을 가로챌 때만 적용된다. 객체
      내부에서 this로 부르는 호출은 프록시를 거치지 않으므로 @Transactional이 있어도 트랜잭션이 시작되지
      않는다. 트랜잭션 메서드를 다른 빈으로 분리해 주입받아 호출하거나, 트랜잭션 경계를 외부에서 호출되는
      public 메서드로 옮긴다.
    rubric:
      - id: R1
        criterion: 프록시 기반 선언적 트랜잭션
      - id: R2
        criterion: 내부 호출은 프록시를 우회한다
      - id: R3
        criterion: 빈 분리나 경계 이동 같은 해결 방법 1개 이상

  - conceptKey: SPRING.TRANSACTION.DEFAULT_ROLLBACK_RULES
    skill: SPRING.TRANSACTION
    reviewType: RECALL
    prompt: >-
      @Transactional 메서드에서 checked 예외가 던져지면 기본 설정에서 트랜잭션은 롤백되나요? 롤백되게
      하려면?
    expectedAnswer: >-
      기본 설정에서는 RuntimeException과 Error만 롤백 대상이다. checked 예외가 던져지면 롤백하지 않고
      그때까지의 작업이 커밋된다. checked 예외에도 롤백이 필요하면 rollbackFor로 지정하거나, 복구할 수
      없는 상황이라면 unchecked 예외로 변환해 던진다.
    rubric:
      - id: R1
        criterion: 기본 롤백 대상은 RuntimeException과 Error
      - id: R2
        criterion: checked 예외는 기본적으로 커밋된다
      - id: R3
        criterion: rollbackFor 지정 또는 unchecked 변환

  - conceptKey: SPRING.TRANSACTION.PROPAGATION.REQUIRES_NEW
    skill: SPRING.TRANSACTION.PROPAGATION
    reviewType: RECALL
    prompt: >-
      REQUIRED 트랜잭션 안에서 REQUIRES_NEW 메서드를 호출하면 어떻게 동작하나요? 커넥션 풀 관점의 주의점은?
    expectedAnswer: >-
      REQUIRES_NEW는 외부 트랜잭션에 참여하지 않고 독립된 물리 트랜잭션을 시작한다. 내부 트랜잭션은 외부와
      별개로 커밋하거나 롤백하고, 끝나면 잠금이 바로 해제된다. 외부 트랜잭션은 자기 커넥션을 계속 잡고
      있는 상태에서 내부 트랜잭션이 새 커넥션을 얻으므로, 동시 요청이 많으면 커넥션 풀이 고갈되거나
      서로 기다리는 교착이 생길 수 있다.
    rubric:
      - id: R1
        criterion: 독립된 물리 트랜잭션을 새로 시작한다
      - id: R2
        criterion: 내부와 외부가 따로 커밋·롤백된다
      - id: R3
        criterion: 요청당 커넥션 2개가 필요해 풀 고갈 위험이 있다

  - conceptKey: SPRING.DATA_JPA.SAVE_PERSIST_OR_MERGE
    skill: SPRING.DATA_JPA
    reviewType: RECALL
    prompt: >-
      Spring Data JPA의 save()는 엔티티가 새것인지 어떻게 판단하나요? 애플리케이션에서 UUID를 미리
      할당한 엔티티를 save()하면 어떤 비효율이 생기고, 어떻게 피하나요?
    expectedAnswer: >-
      save()는 새 엔티티면 persist, 아니면 merge를 호출한다. 기본 판단은 래퍼 타입 @Version 속성이 있으면
      그 값이 null인지, 없으면 식별자가 null인지(primitive면 0인지)다. ID를 미리 넣으면 새 엔티티가
      아니라고 판단해 merge를 호출하고, merge는 기존 행을 확인하는 SELECT를 먼저 실행한다.
      Persistable을 구현해 isNew를 직접 판단하거나 @Version 필드를 둬서 피한다.
    rubric:
      - id: R1
        criterion: isNew 판단에 따라 persist 또는 merge
      - id: R2
        criterion: 판단 기준은 @Version 또는 식별자의 null 여부
      - id: R3
        criterion: 미리 할당한 ID는 merge와 추가 SELECT를 유발하며 Persistable이나 @Version으로 피한다

  - conceptKey: SPRING.SECURITY.FILTER_CHAIN_401_403
    skill: SPRING.SECURITY
    reviewType: RECALL
    prompt: >-
      Spring Security는 요청 처리 흐름의 어디에서 동작하나요? 401과 403 응답은 각각 어떤 컴포넌트가
      만들고, @RestControllerAdvice로 이 오류를 처리할 수 있나요?
    expectedAnswer: >-
      Spring Security는 서블릿 필터 체인(FilterChainProxy가 요청에 맞는 SecurityFilterChain을 선택)에서
      DispatcherServlet보다 먼저 동작한다. 인증 정보가 없거나 유효하지 않으면 AuthenticationEntryPoint가
      401을, 인증은 되었지만 권한이 없으면 AccessDeniedHandler가 403을 만든다. 필터 단계의 오류는 컨트롤러에
      도달하기 전이라 @RestControllerAdvice가 처리하지 못하므로 EntryPoint와 Handler에서 응답 형식을
      맞춘다.
    rubric:
      - id: R1
        criterion: DispatcherServlet 앞의 서블릿 필터 체인에서 동작한다
      - id: R2
        criterion: AuthenticationEntryPoint는 401, AccessDeniedHandler는 403
      - id: R3
        criterion: 필터 단계 오류는 ControllerAdvice가 처리하지 못한다
