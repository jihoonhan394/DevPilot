# Seed review cards — PRACTICAL_ENGINEERING
# Spec: docs/19-content-spec.md §3.5 (schema), §7.3 (작성 가이드)
cards:
  - conceptKey: PRACTICAL_ENGINEERING.LOGGING.LEVEL_CRITERIA
    skill: PRACTICAL_ENGINEERING.LOGGING
    reviewType: RECALL
    prompt: >-
      ERROR, WARN, INFO, DEBUG 로그 레벨을 어떤 기준으로 나누나요? 각각 예를 하나씩 드세요.
    expectedAnswer: >-
      ERROR는 요청이나 작업이 실패해 사람이 확인해야 하는 상황(예: 결제 처리 실패). WARN은 복구되었거나 곧
      문제가 될 수 있는 비정상 상황(예: 재시도 후 성공, 한도 근접). INFO는 운영 중 흐름을 추적할 주요
      사건(예: 기동 완료, 배치 작업 처리 건수). DEBUG는 개발과 장애 조사용 상세 정보로 운영에서는 기본으로
      끈다.
    rubric:
      - id: R1
        criterion: 사람의 조치 필요 여부로 ERROR와 WARN을 나눈다
      - id: R2
        criterion: INFO는 운영 흐름의 주요 사건
      - id: R3
        criterion: DEBUG는 상세 조사용이며 운영 기본값이 아니다

  - conceptKey: PRACTICAL_ENGINEERING.LOGGING.LOG_AND_RETHROW
    skill: PRACTICAL_ENGINEERING.LOGGING
    reviewType: BUG_SPOT
    prompt: |-
      전역 예외 처리기도 ERROR 로그를 남기는 애플리케이션입니다. 이 코드의 문제와 수정 방향은?
      ```java
      try {
          paymentClient.pay(request);
      } catch (PaymentException e) {
          log.error("결제 실패", e);
          throw e;
      }
      ```
    expectedAnswer: >-
      여기서 로그를 남기고 다시 던지면 상위의 전역 예외 처리기도 같은 예외를 기록해 한 오류가 여러 번
      기록된다. 로그가 부풀고 알림이 중복되며 원인 추적이 어려워진다. 예외를 실제로 처리하는 한 곳에서만
      로그를 남긴다. 다시 던질 거라면 로그 없이 필요한 문맥을 담은 예외로 변환해 원인과 함께 던진다.
    rubric:
      - id: R1
        criterion: 로그 후 재던지기로 인한 중복 로깅
      - id: R2
        criterion: 처리하는 한 곳에서만 로그를 남긴다
      - id: R3
        criterion: 재던질 때는 문맥과 원인을 담아 변환한다

  - conceptKey: PRACTICAL_ENGINEERING.RESOURCE_TIMEOUT.EXTERNAL_CALL_TIMEOUT
    skill: PRACTICAL_ENGINEERING.RESOURCE_TIMEOUT
    reviewType: EXPLAIN
    prompt: >-
      외부 API 호출에 타임아웃을 설정하지 않으면 외부 서비스가 느려질 때 우리 서비스에 어떤 일이 생기나요?
      타임아웃은 어떻게 정하나요?
    expectedAnswer: >-
      요청 스레드와 커넥션이 응답을 기다리며 묶여 풀이 고갈되고, 외부 API와 관계없는 요청까지 실패하는 장애
      전파가 생긴다. 연결 타임아웃과 읽기 타임아웃을 각각 설정하고, 사용자 요청 전체의 시간 예산 안에서 값을
      정한다. 타임아웃 후에는 멱등한 요청만 제한적으로 재시도하고, 사용자에게 줄 응답을 정해 둔다.
    rubric:
      - id: R1
        criterion: 스레드·커넥션 고갈과 장애 전파
      - id: R2
        criterion: 연결 타임아웃과 읽기 타임아웃을 따로 설정한다
      - id: R3
        criterion: 요청 시간 예산과 멱등 요청만 재시도

  - conceptKey: PRACTICAL_ENGINEERING.NULL_BOUNDARY.EMPTY_COLLECTION_RETURN
    skill: PRACTICAL_ENGINEERING.NULL_BOUNDARY
    reviewType: RECALL
    prompt: >-
      조회 결과가 없을 때 목록을 반환하는 메서드는 null과 빈 컬렉션 중 무엇을 반환해야 하나요? 단건 조회에서
      결과가 없을 때는?
    expectedAnswer: >-
      목록은 null 대신 빈 컬렉션(예: List.of())을 반환한다. 호출자가 null 검사를 빠뜨려 NullPointerException이
      나는 것을 막고 반복문을 그대로 쓸 수 있다. 단건 조회에서 결과가 없을 수 있으면 Optional로 반환하고,
      반드시 있어야 하는 값이 없으면 의미 있는 예외를 던진다.
    rubric:
      - id: R1
        criterion: 목록은 빈 컬렉션을 반환한다
      - id: R2
        criterion: null 반환이 호출자의 NPE 위험을 만든다
      - id: R3
        criterion: 단건은 Optional 또는 명시적 예외
