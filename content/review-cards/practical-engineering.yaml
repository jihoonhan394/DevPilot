# Seed review cards — PRACTICAL_ENGINEERING
# Spec: docs/19-content-spec.md §3.5 (schema), §7.3 (작성 가이드)
cards:
  - conceptKey: PRACTICAL_ENGINEERING.LOGGING.LEVEL_CRITERIA
    skill: PRACTICAL_ENGINEERING.LOGGING
    reviewType: RECALL
    prompt: >-
      ERROR, WARN, INFO, DEBUG 로그 레벨을 어떤 기준으로 나누나요? 각각 예를 하나씩 드세요.
    expectedAnswer: >-
      ERROR는 요청이나 작업이 실패해 사람이 확인해야 하는 상황(예: 결제 처리 실패). WARN은 복구되었거나 곧
      문제가 될 수 있는 비정상 상황(예: 재시도 후 성공, 한도 근접). INFO는 운영 중 흐름을 추적할 주요
      사건(예: 기동 완료, 배치 작업 처리 건수). DEBUG는 개발과 장애 조사용 상세 정보로 운영에서는 기본으로
      끈다.
    rubric:
      - id: R1
        criterion: 사람의 조치 필요 여부로 ERROR와 WARN을 나눈다
      - id: R2
        criterion: INFO는 운영 흐름의 주요 사건
      - id: R3
        criterion: DEBUG는 상세 조사용이며 운영 기본값이 아니다

  - conceptKey: PRACTICAL_ENGINEERING.LOGGING.LOG_AND_RETHROW
    skill: PRACTICAL_ENGINEERING.LOGGING
    reviewType: BUG_SPOT
    prompt: |-
      전역 예외 처리기도 ERROR 로그를 남기는 애플리케이션입니다. 이 코드의 문제와 수정 방향은?
      ```java
      try {
          paymentClient.pay(request);
      } catch (PaymentException e) {
          log.error("결제 실패", e);
          throw e;
      }
      ```
    expectedAnswer: >-
      여기서 로그를 남기고 다시 던지면 상위의 전역 예외 처리기도 같은 예외를 기록해 한 오류가 여러 번
      기록된다. 로그가 부풀고 알림이 중복되며 원인 추적이 어려워진다. 예외를 실제로 처리하는 한 곳에서만
      로그를 남긴다. 다시 던질 거라면 로그 없이 필요한 문맥을 담은 예외로 변환해 원인과 함께 던진다.
    rubric:
      - id: R1
        criterion: 로그 후 재던지기로 인한 중복 로깅
      - id: R2
        criterion: 처리하는 한 곳에서만 로그를 남긴다
      - id: R3
        criterion: 재던질 때는 문맥과 원인을 담아 변환한다

  - conceptKey: PRACTICAL_ENGINEERING.RESOURCE_TIMEOUT.EXTERNAL_CALL_TIMEOUT
    skill: PRACTICAL_ENGINEERING.RESOURCE_TIMEOUT
    reviewType: EXPLAIN
    prompt: >-
      외부 API 호출에 타임아웃을 설정하지 않으면 외부 서비스가 느려질 때 우리 서비스에 어떤 일이 생기나요?
      타임아웃은 어떻게 정하나요?
    expectedAnswer: >-
      요청 스레드와 커넥션이 응답을 기다리며 묶여 풀이 고갈되고, 외부 API와 관계없는 요청까지 실패하는 장애
      전파가 생긴다. 연결 타임아웃과 읽기 타임아웃을 각각 설정하고, 사용자 요청 전체의 시간 예산 안에서 값을
      정한다. 타임아웃 후에는 멱등한 요청만 제한적으로 재시도하고, 사용자에게 줄 응답을 정해 둔다.
    rubric:
      - id: R1
        criterion: 스레드·커넥션 고갈과 장애 전파
      - id: R2
        criterion: 연결 타임아웃과 읽기 타임아웃을 따로 설정한다
      - id: R3
        criterion: 요청 시간 예산과 멱등 요청만 재시도

  - conceptKey: PRACTICAL_ENGINEERING.NULL_BOUNDARY.EMPTY_COLLECTION_RETURN
    skill: PRACTICAL_ENGINEERING.NULL_BOUNDARY
    reviewType: RECALL
    prompt: >-
      조회 결과가 없을 때 목록을 반환하는 메서드는 null과 빈 컬렉션 중 무엇을 반환해야 하나요? 단건 조회에서
      결과가 없을 때는?
    expectedAnswer: >-
      목록은 null 대신 빈 컬렉션(예: List.of())을 반환한다. 호출자가 null 검사를 빠뜨려 NullPointerException이
      나는 것을 막고 반복문을 그대로 쓸 수 있다. 단건 조회에서 결과가 없을 수 있으면 Optional로 반환하고,
      반드시 있어야 하는 값이 없으면 의미 있는 예외를 던진다.
    rubric:
      - id: R1
        criterion: 목록은 빈 컬렉션을 반환한다
      - id: R2
        criterion: null 반환이 호출자의 NPE 위험을 만든다
      - id: R3
        criterion: 단건은 Optional 또는 명시적 예외

  - conceptKey: PRACTICAL_ENGINEERING.CODE_REVIEW.RISK_ORDER
    skill: PRACTICAL_ENGINEERING.CODE_REVIEW
    reviewType: RECALL
    prompt: >-
      동료의 PR을 보다가 남기고 싶은 의견이 열 개쯤 떠올랐습니다. 무엇부터 적고 무엇을 뒤로 미루나요?
      취향 차이인 의견은 어떻게 다루나요?
    expectedAnswer: >-
      위험이 큰 것부터 적는다. 순서는 동작이 틀리거나 데이터가 깨지는 문제와 보안 문제, 그다음 되돌리기
      어려운 설계와 공개 인터페이스 결정, 빠진 테스트, 그다음 이름과 구조와 가독성, 마지막이 취향이다.
      앞의 두 묶음은 고쳐야 통과하는 의견으로, 나머지는 참고 의견으로 구분해 남긴다. 취향 의견은 취향임을
      밝혀 작성자가 고르게 한다. 같은 뿌리에서 나온 지적은 하나로 묶고 반복되는 것은 한 번만 적는다.
    rubric:
      - id: R1
        criterion: 위험이 큰 것부터 순서를 매긴다
      - id: R2
        criterion: 고쳐야 하는 의견과 참고 의견을 구분한다
      - id: R3
        criterion: 취향 의견은 취향임을 밝혀 선택하게 한다
      - id: R4
        criterion: 같은 뿌리의 지적은 묶어 한 번만 적는다

  - conceptKey: PRACTICAL_ENGINEERING.CODE_REVIEW.COMMENT_FORM
    skill: PRACTICAL_ENGINEERING.CODE_REVIEW
    reviewType: EXPLAIN
    prompt: >-
      리뷰에서 "이거 왜 이렇게 했어요?"라는 의견만 받았습니다. 받는 사람 입장에서 이 의견의 문제는
      무엇이고, 같은 내용을 어떻게 바꿔 쓰면 바로 고칠 수 있나요?
    expectedAnswer: >-
      질문만 던지면 무엇이 문제인지, 고쳐야 하는지, 그냥 궁금한 것인지가 드러나지 않아 받는 사람은 해명부터
      하게 된다. 고칠 수 있는 의견은 네 가지를 담는다. 코드의 어느 자리인지, 거기서 관찰한 사실이 무엇인지,
      그대로 두면 어떤 결과가 생기는지, 어떤 대안을 제안하는지다. 여기에 이 의견이 고쳐야 하는 것인지 참고인지
      강도를 밝힌다. 주어는 사람이 아니라 코드와 동작으로 쓰고, 정말 몰라서 묻는 것이라면 무엇이 궁금한지를
      함께 적는다.
    rubric:
      - id: R1
        criterion: 질문만으로는 문제와 기대가 드러나지 않는다
      - id: R2
        criterion: 관찰한 사실과 그대로 둘 때의 결과를 함께 적는다
      - id: R3
        criterion: 대안을 제안하고 의견의 강도를 밝힌다
      - id: R4
        criterion: 사람이 아니라 코드와 동작을 주어로 쓴다

  - conceptKey: PRACTICAL_ENGINEERING.CODE_REVIEW.REFACTOR_SAFETY
    skill: PRACTICAL_ENGINEERING.CODE_REVIEW
    reviewType: RECALL
    prompt: >-
      "이 메서드가 너무 길다"는 리뷰 의견을 받아 구조를 바꾸려고 합니다. 손대기 전에 무엇을 갖춰야 하고,
      커밋은 어떻게 나누나요?
    expectedAnswer: >-
      먼저 지금 동작을 고정하는 테스트가 있어야 한다. 없으면 현재 동작을 그대로 확인하는 테스트를 먼저
      추가해 기준선을 만든다. 그다음 동작을 바꾸지 않는 구조 변경만 작은 단위로 하고 단계마다 테스트를
      돌린다. 동작 변경과 구조 변경은 한 커밋에 섞지 않는다. 섞으면 리뷰어가 무엇이 바뀌었는지 가려낼 수
      없고, 문제가 생겼을 때 되돌릴 단위가 사라진다.
    rubric:
      - id: R1
        criterion: 지금 동작을 고정하는 테스트를 먼저 마련한다
      - id: R2
        criterion: 구조 변경은 작은 단위로 하고 단계마다 테스트를 돌린다
      - id: R3
        criterion: 동작 변경과 구조 변경을 한 커밋에 섞지 않는다
