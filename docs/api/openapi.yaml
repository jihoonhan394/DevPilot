openapi: 3.1.0
info:
  title: DevPilot API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/v1/dashboard:
    get:
      operationId: dashboardGet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - dashboard
  /api/v1/learning-goal:
    get:
      operationId: goalGetGoal
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGoalView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - goal
    put:
      operationId: goalUpdateGoal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningGoalUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGoalView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - goal
  /api/v1/learning-sessions:
    get:
      operationId: learningListSessions
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - in: query
        name: cursor
        required: false
        schema:
          type: string
          maxLength: 512
          minLength: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageSessionView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - learning
    post:
      operationId: learningStartSession
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionStartRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStartResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - learning
  /api/v1/learning-sessions/{sessionId}/abandon:
    post:
      operationId: learningAbandonSession
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - learning
  /api/v1/learning-sessions/{sessionId}/complete:
    post:
      operationId: learningCompleteSession
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCompleteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - learning
  /api/v1/me:
    delete:
      operationId: userDeleteMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - user
    get:
      operationId: userGetMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - user
    patch:
      operationId: userUpdateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - user
  /api/v1/onboarding:
    post:
      operationId: onboardingComplete
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - onboarding
  /api/v1/plans:
    get:
      operationId: planList
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - in: query
        name: cursor
        required: false
        schema:
          type: string
          maxLength: 512
          minLength: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPagePlanSummaryView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - plan
  /api/v1/plans/active:
    get:
      operationId: planGetActive
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - plan
  /api/v1/plans/active/budget:
    get:
      operationId: planGetActiveBudget
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - plan
  /api/v1/plans/{planId}:
    get:
      operationId: planGet
      parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - plan
  /api/v1/plans/{planId}/milestones/{milestoneId}:
    patch:
      operationId: planUpdateMilestone
      parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: milestoneId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestonePatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - plan
  /api/v1/plans/{planId}/replan:
    post:
      operationId: planReplan
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: planId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplanRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplanCommitResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - plan
  /api/v1/plans/{planId}/replan/preview:
    post:
      operationId: planPreviewReplan
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      - in: path
        name: planId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplanRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplanPreviewResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - plan
  /api/v1/reviews/due:
    get:
      operationId: reviewGetDue
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueReviewsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - review
  /api/v1/reviews/{reviewItemId}/answer:
    post:
      operationId: reviewAnswer
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: reviewItemId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAnswerRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAnswerResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - review
  /api/v1/side-projects:
    get:
      operationId: projectList
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - DONE
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - in: query
        name: cursor
        required: false
        schema:
          type: string
          maxLength: 512
          minLength: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageSideProjectView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - project
    post:
      operationId: projectCreate
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SideProjectCreateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SideProjectView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - project
  /api/v1/side-projects/{sideProjectId}:
    delete:
      operationId: projectDelete
      parameters:
      - in: path
        name: sideProjectId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - project
    get:
      operationId: projectGet
      parameters:
      - in: path
        name: sideProjectId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SideProjectView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - project
    patch:
      operationId: projectUpdate
      parameters:
      - in: path
        name: sideProjectId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SideProjectPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SideProjectView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - project
  /api/v1/skills/me:
    get:
      operationId: skillGetMyStates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSkillStatesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - skill
  /api/v1/skills/tree:
    get:
      operationId: skillGetTree
      parameters:
      - in: query
        name: role
        required: false
        schema:
          type: string
          default: JAVA_BACKEND
          enum:
          - JAVA_BACKEND
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillTreeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - skill
  /api/v1/today:
    get:
      operationId: todayGet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - today
  /api/v1/today/generate:
    post:
      operationId: todayGenerate
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodayGenerateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - today
  /api/v1/today/tasks/{taskId}:
    patch:
      operationId: todayUpdateTaskStatus
      parameters:
      - in: path
        name: taskId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStatusPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - today
components:
  schemas:
    AccountDeletionResponse:
      type: object
      properties:
        deletionRequestedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - DELETION_REQUESTED
      required:
      - deletionRequestedAt
      - status
    AiMeta:
      type: object
      properties:
        guardActions:
          type: array
          items:
            $ref: "#/components/schemas/GuardActionView"
        model:
          type: string
        promptVersion:
          type: string
      required:
      - guardActions
      - model
      - promptVersion
    AiUsageView:
      type: object
      properties:
        dailyCallLimit:
          type: integer
          format: int32
        monthCostUsd:
          type: string
        monthlyBudgetUsd:
          type: string
        todayCalls:
          type: integer
          format: int32
      required:
      - dailyCallLimit
      - monthCostUsd
      - monthlyBudgetUsd
      - todayCalls
    AxisLevels:
      type: object
      properties:
        debugging:
          type: integer
          format: int32
        explanation:
          type: integer
          format: int32
        implementation:
          type: integer
          format: int32
        knowledge:
          type: integer
          format: int32
      required:
      - debugging
      - explanation
      - implementation
      - knowledge
    BudgetView:
      type: object
      properties:
        completionRateBp:
          type: integer
          format: int32
        effectiveBudgetMinutes:
          type: integer
          format: int32
        horizonDate:
          type: string
          format: date
        nominalBudgetMinutes:
          type: integer
          format: int32
        planId:
          type: string
          format: uuid
        ratioBp:
          type: integer
          format: int32
        requiredMustMinutes:
          type: integer
          format: int32
        requiredShouldMinutes:
          type: integer
          format: int32
        riskLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        today:
          type: string
          format: date
      required:
      - completionRateBp
      - effectiveBudgetMinutes
      - horizonDate
      - nominalBudgetMinutes
      - planId
      - ratioBp
      - requiredMustMinutes
      - requiredShouldMinutes
      - riskLevel
      - today
    CursorPagePlanSummaryView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanSummaryView"
        nextCursor:
          type: string
      required:
      - items
      - nextCursor
    CursorPageSessionView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionView"
        nextCursor:
          type: string
      required:
      - items
      - nextCursor
    CursorPageSideProjectView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SideProjectView"
        nextCursor:
          type: string
      required:
      - items
      - nextCursor
    DashboardView:
      type: object
      properties:
        aiStatus:
          type: string
          enum:
          - ENABLED
          - BUDGET_WARNING
          - BALANCE_EXHAUSTED
          - DISABLED
        dueReviewCount:
          type: integer
          format: int32
        milestoneTimeline:
          $ref: "#/components/schemas/MilestoneTimelineView"
        replanRecommended:
          type: boolean
        risk:
          $ref: "#/components/schemas/RiskSummaryView"
        skillCategories:
          type: array
          items:
            $ref: "#/components/schemas/SkillCategorySummaryView"
        today:
          type: string
          format: date
        todaySummary:
          $ref: "#/components/schemas/TodaySummaryView"
        weakThinkingAxes:
          type: array
          items:
            type: string
            enum:
            - CORRECTNESS
            - NULL_BOUNDARY
            - RESOURCE_LIFECYCLE
            - EXCEPTION_STRATEGY
            - SECURITY
            - PERFORMANCE
            - CONCURRENCY
            - OBSERVABILITY
            - MAINTAINABILITY
            - TRANSACTION_DATA_CONSISTENCY
        weekCompletedSessions:
          type: integer
          format: int32
        weekStartDate:
          type: string
          format: date
        weekStudyMinutes:
          type: integer
          format: int32
      required:
      - aiStatus
      - dueReviewCount
      - milestoneTimeline
      - replanRecommended
      - risk
      - skillCategories
      - today
      - todaySummary
      - weakThinkingAxes
      - weekCompletedSessions
      - weekStartDate
      - weekStudyMinutes
    DeferSuggestionView:
      type: object
      properties:
        practicalImportanceBp:
          type: integer
          format: int32
        priority:
          type: string
          enum:
          - MUST
          - SHOULD
          - LATER
        requiredMinutes:
          type: integer
          format: int32
        skill:
          $ref: "#/components/schemas/SkillRef"
      required:
      - practicalImportanceBp
      - priority
      - requiredMinutes
      - skill
    DiagnosticSuggestionView:
      type: object
      properties:
        category:
          type: string
          enum:
          - JAVA
          - SPRING
          - DATABASE
          - WEB_HTTP
          - NETWORK
          - CS
          - ALGORITHM
          - TESTING
          - DEVOPS
          - SECURITY
          - PRACTICAL_ENGINEERING
          - SYSTEM_DESIGN
          - EXPLANATION
        challengeId:
          type: string
          format: uuid
        difficulty:
          type: integer
          format: int32
        estimatedMinutes:
          type: integer
          format: int32
        selfAssessedLevel:
          type: integer
          format: int32
        skill:
          $ref: "#/components/schemas/SkillRef"
        title:
          type: string
      required:
      - category
      - challengeId
      - difficulty
      - estimatedMinutes
      - selfAssessedLevel
      - skill
      - title
    DueReviewItemView:
