openapi: 3.1.0
info:
  title: DevPilot API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/v1/challenge-attempts/{attemptId}:
    get:
      operationId: trainingGetAttempt
      parameters:
      - in: path
        name: attemptId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - training
  /api/v1/challenge-attempts/{attemptId}/abandon:
    post:
      operationId: trainingAbandonAttempt
      parameters:
      - in: path
        name: attemptId
        required: true
        schema:
